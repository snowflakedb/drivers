# Behavioral Differences between the new (universal) Node.js driver and the old (legacy) Node.js driver.
#
# Allowed statuses:
#  - unknown (default): status is not yet determined
#  - todo: BD has to be fixed
#  - fixed: BD has been addressed, removing the difference between the old and new driver;
#           once fixed, the entry must be removed from this file
#  - allowed: the change is expected and is accepted
#
# Allowed types:
#  - unknown (default): type is not yet determined
#  - api_incompatibility: the new driver removes support for a functionality
#  - bug: the new driver has a bug/incompatibility relative to the old driver
#  - bugfix: the new driver fixes incorrect old-driver behavior
#  - enhancement: the new driver extends or improves existing functionality
#
# Reviewed:
#  - true: the BD has been reviewed and its status is accepted
#  - false (default): the BD has not yet been reviewed
#
# status_rationale (required when reviewed is true):
#  Explain why this entry has the chosen 'status'. Type and behavior deltas alone often do not
#  imply whether we intend to ship the difference, regress compatibility, track a fix, etc.

behavior_differences:
  1:
    name: 'object_with_renamed_duplicated_columns row mode does not rename Column metadata'
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Duplicate column names are renamed on the rowtype metadata before Column objects are
      constructed (result.js:93-96), so Column.getName() and getColumn('NAME_2') reflect the
      rename.
    new_driver_behavior: |
      renameDuplicateColumnNames (column-names.ts) only produces row keys. RowStatement's
      getColumns()/getColumn() return core-owned Column metadata unchanged, so row.NAME_2 works
      identically in both drivers but column-name lookups by the renamed name do not. Disclosed
      in PR #1196's description as a scoped simplification; not fixed here because doing so
      requires wrapping/proxying core-owned Column objects, a larger change than that PR's scope.

  2:
    name: 'ConnectionOptions is not a properly typed interface'
    status: todo
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      index.d.ts types connection options as real fields (e.g. rowMode?: RowMode), so a
      TypeScript caller who typos a connection option gets a compile-time error.
    new_driver_behavior: |
      ConnectionOptions (index.ts) is Record<string, string> & { rowMode?: RowMode } -- rowMode
      is now typed to match the old driver, so a typo'd rowMode is caught at compile time same as
      legacy. Every other connection option is still an untyped string, so a typo there compiles
      fine and either fails at runtime (if the field is used) or silently passes through
      (if not). No runtime behavior differs for valid input on any option -- both drivers behave
      identically at runtime -- so this is a compile-time type-safety/DX gap, not an execution
      difference. Tracked inline via index.ts's pre-existing "TODO: implement ConnectionOptions
      like in old driver" comment.

  3:
    name: 'fetchResult now inherits the connection-level rowMode default'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      execute() inherits the connection-level rowMode default (createStatementPreExec falls back
      to connectionConfig.getRowMode(), statement.js:480), but fetchResult() does not
      (createStatementPostExec assigns statementOptions.rowMode directly with no fallback,
      statement.js:202) -- unset rowMode on fetchResult always resolves to object-shaped rows,
      regardless of the connection's configured rowMode.
    new_driver_behavior: |
      fetchResult() and execute() share the same precedence chain (statement rowMode > connection
      default > 'object'), so a connection configured with a non-default rowMode now gets
      consistent shaping from both methods. Legacy's asymmetry is treated as a bug here, not a
      contract worth preserving -- a connection-level rowMode setting silently being ignored by
      exactly one of two entry points is surprising behavior, not an intentional feature.

  4:
    name: 'Column.isObject/isArray/isMap return the correct value for each semi-structured column type (OBJECT/ARRAY/MAP)'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Old snowflake-sdk always returns false from Column.isObject()/isArray()/isMap() for an untyped
      semi-structured OBJECT/ARRAY/MAP column (e.g. OBJECT_CONSTRUCT(...) or a `::MAP(VARCHAR, VARCHAR)`
      cast without ENABLE_STRUCTURED_TYPES_IN_CLIENT_RESPONSE enabled on the backend), even though
      getType() reports "object"/"array"/"map" for that same column.
    new_driver_behavior: |
      The new driver derives isObject/isArray/isMap purely from the column type name that the server
      sends (distinct `object`/`array`/`map`), so these predicates return true for semi-structured
      columns. A `::MAP(K, V)` cast still comes back as `object` from the server and is surfaced as a
      plain JS object rather than a JS `Map`, but isObject() now correctly reflects the reported type.
    description: |
      In the old driver, SqlTypes.isObject/isArray/isMap require the server to send structured
      `fields` metadata for the column (they all check `fieldsMetadata != null`). For an untyped
      semi-structured column the server returns no `fields`, so these predicates return false while
      getType() still reports the semi-structured type. The new driver derives the predicates from
      the reported column type name and no longer consults `fields`.
    status_rationale: |
      The old driver's dependence on `fields` metadata for these predicates was a bug: it left
      isObject()/isArray()/isMap() false for the common semi-structured case. The new driver keys off
      the reported column type, which is correct for semi-structured columns. Structured-type support
      (typed OBJECT/ARRAY/MAP distinguished via `fields`, returning a real JS `Map` for MAP) is a
      separate initiative tracked in SNOW-3445814

  5:
    name: 'Column.isVariant ignores structured `fields` metadata'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Old snowflake-sdk returns true from Column.isVariant() for an untyped semi-structured
      OBJECT/ARRAY/MAP column (without ENABLE_STRUCTURED_TYPES_IN_CLIENT_RESPONSE enabled on the
      backend), and returns false once the column is a structured type. So for the same
      OBJECT/ARRAY/MAP column, isVariant() flips depending on whether structured types are enabled.
    new_driver_behavior: |
      The new driver classifies VARIANT/OBJECT/ARRAY/MAP as variant purely by the column type name,
      so isVariant() returns true for these columns regardless of whether structured types would be
      enabled. The structured-vs-semi-structured distinction the old driver drew for isVariant is
      not made.
    description: |
      In the old driver, SqlTypes.isVariant branches on whether the server sent structured `fields`
      metadata for the column: variant when `fields` is absent (semi-structured), non-variant when
      `fields` is present (structured). The new driver derives isVariant from the reported column
      type name alone and does not consult `fields`, so it no longer draws that distinction. This is
      consistent with the new driver only supporting semi-structured types today.
    status_rationale: |
      Not a public-facing behavior change: the structured-types code path was a work in progress in
      the old driver, and structured OBJECT/ARRAY/MAP columns are not produced without opting into
      ENABLE_STRUCTURED_TYPES_IN_CLIENT_RESPONSE. The new driver only supports semi-structured types
      today; full structured-type handling (including the `fields`-based isVariant distinction) is a
      separate initiative tracked in https://snowflakecomputing.atlassian.net/browse/SNOW-3445814.

  6:
    name: 'Column gains an isDecfloat() predicate with no old-driver equivalent'
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Old snowflake-sdk's Column has no isDecfloat() method at all -- DECFLOAT columns are only
      identifiable via getType() === 'decfloat'. Calling isDecfloat() on an old-driver Column
      throws a TypeError, it does not return false.
    new_driver_behavior: |
      Column.isDecfloat() is added, checking type_name == "decfloat" (column.rs), matching the
      pattern of every other is*() predicate. Purely additive: no existing method's behavior
      changes, and callers who never call isDecfloat() see no difference.
    status_rationale: |
      Closes the gap called out in BCR_LOG.md's "statement.getColumn() API" section ("decfloat is
      not covered by any is* method"). Since old driver has no equivalent method at all, tests that
      exercise this predicate branch on isRunningNewDriverWithBD('BD#6') rather than asserting a
      false/absent value for old driver.

  7:
    name: 'DECFLOAT above the documented exponent range loses its server-canonical spelling'
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Snowflake's DECFLOAT exponent range is -16383 to 16384, so a value needing a larger exponent
      comes back from the server with a digit shifted into the significand instead: `'1e16385'::DECFLOAT`
      is sent as `10e16384`. Server-side TO_VARCHAR returns the same, so that spelling is canonical,
      and the old driver reproduces it by returning the server text untouched.
    new_driver_behavior: |
      Returns `1e16385` -- equal in value, but not the string Snowflake produces. sf_core strips
      trailing zeros off the significand while parsing (chunks/json_parser.rs), which turns
      `10e16384` into `1e16385` before the Node bridge ever sees it.
    status_rationale: |
      Both spellings are mathematically equal; sf_core's normalization produces the more conventional
      form (a single leading significand digit) rather than preserving the source's shifted-digit
      quirk. This only affects values beyond the documented exponent range, an edge case with no
      identified caller dependency on the exact server spelling.

  8:
    name: 'BigInt-mode FIXED columns come back as a native bigint instead of a big-integer instance'
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When JS_TREAT_INTEGER_AS_BIGINT session parameter is enabled, a FIXED column with scale 0
      is wrapped in a `big-integer` library instance, not a native JS `bigint`. Callers must use
      that library's API (`.toString()`, `.equals()`, `BigInteger.isInstance()`) to work with the
      value.
    new_driver_behavior: |
      The same columns are now returned as native `bigint` primitives (cell-mapping.ts). Callers
      using `typeof value === 'bigint'` or bigint arithmetic/operators work correctly; callers
      relying on `big-integer`-specific methods or on the value being an `object` do not.
    status_rationale: |
      A deliberate modernization, not an oversight: native bigint has been a standard JS feature
      since ES2020, requires no dependency, and is what the `big-integer` package's own docs now
      point users toward (it describes itself as a thin polyfill wrapper over the native type).
      Flagged as breaking because code that special-cases `big-integer` instances, rather than
      treating the value as an opaque bigint, needs updating.

  9:
    name: 'FLOAT special values NaN/inf/-inf are all collapsed to NaN by the old driver'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Querying FLOAT special values (NaN, inf, -inf) does not work as documented; all three come
      back as NaN. The server spells infinity `inf` / `-inf`, but the old driver converts REAL
      cells with JavaScript's Number(), whose numeric grammar only accepts the spelling `Infinity`
      -- so `Number('inf')` and `Number('-inf')` both yield NaN, indistinguishable from a genuine
      NaN cell.
    new_driver_behavior: |
      Returns the real values: `inf` as `Infinity`, `-inf` as `-Infinity`, `NaN` as `NaN`.
    status_rationale: |
      Callers can now tell an overflow from a genuine NaN and recover its sign, which the old
      driver's collapse made impossible. This is a real, intentional behavior change: code that
      relied on comparing against NaN, or on isNaN() being true for an overflow, will now see
      infinities instead -- hence is_breaking_change: true, though the old behavior was itself the
      bug being fixed.

  10:
    name: 'snowflake.STRING/BOOLEAN/NUMBER/DATE/OBJECT/ARRAY/MAP/JSON module constants are dropped'
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The old driver exports module-level constants snowflake.STRING, .BOOLEAN, .NUMBER, .DATE,
      .OBJECT, .ARRAY, .MAP, and .JSON. They are undocumented (absent from index.d.ts) and there is
      no real use case for them: the values these constants hold do not match any of the values that
      Column.getType() returns, so they cannot be used to test a column's type.
    new_driver_behavior: |
      The new driver does not export these constants at all.
    status_rationale: |
      These were a leftover legacy constant that nobody removed from the old driver. They are
      undocumented and unusable (their values match no getType() result), so the new driver simply
      does not carry them over.

  11:
    name: 'connectAsync rejects on failure instead of delivering the error only via callback'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      connectAsync(callback) returns a Promise that still resolves on auth/connect failure; the
      error is delivered only through the optional callback. Callers who await the promise without
      a callback never see the error.
    new_driver_behavior: |
      connectAsync() takes no callback. On failure the returned Promise rejects (throws when
      awaited), so the error is observed via try/catch or .catch().
    description: |
      The old driver's connectAsync mixed callback and Promise error channels: some failures were
      passed to the callback while the Promise still resolved, and a TODO in the old driver parked
      making it throw until a 3.x breaking change. The new driver takes the 3.x shape — no callback
      parameter, Promise rejection on failure. .connect() is unaffected: it still routes success
      and failure through its callback on both drivers.

  12:
    name: 'BINARY columns come back as a plain Buffer without toStringSf/getFormat'
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      A BINARY column is returned as a Buffer that the old driver monkey-patches with own-property
      .toStringSf() and .getFormat() methods. Those methods are undocumented (absent from
      index.d.ts). .toStringSf() returns the value as uppercase hex or base64; .getFormat() returns
      that format name. Because the extra methods live on the instance, a deep equality check
      against a plain Buffer fails even when the bytes match.
    new_driver_behavior: |
      A BINARY column is returned as a plain Buffer with no extra methods. Callers convert with
      Buffer.toString('hex') / Buffer.toString('base64').
    description: |
      The old driver monkey-patches each Buffer instance in convertRawBinary (column.js) by assigning
      .toStringSf and .getFormat onto the object rather than subclassing Buffer or wrapping it. The
      extra methods were never part of the documented API, and Node already converts a Buffer to hex
      or base64, so there is no real use case for them. The new driver does not carry them over.

  13:
    name: 'RowStatement getColumn/getNumRows/getQueryId are typed as possibly undefined'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The old driver's TypeScript types declare getColumn(): Column, getNumRows(): number, and
      getQueryId(): string — none include undefined. At runtime all three can still return
      undefined: getColumn and getNumRows when no result is available yet, getQueryId when the
      query id is not yet known (its JSDoc even says so). Callers who type-check against the old
      .d.ts never see undefined, even though calling the functions can return it.
    new_driver_behavior: |
      The new driver types getColumn, getNumRows, and getQueryId as T | undefined. After a
      successful query they still return defined values, same as the old driver; TypeScript now
      requires handling undefined.
    description: |
      Status is unknown: investigate and decide among (1) keeping the honest T | undefined
      signatures (a TypeScript-visible API change), (2) matching the old driver's types, which
      hide a real undefined return, or (3) throwing when no result is available instead of
      returning undefined, so the signatures can honestly be T. Runtime after a completed query
      is the same on both drivers for (1) and (2); (3) would change pre-result calls from
      undefined to an error (a runtime break for callers who currently check for undefined). The
      new types come from mapping core FFI null to undefined. Tests that call getColumn() after
      execute use getRowStatementColumn (BD#13).

  14:
    name: "TIME column NULL returns real null, not the legacy driver's 'NULL' string"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      The legacy driver stringifies a NULL TIME cell to the literal 'NULL' by default
      (isRepresentNullAsStringNull=true, a process-global config knob), while every other
      type — including the legacy driver's own DATE — returns real null.
    new_driver_behavior: |
      The universal driver returns real null for every type uniformly.
    description: |
      A TIME-only anomaly in the legacy driver, not a contract. The universal driver returns
      real null. Verified live against both drivers.

  15:
    name: "Bare FF against a scale-0 TIME column no longer leaves a dangling '.'"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy driver's format engine emits a trailing literal '.' with no digits after it
      when a bare FF token is requested against a scale-0 TIME column
      (e.g. 'HH24:MI:SS.FF' -> '12:34:56.').
    new_driver_behavior: |
      The universal driver drops the digit-less fractional suffix entirely in this case.
    description: |
      A documented legacy formatting quirk, not a contract. Verified live against both drivers.

  16:
    name: "FFn against TIME renders only the column's real scale digits, not always n zero-padded digits"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      The legacy driver's FFn (digit-suffixed) token ignores the column's declared scale — it
      always renders exactly n digits, zero-padding past whatever precision the column actually
      stored (e.g. a TIME(0) column under 'HH24:MI:SS.FF9' renders '.000000000', a TIME(3)
      column renders '.123000000').
    new_driver_behavior: |
      The universal driver renders only min(n, scale) real digits and nothing invented.
    description: |
      The new driver consults the column's real scale. Verified live against both drivers.

  17:
    name: "fetchAsString: ['Number'] can spell a FLOAT differently than the server did"
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The server sends every FLOAT in the JSON response as text, and the old driver returns that
      text unchanged. The server writes an exponent for numbers under 0.0001 and for numbers from
      1e15 up, so `1e-5::FLOAT` arrives as `1e-05` and `1e15::FLOAT` as `1e+15`.
    new_driver_behavior: |
      There is no server text to return. The new driver reads results in Arrow format, where a FLOAT
      is always a 64-bit float and never text, so how it is written is the driver's decision. The
      string is built from the value with JavaScript's String(). JavaScript writes an exponent only
      under 1e-7 and from 1e21 up, so numbers in between look different: `1e-5::FLOAT` gives
      `0.00001` and `1e15::FLOAT` gives `1000000000000000`. Everything outside that range is the
      same in both drivers, including `1e+300`, `1e-300`, `inf`, `-inf` and `NaN`.
    status_rationale: |
      Both spellings mean the same number and read back as the same value, so nothing breaks, but a
      caller who asked for text does not get the same string as before. Matching it would mean
      copying the server's number formatting into the driver, which is separate work -- and with
      Arrow results there is no server string to copy, only a rule to imitate.

  18:
    name: "fetchAsString renders NULL as 'NULL' for every type"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Under fetchAsString a NULL cell becomes the string 'NULL' (representNullAsStringNull, on by
      default), but some types never reach that rule and stay null -- e.g. DECFLOAT and VARIANT.
    new_driver_behavior: |
      Every type fetched as a string renders NULL as 'NULL', with no exceptions.
    status_rationale: |
      One rule for every type is easier to rely on than a rule with exceptions, and the old
      driver's exceptions came from its internals rather than from a decision.

  19:
    name: 'Statements issued while a connect is in flight are refused rather than queued'
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      A connection whose login is still running is in its own connecting state, and requests
      reaching it are put on a queue and run once the login completes
      (StateConnecting.request -> enqueueRequest). The caller sees no error, and isUp() reports
      up, since a request there is taken rather than refused.
    new_driver_behavior: |
      A connection counts as never established until its connect resolves, so a statement issued
      in that window is refused with ClientError 407001, SQL state 08003, the same error a caller
      gets for never calling connect at all. isUp() reports down for the same window, because a
      connection that refuses statements is not usable.
    status_rationale: |
      The window is only reachable by starting a statement without awaiting connect, which no
      documented usage does. Queueing means holding operations and replaying them after login,
      which is its own feature rather than an error-mapping detail.

  20:
    name: 'isUp() keeps reporting up after a session renewal fails'
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      The driver renews the session token itself, so it sees the outcome. An expired master token,
      or a renewal that fails for any reason other than a network error, moves the connection to
      its disconnected state and isUp() answers false from then on
      (StateRenewing.enter -> transitionToDisconnected).
    new_driver_behavior: |
      The core renews tokens without reporting the outcome to the wrapper, so the connection stays
      marked connected and isUp() answers true even though the session is gone. The caller learns
      of it only when an operation fails.
    status_rationale: |
      The wrapper cannot observe a renewal it does not perform. The core tracks both is_closed and
      is_master_token_expired on the connection, but only behind async accessors, and isUp() is
      synchronous. Closing this needs a synchronous state read from the core.
