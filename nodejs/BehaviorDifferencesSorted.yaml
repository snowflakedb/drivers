# Snapshot of BehaviorDifferences.yaml, used to track which entries still need to go into CHANGELOG.md.
#
# - An entry is removed from this list when it is added to the changelog,
#   or when it doesn't belong in the changelog.
#   A status in original BehaviorDifferences.yaml should be updated to match.
# - The original BehaviorDifferences.yaml stays until tests run against both the new and the old driver.
# - The last entry included in this snapshot is 167.
behavior_differences:
  13:
    name: 'RowStatement getColumn/getNumRows/getQueryId/getSqlText are typed as possibly undefined'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The old driver's TypeScript types declare getColumn(): Column, getNumRows(): number,
      getQueryId(): string, and getSqlText(): string — none include undefined. At runtime all
      four can still return undefined: getColumn and getNumRows when no result is available yet
      or after execute fails, getQueryId when the query id is not yet known (its JSDoc even
      says so), and getSqlText when the statement was created by fetchResult without sqlText.
      Callers who type-check against the old .d.ts never see undefined, even though calling
      the functions can return it.
    new_driver_behavior: |
      The new driver types getColumn, getNumRows, getQueryId, and getSqlText as T | undefined.
      After a successful execute they still return defined values, same as the old driver;
      after a failed execute they return undefined on both drivers. TypeScript now requires
      handling undefined. fetchResult still returns undefined from getSqlText at runtime on
      both drivers.
    description: |
      Status is unknown: investigate and decide among (1) keeping the honest T | undefined
      signatures (a TypeScript-visible API change), (2) matching the old driver's types, which
      hide a real undefined return, or (3) throwing when no result is available instead of
      returning undefined, so the signatures can honestly be T. Runtime after a completed query
      is the same on both drivers for (1) and (2); (3) would change pre-result calls from
      undefined to an error (a runtime break for callers who currently check for undefined).
      getColumn/getNumRows/getQueryId map core FFI null to undefined; getSqlText is stored in
      the TypeScript wrapper and is unset when fetchResult does not receive sqlText. Tests that
      call getColumn() after execute use getRowStatementColumn (BD#13).

  30:
    name: 'PUT of a symlinked source reports the target basename'
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      The PUT result `target` uses the symlink's own name (e.g. `link.csv`).
    new_driver_behavior: |
      The PUT result `target` uses the real name of the object the symlink points to
      (e.g. `real.csv`), and the file is stored in the stage under that name.
    description: |
      Matches the Python (BD#81) and JDBC (BD#57) new-driver behavior for the same scenario.
      To investigate: this looks like a bug to fix, not a difference to keep. The stage file gets
      the target's name, so code that reads the file back by the name it uploaded no longer
      works. For example, when `link.csv` points to `real.csv`, after
      `PUT file:///data/link.csv @stage` the stage has `real.csv`, and
      `GET @stage/link.csv file:///out/` fails because the file does not exist.

  # Not ready for the changelog. On main the new driver has no precision-loss warning or
  # selecting_with_precision_loss telemetry at all, for any fetch mode. The BD#40 check in
  # numeric-precision-loss.test.ts passes only because nothing can emit the warning yet.
  # snowflakedb/drivers#2575 (open) adds the warning and telemetry on the Number path only,
  # so fetchAsString cells stay silent. After it merges, this entry describes real behavior.
  # https://github.com/snowflakedb/drivers/pull/2575
  40:
    name: 'fetchAsString Number does not emit a precision-loss warning or telemetry'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      A fixed numeric cell whose JS Number is an integer outside MAX_SAFE_INTEGER still logs a
      precision-loss warning and posts selecting_with_precision_loss telemetry when the cell
      is returned as a string via fetchAsString: ['Number'].
    new_driver_behavior: |
      The same cell is an exact digit string and produces neither the warning nor the
      telemetry event.
    description: |
      The warning tells the caller to fetch as a string or BigInt. The old driver still
      converts the cell to Number first, so the warning fires even when fetchAsString
      already returned the exact digits.

  46:
    name: 'RequestFailedError is not implemented'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Any request to Snowflake (login, query, query status, abort, and others) that gets
      an HTTP status other than 200 rejects with RequestFailedError, code 401002, and
      message `Request to Snowflake failed.` Retryable statuses (5xx, 429) are retried
      first. err.response holds the HTTP response, so callers can read
      err.response.statusCode.
      A 401 whose body has code 390104 uses code 401004 and message
      `Request to Snowflake failed.  Invalid token`.
      No HTTP response at all is NetworkError 401001. A 200 with `success: false` is
      OperationFailedError.
    new_driver_behavior: |
      The same failures reject with a plain Error. code is undefined and there is no
      response field:
      - A retryable status (5xx, 408, 429, 307, 308), after the last retry: message
        `HTTP request failed after retries: <operation>`, for example
        `... query status`. cause.message is
        `max attempts (N) reached; last status 500 Internal Server Error`.
      - Any other 4xx: message `Invalid Snowflake response`. cause.message is
        `Snowflake responded with error status: 400 Bad Request, message: ...`.
      - A 401 refreshes the session and retries the request. If the refresh fails,
        the error comes from the session refresh. No test checks this case yet.
      The HTTP status appears only in the cause text. NetworkError 401001 is the same
      as in the old driver. ErrorCode.ERR_SF_RESPONSE_FAILURE is still exported, but
      nothing throws it.
    description: |
      Status is unknown: this needs more investigation before a decision.
      Without RequestFailedError, a failed request looks the same as other errors with
      no name or code (invalid argument, row decode), so callers can only match the
      message text. They also cannot write "retry on 5xx or 429" logic, because the
      status is not a field.
      The first reason given for this difference, fewer custom error types, does not
      fit well. The bridge already keeps NetworkError 401001 and LargeResultSetError
      402002, and RequestFailedError is an existing type that callers check for.
      To check before deciding:
      - Map the core errors that carry a Snowflake HTTP status to RequestFailedError
        401002 in nodejs_bridge/src/error.rs: RestError::HttpRetry with
        HttpError::MaxAttempts, InvalidSnowflakeResponse with
        SnowflakeResponseError::ResponseStatus, SessionRefresh, and TokenRequestHttp.
        InvalidSnowflakeResponse also wraps bodies the core cannot parse. Those are
        not failed requests and stay out.
      - Decide what err.response holds. The old driver attaches the whole response.
        The body can contain sensitive data, so { statusCode } may be enough.
      - Decide what to do with retries that end on time (HttpError::DeadlineExceeded,
        RetryAfterExceeded). These carry no status.
      - Check what a failed session refresh after a 401 shows, and whether 401004 is
        needed.
      A server that rejects an abort is covered by BD#116, not by this entry.

  59:
    name: 'browserActionTimeout still accepted (ms) but bounds core authentication_timeout'
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      browserActionTimeout is milliseconds. Default 120000. createConnection accepts
      a positive integer only. 0, a negative value, and a fraction throw
      InvalidParameterError 404040: "Invalid browser timeout value. The specified
      value must be a positive number."
      The timer covers the local MFA/SSO or OAuth authorization-code loopback wait.
      For EXTERNALBROWSER it starts when the SSO URL is handed to the browser. The
      authenticator-request before that is not included. Native Okta and the OAuth
      token exchange after the redirect are not included.
      Timeout: "Error while getting SAML token: Browser action timed out after <n> ms."
    new_driver_behavior: |
      browserActionTimeout is a finite number of milliseconds, including 0 and a
      negative value such as -1. Divide by 1000 and round down. 1500 ms is 1 second.
      120000 ms is 120 seconds. 1700 ms is 1 second, 12500 ms is 12 seconds, and
      314200 ms is 314 seconds. A positive value that rounds down to 0 stays 1
      second: 1 ms, 1.5 ms, and 999 ms. 0 stays 0 seconds. That budget is already
      gone. Negatives round down too: -1 ms is -1 seconds, -1500 ms is -2 seconds.
      A negative number of seconds is accepted. The budget used is the 120 second
      default.
      A non-number or a non-finite value fails with "Expected type Int for parameter
      'browserActionTimeout'".
      The budget covers native Okta and the OAuth authorization-code flow from start
      to finish, not only the browser wait. For EXTERNALBROWSER the clock starts
      before the authenticator-request. A slow SSO round trip leaves less time for
      the browser callback. Timeout: "Failed to login: External browser SSO failed:
      Authentication timeout exceeded (budget <n>s)". No error.code.

  71:
    name: 'deserializeConnection either restores the session or throws 408003'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      The error depends on where the payload is wrong:
      - No payload throws InvalidParameterError 408001. A payload that is not a string throws
        InvalidParameterError 408002.
      - A string that is not JSON, or JSON that is not an object, throws
        InvalidParameterError 408003.
      - A JSON object without `services.sf`, or with a tokenInfo that is not an object, throws
        InternalAssertError 400001. `'{}'` is one such payload.
      The values inside a tokenInfo object are not checked:
      - When any of `sessionToken`, `masterToken`, `sessionTokenExpirationTime` or
        `masterTokenExpirationTime` is missing, the connection starts disconnected. This
        includes the empty tokenInfo that serialize() writes for a connection that never
        connected or was destroyed.
      - When all four are present, the connection starts connected, even if the tokens are
        empty strings or numbers. The first request then fails with a server error.
    new_driver_behavior: |
      Every payload that cannot restore a session throws InvalidParameterError 408003.
      The payload must have a tokenInfo object with `sessionToken` and `masterToken` as
      non-empty strings. The expiration times are optional, but must be numbers when present.
      A payload with both tokens and no expiration times is restored (BD#84 writes such
      payloads). A value that `JSON.parse` converts to a valid payload string (for example a
      Buffer with the payload) is accepted.
    description: |
      A disconnected connection is not a useful result of deserializeConnection. It has no
      session, so it is the same as createConnection with the same options. Returning it hides
      a payload that is broken, or one serialized after the session ended. The error appears
      at once instead of on the first request.

      The TypeScript signature only accepts a string. The driver does not check the type at
      runtime and reports every payload it cannot read with one error code.

      We probably want to remove error code completely and throw a plain Error instead.

      InvalidParameterError probably should never have error codes.

  72:
    name: 'First use of a logged-out serialized session returns GS 390111'
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      deserializeConnection still constructs. The first request finds the session gone, moves
      the connection to disconnected, and answers ClientError 407002 / SQLSTATE 08003 /
      isFatal.
    new_driver_behavior: |
      The first request returns OperationFailedError with the server's GS 390111
      (Session no longer exists). The driver does not rewrite that into 407002.

  74:
    name: 'wrong private-key passphrase error message'
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      createPrivateKey throws the OpenSSL wrong-passphrase error.
      OpenSSL 3.0 reports `error:1C800064:Provider routines::bad decrypt`.
      OpenSSL 3.5 reports `error:1E08010C:DECODER routines::unsupported`.
    new_driver_behavior: |
      connect rejects with `Failed to login: Authentication failed`. The
      passphrase detail stays on an intermediate error the Node binding does
      not put on Error.message.
    description: |
      The error needs to be improved in core. The core knows the key could not be
      decrypted, but its `Authentication failed` error does not include that cause
      in its message. So the user gets no hint that the passphrase is wrong.

  78:
    name: 'privateKey or privateKeyPath without authenticator infers SNOWFLAKE_JWT'
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Omitting authenticator while supplying privateKey or privateKeyPath still
      treats the connection as password auth. createConnection throws
      `A password must be specified.`
    new_driver_behavior: |
      The same options set AUTHENTICATOR to SNOWFLAKE_JWT. Login succeeds when
      the key is valid.
    description: |
      Issue: there is no way to keep password login while a key is set.
      - With a `password` and a key but no authenticator, the old driver logs in with the
        password and ignores the key. The new driver logs in with the key.
      - Setting `authenticator: 'SNOWFLAKE'` does not help. sf_core rejects the basic
        authenticator together with `private_key` or `private_key_file`: "Cannot specify basic
        authenticator together with private key parameters; use 'SNOWFLAKE_JWT' or remove the
        private key parameters".
      - So code that sets `authenticator: 'SNOWFLAKE'`, a `password` and a key connects with
        the old driver and fails at connect with the new one. The only way to keep password
        login is to remove the key options.

  80:
    name: 'A query fails with NetworkError when the session renewal it triggered cannot reach Snowflake'
    status: todo
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When a query gets GS 390112 (session token expired), the driver queues it and renews the
      token. If the renewal request fails with a NetworkError, the driver goes back to the
      connected state and re-sends the queued query with the old token
      (StateRenewing.enter -> transitionToConnected, drainOperationQueue). The renewal error never
      reaches the caller; the query fails only if its own re-send fails, and after a short
      network blip it usually succeeds on a later renewal. Nothing caps the cycle: if queries
      reach the server and renewals do not, it renews and re-sends indefinitely.
    new_driver_behavior: |
      The query rejects with NetworkError 401001, the root cause on `cause`. The core makes one
      renewal request without retrying it and does not re-send the query. The connection stays
      up (isUp() is true, see BD#20), so the next query renews again.
    status_rationale: |
      This looks like a serious oversight in sf_core that needs to be fixed. The RENEW request
      (refresh_session and token_request in sf_core/src/rest/snowflake/mod.rs) is sent once with
      client.execute. Queries, logout and async polling go through execute_with_retry. So a
      network problem of a second or two exactly when the session token expires fails the query,
      even though a retry would have renewed the session.
      A fix would send RENEW through a short, bounded retry policy:
      - retry only on network errors, 429 and 5xx;
      - reuse the same requestId on each attempt;
      - keep the total time short, because the token write lock is held while renewing and
        blocks every other query on the connection.
      Open question: whether Snowflake accepts a repeated RENEW when the first one succeeded but
      its response was lost.
    description: |
      Re-sending a query after a failed renewal is a core retry policy rather than an
      error-mapping detail. The difference shows only when a renewal coincides with a network
      failure; during a longer outage both drivers end with NetworkError.

  85:
    name: 'deserializeConnection without account and host throws InvalidParameterError with no code'
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      deserializeConnection with neither `account` nor `host` throws MissingParameterError
      404007 ("An account must be specified.").
    new_driver_behavior: |
      The same call throws InvalidParameterError with no `code`. The message lists both missing
      parameters: "Configuration error: Configuration validation failed (2 issue(s)): account:
      Missing required parameter 'account'; host: Missing required parameter 'host' (or
      'server_url')".
    description: |
      Both drivers throw before any request is sent. Both drivers accept `host` without
      `account`, or `account` without `host`, and restore the session.
      serialize() and deserializeConnection() may later be replaced by the child-session API.

  87:
    name: 'account validation differs from the old driver'
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      createConnection checks account before connect.
      - Missing: with no account, host, or accessUrl, throws MissingParameterError 404007
        ("An account must be specified."). When host is set and account is omitted, the
        account is copied from the host and createConnection does not throw.
      - Empty: throws InvalidParameterError 404045 ("Invalid account. The specified value
        must be a valid subdomain string.").
      - Non-string: throws InvalidParameterError 404008 ("Invalid account. The specified
        value must be a string.").
      - Other values: must match /^\w+([.-]\w+)*$/i. A "." or "-" cannot start or end the
        value, and separators cannot repeat. A failure is the same 404045 as an empty string.
    new_driver_behavior: |
      account is typed as string on ConnectionOptions. createConnection accepts the value.
      connectAsync fails in core.
      - Missing: a non-empty account is required even when host is set. connectAsync fails
        with "Missing required parameter 'account'".
      - Empty: the same missing-account error as above.
      - Non-string: rejected by the TypeScript type. There is no runtime 404008.
      - Other values: each character must be an ASCII letter, digit, ".", "-", or "_".
        A leading or trailing separator and repeated separators ("--", "..") are allowed.
        Any other character fails connectAsync.

  88:
    name: 'accessUrl does not fill account'
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      createConnection with accessUrl "https://access-url.snowflakecomputing.com" and no
      account sets account to "access-url". createConnection does not throw.
    new_driver_behavior: |
      accessUrl does not fill account. account is required. With accessUrl and no
      account, connectAsync fails with "Missing required parameter 'account'". The
      error name is "InvalidParameterError" and code is undefined (BD#101).

  89:
    name: 'a non-URL accessUrl is not rejected at createConnection'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      createConnection rejects "not-a-url" and "" with InvalidParameterError 404010
      before connect. A non-string gets the same error.
    new_driver_behavior: |
      createConnection accepts "not-a-url" and "". The driver does not validate the
      string. connectAsync fails with NetworkError 401001 ("Network error. Could not
      reach Snowflake.") because the login request cannot reach that URL.
    status_rationale: If possible the validation should be done by the server.

  90:
    name: 'sfRetryMaxLoginRetries is not accepted; the new driver has no login-retry count option'
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      `sfRetryMaxLoginRetries` is an accepted connection option (default 7). A value of 0
      disables login retries so the first network/login failure is returned immediately.
    new_driver_behavior: |
      `sfRetryMaxLoginRetries` is rejected as an unknown connection option. There is no
      equivalent login-retry count option.
    status_rationale: |
      The option is deprecated and is not carried into the new driver. Callers that relied on
      a configurable login-retry count must use the new driver's timeout model instead.

  91:
    name: 'retryTimeout maps to login_timeout with a different default, scope, and invalid-value error'
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      retryTimeout is seconds and defaults to 300 when omitted. 0 means unlimited.
      Any other finite number is raised to at least 300 seconds, so -1 and 2 both
      become 300 and 400 stays 400. It bounds login-request
      retries and Okta reauthentication during connect. A value that is not a
      number is rejected in createConnection. The check passes
      ERR_CONN_CREATE_INVALID_MAX_RETRY_TIMEOUT, which is not a defined code
      (the message table has ERR_CONN_CREATE_INVALID_RETRY_TIMEOUT = 404044).
      The thrown error is InvalidParameterError, its message is the string
      "undefined", and it has no code.
    new_driver_behavior: |
      Omitted, login gives up after 120 seconds. 0 and any negative value, e.g. -1,
      mean login has no deadline. A positive integer is used as the number of
      seconds given, so 2 stays 2 and 400 stays 400. A non-integer fails configuration
      validation: "Expected type Int for parameter 'retryTimeout'". The deadline
      covers the whole login, including retries, rather than one request.

  92:
    name: 'Custom credential manager failures do not fail authentication'
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      A custom credential manager method that throws, rejects its Promise, or never settles
      prevents the connection attempt from completing successfully.
    new_driver_behavior: |
      A method that throws or rejects is treated as a cache miss or a failed best-effort cache
      update, so authentication can continue. A Promise that does not settle within 30 seconds
      is treated as a failed cache operation.
    description: |
      The shared token-cache contract treats credential persistence as best effort so a storage
      problem does not prevent authentication. The timeout also prevents an unresolved callback
      from permanently occupying a runtime blocking thread.

  93:
    name: 'Custom credential manager receives cross-driver cache keys'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Callback keys hash the old driver's raw `snowflakeHost` and `oauthIdpUrl` field names and
      values.
    new_driver_behavior: |
      Callback keys use the normalized cross-driver token-cache format, so their hashes differ
      from old-driver keys even though both use the `SnowflakeTokenCache.v2` prefix.
    description: |
      A custom manager that retains tokens across a driver upgrade does not find entries written
      under the old hash and reauthenticates once before storing the token under the new key.

  94:
    name: 'Unusable default credential store does not fail connect'
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With no custom credential manager and token caching enabled, connect() fails when the
      default JSON credential store has no usable cache directory ("Temporary credential cache
      directory is invalid...").
    new_driver_behavior: |
      With no custom credential manager, a default credential store that cannot be initialized
      is logged as a warning on each cache operation, and login continues without the cache.
    description: |
      The default store is initialized on first use rather than at connect, so its failure is
      handled like any other best-effort cache failure.

  101:
    name: 'Missing or invalid connection settings reject connect() with InvalidParameterError and no code'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      createConnection throws as soon as a required setting is missing or a value is
      invalid. A missing setting is MissingParameterError with a 404xxx code (404007
      "An account must be specified.", 404003 "A user name must be specified."). An
      invalid value is InvalidParameterError with a 404xxx code.
    new_driver_behavior: |
      createConnection accepts the options. connect() and connectAsync() reject with
      InvalidParameterError, `error.code` undefined, and a message that lists every
      failing setting, for example "Configuration error: Configuration validation failed
      (1 issue(s)): user: Missing required parameter 'user'". There is no
      MissingParameterError. Unknown options still throw from createConnection (BD#102).
    description: |
      Settings are validated once, by the core, when the connection logs in. Repeating
      that validation in createConnection would keep a second copy of the rules in the
      wrapper.

  102:
    name: 'Unknown connection options are rejected with InvalidParameterError'
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      createConnection ignores an option it does not know. With validateDefaultParameters
      set it also logs "'<key>' is an unknown connection parameter. Did you mean '<name>'?".
    new_driver_behavior: |
      createConnection throws InvalidParameterError "Unknown connection option: <key>",
      `error.code` undefined. This includes old-driver options the new driver does not
      support: clientConfigFile (BD#159), clientRequestMFAToken (BD#117), disableConsoleLogin
      (BD#63), forceStageBindError, gcsUseDownscopedCredential, includeRetryReason,
      oauthChallengeMethod, oauthHttpAllowed (BD#141), region (BD#160), resultPrefetch,
      serviceName (BD#158), sfRetryMaxLoginRetries (BD#90) and validateDefaultParameters.
    description: |
      An option that is silently ignored leaves the application believing it took effect,
      so the new driver fails instead.

  106:
    name: 'WIF validation and OIDC-impersonation error messages use snake_case core wording'
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Missing and invalid workloadIdentityProvider share one error:
      `Invalid authenticator: WORKLOAD_IDENTITY parameters. workloadIdentityProvider must be one of: AWS, AZURE, GCP, OIDC`.
      OIDC without a token reports `workloadIdentityProvider: OIDC requires token in connection options`.
      OIDC with an impersonation path reports `workloadIdentityImpersonationPath for OIDC is not supported`.
    new_driver_behavior: |
      Missing provider reports `missing required parameter` citing `workload_identity_provider`.
      An invalid provider reports `invalid workload_identity_provider` and `allowed values`.
      OIDC without a token reports a missing required `token` parameter.
      OIDC with an impersonation path reports `workload_identity_impersonation_path` is
      `only supported for gcp, aws, and azure`.
    status_rationale: |
      TODO(SNOW-4232907): report these names in the invoking wrapper's dialect.
      Core accepts the Node camelCase aliases, then these messages cite the
      canonical snake_case keys.

  121:
    name: 'credentialCacheDir is not a connection option; the system keyring is used when present'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      credentialCacheDir selects the first directory for the JSON credential
      file on every platform. The file is the credential store.
    new_driver_behavior: |
      credentialCacheDir is not accepted. createConnection throws
      InvalidParameterError "Unknown connection option: credentialCacheDir".
      Tokens are stored in the system keyring when that store keeps credentials
      until they are deleted (macOS, Windows, and Linux with a keyring). The
      JSON file is used only when no such keyring is available. Its directory
      comes from SF_TEMPORARY_CREDENTIAL_CACHE_DIR when that variable names an
      existing directory, then the usual platform cache locations.

  112:
    name: 'Uppercase proxy environment variables win over lowercase ones'
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When both upper and lowercase environment variable are set, the lowercase one is used:
      - `http_proxy` wins over `HTTP_PROXY`.
      - `https_proxy` wins over `HTTPS_PROXY`.
      - `no_proxy` wins over `NO_PROXY`.
    new_driver_behavior: |
      When both upper and lowercase environment variable are set, the uppercase one is used:
      - `HTTP_PROXY` wins over `http_proxy`.
      - `HTTPS_PROXY` wins over `https_proxy`.
      - `NO_PROXY` wins over `no_proxy`.
    status_rationale: |
      Every new driver uses the same HTTP client, and that client prefers the
      uppercase variable. Preferring the uppercase name is the more logical choice.

  113:
    name: 'NO_PROXY matching follows the HTTP client rules, not shell globs'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      - Entries are separated by commas or `|`.
      - `*` is a glob, and a leading `.` matches any prefix.
      - A bare domain matches only that host, not a subdomain.
      - `*.snowflakecomputing.com`, `account.*.com`, and `acc*.*.com` match, including inside a comma list or `localhost|account.*.com`.
    new_driver_behavior: |
      - Entries are separated by commas. `|` is not a separator.
      - `*` is a wildcard only when the whole entry is `*`.
      - A bare domain matches that domain and its subdomains, so `snowflakecomputing.com` bypasses `account.snowflakecomputing.com`.
      - `*.snowflakecomputing.com`, `account.*.com`, and `acc*.*.com` do not match, so the login is still sent through the proxy.

  116:
    name: 'statement.cancel() does not report the abort result'
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      `statement.cancel()` sends the abort request and calls back when that abort request finishes.
      An abort rejected by server fails `cancel()` with "RequestFailedError 401002".
      `execute()` finishes when its own query request finishes on the server, and if the abort succeeded it returns with "SQL execution canceled".
      On a query that already finished, `cancel()` fails with 000605 ("Identified SQL statement is not currently executing."), SQLSTATE 01000.
    new_driver_behavior: |
      `statement.cancel()` returns immediately and does not report the abort result.
      An abort rejected by the server is ignored, whether `execute()` is still running or the statement already has a query id.
      While `execute()` is still running, it waits for the abort and then fails with "SQL execution canceled".
      When that abort is rejected or never answered, `execute()` still fails with 000604, but the query may keep running on the server; the old driver's `execute()` keeps waiting for the real result instead.
      With `asyncExec`, once the query id is back, `execute()` has already succeeded.
      `cancel()` does not change that result.
      On a query that already finished, `cancel()` succeeds and the statement result stays as it is. The 000605 response is ignored like any other.
    description: |
      When this is fixed, 000605 should stay a success. The query already finished, so there
      is nothing to cancel and the error does not help the user.
    status_rationale: |
      This is a serious bug. The Go driver had the same bug and it had to be fixed there.
      Users must know when an abort fails. Otherwise a long-running query keeps running on
      the server without their knowledge, and they lose money on warehouse time.

  122:
    name: 'timeout has seconds granularity, no default, and accepts 0 and negative values'
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      1. timeout is milliseconds and is honored exactly, including fractions.
      2. It defaults to 90000.
      3. 0, negative, and non-integer values are rejected in createConnection.
      It applies to every request the driver sends, including login and query requests, and each
      retry attempt gets a fresh timeout.
    new_driver_behavior: |
      1. timeout is accepted in milliseconds and rounded down to whole seconds; a positive value
         under 1000 becomes 1 second, so 1500 waits 1 second.
      2. Omitted, login attempts time out after 30 seconds and other requests have no per-request
         timeout.
      3. 0 and negative values behave like an omitted timeout. A non-numeric value fails with
         "Expected type Int for parameter 'timeout'".
      It applies to each attempt of login, query, and other requests.

  124:
    name: 'toCoreConnectionOptions stringifies null'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      password null is treated as absent. createConnection throws
      MissingParameterError 404005 ("A password must be specified.").
    new_driver_behavior: |
      toCoreConnectionOptions skips only undefined and then calls String(value), so
      null becomes "null". That string is sent as the password, and login fails with
      OperationFailedError, code "390100", and a message containing "Incorrect
      username or password was specified."
    description: |
      should reject a null password branches on this entry. The same null fails
      at createConnection on the old driver and at login on the new driver.
      This test does not assert sqlState.

  130:
    name: 'LargeResultSetError has the HTTP status on cause instead of the raw response object'
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When cloud storage answers a result chunk download with an error status after retries,
      the query fails with LargeResultSetError 402002 "Request to S3/Blob failed." and the
      axios response object on `response` (status, headers, body). There is no `cause`.
    new_driver_behavior: |
      The query fails with LargeResultSetError 402002 "Request to S3/Blob failed." without a
      `response` property. The HTTP status, for example "HTTP status 404 Not Found", is on
      `cause`. Name, code and message match the old driver.
    description: |
      Chunks are downloaded by the Rust core, which does not hand the HTTP response to Node.
      The status is the part of that response that tells the application what went wrong.

      The public types changed too, for every error, not only this one:
      - The old `index.d.ts` declares `data`, `response`, `responseBody` and `externalize()` on
        `SnowflakeError`. The new `SnowflakeError` type declares only `code`, `sqlState` and
        `isFatal`.
      - The `SnowflakeErrorExternal` type, returned by `externalize()`, no longer exists.
      - TypeScript code that reads `err.response` or calls `err.externalize()` no longer
        compiles.

  131:
    name: 'An expired result chunk URL fails the query instead of being refreshed'
    status: todo
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When cloud storage answers a result chunk download with 403, typically because the
      presigned chunk URL expired while the application read the result slowly, the driver
      retries the download and then fetches the query result again for fresh chunk URLs and
      continues reading. It does this up to 3 times per result stream
      (resultStreamInterrupts).
    new_driver_behavior: |
      The query fails at once with LargeResultSetError 402002 "Request to S3/Blob failed.",
      with "HTTP status 403 Forbidden" on `cause`. Chunk URLs are not refreshed.
    status_rationale: |
      Needs a core change: on 403 from a chunk URL, fetch the query result again for fresh
      chunk URLs and resume from the failed chunk. Tracked under SNOW-4334869.

  135:
    name: 'HTTP connect phase times out after 60 seconds'
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      There is no separate connect timeout. The request timeout (default 360000 ms, or
      the timeout option) covers the whole request, including the connect.
    new_driver_behavior: |
      connect_timeout defaults to 60 seconds and bounds each HTTP connect (name lookup,
      TCP handshake, and TLS). 0 leaves the connect phase without a driver timer.
    description: |
      The new driver uses the 60-second connect default of the old JDBC and Python
      drivers. A connect that takes longer than 60 seconds fails here; the old driver
      waits up to its request timeout.

  137:
    name: 'HTTP attempts time out after 300 seconds by default'
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Each HTTP request uses axios timeout (default 360000 ms, or the timeout option)
      as an idle socket timer covering the whole request.
    new_driver_behavior: |
      retry_timeout defaults to 300 seconds and bounds each HTTP attempt from start
      until the response body finishes. 0 removes the per-attempt limit. Result chunk
      downloads do not use this policy.
    description: |
      The new driver applies a 300-second wall-clock cap per HTTP attempt, matching
      the old JDBC socket default. A request that stays active longer than 300 seconds
      fails here; the old driver waited up to its 360-second request timeout. The Node
      timeout option still maps to retry_timeout.

  139:
    name: 'AWS WIF defaults to us-east-1 when region discovery fails'
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Without AWS_REGION, a failure to read the region from EC2 metadata rejects
      WIF authentication with the metadata error.
    new_driver_behavior: |
      Region resolution checks AWS_REGION, AWS_DEFAULT_REGION, and EC2 metadata.
      AWS_EC2_METADATA_SERVICE_ENDPOINT overrides the metadata address. If none
      provides a region, authentication continues with us-east-1.
    status_rationale: |
      SNOW-4356822 resolves this: fail authentication when region discovery
      finds nothing, instead of continuing with us-east-1.

  144:
    name: 'A successful single-use refresh that omits the refresh token deletes the cached one'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      With `oauthEnableSingleUseRefreshTokens` true, a refresh grant that succeeds
      without a `refresh_token` field leaves the previously cached refresh token in
      place. The old driver removes that cache entry only when the refresh request throws.
    new_driver_behavior: |
      The same response deletes the cached refresh token. Both drivers still log in
      with the new access token.
    description: |
      Single-use refresh tokens are consumed by the IdP. The new driver drops the
      cached copy when the refresh response does not replace it. The old driver
      keeps that copy until a later refresh fails.

  145:
    name: 'The precision-loss warning names the query id and column index instead of the value'
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The precision-loss warning names the value ("... when converting 9007199254740995 to a
      JavaScript Number.") and does not name the query id.
    new_driver_behavior: |
      The warning starts with "Query <query ID>: " and names the zero-based column index instead
      of the value ("... when converting a value in column at index 0 to a JavaScript Number.").
    description: |
      Cell values are customer data, which the driver does not log.

  146:
    name: 'A native Okta token URL on another origin fails with an origin error, and authenticator-request follows host'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      After Snowflake returns token and SSO URLs, a token URL whose scheme or host
      differs from the Okta authenticator fails as Error with no own code property.
      The message is "The prefix of the SSO/token URL and the specified authenticator
      do not match." https://host and https://host:443 match. authenticator-request
      ignores the host option and goes to https://{account}.snowflakecomputing.com
      when region is unset, or https://{account}.{region}.snowflakecomputing.com
      otherwise.
    new_driver_behavior: |
      The same token URL fails as Error with code undefined. The message is
      "Failed to login: Native Okta SSO failed: IdP URL safety validation failed:
      returned <url> does not match configured Okta URL <url>". https://host and
      https://host:443 match. authenticator-request is
      POST {protocol}://{host}:{port}/session/authenticator-request. A connection
      with protocol http, host localhost, and port 443 calls
      http://localhost:443/session/authenticator-request.
    description: |
      The old error text says "prefix". The old check is protocol and host.
      URL.host includes an explicit port and omits the default port. The new
      check is the URL origin. An explicit default port matches an omitted one.

  147:
    name: 'An unparseable native Okta token URL fails as a redacted parse error'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      A token URL that is not a URL, such as "abcd", fails as Error with no own code
      property. The message is "Authenticator, SSO, or token URL is invalid."
    new_driver_behavior: |
      The same value fails as Error with code undefined. The message is "Failed to
      login: Native Okta SSO failed: Failed to parse URL (<unknown>)". The raw
      string is not included.

  148:
    name: 'Native Okta SAML HTML with no form fails as a missing postback'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      SAML HTML with no form action has no separate "no form" error. The failure
      is Error with no own code property and message "The specified authenticator
      and destination URL in the SAML assertion do not match: expected:
      {protocol}://{host}:{port} postback: {extracted}". HTML with no form yields
      a postback such as "<html><".
    new_driver_behavior: |
      The same HTML fails as Error with code undefined and message "Failed to login:
      Native Okta SSO failed: Failed to extract SAML postback (form action) from
      HTML". No login request is sent.
    description: |
      The old driver still produces a postback string from that HTML and runs the
      same destination check as BD#149. The new driver stops when the form action
      is missing.

  149:
    name: 'A native Okta SAML postback on another host fails with a destination error'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      A form action on another host, such as https://attacker.snowflake.com/fed/login,
      fails as Error with no own code property. The message is "The specified
      authenticator and destination URL in the SAML assertion do not match:
      expected: {protocol}://{host}:{port} postback: {url}". The message prints
      both URLs in full. No login request is sent.
    new_driver_behavior: |
      The same form fails as Error with code undefined and message "Failed to login:
      Native Okta SSO failed: SAML postback destination validation failed: postback
      <url> does not match Snowflake server <url>". A postback that differs only
      by the default port matches. No login request is sent.
    # TODO(SNOW-4392811): decide whether the old driver's prefix postback check
    # should be replaced by the URL-origin check. The ticket has the details.
    description: |
      disableSamlURLCheck true skips this check on both drivers, and the login
      then succeeds. The old decision uses a prefix of the two URL strings. The
      new decision uses scheme, host, and port. An explicit default port matches
      an omitted one.

  150:
    name: 'A retried native Okta login resends the first SAML response'
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When the first login POST fails with a retryable status such as 503, the
      driver posts the password to Okta again, fetches SAML again, and the retried
      login body carries that new HTML in RAW_SAML_RESPONSE.
    new_driver_behavior: |
      The retry posts the same login body again, including the first
      RAW_SAML_RESPONSE. Okta is not called a second time.
    description: |
      The WireMock test checks that the retry happens and which RAW_SAML_RESPONSE
      each login body carries. A SAML assertion is single-use, so Snowflake may
      reject the resent one as a replay.

  151:
    name: 'A rejected native Okta password reports the Okta rejection and leaves sqlState unset'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      A wrong password, or a username and password Okta does not know, fails as
      AxiosError with code ERR_BAD_REQUEST and message "Request failed with status
      code 401". sqlState is unset.
    new_driver_behavior: |
      The same connects fail as Error with code undefined and message "Failed to
      login: Native Okta SSO failed: Okta token endpoint rejected credentials
      (HTTP 401 Unauthorized)". sqlState is unset.
    description: |
      A Snowflake password rejection uses GS code 390100, which Node maps to
      SQLSTATE 28000. Okta's HTTP 401 is not that code, so Node does not set
      sqlState. ODBC still reports 28000 for a wrong Okta password.

  152:
    name: 'An invalid native Okta URL fails with the Snowflake response instead of crashing'
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      authenticator https://testinvalidaccoount.com makes Snowflake return success
      with no data. The driver then throws TypeError "Cannot read properties of
      null (reading 'ssoUrl')" (SNOW-1844747). authenticator https://invalid.okta.com
      fails as Error with a non-empty message. That sentence is not stable.
    new_driver_behavior: |
      https://testinvalidaccoount.com fails as Error with code undefined and message
      "Failed to login: Native Okta SSO failed: Missing required field: data".
      https://invalid.okta.com fails as Error with code undefined and message
      "Failed to login: Native Okta SSO failed: The specified authenticator is not
      accepted by your Snowflake account configuration.  Please contact your local
      system administrator to get the correct URL to use." sqlState is unset.
    description: |
      The two URLs are different Snowflake responses. The typo host is a success
      body with no data, which the old driver crashed on. invalid.okta.com is
      Snowflake rejecting the authenticator. The crash stays fixed.

  153:
    name: 'A native Okta login request includes AUTHENTICATOR'
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The login POST omits AUTHENTICATOR when the authenticator is an Okta URL.
    new_driver_behavior: |
      The login POST sets AUTHENTICATOR to that Okta URL.
    description: |
      The field names the IdP on the login request. The old omission is not
      restored.

  154:
    name: 'jwtTimeout sets the key-pair JWT lifetime'
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      There is no jwtTimeout connection option. A key-pair JWT is valid for 120
      seconds. A jwtTimeout value is ignored, and the lifetime stays 120 seconds.
    new_driver_behavior: |
      jwtTimeout is a connection option, in seconds. When it is omitted or 0,
      each key-pair JWT is valid for 120 seconds. A positive integer is that
      lifetime, including a token signed again on login retry. A negative value
      or a non-integer is rejected when the connection is configured.
    description: |
      The omitted lifetime matches the old driver. 0 selects that 120-second
      default.

  155:
    name: 'streamRows() ignores the start and end options'
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      statement.streamRows({ start, end }) streams only the rows from position start to
      position end. Positions start at 0, and both ends are included: { start: 200, end: 300 }
      returns 101 rows.
      - A negative start counts as 0. Fractional values are rounded down.
      - An end that is missing, or past the last row, counts as the last row.
      - When start is greater than end, the stream ends without rows and without an error.
      - A start or end that is not a finite number throws right away: 411002 "Invalid start
        index. The specified value must be a number." or 411003 "Invalid end index. The
        specified value must be a number."
      streamRows() can be called again on the same statement, for example to read the next
      range of rows.
    new_driver_behavior: |
      StreamOptions still has start and end, but streamRows() ignores them. The stream
      always returns every row of the result. A value that is not a number does not throw.
    description: |
      The old driver also uses the range to download only the result chunks that contain
      rows in it. Other Snowflake drivers have no row range. Their result cursors are
      forward-only. Python (cursor.get_result_batches()), JDBC
      (getResultSetSerializables()) and Go (arrow batches) let callers fetch whole chunks
      on their own instead.
