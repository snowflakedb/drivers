// Reads the Snowflake server version cached from the login response.
// Distinct from ConnectionGetInfo (which aggregates ~12 fields and takes
// several locks) so SQLGetInfo(SQL_DBMS_VER) / JDBC getDatabaseProductVersion
// stay cheap even when callers poll them per-statement.
message ConnectionGetServerVersionRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionGetServerVersionResponse {
  // Empty when called before login completes.
  optional string server_version = 1;
}

message ConnectionValidateOptionsRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionValidateOptionsResponse {
  repeated ValidationIssue issues = 1;
}

// HTTP request via sf_core (uses connection's TLS/OCSP/CRL client).
// URL is resolved relative to the connection's server_url.
// Auth is always the current session token (managed by sf_core).
message ConnectionSendHttpRequest {
  ConnectionHandle conn_handle = 1;
  string method = 2;              // GET, POST, PUT, DELETE, PATCH
  string url = 3;                 // relative URL path (e.g. "/session/token-request")
  map<string, string> headers = 4;
  optional bytes body = 5;
}

message ConnectionSendHttpResponse {
  int32 status_code = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

enum TokenRequestType {
  TOKEN_REQUEST_TYPE_UNSPECIFIED = 0;
  TOKEN_REQUEST_TYPE_ISSUE = 1;
  TOKEN_REQUEST_TYPE_RENEW = 2;
}

// Token request (ISSUE/RENEW) — executed entirely in sf_core with master token
message ConnectionTokenRequest {
  ConnectionHandle conn_handle = 1;
  TokenRequestType request_type = 2;
}

message ConnectionTokenResponse {
  string session_token = 1;
  optional int64 validity_in_seconds = 2;
}

// Heartbeat request to validate that the connection and session are still alive.
message ConnectionHeartbeatRequest {
  ConnectionHandle conn_handle = 1;
  optional uint32 timeout_seconds = 2;  // 0 / absent = use default (300s)
}

message ConnectionHeartbeatResponse {
  bool valid = 1;
}

// Fetch the result of a previously executed query by its Snowflake Query ID.
message ConnectionGetQueryResultRequest {
  ConnectionHandle conn_handle = 1;
  string query_id = 2;
}

message ConnectionGetResultSetRequest {
  ConnectionHandle conn_handle = 1;
  string query_id = 2;
}

// Outcome of a ConnectionAbortQuery call. Genuine failures (invalid handle,
// transport errors, ...) are reported as an RPC error, not through this enum.
enum AbortQueryOutcome {
  ABORT_QUERY_OUTCOME_UNSPECIFIED = 0;
  // The query was running and the abort was acknowledged.
  ABORT_QUERY_OUTCOME_ABORTED = 1;
  // The query was not running (e.g. already completed, or never started),
  // so there was nothing to abort.
  ABORT_QUERY_OUTCOME_NOT_RUNNING = 2;
}

// Abort a running query by its Snowflake Query ID.
message ConnectionAbortQueryRequest {
  ConnectionHandle conn_handle = 1;
  string query_id = 2;
}

message ConnectionAbortQueryResponse {
  AbortQueryOutcome outcome = 1;
}

// Handle for a chunked upload stream session opened by
// ConnectionUploadStreamBegin. Opaque outside sf_core, same shape as the
// other handle types.
message UploadStreamHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Chunked streaming PUT, part 1/3: registers the PUT SQL and opens a session
// that accumulates chunks handed in via ConnectionUploadStreamChunk. The core
// does not contact GS until ConnectionUploadStreamFinish — bounding wrapper
// memory to ~one chunk while preserving the existing upload path (digest,
// retry, CSE, multipart) unchanged. Backs JDBC `uploadStream` and Python
// `cursor.execute(file_stream=…)`.
message ConnectionUploadStreamBeginRequest {
  ConnectionHandle conn_handle = 1;
  // The PUT SQL statement. Must begin with PUT and reference a `file://`
  // path whose basename is used as the destination filename in the stage.
  string sql = 2;
}

message ConnectionUploadStreamBeginResponse {
  UploadStreamHandle upload_handle = 1;
}

// Chunked streaming PUT, part 2/3: appends one chunk of the source to the
// session opened by ConnectionUploadStreamBegin. Callers should keep chunks
// bounded (e.g. 8 MiB) to preserve the wrapper memory bound this RPC exists
// for.
message ConnectionUploadStreamChunkRequest {
  UploadStreamHandle upload_handle = 1;
  bytes data = 2;
}

message ConnectionUploadStreamChunkResponse {}

// Chunked streaming PUT, part 3/3: closes the session, reassembles the
// buffered chunks into a re-readable source, and runs the PUT. Mirrors
// `ResultSetResponse`: a PUT-shaped result set (handle + descriptor), so the
// caller can read the standard 8-column PUT rowset.
message ConnectionUploadStreamFinishRequest {
  UploadStreamHandle upload_handle = 1;
}

message ConnectionUploadStreamFinishResponse {
  ResultSetHandle result_set_handle = 1;
  ResultSetDescriptor result_descriptor = 2;
}

// Aborts a chunked upload session opened by ConnectionUploadStreamBegin
// without running the PUT (e.g. the caller's source stream failed mid-read).
// Any buffered/spooled bytes are discarded.
message ConnectionUploadStreamAbortRequest {
  UploadStreamHandle upload_handle = 1;
}

message ConnectionUploadStreamAbortResponse {}

// Handle for a chunked download stream session opened by
// ConnectionDownloadStreamBegin. Opaque outside sf_core, same shape as the
// other handle types.
message DownloadStreamHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Chunked streaming GET, part 1/3: resolves the stage location and opens a
// session that streams the file from cloud storage without ever landing the
// whole file on local disk or fully buffering it in memory. The core keeps
// only a small bounded window of bytes in flight regardless of file size.
// Supports S3, GCS, and Azure-backed stages.
message ConnectionDownloadStreamBeginRequest {
  ConnectionHandle conn_handle = 1;
  string stage_name = 2;
  string source_filename = 3;
  // When true, the core gunzips the downloaded bytes before returning
  // (opt-in; the bytes are returned verbatim otherwise).
  bool decompress = 4;
}

message ConnectionDownloadStreamBeginResponse {
  DownloadStreamHandle download_handle = 1;
  // Size of the file in the stage, in bytes, when known up front (before
  // any decompression). Absent if the size could not be determined.
  optional int64 total_len = 2;
}

// Chunked streaming GET, part 2/3: pulls up to max_len bytes of the session
// opened by ConnectionDownloadStreamBegin. The core clamps max_len to 8 MiB
// per call regardless of what is requested here — this is an enforced cap,
// not just advisory guidance — to keep its bounded-memory guarantee a real
// guarantee. eof is true once the producer has finished and no more bytes
// remain.
message ConnectionDownloadStreamChunkRequest {
  DownloadStreamHandle download_handle = 1;
  int64 max_len = 2;
}

message ConnectionDownloadStreamChunkResponse {
  bytes data = 1;
  bool eof = 2;
}

// Chunked streaming GET, part 3/3: closes the session, aborting the
// in-flight download if it has not already finished. Safe to call after
// eof, or early (e.g. the caller's consumer failed mid-read).
message ConnectionDownloadStreamCloseRequest {
  DownloadStreamHandle download_handle = 1;
}

message ConnectionDownloadStreamCloseResponse {}

