syntax = "proto3";

package database_driver_v1;
option java_package = "net.snowflake.client.internal.unicore.protobuf_gen";
option csharp_namespace = "Snowflake.Data.Proto";

import "google/protobuf/descriptor.proto";

extend google.protobuf.ServiceOptions {
  optional string service_error = 412312;
}

extend google.protobuf.MethodOptions {
  optional string method_error = 412312;
  // Marks a slow, cancellable RPC as async-first: language generators emit a
  // Future/awaitable-returning client method instead of a blocking one.
  optional bool async_first = 412313;
}

// classifies a DriverException, wrappers dispatch on `DriverException.kind`.
enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_AUTHENTICATION_ERROR = 1;
  ERROR_KIND_NOT_IMPLEMENTED = 2;
  ERROR_KIND_INVALID_ARGUMENT = 3;
  ERROR_KIND_IO = 4;
  ERROR_KIND_CANCELLED = 5;
  ERROR_KIND_INTERNAL_ERROR = 6; // driver invariant violation (locks, parse, spool)
  ERROR_KIND_MISSING_PARAMETER = 7;
  ERROR_KIND_INVALID_PARAMETER_VALUE = 8;
  ERROR_KIND_LOGIN_ERROR = 9;
  ERROR_KIND_LOCAL_FILE_NOT_FOUND = 10;
  ERROR_KIND_REMOTE_FILE_NOT_FOUND = 11;
  ERROR_KIND_UNSUPPORTED_COMPRESSION = 12;
  ERROR_KIND_QUERY_FAILED = 13; // Snowflake query failure (syntax, missing object, ...)
  ERROR_KIND_TIMEOUT = 14;
  ERROR_KIND_STAGE_BINDING = 15;
}

// Info codes corresponding to Thrift InfoCode enum
enum InfoCode {
  INFO_CODE_UNSPECIFIED = 0;
  INFO_CODE_VENDOR_NAME = 1;
  INFO_CODE_VENDOR_VERSION = 2;
  INFO_CODE_VENDOR_ARROW_VERSION = 3;
  INFO_CODE_VENDOR_SQL = 101;
  INFO_CODE_VENDOR_SUBSTRAIT = 102;
  INFO_CODE_VENDOR_SUBSTRAIT_MIN_VERSION = 103;
  INFO_CODE_VENDOR_SUBSTRAIT_MAX_VERSION = 104;
  INFO_CODE_DRIVER_NAME = 201;
  INFO_CODE_DRIVER_VERSION = 202;
  INFO_CODE_DRIVER_ARROW_VERSION = 203;
  INFO_CODE_DRIVER_ADBC_VERSION = 204;
}

// Single entry in an error trace (analogous to a stack-trace frame)
message ErrorTraceEntry {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
  string message = 4;
}

// What the abort-request the driver fired *because its operation was cancelled*
// achieved. Only meaningful on a DriverException whose kind is
// ERROR_KIND_CANCELLED; it is the answer to "did my cancel actually stop the
// query on the server", delivered to the caller whose query was cancelled.
//
// Deliberately not AbortQueryOutcome: that enum answers an explicit abort RPC
// and reserves failures for the RPC error, whereas here the abort is a side
// effect of cancellation and its failure has nowhere else to surface.
enum CancellationAbortOutcome {
  // Required proto3 zero value; never sent. "No abort was issued" — because the
  // error is not a cancellation, or the operation was cancelled before its query
  // reached the server — is carried by the field being absent, so that state has
  // exactly one encoding.
  CANCELLATION_ABORT_OUTCOME_UNSPECIFIED = 0;
  // The server acknowledged the abort. Means the abort request was *processed*,
  // NOT a guarantee the query had stopped by the time this was reported.
  CANCELLATION_ABORT_OUTCOME_ABORTED = 1;
  // The server reported the query was not running, so there was nothing to
  // abort (it had already finished, or never started).
  CANCELLATION_ABORT_OUTCOME_NOT_RUNNING = 2;
  // The abort was issued but its result is unknown: the request failed, or it
  // had not finished by the time the cancelled caller was released.
  CANCELLATION_ABORT_OUTCOME_NOT_CONFIRMED = 3;
}

// Driver exception
message DriverException {
  string message = 1;
  ErrorKind kind = 2;
  repeated ErrorTraceEntry error_trace = 3;
  // Snowflake server error code (e.g. 1003 for syntax error, 904 for invalid identifier).
  // Present when the error originated from a Snowflake server response.
  optional int32 vendor_code = 4;
  // ANSI SQL state code (e.g. "42000" for syntax error).
  // Present when the server provides a sqlState in its response.
  optional string sql_state = 5;
  // The deepest cause in the error chain (root cause).
  // More informative than the top-level message for end users.
  optional string root_cause = 6;
  // Snowflake Query ID (sfqid) associated with the failed query, if available.
  optional string query_id = 7;
  // Client-generated UUID v4 sent as ?requestId= on the query submission
  // request. Present when the error originated from a query execution attempt.
  optional string request_id = 8;
  // Offending config/bind parameter name, when the failure is about a parameter.
  optional string parameter = 9;
  // Value associated with `parameter`; for conflicts, the other parameter's name.
  optional string parameter_value = 10;
  // Discriminant for which sf_core validation rule produced this error, when
  // known. Unset when the error did not originate from `validate_settings`.
  optional ValidationCode validation_code = 11;
  // True when the session cannot be renewed automatically; the caller must
  // open a new connection. Additive field, default false. The GS code, if
  // any, travels on vendor_code — the same channel every other error type
  // uses — not duplicated here.
  bool reauthentication_required = 12;
  // What the abort-request fired on cancellation achieved. Set only when kind is
  // ERROR_KIND_CANCELLED *and* an abort was actually issued; unset otherwise.
  optional CancellationAbortOutcome cancellation_abort_outcome = 13;
}

// Column metadata for description
message ColumnMetadata {
  string name = 1;
  string type = 2;
  optional int64 precision = 3;
  optional int64 scale = 4;
  optional int64 length = 5;
  optional int64 byte_length = 6;
  bool nullable = 7;
  optional int64 dimension = 8;
  bool fixed = 9;
  string column_src_database = 10;
  string column_src_schema = 11;
  string column_src_table = 12;
  bool is_auto_increment = 13;
  string ext_col_type_name = 14;
  string udt_output_type = 15;
}

// DML operation statistics
message QueryStats {
  optional int64 num_rows_inserted = 1;
  optional int64 num_rows_updated = 2;
  optional int64 num_rows_deleted = 3;
  optional int64 num_dml_duplicates = 4;
}

// Describes one result set from a (possibly multi-statement) execution.
message ResultSetDescriptor {
  string query_id = 1;
  repeated ColumnMetadata columns = 2;
  optional int64 rows_affected = 3;
  optional int64 statement_type_id = 4;
  optional string sql_state = 5;
  optional QueryStats stats = 6;
  optional int64 row_count = 7;
}

message ResultSetResponse {
  ResultSetHandle result_set_handle = 1;
  ResultSetDescriptor result_descriptor = 2;
}

// Multi-statement execution: child query IDs and their statement types.
message MultiStatementResult {
  ResultSetDescriptor parent = 1;
  repeated string query_ids = 2;
  // Statement type IDs for each child, parallel to query_ids.
  // Used by wrappers to classify results (ResultSet vs update count) without lazy fetch.
  repeated int64 statement_type_ids = 3;
}

// Partitioned result
message PartitionedResult {
  int64 schema = 1;
  repeated bytes partitions = 2;
  optional int64 rows_affected = 3;
}

// Database handle
message DatabaseHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Connection handle
message ConnectionHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Statement handle
message StatementHandle {
  int64 id = 1;
  int64 magic = 2;
}

// ResultSet handle
message ResultSetHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Arrow array stream pointer
message ArrowArrayStreamPtr {
  bytes value = 1;
}

// Arrow schema pointer
message ArrowSchemaPtr {
  bytes value = 1;
}

// =============================================================================
// POINTER TYPES - For passing data references to core
// =============================================================================

// Pointer to raw binary data in memory with explicit length.
// Used for passing data from language wrappers without copying.
//
// Both JSON and CSV use this same pointer type since both point to raw bytes:
// - JSON: pointer to UTF-8 encoded JSON bytes (e.g., from json_str.encode('utf-8'))
// - CSV: pointer to raw CSV file bytes
message BinaryDataPtr {
  bytes value = 1;   // 8-byte pointer (encoded as little-endian)
  int64 length = 2;  // Length of data in bytes
}

// Union of all binding types.
// Both variants use BinaryDataPtr since both point to raw bytes in memory.
message QueryBindings {
  oneof binding_type {
    BinaryDataPtr json = 1;  // Pointer to UTF-8 encoded JSON bytes
    BinaryDataPtr csv = 2;   // Pointer to raw CSV bytes
  }
}

