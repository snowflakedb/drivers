syntax = "proto3";

package database_driver_v1;
option java_package = "net.snowflake.client.internal.unicore.protobuf_gen";
option csharp_namespace = "Snowflake.Data.Proto";

import "google/protobuf/descriptor.proto";

extend google.protobuf.ServiceOptions {
  optional string service_error = 412312;
}

extend google.protobuf.MethodOptions {
  optional string method_error = 412312;
}

// Status codes corresponding to Thrift StatusCode enum
enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_OK = 1;
  STATUS_CODE_AUTHENTICATION_ERROR = 2;
  STATUS_CODE_NOT_IMPLEMENTED = 3;
  STATUS_CODE_NOT_FOUND = 4;
  STATUS_CODE_ALREADY_EXISTS = 5;
  STATUS_CODE_INVALID_ARGUMENT = 6;
  STATUS_CODE_INVALID_STATE = 7;
  STATUS_CODE_INVALID_DATA = 8;
  STATUS_CODE_IO = 9;
  STATUS_CODE_CANCELLED = 10;
  STATUS_CODE_UNAUTHENTICATED = 11;
  STATUS_CODE_UNAUTHORIZED = 12;
  STATUS_CODE_GENERIC_ERROR = 13;
  STATUS_CODE_INTERNAL_ERROR = 14;
  STATUS_CODE_MISSING_PARAMETER = 15;
  STATUS_CODE_INVALID_PARAMETER_VALUE = 16;
  STATUS_CODE_LOGIN_ERROR = 17;
  STATUS_CODE_LOCAL_FILE_NOT_FOUND = 18;
  STATUS_CODE_REMOTE_FILE_NOT_FOUND = 19;
  STATUS_CODE_UNSUPPORTED_COMPRESSION = 20;
}

// Info codes corresponding to Thrift InfoCode enum
enum InfoCode {
  INFO_CODE_UNSPECIFIED = 0;
  INFO_CODE_VENDOR_NAME = 1;
  INFO_CODE_VENDOR_VERSION = 2;
  INFO_CODE_VENDOR_ARROW_VERSION = 3;
  INFO_CODE_VENDOR_SQL = 101;
  INFO_CODE_VENDOR_SUBSTRAIT = 102;
  INFO_CODE_VENDOR_SUBSTRAIT_MIN_VERSION = 103;
  INFO_CODE_VENDOR_SUBSTRAIT_MAX_VERSION = 104;
  INFO_CODE_DRIVER_NAME = 201;
  INFO_CODE_DRIVER_VERSION = 202;
  INFO_CODE_DRIVER_ARROW_VERSION = 203;
  INFO_CODE_DRIVER_ADBC_VERSION = 204;
}

// Error detail message
message ErrorDetail {
  string key = 1;
  string value = 2;
}

// Authentication error details
message AuthenticationError {
  string detail = 1;
}

// Generic error (empty message)
message GenericError {
}

// Internal error (empty message)
message InternalError {
}

// Login error details
message LoginError {
  string message = 1;
  int32 code = 2;
}

// Missing parameter error
message MissingParameter {
  string parameter = 1;
}

// Invalid parameter value error
message InvalidParameterValue {
  string parameter = 1;
  string value = 2;
  optional string explanation = 3;
}

// Driver error union (using oneof)
message DriverError {
  oneof error_type {
    AuthenticationError auth_error = 1;
    GenericError generic_error = 2;
    InternalError internal_error = 3;
    MissingParameter missing_parameter = 4;
    InvalidParameterValue invalid_parameter_value = 5;
    LoginError login_error = 6;
  }
}

// Single entry in an error trace (analogous to a stack-trace frame)
message ErrorTraceEntry {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
  string message = 4;
}

// Driver exception
message DriverException {
  string message = 1;
  StatusCode status_code = 2;
  DriverError error = 3;
  repeated ErrorTraceEntry error_trace = 4;
  // Snowflake server error code (e.g. 1003 for syntax error, 904 for invalid identifier).
  // Present when the error originated from a Snowflake server response.
  optional int32 vendor_code = 5;
  // ANSI SQL state code (e.g. "42000" for syntax error).
  // Present when the server provides a sqlState in its response.
  optional string sql_state = 6;
  // The deepest cause in the error chain (root cause).
  // More informative than the top-level message for end users.
  optional string root_cause = 7;
  // Snowflake Query ID (sfqid) associated with the failed query, if available.
  optional string query_id = 8;
}

// Column metadata for description
message ColumnMetadata {
  string name = 1;
  string type = 2;
  optional int64 precision = 3;
  optional int64 scale = 4;
  optional int64 length = 5;
  optional int64 byte_length = 6;
  bool nullable = 7;
  optional int64 dimension = 8;
  bool fixed = 9;
  string column_src_database = 10;
  string column_src_schema = 11;
  string column_src_table = 12;
  bool is_auto_increment = 13;
  string ext_col_type_name = 14;
  string udt_output_type = 15;
}

// DML operation statistics
message QueryStats {
  optional int64 num_rows_inserted = 1;
  optional int64 num_rows_updated = 2;
  optional int64 num_rows_deleted = 3;
  optional int64 num_dml_duplicates = 4;
}

// Describes one result set from a (possibly multi-statement) execution.
message ResultSetDescriptor {
  string query_id = 1;
  repeated ColumnMetadata columns = 2;
  optional int64 rows_affected = 3;
  optional int64 statement_type_id = 4;
  optional string sql_state = 5;
  optional QueryStats stats = 6;
  optional int64 row_count = 7;
}

message ResultSetResponse {
  ResultSetHandle result_set_handle = 1;
  ResultSetDescriptor result_descriptor = 2;
}

// Multi-statement execution: child query IDs and their statement types.
message MultiStatementResult {
  ResultSetDescriptor parent = 1;
  repeated string query_ids = 2;
  // Statement type IDs for each child, parallel to query_ids.
  // Used by wrappers to classify results (ResultSet vs update count) without lazy fetch.
  repeated int64 statement_type_ids = 3;
}

// Partitioned result
message PartitionedResult {
  int64 schema = 1;
  repeated bytes partitions = 2;
  optional int64 rows_affected = 3;
}

// Database handle
message DatabaseHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Connection handle
message ConnectionHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Statement handle
message StatementHandle {
  int64 id = 1;
  int64 magic = 2;
}

// ResultSet handle
message ResultSetHandle {
  int64 id = 1;
  int64 magic = 2;
}

// Arrow array stream pointer
message ArrowArrayStreamPtr {
  bytes value = 1;
}

// Arrow schema pointer
message ArrowSchemaPtr {
  bytes value = 1;
}

// =============================================================================
// POINTER TYPES - For passing data references to core
// =============================================================================

// Pointer to raw binary data in memory with explicit length.
// Used for passing data from language wrappers without copying.
//
// Both JSON and CSV use this same pointer type since both point to raw bytes:
// - JSON: pointer to UTF-8 encoded JSON bytes (e.g., from json_str.encode('utf-8'))
// - CSV: pointer to raw CSV file bytes
message BinaryDataPtr {
  bytes value = 1;   // 8-byte pointer (encoded as little-endian)
  int64 length = 2;  // Length of data in bytes
}

// Union of all binding types.
// Both variants use BinaryDataPtr since both point to raw bytes in memory.
message QueryBindings {
  oneof binding_type {
    BinaryDataPtr json = 1;  // Pointer to UTF-8 encoded JSON bytes
    BinaryDataPtr csv = 2;   // Pointer to raw CSV bytes
  }
}

// Database service requests and responses

message DatabaseNewRequest {
}

message DatabaseNewResponse {
  DatabaseHandle db_handle = 1;
}

message DatabaseInitRequest {
  DatabaseHandle db_handle = 1;
}

message DatabaseInitResponse {
}

message DatabaseReleaseRequest {
  DatabaseHandle db_handle = 1;
}

message DatabaseReleaseResponse {
}

// Connection service requests and responses

message ConnectionNewRequest {
}

message ConnectionNewResponse {
  ConnectionHandle conn_handle = 1;
}

// Identity of the language-specific wrapper invoking core via protobuf.
message WrapperIdentity {
  optional string driver_name = 1;
  optional string driver_version = 2;
  optional string language_runtime = 3;
  optional string language_version = 4;
  optional string language_compiler = 5;
}

message ConnectionInitRequest {
  ConnectionHandle conn_handle = 1;
  DatabaseHandle db_handle = 2;
  // Wrapper identity — used to emit session_init telemetry during connection init.
  optional WrapperIdentity wrapper_identity = 3;
}

message ConnectionInitResponse {
}

message ConnectionReleaseRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionReleaseResponse {
}

message ConnectionCloseRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionCloseResponse {
}

message ConnectionIsClosedRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionIsClosedResponse {
  bool is_closed = 1;
}

message ConnectionIsExpiredRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionIsExpiredResponse {
  bool is_expired = 1;
}

message ConnectionGetInfoRequest {
  ConnectionHandle conn_handle = 1;
  repeated InfoCode info_codes = 2;
  // Opt-in to include sensitive tokens (e.g. master_token) in the response.
  // Defaults to false; only set when the caller needs tokens for REST-compat.
  bool include_master_token = 3;
}

message ConnectionGetInfoResponse {
  optional string host = 1;
  optional int64 port = 2;
  optional string server_url = 3;
  optional string session_token = 4;
  optional int64 session_id = 5;
  optional string account = 6;
  optional string user = 7;
  optional string role = 8;
  optional string database = 9;
  optional string schema = 10;
  optional string warehouse = 11;
  optional string master_token = 12;
  optional string user_agent = 13;
}

message ConnectionGetObjectsRequest {
  ConnectionHandle conn_handle = 1;
  int32 depth = 2;
  optional string catalog = 3;
  optional string db_schema = 4;
  optional string table_name = 5;
  repeated string table_type = 6;
  optional string column_name = 7;
}

// ConnectionGetObjects returns a result set (streaming, via result_set_get_stream)
// containing a nested ADBC-shaped Arrow batch:
//   catalog_name: utf8
//   catalog_db_schemas: list<struct<
//     db_schema_name: utf8,
//     db_schema_tables: list<struct<
//       table_name: utf8,
//       table_type: utf8,
//       table_columns: list (always empty in this impl),
//       table_constraints: list (always empty in this impl)
//     >>
//   >>
//
// depth constants:
//   0 = ALL (not used)
//   1 = CATALOGS  -> populates only catalog_name
//   2 = DB_SCHEMAS -> populates catalog_name + db_schema_name
//   3 = TABLES    -> populates down to table_name/table_type
//   4 = COLUMNS   -> deferred (not implemented yet)
//
// Filter semantics (search patterns, ADBC + backslash-escape extension):
//   - NULL filter = no filter (account-wide or connection-context if
//     CLIENT_METADATA_REQUEST_USE_CONNECTION_CTX is set)
//   - empty string "" = matches nothing (returns empty result)
//   - % = any sequence, _ = any single char
//   - \%, \_, \\ = literal %, _, \ (escape extension, not in ADBC spec)
//   - Matching is case-insensitive (Snowflake unquoted-identifier semantics)
message ConnectionGetObjectsResponse {
  ResultSetHandle result_set_handle = 1;
  ResultSetDescriptor result_descriptor = 2;
}

message ConnectionGetTableSchemaRequest {
  ConnectionHandle conn_handle = 1;
  optional string catalog = 2;
  optional string db_schema = 3;
  string table_name = 4;
}

message ConnectionGetTableSchemaResponse {
  bytes schema_data = 1;
}

message ConnectionGetTableTypesRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionGetTableTypesResponse {
  bytes table_types_data = 1;
}

message ConnectionCommitRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionCommitResponse {
}

message ConnectionRollbackRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionRollbackResponse {
}

message ConnectionSetAutocommitRequest {
  ConnectionHandle conn_handle = 1;
  bool autocommit = 2;
}

message ConnectionSetAutocommitResponse {
}

message ConnectionUseDatabaseRequest {
  ConnectionHandle conn_handle = 1;
  string database = 2;
}

message ConnectionUseDatabaseResponse {
}

message ConnectionUseSchemaRequest {
  ConnectionHandle conn_handle = 1;
  string schema = 2;
}

message ConnectionUseSchemaResponse {
}

message ConnectionSetSessionParametersRequest {
  ConnectionHandle conn_handle = 1;
  map<string, string> parameters = 2;
}

message ConnectionSetSessionParametersResponse {
}

message ConnectionGetParameterRequest {
  ConnectionHandle conn_handle = 1;
  string key = 2;
}

message ConnectionGetParameterResponse {
  optional string value = 1;
}

message ConnectionGetAllParametersRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionGetAllParametersResponse {
  map<string, string> parameters = 1;
}

// Reads the Snowflake server version cached from the login response.
// Distinct from ConnectionGetInfo (which aggregates ~12 fields and takes
// several locks) so SQLGetInfo(SQL_DBMS_VER) / JDBC getDatabaseProductVersion
// stay cheap even when callers poll them per-statement.
message ConnectionGetServerVersionRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionGetServerVersionResponse {
  // Empty when called before login completes.
  optional string server_version = 1;
}

message ConnectionValidateOptionsRequest {
  ConnectionHandle conn_handle = 1;
}

message ConnectionValidateOptionsResponse {
  repeated ValidationIssue issues = 1;
}

// HTTP request via sf_core (uses connection's TLS/OCSP/CRL client).
// URL is resolved relative to the connection's server_url.
// Auth is always the current session token (managed by sf_core).
message ConnectionSendHttpRequest {
  ConnectionHandle conn_handle = 1;
  string method = 2;              // GET, POST, PUT, DELETE, PATCH
  string url = 3;                 // relative URL path (e.g. "/session/token-request")
  map<string, string> headers = 4;
  optional bytes body = 5;
}

message ConnectionSendHttpResponse {
  int32 status_code = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

enum TokenRequestType {
  TOKEN_REQUEST_TYPE_UNSPECIFIED = 0;
  TOKEN_REQUEST_TYPE_ISSUE = 1;
  TOKEN_REQUEST_TYPE_RENEW = 2;
}

// Token request (ISSUE/RENEW) — executed entirely in sf_core with master token
message ConnectionTokenRequest {
  ConnectionHandle conn_handle = 1;
  TokenRequestType request_type = 2;
}

message ConnectionTokenResponse {
  string session_token = 1;
  optional int64 validity_in_seconds = 2;
}

// Heartbeat request to validate that the connection and session are still alive.
message ConnectionHeartbeatRequest {
  ConnectionHandle conn_handle = 1;
  optional uint32 timeout_seconds = 2;  // 0 / absent = use default (300s)
}

message ConnectionHeartbeatResponse {
  bool valid = 1;
}

// Fetch the result of a previously executed query by its Snowflake Query ID.
message ConnectionGetQueryResultRequest {
  ConnectionHandle conn_handle = 1;
  string query_id = 2;
}

message ConnectionGetResultSetRequest {
  ConnectionHandle conn_handle = 1;
  string query_id = 2;
}

// Abort a running query by its Snowflake Query ID.
message ConnectionAbortQueryRequest {
  ConnectionHandle conn_handle = 1;
  string query_id = 2;
}

message ConnectionAbortQueryResponse {
  bool success = 1;
}

// Streaming PUT: upload an in-memory byte buffer using a PUT SQL statement.
// Backs JDBC `uploadStream` and Python `cursor.execute(file_stream=…)`.
message ConnectionUploadStreamRequest {
  ConnectionHandle conn_handle = 1;
  // The PUT SQL statement. Must begin with PUT and reference a `file://`
  // path whose basename is used as the destination filename in the stage.
  string sql = 2;
  // Raw bytes to upload. The caller has already drained the source stream.
  bytes data = 3;
}

// Mirrors `ResultSetResponse`: a PUT-shaped result set (handle + descriptor),
// so the caller can read the standard 8-column PUT rowset.
message ConnectionUploadStreamResponse {
  ResultSetHandle result_set_handle = 1;
  ResultSetDescriptor result_descriptor = 2;
}

// Streaming GET: download a file from a stage and return its bytes. Backs
// JDBC `downloadStream`.
message ConnectionDownloadStreamRequest {
  ConnectionHandle conn_handle = 1;
  string stage_name = 2;
  string source_filename = 3;
  // When true, the core gunzips the downloaded bytes before returning
  // (opt-in; the bytes are returned verbatim otherwise).
  bool decompress = 4;
}

message ConnectionDownloadStreamResponse {
  bytes data = 1;
}

// Statement service requests and responses

message StatementNewRequest {
  ConnectionHandle conn_handle = 1;
}

message StatementNewResponse {
  StatementHandle stmt_handle = 1;
}

message StatementReleaseRequest {
  StatementHandle stmt_handle = 1;
}

message StatementReleaseResponse {
}

message StatementSetSqlQueryRequest {
  StatementHandle stmt_handle = 1;
  string query = 2;
}

message StatementSetSqlQueryResponse {
}

message StatementSetSubstraitPlanRequest {
  StatementHandle stmt_handle = 1;
  bytes plan = 2;
}

message StatementSetSubstraitPlanResponse {
}

message PrepareResult {
  ArrowArrayStreamPtr stream = 1;
  string query_id = 3;
  repeated ColumnMetadata columns = 4;
  int32 number_of_binds = 5;
  string query = 6;
  optional string sql_state = 7;
  bool array_bind_supported = 8;
  repeated ColumnMetadata binds = 9;
}

message StatementPrepareRequest {
  StatementHandle stmt_handle = 1;
}

message StatementPrepareResponse {
  PrepareResult result = 1;
}

message StatementGetParameterSchemaRequest {
  StatementHandle stmt_handle = 1;
}

message StatementGetParameterSchemaResponse {
  ArrowSchemaPtr schema = 1;
}

// Extend current StatementExecute
message StatementExecuteQueryRequest {
  StatementHandle stmt_handle = 1;
  optional QueryBindings bindings = 2;  // None = no bindings
  optional uint32 timeout_seconds = 3;  // 0 / absent = no timeout override
}

message ExecuteQueryResponse {
  oneof result {
    // Single statement — descriptor + result_set_handle for stream/chunks access.
    ResultSetResponse single = 1;
    // Multi-statement — child query IDs only, fetch metadata lazily.
    MultiStatementResult multi = 2;
  }
}

// Async query execution: submit and return immediately with query_id
message StatementExecuteAsyncRequest {
  StatementHandle stmt_handle = 1;
  optional QueryBindings bindings = 2;
}

message StatementExecuteAsyncResponse {
  string query_id = 1;
}

message StatementExecutePartitionsRequest {
  StatementHandle stmt_handle = 1;
}

message StatementExecutePartitionsResponse {
  PartitionedResult result = 1;
}

message StatementReadPartitionRequest {
  StatementHandle stmt_handle = 1;
  bytes partition_descriptor = 2;
}

message StatementReadPartitionResponse {
  int64 partition_stream = 1;
}

// Distributed fetch types

enum ChunkFormat {
  CHUNK_FORMAT_UNSPECIFIED = 0;
  CHUNK_FORMAT_ARROW_IPC = 1;
  CHUNK_FORMAT_JSON = 2;
}

message RemoteChunk {
  string url = 1;
  map<string, string> headers = 2;
  int64 compressed_size = 3;
  int64 uncompressed_size = 4;
}

message ResultChunk {
  // Format of the decoded payload (after base64 decoding when using `inline`).
  ChunkFormat format = 1;
  oneof data {
    // Inline payload: the UTF-8 bytes of a base64-encoded string.
    // Clients must base64-decode this field, then interpret the resulting
    // bytes according to `format` (e.g. Arrow IPC or JSON).
    string inline = 2;
    RemoteChunk remote = 3;
  }
  int32 row_count = 4;
}


message DatabaseFetchChunkRequest {
  ConnectionHandle conn_handle = 1;
  ResultChunk chunk = 2;
  // Required when chunk.format == CHUNK_FORMAT_JSON (forward from ResultSetGetChunksResponse.columns); ignored for CHUNK_FORMAT_ARROW_IPC.
  repeated ColumnMetadata columns = 3;
}

message DatabaseFetchChunkResponse {
  ArrowArrayStreamPtr stream = 1;
}

// ResultSet RPCs

message ResultSetGetStreamRequest {
  ResultSetHandle result_set_handle = 1;
}

message ResultSetGetStreamResponse {
  ArrowArrayStreamPtr stream = 1;
}

message ResultSetGetChunksRequest {
  ResultSetHandle result_set_handle = 1;
}

message ResultSetGetChunksResponse {
  repeated ResultChunk chunks = 1;
  // Column metadata. Required for CHUNK_FORMAT_JSON (forward on DatabaseFetchChunkRequest); ignored for CHUNK_FORMAT_ARROW_IPC.
  repeated ColumnMetadata columns = 2;
}

message ResultSetReleaseRequest {
  ResultSetHandle result_set_handle = 1;
}

message ResultSetReleaseResponse {
}

// Validation issue reported during set or validate operations.
message ValidationIssue {
  ValidationSeverity severity = 1;
  string parameter = 2;
  string message = 3;
  ValidationCode code = 4;
}

enum ValidationSeverity {
  VALIDATION_SEVERITY_ERROR = 0;
  VALIDATION_SEVERITY_WARNING = 1;
}

enum ValidationCode {
  VALIDATION_CODE_UNSPECIFIED = 0;
  VALIDATION_CODE_MISSING_REQUIRED = 1;
  VALIDATION_CODE_INVALID_TYPE = 2;
  VALIDATION_CODE_INVALID_VALUE = 3;
  VALIDATION_CODE_UNKNOWN_PARAMETER = 4;
  VALIDATION_CODE_DEPRECATED_PARAMETER = 5;
  VALIDATION_CODE_CONFLICTING_PARAMETERS = 6;
}

// Config setting value (union type)
message ConfigSetting {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bytes bytes_value = 4;
    bool bool_value = 5;
  }
}

// A config section containing key-value settings
message ConfigSection {
  map<string, ConfigSetting> settings = 1;
}

// Batch set options
message ConnectionSetOptionsRequest {
  ConnectionHandle conn_handle = 1;
  map<string, ConfigSetting> options = 2;
  // True when the caller invoked connect() with zero connection-identifying
  // options (the legacy Python driver's `is_kwargs_empty` condition). The core
  // then falls back to the default connection profile from connections.toml,
  // honoring SNOWFLAKE_DEFAULT_CONNECTION_NAME and config.toml's
  // `default_connection_name`. Language wrappers MUST compute this from the
  // raw caller input *before* injecting any bookkeeping params (application,
  // client_app_id, …); a value of `false` (the default) means "caller supplied
  // something", so do not load the default profile.
  bool no_connection_details = 3;
}

message ConnectionSetOptionsResponse {
  repeated ValidationIssue warnings = 1;
}

message DatabaseSetOptionsRequest {
  DatabaseHandle db_handle = 1;
  map<string, ConfigSetting> options = 2;
}

message DatabaseSetOptionsResponse {
  repeated ValidationIssue warnings = 1;
}

message StatementSetOptionsRequest {
  StatementHandle stmt_handle = 1;
  map<string, ConfigSetting> options = 2;
}

message StatementSetOptionsResponse {
  repeated ValidationIssue warnings = 1;
}

// Config service requests and responses

message ConfigLoadAllSectionsRequest {
  optional string config_file = 1;
  optional string connections_file = 2;
  bool skip_permissions = 3;
}

message ConfigLoadAllSectionsResponse {
  string config_json = 1;
}

message ConnectionGetQueryStatusRequest {
  ConnectionHandle conn_handle = 1;
  string query_id = 2;
}

message ConnectionGetQueryStatusResponse {
  // Status name as returned by the server (e.g. "RUNNING", "SUCCESS", "FAILED_WITH_ERROR")
  string status_name = 1;
  int64 end_time = 2;
  optional int32 error_code = 3;
  optional string error_message = 4;
  string query_id = 5;
  int64 session_id = 6;
  string sql_text = 7;
  int64 start_time = 8;
  string state = 9;
  int32 total_duration = 10;
  optional string warehouse_external_size = 11;
  int64 warehouse_id = 12;
  optional string warehouse_name = 13;
  optional string warehouse_server_type = 14;
}

message ConfigGetPathsRequest {
}

message ConfigGetPathsResponse {
  string config_file = 1;
  string connections_file = 2;
}

// =============================================================================
// TELEMETRY - In-band telemetry messages sent from wrappers via core
// =============================================================================


message TelemetrySendApiUsageRequest {
  ConnectionHandle conn_handle = 1;
  string api_method = 2;
  // Names of the arguments the caller explicitly passed to the API method.
  // Names only — never argument values, and parameters left at their default
  // are omitted. Used to learn which optional fields callers actually exercise.
  repeated string passed_arguments = 3;
}

message TelemetrySendWrapperErrorRequest {
  ConnectionHandle conn_handle = 1;
  string exception_type = 2;
  string error_source = 3;
}

message TelemetrySendResponse {
}

// Database Driver service definition
service DatabaseDriver {
  option (service_error) = "DriverException";
  // Database operations
  rpc DatabaseNew(DatabaseNewRequest) returns (DatabaseNewResponse);
  rpc DatabaseSetOptions(DatabaseSetOptionsRequest) returns (DatabaseSetOptionsResponse);
  rpc DatabaseInit(DatabaseInitRequest) returns (DatabaseInitResponse);
  rpc DatabaseRelease(DatabaseReleaseRequest) returns (DatabaseReleaseResponse);
  rpc DatabaseFetchChunk(DatabaseFetchChunkRequest) returns (DatabaseFetchChunkResponse);

  // Connection operations
  rpc ConnectionNew(ConnectionNewRequest) returns (ConnectionNewResponse);
  rpc ConnectionSetOptions(ConnectionSetOptionsRequest) returns (ConnectionSetOptionsResponse);
  rpc ConnectionInit(ConnectionInitRequest) returns (ConnectionInitResponse);
  rpc ConnectionRelease(ConnectionReleaseRequest) returns (ConnectionReleaseResponse);
  rpc ConnectionClose(ConnectionCloseRequest) returns (ConnectionCloseResponse);
  rpc ConnectionIsClosed(ConnectionIsClosedRequest) returns (ConnectionIsClosedResponse);
  rpc ConnectionIsExpired(ConnectionIsExpiredRequest) returns (ConnectionIsExpiredResponse);
  rpc ConnectionGetInfo(ConnectionGetInfoRequest) returns (ConnectionGetInfoResponse);
  rpc ConnectionGetObjects(ConnectionGetObjectsRequest) returns (ConnectionGetObjectsResponse);
  rpc ConnectionGetTableSchema(ConnectionGetTableSchemaRequest) returns (ConnectionGetTableSchemaResponse);
  rpc ConnectionGetTableTypes(ConnectionGetTableTypesRequest) returns (ConnectionGetTableTypesResponse);
  rpc ConnectionCommit(ConnectionCommitRequest) returns (ConnectionCommitResponse);
  rpc ConnectionRollback(ConnectionRollbackRequest) returns (ConnectionRollbackResponse);
  rpc ConnectionSetAutocommit(ConnectionSetAutocommitRequest) returns (ConnectionSetAutocommitResponse);
  rpc ConnectionUseDatabase(ConnectionUseDatabaseRequest) returns (ConnectionUseDatabaseResponse);
  rpc ConnectionUseSchema(ConnectionUseSchemaRequest) returns (ConnectionUseSchemaResponse);
  // sets initial session parameters connection should be initialized with
  // call before opening the connection
  rpc ConnectionSetSessionParameters(ConnectionSetSessionParametersRequest) returns (ConnectionSetSessionParametersResponse);
  // gets cached session parameter. Cache is updated with subset of connection parameters
  // (chosen by server, included in HTTP response) after each query
  rpc ConnectionGetParameter(ConnectionGetParameterRequest) returns (ConnectionGetParameterResponse);
  // gets all resolved session parameters at once
  rpc ConnectionGetAllParameters(ConnectionGetAllParametersRequest) returns (ConnectionGetAllParametersResponse);
  // returns the Snowflake server version cached from the login response
  // (`serverVersion` in `/session/v1/login-request`); backs
  // `SQLGetInfo(SQL_DBMS_VER)` and `getDatabaseProductVersion`
  rpc ConnectionGetServerVersion(ConnectionGetServerVersionRequest) returns (ConnectionGetServerVersionResponse);
  // pre-flight validation of connection options - reports all issues at once
  rpc ConnectionValidateOptions(ConnectionValidateOptionsRequest) returns (ConnectionValidateOptionsResponse);
  // Fetch the result of a previously executed query by Snowflake Query ID
  rpc ConnectionGetQueryResult(ConnectionGetQueryResultRequest) returns (ExecuteQueryResponse);
  rpc ConnectionGetResultSet(ConnectionGetResultSetRequest) returns (ResultSetResponse);
  rpc ConnectionGetQueryStatus(ConnectionGetQueryStatusRequest) returns (ConnectionGetQueryStatusResponse);
  // Abort a running query by Snowflake Query ID
  rpc ConnectionAbortQuery(ConnectionAbortQueryRequest) returns (ConnectionAbortQueryResponse);
  // Streaming PUT (upload bytes) / GET (download to bytes) from a stage
  rpc ConnectionUploadStream(ConnectionUploadStreamRequest) returns (ConnectionUploadStreamResponse);
  rpc ConnectionDownloadStream(ConnectionDownloadStreamRequest) returns (ConnectionDownloadStreamResponse);
  // Generic HTTP request through sf_core's TLS/OCSP/CRL client
  rpc ConnectionSendHttp(ConnectionSendHttpRequest) returns (ConnectionSendHttpResponse);
  // Token request (ISSUE/RENEW) executed with master token in sf_core
  rpc ConnectionRequestToken(ConnectionTokenRequest) returns (ConnectionTokenResponse);
  // Heartbeat to validate connection and session are still alive
  rpc ConnectionHeartbeat(ConnectionHeartbeatRequest) returns (ConnectionHeartbeatResponse);

  // Statement operations
  rpc StatementNew(StatementNewRequest) returns (StatementNewResponse);
  rpc StatementRelease(StatementReleaseRequest) returns (StatementReleaseResponse);
  rpc StatementSetSqlQuery(StatementSetSqlQueryRequest) returns (StatementSetSqlQueryResponse);
  rpc StatementSetSubstraitPlan(StatementSetSubstraitPlanRequest) returns (StatementSetSubstraitPlanResponse);
  rpc StatementPrepare(StatementPrepareRequest) returns (StatementPrepareResponse);
  rpc StatementSetOptions(StatementSetOptionsRequest) returns (StatementSetOptionsResponse);
  rpc StatementGetParameterSchema(StatementGetParameterSchemaRequest) returns (StatementGetParameterSchemaResponse);
  rpc StatementExecuteQuery(StatementExecuteQueryRequest) returns (ExecuteQueryResponse);
  rpc StatementExecutePartitions(StatementExecutePartitionsRequest) returns (StatementExecutePartitionsResponse);
  rpc StatementReadPartition(StatementReadPartitionRequest) returns (StatementReadPartitionResponse);
  rpc StatementExecuteAsync(StatementExecuteAsyncRequest) returns (StatementExecuteAsyncResponse);

  // ResultSet operations
  rpc ResultSetGetStream(ResultSetGetStreamRequest) returns (ResultSetGetStreamResponse);
  rpc ResultSetGetChunks(ResultSetGetChunksRequest) returns (ResultSetGetChunksResponse);
  rpc ResultSetRelease(ResultSetReleaseRequest) returns (ResultSetReleaseResponse);

  // Config operations
  rpc ConfigLoadAllSections(ConfigLoadAllSectionsRequest) returns (ConfigLoadAllSectionsResponse);
  rpc ConfigGetPaths(ConfigGetPathsRequest) returns (ConfigGetPathsResponse);

  // Telemetry operations
  rpc TelemetrySendApiUsage(TelemetrySendApiUsageRequest) returns (TelemetrySendResponse);
  rpc TelemetrySendWrapperError(TelemetrySendWrapperErrorRequest) returns (TelemetrySendResponse);
}
