codecov:
  notify:
    wait_for_ci: true
    require_ci_to_pass: true

flag_management:
  default_rules:
    carryforward: false
    carryforward_mode: "all"

flags:
  rust:
    paths: ["sf_core/"]
    carryforward: false
  jdbc:
    paths: ["jdbc/", "jdbc_bridge/"]
    carryforward: false
  python:
    paths: ["pep249_dbapi/"]
    carryforward: false
  odbc:
    paths: ["odbc/"]
    carryforward: false
  core-from-odbc:
    carryforward: false
  core-from-python:
    carryforward: false
  rust-core:
    carryforward: false

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      # Overall status waits for all expected coverage flags
      default:
        target: auto
        threshold: 2%
        base: auto
        if_ci_failed: error
        flags: [rust, python, jdbc, odbc]
        flag_coverage_not_uploaded_behavior: exclude
      rust:
        target: auto
        threshold: 2%
        base: auto
        if_ci_failed: error
        flags: [rust]
      python:
        target: auto
        threshold: 2%
        base: auto
        if_ci_failed: error
        flags: [python]
      jdbc:
        target: auto
        threshold: 2%
        base: auto
        if_ci_failed: error
        flags: [jdbc]
      odbc:
        target: auto
        threshold: 2%
        base: auto
        if_ci_failed: error
        flags: [odbc]
        
    patch:
      # Overall patch status waits for all expected coverage flags
      default:
        target: 75%
        threshold: 5%
        base: auto
        if_ci_failed: error
        informational: true
        flags: [rust, python, jdbc, odbc]
        flag_coverage_not_uploaded_behavior: exclude
      rust:
        target: 75%
        threshold: 5%
        base: auto
        if_ci_failed: error
        informational: true
        flags: [rust]
      python:
        target: 75%
        threshold: 5%
        base: auto
        if_ci_failed: error
        informational: true
        flags: [python]
      jdbc:
        target: 75%
        threshold: 5%
        base: auto
        if_ci_failed: error
        informational: true
        flags: [jdbc]
      odbc:
        target: 75%
        threshold: 5%
        base: auto
        if_ci_failed: error
        informational: true
        flags: [odbc]

comment:
  layout: "header,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  branches: ["main", "develop"]
  show_carryforward_flags: true

ignore:
  # Test files and documentation
  - "tests/"
  - "tests/**/*"
  - "**/tests/"
  - "**/tests/**/*"
  - "**/*.md"
  - "odbc_tests/"
  - "odbc_tests/**/*"
  - "scripts/"
  
  # Specific test paths to exclude
  - "sf_core/tests/**"
  - "**/tests/common/**"
  - "tests/common/**"
  - "tests/tests_format_validator/**"
  
  # Build artifacts
  - "**/target/"
  - "**/build/"
  
  # Configuration files
  - "**/*.toml"
  - "**/*.lock"
  
  # Python artifacts
  - "**/__pycache__/"
  - "**/*.pyc"
  - "**/*.pyo"
  - "**/.pytest_cache/"
  - "**/.tox/"
  - "**/dist/"
  - "**/*.egg-info/"
  
  # Generated code
  - "**/thrift_gen/"
  - "**/gen-*/"
  
  # Java/Gradle artifacts
  - "**/.gradle/"
  - "**/gradlew*"
  - "**/*.class"
  
  # CMake artifacts
  - "**/CMakeCache.txt"
  - "**/CMakeFiles/"
  - "**/cmake_install.cmake"
  - "**/cmake-build/"
  
  # IDE and OS files
  - "**/.idea/"
  - "**/.vscode/"
  - "**/.DS_Store"
  - "**/*.swp"

github_checks:
  annotations: true
