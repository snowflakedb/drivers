codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
    require_ci_to_pass: true

flags:
  rust-core:
    paths: ["sf_core/**"]
    carryforward: true
  python:
    paths: ["python/src/snowflake/**"]
    carryforward: true
  jdbc:
    paths: ["jdbc/**"]
    carryforward: true
  odbc:
    paths: ["odbc/**"]
    carryforward: true
  nodejs:
    paths: ["nodejs/**"]
    carryforward: true
  dotnet:
    paths: ["dotnet/**"]
    carryforward: true
  gosnowflake:
    paths: ["gosnowflake/**"]
    carryforward: true



coverage:
  precision: 2
  round: down
  range: "60...90"
  
  status:
    project:
      default: off
      rust-core:
        target: auto
        threshold: 1%
        flags: [rust-core]
        flag_coverage_not_uploaded_behavior: exclude
      python:
        target: auto
        threshold: 1%
        flags: [python]
        flag_coverage_not_uploaded_behavior: exclude
      jdbc:
        target: auto
        threshold: 1%
        flags: [jdbc]
        flag_coverage_not_uploaded_behavior: exclude
      odbc:
        target: auto
        threshold: 1%
        flags: [odbc]
        flag_coverage_not_uploaded_behavior: exclude
      nodejs:
        target: auto
        threshold: 1%
        flags: [nodejs]
        flag_coverage_not_uploaded_behavior: exclude
      dotnet:
        target: auto
        threshold: 1%
        flags: [dotnet]
        flag_coverage_not_uploaded_behavior: exclude
      gosnowflake:
        target: auto
        threshold: 1%
        flags: [gosnowflake]
        flag_coverage_not_uploaded_behavior: exclude
    patch: off

comment:
  layout: "header,diff,flags,components,tree"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  branches: ["main", "develop"]
  show_carryforward_flags: false

component_management:
  individual_components:
    - component_id: rust-core
      name: "Rust Core"
      paths:
        - "sf_core/**"
    - component_id: python
      name: "Python Driver"
      paths:
        - "python/src/snowflake/**"
    - component_id: jdbc
      name: "JDBC Driver"
      paths:
        - "jdbc/**"
    - component_id: odbc
      name: "ODBC Driver"
      paths:
        - "odbc/**"
    - component_id: nodejs
      name: "Node.js Driver"
      paths:
        - "nodejs/**"
    - component_id: dotnet
      name: ".NET Driver"
      paths:
        - "dotnet/**"
    - component_id: gosnowflake
      name: "Go Driver"
      paths:
        - "gosnowflake/**"

fixes:
  - "com/snowflake/::jdbc/src/java/com/snowflake/"
  - "^src/snowflake/::python/src/snowflake/"

ignore:
  # Test files
  - "tests/**"
  - "**/tests/**"
  - "odbc_tests/**"
  - "jdbc/src/test/**"
  - "sf_core/tests/**"
  
  # Build artifacts
  - "**/target/"
  - "**/build/"
  
  # Generated code
  - "**/protobuf_gen/"
  - "**/gen-*/"
  
  # Configuration/documentation
  - "**/*.md"
  - "**/*.toml"
  - "**/*.lock"
  - "scripts/"

github_checks:
  annotations: true
