codecov:
  notify:
    wait_for_ci: true
    require_ci_to_pass: true

flags:
  rust-core:
    paths: ["sf_core/**"]
    carryforward: false
  python:
    paths: ["pep249_dbapi/**"]
    carryforward: false
  jdbc:
    paths: ["jdbc/**", "jdbc_bridge/**"]
    carryforward: false
  odbc:
    paths: ["odbc/**"]
    carryforward: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
      - type: patch
        target: 75%
        threshold: 5%
  individual_components:
    - component_id: rust-core
      name: "Rust Core"
      paths:
        - "sf_core/**"
    - component_id: python
      name: "Python Driver"
      paths:
        - "pep249_dbapi/**"
    - component_id: jdbc
      name: "JDBC Driver"
      paths:
        - "jdbc/**"
        - "jdbc_bridge/**"
    - component_id: odbc
      name: "ODBC Driver"
      paths:
        - "odbc/**"

coverage:
  precision: 2
  round: down
  range: "60...90"
  
  status:
    project:
      default:
        target: auto
        threshold: 1%
        flags: [rust-core, python, jdbc, odbc]
        flag_coverage_not_uploaded_behavior: exclude
      rust-core:
        target: auto
        threshold: 2%
        flags: [rust-core]
        flag_coverage_not_uploaded_behavior: exclude
      python:
        target: auto
        threshold: 2%
        flags: [python]
        flag_coverage_not_uploaded_behavior: exclude
      jdbc:
        target: auto
        threshold: 2%
        flags: [jdbc]
        flag_coverage_not_uploaded_behavior: exclude
      odbc:
        target: auto
        threshold: 2%
        flags: [odbc]
        flag_coverage_not_uploaded_behavior: exclude

comment:
  layout: "header,diff,flags,components,tree"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  branches: ["main", "develop"]
  # Show flags and components
  flags:
    - rust-core
    - python
    - jdbc
    - odbc
  show_carryforward_flags: true

ignore:
  # Test files and documentation
  - "tests/"
  - "tests/**/*"
  - "**/tests/"
  - "**/tests/**/*"
  - "**/*.md"
  - "odbc_tests/"
  - "odbc_tests/**/*"
  - "scripts/"
  
  # Specific test paths to exclude
  - "sf_core/tests/**"
  - "**/tests/common/**"
  - "tests/common/**"
  - "tests/tests_format_validator/**"
  
  # Build artifacts
  - "**/target/"
  - "**/build/"
  
  # Configuration files
  - "**/*.toml"
  - "**/*.lock"
  
  # Python artifacts
  - "**/__pycache__/"
  - "**/*.pyc"
  - "**/*.pyo"
  - "**/.pytest_cache/"
  - "**/.tox/"
  - "**/dist/"
  - "**/*.egg-info/"
  
  # Generated code
  - "**/thrift_gen/"
  - "**/gen-*/"
  
  # Java/Gradle artifacts
  - "**/.gradle/"
  - "**/gradlew*"
  - "**/*.class"
  
  # CMake artifacts
  - "**/CMakeCache.txt"
  - "**/CMakeFiles/"
  - "**/cmake_install.cmake"
  - "**/cmake-build/"
  
  # IDE and OS files
  - "**/.idea/"
  - "**/.vscode/"
  - "**/.DS_Store"
  - "**/*.swp"

github_checks:
  annotations: true