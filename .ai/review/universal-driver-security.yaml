id: universal-driver-security-rules
friendly_name: "Universal Driver Security Rules"
status: enabled
percentage_of_prs_reviewed: 100
allowed_folders:
  - "sf_core/src"
  - "odbc/src"
excluded_folders:
  - "sf_core/src/bin"
llm_model: "claude-sonnet-4-5"
allowed_file_extensions:
  - ".rs"
  - ".toml"
rules:
  - id: ud-sensitive-data-must-use-secret-string
    rule: |
      **OBJECTIVE**: Ensure all sensitive data (passwords, tokens, private keys, encryption keys, credentials) is wrapped in `SecretString` from the `secrecy` crate — never stored as plain `String`.

      **REQUIREMENT**: Any struct field, enum variant field, or variable that holds a password, token, private key, passphrase, secret key, or encryption key MUST use `SecretString` instead of `String`. This ensures:
      - Memory is zeroized on drop (OWASP ASVS 8.3.6)
      - Debug/Display output is redacted (shows `SecretString([REDACTED])` instead of the secret)
      - Accessing the raw value requires an explicit `.expose_secret()` call, preventing accidental logging

      Look for fields or variables whose names contain: `password`, `token`, `secret`, `private_key`, `passphrase`, `master_key`, `session_token`, `master_token`, `pat`, `credential`, or `encryption_key`. If they are typed as `String` or `Option<String>`, flag them.

      **EXCEPTIONS**:
      - Serde deserialization structs that represent raw JSON responses from Snowflake (e.g., `RefreshSessionData`, `AuthResponse`) may use `String` since they are intermediate — but the values MUST be wrapped in `SecretString` before being stored in long-lived structs.
      - Function parameters that receive already-exposed values for immediate use (e.g., passing to HTTP headers or crypto APIs) may use `&str` or `String`.
      - Test code is excluded from this rule.

      ❌ **BAD:**
      ```rust
      pub struct SessionTokens {
          pub session_token: String,
          pub master_token: String,
      }

      pub struct Credentials {
          pub aws_key_id: String,
          pub aws_secret_key: String,
          pub aws_token: String,
      }

      pub enum LoginMethod {
          Password { username: String, password: String },
      }
      ```

      ✅ **GOOD:**
      ```rust
      use secrecy::SecretString;

      pub struct SessionTokens {
          pub session_token: SecretString,
          pub master_token: SecretString,
      }

      pub struct Credentials {
          pub aws_key_id: String,
          pub aws_secret_key: SecretString,
          pub aws_token: SecretString,
      }

      pub enum LoginMethod {
          Password { username: String, password: SecretString },
      }
      ```

      **CONSTRUCTION**: Use `SecretString::from(value)` or `value.into()` when wrapping a `String`. For `&str`, use `SecretString::from(literal)`.
      **ACCESS**: Use `.expose_secret()` (from the `ExposeSecret` trait) to get `&str`.

  - id: ud-sensitive-debug-impl
    rule: |
      **OBJECTIVE**: Structs containing `SecretString` fields must have a `Debug` implementation that redacts the sensitive fields.

      **REQUIREMENT**: If a struct contains one or more `SecretString` fields, it MUST either:
      1. Use `#[derive(Debug)]` — acceptable because `SecretString` already redacts in its `Debug` impl (prints `SecretString([REDACTED])`), OR
      2. Implement `std::fmt::Debug` manually, printing `"***"` for each sensitive field for cleaner output.

      Flag only cases where a struct has a plain `String` field that holds sensitive data (based on the field name) AND uses `#[derive(Debug)]`.

      ❌ **BAD:**
      ```rust
      #[derive(Debug)]
      pub struct Credentials {
          pub aws_key_id: String,
          pub aws_secret_key: String,  // sensitive but plain String + derived Debug
      }
      ```

      ✅ **GOOD:**
      ```rust
      pub struct Credentials {
          pub aws_key_id: String,
          pub aws_secret_key: SecretString,
      }

      impl std::fmt::Debug for Credentials {
          fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
              f.debug_struct("Credentials")
                  .field("aws_key_id", &self.aws_key_id)
                  .field("aws_secret_key", &"***")
                  .finish()
          }
      }
      ```
