id: universal-driver-security-disclosure
friendly_name: "Universal Driver Security Disclosure Rules"
status: enabled
allowed_folders:
  - "."
  - "adr"
  - "doc"
  - "sf_core"
  - "python"
  - "nodejs"
  - "odbc"
  - "odbc_tests"
  - "jdbc"
  - "tests"
  - "error_trace"
  - "proto_utils"
  - "proto_generator"
  - "odbc_trace_tool"
  - "jdbc_bridge"
excluded_folders:
  - "NOMIRROR"
  - ".ai"
  - ".cursor"
  - ".claude"
  - ".buildkite"
  - ".ci"
  - ".github"
  - "ci"
  - "scripts"
allowed_file_extensions:
  - ".rs"
  - ".java"
  - ".py"
  - ".js"
  - ".ts"
  - ".cpp"
  - ".c"
  - ".h"
  - ".go"
  - ".toml"
  - ".md"
  - ".rst"
  - ".txt"
  - ".yaml"
  - ".yml"
rules:
  - id: ud-no-security-issue-disclosure-in-comments
    rule: |
      **OBJECTIVE**: Prevent code comments from disclosing exploitable weaknesses in
      older driver versions. Attackers monitor public repositories; a comment that
      explains *how* a past bug worked gives them a ready-made attack recipe against
      users who have not yet upgraded.

      **REQUIREMENT**: Flag any comment (inline `//`, `#`, block `/* */`, `/** */`,
      docstring, or changelog entry) that:

      1. Describes **how** a security issue could be triggered or exploited in a
         prior version (e.g. "before this fix, an attacker could forge X by sending
         Y", "versions < 2.3 accept any token here").
      2. Explains a bypass route or workaround around a security control
         (authentication, token validation, input sanitisation, TLS verification).
      3. Identifies a specific driver version or release as affected by a security
         weakness, in a way that tells readers where the vulnerability window is.

      **WHAT IS FINE**: Comments that describe *what* the correct behaviour is,
      *what* the fix does at a high level, or *why* a particular assertion or check
      is needed — without naming the attack vector or affected versions. For example,
      "validate the nonce to prevent replay attacks" is fine; "before 3.1.0, the
      nonce was not validated so replay was possible" is not.

      **SCOPE**: Also apply this rule to the PR title and description when reviewing
      the diff as a whole.

      ❌ **BAD (comment reveals attack vector and affected version range):**
      ```rust
      // Fix: older versions skipped signature verification on responses from
      // /session/token-request, so a MITM could inject an arbitrary session token.
      ```

      ✅ **GOOD (describes only the correct behaviour):**
      ```rust
      // Verify the signature on token-request responses.
      ```

  - id: ud-no-cwe-cve-vulnerability-descriptions
    rule: |
      **OBJECTIVE**: Keep CWE/CVE identifiers and verbose vulnerability descriptions
      out of the public codebase and PR descriptions. These identifiers are indexed
      by security scanners; their presence in source code or docs makes it trivial
      for attackers to cross-reference the exact weakness and target unpatched
      deployments.

      **REQUIREMENT**: Flag **any** occurrence of the following, with no exceptions:

      1. **CWE identifiers** — patterns matching `CWE-\d+` (case-insensitive),
         e.g. `CWE-89`, `CWE-79`, `CWE-367`, `cwe-416`. This includes inline
         comments, doc comments, changelogs, commit messages, and PR descriptions.
         There are no "educational" exceptions — even a generic mention like
         "CWE-295" without version context is flagged.
      2. **CVE identifiers** — patterns matching `CVE-\d{4}-\d+` (case-insensitive),
         e.g. `CVE-2024-12345`, `CVE-2025-46326`. Same blanket rule — no
         exceptions for context or framing.
      3. **Vulnerability category names or weakness descriptions** — e.g.
         "SQL injection", "buffer overflow", "path traversal vulnerability",
         "race condition vulnerability", "TOCTOU", "SSRF", "improper certificate
         validation". Flag these regardless of whether they are paired with a
         version, fix context, or used in an educational tone. The only acceptable
         phrasing describes the *correct behaviour* without naming the attack class
         (see examples below).

      **SCOPE**: Apply to all code files, documentation, changelogs, and — when
      reviewing the diff as a whole — to the PR title, description, and commit
      messages.

      ❌ **BAD:**
      ```
      // Fixes CWE-295: improper certificate validation in versions < 4.2
      // CVE-2024-98765: attacker-controlled redirect URI bypass
      // Prevent TOCTOU race condition (CWE-367)
      // Fix SQL injection in query builder
      ```

      ```markdown
      ## Security
      Addressed a SQL injection vulnerability (CWE-89) present in the query builder
      prior to this release.
      ```

      ✅ **GOOD:**
      ```
      // Enforce certificate validation on all outbound TLS connections.
      // Use atomic file operations to avoid interleaved reads.
      // Parameterise user-supplied values in the query builder.
      ```

      ```markdown
      ## Security
      Improved input handling in the query builder.
      ```

  - id: ud-security-fix-snow-ticket-only
    rule: |
      **OBJECTIVE**: The only cross-reference allowed in security-fix code and PRs
      is a `SNOW-\d+` Jira ticket number. All other vulnerability tracking
      identifiers must stay out of the public codebase.

      **REQUIREMENT**: When a code change fixes a security issue:

      1. The **only** acceptable tracking reference in code comments, doc comments,
         changelogs, commit messages, PR titles, and PR descriptions is a Snowflake
         Jira ticket in the form `SNOW-\d+` (e.g. `SNOW-12345`).
      2. Flag any other vulnerability tracking identifier used as a cross-reference,
         including but not limited to:
         - CVE identifiers (`CVE-\d{4}-\d+`)
         - CWE identifiers (`CWE-\d+`)
         - GHSA identifiers (`GHSA-[a-z0-9-]+`)
         - NVD links (`nvd.nist.gov/…`)
         - MITRE links (`cve.mitre.org/…`)
         - Snyk, OSV, or other advisory database references
      3. A bare `SNOW-\d+` with no vulnerability description is the ideal form:
         ```rust
         // SNOW-98765
         fn validate_token(…) { … }
         ```

      **SCOPE**: Apply to all code files, documentation, changelogs, and — when
      reviewing the diff as a whole — to the PR title, description, and commit
      messages.

      ❌ **BAD:**
      ```rust
      // Fix for CVE-2025-46326 (SNOW-98765)
      // See https://nvd.nist.gov/vuln/detail/CVE-2025-46326
      // GHSA-abcd-1234-efgh: token validation bypass
      ```

      ✅ **GOOD:**
      ```rust
      // SNOW-98765
      fn validate_token(…) { … }
      ```

  - id: ud-security-fix-minimal-comments
    scope: full-pr
    rule: |
      **OBJECTIVE**: Comments on security-fix code must be technical and minimal,
      and PR descriptions must frame security fixes as normal improvements or bug
      fixes. Verbose narration of what was wrong, why it was dangerous, or what
      the fix achieves from a security standpoint turns the comment or description
      into a disclosure.

      **REQUIREMENT**: Flag any comment in a security-related diff that:

      1. **Narrates the vulnerability** — phrases like "this fixes a vulnerability
         where…", "before this change, an attacker could…", "the old code was
         susceptible to…", "this patch addresses a security flaw in…".
      2. **Describes the attack vector or exploitation method** — e.g. "by sending a
         crafted payload", "via a man-in-the-middle", "through a forged redirect".
      3. **Explains the security impact** — e.g. "which could lead to remote code
         execution", "allowing privilege escalation", "enabling data exfiltration".
      4. **Labels the change as a security fix** — phrases like "security fix",
         "security patch", "vulnerability fix", "CVE fix", "hardening against".
         The change should look like normal code improvement.

      Also flag any PR title or description that uses the same prohibited phrasing
      listed above, or any of: "security", "vulnerability", "CVE", "CWE", "exploit",
      "attack", "patch" in a security-fix context.

      **WHAT IS ACCEPTABLE**: Short, technical comments that describe *what the code
      does*, not *what it prevents*:
      - `// Validate the redirect URI against the registered set.`
      - `// Use constant-time comparison for token matching.`
      - `// Bind parameters instead of string interpolation.`
      - A bare `SNOW-\d+` reference (see `ud-security-fix-snow-ticket-only`).

      **TONING TEMPLATE for PR descriptions**: When a PR description covers a
      security fix, write it as a toned improvement or bug fix using the same
      past-tense verb pattern as the changelog convention:

      ```
      Use the form: "[Fixed|Improved] [neutral behavior description]."
      - "Fixed an issue where connection tokens were not fully validated."
      - "Improved input handling in the query-parameter parser."
      Do NOT use: "security fix", "vulnerability", "exploit", "attack", "patch".
      ```

      ❌ **BAD — code comment:**
      ```rust
      // Security fix: validate the nonce to prevent replay attacks that could
      // allow session hijacking in multi-tenant environments.

      // This patch hardens the token exchange flow against MITM interception
      // by enforcing TLS certificate pinning on the OAuth callback.
      ```

      ❌ **BAD — PR description:**
      ```markdown
      ## Summary
      Security patch to fix a critical vulnerability in the authentication flow.
      ```

      ✅ **GOOD — code comment:**
      ```rust
      // Validate the nonce on token responses.

      // Enforce certificate pinning on the OAuth callback.
      ```

      ✅ **GOOD — PR description:**
      ```markdown
      ## Summary
      Fixed an issue where OAuth tokens were accepted without full validation.
      Improved certificate verification on the OAuth callback endpoint.
      ```
