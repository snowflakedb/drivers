# your_workspace/Cargo.toml
[workspace]
members = [
    "sf_core",
    "sf_mini_core",
    "sf_mini_core_static",
    "odbc",
    "jdbc_bridge",
    "proto_generator",
    "proto_utils",
    "sf_core/tests/common/arrow_deserialize_macro",
    "error_trace",
    "error_trace_derive",
    "odbc_trace_tool",
]
# tools/rustc-wrapper-arm64ec is a build-time helper for the arm64ec CI lane,
# not a runtime crate. Keep it out of the workspace so `cargo build` /
# `cargo test` on the workspace ignore it; it is built explicitly by the
# arm64ec lane in .github/workflows/_build-odbc-packages.yml and
# .github/workflows/_test-odbc.yml. See tools/rustc-wrapper-arm64ec/README.md.
exclude = ["tools/rustc-wrapper-arm64ec"]
resolver = "2"

[profile.release]
strip = true
opt-level = "z"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
strip = false

[profile.dev]
opt-level = 1
