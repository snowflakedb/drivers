# your_workspace/Cargo.toml
[workspace]
members = [
    "sf_core",
    "sf_types",
    "sf_output_format",
    "sf_params_spec",
    "sf_params_codegen",
    "sf_mini_core",
    "sf_mini_core_static",
    "odbc",
    "jdbc_bridge",
    "nodejs_bridge",
    "proto_generator",
    "proto_utils",
    "sf_core/tests/common/arrow_deserialize_macro",
    "error_trace",
    "error_trace_derive",
    "odbc_trace_tool",
    "python_bridge",
    "python_bridge/stub_gen",
]
resolver = "2"


[profile.release]
strip = true
# Optimized for speed over binary size, which matters on CPU-bound hot paths.
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
strip = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
debug = 0

# crates.io rustls-webpki 0.103.14+ requires aws-lc-rs ^1.18. See the copy
# under sf_core/third_party/rustls-webpki.
[patch.crates-io]
rustls-webpki = { path = "sf_core/third_party/rustls-webpki" }
