name: Cargo Cache
description: >
  Restore or save Cargo registry and target directory.
  Use mode=restore after checkout, mode=save at end of job.
  All branches save to cache. GitHub scopes caches per branch automatically.

inputs:
  mode:
    description: '"restore" to restore caches, "save" to save them'
    required: true
  shared-key:
    description: Unique key prefix for this job's target directory cache
    required: true
  target-dir:
    description: Path to the Rust target directory
    default: target
  lockfiles:
    description: Glob pattern for Cargo.lock files to include in cache key
    default: "**/Cargo.lock"
  # Cache-hit indicators captured from the restore invocation, passed back on save.
  # When either is 'true', the corresponding save step is skipped — avoids concurrent
  # writes racing on the same key (which produce benign but noisy "Unable to reserve
  # cache" warnings). The registry cache key is shared across all shared-keys in a given
  # OS, so the race is real on any workflow with multiple Rust jobs on the same OS.
  registry-cache-hit:
    description: Value of registry-cache-hit from the restore step. If 'true', skip the save.
    default: ''
  target-cache-hit:
    description: Value of target-cache-hit from the restore step. If 'true', skip the save.
    default: ''

outputs:
  rustc-hash:
    description: Short hash of the rustc version (included in target cache key)
    value: ${{ steps.rustc.outputs.hash }}
  registry-cache-key:
    description: Exact cache key used for Cargo registry (pass to save step)
    value: ${{ steps.keys.outputs.registry }}
  target-cache-key:
    description: Exact cache key used for target directory (pass to save step)
    value: ${{ steps.keys.outputs.target }}
  registry-cache-hit:
    description: "'true' if an exact registry cache-key hit was found on restore"
    value: ${{ steps.restore-registry.outputs.cache-hit }}
  target-cache-hit:
    description: "'true' if an exact target cache-key hit was found on restore"
    value: ${{ steps.restore-target.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # ── Shared: compute keys (runs in both modes) ──
    - name: Hash rustc version
      id: rustc
      shell: bash
      run: echo "hash=$(rustc -vV | (sha256sum 2>/dev/null || shasum -a 256) | cut -d' ' -f1 | head -c 16)" >> $GITHUB_OUTPUT

    - name: Compute cache keys
      id: keys
      shell: bash
      run: |
        LOCK_HASH="${{ hashFiles(inputs.lockfiles) }}"
        echo "registry=${{ runner.os }}-cargo-registry-${LOCK_HASH}" >> $GITHUB_OUTPUT
        echo "target=${{ runner.os }}-rust-${{ inputs.shared-key }}-${{ steps.rustc.outputs.hash }}-${LOCK_HASH}" >> $GITHUB_OUTPUT

    # ── Restore mode ──
    - name: Restore Cargo registry cache
      id: restore-registry
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.keys.outputs.registry }}
        restore-keys: ${{ runner.os }}-cargo-registry-

    - name: Restore Rust target cache
      id: restore-target
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.target-dir }}
        key: ${{ steps.keys.outputs.target }}
        restore-keys: |
          ${{ runner.os }}-rust-${{ inputs.shared-key }}-${{ steps.rustc.outputs.hash }}-
          ${{ runner.os }}-rust-${{ inputs.shared-key }}-

    # ── Save mode ──
    # Two-layer guard before calling actions/cache/save@v5 (which is the slow step — tar of
    # a multi-hundred-MB Windows cache can take 3+ minutes, and if reservation ultimately
    # fails we've wasted all that tar time):
    #
    #   1. inputs.*-cache-hit != 'true': skip if restore already saw an exact-key hit.
    #      Catches the common "cache is already warm for this lockfile" case.
    #
    #   2. lookup-only pre-check: cheap server roundtrip that checks if the key exists NOW,
    #      after the build phase. Catches the race where another concurrent job saved this
    #      key while our job was still building. Without this pre-check we'd tar for 3 min
    #      only to have actions/cache/save@v5 fail with "Unable to reserve cache".
    - name: Pre-save check — registry cache already exists?
      id: precheck-registry
      if: inputs.mode == 'save' && inputs.registry-cache-hit != 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.keys.outputs.registry }}
        lookup-only: true

    # continue-on-error on save steps: cache save is a CI optimisation, not a
    # correctness requirement. Failures here are typically transient — runner
    # disk fills up mid-tar (ENOSPC), GHA cache service throttling, network
    # blips, or another job winning the reservation race. Letting any of these
    # fail the build punishes a green test run for an infra hiccup. The next CI
    # run rebuilds from scratch (worst case) and the warning is still surfaced
    # in the job log via actions/cache/save's own `core.warning` calls.
    # ZSTD_NBTHREADS: defend against tar+zstdmt hangs.
    # We have observed cache saves stalling for 30+ minutes on the
    # `tar --use-compress-program zstdmt` step — most often when zstdmt
    # contends on its worker pool against many small files (cargo's target/
    # has tens of thousands), or when the runner is memory-pressured. Capping
    # zstd worker threads to 2 (default uses all cores) reduces the contention
    # window dramatically.
    #
    # NOTE: timeout-minutes is not supported on composite action steps (GHA
    # limitation), so the wall-clock kill-switch lives on the workflow-level
    # callers of this action — they wrap the whole composite invocation with
    # `timeout-minutes`. continue-on-error here turns any timeout into a
    # warning rather than a hard failure.
    - name: Save Cargo registry cache
      if: inputs.mode == 'save' && inputs.registry-cache-hit != 'true' && steps.precheck-registry.outputs.cache-hit != 'true'
      continue-on-error: true
      env:
        ZSTD_NBTHREADS: '2'
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.keys.outputs.registry }}

    - name: Pre-save check — target cache already exists?
      id: precheck-target
      if: inputs.mode == 'save' && inputs.target-cache-hit != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.target-dir }}
        key: ${{ steps.keys.outputs.target }}
        lookup-only: true

    # Slim the target/ tree before save: cargo accumulates regenerable artifacts
    # that bloat the cache without speeding up cross-runner builds. Without this
    # cleanup, target caches routinely grow to 5-9 GB, producing 3-5 minute cache
    # download/extract steps that often cancel any speedup the cache was meant to
    # provide.
    #
    # What we remove:
    # - incremental/: per-build incremental-compilation state. Useful for repeated
    #   builds in the same workspace, useless across fresh CI runners. This is the
    #   single biggest contributor (often multi-GB).
    # - *.d: dependency-tracking files cargo rewrites on every build.
    #
    # What we keep:
    # - deps/*.rlib, deps/*.rmeta: compiled dependency artifacts (the cache value).
    # - .fingerprint/: cargo uses these to decide which restored artifacts are
    #   fresh. Without them cargo conservatively recompiles, defeating the cache.
    # - build/*/output: build script outputs (some are expensive, e.g. bindgen).
    - name: Slim target dir before cache save
      if: inputs.mode == 'save' && inputs.target-cache-hit != 'true' && steps.precheck-target.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        target_dir="${{ inputs.target-dir }}"
        if [ ! -d "$target_dir" ]; then
          echo "target dir not present, skipping slim"
          exit 0
        fi
        size_before=$(du -sh "$target_dir" 2>/dev/null | cut -f1 || echo "?")
        # Use a while/read loop with find, which is portable across GNU find (Linux),
        # BSD find (macOS), and Git Bash find (Windows). The find ... -prune -exec rm
        # pattern has subtle implementation differences between these and is unreliable
        # for directory deletion in CI; this loop is explicit and predictable.
        while IFS= read -r dir; do
          [ -n "$dir" ] && rm -rf "$dir"
        done < <(find "$target_dir" -type d -name 'incremental' 2>/dev/null)
        find "$target_dir" -type f -name '*.d' -delete 2>/dev/null || true
        size_after=$(du -sh "$target_dir" 2>/dev/null | cut -f1 || echo "?")
        echo "Slimmed ${target_dir}: ${size_before} -> ${size_after}"

    # See comment above on Save Cargo registry cache: cache save is best-effort,
    # ZSTD_NBTHREADS prevents zstdmt thread thrash, and the wall-clock timeout
    # is enforced by the workflow-level callers (composite steps don't support
    # timeout-minutes).
    - name: Save Rust target cache
      if: inputs.mode == 'save' && inputs.target-cache-hit != 'true' && steps.precheck-target.outputs.cache-hit != 'true'
      continue-on-error: true
      env:
        ZSTD_NBTHREADS: '2'
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.target-dir }}
        key: ${{ steps.keys.outputs.target }}
