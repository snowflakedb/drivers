name: Setup FIPS build environment
description: Install and verify the native toolchain used by FIPS smoke and artifact builds.

inputs:
  msvc-arch:
    description: Architecture passed to the MSVC environment setup on Windows.
    required: false
    default: x64

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.x'
        cache: false

    - name: Install CMake 3
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        CMAKE_VENV="$RUNNER_TEMP/cmake-venv"
        python3 -m venv "$CMAKE_VENV"
        "$CMAKE_VENV/bin/python" -m pip install --upgrade pip >/dev/null
        "$CMAKE_VENV/bin/pip" install 'cmake>=3,<4'
        cmake_bin="$CMAKE_VENV/bin/cmake"
        "$cmake_bin" --version | grep '^cmake version 3\.'
        echo "$CMAKE_VENV/bin" >> "$GITHUB_PATH"
        echo "CMAKE=$cmake_bin" >> "$GITHUB_ENV"

    - name: Install GCC 13
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # GitHub-hosted ubuntu images enable packages.microsoft.com; that
        # mirror 403s (SNOW-4342752) and fails `apt-get update` before gcc-13
        # installs. FIPS builds do not need those packages.
        sudo rm -f /etc/apt/sources.list.d/*microsoft*.list \
          /etc/apt/sources.list.d/*microsoft*.sources
        for attempt in 1 2 3; do
          if sudo apt-get update; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "apt-get update exhausted 3 attempts" >&2
            exit 1
          fi
          echo "apt-get update failed (attempt ${attempt}/3); retrying..." >&2
          sleep $((15 * attempt))
        done
        for attempt in 1 2 3; do
          if sudo apt-get install --yes gcc-13 g++-13; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "apt-get install exhausted 3 attempts" >&2
            exit 1
          fi
          echo "apt-get install failed (attempt ${attempt}/3); retrying..." >&2
          sleep $((15 * attempt))
        done
        echo "CC=gcc-13" >> "$GITHUB_ENV"
        echo "CXX=g++-13" >> "$GITHUB_ENV"
        # GCC's aarch64 jump tables contain `.word (label - label) / 4`.
        # The AWS-LC FIPS 3.6.0 delocator grammar has no division operator,
        # so that form fails while writing bcm-delocated.S.
        if [ "$(uname -m)" = "aarch64" ]; then
          echo "CFLAGS=-fno-jump-tables" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-fno-jump-tables" >> "$GITHUB_ENV"
        fi
        gcc-13 --version
        g++-13 --version

    - name: Select Apple Clang
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        clang --version | grep 'Apple clang'
        clang++ --version | grep 'Apple clang'
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "CXX=clang++" >> "$GITHUB_ENV"

    - name: Configure Windows FIPS tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        python -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE" }
        python -m pip install "cmake>=3,<4"
        $cmakeDir = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
        $cmakeExe = Join-Path $cmakeDir "cmake.exe"
        if (-not (Test-Path $cmakeExe)) {
          throw "CMake executable not found at $cmakeExe"
        }
        "CMAKE=$cmakeExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $env:CMAKE = $cmakeExe

        # aws-lc-fips-sys runs vcvarsall.bat on every Windows FIPS build.
        # vcvarsall prepends its directories with `set PATH=...;%PATH%`, and
        # cmd.exe rejects that assignment past 8191 characters. The runner
        # image puts unrelated toolchains on PATH; combined with the MSVC
        # prefix plus the directories Cargo and npm add later, the nested
        # call no longer fits. Strawberry\c\bin, Git\ucrt64, and mingw64
        # also ship gcc, which shadows cl.exe.
        $drop = @(
          '\\Strawberry\\c\\bin\\?$'
          '\\Git\\ucrt64\\'
          '\\mingw64\\'
          '\\MongoDB\\'
          '\\aliyun-cli\\?$'
          '\\NSIS\\'
          '\\tools\\zstd\\?$'
          '\\Mercurial\\'
          '\\hostedtoolcache\\windows\\stack\\'
          '\\cabal\\'
          '\\ghcup\\'
          '\\MySQL\\'
          '\\R\\R-'
          '\\SeleniumWebDrivers\\'
          '\\sbt\\'
          '\\pipx_bin\\?$'
          '\\go\\1\.24'
          '\\Python\\3\.12'
          '\\Ruby\\'
          '\\kotlinc\\'
          '\\Java_Temurin'
          '\\ImageMagick'
          '\\Azure\\CLI'
          '\\ProgramData\\kind\\?$'
          '\\Web Platform Installer\\'
          '\\TortoiseSVN\\'
          'SQL Server\\'
          '\\Windows Performance Toolkit\\'
          'WiX Toolset'
          '\\pulumi\\'
          '\\apache-maven'
          'Service Fabric'
          '\\ServiceFabric'
          '\\tools\\php\\?$'
          '\\Amazon\\'
          '\\mongosh\\'
          '\(x86\)\\LLVM\\'
          '\\\.dotnet\\tools\\?$'
          '\\Program Files\\dotnet\\?$'
          '\\WindowsApps\\?$'
        ) -join '|'
        $seen = @{}
        $paths = foreach ($dir in ($env:PATH -split ';')) {
          if (-not $dir -or $dir -match $drop) { continue }
          $key = $dir.TrimEnd('\').ToLowerInvariant()
          if ($seen.ContainsKey($key)) { continue }
          $seen[$key] = $true
          $dir
        }
        if (Test-Path "C:\Strawberry\perl\bin") {
          $paths = @("C:\Strawberry\perl\bin") + $paths
        }
        # When nasm.exe is still absent, this downloads a pinned zip.
        # The Chocolatey community feed is not used; it has returned 406,
        # 503, and 504 for the nasm package.
        $nasmDir = "C:\Program Files\NASM"
        $nasmOnPath = $false
        foreach ($dir in $paths) {
          if (Test-Path (Join-Path $dir.TrimEnd('\') "nasm.exe")) {
            $nasmOnPath = $true
            break
          }
        }
        if (-not $nasmOnPath) {
          if (-not (Test-Path (Join-Path $nasmDir "nasm.exe"))) {
            $nasmVersion = "2.16.03"
            $nasmZipName = "nasm-$nasmVersion-win64.zip"
            $nasmZip = Join-Path $env:RUNNER_TEMP $nasmZipName
            $nasmUrl = "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/$nasmZipName"
            $nasmSha256 = "3EE4782247BCB874378D02F7EAB4E294A84D3D15F3F6EE2DE2F47A46AA7226E6"
            $ProgressPreference = "SilentlyContinue"
            Invoke-WebRequest -Uri $nasmUrl -OutFile $nasmZip
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $nasmZip).Hash
            if ($actualSha256 -ne $nasmSha256) {
              throw "NASM zip SHA256 $actualSha256 did not match $nasmSha256"
            }
            $nasmExtract = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion"
            Expand-Archive -Path $nasmZip -DestinationPath $nasmExtract -Force
            $nasmExe = Get-ChildItem -Path $nasmExtract -Recurse -Filter nasm.exe |
              Select-Object -First 1
            if (-not $nasmExe) {
              throw "nasm.exe is required for the Windows FIPS build"
            }
            $nasmDir = $nasmExe.DirectoryName
          }
          if (-not (Test-Path (Join-Path $nasmDir "nasm.exe"))) {
            throw "nasm.exe is required for the Windows FIPS build"
          }
          $paths = @($nasmDir) + $paths
        }
        $env:PATH = $paths -join ';'

        $libclang = Get-ChildItem "C:\Program Files\LLVM\bin\libclang.dll" -ErrorAction SilentlyContinue |
          Select-Object -First 1
        if (-not $libclang) {
          throw "libclang.dll not found under C:\Program Files\LLVM\bin"
        }
        $libclangPath = $libclang.DirectoryName
        $env:PATH = "$libclangPath;$env:PATH"
        "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $env:LIBCLANG_PATH = $libclangPath

        foreach ($tool in @('perl.exe', 'nasm.exe', 'clang.exe')) {
          if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
            throw "$tool is required for the Windows FIPS build"
          }
        }
        perl --version
        nasm -version
        clang --version

    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-msvc
      with:
        arch: ${{ inputs.msvc-arch }}

    - name: Setup OpenSSL (Windows x64)
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-windows-openssl
      with:
        arch: x86_64
        linkage: dynamic

    - name: Verify Windows build tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($tool in @('ninja.exe', 'go.exe', 'cl.exe', 'perl.exe', 'nasm.exe', 'clang.exe')) {
          if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
            throw "$tool is required for the Windows FIPS build"
          }
        }
        if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH "libclang.dll"))) {
          throw "libclang.dll is missing from LIBCLANG_PATH"
        }
        $cmakeVersion = & $env:CMAKE --version
        if ($cmakeVersion[0] -notmatch '^cmake version 3\.') {
          throw "Expected CMake 3.x, got: $($cmakeVersion[0])"
        }
        $cmakeVersion
        ninja --version
        go version
        cl

        # vcvarsall prepends about 1600 characters. The Node addon build adds
        # about 2500 more (npm shims and Cargo's aws-lc-fips-sys artifact
        # directories) before that crate runs vcvarsall again. cmd.exe rejects
        # the resulting `set PATH=` line past 8191 characters.
        $maxPathChars = 8191 - 1600 - 2500
        if ($env:PATH.Length -gt $maxPathChars) {
          throw "PATH is $($env:PATH.Length) characters; nested vcvarsall.bat needs it at or below $maxPathChars"
        }
