name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PYTHON_REFERENCE_DRIVER_VERSION: "3.10.1"

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install llvm-cov
        run: cargo +stable install cargo-llvm-cov

      - name: Install unixodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run coverage
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo llvm-cov --workspace --all-targets --all-features --output-path ./lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Not required for public repos
          files: ./lcov.info
          fail_ci_if_error: false

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install rustfmt
        run: rustup component add rustfmt
        
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install clippy
        run: rustup component add clippy
        
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  
  thrift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate thrift
        uses: ./.github/actions/generate-thrift

      - name: Check thrift files are up-to-date
        run: git diff --exit-code
        
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unixodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Check
        run: cargo check --workspace

      - name: Build
        run: cargo build --workspace

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Test
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo test --workspace

  odbc_tests_reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev curl odbcinst
          wget https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-linux-x86_64.sh
          sudo sh cmake-4.0.3-linux-x86_64.sh --skip-license --prefix=/usr/local
          sudo rm cmake-4.0.3-linux-x86_64.sh
          cmake --version
          curl -O https://sfc-repo.snowflakecomputing.com/odbc/linux/3.9.0/snowflake-odbc-3.9.0.x86_64.deb
          sudo dpkg -i snowflake-odbc-3.9.0.x86_64.deb
          sudo sed -i 's,ODBCInstLib=.*,ODBCInstLib=/usr/lib/x86_64-linux-gnu/libodbcinst.so.2,g' /usr/lib/snowflake/odbc/lib/simba.snowflake.ini

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run ODBC tests
        run: |
          export DRIVER_PATH=/usr/lib/snowflake/odbc/lib/libSnowflake.so
          export PARAMETER_PATH=$(pwd)/parameters.json
          cd odbc_tests/
          mkdir -p cmake-build
          cmake -B cmake-build \
              -D ODBC_LIBRARY="/usr/lib/x86_64-linux-gnu/libodbc.so" \
              -D ODBC_INCLUDE_DIR="/usr/include" \
              .
          cmake --build cmake-build -- -j $(nproc)
          ctest -C Debug --test-dir cmake-build --output-on-failure

  odbc_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev build-essential
          wget https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-linux-x86_64.sh
          sudo sh cmake-4.0.3-linux-x86_64.sh --skip-license --prefix=/usr/local
          sudo rm cmake-4.0.3-linux-x86_64.sh
          cmake --version

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Build Rust ODBC driver
        run: cargo build

      - name: Build and run ODBC tests
        run: |
          ls -l target/debug/
          export DRIVER_PATH=$(pwd)/target/debug/libsfodbc.so
          export PARAMETER_PATH=$(pwd)/parameters.json
          cd odbc_tests
          mkdir -p cmake-build
          cmake -B cmake-build \
              -D ODBC_LIBRARY="/usr/lib/x86_64-linux-gnu/libodbc.so" \
              -D ODBC_INCLUDE_DIR="/usr/include" \
              .
          cmake --build cmake-build -- -j $(nproc)
          ctest -C Debug --test-dir cmake-build --output-on-failure


  # Build Rust core library once and share across Python jobs
  build_rust_core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Build Rust core library
        run: cargo build --package sf_core

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-library
          path: target/debug/libsf_core.so

  # Combined unit + integration tests with universal connector
  test_universal:
    needs: build_rust_core
    strategy:
      fail-fast: false
      matrix: 
        py: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: ${{ matrix.py }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.py }}-${{ hashFiles('pep249_dbapi/pyproject.toml','tox.ini') }}
      
      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-core-library
          path: target/debug/

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run all tests (unit + integration)
        env:
          SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          # Run all tests once and extract integration results for comparison
          make all-universal PY=${{ matrix.py }} REPORTS_DIR=reports
        working-directory: pep249_dbapi
      
      - uses: actions/upload-artifact@v4
        with:
          name: results-universal-${{ matrix.py }}
          path: pep249_dbapi/reports/*-${{ matrix.py }}.*

  # Integration tests only with reference connector (for comparison)
  test_reference:
    needs: build_rust_core
    strategy:
      fail-fast: false
      matrix: 
        py: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: ${{ matrix.py }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.py }}-${{ hashFiles('pep249_dbapi/pyproject.toml','tox.ini') }}
      
      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-core-library
          path: target/debug/

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run integration tests only (for comparison)
        env:
          SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          PYTHON_REFERENCE_DRIVER_VERSION: ${{ env.PYTHON_REFERENCE_DRIVER_VERSION }}
        run: make integ-reference PY=${{ matrix.py }} REPORTS_DIR=reports REF_VERSION=$PYTHON_REFERENCE_DRIVER_VERSION
        working-directory: pep249_dbapi
      
      - uses: actions/upload-artifact@v4
        with:
          name: results-reference-${{ matrix.py }}
          path: pep249_dbapi/reports/*-${{ matrix.py }}.*

  # Compare results between connectors
  compare_results:
    needs: [test_universal, test_reference]
    strategy:
      fail-fast: false
      matrix: 
        py: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: 
          name: results-universal-${{ matrix.py }}
          path: universal-results
      - uses: actions/download-artifact@v4
        with: 
          name: results-reference-${{ matrix.py }}
          path: reference-results
      - name: Compare & summarize
        env:
          UNIVERSAL_DIR: universal-results
          REFERENCE_DIR: reference-results
          FAIL_ON_REGRESSIONS: "0"   # flip to "1" when you're ready to gate
        run: make compare-artifacts PY=${{ matrix.py }} | tee -a $GITHUB_STEP_SUMMARY
        working-directory: pep249_dbapi

  jdbc_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Build Rust components
        run: |
          cargo build --package sf_core
          cargo build --package jdbc_bridge

      - name: Make gradlew executable
        run: chmod +x jdbc/gradlew

      - name: Run JDBC tests
        run: |
          ls -l target/debug/
          export PARAMETER_PATH=$(pwd)/parameters.json
          export CORE_PATH=$(pwd)/target/debug/libjdbc_bridge.so
          cd jdbc
          ./gradlew test --stacktrace
