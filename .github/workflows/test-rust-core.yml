name: Rust Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install rustfmt
        run: rustup component add rustfmt && cargo fmt --version
        
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install clippy
        run: rustup component add clippy
        
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust-version: ['stable']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          cargo +stable install cargo-llvm-cov

      - name: Check
        run: cargo check --workspace

      - name: Build
        run: cargo build --workspace

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Test
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          export RUSTFLAGS="-C instrument-coverage"
          export LLVM_PROFILE_FILE="rust-%p-%m.profraw"
          cargo test --workspace

      - name: Collect coverage
        run: |
          # Generate coverage report from test execution
          LLVM_PROFDATA=$(find ~/.rustup -name "llvm-profdata" -type f 2>/dev/null | head -1)
          LLVM_COV=$(find ~/.rustup -name "llvm-cov" -type f 2>/dev/null | head -1)
          find . -name "rust-*.profraw" -type f | xargs $LLVM_PROFDATA merge -sparse -o coverage.profdata
          
          SF_CORE_BINARIES=$(find target/debug/deps -name "sf_core-*" -type f -executable 2>/dev/null)
          $LLVM_COV export $SF_CORE_BINARIES \
              -instr-profile=coverage.profdata \
              -format=lcov \
              -sources=$(pwd)/sf_core > lcov-${{ matrix.os }}-${{ matrix.rust-version }}.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./lcov-${{ matrix.os }}-${{ matrix.rust-version }}.info
          flags: rust
          name: rust-${{ runner.os }}-${{ matrix.rust-version }}
          fail_ci_if_error: false


