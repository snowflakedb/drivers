name: Rust Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install rustfmt
        run: rustup component add rustfmt && cargo fmt --version
        
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install clippy
        run: rustup component add clippy
        
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust-version: ['stable']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          cargo +stable install cargo-llvm-cov

      - name: Check
        run: cargo check --workspace

      - name: Build
        run: RUSTFLAGS="-C instrument-coverage" cargo build --workspace

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run tests and collect coverage
        run: |
          echo "=== Debug: Starting test and coverage collection ==="
          export PARAMETER_PATH=$(pwd)/parameters.json
          export LLVM_PROFILE_FILE="rust-%p-%m.profraw"
          
          echo "Environment variables:"
          echo "PARAMETER_PATH: $PARAMETER_PATH"
          echo "LLVM_PROFILE_FILE: $LLVM_PROFILE_FILE"
          
          echo "=== Running tests ==="
          cargo test --workspace
          
          echo "=== Debug: After tests, checking for profraw files ==="
          find . -name "*.profraw" -type f | head -10
          
          echo "=== Finding LLVM tools ==="
          LLVM_PROFDATA=$(find ~/.rustup -name "llvm-profdata" -type f 2>/dev/null | head -1)
          LLVM_COV=$(find ~/.rustup -name "llvm-cov" -type f 2>/dev/null | head -1)
          
          echo "LLVM_PROFDATA: $LLVM_PROFDATA"
          echo "LLVM_COV: $LLVM_COV"
          
          if [ -z "$LLVM_PROFDATA" ] || [ -z "$LLVM_COV" ]; then
            echo "ERROR: LLVM tools not found!"
            exit 1
          fi
          
          echo "=== Merging profraw files ==="
          PROFRAW_FILES=$(find . -name "rust-*.profraw" -type f)
          echo "Found profraw files: $PROFRAW_FILES"
          
          if [ -z "$PROFRAW_FILES" ]; then
            echo "ERROR: No rust-*.profraw files found!"
            exit 1
          fi
          
          find . -name "rust-*.profraw" -type f | xargs $LLVM_PROFDATA merge -sparse -o coverage.profdata
          
          echo "=== Finding sf_core binaries ==="
          SF_CORE_BINARIES=$(find target/debug/deps -name "sf_core-*" -type f -executable 2>/dev/null)
          echo "Found sf_core binaries: $SF_CORE_BINARIES"
          
          if [ -z "$SF_CORE_BINARIES" ]; then
            echo "ERROR: No sf_core binaries found!"
            echo "Listing target/debug/deps:"
            ls -la target/debug/deps/ | grep sf_core || echo "No sf_core files found"
            exit 1
          fi
          
          echo "=== Generating coverage report ==="
          $LLVM_COV export $SF_CORE_BINARIES \
              -instr-profile=coverage.profdata \
              -format=lcov \
              -sources=$(pwd)/sf_core > lcov-${{ matrix.os }}-${{ matrix.rust-version }}.info
          
          echo "=== Coverage report generated ==="
          ls -la lcov-${{ matrix.os }}-${{ matrix.rust-version }}.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./lcov-${{ matrix.os }}-${{ matrix.rust-version }}.info
          flags: rust
          name: rust-${{ runner.os }}-${{ matrix.rust-version }}
          fail_ci_if_error: false


