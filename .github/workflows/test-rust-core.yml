name: Rust Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel).
  # Using github.run_id (not github.ref) for the fallback so back-to-back main pushes don't cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  # Format job intentionally has no Rust target cache: `cargo fmt --check` does not
  # compile the crate, it only parses source files. A cache would add restore overhead
  # for no benefit. Keep this job lightweight; it finishes in under 30 seconds.
  format:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_rust_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rustfmt
        run: rustup component add rustfmt && cargo fmt --version

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_rust_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "clippy"

      - name: Install clippy
        run: rustup component add clippy

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "clippy"

  build-without-protobuf:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_rust_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "no-protobuf"

      - name: Build sf_core without protobuf feature
        run: cargo build --package sf_core --no-default-features --features fips

      # Compile-test the test code too: catches test modules that use protobuf types
      # without a `#[cfg(feature = "protobuf")]` guard. --no-run skips execution so
      # this lane stays fast (it's a compile-only lane by design) and doesn't need
      # PARAMETER_PATH / network access.
      - name: Compile tests without protobuf feature
        run: cargo test --no-run --package sf_core --no-default-features --features fips

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "no-protobuf"

  test:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_rust_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust-version: ['stable']
    runs-on: ${{ matrix.os }}
    env:
      E2E_TLS_SERVER: https://snowflakecomputing.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go (required by aws-lc-fips-sys)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "core-test"

      - name: Capture rustc version for tarpaulin cache key
        id: rustc-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache tarpaulin binary
        id: tarpaulin-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: tarpaulin-${{ runner.os }}-${{ steps.rustc-version.outputs.version }}

      - name: Install tarpaulin
        if: steps.tarpaulin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      # Two-phase tarpaulin invocation (build, then run) provides clearer CI signal:
      # a failure in "Build" → compilation error; a failure in "Run tests" → test failure.
      # --skip-clean ensures the second invocation reuses the first's build artifacts.
      # The generated lcov.info is intentionally not uploaded from GHA — Codecov uploads
      # are handled by ci/Jenkinsfile.coverage (see `uploadToCodecov` calls there).
      - name: Build sf_core with tarpaulin
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo tarpaulin --packages sf_core --all-features --skip-clean --no-fail-fast --no-run --out lcov --output-dir .

      - name: Run tests with coverage
        id: run_rust_tests
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo tarpaulin --packages sf_core --all-features --skip-clean --no-fail-fast --out lcov --output-dir .

      - name: Rerun tests with coverage
        if: steps.run_rust_tests.outcome == 'failure' && github.event_name == 'merge_group'
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo tarpaulin --packages sf_core --all-features --skip-clean --no-fail-fast --out lcov --output-dir .

      - name: Cleanup test PATs
        if: always()
        continue-on-error: true
        run: |
          python -m pip install snowflake-connector-python -q
          python scripts/cleanup_test_pats.py \
            --parameter-path $(pwd)/parameters.json

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "core-test"

  # Non-FIPS ARM64 build and test.
  # On windows-11-arm, --all-features fails for aarch64-pc-windows-msvc with:
  #   library machine type 'x64' conflicts with target machine type 'ARM64'
  # Evidence points to aws-lc-fips-sys Windows build env setup:
  # builder/printenv.bat calls vcvarsall.bat x64, overriding ARM64 toolchain env.
  # Workaround: do not enable fips on this lane.
  # Upstream issue: https://github.com/aws/aws-lc-rs/issues/1057
  # Repro job: https://github.com/snowflakedb/universal-driver/actions/runs/22779459689/job/66081199710
  # TODO: re-enable --all-features after fix.
  # The test suite is identical with and without fips — no tests are gated
  # behind cfg(feature = "fips"). Only the linked TLS crypto backend differs
  # (aws-lc-sys vs aws-lc-fips-sys).
  test_windows_arm64_nonfips:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_rust_core == 'true'
    runs-on: windows-11-arm
    name: test (Windows ARM64, non-FIPS)
    env:
      E2E_TLS_SERVER: https://snowflakecomputing.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "arm64-nonfips"

      - name: Capture vcpkg version for cache key
        uses: ./.github/actions/vcpkg-version

      - name: Restore vcpkg ARM64 OpenSSL cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\vcpkg\installed\arm64-windows
          key: windows-11-arm-vcpkg-openssl-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          :: Build native ARM64 OpenSSL from source. The pre-installed OpenSSL is
          :: x64-only (no static libs, DLLs cause error 193 at runtime).
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows

      - name: Save vcpkg ARM64 OpenSSL cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\vcpkg\installed\arm64-windows
          key: windows-11-arm-vcpkg-openssl-${{ env.VCPKG_VER }}

      - name: Configure OpenSSL
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows\lib" >> $env:GITHUB_ENV
          # Add vcpkg bin to PATH so ARM64 OpenSSL DLLs are found at runtime
          echo "C:\vcpkg\installed\arm64-windows\bin" >> $env:GITHUB_PATH

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Build and test
        id: run_rust_tests_windows_arm64
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        shell: cmd
        run: |
          :: Set up ARM64 MSVC environment
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          set PARAMETER_PATH=${{ github.workspace }}\parameters.json

          :: Guard: verify MSVC env targets ARM64
          if not "%VSCMD_ARG_TGT_ARCH%"=="arm64" (
            echo ERROR: VSCMD_ARG_TGT_ARCH is '%VSCMD_ARG_TGT_ARCH%', expected 'arm64'
            exit /b 1
          )

          cargo build --package sf_core --target aarch64-pc-windows-msvc
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

          :: Guard: verify sf_core.dll is ARM64
          dumpbin /headers target\aarch64-pc-windows-msvc\debug\sf_core.dll | findstr "AA64" >nul
          if %ERRORLEVEL% neq 0 (
            echo ERROR: sf_core.dll is not ARM64
            dumpbin /headers target\aarch64-pc-windows-msvc\debug\sf_core.dll | findstr "machine"
            exit /b 1
          )

          :: Copy ARM64 OpenSSL DLLs next to test binaries so Windows finds them
          copy "C:\vcpkg\installed\arm64-windows\bin\libcrypto-3-arm64.dll" target\aarch64-pc-windows-msvc\debug\deps\ 2>nul
          copy "C:\vcpkg\installed\arm64-windows\bin\libssl-3-arm64.dll" target\aarch64-pc-windows-msvc\debug\deps\ 2>nul
          cargo test --package sf_core --target aarch64-pc-windows-msvc -- --nocapture

      - name: Rerun tests (Windows ARM64)
        if: steps.run_rust_tests_windows_arm64.outcome == 'failure' && github.event_name == 'merge_group'
        shell: cmd
        run: |
          :: Full re-setup (not just cargo test) so reruns work even if the first run failed
          :: before reaching cargo test (e.g., build failure, DLL copy missed). Matches the
          :: first-run steps above.
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          set PARAMETER_PATH=${{ github.workspace }}\parameters.json

          if not "%VSCMD_ARG_TGT_ARCH%"=="arm64" (
            echo ERROR: VSCMD_ARG_TGT_ARCH is '%VSCMD_ARG_TGT_ARCH%', expected 'arm64'
            exit /b 1
          )

          cargo build --package sf_core --target aarch64-pc-windows-msvc
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

          copy "C:\vcpkg\installed\arm64-windows\bin\libcrypto-3-arm64.dll" target\aarch64-pc-windows-msvc\debug\deps\ 2>nul
          copy "C:\vcpkg\installed\arm64-windows\bin\libssl-3-arm64.dll" target\aarch64-pc-windows-msvc\debug\deps\ 2>nul
          cargo test --package sf_core --target aarch64-pc-windows-msvc -- --nocapture

      # Post-mortem diagnostics for Windows ARM64 failures: ARM64-specific build issues
      # (wrong architecture DLLs, missing OpenSSL, MSVC env not targeting ARM64) are
      # frequent and hard to debug from CI logs alone. Capture a small bundle for offline
      # inspection without uploading the full multi-GB target/ tree.
      - name: Collect Windows ARM64 failure diagnostics
        if: failure()
        shell: cmd
        run: |
          mkdir windows-arm64-diagnostics 2>nul
          :: Environment snapshot (VCVARS, toolchain, paths)
          set > windows-arm64-diagnostics\env-dump.txt 2>&1
          :: Target directory listing (inspect which artifacts were built, sizes, dates)
          dir /s target\aarch64-pc-windows-msvc\debug > windows-arm64-diagnostics\target-listing.txt 2>&1
          :: OpenSSL DLLs present next to deps?
          dir target\aarch64-pc-windows-msvc\debug\deps\*.dll > windows-arm64-diagnostics\deps-dlls.txt 2>&1
          :: sf_core.dll architecture header
          where dumpbin >nul 2>&1 && dumpbin /headers target\aarch64-pc-windows-msvc\debug\sf_core.dll > windows-arm64-diagnostics\sf_core-headers.txt 2>&1

      - name: Upload Windows ARM64 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-diagnostics
          path: windows-arm64-diagnostics/
          if-no-files-found: warn
      - name: Cleanup test PATs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install snowflake-connector-python -q
          python scripts/cleanup_test_pats.py \
            --parameter-path "${{ github.workspace }}/parameters.json"

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "arm64-nonfips"

  rust-core-status:
    needs: [detect-changes, format, clippy, build-without-protobuf, test, test_windows_arm64_nonfips]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Rust Core CI Status ==="
          
          # Check if tests were skipped
          if [[ "${{ needs.test.result }}" == "skipped" ]]; then
            echo "✓ Rust Core tests were SKIPPED (no relevant changes detected)"
            echo "  - run_rust_core: ${{ needs.detect-changes.outputs.run_rust_core }}"
            exit 0
          fi
          
          # Check if any job failed or was cancelled
          if [[ "${{ needs.format.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.clippy.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.build-without-protobuf.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test_windows_arm64_nonfips.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Rust Core tests were RUN and FAILED or CANCELLED"
            echo "  - format: ${{ needs.format.result }}"
            echo "  - clippy: ${{ needs.clippy.result }}"
            echo "  - build-without-protobuf: ${{ needs.build-without-protobuf.result }}"
            echo "  - test: ${{ needs.test.result }}"
            echo "  - test_windows_arm64_nonfips: ${{ needs.test_windows_arm64_nonfips.result }}"
            exit 1
          fi
          
          # Tests ran and passed
          echo "✓ Rust Core tests were RUN and PASSED"
          exit 0
