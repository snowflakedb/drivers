name: Rust Core CI

on:
  # Every event is orchestrated by driver-status.yml, which resolves the
  # suites to run and invokes only the affected driver workflows.
  workflow_call:
    inputs:
      run_rust_core:
        description: "Run Rust Core tests."
        type: boolean
        required: false
        default: false

concurrency:
  # Group by PR number for PRs; fall back to run ID for push-to-main and
  # merge_group runs (each run is unique so they won't cancel each other).
  #
  # The prefix is a literal, not ${{ github.workflow }}: inside a workflow_call
  # the github context belongs to the caller, so github.workflow would resolve
  # to "Driver CI" and put this run in the orchestrator's own group. GitHub
  # reads that as a deadlock and fails the call before any job starts.
  group: rust-core-ci-${{ github.event.pull_request.number || github.run_id }}
  # Cancel only in-flight PR runs. Unrelated labels must not replace the
  # matrix; push-to-main must never cancel a sibling run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || contains(fromJSON('["ci:scope-merge-queue","ci:scope-merge","ci:scope-nightly"]'), github.event.label.name)) }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Generate the test matrix from ci/test_matrix/models/core.pict at workflow
  # run time. Pattern mirrors load-odbc-matrix in test-odbc.yml and
  # load-python-matrix in test-python.yml. Outputs:
  #   - matrix:              full active set (unfiltered, JSON array). Useful
  #                          for diagnostics; not directly consumed below.
  #   - test_matrix:         JSON array filtered to ubuntu-latest / macos-latest
  #                          lanes, fed into the `test` job's strategy.matrix.include.
  #                          Each entry has rust-version='stable' merged in so the
  #                          existing matrix dimension is preserved.
  #   - windows_arm_active:  'true' if pict includes the windows-arm-nonfips lane.
  #   - windows_x86_active:  'true' if pict includes the windows-x86 lane.
  #   - windows_arm_cloud:   cloud_provider of the windows-arm-nonfips lane
  #                          (single source of truth from the model; the job is
  #                          non-matrixed so it can't read matrix.cloud_provider).
  #                          Falls back to 'aws' when the lane is absent.
  #   - windows_x86_cloud:   cloud_provider of the windows-x86 lane (same scheme).
  load-core-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      test_matrix: ${{ steps.split.outputs.test_matrix }}
      windows_arm_active: ${{ steps.split.outputs.windows_arm_active }}
      windows_x86_active: ${{ steps.split.outputs.windows_x86_active }}
      windows_arm_cloud: ${{ steps.split.outputs.windows_arm_cloud }}
      windows_x86_cloud: ${{ steps.split.outputs.windows_x86_cloud }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python ci/test_matrix/generate_matrix.py \
            --driver core --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --emit-active \
            >> "$GITHUB_OUTPUT"
      - id: split
        env:
          FULL: ${{ steps.read.outputs.matrix }}
        run: |
          # Linux/macOS lanes feed `test` job's strategy.matrix.include. Inject
          # rust-version='stable' so the existing matrix dimension survives the
          # switch from the static `os: [...] × rust-version: [...]` shape.
          echo "test_matrix=$(printf '%s' "$FULL" | jq -c '[.[] | select(.os == "ubuntu-latest" or .os == "macos-latest") | . + {"rust-version": "stable"}]')" >> "$GITHUB_OUTPUT"
          # Per-lane boolean gates for the dedicated Windows jobs (no matrix; we
          # just skip the whole job if pict didn't include the lane on this trigger).
          echo "windows_arm_active=$(printf '%s' "$FULL" | jq -r '[.[] | select(.name == "windows-arm-nonfips")] | length > 0')" >> "$GITHUB_OUTPUT"
          echo "windows_x86_active=$(printf '%s' "$FULL" | jq -r '[.[] | select(.name == "windows-x86")] | length > 0')" >> "$GITHUB_OUTPUT"
          # Cloud of each windows lane, threaded through as a scalar so the
          # non-matrixed windows jobs derive their cloud from the model rather
          # than hardcoding it. Fall back to 'aws' when the lane isn't present
          # (job is skipped via the *_active gate in that case anyway).
          echo "windows_arm_cloud=$(printf '%s' "$FULL" | jq -r 'map(select(.name == "windows-arm-nonfips"))[0].cloud_provider // "aws"')" >> "$GITHUB_OUTPUT"
          echo "windows_x86_cloud=$(printf '%s' "$FULL" | jq -r 'map(select(.name == "windows-x86"))[0].cloud_provider // "aws"')" >> "$GITHUB_OUTPUT"

  load-fips-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python ci/test_matrix/generate_matrix.py \
            --driver core_fips --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --emit-active \
            >> "$GITHUB_OUTPUT"

  # Format job intentionally has no Rust target cache: `cargo fmt --check` does not
  # compile the crate, it only parses source files. A cache would add restore overhead
  # for no benefit. Keep this job lightweight; it finishes in under 30 seconds.
  format:
    if: inputs.run_rust_core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install rustfmt
        run: rustup component add rustfmt && cargo fmt --version

      - name: Check formatting
        run: cargo fmt --all -- --check

  # std-only crate: no Snowflake credentials, no llvm-cov. Kept off the sf_core
  # coverage lane so the lcov report stays scoped to `--package sf_core`.
  test_sf_params_spec:
    if: inputs.run_rust_core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run sf_params_spec tests
        run: cargo test --locked --package sf_params_spec

  fips_smoke:
    needs: load-fips-matrix
    if: inputs.run_rust_core && needs.load-fips-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-fips-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: fips smoke (${{ matrix.name }})
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space-linux

      - name: Setup FIPS build environment
        uses: ./.github/actions/setup-fips-build-env
        with:
          msvc-arch: ${{ matrix.msvc_arch || 'x64' }}

      - name: Restore Rust cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: ${{ matrix.cache_key }}

      - name: Build sf_core with FIPS
        run: cargo build --locked --package sf_core --no-default-features --features fips,protobuf

      - name: Compile FIPS smoke tests
        run: cargo test --locked --no-run --lib --package sf_core --no-default-features --features fips,protobuf

      - name: Expose Windows FIPS DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $crypto = Get-ChildItem target -Recurse -Filter "aws_lc_fips_*_crypto.dll"
          $wrapper = Get-ChildItem target -Recurse -Filter "aws_lc_fips_*_rust_wrapper.dll"
          if (-not $crypto) {
            throw "AWS-LC-FIPS crypto DLL was not produced"
          }
          if (-not $wrapper) {
            throw "AWS-LC-FIPS Rust wrapper DLL was not produced"
          }
          (@($crypto) + @($wrapper)) |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique |
            ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Run FIPS smoke tests
        # Exclude CRL tests that fetch public URLs; local CRL fixtures remain covered.
        run: >-
          cargo test --locked --lib --package sf_core --no-default-features --features fips,protobuf --
          tls:: crypto:: auth:: rest::snowflake::oauth:: file_manager::encryption crl::
          rest::snowflake::workload_identity::aws config::private_key
          --skip crl::disk_tests::disk_crl_tests::test_crl_parsing_performance
          --skip crl::disk_tests::disk_crl_tests::test_disk_cache_read_and_half_life_refresh
          --skip crl::cache::tests::should_warn_when_file_permission_check_is_disabled

      - name: Decode cloud parameters
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/decode_secrets.sh aws parameters_aws.json
          ./scripts/decode_secrets.sh azure parameters_azure.json
          ./scripts/decode_secrets.sh gcp parameters_gcp.json
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Run FIPS connectivity smoke
        shell: bash
        run: |
          set -euo pipefail
          # Git Bash prepends its usr/bin, whose link.exe is GNU coreutils.
          # cargo looks up link.exe for the MSVC target, so the directory
          # vcvarsall added has to come first or the e2e binary does not link.
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            if [[ -z "${VCToolsInstallDir:-}" || -z "${VSCMD_ARG_HOST_ARCH:-}" || -z "${VSCMD_ARG_TGT_ARCH:-}" ]]; then
              echo "MSVC environment is not configured" >&2
              exit 1
            fi
            tools_dir="${VCToolsInstallDir%\\}"
            tools_dir="${tools_dir%/}"
            msvc_bin="$(cygpath -u "${tools_dir}/bin/Host${VSCMD_ARG_HOST_ARCH}/${VSCMD_ARG_TGT_ARCH}")"
            if [[ ! -x "${msvc_bin}/link.exe" ]]; then
              echo "MSVC link.exe is not at ${msvc_bin}" >&2
              exit 1
            fi
            export PATH="${msvc_bin}:${PATH}"
          fi
          for cloud in aws azure gcp; do
            echo "FIPS connectivity smoke: ${cloud}"
            export PARAMETER_PATH="$(pwd)/parameters_${cloud}.json"
            cargo test --locked --test e2e_tests --package sf_core \
              --no-default-features --features fips,protobuf \
              on_a_fips_build
          done

      - name: Clean up python_bridge artifacts from target
        if: always()
        shell: bash
        run: cargo clean --package python_bridge 2>/dev/null || true

      - name: Save Rust cache
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: ${{ matrix.cache_key }}
          slim-mode: aggressive
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  fips_artifacts:
    needs: load-fips-matrix
    if: inputs.run_rust_core && needs.load-fips-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-fips-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: fips artifacts (${{ matrix.name }})
    # Release artifacts retain the workspace's thin LTO and single codegen unit.
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_STRIP: 'false'
      # Set before any Cargo invocation, including napi's metadata/build calls.
      RUSTFLAGS: ${{ startsWith(matrix.os, 'ubuntu') && '-C link-arg=-Wl,--undefined-version' || '' }}
      SF_CORE_FIPS: '1'
      SF_CORE_RELEASE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space-linux

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup FIPS build environment
        uses: ./.github/actions/setup-fips-build-env
        with:
          msvc-arch: ${{ matrix.msvc_arch || 'x64' }}

      - name: Install unixODBC development files
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes unixodbc-dev

      - name: Install unixODBC development files (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install unixodbc
          odbc_prefix="$(brew --prefix unixodbc)"
          echo "ODBC_PREFIX=$odbc_prefix" >> "$GITHUB_ENV"

      - name: Test FIPS artifact inspection scripts
        run: python -m unittest discover -s ci/fips -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Match test-nodejs.yml: npm 10 has an install bug, and this library
      # intentionally does not commit package-lock.json.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install Node.js dependencies
        working-directory: nodejs
        run: npm install

      - name: Configure release artifact paths
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          rustc = subprocess.check_output(["rustc", "-vV"], text=True)
          target = next(line.removeprefix("host: ") for line in rustc.splitlines() if line.startswith("host: "))
          release_dir = Path("target", target, "release").resolve()
          release_dir.mkdir(parents=True, exist_ok=True)
          library = {"linux": "libsfodbc.so", "darwin": "libsfodbc.dylib", "win32": "sfodbc.dll"}[sys.platform]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              # napi always passes an explicit target. Use the same layout for
              # ODBC and the final Windows cargo rustc link to reuse dependencies.
              print(f"CARGO_BUILD_TARGET={target}", file=env)
              print(f"ODBC_ARTIFACT={release_dir / library}", file=env)
              if sys.platform == "win32":
                  # A unique /MAP argument forces a fresh final link on cache hits.
                  map_dir = Path(tempfile.mkdtemp(prefix="fips-odbc-map-"))
                  print(f"ODBC_LINKER_MAP={map_dir / 'sfodbc.map'}", file=env)
                  print(f"SF_CORE_LINKER_MAP={release_dir / 'nodejs_bridge.map'}", file=env)

      - name: Restore Rust artifact cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: ${{ matrix.cache_key }}-artifacts

      - name: Build release FIPS ODBC library
        if: runner.os != 'Windows'
        run: cargo build --locked --release --lib --package odbc --features fips

      - name: Build release FIPS ODBC library with linker map
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo rustc --locked --release --lib --package odbc --features fips -- -C "link-arg=/MAP:$env:ODBC_LINKER_MAP"

      # ODBC and Node use the same target/profile/FIPS dependency, so these
      # DLLs are available before unit globalSetup builds the Node addon.
      - name: Expose Windows FIPS DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path "target" "$env:CARGO_BUILD_TARGET/release"
          $crypto = Get-ChildItem $releaseDir -Recurse -Filter "aws_lc_fips_*_crypto.dll"
          $wrapper = Get-ChildItem $releaseDir -Recurse -Filter "aws_lc_fips_*_rust_wrapper.dll"
          if (-not $crypto) {
            throw "AWS-LC-FIPS crypto DLL was not produced"
          }
          if (-not $wrapper) {
            throw "AWS-LC-FIPS Rust wrapper DLL was not produced"
          }
          (@($crypto) + @($wrapper)) |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique |
            ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      # Build and link the addon so the inspection below resolves it the same
      # way src/core/index.ts does.
      - name: Build Node.js addon
        working-directory: nodejs
        run: npm run build:core && npm run build:link-local

      - name: Inspect linked crypto
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          package_dir = Path("nodejs/_build/snowflake-sdk-core")
          package = json.loads((package_dir / "package.json").read_text(encoding="utf-8"))
          # Resolve the linked package just as src/core/index.ts does, rather
          # than inspecting an unrelated target/ DLL or a stale .node copy.
          node_artifact = subprocess.check_output(
              ["node", "-p", f"require.resolve({json.dumps(package['name'])})"],
              cwd="nodejs",
              text=True,
          ).strip()
          if Path(node_artifact).resolve() != (package_dir / package["main"]).resolve():
              raise RuntimeError("Node.js did not resolve the freshly built FIPS addon")
          for artifact, linker_map in (
              (os.environ["ODBC_ARTIFACT"], os.environ.get("ODBC_LINKER_MAP")),
              (node_artifact, os.environ.get("SF_CORE_LINKER_MAP")),
          ):
              command = [sys.executable, "ci/fips/check_linked_crypto.py", artifact]
              if sys.platform == "win32":
                  command.extend(["--linker-map", linker_map])
              subprocess.run(command, check=True)

      - name: Clean up Windows ODBC linker map
        if: always() && runner.os == 'Windows' && env.ODBC_LINKER_MAP != ''
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import shutil

          shutil.rmtree(Path(os.environ["ODBC_LINKER_MAP"]).parent)

      - name: Save Rust artifact cache
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: ${{ matrix.cache_key }}-artifacts
          slim-mode: aggressive
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  # sf_output_format e2e parity (real cloud session formats). Not part of the
  # sf_core llvm-cov matrix; `--features e2e` is the only path that pulls sf_core in.
  date_output_format_parity:
    if: inputs.run_rust_core && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_CLOUD_PROVIDER: aws
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        uses: ./.github/actions/free-disk-space-linux

      - name: Install Go (required by aws-lc-fips-sys)
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Restore Rust cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "core-test"

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh aws
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Run date output format parity
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo test --locked -p sf_output_format --features e2e --test date_output_format_parity -- --ignored

      - name: Clean up python_bridge artifacts from target
        if: always()
        run: cargo clean --package python_bridge 2>/dev/null || true

      - name: Save Rust cache
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "core-test"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  test:
    needs: load-core-matrix
    if: inputs.run_rust_core && needs.load-core-matrix.outputs.test_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-core-matrix.outputs.test_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      E2E_TLS_SERVER: https://snowflakecomputing.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Reclaim ~25 GB on ubuntu-latest before cache extract / compile.
      # See .github/actions/free-disk-space-linux/action.yml for rationale.
      # cargo-llvm-cov builds coverage-instrumented integration test binaries
      # that statically link the full dep tree — `target/debug/deps/` routinely
      # exceeds the ~14 GB free on `/` and hits ENOSPC at link time without
      # this cleanup. macOS lanes are skipped: ample disk, no equivalent bloat.
      - name: Free runner disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space-linux

      - name: Restore Rust cache
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: ${{ matrix.cache_key }}

      - name: Capture rustc version for coverage tool cache key
        id: rustc-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      # cargo-llvm-cov uses rustc's native source-based coverage (-C instrument-coverage).
      # Migrated from cargo-tarpaulin (PR ref: TBD) because tarpaulin's binary instrumentation
      # produced 13+ GB target/ trees that exceeded GitHub-hosted runner disk budgets and
      # caused intermittent cache-restore freezes (tar+zstd deadlock on ENOSPC). llvm-cov is
      # the de-facto standard in the Rust ecosystem since 2024 — same lcov output format,
      # smaller artifacts (~3-5 GB target/), faster builds.
      - name: Cache cargo-llvm-cov binary
        id: llvm-cov-cache
        # Cache failures never fail the job — fall back to fresh `cargo install`.
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ steps.rustc-version.outputs.version }}

      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        # --locked uses Cargo.lock for reproducible installs.
        run: cargo install cargo-llvm-cov --locked

      # Per-test retries need nextest (libtest has none). taiki-e/install-action
      # is blocked by the org allow-list, so fetch the same pre-built binary
      # Windows jobs already install from get.nexte.st.
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          dest="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$dest"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=linux ;;
            Linux-aarch64) target=linux-arm ;;
            Darwin-arm64|Darwin-x86_64) target=mac ;;
            *) echo "unsupported host $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -LsSf "https://get.nexte.st/latest/${target}" | tar zxf - -C "$dest"
          cargo nextest --version

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      # cargo-llvm-cov flag semantics + combination rules:
      #
      #   `cargo llvm-cov ... --no-report`  → build instrumented binaries + run tests +
      #                                       accumulate coverage data; skip report.
      #                                       Implicitly disables the pre-build clean
      #                                       so subsequent invocations merge coverage.
      #   `cargo llvm-cov report --lcov`    → emit lcov from accumulated coverage data;
      #                                       no build, no run.
      #
      # MUTUALLY EXCLUSIVE flags (the CLI rejects any pair of these):
      #   --no-report, --no-clean, --no-run
      # All three are "skip a phase" modifiers and only one applies at a time. In
      # particular, do NOT combine `--no-report --no-clean` (rejected at runtime)
      # — `--no-report` already implies the clean-skip per the upstream README:
      #   "[clean] behavior is disabled when --no-clean, --no-report, or
      #    --no-run is passed".
      #
      # Unlike tarpaulin's clean two-phase build/run separation, llvm-cov forces
      # build+run into a single invocation. So there's no separate "build" step
      # below — `Run tests with coverage` builds AND runs. Compile errors vs.
      # test failures are still readable in cargo's own output.
      #
      # The generated lcov.info is intentionally not uploaded from GHA; coverage
      # reporting is owned by the dedicated internal Jenkins coverage pipeline,
      # which surfaces results as Jenkins build status + archived artifacts —
      # no external upload.
      - name: Run tests with coverage
        id: run_rust_tests
        # Expose `cloud_provider` so test code can gate on it (e.g.,
        # skip Azure-only tests on `aws`/`gcp` lanes).
        env:
          TEST_CLOUD_PROVIDER: ${{ matrix.cloud_provider }}
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo llvm-cov --locked --no-report --package sf_core ${{ matrix.cargo_flags }} \
            nextest --profile ci --no-fail-fast

      - name: Run flaky tests (non-blocking)
        continue-on-error: true
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo llvm-cov --locked --no-report --no-fail-fast --package sf_core ${{ matrix.cargo_flags }} \
            -- --ignored flaky_

      # mitmproxy (mitmdump) is the live external proxy for both proxy lanes below:
      # the nightly `large_` multipart round-trip and the every-run single-request
      # e2e. Installed before both so the nightly `large_` step finds it on PATH;
      # `mitmdump --version` fails the step loudly if pipx installed off-PATH.
      - name: Install mitmproxy (live-proxy e2e)
        if: matrix.os == 'ubuntu-latest' && (matrix.cloud_provider == 'aws' || matrix.cloud_provider == 'azure' || matrix.cloud_provider == 'gcp')
        run: |
          pipx install 'mitmproxy>=11,<13'
          mitmdump --version

      # Long-running tests: real-cloud tests that are too slow for every PR but
      # must pass on nightly. Tests opt in by being #[ignore]d AND carrying `large_`
      # in the name (parallel to the `flaky_` convention above, but blocking —
      # a failure here turns the nightly red). Scoped to schedule + aws/azure/gcp
      # now that GCS multipart support has landed (SNOW-3704984, stacked PR #643)
      # alongside Azure (SNOW-3704958). put_get_multipart_roundtrip exercises S3 on
      # aws, Azure block-blob on azure, and GCS resumable on gcp via each lane's
      # decoded account; put_get_multipart_proxy_live_mitm re-runs that round-trip
      # through mitmdump (installed above) to prove multipart transits the proxy.
      # No per-cloud test code either way.
      # Step-level timeout caps blast radius against the job's 45-min budget.
      - name: Run long-running tests (nightly, aws + azure + gcp)
        if: github.event_name == 'schedule' && (matrix.cloud_provider == 'aws' || matrix.cloud_provider == 'azure' || matrix.cloud_provider == 'gcp')
        timeout-minutes: 25
        env:
          TEST_CLOUD_PROVIDER: ${{ matrix.cloud_provider }}
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo llvm-cov --locked --no-report --package sf_core ${{ matrix.cargo_flags }} \
            -- --ignored large_

      # Real PUT/GET through a genuine mitmdump proxy (see PR description for why).
      # Runs whenever this job runs (PR, push, schedule) — the test itself is ~4s;
      # the only real cost is the shared compile the coverage step above already pays.
      # Filters on the `mitmdump_proxy` substring in the test *names* (not the
      # `proxy_live_mitm` file path), so a file rename can't make this match nothing.
      - name: Run live-proxy e2e tests (aws + azure + gcp)
        if: matrix.os == 'ubuntu-latest' && (matrix.cloud_provider == 'aws' || matrix.cloud_provider == 'azure' || matrix.cloud_provider == 'gcp')
        timeout-minutes: 15
        env:
          TEST_CLOUD_PROVIDER: ${{ matrix.cloud_provider }}
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cargo llvm-cov --locked --no-report --package sf_core ${{ matrix.cargo_flags }} \
            -- --ignored mitmdump_proxy

      # Report step is best-effort and gated on actually having coverage data. If the
      # build/run step failed at compilation (before any test ran), target/llvm-cov-target/
      # contains no *.profraw files; running `cargo llvm-cov report` then fails with
      # "not found *.profraw files". The shell guard checks first and emits a clean
      # skip message instead.
      #
      # Scope the report to `--package sf_core` so llvm-cov does not walk
      # uninstrumented workspace crates (jdbc_bridge, odbc, …) at 0%.
      # Do NOT pass ${{ matrix.cargo_flags }} (`--all-features`, `--features`,
      # `--no-default-features`): `llvm-cov report` rejects those options.
      # Coverage data was already collected by the build/run step with those flags.
      - name: Generate lcov coverage report
        if: always()
        continue-on-error: true
        run: |
          if find target/llvm-cov-target -name '*.profraw' 2>/dev/null | grep -q .; then
            cargo llvm-cov report --locked --package sf_core --lcov --output-path lcov.info
            echo "lcov report written to lcov.info (scoped to sf_core)"
          else
            echo "No *.profraw files in target/llvm-cov-target — skipping report"
            echo "(this is expected if the build failed before any test executed)"
          fi

      # NOTE: profraw/profdata cleanup and llvm-cov-target/ removal happen inside
      # the cargo-cache action's slim step (with slim-mode: aggressive below).
      # Workspace test binaries are also stripped — they're rebuilt from cached
      # deps/*.rlib on the next run in 1-2 min, vs caching ~50+ GB of stale
      # instrumented binaries. This is the single biggest win for keeping the
      # coverage cache under the 6 GB cap.

      - name: Clean up python_bridge artifacts from target
        if: always()
        run: cargo clean --package python_bridge 2>/dev/null || true

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: ${{ matrix.cache_key }}
          # Aggressive slim: this is the coverage job, where instrumented test
          # binaries dominate target/ size. Drop them before save; deps remain
          # cached so the next run rebuilds workspace tests in 1-2 min.
          slim-mode: aggressive
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  # Non-FIPS ARM64 build and test.
  # On windows-11-arm, fips fails for aarch64-pc-windows-msvc with:
  #   library machine type 'x64' conflicts with target machine type 'ARM64'
  # Evidence points to aws-lc-fips-sys Windows build env setup:
  # builder/printenv.bat calls vcvarsall.bat x64, overriding ARM64 toolchain env.
  # This lane keeps fips disabled.
  # Upstream issue: https://github.com/aws/aws-lc-rs/issues/1057
  # Repro job: https://github.com/snowflakedb/drivers/actions/runs/22779459689/job/66081199710
  # The FIPS smoke matrix excludes Windows ARM because it is not a supported
  # FIPS release target.
  # Coverage note: fips_smoke runs the TLS, crypto, auth, OAuth, stage-encryption,
  # CRL, AWS WIF and private-key unit paths with fips enabled. Its cloud e2e
  # smoke also checks TLS status and a negotiated FIPS suite, AES-encrypted JWT
  # login, 3DES/legacy PEM rejection, multi-chunk results, CRL-enabled SELECT 1
  # and a small PUT/GET round-trip. Those e2e checks and FIPS-only unit assertions
  # require a FIPS build; this non-FIPS lane instead exercises the standard
  # backend, including its support for the legacy private-key formats.
  test_windows_arm64_nonfips:
    needs: load-core-matrix
    if: inputs.run_rust_core && needs.load-core-matrix.outputs.windows_arm_active == 'true'
    runs-on: windows-11-arm
    name: test (Windows ARM64, non-FIPS)
    timeout-minutes: 60
    env:
      E2E_TLS_SERVER: https://snowflakecomputing.com
      # Shrink target/ so the cache save clears the action's 6 GB cap (see the
      # `Save Rust cache` step below). Workspace crates and test targets are the only
      # things still carrying full debug info — dependencies are already at debug = 0
      # via `[profile.dev.package."*"]` in the root Cargo.toml — and on MSVC that info
      # lands in .pdb files as large as the binaries themselves. line-tables-only keeps
      # file/line resolution in panic backtraces, which is all CI triage needs.
      # DEV covers workspace libs (cargo builds dependencies-of-tests with `dev`);
      # TEST covers the test targets themselves (`test` profile inherits `dev`).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Rust cache
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "arm64-nonfips"

      - name: Setup OpenSSL (Windows ARM64)
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: arm64
          linkage: dynamic

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ needs.load-core-matrix.outputs.windows_arm_cloud }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}
        shell: bash

      - name: Setup MSVC environment (ARM64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: arm64

      # Direct binary download from upstream redirector. taiki-e/install-action
      # is blocked by the org allow-list, so we install the same pre-built
      # binary it would fetch. windows-arm-tar ships the aarch64-pc-windows-msvc
      # build for the windows-11-arm host.
      - name: Install cargo-nextest (Windows ARM64 host)
        shell: bash
        run: |
          set -euo pipefail
          # Use $HOME (POSIX, forward slashes on Git Bash) — $USERPROFILE is a
          # Windows backslash path that mingw tar can't handle.
          dest="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$dest"
          curl -LsSf https://get.nexte.st/latest/windows-arm-tar | tar zxf - -C "$dest"
          cargo nextest --version

      # Single compile pass in the test profile; the `Run tests` step below
      # reuses these artifacts. Splitting build and test across cargo profiles
      # would recompile the whole dependency tree twice.
      - name: Compile (test profile, no run)
        shell: cmd
        run: cargo nextest run --locked --no-run --package sf_core --target aarch64-pc-windows-msvc

      # sf_core's cdylib isn't built by `cargo test`, so check a test binary
      # instead — same target triple, so same arch proof.
      - name: Verify test binaries are ARM64
        shell: cmd
        run: |
          set "TEST_EXE="
          for %%f in (target\aarch64-pc-windows-msvc\debug\deps\integration_tests-*.exe) do (
            if not defined TEST_EXE set "TEST_EXE=%%f"
          )
          if not defined TEST_EXE (
            echo ERROR: integration_tests binary not found under target\aarch64-pc-windows-msvc\debug\deps\
            dir target\aarch64-pc-windows-msvc\debug\deps\
            exit /b 1
          )
          echo Checking machine type of %TEST_EXE%
          dumpbin /headers "%TEST_EXE%" | findstr "AA64" >nul
          if %ERRORLEVEL% neq 0 (
            echo ERROR: %TEST_EXE% is not ARM64
            dumpbin /headers "%TEST_EXE%" | findstr "machine"
            exit /b 1
          )

      - name: Stage ARM64 OpenSSL DLLs next to test binaries
        shell: cmd
        run: |
          copy "C:\vcpkg\installed\arm64-windows\bin\libcrypto-3-arm64.dll" target\aarch64-pc-windows-msvc\debug\deps\ 2>nul
          copy "C:\vcpkg\installed\arm64-windows\bin\libssl-3-arm64.dll" target\aarch64-pc-windows-msvc\debug\deps\ 2>nul

      # `--no-fail-fast` matches `cargo test`'s default of running all tests
      # even after a failure (nextest's default is to stop after the first).
      - name: Run tests
        id: run_rust_tests_windows_arm64
        shell: cmd
        env:
          TEST_CLOUD_PROVIDER: ${{ needs.load-core-matrix.outputs.windows_arm_cloud }}
        run: |
          set PARAMETER_PATH=${{ github.workspace }}\parameters.json
          cargo nextest run --locked --profile ci --package sf_core --target aarch64-pc-windows-msvc --no-fail-fast

      - name: Run flaky tests (non-blocking)
        continue-on-error: true
        shell: cmd
        env:
          TEST_CLOUD_PROVIDER: ${{ needs.load-core-matrix.outputs.windows_arm_cloud }}
        run: |
          set PARAMETER_PATH=${{ github.workspace }}\parameters.json
          cargo nextest run --locked --profile ci-flaky --package sf_core --target aarch64-pc-windows-msvc --run-ignored ignored-only -E "test(/^flaky_/)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-core-tests-windows-arm64
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Upload flaky test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-core-flaky-tests-windows-arm64
          path: target/nextest/ci-flaky/junit.xml
          if-no-files-found: warn

      # Post-mortem diagnostics for Windows ARM64 failures: ARM64-specific build issues
      # (wrong architecture DLLs, missing OpenSSL, MSVC env not targeting ARM64) are
      # frequent and hard to debug from CI logs alone. Capture a small bundle for offline
      # inspection without uploading the full multi-GB target/ tree.
      - name: Collect Windows ARM64 failure diagnostics
        if: failure()
        shell: cmd
        run: |
          mkdir windows-arm64-diagnostics 2>nul
          :: Environment snapshot (VCVARS, toolchain, paths)
          set > windows-arm64-diagnostics\env-dump.txt 2>&1
          :: Target directory listing (inspect which artifacts were built, sizes, dates)
          dir /s target\aarch64-pc-windows-msvc\debug > windows-arm64-diagnostics\target-listing.txt 2>&1
          :: OpenSSL DLLs present next to deps?
          dir target\aarch64-pc-windows-msvc\debug\deps\*.dll > windows-arm64-diagnostics\deps-dlls.txt 2>&1
          :: integration_tests binary architecture header (sf_core's cdylib
          :: isn't built by `cargo test`; the test binary proves toolchain arch)
          where dumpbin >nul 2>&1 && for %%f in (target\aarch64-pc-windows-msvc\debug\deps\integration_tests-*.exe) do dumpbin /headers "%%f" >> windows-arm64-diagnostics\test-binary-headers.txt 2>&1

      - name: Upload Windows ARM64 diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-diagnostics
          path: windows-arm64-diagnostics/
          if-no-files-found: warn

      # snowflake-connector-python pulls in `cryptography`, which has no working
      # pre-built Windows ARM64 wheel (pyca/cryptography#14216 dropped official
      # arm64 wheel publishing in early 2026). We follow the same pattern as
      # test-python.yml and build cryptography from source against vcpkg's
      # static OpenSSL — Rust toolchain is already on the runner. The cache key
      # is intentionally identical to the one used in test-python.yml /
      # build-python-release.yml so we hit their cache when it's warm.
      - name: Restore vcpkg ARM64 static OpenSSL cache (for cryptography)
        if: always()
        id: vcpkg-static-cache
        # Cache restore failures never fail the job — fall back to clean install.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: windows-11-arm-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Setup MSVC environment (ARM64, for vcpkg static OpenSSL build)
        if: always() && steps.vcpkg-static-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-msvc
        with:
          arch: arm64

      - name: Install ARM64 static OpenSSL via vcpkg (cache miss)
        if: always() && steps.vcpkg-static-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: vcpkg install openssl:arm64-windows-static-md

      - name: Save vcpkg ARM64 static OpenSSL cache (cache miss)
        if: always() && steps.vcpkg-static-cache.outputs.cache-hit != 'true'
        # Cache failures never fail the job — see cargo-cache action for rationale.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: windows-11-arm-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Clean up python_bridge artifacts from target
        if: always()
        shell: bash
        run: cargo clean --package python_bridge 2>/dev/null || true

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "arm64-nonfips"
          # Aggressive slim is mandatory on the Windows lanes, not an optimisation.
          # With default slim this job's post-slim target/ measured 7.6 GB — over the
          # action's 6 GB cap — so the save was skipped on EVERY run. The restore then
          # fell back to a restore-keys prefix match against a cache built from an older
          # Cargo.lock, cargo invalidated the dep graph, and the job recompiled ~130
          # crates cold every time (21 min of a 30 min job). Skipping the save is
          # self-perpetuating: no save means the stale cache is never replaced.
          # MSVC debug test binaries + their .pdb are what blow past the cap here, and
          # they are exactly what aggressive slim drops.
          slim-mode: aggressive
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  test_windows_x86:
    needs: load-core-matrix
    if: inputs.run_rust_core && needs.load-core-matrix.outputs.windows_x86_active == 'true'
    runs-on: windows-latest
    name: test (Windows x86)
    # A bit more than other jobs due to slower compilation.
    timeout-minutes: 75
    env:
      E2E_TLS_SERVER: https://snowflakecomputing.com
      # See the ARM64 lane for the rationale. This lane needs it more: it carries two
      # dep trees in target/ (i686 target artifacts plus x86_64 host build scripts and
      # proc-macros), and measured 9.3 GB post-slim against the 6 GB cap.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Add i686 target
        run: rustup target add i686-pc-windows-msvc

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "x86-core-test"

      # vcpkg-installed OpenSSL for tests that still use it as a
      # `sf_core` dev-dependency. Mirrors the ARM64 lane.
      - name: Setup OpenSSL (Windows x86)
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: x86
          linkage: dynamic

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ needs.load-core-matrix.outputs.windows_x86_cloud }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}
        shell: bash

      - name: Setup MSVC environment (x86)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x86

      # Direct binary download from upstream redirector. taiki-e/install-action
      # is blocked by the org allow-list, so we install the same pre-built
      # binary it would fetch. windows-tar ships the x86_64-pc-windows-msvc
      # host build (the x86 target is just the cross-compile output).
      - name: Install cargo-nextest (Windows x64 host)
        shell: bash
        run: |
          set -euo pipefail
          # Use $HOME (POSIX, forward slashes on Git Bash) — $USERPROFILE is a
          # Windows backslash path that mingw tar can't handle.
          dest="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$dest"
          curl -LsSf https://get.nexte.st/latest/windows-tar | tar zxf - -C "$dest"
          cargo nextest --version

      # Single compile pass in the test profile; the `Run tests` step below
      # reuses these artifacts. Splitting build and test across cargo profiles
      # would recompile the whole dependency tree twice.
      - name: Compile (test profile, no run)
        shell: cmd
        run: cargo nextest run --locked --no-run --package sf_core --no-default-features --features protobuf --target i686-pc-windows-msvc

      # sf_core's cdylib isn't built by `cargo test`, so check a test binary
      # instead — same target triple, so same arch proof.
      - name: Verify test binaries are x86
        shell: cmd
        run: |
          set "TEST_EXE="
          for %%f in (target\i686-pc-windows-msvc\debug\deps\integration_tests-*.exe) do (
            if not defined TEST_EXE set "TEST_EXE=%%f"
          )
          if not defined TEST_EXE (
            echo ERROR: integration_tests binary not found under target\i686-pc-windows-msvc\debug\deps\
            dir target\i686-pc-windows-msvc\debug\deps\
            exit /b 1
          )
          echo Checking machine type of %TEST_EXE%
          dumpbin /headers "%TEST_EXE%" | findstr "14C" >nul
          if %ERRORLEVEL% neq 0 (
            echo ERROR: %TEST_EXE% is not x86
            dumpbin /headers "%TEST_EXE%" | findstr "machine"
            exit /b 1
          )

      # nextest's process-per-test model needs each test binary to find OpenSSL
      # DLLs. The setup-windows-openssl action puts vcpkg's bin/ on PATH, but
      # staging DLLs next to the test binaries is more robust (matches ARM64).
      - name: Stage x86 OpenSSL DLLs next to test binaries
        shell: cmd
        run: |
          copy "C:\vcpkg\installed\x86-windows\bin\libcrypto-3*.dll" target\i686-pc-windows-msvc\debug\deps\ 2>nul
          copy "C:\vcpkg\installed\x86-windows\bin\libssl-3*.dll" target\i686-pc-windows-msvc\debug\deps\ 2>nul

      # `--no-fail-fast` matches `cargo test`'s default of running all tests
      # even after a failure (nextest's default is to stop after the first).
      - name: Run tests
        id: run_rust_tests_x86
        shell: cmd
        env:
          TEST_CLOUD_PROVIDER: ${{ needs.load-core-matrix.outputs.windows_x86_cloud }}
        run: |
          set PARAMETER_PATH=${{ github.workspace }}\parameters.json
          cargo nextest run --locked --profile ci --package sf_core --no-default-features --features protobuf --target i686-pc-windows-msvc --no-fail-fast

      - name: Run flaky tests (non-blocking)
        continue-on-error: true
        shell: cmd
        env:
          TEST_CLOUD_PROVIDER: ${{ needs.load-core-matrix.outputs.windows_x86_cloud }}
        run: |
          set PARAMETER_PATH=${{ github.workspace }}\parameters.json
          cargo nextest run --locked --profile ci-flaky --package sf_core --no-default-features --features protobuf --target i686-pc-windows-msvc --run-ignored ignored-only -E "test(/^flaky_/)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-core-tests-windows-x86
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Upload flaky test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-core-flaky-tests-windows-x86
          path: target/nextest/ci-flaky/junit.xml
          if-no-files-found: warn

      # python_bridge is a workspace member but not needed by sf_core tests.
      # Its PyO3 dependency tree adds ~3-4 GB to target/, pushing past the
      # 6 GB cache cap. Strip it before save (same pattern as _build-python-wheels.yml).
      - name: Clean up python_bridge artifacts from target
        if: always()
        shell: bash
        run: cargo clean --package python_bridge 2>/dev/null || true

      - name: Save Rust cache
        if: always()
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "x86-core-test"
          # See the ARM64 lane's save step for the full rationale. This lane was the
          # worse of the two: post-slim target/ measured 9.3 GB against the 6 GB cap,
          # so the save never landed and the job recompiled ~458 crates cold on every
          # run (43 min of a 52 min job).
          slim-mode: aggressive
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  cleanup_rust_core:
    needs: [test, test_windows_arm64_nonfips, test_windows_x86]
    if: always() && (needs.test.result != 'skipped' || needs.test_windows_arm64_nonfips.result != 'skipped' || needs.test_windows_x86.result != 'skipped')
    runs-on: ubuntu-latest
    name: cleanup_rust_core
    steps:
      - uses: actions/checkout@v7

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}
        shell: bash

      - name: Cleanup test PATs
        continue-on-error: true
        run: |
          python -m pip install snowflake-connector-python -q
          python scripts/cleanup_env.py \
            --parameter-path "${{ github.workspace }}/parameters.json"

  rust-core-status:
    needs: [load-fips-matrix, format, test_sf_params_spec, fips_smoke, fips_artifacts, date_output_format_parity, test, test_windows_arm64_nonfips, test_windows_x86, cleanup_rust_core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Rust Core CI Status ==="
          
          # Check if any job failed or was cancelled. This must run before the
          # "tests skipped" check below: a failure in an upstream job can cause
          # a downstream job to be auto-skipped, which would otherwise be
          # misread as "no relevant changes detected" and pass.
          if [[ "${{ needs.format.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.load-fips-matrix.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test_sf_params_spec.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.fips_smoke.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.fips_artifacts.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.date_output_format_parity.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test_windows_arm64_nonfips.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test_windows_x86.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Rust Core tests were RUN and FAILED or CANCELLED"
            echo "  - format: ${{ needs.format.result }}"
            echo "  - load-fips-matrix: ${{ needs.load-fips-matrix.result }}"
            echo "  - test_sf_params_spec: ${{ needs.test_sf_params_spec.result }}"
            echo "  - fips_smoke: ${{ needs.fips_smoke.result }}"
            echo "  - fips_artifacts: ${{ needs.fips_artifacts.result }}"
            echo "  - date_output_format_parity: ${{ needs.date_output_format_parity.result }}"
            echo "  - test: ${{ needs.test.result }}"
            echo "  - test_windows_arm64_nonfips: ${{ needs.test_windows_arm64_nonfips.result }}"
            echo "  - test_windows_x86: ${{ needs.test_windows_x86.result }}"
            exit 1
          fi

          # Check if tests were skipped (only reachable once nothing above failed/cancelled)
          if [[ "${{ needs.test.result }}" == "skipped" ]] || \
             [[ "${{ needs.fips_smoke.result }}" == "skipped" ]] || \
             [[ "${{ needs.fips_artifacts.result }}" == "skipped" ]]; then
            # Driver CI only invokes this workflow for drivers it selected, so a
            # skip here means the gating is broken rather than "nothing to do".
            if [[ "${{ inputs.run_rust_core }}" == "true" ]]; then
              echo "✗ Driver CI requested Rust Core tests but a required test job was SKIPPED — check the job-level if: conditions."
              echo "  - test: ${{ needs.test.result }}"
              echo "  - fips_smoke: ${{ needs.fips_smoke.result }}"
              echo "  - fips_artifacts: ${{ needs.fips_artifacts.result }}"
              exit 1
            fi
            echo "✓ Rust Core tests were SKIPPED (not requested by Driver CI)"
            echo "  - run_rust_core: ${{ inputs.run_rust_core }}"
            exit 0
          fi
          
          # Tests ran and passed
          echo "✓ Rust Core tests were RUN and PASSED"
          exit 0
