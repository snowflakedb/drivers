name: Node.js CI

on:
  # Every event is orchestrated by driver-status.yml, which resolves the
  # suites to run and invokes only the affected driver workflows.
  workflow_call:
    inputs:
      run_nodejs:
        description: "Run Node.js tests."
        type: boolean
        required: false
        default: false
      run_nodejs_reference:
        description: "Run Node.js reference tests."
        type: boolean
        required: false
        default: false

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel).
  # Using github.run_id (not github.ref) for the fallback so back-to-back main pushes don't cancel each other.
  #
  # The prefix is a literal, not ${{ github.workflow }}: inside a workflow_call
  # the github context belongs to the caller, so github.workflow would resolve
  # to "Driver CI" and put this run in the orchestrator's own group. GitHub
  # reads that as a deadlock and fails the call before any job starts.
  group: nodejs-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  nodejs_tests:
    if: inputs.run_nodejs
    name: Node.js Tests (new driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # build:core compiles the nodejs_bridge crate (transitively sf_core) via
      # @napi-rs/cli -> cargo. Restore the cargo registry + target cache so the
      # build reuses artifacts instead of recompiling the dep graph every run.
      - name: Restore Rust cache
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "nodejs"

      - name: Install dependencies
        run: npm install
        working-directory: nodejs

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Run unit tests
        run: npm run build:core && npm run test:unit
        working-directory: nodejs

      - name: Save Rust cache
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "nodejs"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      # TODO: for now skip e2e as they fail anyway
      # - name: Run e2e tests (new driver)
      #   run: npm run test:e2e
      #   working-directory: nodejs
      #   env:
      #     PARAMETER_PATH: ${{ github.workspace }}/parameters.json

  nodejs_tests_reference:
    if: inputs.run_nodejs_reference
    name: Node.js Old Driver Reference Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: nodejs

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Run e2e tests (old driver reference)
        run: npm run test:e2e-old-driver
        working-directory: nodejs
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json

  nodejs-status:
    needs: [nodejs_tests, nodejs_tests_reference]
    # TODO: Re-enable Node.js CI once it is ready to gate Driver CI.
    # if: always()
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Node.js CI Status ==="

          NEW_RESULT="${{ needs.nodejs_tests.result }}"
          REFERENCE_RESULT="${{ needs.nodejs_tests_reference.result }}"

          # Check if any job failed or was cancelled. This must run before the
          # "tests skipped" check below: a failure in an upstream job can cause
          # a downstream job to be auto-skipped, which would otherwise be
          # misread as "no relevant changes detected" and pass.
          if [[ "$NEW_RESULT" =~ ^(failure|cancelled)$ || "$REFERENCE_RESULT" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Node.js CI FAILED or CANCELLED"
            echo "  - Node.js Tests (new): $NEW_RESULT"
            echo "  - Node.js Reference (old): $REFERENCE_RESULT"
            exit 1
          fi

          # Check if tests were skipped (only reachable once nothing above failed/cancelled)
          if [[ "$NEW_RESULT" == "skipped" && "$REFERENCE_RESULT" == "skipped" ]]; then
            # Driver CI only invokes this workflow for drivers it selected, so a
            # skip here means the gating is broken rather than "nothing to do".
            if [[ "${{ inputs.run_nodejs }}" == "true" ]]; then
              echo "✗ Driver CI requested Node.js tests but every Node.js job was SKIPPED — check the job-level if: conditions."
              exit 1
            fi
            echo "✓ Node.js jobs were SKIPPED (not requested by Driver CI)"
            echo "  - run_nodejs: ${{ inputs.run_nodejs }}"
            exit 0
          fi

          # Tests ran and passed
          echo "✓ Node.js jobs were RUN and PASSED"
          echo "  - Node.js Tests (new): $NEW_RESULT"
          echo "  - Node.js Reference (old): $REFERENCE_RESULT"
          exit 0
