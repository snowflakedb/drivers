name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel).
  # Using github.run_id (not github.ref) for the fallback so back-to-back main pushes don't cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  nodejs_tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_nodejs == 'true'
    name: Node.js Tests (new driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: nodejs

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run unit tests
        run: npm run test:unit
        working-directory: nodejs

      # TODO: for now skip e2e as they fail anyway
      # - name: Run e2e tests (new driver)
      #   run: npm run test:e2e
      #   working-directory: nodejs
      #   env:
      #     PARAMETER_PATH: ${{ github.workspace }}/parameters.json

  nodejs_tests_reference:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_nodejs_reference == 'true'
    name: Node.js Old Driver Reference Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: nodejs

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run e2e tests (old driver reference)
        run: npm run test:e2e-old-driver
        working-directory: nodejs
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json

  nodejs-status:
    needs: [detect-changes, nodejs_tests, nodejs_tests_reference]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Node.js CI Status ==="

          NEW_RESULT="${{ needs.nodejs_tests.result }}"
          REFERENCE_RESULT="${{ needs.nodejs_tests_reference.result }}"

          # Check if tests were skipped
          if [[ "$NEW_RESULT" == "skipped" && "$REFERENCE_RESULT" == "skipped" ]]; then
            echo "✓ Node.js jobs were SKIPPED (no relevant changes detected)"
            echo "  - run_nodejs: ${{ needs.detect-changes.outputs.run_nodejs }}"
            exit 0
          fi

          # Check if any job failed or was cancelled
          if [[ "$NEW_RESULT" =~ ^(failure|cancelled)$ || "$REFERENCE_RESULT" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Node.js CI FAILED or CANCELLED"
            echo "  - Node.js Tests (new): $NEW_RESULT"
            echo "  - Node.js Reference (old): $REFERENCE_RESULT"
            exit 1
          fi

          # Tests ran and passed
          echo "✓ Node.js jobs were RUN and PASSED"
          echo "  - Node.js Tests (new): $NEW_RESULT"
          echo "  - Node.js Reference (old): $REFERENCE_RESULT"
          exit 0
