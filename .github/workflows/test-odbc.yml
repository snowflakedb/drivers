name: ODBC CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  # Allow stacked PRs to trigger this workflow.
  # detect-changes still decides whether ODBC jobs actually run.
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 200M

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  odbc_unit_tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "odbc"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Run ODBC unit tests
        # Workaround for Rust 1.89+ linker bug with dylib crates (rust-lang/rust#131292):
        # Rust passes --no-undefined-version to GNU ld with a version script that omits
        # allocator shim symbols, causing sf_core dylib builds to fail.
        id: run_odbc_unit_tests
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        run: cargo test --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Rerun ODBC unit tests
        if: steps.run_odbc_unit_tests.outcome == 'failure' && github.event_name == 'merge_group'
        run: cargo test --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "odbc"

  odbc_tests_reference:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            driver_lib: libsfodbc.so
          - os: windows-latest
            name: Windows x64
            driver_lib: sfodbc.dll
    runs-on: ${{ matrix.os }}
    name: odbc_reference_tests (${{ matrix.name }})
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore test dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: odbc_tests/cmake-build/_deps
          key: ${{ runner.os }}-test-deps-${{ hashFiles('odbc_tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-odbc-${{ hashFiles('odbc_tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-odbc-

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Checked([string]$commandName, [scriptblock]$command) {
            & $command
            if ($LASTEXITCODE -ne 0) { throw "$commandName failed with exit code $LASTEXITCODE" }
          }

          Invoke-Checked "pip install cmake" { pip install cmake>=4.0.3 }
          cmake --version

          Invoke-Checked "choco install ccache" { choco install ccache -y --no-progress }

          Invoke-Checked "vcpkg install zlib:x64-windows" { vcpkg install zlib:x64-windows }

          $referenceOdbcVersion = (Get-Content "ci/reference-odbc-version" -Raw).Trim()
          $snowflakeOdbcMsi = "snowflake64_odbc-$referenceOdbcVersion.msi"
          $snowflakeOdbcUrl = "https://sfc-repo.snowflakecomputing.com/odbc/win64/$referenceOdbcVersion/$snowflakeOdbcMsi"
          Write-Host "Downloading Snowflake ODBC MSI from: $snowflakeOdbcUrl"
          Invoke-Checked "Invoke-WebRequest download Snowflake ODBC MSI" { Invoke-WebRequest -Uri $snowflakeOdbcUrl -OutFile $snowflakeOdbcMsi }
          $msiProcess = Start-Process -FilePath "msiexec" -ArgumentList "/i $snowflakeOdbcMsi /quiet" -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) { throw "msiexec failed with exit code $($msiProcess.ExitCode)" }

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev curl odbcinst zlib1g-dev ccache

          pip install cmake>=4.0.3
          cmake --version

          # Install reference ODBC driver
          REFERENCE_ODBC_VERSION=$(cat ci/reference-odbc-version | tr -d '[:space:]')
          . ci/reference-odbc-checksums
          echo "Installing reference ODBC driver version: $REFERENCE_ODBC_VERSION"
          DEB="snowflake-odbc-${REFERENCE_ODBC_VERSION}.x86_64.deb"
          curl -O "https://sfc-repo.snowflakecomputing.com/odbc/linux/${REFERENCE_ODBC_VERSION}/${DEB}"
          echo "${DEB_X86_64_SHA256}  ${DEB}" | sha256sum -c -
          sudo dpkg -i "${DEB}"
          sudo sed -i 's,ODBCInstLib=.*,ODBCInstLib=/usr/lib/x86_64-linux-gnu/libodbcinst.so.2,g' /usr/lib/snowflake/odbc/lib/simba.snowflake.ini

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Run Old ODBC tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        id: run_odbc_ref_tests_linux
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        run: |
          export DRIVER_PATH=/usr/lib/snowflake/odbc/lib/libSnowflake.so
          export PARAMETER_PATH=$(pwd)/parameters.json
          cd odbc_tests/
          mkdir -p cmake-build
          cmake -B cmake-build \
              -D ODBC_LIBRARY="/usr/lib/x86_64-linux-gnu/libodbc.so" \
              -D ODBC_INCLUDE_DIR="/usr/include" \
              -D DRIVER_TYPE=OLD \
              -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -D CMAKE_C_COMPILER_LAUNCHER=ccache \
              .
          cmake --build cmake-build -- -j $(($(nproc) * 2))
          ctest -j $(($(nproc) * 4)) -C Debug --test-dir cmake-build --output-on-failure

      - name: Rerun failed Old ODBC tests (Linux)
        if: steps.run_odbc_ref_tests_linux.outcome == 'failure' && github.event_name == 'merge_group'
        run: ctest --rerun-failed -C Debug --test-dir odbc_tests/cmake-build --output-on-failure
        env:
          DRIVER_PATH: /usr/lib/snowflake/odbc/lib/libSnowflake.so
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          DRIVER_TYPE: OLD

      - name: Run Old ODBC tests (Windows)
        if: matrix.os == 'windows-latest'
        id: run_odbc_ref_tests_windows
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        shell: pwsh
        run: |
          $env:DRIVER_PATH = "C:\Program Files\Snowflake ODBC Driver\Bin\SnowflakeDSII.dll"
          $env:PARAMETER_PATH = "$(pwd)\parameters.json"
          $env:DRIVER_TYPE = "OLD"
          .\scripts\odbc\run_tests_windows.ps1

      - name: Rerun failed Old ODBC tests (Windows)
        if: steps.run_odbc_ref_tests_windows.outcome == 'failure' && github.event_name == 'merge_group'
        shell: pwsh
        run: ctest --rerun-failed -C Debug --test-dir odbc_tests/cmake-build --output-on-failure
        env:
          DRIVER_PATH: C:\Program Files\Snowflake ODBC Driver\Bin\SnowflakeDSII.dll
          PARAMETER_PATH: ${{ github.workspace }}\parameters.json
          DRIVER_TYPE: OLD

      - name: Save test dependencies cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: odbc_tests/cmake-build/_deps
          key: ${{ runner.os }}-test-deps-${{ hashFiles('odbc_tests/CMakeLists.txt') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-odbc-${{ hashFiles('odbc_tests/CMakeLists.txt') }}

  # Build ODBC driver once per platform and share via artifact.
  # Avoids rebuilding in each of the 9 test matrix cells (3 OSes × 3 cloud providers).
  build_odbc_driver:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            driver_lib: libsfodbc.so
          - os: macos-latest
            name: macOS ARM64
            driver_lib: libsfodbc.dylib
          - os: windows-latest
            name: Windows x64
            driver_lib: sfodbc.dll
    runs-on: ${{ matrix.os }}
    name: build_odbc_driver (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "odbc"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install unixodbc go
          echo "ODBC_PREFIX=$(brew --prefix unixodbc)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\OpenSSL\lib\VC\x64\MD")) {
            choco install openssl -y --no-progress
          }
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\Program Files\OpenSSL\lib\VC\x64\MD" >> $env:GITHUB_ENV

      - name: Build ODBC driver (Linux)
        if: runner.os == 'Linux'
        run: cargo build --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Build ODBC driver (macOS)
        if: runner.os == 'macOS'
        run: cargo build --package odbc

      - name: Build ODBC driver (Windows)
        if: runner.os == 'Windows'
        run: cargo build --package odbc
        env:
          RUSTFLAGS: "-C linker=rust-lld"

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "odbc"

      - name: Upload ODBC driver
        uses: actions/upload-artifact@v4
        with:
          name: odbc-driver-${{ matrix.os }}
          path: target/debug/${{ matrix.driver_lib }}

  odbc_tests:
    needs: [detect-changes, build_odbc_driver]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            driver_lib: libsfodbc.so
            cloud_provider: aws
          - os: macos-latest
            name: macOS ARM64
            driver_lib: libsfodbc.dylib
            cloud_provider: aws
          - os: windows-latest
            name: Windows x64
            driver_lib: sfodbc.dll
            cloud_provider: aws
          - os: ubuntu-latest
            name: Linux x64
            driver_lib: libsfodbc.so
            cloud_provider: gcp
          - os: macos-latest
            name: macOS ARM64
            driver_lib: libsfodbc.dylib
            cloud_provider: gcp
          - os: windows-latest
            name: Windows x64
            driver_lib: sfodbc.dll
            cloud_provider: gcp
          - os: ubuntu-latest
            name: Linux x64
            driver_lib: libsfodbc.so
            cloud_provider: azure
          - os: macos-latest
            name: macOS ARM64
            driver_lib: libsfodbc.dylib
            cloud_provider: azure
          - os: windows-latest
            name: Windows x64
            driver_lib: sfodbc.dll
            cloud_provider: azure
    runs-on: ${{ matrix.os }}
    name: odbc_tests (${{ matrix.name }}, ${{ matrix.cloud_provider }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built ODBC driver
        uses: actions/download-artifact@v4
        with:
          name: odbc-driver-${{ matrix.os }}
          path: target/debug

      - name: Make driver executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x target/debug/${{ matrix.driver_lib }}

      - name: Restore test dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: odbc_tests/cmake-build/_deps
          key: ${{ runner.os }}-test-deps-${{ hashFiles('odbc_tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-odbc-${{ hashFiles('odbc_tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-odbc-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev build-essential zlib1g-dev ccache
          wget https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-linux-x86_64.sh
          sudo sh cmake-4.0.3-linux-x86_64.sh --skip-license --prefix=/usr/local
          sudo rm cmake-4.0.3-linux-x86_64.sh
          cmake --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          brew install unixodbc cmake ccache
          cmake --version
          echo "ODBC_PREFIX=$(brew --prefix unixodbc)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Checked([string]$commandName, [scriptblock]$command) {
            & $command
            if ($LASTEXITCODE -ne 0) { throw "$commandName failed with exit code $LASTEXITCODE" }
          }

          Invoke-Checked "pip install cmake" { pip install cmake>=4.0.3 }
          cmake --version

          Invoke-Checked "choco install ccache" { choco install ccache -y --no-progress }

          Invoke-Checked "vcpkg install zlib:x64-windows" { vcpkg install zlib:x64-windows }

          # The pre-built ODBC driver links OpenSSL dynamically — ensure DLLs are available at runtime
          if (!(Test-Path "C:\Program Files\OpenSSL\lib\VC\x64\MD")) {
            Invoke-Checked "choco install openssl" { choco install openssl -y --no-progress }
          }
          echo "C:\Program Files\OpenSSL\bin" >> $env:GITHUB_PATH

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Build and run ODBC tests (Unix)
        if: runner.os != 'Windows'
        id: run_odbc_tests_unix
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        run: |
          ls -l target/debug/
          export DRIVER_PATH=$(pwd)/target/debug/${{ matrix.driver_lib }}
          export PARAMETER_PATH=$(pwd)/parameters.json
          export DRIVER_TYPE=NEW
          ./scripts/odbc/run_tests_unix.sh

      - name: Rerun failed ODBC tests (Unix)
        if: steps.run_odbc_tests_unix.outcome == 'failure' && github.event_name == 'merge_group'
        run: ctest --rerun-failed -C Debug --test-dir odbc_tests/cmake-build --output-on-failure
        env:
          DRIVER_PATH: ${{ github.workspace }}/target/debug/${{ matrix.driver_lib }}
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          DRIVER_TYPE: NEW

      - name: Build and run ODBC tests (Windows)
        if: runner.os == 'Windows'
        id: run_odbc_tests_windows
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        shell: pwsh
        run: |
          dir target\debug\
          $env:DRIVER_PATH = "$PWD\target\debug\${{ matrix.driver_lib }}"
          $env:PARAMETER_PATH = "$PWD\parameters.json"
          $env:DRIVER_TYPE = "NEW"
          .\scripts\odbc\run_tests_windows.ps1

      - name: Rerun failed ODBC tests (Windows)
        if: steps.run_odbc_tests_windows.outcome == 'failure' && github.event_name == 'merge_group'
        shell: pwsh
        run: ctest --rerun-failed -C Debug --test-dir odbc_tests/cmake-build --output-on-failure
        env:
          DRIVER_PATH: ${{ github.workspace }}\target\debug\${{ matrix.driver_lib }}
          PARAMETER_PATH: ${{ github.workspace }}\parameters.json
          DRIVER_TYPE: NEW

      - name: Save test dependencies cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: odbc_tests/cmake-build/_deps
          key: ${{ runner.os }}-test-deps-${{ hashFiles('odbc_tests/CMakeLists.txt') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-odbc-${{ hashFiles('odbc_tests/CMakeLists.txt') }}

  build_rpm:
    needs: [detect-changes, odbc_unit_tests, odbc_tests]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64-glibc
            arch: x86_64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64-glibc
            arch: aarch64
    runs-on: ${{ matrix.os }}
    name: build_rpm (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Cargo registry cache (RPM build)
        uses: actions/cache/restore@v5
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-rpm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-rpm-

      - name: Restore Rust target cache (RPM build)
        uses: actions/cache/restore@v5
        with:
          path: .cargo-target-rpm
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-rpm-release-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-rust-rpm-release-target-

      - name: Prepare cache directories
        run: mkdir -p .cargo-cache/registry .cargo-cache/git .cargo-target-rpm

      - name: Build Docker image
        run: docker build -t rpm-build -f ci/Dockerfile.rocky-rpm-build .

      - name: Build ODBC driver and package RPM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.cargo-cache/registry:/root/.cargo/registry \
            -v ${{ github.workspace }}/.cargo-cache/git:/root/.cargo/git \
            -v ${{ github.workspace }}/.cargo-target-rpm:/workspace/target \
            -w /workspace \
            -e PLATFORM=${{ matrix.platform }} \
            -e RUSTFLAGS="-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--undefined-version" \
            rpm-build \
            bash -c "cargo build --release --package odbc --target ${{ matrix.target }} && ./scripts/odbc/rpm/package.sh"

      - name: Save Cargo registry cache (RPM build)
        uses: actions/cache/save@v5
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-rpm-${{ hashFiles('**/Cargo.lock') }}

      - name: Save Rust target cache (RPM build)
        uses: actions/cache/save@v5
        with:
          path: .cargo-target-rpm
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-rpm-release-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: snowflake-odbc-rpm-${{ matrix.arch }}
          path: build/snowflake-odbc-*.rpm

  odbc-status:
    needs: [detect-changes, odbc_unit_tests, odbc_tests_reference, build_odbc_driver, odbc_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== ODBC CI Status ==="
          
          # Check if tests were skipped
          if [[ "${{ needs.odbc_tests.result }}" == "skipped" ]]; then
            echo "✓ ODBC tests were SKIPPED (no relevant changes detected)"
            echo "  - run_odbc: ${{ needs.detect-changes.outputs.run_odbc }}"
            exit 0
          fi
          
          # Check if any job failed or was cancelled
          if [[ "${{ needs.odbc_unit_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.odbc_tests_reference.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.build_odbc_driver.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.odbc_tests.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ ODBC tests were RUN and FAILED or CANCELLED"
            echo "  - odbc_unit_tests: ${{ needs.odbc_unit_tests.result }}"
            echo "  - odbc_tests_reference: ${{ needs.odbc_tests_reference.result }}"
            echo "  - build_odbc_driver: ${{ needs.build_odbc_driver.result }}"
            echo "  - odbc_tests: ${{ needs.odbc_tests.result }}"
            exit 1
          fi
          
          # Tests ran and passed
          echo "✓ ODBC tests were RUN and PASSED"
          exit 0
