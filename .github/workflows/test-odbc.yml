name: ODBC CI

on:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 03:00 UTC on main (staggered: python=02, odbc=03, jdbc=04, rust=05)
  push:
    branches:
      - main
      - 'release/odbc-**'
  pull_request:
    # `labeled` is included so applying ci:scope-merge / ci:scope-nightly to
    # a PR re-runs the workflow at the upgraded scope without needing a new
    # commit. Unrelated labels are filtered by the `scope-label-gate` job
    # below; concurrency keeps in-flight runs alive for those.
    types: [opened, synchronize, reopened, labeled]
  # Allow stacked PRs to trigger this workflow.
  # detect-changes still decides whether ODBC jobs actually run.
  merge_group:
    types: [ checks_requested ]
  # Lets the mirror (snowflakedb) build/test on demand — see scope-label-gate.
  workflow_dispatch:

concurrency:
  # Group by PR number for PRs; by branch for pushes; fall back to run ID for
  # merge_group runs (each run is unique so they won't cancel each other).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  # Don't cancel an in-flight run when an unrelated label is added/removed —
  # only scope-up labels (ci:scope-merge, ci:scope-nightly) and normal
  # push/synchronize/reopen events should replace the running matrix.
  cancel-in-progress: ${{ github.event.action != 'labeled' || contains(fromJSON('["ci:scope-merge-queue","ci:scope-merge","ci:scope-nightly","run_long_running_tests"]'), github.event.label.name) }}

jobs:
  # Filter out PR runs triggered solely by adding an unrelated label
  # (e.g. auto-labeler bot tagging `python` or `shared`). The `if:`
  # evaluates to false on those events, this job is skipped, and every
  # downstream job that `needs:` it is skipped too. Scope-up labels
  # (ci:scope-merge, ci:scope-nightly) pass through and re-run the
  # workflow at the upgraded scope.
  scope-label-gate:
    # Public-side gate: on the mirror (snowflakedb) this pipeline runs only on
    # manual dispatch or release/* pushes, never on every PR/push-to-main. On
    # the internal repo (repository_owner != 'snowflakedb') behavior is
    # unchanged. AND-merged with the existing scope-label filter.
    if: >-
      (github.repository_owner != 'snowflakedb'
       || github.event_name == 'workflow_dispatch'
       || startsWith(github.ref, 'refs/heads/release/'))
      && (github.event.action != 'labeled'
          || contains(fromJSON('["ci:scope-merge-queue","ci:scope-merge","ci:scope-nightly","run_long_running_tests"]'), github.event.label.name))
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  detect-changes:
    needs: scope-label-gate
    uses: ./.github/workflows/detect-changes.yml

  odbc_unit_tests:
    needs: detect-changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.detect-changes.outputs.run_odbc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup ODBC build environment
        uses: ./.github/actions/setup-odbc-build-env

      - name: Cache Rust dependencies
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "odbc"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Run ODBC unit tests
        # Workaround for Rust 1.89+ linker bug with dylib crates (rust-lang/rust#131292):
        # Rust passes --no-undefined-version to GNU ld with a version script that omits
        # allocator shim symbols, causing sf_core dylib builds to fail.
        id: run_odbc_unit_tests
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        run: cargo test --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Rerun ODBC unit tests
        if: steps.run_odbc_unit_tests.outcome == 'failure' && github.event_name == 'merge_group'
        run: cargo test --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "odbc"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  odbc_tests_reference:
    needs: detect-changes
    if: "!contains(github.event.pull_request.labels.*.name, 'ci:scope-merge-queue') && github.event_name != 'merge_group' && (github.event_name == 'push' || github.event_name == 'schedule' || needs.detect-changes.outputs.run_odbc_reference == 'true')"
    uses: ./.github/workflows/_test-odbc-reference.yml
    # secrets.PARAMETERS_SECRET is read by decode_secrets inside the
    # reusable workflow; reusable workflows do NOT auto-inherit secrets
    # even in the same repo.
    secrets: inherit

  odbc_tests:
    needs: detect-changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.detect-changes.outputs.run_odbc == 'true'
    uses: ./.github/workflows/_test-odbc.yml
    # See odbc_tests_reference above for the secrets-inherit rationale.
    secrets: inherit

  # Label-gated lane for `[long_running]`-tagged ODBC tests (e.g. the
  # multi-round-trip catalog metadata suites that would otherwise time out on a
  # normal PR run). Those tests are excluded from the default gating runs via
  # `-LE "flaky|long_running|requires_no_mfa"` in _test-odbc.yml / _test-odbc-reference.yml; this
  # job opts them back in on demand.
  #
  # Triggers when the PR carries the `run_long_running_tests` label (applying the
  # label re-runs the workflow — see scope-label-gate's labeled-event allowlist)
  # and on the nightly schedule. Single Linux x64 / AWS lane. Intentionally NOT a
  # dependency of `odbc-status`, so it never blocks a merge — it is an on-demand
  # diagnostic lane, mirroring the label-gated `run_full_put_get_tests` workflow.
  odbc_long_running:
    needs: scope-label-gate
    if: >-
      github.event_name == 'schedule'
      || contains(github.event.pull_request.labels.*.name, 'run_long_running_tests')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup ODBC build environment
        uses: ./.github/actions/setup-odbc-build-env

      - name: Restore Rust cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "odbc"

      - name: Restore test dependencies cache
        id: test-deps-cache
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          kind: test-deps
          key-suffix: default

      - name: Restore ccache
        id: ccache
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          kind: ccache
          key-suffix: default

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev build-essential zlib1g-dev ccache ninja-build
          # odbc_tests/CMakeLists.txt requires CMake >= 4.0; ubuntu-latest ships ~3.30.
          python3 -m pip install 'cmake>=4.0.3'
          cmake --version

      - name: Build ODBC driver
        # Workaround for the Rust 1.89+ linker bug (rust-lang/rust#131292),
        # mirroring odbc_unit_tests in test-odbc.yml.
        run: cargo build --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh aws
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      # run_tests_unix.sh forwards trailing args to ctest; `-L long_running`
      # selects exactly the tests carrying the Catch2 `[long_running]` tag
      # (mapped to a ctest label via ADD_TAGS_AS_LABELS in odbc_tests/CMakeLists.txt).
      - name: Build and run long-running ODBC tests
        run: |
          export DRIVER_PATH=$(pwd)/target/debug/libsfodbc.so
          export PARAMETER_PATH=$(pwd)/parameters.json
          export DRIVER_TYPE=NEW
          ./scripts/odbc/run_tests_unix.sh -L long_running \
            --output-junit "${{ github.workspace }}/odbc-long-running-junit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odbc-long-running-tests
          path: odbc-long-running-junit.xml
          if-no-files-found: warn

      - name: Save Rust cache
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "odbc"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}


  odbc-status:
    needs: [detect-changes, odbc_unit_tests, odbc_tests_reference, odbc_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== ODBC CI Status ==="

          # Each `needs.<X>.result` for a reusable-workflow call aggregates
          # every job inside the called workflow:
          #   needs.odbc_tests          → _test-odbc.yml
          #                               (load-odbc-matrix, build_odbc_driver,
          #                                odbc_tests, cleanup_odbc)
          #   needs.odbc_tests_reference → _test-odbc-reference.yml
          # — any internal failure surfaces here. This must run before the
          # "tests skipped" check below: a failure in an upstream job can cause
          # a downstream job to be auto-skipped, which would otherwise be
          # misread as "no relevant changes detected" and pass.
          if [[ "${{ needs.odbc_unit_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.odbc_tests_reference.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.odbc_tests.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ ODBC tests were RUN and FAILED or CANCELLED"
            echo "  - odbc_unit_tests: ${{ needs.odbc_unit_tests.result }}"
            echo "  - odbc_tests_reference: ${{ needs.odbc_tests_reference.result }}"
            echo "  - odbc_tests: ${{ needs.odbc_tests.result }}"
            exit 1
          fi

          # Check if tests were skipped (only reachable once nothing above failed/cancelled).
          # needs.odbc_tests is the reusable-workflow call (_test-odbc.yml) — when
          # detect-changes says no relevant changes, the call is skipped and so is
          # its aggregate result, which is the trigger for the "skipped" path here.
          if [[ "${{ needs.odbc_tests.result }}" == "skipped" ]]; then
            echo "✓ ODBC tests were SKIPPED (no relevant changes detected)"
            echo "  - run_odbc: ${{ needs.detect-changes.outputs.run_odbc }}"
            exit 0
          fi

          # Tests ran and passed
          echo "✓ ODBC tests were RUN and PASSED"
          exit 0
