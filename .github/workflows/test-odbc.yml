name: ODBC CI

on:
  pull_request:
    # `labeled` is included so applying ci:scope-merge / ci:scope-nightly to
    # a PR re-runs the workflow at the upgraded scope without needing a new
    # commit. Unrelated labels are filtered by the `scope-label-gate` job
    # below; concurrency keeps in-flight runs alive for those.
    types: [opened, synchronize, reopened, labeled]
  # Allow stacked PRs to trigger this workflow.
  # detect-changes still decides whether ODBC jobs actually run.
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs; fall back to run ID for merge_group runs
  # (each run is unique so they won't cancel each other).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Don't cancel an in-flight run when an unrelated label is added/removed —
  # only scope-up labels (ci:scope-merge, ci:scope-nightly) and normal
  # push/synchronize/reopen events should replace the running matrix.
  cancel-in-progress: ${{ github.event.action != 'labeled' || contains(fromJSON('["ci:scope-merge","ci:scope-nightly"]'), github.event.label.name) }}

jobs:
  # Filter out PR runs triggered solely by adding an unrelated label
  # (e.g. auto-labeler bot tagging `python` or `shared`). The `if:`
  # evaluates to false on those events, this job is skipped, and every
  # downstream job that `needs:` it is skipped too. Scope-up labels
  # (ci:scope-merge, ci:scope-nightly) pass through and re-run the
  # workflow at the upgraded scope.
  scope-label-gate:
    if: |
      github.event.action != 'labeled' ||
      contains(fromJSON('["ci:scope-merge","ci:scope-nightly"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  detect-changes:
    needs: scope-label-gate
    uses: ./.github/workflows/detect-changes.yml

  odbc_unit_tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ODBC build environment
        uses: ./.github/actions/setup-odbc-build-env

      - name: Cache Rust dependencies
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "odbc"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Run ODBC unit tests
        # Workaround for Rust 1.89+ linker bug with dylib crates (rust-lang/rust#131292):
        # Rust passes --no-undefined-version to GNU ld with a version script that omits
        # allocator shim symbols, causing sf_core dylib builds to fail.
        id: run_odbc_unit_tests
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        run: cargo test --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Rerun ODBC unit tests
        if: steps.run_odbc_unit_tests.outcome == 'failure' && github.event_name == 'merge_group'
        run: cargo test --package odbc
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--undefined-version"

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "odbc"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  odbc_tests_reference:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc_reference == 'true'
    uses: ./.github/workflows/_test-odbc-reference.yml
    # secrets.PARAMETERS_SECRET is read by decode_secrets inside the
    # reusable workflow; reusable workflows do NOT auto-inherit secrets
    # even in the same repo.
    secrets: inherit

  odbc_tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    uses: ./.github/workflows/_test-odbc.yml
    # See odbc_tests_reference above for the secrets-inherit rationale.
    secrets: inherit

  build_odbc_packages:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_odbc == 'true'
    uses: ./.github/workflows/_build-odbc-packages.yml
    with:
      # WiX Toolset git ref to build from source inside _build-odbc-packages.yml.
      # Inlined here because GHA disallows env.* in `with:` of a reusable-workflow
      # call. Bump in lock-step with the .wxs source compatibility.
      wix-ref: v7.0.0

  odbc-status:
    needs: [detect-changes, odbc_unit_tests, odbc_tests_reference, odbc_tests, build_odbc_packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== ODBC CI Status ==="

          # Check if tests were skipped. needs.odbc_tests is the reusable-
          # workflow call (_test-odbc.yml) — when detect-changes says no
          # relevant changes, the call is skipped and so is its aggregate
          # result, which is the trigger for the "skipped" path here.
          if [[ "${{ needs.odbc_tests.result }}" == "skipped" ]]; then
            echo "✓ ODBC tests were SKIPPED (no relevant changes detected)"
            echo "  - run_odbc: ${{ needs.detect-changes.outputs.run_odbc }}"
            exit 0
          fi

          # Each `needs.<X>.result` for a reusable-workflow call aggregates
          # every job inside the called workflow:
          #   needs.odbc_tests          → _test-odbc.yml
          #                               (load-odbc-matrix, build_odbc_driver,
          #                                odbc_tests, cleanup_odbc)
          #   needs.odbc_tests_reference → _test-odbc-reference.yml
          #   needs.build_odbc_packages → _build-odbc-packages.yml
          #                               (build_wix, build_msi, build_rpm, build_dmg)
          # — any internal failure surfaces here.
          if [[ "${{ needs.odbc_unit_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.odbc_tests_reference.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.odbc_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.build_odbc_packages.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ ODBC tests were RUN and FAILED or CANCELLED"
            echo "  - odbc_unit_tests: ${{ needs.odbc_unit_tests.result }}"
            echo "  - odbc_tests_reference: ${{ needs.odbc_tests_reference.result }}"
            echo "  - odbc_tests: ${{ needs.odbc_tests.result }}"
            echo "  - build_odbc_packages: ${{ needs.build_odbc_packages.result }}"
            exit 1
          fi

          # Tests ran and passed
          echo "✓ ODBC tests were RUN and PASSED"
          exit 0
