name: ODBC CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  odbc_tests_reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev curl odbcinst zlib1g-dev
          wget https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-linux-x86_64.sh
          sudo sh cmake-4.0.3-linux-x86_64.sh --skip-license --prefix=/usr/local
          sudo rm cmake-4.0.3-linux-x86_64.sh
          cmake --version
          curl -O https://sfc-repo.snowflakecomputing.com/odbc/linux/3.9.0/snowflake-odbc-3.9.0.x86_64.deb
          sudo dpkg -i snowflake-odbc-3.9.0.x86_64.deb
          sudo sed -i 's,ODBCInstLib=.*,ODBCInstLib=/usr/lib/x86_64-linux-gnu/libodbcinst.so.2,g' /usr/lib/snowflake/odbc/lib/simba.snowflake.ini

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run Old ODBC tests
        run: |
          export DRIVER_PATH=/usr/lib/snowflake/odbc/lib/libSnowflake.so
          export PARAMETER_PATH=$(pwd)/parameters.json
          cd odbc_tests/
          mkdir -p cmake-build
          cmake -B cmake-build \
              -D ODBC_LIBRARY="/usr/lib/x86_64-linux-gnu/libodbc.so" \
              -D ODBC_INCLUDE_DIR="/usr/include" \
              -D DRIVER_TYPE=OLD \
              .
          cmake --build cmake-build -- -j $(nproc)
          ctest -C Debug --test-dir cmake-build --output-on-failure

  odbc_tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev build-essential zlib1g-dev lcov
          wget https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-linux-x86_64.sh
          sudo sh cmake-4.0.3-linux-x86_64.sh --skip-license --prefix=/usr/local
          sudo rm cmake-4.0.3-linux-x86_64.sh
          cmake --version

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Install LLVM tools for coverage
        run: rustup component add llvm-tools-preview

      - name: Build Rust ODBC driver
        run: RUSTFLAGS="-C instrument-coverage" cargo build

      - name: Build and run ODBC tests
        run: |
          ls -l target/debug/
          export DRIVER_PATH=$(pwd)/target/debug/libsfodbc.so
          export PARAMETER_PATH=$(pwd)/parameters.json
          export LLVM_PROFILE_FILE="odbc-%p-%m.profraw"
          cd odbc_tests
          mkdir -p cmake-build
          cmake -B cmake-build \
              -D ODBC_LIBRARY="/usr/lib/x86_64-linux-gnu/libodbc.so" \
              -D ODBC_INCLUDE_DIR="/usr/include" \
              -D DRIVER_TYPE=NEW \
              .
          cmake --build cmake-build -- -j $(nproc)
          ctest -C Debug --test-dir cmake-build --output-on-failure

      - name: Generate coverage reports
        run: |
          # Process raw coverage data
          LLVM_PROFDATA=$(find ~/.rustup -name "llvm-profdata" -type f 2>/dev/null | head -1)
          LLVM_COV=$(find ~/.rustup -name "llvm-cov" -type f 2>/dev/null | head -1)
          find . -name "odbc-*.profraw" -type f | xargs $LLVM_PROFDATA merge -sparse -o odbc-coverage.profdata
          
          # List actual ODBC source files to understand what we should include
          echo "=== Actual ODBC source files ==="
          find $(pwd)/odbc/src -name "*.rs" | head -10
          
          # Create a minimal ODBC coverage report with only existing ODBC files
          echo "TN:" > odbc-driver-temp.lcov
          
          # For each ODBC source file, check if it has coverage data
          for odbc_file in $(find $(pwd)/odbc/src -name "*.rs"); do
            echo "Checking coverage for: $odbc_file"
            if $LLVM_COV export target/debug/libsfodbc.so -instr-profile=odbc-coverage.profdata -format=lcov | grep -q "SF:$odbc_file"; then
              echo "Found coverage for $odbc_file"
              $LLVM_COV export target/debug/libsfodbc.so -instr-profile=odbc-coverage.profdata -format=lcov | awk -v file="$odbc_file" '
                /^SF:/ { if ($0 == "SF:" file) { in_file = 1; print } else { in_file = 0 } }
                /^[^S]/ { if (in_file) print }
              ' >> odbc-driver-temp.lcov
            fi
          done
          
          echo "end_of_record" >> odbc-driver-temp.lcov
          
          # Filter out any remaining sf_core references from the LCOV file
          if grep -q "sf_core" odbc-driver-temp.lcov; then
            echo "ERROR: sf_core found in ODBC report! Creating empty report."
            echo "# ODBC-only coverage report - sf_core excluded" > odbc-driver-${{ matrix.os }}.lcov
          else
            echo "Good: No sf_core found in ODBC report."
            cp odbc-driver-temp.lcov odbc-driver-${{ matrix.os }}.lcov
          fi
          
          # Debug: Check what files are actually in the ODBC report
          echo "=== Files in ODBC report ==="
          grep "^SF:" odbc-driver-${{ matrix.os }}.lcov | head -10
          echo "=== Checking if sf_core files are present ==="
          if grep -q "sf_core" odbc-driver-${{ matrix.os }}.lcov; then
            echo "ERROR: sf_core files still found in ODBC report!"
            grep "sf_core" odbc-driver-${{ matrix.os }}.lcov | head -5
            echo "=== Creating empty ODBC report instead ==="
            echo "TN:" > odbc-driver-${{ matrix.os }}.lcov
            echo "end_of_record" >> odbc-driver-${{ matrix.os }}.lcov
          else
            echo "Good: No sf_core files found in ODBC report."
          fi
          echo "=== Final ODBC report content ==="
          head -20 odbc-driver-${{ matrix.os }}.lcov
          
          # Generate sf_core coverage from ODBC tests
          $LLVM_COV export target/debug/libsf_core.so \
              -instr-profile=odbc-coverage.profdata \
              -format=lcov \
              -sources=$(pwd)/sf_core/src \
              -ignore-filename-regex='.*/(tests|test_utils).*' \
              -ignore-filename-regex='.*/tests_format_validator.*' > core-from-odbc-${{ matrix.os }}.lcov

      - name: Upload ODBC driver coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./odbc-driver-${{ matrix.os }}.lcov
          flags: odbc
          name: odbc-driver-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false

      - name: Upload Core from ODBC coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./core-from-odbc-${{ matrix.os }}.lcov
          flags: core-from-odbc
          name: core-from-odbc-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false