name: Build ODBC Packages

# Reusable workflow that builds every distributable ODBC artifact (MSI on
# Windows for x64/x86/arm64, RPM on Linux for x86_64/aarch64, .pkg on macOS
# universal). The Windows MSIs depend on a WiX toolchain that we build from
# source as the first job here, so the whole graph lives together to keep
# the build_wix → build_msi edge inside this file.

on:
  workflow_call:

env:
  WIX_VERSION: v7.0.0

jobs:
  build_wix:
    # Pinned to windows-2022 because WiX v7 sources reference the VS 2022 'v143'
    # platform toolset. windows-latest is transitioning to VS 2026 which removes v143.
    runs-on: windows-2022
    name: build_wix (WiX Toolset from source)
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      NUGET_XMLDOC_MODE: skip
      NuGetAudit: 'false'
    steps:
      - name: Restore WiX build cache
        id: wix-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: wix-artifacts
          key: wix-${{ env.WIX_VERSION }}-${{ runner.os }}

      - name: Checkout wixtoolset/wix @ ${{ env.WIX_VERSION }}
        if: steps.wix-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: wixtoolset/wix
          ref: ${{ env.WIX_VERSION }}
          path: wix-src
          fetch-depth: 0

      - name: Disable NuGet audit in WiX Directory.Build.props
        if: steps.wix-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $propsPath = Join-Path $PWD 'wix-src/src/Directory.Build.props'
          if (-not (Test-Path $propsPath)) {
              throw "WiX Directory.Build.props not found at $propsPath"
          }
          $content = Get-Content $propsPath -Raw
          $patched = $content `
              -replace '<NuGetAudit>true</NuGetAudit>',           '<NuGetAudit>false</NuGetAudit>' `
              -replace '<NuGetAuditMode>all</NuGetAuditMode>',     '<NuGetAuditMode>direct</NuGetAuditMode>' `
              -replace '<NuGetAuditLevel>low</NuGetAuditLevel>',   '<NuGetAuditLevel>critical</NuGetAuditLevel>'
          if ($patched -eq $content) {
              Write-Host "No NuGetAudit settings found to patch in $propsPath; continuing"
          } else {
              Set-Content -Path $propsPath -Value $patched -Encoding UTF8 -NoNewline
              Write-Host "Patched $propsPath to disable NuGet audit"
          }

      - name: Build WiX from source
        if: steps.wix-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: wix-src\src
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -version [17^,19^) -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL echo Could not locate a VS 2022 install via vswhere & exit /b 1
          call "%VSINSTALL%\Common7\Tools\vsdevcmd.bat" -no_logo || exit /b
          where msbuild || exit /b
          call build_init.cmd || exit /b
          call dtf\dtf.cmd Release || exit /b
          call internal\internal.cmd Release || exit /b
          call libs\libs.cmd Release || exit /b
          call api\api.cmd Release || exit /b
          call burn\burn.cmd Release || exit /b
          call wix\wix.cmd Release || exit /b
          call tools\tools.cmd Release || exit /b
          msbuild ext\Util\util_t.proj -Restore -p:Configuration=Release -m -tl -nologo -warnaserror -bl:..\build\logs\ext_util_build.binlog || exit /b
          msbuild ext\UI\ui_t.proj -Restore -p:Configuration=Release -m -tl -nologo -warnaserror -bl:..\build\logs\ext_ui_build.binlog || exit /b

      - name: Stage WiX nupkgs
        if: steps.wix-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $source = Join-Path $PWD "wix-src\build\artifacts"
          $dest = Join-Path $PWD "wix-artifacts"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Path $source -Recurse -Include *.nupkg, *.snupkg | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $dest -Force
          }
          $count = (Get-ChildItem $dest -Filter *.nupkg).Count
          if ($count -eq 0) {
              throw "No nupkgs found in $source after WiX build"
          }
          Write-Host "Staged $count nupkgs to $dest"
          Get-ChildItem $dest -Filter *.nupkg | Select-Object Name | Format-Table -AutoSize

      - name: Save WiX build cache
        if: always() && steps.wix-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: wix-artifacts
          key: wix-${{ env.WIX_VERSION }}-${{ runner.os }}

      - name: Upload WiX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wix-toolset-v7
          path: wix-artifacts/
          if-no-files-found: error

  build_msi:
    needs: build_wix
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 Release
            os: windows-latest
            arch: x64
            config: release
            cargo_target: x86_64-pc-windows-msvc
            cargo_profile: "--release"
            cargo_extra: ""
            fips: false
          - name: Windows x86 Release
            os: windows-latest
            arch: x86
            config: release
            cargo_target: i686-pc-windows-msvc
            cargo_profile: "--release"
            cargo_extra: "--no-default-features"
            fips: false
          - name: Windows ARM64 Release
            os: windows-11-arm
            arch: arm64
            config: release
            cargo_target: aarch64-pc-windows-msvc
            cargo_profile: "--release"
            cargo_extra: ""
            fips: false
          - name: Windows x64 FIPS
            os: windows-latest
            arch: x64
            config: release
            cargo_target: x86_64-pc-windows-msvc
            cargo_profile: "--release"
            cargo_extra: ""
            fips: true
    runs-on: ${{ matrix.os }}
    name: build_msi (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache (MSI build)
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}msi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}msi-
            ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-msi-

      - name: Restore Rust target cache (MSI build)
        # Cache restore failures never fail the job — fall back to clean build.
        # No restore-keys: a stale target dir (from a different Cargo.lock) causes
        # rust-lld linker failures on i686 debug due to cross-CGU symbol mismatches.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cargo-target-msi
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}msi-${{ matrix.config }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .cargo-cache/registry | Out-Null
          New-Item -ItemType Directory -Force -Path .cargo-cache/git | Out-Null
          New-Item -ItemType Directory -Force -Path .cargo-target-msi | Out-Null

      - name: Install Rust target
        if: matrix.arch == 'x86'
        run: rustup target add ${{ matrix.cargo_target }}

      - name: Download self-built WiX
        uses: actions/download-artifact@v8
        with:
          name: wix-toolset-v7
          path: wix-artifacts

      - name: Install WiX from local source
        uses: ./.github/actions/install-wix-from-artifact
        with:
          wix-version: ${{ env.WIX_VERSION }}

      - name: Setup FIPS build environment
        if: matrix.fips && success()
        uses: ./.github/actions/setup-fips-build-env
        with:
          msvc-arch: x64

      - name: Build ODBC driver
        # pwsh for the explicit $LASTEXITCODE propagation below. The Strawberry
        # Perl PATH prepend that used to sit here went with F2: no step compiles
        # OpenSSL from source any more, so nothing needs Perl.
        # The FIPS row uses the MSVC linker from setup-fips-build-env. rust-lld
        # stays on the standard rows. A unique /MAP path is the evidence
        # check_linked_crypto.py reads for that exact link. build.rs adds
        # /DEPENDENTLOADFLAG:0x1100 on that FIPS cdylib link.
        shell: pwsh
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-msi
          FIPS: ${{ matrix.fips && '1' || '0' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:FIPS -eq "1") {
            Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue
            $env:CARGO_PROFILE_RELEASE_STRIP = "false"
            $mapDir = Join-Path $env:RUNNER_TEMP ("fips-odbc-map-" + [guid]::NewGuid().ToString("n"))
            New-Item -ItemType Directory -Force -Path $mapDir | Out-Null
            $map = Join-Path $mapDir "sfodbc.map"
            "ODBC_LINKER_MAP=$map" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            cargo rustc --locked --release --lib --package odbc --features fips --target ${{ matrix.cargo_target }} -- -C "link-arg=/MAP:$map"
          } else {
            $env:RUSTFLAGS = "-C linker=rust-lld"
            cargo build --locked ${{ matrix.cargo_profile }} --package odbc ${{ matrix.cargo_extra }} --target ${{ matrix.cargo_target }}
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Cargo registry cache (MSI build)
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}msi-${{ hashFiles('**/Cargo.lock') }}

      - name: Save Rust target cache (MSI build)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: .cargo-target-msi
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}msi-${{ matrix.config }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Rename x86 driver DLL
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          $dir = ".cargo-target-msi/${{ matrix.cargo_target }}/${{ matrix.config }}"
          Move-Item -Force "$dir/sfodbc.dll" "$dir/sfodbc32.dll"
          if (Test-Path "$dir/sfodbc.pdb") { Move-Item -Force "$dir/sfodbc.pdb" "$dir/sfodbc32.pdb" }

      - name: Set up Python
        if: matrix.fips && success()
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check linked FIPS crypto
        if: matrix.fips && success()
        shell: pwsh
        run: |
          python ci/fips/check_linked_crypto.py ".cargo-target-msi/${{ matrix.cargo_target }}/${{ matrix.config }}/sfodbc.dll" --linker-map "$env:ODBC_LINKER_MAP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test FIPS DLL selection
        shell: pwsh
        run: .\scripts\odbc\Test-SelectFipsDll.ps1

      - name: Build MSI installer
        shell: pwsh
        run: |
          $packageArgs = @{
            DriverBinDir = ".cargo-target-msi\${{ matrix.cargo_target }}\${{ matrix.config }}"
            Arch = "${{ matrix.arch }}"
            BuildConfig = "${{ matrix.config }}"
          }
          if ('${{ matrix.fips }}' -eq 'true') { $packageArgs.Fips = $true }
          .\odbc\installer\win\package.ps1 @packageArgs

      - name: Build MSI upgrade fixture
        shell: pwsh
        run: >
          .\odbc\installer\win\package.ps1
          -DriverBinDir ".cargo-target-msi\${{ matrix.cargo_target }}\${{ matrix.config }}"
          -Arch ${{ matrix.arch }}
          -BuildConfig ${{ matrix.config }}
          -Version 0.0.1
          -OutputDir build\upgrade-fixture

      - name: Verify MSI driver-name lifecycle
        shell: pwsh
        run: |
          $msi = @(Get-Item build\snowflake-odbc-*.msi)
          $old = @(Get-Item build\upgrade-fixture\snowflake-odbc-*.msi)
          if ($msi.Count -ne 1) { throw "expected one MSI in build\, found $($msi.Count)" }
          if ($old.Count -ne 1) { throw "expected one upgrade fixture, found $($old.Count)" }
          .\scripts\odbc\Test-OdbcMsiDriverName.ps1 `
            -MsiPath $msi[0].FullName `
            -UpgradeMsiPath $old[0].FullName `
            -Arch ${{ matrix.arch }} `
            -LogDir build\msi-driver-name-logs

      - name: Verify FIPS driver loads beside its crypto DLL
        if: matrix.fips && success()
        shell: pwsh
        run: |
          $msi = @(Get-Item build\snowflake-odbc-fips-*.msi)
          if ($msi.Count -ne 1) { throw "expected one FIPS MSI, found $($msi.Count)" }
          .\scripts\odbc\Test-OdbcMsiFipsLoad.ps1 -MsiPath $msi[0].FullName -LogDir build\msi-fips-load-logs

      - name: Upload MSI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}${{ matrix.config }}-${{ matrix.arch }}
          path: |
            build/snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}*.msi
            build/msi-driver-name-logs/
          if-no-files-found: warn

  verify_fips_same_version_upgrade:
    needs: build_msi
    runs-on: windows-latest
    name: verify FIPS MSI replaces the standard x64 MSI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download standard x64 MSI
        uses: actions/download-artifact@v8
        with:
          name: snowflake-odbc-release-x64
          path: msi-standard

      - name: Download FIPS x64 MSI
        uses: actions/download-artifact@v8
        with:
          name: snowflake-odbc-fips-release-x64
          path: msi-fips

      - name: Install the standard MSI and then the same-version FIPS MSI
        shell: pwsh
        run: |
          $standard = @(Get-Item msi-standard\snowflake-odbc-*.msi)
          $fips = @(Get-Item msi-fips\snowflake-odbc-fips-*.msi)
          if ($standard.Count -ne 1) { throw "expected one standard MSI, found $($standard.Count)" }
          if ($fips.Count -ne 1) { throw "expected one FIPS MSI, found $($fips.Count)" }
          .\scripts\odbc\Test-OdbcMsiFipsReplace.ps1 `
            -StandardMsi $standard[0].FullName `
            -FipsMsi $fips[0].FullName `
            -LogDir build\msi-fips-replace-logs

  build_rpm:
    # RPM packaging is independent: it builds the driver from scratch in its own Docker image
    # and does not consume artifacts from the test jobs.
    # FIPS rows are a second package. The image's FIPS=1 layer supplies GCC 13
    # and Go, and the .so stays unstripped so check_linked_crypto.py can see
    # the AWS-LC FIPS module.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64-glibc
            arch: x86_64
            fips: false
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64-glibc
            arch: aarch64
            fips: false
          - os: ubuntu-latest
            name: Linux x64 FIPS
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64-glibc
            arch: x86_64
            fips: true
          - os: ubuntu-24.04-arm
            name: Linux ARM64 FIPS
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64-glibc
            arch: aarch64
            fips: true
    runs-on: ${{ matrix.os }}
    name: build_rpm (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Linux driver-name scripts
        run: bash odbc/installer/unix/driver_name_test.sh

      - name: Restore Cargo registry cache (RPM build)
        id: rpm-cargo-registry
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}rpm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}rpm-
            ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-rpm-

      - name: Restore Rust target cache (RPM build)
        id: rpm-cargo-target
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cargo-target-rpm
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}rpm-release-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}rpm-release-target-

      - name: Prepare cache directories
        run: mkdir -p .cargo-cache/registry .cargo-cache/git .cargo-target-rpm

      - name: Build Docker image
        run: docker build --build-arg FIPS=${{ matrix.fips && '1' || '0' }} -t rpm-build -f ci/Dockerfile.rocky-rpm-build .

      - name: Build ODBC driver and package RPM
        env:
          PKG_VARIANT: ${{ matrix.fips && 'fips' || '' }}
          CARGO_FEATURES: ${{ matrix.fips && '--features fips' || '' }}
          FIPS_CFLAGS: ${{ matrix.fips && matrix.arch == 'aarch64' && '-fno-jump-tables' || '' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ matrix.fips && 'false' || '' }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.cargo-cache/registry:/root/.cargo/registry \
            -v ${{ github.workspace }}/.cargo-cache/git:/root/.cargo/git \
            -v ${{ github.workspace }}/.cargo-target-rpm:/workspace/target \
            -w /workspace \
            -e PLATFORM=${{ matrix.platform }} \
            -e COMMIT_HASH=$(git rev-parse --short HEAD) \
            -e PKG_FORMATS=rpm \
            -e PKG_VARIANT \
            -e CARGO_FEATURES \
            -e FIPS_CFLAGS \
            -e CARGO_PROFILE_RELEASE_STRIP \
            -e RUSTFLAGS="-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--undefined-version" \
            rpm-build \
            bash -c 'set -euo pipefail
              if [ -z "${CARGO_PROFILE_RELEASE_STRIP}" ]; then unset CARGO_PROFILE_RELEASE_STRIP; fi
              if [ "${PKG_VARIANT}" = fips ]; then
                # shellcheck disable=SC1091
                source /opt/rh/gcc-toolset-13/enable
                export CC=gcc CXX=g++
                if [ -n "${FIPS_CFLAGS}" ]; then export CFLAGS="${FIPS_CFLAGS}" CXXFLAGS="${FIPS_CFLAGS}"; fi
                go version
                gcc --version
              fi
              cargo build --locked --release --package odbc ${CARGO_FEATURES} --target ${{ matrix.target }}
              ./odbc/installer/unix/package.sh'

      # Container writes the mounted cache dirs as root, and some crates ship
      # owner-only file modes, so the runner cannot read them back.
      - name: Fix ownership of cached dirs
        if: always()
        run: |
          for d in .cargo-cache .cargo-target-rpm; do
            [ -L "$d" ] && continue
            [ -e "$d" ] || continue
            sudo chown -Rh "$(id -u):$(id -g)" "$d"
          done

      - name: Check linked FIPS crypto
        if: matrix.fips && success()
        run: python3 ci/fips/check_linked_crypto.py ".cargo-target-rpm/${{ matrix.target }}/release/libsfodbc.so"

      - name: Record FIPS RPM evidence
        if: matrix.fips && success()
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r -d '' file; do
            matches+=("$file")
          done < <(find build -maxdepth 1 -name 'snowflake-odbc-fips-*.rpm' -print0)
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "expected one FIPS RPM, found ${#matches[@]}" >&2
            exit 1
          fi
          python3 ci/fips/package_evidence.py --package "${matches[0]}" --output-dir fips-evidence/rpm
          echo "FIPS_RPM_PACKAGE=${matches[0]}" >> "$GITHUB_ENV"

      - name: Save Cargo registry cache (RPM build)
        if: steps.rpm-cargo-registry.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}rpm-${{ hashFiles('**/Cargo.lock') }}

      - name: Save Rust target cache (RPM build)
        if: steps.rpm-cargo-target.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: .cargo-target-rpm
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}rpm-release-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check linked FIPS crypto in the hashed RPM
        if: matrix.fips && success()
        run: python3 ci/fips/check_packaged_driver.py --package "$FIPS_RPM_PACKAGE"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}rpm-${{ matrix.arch }}
          path: build/snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}*.rpm

      - name: Upload FIPS RPM evidence
        if: matrix.fips && success()
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-fips-rpm-${{ matrix.arch }}-evidence
          path: fips-evidence/rpm/

  build_pkg:
    # The FIPS row builds both slices with --features fips and leaves release
    # symbols in place. check_linked_crypto.py reads each slice, and the
    # package ships the AWS-LC crypto library next to libsfodbc.dylib.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            fips: false
          - name: macOS Universal FIPS
            fips: true
    runs-on: macos-latest
    name: build_pkg (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache (pkg build)
        uses: actions/cache/restore@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-universal-cargo-registry-${{ matrix.fips && 'fips-' || '' }}pkg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-universal-cargo-registry-${{ matrix.fips && 'fips-' || '' }}pkg-
            ${{ runner.os }}-universal-cargo-registry-pkg-

      - name: Restore Rust target cache (pkg build)
        uses: actions/cache/restore@v6
        with:
          path: .cargo-target-pkg
          key: ${{ runner.os }}-universal-rust-${{ matrix.fips && 'fips-' || '' }}pkg-release-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-universal-rust-${{ matrix.fips && 'fips-' || '' }}pkg-release-target-

      - name: Prepare cache directories
        run: mkdir -p .cargo-cache/registry .cargo-cache/git .cargo-target-pkg

      - name: Install Rust targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Create ODBC stub libraries for linking
        run: |
          mkdir -p .odbc-stub
          echo "void _odbc_stub(void) {}" | clang -x c -arch x86_64 -arch arm64 -dynamiclib \
            -Wl,-install_name,libodbc.dylib -o .odbc-stub/libodbc.dylib -

      - name: Setup FIPS build environment
        if: matrix.fips && success()
        uses: ./.github/actions/setup-fips-build-env

      - name: Build ODBC driver (x86_64)
        run: |
          set -euo pipefail
          if [ "${FIPS}" = 1 ]; then export CARGO_PROFILE_RELEASE_STRIP=false; fi
          cargo build --locked --release --package odbc ${{ matrix.fips && '--features fips' || '' }} --target x86_64-apple-darwin
        env:
          FIPS: ${{ matrix.fips && '1' || '0' }}
          CARGO_HOME: ${{ github.workspace }}/.cargo-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-pkg
          RUSTFLAGS: "-L native=${{ github.workspace }}/.odbc-stub"

      - name: Build ODBC driver (aarch64)
        run: |
          set -euo pipefail
          if [ "${FIPS}" = 1 ]; then export CARGO_PROFILE_RELEASE_STRIP=false; fi
          cargo build --locked --release --package odbc ${{ matrix.fips && '--features fips' || '' }} --target aarch64-apple-darwin
        env:
          FIPS: ${{ matrix.fips && '1' || '0' }}
          CARGO_HOME: ${{ github.workspace }}/.cargo-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-pkg
          RUSTFLAGS: "-L native=${{ github.workspace }}/.odbc-stub"

      - name: Check linked FIPS crypto
        if: matrix.fips && success()
        run: |
          python3 ci/fips/check_linked_crypto.py \
            .cargo-target-pkg/x86_64-apple-darwin/release/libsfodbc.dylib \
            .cargo-target-pkg/aarch64-apple-darwin/release/libsfodbc.dylib

      - name: Save Cargo registry cache (pkg build)
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-universal-cargo-registry-${{ matrix.fips && 'fips-' || '' }}pkg-${{ hashFiles('**/Cargo.lock') }}

      - name: Save Rust target cache (pkg build)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/cache/save@v6
        with:
          path: .cargo-target-pkg
          key: ${{ runner.os }}-universal-rust-${{ matrix.fips && 'fips-' || '' }}pkg-release-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Package pkg
        run: ./odbc/installer/mac/package.sh
        env:
          DRIVER_X86_64: .cargo-target-pkg/x86_64-apple-darwin/release/libsfodbc.dylib
          DRIVER_ARM64: .cargo-target-pkg/aarch64-apple-darwin/release/libsfodbc.dylib
          PKG_VARIANT: ${{ matrix.fips && 'fips' || '' }}

      - name: Record FIPS pkg evidence
        if: matrix.fips && success()
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r -d '' file; do
            matches+=("$file")
          done < <(find build -maxdepth 1 -name 'snowflake-odbc-fips-*.universal.pkg' -print0)
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "expected one FIPS pkg, found ${#matches[@]}" >&2
            exit 1
          fi
          python3 ci/fips/package_evidence.py --package "${matches[0]}" --output-dir fips-evidence/pkg
          echo "FIPS_PKG_PACKAGE=${matches[0]}" >> "$GITHUB_ENV"

      - name: Check linked FIPS crypto in the hashed pkg
        if: matrix.fips && success()
        run: python3 ci/fips/check_packaged_driver.py --package "$FIPS_PKG_PACKAGE"

      - name: Upload pkg
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}macos-universal
          path: build/snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}*.universal.pkg

      - name: Upload FIPS pkg evidence
        if: matrix.fips && success()
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-fips-macos-universal-evidence
          path: fips-evidence/pkg/

  build_deb:
    # FIPS rows are a second package. The image's FIPS=1 layer supplies GCC 13
    # and Go, and the .so stays unstripped so check_linked_crypto.py can see
    # the AWS-LC FIPS module.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64-glibc
            arch: x86_64
            fips: false
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64-glibc
            arch: aarch64
            fips: false
          - os: ubuntu-latest
            name: Linux x64 FIPS
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64-glibc
            arch: x86_64
            fips: true
          - os: ubuntu-24.04-arm
            name: Linux ARM64 FIPS
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64-glibc
            arch: aarch64
            fips: true
    runs-on: ${{ matrix.os }}
    name: build_deb (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache (DEB build)
        id: deb-cargo-registry
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}deb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}deb-
            ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-deb-

      - name: Restore Rust target cache (DEB build)
        id: deb-cargo-target
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cargo-target-deb
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}deb-release-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}deb-release-target-

      - name: Prepare cache directories
        run: mkdir -p .cargo-cache/registry .cargo-cache/git .cargo-target-deb

      - name: Build Docker image
        run: docker build --build-arg FIPS=${{ matrix.fips && '1' || '0' }} -t deb-build -f ci/Dockerfile.debian-deb-build .

      - name: Build ODBC driver and package .deb + .tgz
        env:
          PKG_VARIANT: ${{ matrix.fips && 'fips' || '' }}
          CARGO_FEATURES: ${{ matrix.fips && '--features fips' || '' }}
          FIPS_CFLAGS: ${{ matrix.fips && matrix.arch == 'aarch64' && '-fno-jump-tables' || '' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ matrix.fips && 'false' || '' }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.cargo-cache/registry:/root/.cargo/registry \
            -v ${{ github.workspace }}/.cargo-cache/git:/root/.cargo/git \
            -v ${{ github.workspace }}/.cargo-target-deb:/workspace/target \
            -w /workspace \
            -e PLATFORM=${{ matrix.platform }} \
            -e COMMIT_HASH=$(git rev-parse --short HEAD) \
            -e PKG_FORMATS="deb tgz" \
            -e PKG_VARIANT \
            -e CARGO_FEATURES \
            -e FIPS_CFLAGS \
            -e CARGO_PROFILE_RELEASE_STRIP \
            -e RUSTFLAGS="-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--undefined-version" \
            deb-build \
            bash -c 'set -euo pipefail
              if [ -z "${CARGO_PROFILE_RELEASE_STRIP}" ]; then unset CARGO_PROFILE_RELEASE_STRIP; fi
              if [ "${PKG_VARIANT}" = fips ]; then
                export CC=gcc-13 CXX=g++-13
                if [ -n "${FIPS_CFLAGS}" ]; then export CFLAGS="${FIPS_CFLAGS}" CXXFLAGS="${FIPS_CFLAGS}"; fi
                go version
                gcc-13 --version
              fi
              cargo build --locked --release --package odbc ${CARGO_FEATURES} --target ${{ matrix.target }}
              ./odbc/installer/unix/package.sh'

      # Container writes the mounted cache dirs as root, and some crates ship
      # owner-only file modes, so the runner cannot read them back.
      - name: Fix ownership of cached dirs
        if: always()
        run: |
          for d in .cargo-cache .cargo-target-deb; do
            [ -L "$d" ] && continue
            [ -e "$d" ] || continue
            sudo chown -Rh "$(id -u):$(id -g)" "$d"
          done

      - name: Check linked FIPS crypto
        if: matrix.fips && success()
        run: python3 ci/fips/check_linked_crypto.py ".cargo-target-deb/${{ matrix.target }}/release/libsfodbc.so"

      - name: Record FIPS deb and tgz evidence
        if: matrix.fips && success()
        run: |
          set -euo pipefail
          record() {
            local pattern="$1"
            local out="$2"
            local env_name="$3"
            local matches=()
            while IFS= read -r -d '' file; do
              matches+=("$file")
            done < <(find build -maxdepth 1 -name "$pattern" -print0)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "expected one ${pattern}, found ${#matches[@]}" >&2
              exit 1
            fi
            python3 ci/fips/package_evidence.py --package "${matches[0]}" --output-dir "$out"
            echo "${env_name}=${matches[0]}" >> "$GITHUB_ENV"
          }
          record 'snowflake-odbc-fips-*.deb' fips-evidence/deb FIPS_DEB_PACKAGE
          record 'snowflake-odbc-fips-*.tar.gz' fips-evidence/tgz FIPS_TGZ_PACKAGE

      - name: Save Cargo registry cache (DEB build)
        if: steps.deb-cargo-registry.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: .cargo-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ matrix.fips && 'fips-' || '' }}deb-${{ hashFiles('**/Cargo.lock') }}

      - name: Save Rust target cache (DEB build)
        if: steps.deb-cargo-target.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: .cargo-target-deb
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ matrix.fips && 'fips-' || '' }}deb-release-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check linked FIPS crypto in the hashed deb and tgz
        if: matrix.fips && success()
        run: |
          python3 ci/fips/check_packaged_driver.py --package "$FIPS_DEB_PACKAGE"
          python3 ci/fips/check_packaged_driver.py --package "$FIPS_TGZ_PACKAGE"

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}deb-${{ matrix.arch }}
          path: build/snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}*.deb

      - name: Upload .tgz
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}tgz-${{ matrix.arch }}
          path: build/snowflake-odbc-${{ matrix.fips && 'fips-' || '' }}*.tar.gz

      - name: Upload FIPS deb evidence
        if: matrix.fips && success()
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-fips-deb-${{ matrix.arch }}-evidence
          path: fips-evidence/deb/

      - name: Upload FIPS tgz evidence
        if: matrix.fips && success()
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-odbc-fips-tgz-${{ matrix.arch }}-evidence
          path: fips-evidence/tgz/
