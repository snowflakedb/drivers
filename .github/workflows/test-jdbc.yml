name: JDBC CI

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  jdbc-tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_jdbc == 'true'
    name: JDBC Tests (full suite)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java-version: ['8']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Build Rust components
        run: |
          cargo build --package sf_core
          cargo build --package jdbc_bridge

      - name: Make gradlew executable
        run: chmod +x jdbc/gradlew

      - name: Run JDBC tests
        run: |
          ls -l target/debug/
          export PARAMETER_PATH=$(pwd)/parameters.json
          export CORE_PATH=$(pwd)/target/debug/libjdbc_bridge.so
          cd jdbc
          ./gradlew test jacocoTestReport --stacktrace

  jdbc-compat-old:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_jdbc == 'true'
    name: JDBC Old Driver Compatibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Make gradlew executable
        run: chmod +x jdbc/gradlew

      - name: Run JDBC compatibility tests
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cd jdbc
          ./gradlew compatibilityTest jacocoCompatibilityReport --stacktrace

      - name: Upload OLD compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdbc-compat-old-artifacts
          path: |
            jdbc/build/test-results/compatibilityTest/**/*.xml
            jdbc/build/jacoco/compatibilityTest.exec
            jdbc/build/reports/jacoco/compatibilityTest/**
          if-no-files-found: error

      - name: Print OLD compatibility overall coverage
        if: always()
        run: |
          python3 jdbc/ci/reference_tests/extract_coverage.py \
            --report jdbc/build/reports/jacoco/compatibilityTest/coverage.xml \
            --label "OLD JDBC compatibility" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --allow-missing

  jdbc-status:
    needs: [detect-changes, jdbc-tests, jdbc-compat-old]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== JDBC CI Status ==="
          
          NEW_RESULT="${{ needs.jdbc-tests.result }}"
          COMPAT_RESULT="${{ needs.jdbc-compat-old.result }}"

          # Check if tests were skipped
          if [[ "$NEW_RESULT" == "skipped" && "$COMPAT_RESULT" == "skipped" ]]; then
            echo "✓ JDBC jobs were SKIPPED (no relevant changes detected)"
            echo "  - run_jdbc: ${{ needs.detect-changes.outputs.run_jdbc }}"
            exit 0
          fi
          
          # Check if any job failed or was cancelled
          if [[ "$NEW_RESULT" =~ ^(failure|cancelled)$ || "$COMPAT_RESULT" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ JDBC CI FAILED or CANCELLED"
            echo "  - JDBC Tests (new): $NEW_RESULT"
            echo "  - JDBC Compat (old): $COMPAT_RESULT"
            exit 1
          fi
          
          # Tests ran and passed
          echo "✓ JDBC jobs were RUN and PASSED"
          echo "  - JDBC Tests (new): $NEW_RESULT"
          echo "  - JDBC Compat (old): $COMPAT_RESULT"
          exit 0
