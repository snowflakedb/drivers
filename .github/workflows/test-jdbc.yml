name: JDBC CI

on:
  # Every event is orchestrated by driver-status.yml, which resolves the
  # suites to run and invokes only the affected driver workflows.
  workflow_call:
    inputs:
      run_jdbc:
        description: "Run JDBC tests."
        type: boolean
        required: false
        default: false
      run_jdbc_reference:
        description: "Run JDBC reference tests."
        type: boolean
        required: false
        default: false

concurrency:
  # Group by PR number for PRs; fall back to run ID for push-to-main,
  # push-to-release, and merge_group runs (each run is unique so they won't
  # cancel each other).
  #
  # The prefix is a literal, not ${{ github.workflow }}: inside a workflow_call
  # the github context belongs to the caller, so github.workflow would resolve
  # to "Driver CI" and put this run in the orchestrator's own group. GitHub
  # reads that as a deadlock and fails the call before any job starts.
  group: jdbc-ci-${{ github.event.pull_request.number || github.run_id }}
  # Cancel only in-flight PR runs. Unrelated labels must not replace the
  # matrix; push-to-main must never cancel a sibling run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || contains(fromJSON('["ci:scope-merge-queue","ci:scope-merge","ci:scope-nightly"]'), github.event.label.name)) }}

env:
  CARGO_TERM_COLOR: always
  # Shrink workspace-crate debug info on *miss* rebuilds. Dependencies already
  # use debug = 0 via [profile.dev.package."*"]. Do NOT bump jdbc-bridge-cache
  # key-suffix for this alone: warm `debug-default` hits stay valid; rebuilt
  # libs gradually pick up line-tables-only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Linux matrix + parity start immediately (parallel with Windows/macOS). Each
  # cell hits jdbc-bridge-cache; cargo-cache restore/save only runs on a miss so
  # the warm path skips multi-GB Rust target I/O. A prior revision serialized
  # the matrix behind a shared build job + bumped cache keys to line-tables-v2,
  # which added ~7 min before Linux tests and forced a cold Windows rebuild
  # (wall-clock ~27 min vs ~17.5 min warm baseline).
  jdbc_tests:
    if: inputs.run_jdbc
    strategy:
      fail-fast: false
      matrix:
        # AWS covers every LTS Java release (8, 11, 17, 21, 25); GCP and Azure
        # sanity-check the current LTS (21) only. `cloud` selects which
        # parameters_${cloud}.json decode_secrets.sh decodes — the tests are
        # cloud-agnostic except for PUT/GET stage I/O (S3 vs GCS vs Azure Blob).
        include:
          # ── AWS: every LTS ─────────────────────────────────────────────
          - os: ubuntu-latest
            java-version: '8'
            cloud: aws
            result_format: default
          - os: ubuntu-latest
            java-version: '8'
            cloud: aws
            result_format: json
          # Java 11/17/21/25 rows exercise wiremock-based tests in
          # net.snowflake.jdbc.wiremock.* (the vendored WireMock 3.x JAR requires
          # JRE 11+ to launch). Java 8 rows skip those cleanly via
          # assumeTrue(WiremockClient.requiresJava11OrHigher()).
          - os: ubuntu-latest
            java-version: '11'
            cloud: aws
            result_format: default
          - os: ubuntu-latest
            java-version: '17'
            cloud: aws
            result_format: default
          - os: ubuntu-latest
            java-version: '21'
            cloud: aws
            result_format: default
          - os: ubuntu-latest
            java-version: '25'
            cloud: aws
            result_format: default
          # ── GCP / Azure: current LTS (21) sanity check ─────────────────
          - os: ubuntu-latest
            java-version: '21'
            cloud: gcp
            result_format: default
          - os: ubuntu-latest
            java-version: '21'
            cloud: azure
            result_format: default
    runs-on: ${{ matrix.os }}
    name: JDBC Tests (Java ${{ matrix.java-version }}, ${{ matrix.cloud }}, ${{ matrix.result_format }} format)
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Restore Gradle cache
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdbc-
            ${{ runner.os }}-gradle-

      # generateProtobuf runs `cargo run -p proto_generator` when outputs are
      # missing (gitignored). Cache the generated Java across matrix cells.
      - name: Restore generated protobuf Java
        id: protobuf-gen-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: JDBC bridge cache
        id: jdbc-bridge-cache
        uses: ./.github/actions/jdbc-bridge-cache
        with:
          path: target/debug/libjdbc_bridge.so
          # Keep stable suffix so warm main caches still hit (see env comment).
          key-suffix: debug-default

      - name: Restore Rust cache
        id: rust-cache
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "jdbc"

      - name: Build jdbc_bridge
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        # jdbc_bridge embeds sf_core as an rlib; only libjdbc_bridge.so is loaded.
        run: cargo build --locked --package jdbc_bridge

      - name: Run JDBC tests
        run: |
          ls -l target/debug/
          export PARAMETER_PATH=$(pwd)/parameters.json
          export CORE_PATH=$(pwd)/target/debug/libjdbc_bridge.so
          export QUERY_RESULT_FORMAT=${{ matrix.result_format == 'json' && 'JSON' || '' }}
          cd jdbc
          # JaCoCo only on the primary Linux cell — coverage is the same across
          # Java/cloud matrix rows; reporting on every cell burns wall-clock.
          if [[ "${{ matrix.java-version }}" == "21" && "${{ matrix.cloud }}" == "aws" && "${{ matrix.result_format }}" == "default" ]]; then
            bash ./ci/gradlew_with_resolve_retry.sh test jacocoTestReport
          else
            bash ./ci/gradlew_with_resolve_retry.sh test
          fi
        env:
          CLOUD_PROVIDER: ${{ matrix.cloud }}
          # One retry on PRs (flaky reliability); two in merge queue.
          GRADLE_TEST_RETRY_COUNT: ${{ github.event_name == 'merge_group' && '2' || '1' }}

      - name: Upload NEW driver test results
        if: always() && matrix.result_format == 'default'
        uses: actions/upload-artifact@v7
        with:
          name: jdbc-tests-artifacts-java${{ matrix.java-version }}-${{ matrix.cloud }}
          path: |
            jdbc/build/test-results/test/**/*.xml
          if-no-files-found: error

      - name: Upload NEW driver coverage (primary Linux cell)
        if: always() && matrix.java-version == '21' && matrix.cloud == 'aws' && matrix.result_format == 'default'
        uses: actions/upload-artifact@v7
        with:
          name: jdbc-tests-coverage-java21-aws
          path: |
            jdbc/build/jacoco/test.exec
            jdbc/build/reports/jacoco/test/**
          if-no-files-found: error

      - name: Print NEW driver overall coverage
        if: always() && matrix.java-version == '21' && matrix.cloud == 'aws' && matrix.result_format == 'default'
        run: |
          python3 jdbc/ci/reference_tests/extract_coverage.py \
            --report jdbc/build/reports/jacoco/test/jacocoTestReport.xml \
            --label "NEW JDBC (Java ${{ matrix.java-version }}, ${{ matrix.cloud }})" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --allow-missing

      - name: Save generated protobuf Java
        if: always() && steps.protobuf-gen-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: Save Rust cache
        if: always() && steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "jdbc"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}

  # ── Windows / macOS smoke lanes ──────────────────────────────────────
  # The jdbc_tests matrix above is Linux-only. These two jobs run a single
  # sanity lane (Java 21, aws, default format) on the other two desktop OSes so
  # platform-specific breakage in the native bridge and its JNI loading path is
  # caught on every PR. They're kept as standalone jobs rather than folded into
  # the matrix because the native library name/extension and path handling
  # differ per OS (see CORE_PATH below).
  jdbc_tests_windows:
    if: inputs.run_jdbc
    name: JDBC Tests (Windows, Java 21, aws)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode secrets
        # decode_secrets.sh is a POSIX shell script — run it under git-bash.
        shell: bash
        run: ./scripts/decode_secrets.sh aws
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Restore Gradle cache
        id: gradle-cache-win
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdbc-
            ${{ runner.os }}-gradle-

      - name: Restore generated protobuf Java
        id: protobuf-gen-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: JDBC bridge cache
        id: jdbc-bridge-cache
        uses: ./.github/actions/jdbc-bridge-cache
        with:
          path: target/debug/jdbc_bridge.dll
          # This lane no longer passes `--features vendored-openssl`, so it
          # builds the same configuration as the other lanes and takes the same
          # discriminator. Not a gratuitous bump: the action prefixes the key
          # with runner.os/runner.arch, so sharing a name with the Linux lanes
          # cannot collide, and its hashed inputs already include Cargo.lock
          # and sf_core/Cargo.toml, which this change touches.
          key-suffix: debug-default

      - name: Restore Rust cache
        id: rust-cache
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        # The cargo-cache action keys target/ by runner.os, so this Windows cache
        # never collides with the Linux "jdbc" caches despite the shared key.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "jdbc"

      - name: Build Rust components
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --package jdbc_bridge

      - name: Run JDBC tests
        shell: bash
        run: |
          ls -l target/debug/
          # Windows cdylib is emitted as jdbc_bridge.dll (no lib prefix). The JVM
          # is a native Windows process, so hand it Windows-style paths (cygpath
          # -w) rather than the /d/a/... git-bash form.
          export PARAMETER_PATH="$(cygpath -w "$(pwd)/parameters.json")"
          export CORE_PATH="$(cygpath -w "$(pwd)/target/debug/jdbc_bridge.dll")"
          cd jdbc
          # Skip JaCoCo on the wall-clock-critical Windows lane — coverage comes
          # from the primary Linux cell. More forks: tests are mostly network-bound
          # to Snowflake (default is 4).
          bash ./ci/gradlew_with_resolve_retry.sh test
        env:
          CLOUD_PROVIDER: aws
          GRADLE_MAX_PARALLEL_FORKS: '6'
          GRADLE_TEST_RETRY_COUNT: ${{ github.event_name == 'merge_group' && '2' || '1' }}

      - name: Upload NEW driver test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jdbc-tests-artifacts-java21-aws-windows
          path: |
            jdbc/build/test-results/test/**/*.xml
          if-no-files-found: error

      - name: Save generated protobuf Java
        if: always() && steps.protobuf-gen-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: Save Rust cache
        if: always() && steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "jdbc"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save Gradle cache
        if: always() && steps.gradle-cache-win.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}

  jdbc_tests_macos:
    if: inputs.run_jdbc
    name: JDBC Tests (macOS, Java 21, aws)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh aws
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Restore Gradle cache
        id: gradle-cache-mac
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdbc-
            ${{ runner.os }}-gradle-

      - name: Restore generated protobuf Java
        id: protobuf-gen-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: JDBC bridge cache
        id: jdbc-bridge-cache
        uses: ./.github/actions/jdbc-bridge-cache
        with:
          path: target/debug/libjdbc_bridge.dylib
          # Stable suffix: warm main caches must still hit (see workflow env).
          key-suffix: debug-default

      - name: Restore Rust cache
        id: rust-cache
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        # target/ is keyed by runner.os, so this macOS cache never collides with
        # the Linux "jdbc" caches despite the shared key.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "jdbc"

      - name: Build Rust components
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --package jdbc_bridge

      - name: Run JDBC tests
        run: |
          ls -l target/debug/
          # macOS cdylib is emitted as libjdbc_bridge.dylib.
          export PARAMETER_PATH="$(pwd)/parameters.json"
          export CORE_PATH="$(pwd)/target/debug/libjdbc_bridge.dylib"
          cd jdbc
          # Skip JaCoCo — coverage comes from the primary Linux cell.
          bash ./ci/gradlew_with_resolve_retry.sh test
        env:
          CLOUD_PROVIDER: aws
          GRADLE_TEST_RETRY_COUNT: ${{ github.event_name == 'merge_group' && '2' || '1' }}

      - name: Upload NEW driver test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jdbc-tests-artifacts-java21-aws-macos
          path: |
            jdbc/build/test-results/test/**/*.xml
          if-no-files-found: error

      - name: Save generated protobuf Java
        if: always() && steps.protobuf-gen-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: Save Rust cache
        if: always() && steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "jdbc"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save Gradle cache
        if: always() && steps.gradle-cache-mac.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}

  cleanup_jdbc:
    needs: [jdbc_tests, jdbc_tests_windows, jdbc_tests_macos]
    if: always() && (needs.jdbc_tests.result != 'skipped' || needs.jdbc_tests_windows.result != 'skipped' || needs.jdbc_tests_macos.result != 'skipped')
    runs-on: ubuntu-latest
    # jdbc_tests creates PATs on all three cloud accounts, so clean each one.
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    name: cleanup_jdbc (${{ matrix.cloud }})
    steps:
      - uses: actions/checkout@v7

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Cleanup test PATs
        continue-on-error: true
        run: |
          python -m pip install snowflake-connector-python -q
          python scripts/cleanup_env.py \
            --parameter-path "${{ github.workspace }}/parameters.json"

  jdbc_tests_reference:
    if: inputs.run_jdbc_reference
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    name: JDBC Old Driver Reference Tests (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Restore Gradle cache
        id: gradle-cache-ref
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-reference-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdbc-reference-
            ${{ runner.os }}-gradle-

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Run JDBC reference tests
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cd jdbc
          bash ./ci/gradlew_with_resolve_retry.sh referenceTest jacocoReferenceReport
        env:
          CLOUD_PROVIDER: ${{ matrix.cloud }}
          GRADLE_TEST_RETRY_COUNT: ${{ github.event_name == 'merge_group' && '2' || '1' }}

      - name: Upload OLD reference artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jdbc-reference-artifacts-${{ matrix.cloud }}
          path: |
            jdbc/build/test-results/referenceTest/**/*.xml
            jdbc/build/jacoco/referenceTest.exec
            jdbc/build/reports/jacoco/referenceTest/**
          if-no-files-found: error

      - name: Print OLD reference overall coverage
        if: always()
        run: |
          python3 jdbc/ci/reference_tests/extract_coverage.py \
            --report jdbc/build/reports/jacoco/referenceTest/coverage.xml \
            --label "OLD JDBC reference (${{ matrix.cloud }})" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --allow-missing

      - name: Save Gradle cache
        if: always() && steps.gradle-cache-ref.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-reference-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}

  jdbc_parity_tests:
    if: inputs.run_jdbc
    name: JDBC Date,Time,Timestamp Parity Tests
    # Blocking job: runs DateTimeParityTest, the single-JVM oracle that diffs
    # universal-driver against snowflake-jdbc 4.0.1. The matrix is now consistently
    # clean, so parity regressions must block PRs — this job is wired into
    # jdbc-status's `needs` and carries no continue-on-error, so a new parity gap
    # fails the job, fails jdbc-status, and blocks the merge.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # parityTest requires HotSpot — universal-driver's jdbc_bridge::sflogger_layer overflows
      # the stack on OpenJ9 (see build.gradle comment on the parityTest task). Temurin is
      # HotSpot-based.
      - name: Set up Java 8 (Temurin/HotSpot)
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Restore Gradle cache
        id: gradle-cache-parity
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdbc-${{ hashFiles('jdbc/**/*.gradle*', 'jdbc/**/gradle-wrapper.properties', 'jdbc/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdbc-
            ${{ runner.os }}-gradle-

      - name: Restore generated protobuf Java
        id: protobuf-gen-cache-parity
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: JDBC bridge cache
        id: jdbc-bridge-cache
        uses: ./.github/actions/jdbc-bridge-cache
        with:
          path: target/debug/libjdbc_bridge.so
          key-suffix: debug-default

      - name: Restore Rust cache
        id: rust-cache
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "jdbc"

      - name: Build jdbc_bridge
        if: steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --package jdbc_bridge

      - name: Run JDBC parity tests
        run: |
          export CORE_PATH=$(pwd)/target/debug/libjdbc_bridge.so
          cd jdbc
          bash ./ci/gradlew_with_resolve_retry.sh parityTest
        env:
          GRADLE_TEST_RETRY_COUNT: ${{ github.event_name == 'merge_group' && '2' || '1' }}

      - name: Upload parity test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jdbc-parity-artifacts
          path: |
            jdbc/build/test-results/parityTest/**/*.xml
            jdbc/build/reports/tests/parityTest/**
          if-no-files-found: warn

      - name: Save generated protobuf Java
        if: always() && steps.protobuf-gen-cache-parity.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: jdbc/src/main/java/net/snowflake/client/internal/unicore/protobuf_gen
          key: jdbc-protobuf-gen-${{ hashFiles('protobuf/**', 'proto_generator/Cargo.toml', 'proto_generator/Cargo.lock', 'proto_generator/src/**', 'Cargo.lock') }}

      - name: Save Rust cache
        if: always() && steps.jdbc-bridge-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "jdbc"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  jdbc-status:
    needs: [jdbc_tests, jdbc_tests_windows, jdbc_tests_macos, cleanup_jdbc, jdbc_tests_reference, jdbc_parity_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== JDBC CI Status ==="

          NEW_RESULT="${{ needs.jdbc_tests.result }}"
          WINDOWS_RESULT="${{ needs.jdbc_tests_windows.result }}"
          MACOS_RESULT="${{ needs.jdbc_tests_macos.result }}"
          REFERENCE_RESULT="${{ needs.jdbc_tests_reference.result }}"
          PARITY_RESULT="${{ needs.jdbc_parity_tests.result }}"

          # Check if any job failed or was cancelled. This must run before the
          # "tests skipped" check below: a failure in an upstream job can cause
          # a downstream job to be auto-skipped, which would otherwise be
          # misread as "no relevant changes detected" and pass.
          if [[ "$NEW_RESULT" =~ ^(failure|cancelled)$ || "$WINDOWS_RESULT" =~ ^(failure|cancelled)$ || "$MACOS_RESULT" =~ ^(failure|cancelled)$ || "$REFERENCE_RESULT" =~ ^(failure|cancelled)$ || "$PARITY_RESULT" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ JDBC CI FAILED or CANCELLED"
            echo "  - JDBC Tests (new): $NEW_RESULT"
            echo "  - JDBC Tests (Windows): $WINDOWS_RESULT"
            echo "  - JDBC Tests (macOS): $MACOS_RESULT"
            echo "  - JDBC Reference (old): $REFERENCE_RESULT"
            echo "  - JDBC Parity: $PARITY_RESULT"
            exit 1
          fi

          # Check if tests were skipped (only reachable once nothing above failed/cancelled)
          if [[ "$NEW_RESULT" == "skipped" && "$WINDOWS_RESULT" == "skipped" && "$MACOS_RESULT" == "skipped" && "$REFERENCE_RESULT" == "skipped" && "$PARITY_RESULT" == "skipped" ]]; then
            # Driver CI only invokes this workflow for drivers it selected, so a
            # skip here means the gating is broken rather than "nothing to do".
            if [[ "${{ inputs.run_jdbc }}" == "true" ]]; then
              echo "✗ Driver CI requested JDBC tests but every JDBC job was SKIPPED — check the job-level if: conditions."
              exit 1
            fi
            echo "✓ JDBC jobs were SKIPPED (not requested by Driver CI)"
            echo "  - run_jdbc: ${{ inputs.run_jdbc }}"
            exit 0
          fi

          # Tests ran and passed
          echo "✓ JDBC jobs were RUN and PASSED"
          echo "  - JDBC Tests (new): $NEW_RESULT"
          echo "  - JDBC Tests (Windows): $WINDOWS_RESULT"
          echo "  - JDBC Tests (macOS): $MACOS_RESULT"
          echo "  - JDBC Reference (old): $REFERENCE_RESULT"
          echo "  - JDBC Parity: $PARITY_RESULT"
          exit 0
