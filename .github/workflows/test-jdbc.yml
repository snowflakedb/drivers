name: JDBC CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  jdbc_tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_jdbc == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-11-arm]
        java-version: ['8', '11', '17', '21']
        exclude:
          # Temurin only provides Java 21+ for Windows ARM64
          - os: windows-11-arm
            java-version: '8'
          - os: windows-11-arm
            java-version: '11'
          - os: windows-11-arm
            java-version: '17'
    runs-on: ${{ matrix.os }}
    name: jdbc_tests (${{ matrix.os }}, Java ${{ matrix.java-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:

          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust target
        uses: actions/cache@v5
        with:

          path: target
          key: ${{ runner.os }}-rust-jdbc-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-jdbc-target-

      - name: Install ARM64 OpenSSL via vcpkg
        if: runner.arch == 'ARM64'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows

      - name: Configure ARM64 OpenSSL
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows\lib" >> $env:GITHUB_ENV
          echo "C:\vcpkg\installed\arm64-windows\bin" >> $env:GITHUB_PATH

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Build Rust components (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --package sf_core
          cargo build --package jdbc_bridge

      - name: Build Rust components (Windows ARM64)
        if: runner.arch == 'ARM64'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          cargo build --package sf_core --target aarch64-pc-windows-msvc
          cargo build --package jdbc_bridge --target aarch64-pc-windows-msvc

      - name: Make gradlew executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x jdbc/gradlew

      - name: Run JDBC tests (Linux)
        if: runner.os == 'Linux'
        run: |
          ls -l target/debug/
          export PARAMETER_PATH=$(pwd)/parameters.json
          export CORE_PATH=$(pwd)/target/debug/libjdbc_bridge.so
          cd jdbc
          ./gradlew test jacocoTestReport --stacktrace
        env:
          # In merge queue, retry each failing test up to 2 times (via Gradle Test Retry Plugin)
          GRADLE_TEST_RETRY_COUNT: ${{ github.event_name == 'merge_group' && '2' || '' }}

      - name: Verify JDBC bridge DLL exports (Windows ARM64)
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ARM64 build uses --target, output is in target\aarch64-pc-windows-msvc\debug\
          # Quote the workspace so paths with spaces are handled correctly.
          $targetDir = Join-Path "${{ github.workspace }}" "target\aarch64-pc-windows-msvc\debug"
          Get-ChildItem $targetDir
          $env:CORE_PATH = Join-Path $targetDir "jdbc_bridge.dll"
          # Use vswhere -find to locate dumpbin deterministically (avoids slow -Recurse search).
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\arm64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) {
            Write-Error "dumpbin not found — cannot verify jdbc_bridge.dll exports"
            exit 1
          }
          Write-Host "=== DLL Exports (jdbc_bridge.dll) ==="
          $exports = & $dumpbin /exports "$env:CORE_PATH" | Where-Object { $_ -match "Java_|JNI_" }
          if (-not $exports) {
            Write-Error "jdbc_bridge.dll has no Java_ or JNI_ exports — DLL is not a valid JNI library"
            exit 1
          }
          $exports
          # JDBC tests are NOT run on ARM64: Apache Arrow does not ship
          # arrow_cdata_jni.dll for Windows ARM64 in any version through 19.0.0.
          # All tests fail with FileNotFoundException at class initialization.
          # TODO: Re-enable tests when Arrow ships Windows ARM64 JNI, or when
          # we build arrow-c-data JNI from source. Track upstream:
          # https://github.com/apache/arrow-java
          Write-Host "SKIPPED: JDBC tests not run on ARM64 (Arrow JNI not available for Windows ARM64)"

  jdbc_tests_reference:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_jdbc == 'true'
    name: JDBC Old Driver Reference Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Make gradlew executable
        run: chmod +x jdbc/gradlew

      - name: Run JDBC reference tests
        run: |
          export PARAMETER_PATH=$(pwd)/parameters.json
          cd jdbc
          ./gradlew referenceTest jacocoReferenceReport --stacktrace
        env:
          GRADLE_TEST_RETRY_COUNT: ${{ github.event_name == 'merge_group' && '2' || '' }}

      - name: Upload OLD reference artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdbc-reference-artifacts
          path: |
            jdbc/build/test-results/referenceTest/**/*.xml
            jdbc/build/jacoco/referenceTest.exec
            jdbc/build/reports/jacoco/referenceTest/**
          if-no-files-found: error

      - name: Print OLD reference overall coverage
        if: always()
        run: |
          python3 jdbc/ci/reference_tests/extract_coverage.py \
            --report jdbc/build/reports/jacoco/referenceTest/coverage.xml \
            --label "OLD JDBC reference" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --allow-missing

  jdbc-status:
    needs: [detect-changes, jdbc_tests, jdbc_tests_reference]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== JDBC CI Status ==="
          
          NEW_RESULT="${{ needs.jdbc_tests.result }}"
          REFERENCE_RESULT="${{ needs.jdbc_tests_reference.result }}"

          # Check if tests were skipped
          if [[ "$NEW_RESULT" == "skipped" && "$REFERENCE_RESULT" == "skipped" ]]; then
            echo "✓ JDBC jobs were SKIPPED (no relevant changes detected)"
            echo "  - run_jdbc: ${{ needs.detect-changes.outputs.run_jdbc }}"
            exit 0
          fi
          
          # Check if any job failed or was cancelled
          if [[ "$NEW_RESULT" =~ ^(failure|cancelled)$ || "$REFERENCE_RESULT" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ JDBC CI FAILED or CANCELLED"
            echo "  - JDBC Tests (new): $NEW_RESULT"
            echo "  - JDBC Reference (old): $REFERENCE_RESULT"
            exit 1
          fi
          
          # Tests ran and passed
          echo "✓ JDBC jobs were RUN and PASSED"
          echo "  - JDBC Tests (new): $NEW_RESULT"
          echo "  - JDBC Reference (old): $REFERENCE_RESULT"
          exit 0
