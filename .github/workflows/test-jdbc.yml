name: JDBC CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  jdbc_tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_jdbc == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-11-arm]
        java-version: ['8', '11', '17', '21']
        exclude:
          # Temurin only provides Java 21+ for Windows ARM64
          - os: windows-11-arm
            java-version: '8'
          - os: windows-11-arm
            java-version: '11'
          - os: windows-11-arm
            java-version: '17'
    runs-on: ${{ matrix.os }}
    name: jdbc_tests (${{ matrix.os }}, Java ${{ matrix.java-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Decode secrets (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Decode secrets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/decode_secrets.ps1
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Build Rust components
        run: |
          cargo build --package sf_core
          cargo build --package jdbc_bridge

      - name: Make gradlew executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x jdbc/gradlew

      - name: Run JDBC tests (Linux)
        if: runner.os == 'Linux'
        run: |
          ls -l target/debug/
          export PARAMETER_PATH=$(pwd)/parameters.json
          export CORE_PATH=$(pwd)/target/debug/libjdbc_bridge.so
          cd jdbc
          ./gradlew test jacocoTestReport --stacktrace

      - name: Run JDBC tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem target\debug\
          $env:PARAMETER_PATH = "${{ github.workspace }}\parameters.json"
          $env:CORE_PATH = "${{ github.workspace }}\target\debug\jdbc_bridge.dll"
          cd jdbc
          .\gradlew.bat test jacocoTestReport --stacktrace

  jdbc-status:
    needs: [detect-changes, jdbc_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== JDBC CI Status ==="
          
          # Check if tests were skipped
          if [[ "${{ needs.jdbc_tests.result }}" == "skipped" ]]; then
            echo "✓ JDBC tests were SKIPPED (no relevant changes detected)"
            echo "  - run_jdbc: ${{ needs.detect-changes.outputs.run_jdbc }}"
            exit 0
          fi
          
          # Check if tests failed or were cancelled
          if [[ "${{ needs.jdbc_tests.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ JDBC tests were RUN and FAILED or CANCELLED"
            exit 1
          fi
          
          # Tests ran and passed
          echo "✓ JDBC tests were RUN and PASSED"
          exit 0
