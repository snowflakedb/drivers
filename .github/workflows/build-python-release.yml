name: Python Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHON_REFERENCE_DRIVER_VERSION: "4.3.0"

jobs:
  # ── Build wheels (shared reusable workflow) ────────────────────────
  build_wheels:
    uses: ./.github/workflows/_build-python-wheels.yml
    with:
      targets: '{"linux_x86": ["3.11","3.12","3.13","3.14"], "linux_aarch": ["3.11","3.12","3.13","3.14"], "macos_x86": ["3.11","3.12","3.13","3.14"], "macos_arm": ["3.11","3.12","3.13","3.14"], "windows_x86": ["3.11","3.12","3.13","3.14"], "windows_arm": ["3.11","3.12"]}'

  # ── Test wheels and sdist against cloud providers ───────────────────
  # Each Python version tested once per env, cloud providers distributed evenly.
  # Python 3.10 tests from sdist (builds sf_core from source), others from wheels.
  test:
    needs: build_wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — test env, cloud providers rotated across versions
          - { os: ubuntu-latest,   py: "3.10", hatch_env: "test",        cloud_provider: "aws"   }
          - { os: ubuntu-latest,   py: "3.11", hatch_env: "test",        cloud_provider: "gcp"   }
          - { os: ubuntu-latest,   py: "3.12", hatch_env: "test",        cloud_provider: "azure" }
          - { os: ubuntu-latest,   py: "3.13", hatch_env: "test",        cloud_provider: "aws"   }
          - { os: ubuntu-latest,   py: "3.14", hatch_env: "test",        cloud_provider: "gcp"   }
          # Linux — test-pandas env
          - { os: ubuntu-latest,   py: "3.10", hatch_env: "test-pandas", cloud_provider: "azure" }
          - { os: ubuntu-latest,   py: "3.11", hatch_env: "test-pandas", cloud_provider: "aws"   }
          - { os: ubuntu-latest,   py: "3.12", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          - { os: ubuntu-latest,   py: "3.13", hatch_env: "test-pandas", cloud_provider: "azure" }
          - { os: ubuntu-latest,   py: "3.14", hatch_env: "test-pandas", cloud_provider: "aws"   }
          # Linux ARM64 — test env
          - { os: ubuntu-24.04-arm, py: "3.10", hatch_env: "test",        cloud_provider: "aws"   }
          - { os: ubuntu-24.04-arm, py: "3.11", hatch_env: "test",        cloud_provider: "gcp"   }
          - { os: ubuntu-24.04-arm, py: "3.12", hatch_env: "test",        cloud_provider: "azure" }
          - { os: ubuntu-24.04-arm, py: "3.13", hatch_env: "test",        cloud_provider: "aws"   }
          - { os: ubuntu-24.04-arm, py: "3.14", hatch_env: "test",        cloud_provider: "gcp"   }
          # Linux ARM64 — test-pandas env
          - { os: ubuntu-24.04-arm, py: "3.10", hatch_env: "test-pandas", cloud_provider: "azure" }
          - { os: ubuntu-24.04-arm, py: "3.11", hatch_env: "test-pandas", cloud_provider: "aws"   }
          - { os: ubuntu-24.04-arm, py: "3.12", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          - { os: ubuntu-24.04-arm, py: "3.13", hatch_env: "test-pandas", cloud_provider: "azure" }
          - { os: ubuntu-24.04-arm, py: "3.14", hatch_env: "test-pandas", cloud_provider: "aws"   }
          # macOS x86_64 (Intel) — test env
          - { os: macos-13,        py: "3.11", hatch_env: "test",        cloud_provider: "aws"   }
          - { os: macos-13,        py: "3.12", hatch_env: "test",        cloud_provider: "gcp"   }
          - { os: macos-13,        py: "3.13", hatch_env: "test",        cloud_provider: "azure" }
          - { os: macos-13,        py: "3.14", hatch_env: "test",        cloud_provider: "aws"   }
          # macOS x86_64 (Intel) — test-pandas env
          - { os: macos-13,        py: "3.11", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          - { os: macos-13,        py: "3.12", hatch_env: "test-pandas", cloud_provider: "azure" }
          - { os: macos-13,        py: "3.13", hatch_env: "test-pandas", cloud_provider: "aws"   }
          - { os: macos-13,        py: "3.14", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          # macOS ARM64 (Apple Silicon) — test env
          - { os: macos-latest,    py: "3.11", hatch_env: "test",        cloud_provider: "gcp"   }
          - { os: macos-latest,    py: "3.12", hatch_env: "test",        cloud_provider: "azure" }
          - { os: macos-latest,    py: "3.13", hatch_env: "test",        cloud_provider: "aws"   }
          - { os: macos-latest,    py: "3.14", hatch_env: "test",        cloud_provider: "gcp"   }
          # macOS ARM64 (Apple Silicon) — test-pandas env
          - { os: macos-latest,    py: "3.11", hatch_env: "test-pandas", cloud_provider: "azure" }
          - { os: macos-latest,    py: "3.12", hatch_env: "test-pandas", cloud_provider: "aws"   }
          - { os: macos-latest,    py: "3.13", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          - { os: macos-latest,    py: "3.14", hatch_env: "test-pandas", cloud_provider: "azure" }
          # Windows x86_64 — test env
          - { os: windows-latest,  py: "3.10", hatch_env: "test",        cloud_provider: "azure" }
          - { os: windows-latest,  py: "3.11", hatch_env: "test",        cloud_provider: "aws"   }
          - { os: windows-latest,  py: "3.12", hatch_env: "test",        cloud_provider: "gcp"   }
          - { os: windows-latest,  py: "3.13", hatch_env: "test",        cloud_provider: "azure" }
          - { os: windows-latest,  py: "3.14", hatch_env: "test",        cloud_provider: "aws"   }
          # Windows x86_64 — test-pandas env
          - { os: windows-latest,  py: "3.10", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          - { os: windows-latest,  py: "3.11", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          - { os: windows-latest,  py: "3.12", hatch_env: "test-pandas", cloud_provider: "azure" }
          - { os: windows-latest,  py: "3.13", hatch_env: "test-pandas", cloud_provider: "aws"   }
          - { os: windows-latest,  py: "3.14", hatch_env: "test-pandas", cloud_provider: "gcp"   }
          # Windows ARM64 (no test-pandas — pyarrow has no win_arm64 wheel)
          - { os: windows-11-arm,  py: "3.11", hatch_env: "test",        cloud_provider: "azure" }
          - { os: windows-11-arm,  py: "3.12", hatch_env: "test",        cloud_provider: "gcp"   }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.hatch_env }}, ${{ matrix.os }}, py${{ matrix.py }}, ${{ matrix.cloud_provider }})
    env:
      MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ matrix.cloud_provider }}
    steps:
      - name: Set UV cache dir
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "UV_CACHE_DIR=$RUNNER_TEMP/.uv-cache" >> $GITHUB_ENV
          else
            echo "UV_CACHE_DIR=/tmp/.uv-cache" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ env.MATRIX_KEY }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-${{ env.MATRIX_KEY }}-
            uv-${{ matrix.os }}-${{ matrix.py }}-

      - name: Set up Python ${{ matrix.py }}
        run: uv python install ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.py) || matrix.py }}

      - name: Download wheel (Linux)
        if: runner.os == 'Linux' && matrix.py != '3.10'
        uses: actions/download-artifact@v4
        with:
          name: ${{ (matrix.os == 'ubuntu-24.04-arm' && 'manylinux_aarch64' || 'manylinux_x86_64') }}_py${{ matrix.py }}
          path: python/dist

      - name: Download wheel (macOS)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: ${{ (matrix.os == 'macos-13' && 'macosx_x86_64' || 'macosx_arm64') }}_py${{ matrix.py }}
          path: python/dist

      - name: Download wheel (Windows)
        if: runner.os == 'Windows' && matrix.py != '3.10'
        uses: actions/download-artifact@v4
        with:
          name: ${{ (matrix.os == 'windows-11-arm' && 'win_arm64' || 'win_amd64') }}_py${{ matrix.py }}
          path: python/dist

      - name: Download sdist
        if: matrix.py == '3.10'
        uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: python/dist

      # sdist installs build sf_core from source, so Rust is needed
      - name: Restore Rust cache (sdist)
        if: matrix.py == '3.10'
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: sdist-test

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Setup OpenSSL (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: arm64

      - name: Configure ARM64 build environment
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          echo "RUSTFLAGS=-C linker=rust-lld" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV

      - name: Setup OpenSSL (Windows x86_64)
        if: matrix.os == 'windows-latest' && matrix.py == '3.10'
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: x86_64

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Install snowflake ud driver from wheel (Linux/macOS)
        if: runner.os != 'Windows' && matrix.py != '3.10'
        working-directory: python
        run: |
          WHEELS=(dist/*.whl)
          if [[ ${#WHEELS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 wheel, found ${#WHEELS[@]}"; ls -la dist/; exit 1
          fi
          export WHEEL_PATH="${WHEELS[0]}"
          echo "Installing wheel: $WHEEL_PATH"
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel

      - name: Install snowflake ud driver from wheel (Windows)
        if: runner.os == 'Windows' && matrix.py != '3.10'
        working-directory: python
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist/*.whl)
          if ($wheels.Count -ne 1) {
            Write-Error "Expected exactly 1 wheel, found $($wheels.Count)"; Get-ChildItem dist/; exit 1
          }
          $env:WHEEL_PATH = $wheels[0].FullName
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel

      - name: Install snowflake ud driver from sdist (Linux)
        if: runner.os == 'Linux' && matrix.py == '3.10'
        working-directory: python
        run: |
          SDISTS=(dist/*.tar.gz)
          if [[ ${#SDISTS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 sdist, found ${#SDISTS[@]}"; ls -la dist/; exit 1
          fi
          export WHEEL_PATH="${SDISTS[0]}"
          echo "Installing sdist: $WHEEL_PATH"
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel
        env:
          SKIP_CORE_BUILD: "false"

      - name: Install snowflake ud driver from sdist (Windows)
        if: runner.os == 'Windows' && matrix.py == '3.10'
        working-directory: python
        shell: pwsh
        run: |
          $sdists = @(Get-ChildItem dist/*.tar.gz)
          if ($sdists.Count -ne 1) {
            Write-Error "Expected exactly 1 sdist, found $($sdists.Count)"; Get-ChildItem dist/; exit 1
          }
          $env:WHEEL_PATH = $sdists[0].FullName
          Write-Host "Installing sdist: $($env:WHEEL_PATH)"
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel
        env:
          SKIP_CORE_BUILD: "false"

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: python
        run: |
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov \
            --junitxml=reports/release-${{ env.MATRIX_KEY }}.xml
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          REFERENCE_DRIVER_VERSION: ${{ env.PYTHON_REFERENCE_DRIVER_VERSION }}

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: python
        shell: pwsh
        run: |
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov `
            --junitxml=reports/release-${{ env.MATRIX_KEY }}.xml
        env:
          PARAMETER_PATH: ${{ github.workspace }}\parameters.json
          REFERENCE_DRIVER_VERSION: ${{ env.PYTHON_REFERENCE_DRIVER_VERSION }}

      - name: Save Rust cache (sdist)
        if: always() && matrix.py == '3.10'
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: sdist-test
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  # ── Reference driver compatibility check ──────────────────────────
  test_reference:
    needs: build_wheels
    strategy:
      fail-fast: false
      matrix:
        hatch_env: ["reference", "reference-pandas"]
    runs-on: ubuntu-latest
    name: test_reference (${{ matrix.hatch_env }})
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: manylinux_x86_64_py3.13
          path: python/dist

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh aws
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Run reference integration tests
        working-directory: python
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}:test \
            --junitxml=reports/reference-${{ matrix.hatch_env }}.xml
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json

  # ── Clean up intermediate artifacts ────────────────────────────────
  cleanup:
    needs: [build_wheels, test, test_reference]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete sf-core artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --paginate -q '.artifacts[] | select(.name | startswith("sf-core-")) | .id' \
          | while read id; do
              echo "Deleting artifact $id"
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
            done

  # ── Status gate ────────────────────────────────────────────────────
  release_status:
    needs: [build_wheels, test, test_reference]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Python Release Build Status ==="

          if [[ "${{ needs.build_wheels.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test_reference.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "FAILED"
            echo "  build_wheels:    ${{ needs.build_wheels.result }}"
            echo "  test:            ${{ needs.test.result }}"
            echo "  test_reference:  ${{ needs.test_reference.result }}"
            exit 1
          fi

          echo "PASSED"
          echo "  build_wheels:    ${{ needs.build_wheels.result }}"
          echo "  test:            ${{ needs.test.result }}"
          echo "  test_reference:  ${{ needs.test_reference.result }}"
