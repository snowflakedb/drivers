name: Pre-commit

on:
  pull_request:
  push:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Rust components (rustfmt, clippy)
        run: |
          rustup component add rustfmt clippy

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "precommit"

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"
          # Cache UV_CACHE_DIR (~/.cache/uv) — all wheel downloads pulled in
          # by `uv run hatch run precommit:check`. Without this every run
          # re-downloads pytest + numpy + pandas + cryptography + ... cold.
          # The cache key is derived from the dependency glob below; changes
          # to python/uv.lock invalidate it.
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        run: |
          pip install pre-commit hatch "virtualenv<21.0.0"

      - name: Restore pre-commit hooks cache
        id: pre-commit-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # Hatch stores its project envs under ~/.local/share/hatch on Linux. The
      # `python-checks` hook creates the `precommit` env on first use, which
      # inherits features=[test, dev] from `[tool.hatch.envs.default]` — that
      # pulls pytest, numpy, pandas, cryptography, ruff, mypy, …  Cold env
      # creation dominates the pre-commit job wall time (~9 min). Cache the
      # hatch env directory + mypy's incremental cache together.
      #
      # Key:
      # - Invalidate on changes to python/pyproject.toml or python/uv.lock
      #   (the only files that meaningfully change the env contents).
      # - restore-keys falls back to older caches so mypy's `.mypy_cache`
      #   stays useful even when a dep bump flips the exact key — stale
      #   mypy-cache entries for unchanged files are still reused.
      - name: Restore hatch envs and mypy cache
        id: python-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.local/share/hatch
            python/.mypy_cache
          key: python-precommit-${{ runner.os }}-py3.13-${{ hashFiles('python/pyproject.toml', 'python/uv.lock') }}
          restore-keys: |
            python-precommit-${{ runner.os }}-py3.13-
            python-precommit-${{ runner.os }}-

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Save pre-commit hooks cache
        # Skip when the exact key was already restored — saving would just
        # repackage the same data and fail to reserve an existing key.
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        # continue-on-error: cache save is best-effort. ENOSPC, throttling, or
        # cache-key races shouldn't fail an otherwise-green build; the next run
        # rebuilds from scratch. timeout-minutes + ZSTD_NBTHREADS guard against
        # tar+zstdmt hangs that have caused 30+ minute stalls.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Only save when we didn't get an exact hit. On a partial `restore-keys`
      # match the step output `cache-hit` is 'false', so the updated cache
      # (with fresh .mypy_cache entries for changed files) still gets saved
      # under the new key.
      - name: Save hatch envs and mypy cache
        if: always() && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.local/share/hatch
            python/.mypy_cache
          key: python-precommit-${{ runner.os }}-py3.13-${{ hashFiles('python/pyproject.toml', 'python/uv.lock') }}

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "precommit"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}
