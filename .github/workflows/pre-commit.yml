name: Pre-commit

on:
  pull_request:
  push:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs; fall back to github.ref for push/merge_group
  # (refs/heads/main for main pushes — cancels superseded runs, keeps latest).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Add Rust components (rustfmt, clippy)
        run: |
          rustup component add rustfmt clippy

      - name: Restore Rust cache
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          # The `-v2` suffix is a historical one-time cache flush (it was added
          # for a since-removed `Pre-build param_defs_export` step). Keep it as
          # is — bumping the suffix costs a full cold rebuild, so only change it
          # when a deliberate flush is actually wanted.
          shared-key: "precommit-v2"

      - name: Restore tests-format-validator Rust cache
        id: validator-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "format-validator"
          target-dir: tests/tests_format_validator/target
          lockfiles: tests/tests_format_validator/Cargo.lock

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        run: |
          pip install pre-commit hatch "virtualenv<21.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: cd nodejs && npm install

      # NOTE: no pre-commit hook cache. Every hook in .pre-commit-config.yaml
      # uses `language: system` (cargo, clang-format, gradlew, etc.), so
      # pre-commit doesn't manage virtualenvs or clone hook repos — the only
      # thing in ~/.cache/pre-commit is a ~1KB SQLite ledger that's regenerated
      # locally in <0.1s. Caching it costs more (a network roundtrip per run)
      # than skipping it. Re-add this cache only if a future hook switches to
      # language: python / language: node / etc., where pre-commit would
      # actually install something cacheable.

      # NOTE: no pre-build step for param_defs_export. It used to live here
      # because the generator was a `sf_core` bin, so `cargo run` paid a cold
      # ~12-minute sf_core link on every pre-commit run and needed warming into
      # the target/ cache. The generator now lives in `sf_params_codegen`, whose
      # only dependency is the std-only `sf_params_spec` crate — a cold build is
      # well under a second, so pre-building it would cost more than it saves.

      - name: Generate protobuf Python stubs
        # The `protobuf_gen/*_pb2.py` files are gitignored and normally produced
        # by `hatch_build.py:_generate_protobuf` during an editable install. The
        # precommit hatch env has `skip-install = true`, so nothing else triggers
        # the generation — mypy then fails to resolve the protobuf imports.
        # Running the same cargo invocation `hatch_build.py` uses keeps the
        # outputs byte-identical to a production build. `protoc-gen-mypy` must
        # be on PATH for the .pyi stubs, so install it alongside protoc.
        run: |
          pip install mypy-protobuf
          cargo run --locked -p proto_generator --bin proto_generator -- \
            --generator python \
            --input protobuf/database_driver_v1.proto \
            --output python/src/snowflake/connector/_internal/protobuf_gen


      - name: Run pre-commit on all files
        # Skip `generate-connection-config` in CI: it regenerates the file,
        # reformats via hatch, and `git add`s — all pointless on ephemeral
        # runners where the commit never happens. The `Verify ConnectionConfig`
        # step below replaces it with a drift check that fails if a PR forgot
        # to run the local hook.
        env:
          SKIP: generate-connection-config
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Verify ConnectionConfig is up to date
        # Drift check mirroring the local `generate-connection-config` hook
        # exactly: regenerate in-place, run the same `hatch run precommit:fix`
        # pipeline (ruff format / ruff check --fix / ruff format / mypy), then
        # assert the file on disk is byte-identical to the committed one.
        # `precommit:fix` hardcodes its scope to `src/snowflake tests` and
        # ignores positional args, so we can't format a tempfile through it —
        # writing to the real path and using `git diff` is simpler and avoids
        # divergence from local behaviour.
        run: |
          set -euo pipefail
          target=python/src/snowflake/connector/connection_config.py
          cargo run --locked -p sf_params_codegen --bin param_defs_export > "$target"
          (cd python && hatch run precommit:fix) >/dev/null
          if ! git diff --exit-code -- "$target"; then
            echo "::error::connection_config.py is out of date. Run the 'generate-connection-config' pre-commit hook locally and commit the result."
            exit 1
          fi

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "precommit-v2"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save tests-format-validator Rust cache
        if: always()
        timeout-minutes: 20
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "format-validator"
          target-dir: tests/tests_format_validator/target
          lockfiles: tests/tests_format_validator/Cargo.lock
          registry-cache-hit: ${{ steps.validator-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.validator-cache.outputs.target-cache-hit }}
