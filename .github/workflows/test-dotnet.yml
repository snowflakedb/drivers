name: dotnet CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: >-
      github.repository_owner != 'snowflakedb'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/detect-changes.yml

  dotnet_tests:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_dotnet == 'true'
    name: dotnet Tests (new driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          dotnet-quality: 'ga'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: dotnet

      - name: Build
        run: dotnet build --no-restore
        working-directory: dotnet

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      # TODO: e2e tests skipped for now — new driver stubs always fail.
      # Uncomment once implementation is underway.
      # - name: Run tests (new driver)
      #   run: dotnet test --no-build --filter "Category=E2E"
      #   working-directory: dotnet
      #   env:
      #     PARAMETER_PATH: ${{ github.workspace }}/parameters.json

      - name: Check formatting
        run: dotnet format Snowflake.Data.sln --verify-no-changes
        working-directory: dotnet

  dotnet_tests_reference:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_dotnet_reference == 'true'
    name: dotnet Old Driver Reference Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore
        working-directory: dotnet

      - name: Build
        run: dotnet build --no-restore
        working-directory: dotnet

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Run e2e tests (old driver reference)
        run: dotnet run --no-build
        working-directory: dotnet/tests/Snowflake.Data.Tests
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          SNOWFLAKE_DOTNET_USE_OLD_DRIVER: "1"

  dotnet-status:
    needs: [detect-changes, dotnet_tests, dotnet_tests_reference]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== dotnet CI Status ==="

          NEW_RESULT="${{ needs.dotnet_tests.result }}"
          REFERENCE_RESULT="${{ needs.dotnet_tests_reference.result }}"

          # Check if tests were skipped
          if [[ "$NEW_RESULT" == "skipped" && "$REFERENCE_RESULT" == "skipped" ]]; then
            echo "✓ dotnet jobs were SKIPPED (no relevant changes detected)"
            echo "  - run_dotnet: ${{ needs.detect-changes.outputs.run_dotnet }}"
            exit 0
          fi

          # Check if any job failed or was cancelled
          if [[ "$NEW_RESULT" =~ ^(failure|cancelled)$ || "$REFERENCE_RESULT" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ dotnet CI FAILED or CANCELLED"
            echo "  - dotnet Tests (new): $NEW_RESULT"
            echo "  - dotnet Reference (old): $REFERENCE_RESULT"
            exit 1
          fi

          # Tests ran and passed
          echo "✓ dotnet jobs were RUN and PASSED"
          echo "  - dotnet Tests (new): $NEW_RESULT"
          echo "  - dotnet Reference (old): $REFERENCE_RESULT"
          exit 0
