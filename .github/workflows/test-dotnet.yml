name: dotnet CI

on:
  # Every event is orchestrated by driver-status.yml, which resolves the
  # suites to run and invokes only the affected driver workflows.
  workflow_call:
    inputs:
      run_dotnet:
        description: "Run .NET tests."
        type: boolean
        required: false
        default: false
      run_dotnet_reference:
        description: "Run .NET reference tests."
        type: boolean
        required: false
        default: false

concurrency:
  # The prefix is a literal, not ${{ github.workflow }}: inside a workflow_call
  # the github context belongs to the caller, so github.workflow would resolve
  # to "Driver CI" and put this run in the orchestrator's own group. GitHub
  # reads that as a deadlock and fails the call before any job starts.
  group: dotnet-ci-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || contains(fromJSON('["ci:scope-merge-queue","ci:scope-merge","ci:scope-nightly"]'), github.event.label.name) }}

jobs:
  load-dotnet-matrix:
    if: inputs.run_dotnet
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      matrix_interop: ${{ steps.split.outputs.matrix_interop }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          LEVEL_ARG=""
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] || \
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/release/* ]]; then
            LEVEL_ARG="--level nightly"
          fi
          python ci/test_matrix/generate_matrix.py \
            --driver dotnet --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --emit-active $LEVEL_ARG \
            >> "$GITHUB_OUTPUT"
      - id: split
        run: |
          FULL='${{ steps.matrix.outputs.matrix }}'
          echo "matrix=$(echo "$FULL" | jq -c '[.[] | select(.mode == "regression")]')" >> "$GITHUB_OUTPUT"
          echo "matrix_interop=$(echo "$FULL" | jq -c '[.[] | select(.mode == "interop")]')" >> "$GITHUB_OUTPUT"

  dotnet_tests:
    needs: load-dotnet-matrix
    if: needs.load-dotnet-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-dotnet-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: dotnet tests (${{ matrix.name }})
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          dotnet-quality: 'ga'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: dotnet

      - name: Restore Cargo cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "proto-generator"

      - name: Shrink MSVC debug info
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"

      - name: Regenerate proto files
        run: dotnet msbuild -t:RegenerateProto src/Snowflake.Data.Proto/
        working-directory: dotnet

      - name: Save Cargo cache
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "proto-generator"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Build
        run: dotnet build --no-restore
        working-directory: dotnet

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        shell: bash
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Restore Cargo cache (sf_core)
        id: sf-core-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "sf-core"

      - name: Build Rust components
        run: cargo build --locked --package sf_core ${{ matrix.cargo_flags }}

      - name: Save Cargo cache (sf_core)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "sf-core"
          registry-cache-hit: ${{ steps.sf-core-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.sf-core-cache.outputs.target-cache-hit }}

      - name: Copy native lib to test output directory
        if: matrix.copy_native_lib
        shell: bash
        run: |
          cp "${{ github.workspace }}/target/debug/${{ matrix.sf_core_lib }}" \
             "dotnet/tests/Snowflake.Data.Tests/bin/Debug/${{ matrix.dotnet_version }}/"

      - name: Run tests (new driver)
        run: dotnet run --no-build --framework ${{ matrix.dotnet_version }}
        working-directory: dotnet/tests/Snowflake.Data.Tests
        env:
           PARAMETER_PATH: ${{ github.workspace }}/parameters.json
           SF_CORE_LIB_PATH: ${{ github.workspace }}/target/debug/${{ matrix.sf_core_lib }}

  dotnet_tests_interop:
    needs: load-dotnet-matrix
    if: needs.load-dotnet-matrix.outputs.matrix_interop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-dotnet-matrix.outputs.matrix_interop) }}
    runs-on: ${{ matrix.os }}
    name: dotnet Interop (${{ matrix.name }})
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          dotnet-quality: 'ga'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: dotnet

      - name: Restore Cargo cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "proto-generator"

      - name: Shrink MSVC debug info
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"

      - name: Regenerate proto files
        run: dotnet msbuild -t:RegenerateProto src/Snowflake.Data.Proto/
        working-directory: dotnet

      - name: Save Cargo cache
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "proto-generator"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Build
        run: dotnet build --no-restore -p:SkipCargoBuild=true
        working-directory: dotnet

      - name: Build sf_core_stub
        run: cargo build
        working-directory: dotnet/tests/Snowflake.Data.Tests.Interop/sf_core_stub

      - name: Copy stub DLLs for Framework DllImport
        if: runner.os == 'Windows' && matrix.dotnet_version == 'net472'
        shell: pwsh
        run: |
          $stubDll = "dotnet/tests/Snowflake.Data.Tests.Interop/sf_core_stub/target/debug/sf_core_stub.dll"
          $outDir = "dotnet/tests/Snowflake.Data.Tests.Interop/bin/Debug/net472"
          Copy-Item $stubDll "$outDir/sf_core.dll"
          Copy-Item $stubDll "$outDir/sf_core_stub.dll"

      - name: Run interop tests
        run: dotnet run --no-build --framework ${{ matrix.dotnet_version }}
        working-directory: dotnet/tests/Snowflake.Data.Tests.Interop
        
  dotnet_tests_reference:
    if: inputs.run_dotnet_reference
    name: dotnet Reference Tests (old driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore
        working-directory: dotnet

      - name: Restore Cargo cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "proto-generator"

      - name: Regenerate proto files
        run: dotnet msbuild -t:RegenerateProto src/Snowflake.Data.Proto/
        working-directory: dotnet

      - name: Save Cargo cache
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "proto-generator"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Build
        run: dotnet build --no-restore
        working-directory: dotnet

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        shell: bash
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Run reference tests (old driver)
        run: dotnet run --no-build --framework net10.0
        working-directory: dotnet/tests/Snowflake.Data.Tests.Reference
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          SNOWFLAKE_DOTNET_USE_OLD_DRIVER: "1"

      - name: Check formatting
        run: dotnet format Snowflake.Data.sln --verify-no-changes
        working-directory: dotnet

  dotnet_tests_reference_new_driver:
    if: inputs.run_dotnet_reference
    continue-on-error: true
    name: dotnet Reference Tests (new driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore
        working-directory: dotnet

      - name: Restore Cargo cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "proto-generator"

      - name: Regenerate proto files
        run: dotnet msbuild -t:RegenerateProto src/Snowflake.Data.Proto/
        working-directory: dotnet

      - name: Save Cargo cache
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "proto-generator"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Build
        run: dotnet build --no-restore
        working-directory: dotnet

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        shell: bash
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}

      - name: Restore Cargo cache (sf_core)
        id: sf-core-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "sf-core"

      - name: Build Rust components
        run: cargo build --locked --package sf_core

      - name: Save Cargo cache (sf_core)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "sf-core"
          registry-cache-hit: ${{ steps.sf-core-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.sf-core-cache.outputs.target-cache-hit }}
          
      - name: Copy native lib to test output directory
        shell: bash
        run: |
          cp "${{ github.workspace }}/target/debug/libsf_core.so" \
          "dotnet/tests/Snowflake.Data.Tests.Reference/bin/Debug/net10.0/"

      - name: Run reference tests (new driver)
        run: dotnet run --no-build --framework net10.0
        working-directory: dotnet/tests/Snowflake.Data.Tests.Reference
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          SF_CORE_LIB_PATH: ${{ github.workspace }}/target/debug/libsf_core.so

  dotnet-status:
    needs: [load-dotnet-matrix, dotnet_tests, dotnet_tests_reference, dotnet_tests_interop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== dotnet CI Status ==="

          MATRIX_RESULT="${{ needs.dotnet_tests.result }}"
          REFERENCE_RESULT="${{ needs.dotnet_tests_reference.result }}"
          INTEROP_RESULT="${{ needs.dotnet_tests_interop.result }}"

          # Check if any job failed or was cancelled. This must run before the
          # "tests skipped" check below: a failure in an upstream job can cause
          # a downstream job to be auto-skipped, which would otherwise be
          # misread as "no relevant changes detected" and pass.
          if [[ "$MATRIX_RESULT" =~ ^(failure|cancelled)$ || "$REFERENCE_RESULT" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ dotnet CI FAILED or CANCELLED"
            echo "  - dotnet_tests (matrix): $MATRIX_RESULT"
            echo "  - dotnet_tests_reference (old driver): $REFERENCE_RESULT"
            exit 1
          fi

          # Check if tests were skipped (only reachable once nothing above failed/cancelled)
          if [[ "$MATRIX_RESULT" == "skipped" && "$REFERENCE_RESULT" == "skipped" ]]; then
            # Driver CI only invokes this workflow for drivers it selected, so a
            # skip here means the gating is broken rather than "nothing to do".
            if [[ "${{ inputs.run_dotnet }}" == "true" ]]; then
              echo "✗ Driver CI requested dotnet tests but every dotnet job was SKIPPED — check the job-level if: conditions."
              exit 1
            fi
            echo "✓ dotnet jobs were SKIPPED (not requested by Driver CI)"
            exit 0
          fi

          # Tests ran and passed
          echo "✓ dotnet jobs were RUN and PASSED"
          echo "  - dotnet_tests (matrix): $MATRIX_RESULT"
          echo "  - dotnet_tests_reference (old driver): $REFERENCE_RESULT"
          echo "  - dotnet_tests_interop: $INTEROP_RESULT"
          exit 0
