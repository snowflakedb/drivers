# Slack notifications for new PRs on the public mirror repo.
#
# Operates on the MIRROR repo (snowflakedb/drivers). When an
# external contributor opens a PR (or marks a draft ready for review),
# posts a short announcement to the drivers review channel via
# slackapi/slack-github-action — same transport as pr-review-bot.yml,
# but without reviewer assignment (mirror PRs are triaged manually).
#
# Deployment: checked in here and shipped to the mirror by the Copybara
# `mirror` workflow (see EXCLUDED_PATH_OVERRIDES in copy.bara.sky). A
# copy exists on the internal repo too; the repository guard keeps it a
# no-op there.
#
# Required repository configuration (on the mirror repo):
#   secrets.SLACK_BOT_TOKEN
#       Same bot token used by the internal PR review bot (xoxb-...).
#       Required scope: chat:write.
#   vars.MIRROR_SLACK_CHANNEL (optional)
#       Channel name (no leading '#') or channel ID. Defaults to
#       vars.SLACK_CHANNEL, then 'drivers-review'.
name: Mirror - PR notifications

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Mirror PR number to announce (for manual backfill)."
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mirror-notify-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  notify:
    # Repository guard: workflow file is mirrored, so it also exists on
    # the internal repo. Only announce PRs on the public mirror.
    if: >-
      github.repository == 'snowflakedb/drivers'
      && (
        github.event_name == 'workflow_dispatch'
        || github.event.pull_request.draft == false
      )
    # Script-only job (github-script + Slack post); ubuntu-slim matches
    # pr-review-bot.yml and notify-slack-failure.yml.
    runs-on: ubuntu-slim
    steps:
      - name: Build Slack payload
        id: build
        uses: actions/github-script@v7
        env:
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          SLACK_CHANNEL: ${{ vars.MIRROR_SLACK_CHANNEL || vars.SLACK_CHANNEL || 'drivers-review' }}
          SLACK_PAYLOAD_FILE: ${{ runner.temp }}/slack_payload.json
        with:
          script: |
            const fs = require('fs');
            const channel = process.env.SLACK_CHANNEL;
            const payloadFile = process.env.SLACK_PAYLOAD_FILE;

            let pr;
            if (context.eventName === 'workflow_dispatch') {
              const prNumber = parseInt(process.env.DISPATCH_PR, 10);
              if (!prNumber) {
                core.setFailed('workflow_dispatch requires a numeric `pr_number` input.');
                return;
              }
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = data;
            } else {
              pr = context.payload.pull_request;
            }

            if (!pr || pr.draft) {
              core.info('PR is missing or still a draft; skipping notification.');
              core.setOutput('skip', 'true');
              return;
            }
            if (pr.state !== 'open') {
              core.info(`PR #${pr.number} is not open (state=${pr.state}); skipping.`);
              core.setOutput('skip', 'true');
              return;
            }

            const author = pr.user.login;
            const title = pr.title;
            const htmlUrl = pr.html_url;
            const baseRef = pr.base?.ref ?? 'main';

            const fallback =
              `New mirror PR: #${pr.number} — ${title} (by @${author})`;

            const blocks = [
              {
                type: 'section',
                text: {
                  type: 'mrkdwn',
                  text: ':incoming_envelope: *New mirror PR*',
                },
              },
              {
                type: 'section',
                text: {
                  type: 'mrkdwn',
                  text: `<${htmlUrl}|#${pr.number} — ${title}>`,
                },
              },
              {
                type: 'context',
                elements: [
                  {
                    type: 'mrkdwn',
                    text: `Author: \`@${author}\`   ·   Base: \`${baseRef}\``,
                  },
                ],
              },
            ];

            fs.writeFileSync(
              payloadFile,
              JSON.stringify({
                channel,
                text: fallback,
                link_names: true,
                unfurl_links: false,
                unfurl_media: false,
                blocks,
              }),
            );
            core.info(`Wrote Slack payload for PR #${pr.number} to ${payloadFile}`);
            core.setOutput('skip', 'false');

      - name: Post notification to Slack
        if: steps.build.outputs.skip != 'true'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack_payload.json
