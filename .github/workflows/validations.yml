name: Validate generated data

on:
  pull_request:
  push:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install brotli zstandard

      - name: Run all generator scripts
        run: |
          set -euo pipefail
          echo "Running generators in tests/test_data/test_data_generators -> tests/test_data/generated_test_data"
          for generator in tests/test_data/test_data_generators/*.py; do
            echo "Running generator"
            python "$generator" --out-dir tests/test_data/generated_test_data
          done

      - name: Check for uncommitted changes in generated test data
        run: |
          set -euo pipefail
          git status --porcelain=v1 -- tests/test_data/generated_test_data || true
          if [[ -n "$(git status --porcelain=v1 -- tests/test_data/generated_test_data)" ]]; then
            echo "Detected differences in tests/test_data/generated_test_data after regeneration." >&2
            echo "Please run the generator scripts locally and commit updated files." >&2
            echo
            git --no-pager diff -- tests/test_data/generated_test_data | sed -n '1,200p'
            exit 1
          fi
          echo "Generated test data matches repository."

  tests-format-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "format-validator"
          target-dir: tests/tests_format_validator/target
          lockfiles: tests/tests_format_validator/Cargo.lock

      - name: Run tests format validator
        run: |
          ./tests/tests_format_validator/run_validator.sh

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "format-validator"
          target-dir: tests/tests_format_validator/target
          lockfiles: tests/tests_format_validator/Cargo.lock

  test-coverage-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "format-validator"
          target-dir: tests/tests_format_validator/target
          lockfiles: tests/tests_format_validator/Cargo.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate HTML coverage report
        run: |
          python3 tests/test_coverage_report/coverage_report.py \
            --workspace . \
            --format html \
            --output test_coverage_report.html

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "format-validator"
          target-dir: tests/tests_format_validator/target
          lockfiles: tests/tests_format_validator/Cargo.lock

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: universal-driver-test-coverage-report
          path: test_coverage_report.html
          retention-days: 30

  validations-status:
    needs: [test-data, tests-format-validator, test-coverage-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Validations Status ==="
          
          # Check if any validation failed or was cancelled
          if [[ "${{ needs.test-data.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.tests-format-validator.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.test-coverage-report.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Validations FAILED or CANCELLED"
            echo "  - test-data: ${{ needs.test-data.result }}"
            echo "  - tests-format-validator: ${{ needs.tests-format-validator.result }}"
            echo "  - test-coverage-report: ${{ needs.test-coverage-report.result }}"
            exit 1
          fi
          
          echo "✓ Validations PASSED"
          echo "  - test-data: ${{ needs.test-data.result }}"
          echo "  - tests-format-validator: ${{ needs.tests-format-validator.result }}"
          echo "  - test-coverage-report: ${{ needs.test-coverage-report.result }}"
          exit 0
