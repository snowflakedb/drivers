name: PEP-249 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PYTHON_REFERENCE_DRIVER_VERSION: "3.10.1"
  # Python versions to run reference tests and comparison (space-separated)
  REFERENCE_TEST_VERSIONS: "3.13"

jobs:
  # Build Rust core library once and share across Python jobs
  old-job-name:           # if protection expects a job-level check
    runs-on: ubuntu-latest
    steps:
      - run: echo "Compat shim to satisfy old required check"

  build_rust_core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Build Rust core library
        run: cargo build --package sf_core

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-library
          path: target/debug/libsf_core.so
