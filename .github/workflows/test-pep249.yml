name: PEP-249 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  # older builds for the same pull request number or branch should be cancelled
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

env:
  CARGO_TERM_COLOR: always
  PYTHON_REFERENCE_DRIVER_VERSION: "3.10.1"
  # Python versions to run reference tests and comparison (space-separated)
  REFERENCE_TEST_VERSIONS: "3.13"

jobs:
  # Build Rust core library once and share across Python jobs
  build_rust_core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Build Rust core library
        run: cargo build --package sf_core

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-library
          path: target/debug/libsf_core.so

  # Combined unit + integration tests with universal connector
  pep_249_tests:
    needs: build_rust_core
    strategy:
      fail-fast: false
      matrix:
        py: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Restore uv cache
        env:
          UV_CACHE_DIR: /tmp/.uv-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ matrix.py }}-${{ hashFiles('pep249_dbapi/uv.lock', 'pep249_dbapi/pyproject.toml', 'pep249_dbapi/tox.ini') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.py }}-
            uv-${{ runner.os }}-

      - name: Set up Python ${{ matrix.py }}
        run: uv python install ${{ matrix.py }}

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-core-library
          path: target/debug/

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Setup dependencies and run integration tests
        env:
          CORE_PATH: ${{ github.workspace }}/target/debug/libsf_core.so
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
        run: |
          make setup
          make test-integ-universal PY=${{ matrix.py }}
        working-directory: pep249_dbapi

      - uses: actions/upload-artifact@v4
        with:
          name: results-universal-${{ matrix.py }}
          path: pep249_dbapi/reports/*-${{ matrix.py }}.*

