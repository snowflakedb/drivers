name: Build ODBC Packages

# Builds every distributable ODBC artifact
on:
  schedule:
    - cron: '0 3 * * *'  # Same slot as ODBC CI nightly; schedule is mirror-only (see job if)
  push:
    branches:
      - 'release/odbc-**'
  pull_request:
    paths:
      - 'odbc/installer/**'
      - 'ci/Dockerfile.rocky-rpm-build'
      - 'ci/Dockerfile.debian-deb-build'
      - '.github/actions/install-wix-from-artifact/**'
      - '.github/workflows/build-odbc-packages.yml'
      - '.github/workflows/_build-odbc-packages.yml'
  workflow_dispatch:

concurrency:
  # PR number for PRs; unique run ID for release pushes / dispatch so a later
  # push cannot cancel an in-flight non-PR run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_odbc_packages:
    # Eng: packaging PRs / release pushes / dispatch (schedule is skipped —
    # ODBC CI already builds packages in the 03:00 nightly).
    # Mirror: schedule + dispatch + release/* only (no PR tax).
    if: >-
      (github.repository_owner != 'snowflakedb' && github.event_name != 'schedule')
      || (github.repository_owner == 'snowflakedb'
          && (github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/heads/release/')))
    uses: ./.github/workflows/_build-odbc-packages.yml
