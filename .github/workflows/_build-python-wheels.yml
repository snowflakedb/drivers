name: Build Python Wheels

on:
  workflow_call:
    inputs:
      sf-core-matrix:
        type: string
        required: true
        description: 'JSON array of {os, lib_name} for sf_core builds'
      wheel-matrix-os:
        type: string
        required: true
        description: 'JSON array of OS versions for wheel matrix'
      wheel-matrix-py:
        type: string
        required: true
        description: 'JSON array of Python versions for wheel matrix'
      wheel-matrix-exclude:
        type: string
        required: false
        default: '[]'
        description: 'JSON array of {os, py} exclusions for wheel matrix'
      openssl-static:
        type: boolean
        required: false
        default: false
        description: 'Statically link OpenSSL into sf_core (Linux). Eliminates libssl/libcrypto runtime deps.'
      auditwheel:
        type: boolean
        required: false
        default: false
        description: 'Run auditwheel repair on Linux wheels to retag as manylinux and validate shared-lib deps.'
      linux-container:
        type: string
        required: false
        default: ''
        description: 'Container image for Linux builds (e.g. quay.io/pypa/manylinux_2_28_x86_64). Empty = bare runner.'

env:
  CARGO_TERM_COLOR: always

jobs:
  build_sf_core:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.sf-core-matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ contains(matrix.os, 'ubuntu') && inputs.linux-container || '' }}
    name: build_sf_core (${{ matrix.os }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (container)
        if: inputs.linux-container != ''
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # perl-IPC-Cmd is required by openssl-src (vendored OpenSSL build)
      - name: Install vendored OpenSSL build deps (container)
        if: inputs.linux-container != ''
        run: yum install -y perl-IPC-Cmd

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-rust-sf-core-release-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-sf-core-release-target-

      - name: Capture vcpkg version for cache key (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        id: vcpkg-ver-core
        shell: pwsh
        run: |
          $ver = & C:\vcpkg\vcpkg.exe version 2>$null |
            Select-String 'version\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Select-Object -First 1
          if (-not $ver) { Write-Error "Could not determine vcpkg version"; exit 1 }
          echo "VCPKG_VER=$ver" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        if: matrix.os == 'windows-11-arm'
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL (static) via vcpkg
        if: matrix.os == 'windows-11-arm'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows-static-md

      - name: Configure ARM64 OpenSSL (static)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows-static-md\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Build sf_core (Linux)
        if: runner.os == 'Linux'
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.linux-container }}" != "" ]; then
            EXTRA_ARGS="--features vendored-openssl"
          elif [ "${{ inputs.openssl-static }}" = "true" ]; then
            export OPENSSL_STATIC=1
          fi
          cargo build --release --package sf_core $EXTRA_ARGS

      - name: Build sf_core (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          cargo build --release --package sf_core --config profile.release.strip=false

      - name: Upload sf_core library
        uses: actions/upload-artifact@v4
        with:
          name: sf-core-${{ matrix.os }}
          path: target/release/${{ matrix.lib_name }}

  build_wheel:
    needs: build_sf_core
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.wheel-matrix-os) }}
        py: ${{ fromJSON(inputs.wheel-matrix-py) }}
        exclude: ${{ fromJSON(inputs.wheel-matrix-exclude) }}
    runs-on: ${{ matrix.os }}
    container: ${{ contains(matrix.os, 'ubuntu') && inputs.linux-container || '' }}
    name: build_wheel (${{ matrix.os }}, py${{ matrix.py }})
    env:
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.os == 'windows-11-arm' && 'ARM64' || '' }}
      SKIP_CORE_BUILD: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (container)
        if: inputs.linux-container != ''
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download pre-built sf_core
        uses: actions/download-artifact@v4
        with:
          name: sf-core-${{ matrix.os }}
          path: python/src/snowflake/connector/_core

      - name: Install system dependencies (Linux, bare runner)
        if: runner.os == 'Linux' && inputs.linux-container == ''
        run: |
          sudo apt-get update
          if [ "${{ inputs.auditwheel }}" = "true" ]; then
            sudo apt-get install -y patchelf
          fi

      - name: Install system dependencies (Linux, container)
        if: runner.os == 'Linux' && inputs.linux-container != ''
        run: |
          if [ "${{ inputs.auditwheel }}" = "true" ] && ! command -v patchelf &>/dev/null; then
            yum install -y patchelf
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python ${{ matrix.py }}
        run: uv python install ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.py) || matrix.py }}

      - name: Cache proto generator target
        uses: actions/cache@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-proto-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-proto-target-

      - name: Build python wheel (Linux)
        if: runner.os == 'Linux'
        working-directory: ./python
        run: uv run --python ${{ matrix.py }} --with hatch --with cython --with setuptools --with "virtualenv<21.0.0" hatch build
        env:
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      # cryptography has no pre-built ARM64 Windows wheel, so uv builds it from
      # source via maturin. OpenSSL is needed for this dependency build.

      # Capture vcpkg version so the cache key tracks runner image vcpkg baseline.
      # When GitHub updates the runner's vcpkg (new runner image), the key changes
      # automatically and the stale cache is not reused.
      # Extract only the version token (e.g. "2024-09-01-eb982c5b...") so the
      # cache key is short and fails loudly if vcpkg is missing or output changes.
      - name: Capture vcpkg version for cache key (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        id: vcpkg-ver-build
        shell: pwsh
        run: |
          $ver = & C:\vcpkg\vcpkg.exe version 2>$null |
            Select-String 'version\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Select-Object -First 1
          if (-not $ver) { Write-Error "Could not determine vcpkg version"; exit 1 }
          echo "VCPKG_VER=$ver" >> $env:GITHUB_ENV

      # Cache vcpkg OpenSSL: avoids rebuilding from C source (~7 min per run).
      - name: Cache vcpkg ARM64 static OpenSSL (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        id: vcpkg-cache-build
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL (static) via vcpkg
        if: matrix.os == 'windows-11-arm' && steps.vcpkg-cache-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows-static-md

      - name: Configure ARM64 OpenSSL (static)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows-static-md\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Build python wheel (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        working-directory: ./python
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          uv run --python ${{ matrix.py }} --with hatch --with cython --with setuptools --with "virtualenv<21.0.0" hatch build
        env:
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}\proto-target

      - name: Make wheel manylinux-compliant (auditwheel)
        if: runner.os == 'Linux' && inputs.auditwheel
        working-directory: ./python
        run: |
          uv tool install auditwheel
          echo "=== auditwheel show (before repair) ==="
          auditwheel show dist/*.whl
          auditwheel repair dist/*.whl --wheel-dir dist-repaired/
          rm dist/*.whl
          mv dist-repaired/*.whl dist/
          echo "=== auditwheel show (after repair) ==="
          auditwheel show dist/*.whl

      - name: Inspect wheel (Linux)
        if: runner.os == 'Linux'
        working-directory: ./python
        run: uv run --python ${{ matrix.py }} python -m zipfile -l dist/*.whl

      - name: Inspect wheel (Windows)
        if: runner.os == 'Windows'
        working-directory: ./python
        shell: pwsh
        run: uv run --python ${{ matrix.py }} python -m zipfile -l (Get-ChildItem dist/*.whl).FullName

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.py }}
          path: python/dist/*.whl
