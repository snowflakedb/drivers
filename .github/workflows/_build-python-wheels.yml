name: Build Python Wheels

on:
  workflow_call:
    inputs:
      targets:
        type: string
        required: true
        description: >
          JSON object mapping platform keys to Python version arrays.
          Example: {"linux_x86": ["3.11","3.12","3.13","3.14"], "macos_x86": ["3.11","3.12"], "windows_arm": ["3.11","3.12"]}
          Supported platforms: linux_x86, linux_aarch, macos_x86, macos_arm, windows_x86, windows_arm.

env:
  CARGO_TERM_COLOR: always
  UV_DEFAULT_INDEX: "https://pypi.org/simple"
  # Requests 6 retries from uv's internal HTTP client (default: 3).
  UV_HTTP_RETRIES: "6"

jobs:
  # ── Expand targets into per-platform build matrices ────────────────
  # One matrix entry per platform (not per platform+python).
  # Each entry carries all Python versions for that platform so that a
  # single runner builds python_bridge for each version + all wheels,
  # reducing worker count.
  configure:
    runs-on: ubuntu-latest
    outputs:
      cibw-matrix: ${{ steps.expand.outputs.cibw-matrix }}
      win-arm-matrix: ${{ steps.expand.outputs.win-arm-matrix }}
    steps:
      - name: Expand targets into build matrices
        id: expand
        shell: python3 {0}
        run: |
          import json, os

          PLATFORMS = {
              "linux_x86": {
                  "target": "linux-x86_64",
                  "os": "ubuntu-latest",
                  "container": "quay.io/pypa/manylinux_2_28_x86_64",
                  "cargo_lib": "libsf_core_python.so",
                  "cargo_extra_args": "--features vendored-openssl --config profile.release.opt-level=2",
                  "wheel_method": "cibuildwheel",
                  "cibw_arch": "manylinux_x86_64",
                  "artifact_id": "manylinux_x86_64",
              },
              "linux_aarch": {
                  "target": "linux-aarch64",
                  "os": "ubuntu-24.04-arm",
                  "container": "quay.io/pypa/manylinux_2_28_aarch64",
                  "cargo_lib": "libsf_core_python.so",
                  "cargo_extra_args": "--features vendored-openssl --config profile.release.opt-level=2",
                  "wheel_method": "cibuildwheel",
                  "cibw_arch": "manylinux_aarch64",
                  "artifact_id": "manylinux_aarch64",
              },
              "macos_x86": {
                  "target": "macos-x86_64",
                  "os": "macos-15-intel",
                  "container": "",
                  "cargo_lib": "libsf_core_python.dylib",
                  "cargo_extra_args": "--features vendored-openssl --config profile.release.opt-level=2",
                  "wheel_method": "cibuildwheel",
                  "cibw_arch": "macosx_x86_64",
                  "artifact_id": "macosx_x86_64",
              },
              "macos_arm": {
                  "target": "macos-arm64",
                  "os": "macos-latest",
                  "container": "",
                  "cargo_lib": "libsf_core_python.dylib",
                  "cargo_extra_args": "--features vendored-openssl --config profile.release.opt-level=2",
                  "wheel_method": "cibuildwheel",
                  "cibw_arch": "macosx_arm64",
                  "artifact_id": "macosx_arm64",
              },
              "windows_x86": {
                  "target": "windows-x86_64",
                  "os": "windows-latest",
                  "container": "",
                  "cargo_lib": "sf_core_python.dll",
                  "cargo_extra_args": "--config profile.release.opt-level=2 --config profile.release.strip=false",
                  "wheel_method": "cibuildwheel",
                  "cibw_arch": "win_amd64",
                  "artifact_id": "win_amd64",
              },
              "windows_arm": {
                  "target": "windows-arm64",
                  "os": "windows-11-arm",
                  "container": "",
                  "cargo_lib": "sf_core_python.dll",
                  "cargo_extra_args": "--config profile.release.opt-level=2 --config profile.release.strip=false",
                  "wheel_method": "manual",
                  "artifact_id": "win_arm64",
              },
          }

          targets = json.loads("""${{ inputs.targets }}""")

          cibw_entries = {}
          manual_entries = []

          for key, versions in targets.items():
              if key not in PLATFORMS:
                  raise ValueError(f"Unknown platform: {key}. Supported: {list(PLATFORMS)}")
              if not versions:
                  continue
              p = PLATFORMS[key]

              if p["wheel_method"] == "cibuildwheel":
                  cibw_builds = [f"cp{v.replace('.', '')}-{p['cibw_arch']}" for v in versions]
                  cibw_entries[key] = {
                      "target": p["target"],
                      "os": p["os"],
                      "container": p["container"],
                      "cargo_lib": p["cargo_lib"],
                      "cargo_extra_args": p["cargo_extra_args"],
                      "cibw_arch": p["cibw_arch"],
                      "artifact_id": p["artifact_id"],
                      "cibw_build": " ".join(cibw_builds),
                      "python_versions_json": json.dumps(versions),
                  }
              else:
                  for v in versions:
                      manual_entries.append({
                          "target": p["target"],
                          "os": p["os"],
                          "cargo_lib": p["cargo_lib"],
                          "cargo_extra_args": p["cargo_extra_args"],
                          "py": v,
                          "artifact_name": f"{p['artifact_id']}_py{v}",
                      })

          cibw_matrix = list(cibw_entries.values())
          win_arm_matrix = manual_entries

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cibw-matrix={json.dumps(cibw_matrix)}\n")
              f.write(f"win-arm-matrix={json.dumps(win_arm_matrix)}\n")

          print("cibw-matrix:", json.dumps(cibw_matrix, indent=2))
          print("win-arm-matrix:", json.dumps(win_arm_matrix, indent=2))

  # ── Generate protobuf Python code (platform-independent, runs once) ─
  generate_proto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore proto-target cache
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-proto-target-v2-${{ hashFiles('proto_generator/Cargo.lock', 'proto_generator/src/**') }}
          restore-keys: ${{ runner.os }}-proto-target-v2-

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Generate protobuf code
        working-directory: python
        run: |
          uv run --with hatch hatch build --hooks-only
        env:
          SKIP_CORE_BUILD: "true"
          SNOWFLAKE_DISABLE_COMPILE_ARROW_EXTENSIONS: "true"
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      # Keep protobuf-gen around long enough that "Re-run this job" on a
      # downstream build_wheels matrix entry can still fetch it. Cibuildwheel
      # re-runs are common (esp. manylinux_aarch64), and GitHub's per-job re-run
      # does NOT re-run upstream `needs: generate_proto`, so the artifact must
      # outlive the workflow run itself. We previously deleted it eagerly in a
      # cleanup job, which made any single-job re-run impossible.
      - name: Upload protobuf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protobuf-gen
          path: python/src/snowflake/connector/_internal/protobuf_gen/
          retention-days: 7

  # ── Build source distribution (platform-independent, runs once) ────
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache proto generator target
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-proto-target-v2-${{ hashFiles('proto_generator/Cargo.lock', 'proto_generator/src/**') }}
          restore-keys: |
            ${{ runner.os }}-proto-target-v2-

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build sdist
        working-directory: ./python
        run: >
          uv run --python 3.13
          --with hatch --with cython --with setuptools --with "virtualenv<21.0.0"
          hatch build --target sdist
        env:
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      - name: Inspect sdist
        working-directory: ./python
        run: tar tzf dist/*.tar.gz | head -40

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: python/dist/*.tar.gz

  # ── Build python_bridge + wheels per platform (cibuildwheel) ───────
  # Each runner loops over all Python versions: builds python_bridge for
  # each CPython ABI (no abi3), places the version-tagged .so, then
  # builds all wheels via a single cibuildwheel invocation.
  build_wheels:
    needs: [configure, generate_proto]
    if: fromJSON(needs.configure.outputs.cibw-matrix)[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.cibw-matrix) }}
    runs-on: ${{ matrix.os }}
    name: build_wheels (${{ matrix.artifact_id }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        if: runner.os != 'Linux'
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up all Python versions
        if: runner.os != 'Linux'
        shell: bash
        run: |
          for v in $(echo '${{ matrix.python_versions_json }}' | python3 -c 'import json,sys; [print(v) for v in json.load(sys.stdin)]'); do
            uv python install "$v"
          done

      # Use the same vcpkg-provided OpenSSL setup as the Windows ARM64 build.
      # Building vendored OpenSSL here delegates to the runner's MSYS2 Perl,
      # whose incomplete core-module installation is not suitable for OpenSSL's
      # Configure script (for example, Locale::Maketext::Simple may be absent).
      - name: Setup OpenSSL (Windows x86_64)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: x86_64

      - name: Setup MSVC environment (Windows x86_64)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      # ── python_bridge build: Linux (Docker + manylinux for glibc compat) ──
      # Cannot use job-level container: because cibuildwheel needs Docker.
      # Instead, build python_bridge via docker run with the manylinux image.
      # Without abi3 we loop over each Python version inside the container,
      # building python_bridge against each CPython ABI and placing the
      # version-tagged .so side by side.
      #
      # Caching strategy: cargo-cache (registry + target/) runs on the HOST,
      # and its dirs are volume-mounted into the manylinux container so the
      # in-container `cargo build` reads/writes them directly. The rustup
      # toolchain (~/.rustup + ~/.cargo/bin) is cached separately — keyed
      # only on a version marker so Cargo.lock churn doesn't invalidate it.
      - name: Restore Rust cache (Linux)
        if: runner.os == 'Linux'
        id: rust-cache-linux
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: sf-core-release-${{ matrix.artifact_id }}

      - name: Restore rustup toolchain cache (Linux)
        if: runner.os == 'Linux'
        id: rustup-cache-linux
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: ${{ runner.os }}-${{ matrix.artifact_id }}-rustup-stable-minimal-v1
          restore-keys: ${{ runner.os }}-${{ matrix.artifact_id }}-rustup-stable-minimal-

      - name: Build python_bridge for all versions in manylinux container
        if: runner.os == 'Linux'
        env:
          PYTHON_VERSIONS_JSON: ${{ matrix.python_versions_json }}
          CARGO_LIB: ${{ matrix.cargo_lib }}
          CARGO_EXTRA_ARGS: ${{ matrix.cargo_extra_args }}
          CONTAINER: ${{ matrix.container }}
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" \
                   "$HOME/.cargo/bin" "$HOME/.rustup" \
                   python/src/snowflake/connector/_core
          docker run --rm \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            -v "$HOME/.cargo/git:/root/.cargo/git" \
            -v "$HOME/.cargo/bin:/root/.cargo/bin" \
            -v "$HOME/.rustup:/root/.rustup" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            -e PYO3_BUILD_EXTENSION_MODULE=1 \
            -e CARGO_LIB="$CARGO_LIB" \
            -e "CARGO_EXTRA_ARGS=$CARGO_EXTRA_ARGS" \
            -e "PYTHON_VERSIONS_JSON=$PYTHON_VERSIONS_JSON" \
            "$CONTAINER" \
            bash -c '
              set -e
              export PATH="/root/.cargo/bin:$PATH"
              if [ ! -x /root/.cargo/bin/cargo ]; then
                echo "No cached rustup; installing..."
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --default-toolchain stable --profile minimal
              else
                echo "Using cached rustup toolchain"
              fi
              yum install -y perl-IPC-Cmd perl-Time-Piece
              for V in $(echo "$PYTHON_VERSIONS_JSON" | python3 -c "import json,sys; [print(v) for v in json.load(sys.stdin)]"); do
                CP_TAG="cp${V//./}"
                PY="/opt/python/${CP_TAG}-${CP_TAG}/bin/python"
                if [ ! -x "$PY" ]; then
                  echo "Missing manylinux Python at $PY"
                  ls -la /opt/python/
                  exit 1
                fi
                echo "── Building python_bridge for $V ($PY) ──"
                export PYO3_PYTHON="$PY"
                # shellcheck disable=SC2086
                cargo build --release --package python_bridge $CARGO_EXTRA_ARGS
                EXT_SUFFIX="$($PY -c "import sysconfig; print(sysconfig.get_config_var(\"EXT_SUFFIX\"))")"
                DEST="python/src/snowflake/connector/_core/sf_core_python${EXT_SUFFIX}"
                cp "target/release/${CARGO_LIB}" "$DEST"
                chmod +x "$DEST"
                echo "Placed $DEST"
              done
            '

      # Chown runs in its own always() step so cache save is possible even
      # when the build failed (and target/ may be partial or missing).
      - name: Fix ownership of cached dirs (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            target/ \
            "$HOME/.cargo/registry" "$HOME/.cargo/git" \
            "$HOME/.cargo/bin" "$HOME/.rustup" 2>/dev/null || true

      # ── python_bridge build: macOS / Windows (direct, no container) ──
      - name: Restore Rust cache
        if: runner.os != 'Linux'
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: sf-core-release

      - name: Build and place python_bridge for all versions (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'macos-arm64' && '11.0' || '10.14' }}
          PYO3_BUILD_EXTENSION_MODULE: "1"
          CARGO_LIB: ${{ matrix.cargo_lib }}
        run: |
          mkdir -p python/src/snowflake/connector/_core
          for V in $(echo '${{ matrix.python_versions_json }}' | python3 -c 'import json,sys; [print(v) for v in json.load(sys.stdin)]'); do
            PY="$(uv python find "$V")"
            echo "── Building python_bridge for $V ($PY) ──"
            export PYO3_PYTHON="$PY"
            cargo build --release --package python_bridge ${{ matrix.cargo_extra_args }}
            EXT_SUFFIX="$("$PY" -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
            DEST="python/src/snowflake/connector/_core/sf_core_python${EXT_SUFFIX}"
            cp "target/release/${CARGO_LIB}" "$DEST"
            chmod +x "$DEST"
            echo "Placed $DEST"
          done

      - name: Build and place python_bridge for all versions (Windows)
        if: runner.os == 'Windows'
        env:
          PYO3_BUILD_EXTENSION_MODULE: "1"
          CARGO_LIB: ${{ matrix.cargo_lib }}
        shell: bash
        run: |
          mkdir -p python/src/snowflake/connector/_core
          for V in $(echo '${{ matrix.python_versions_json }}' | python3 -c 'import json,sys; [print(v) for v in json.load(sys.stdin)]'); do
            PY="$(uv python find "$V")"
            PY_WIN="$(cygpath -w "$PY")"
            echo "── Building python_bridge for $V ($PY) ──"
            export PYO3_PYTHON="$PY_WIN"
            cargo build --release --package python_bridge ${{ matrix.cargo_extra_args }}
            EXT_SUFFIX="$("$PY" -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
            DEST="python/src/snowflake/connector/_core/sf_core_python${EXT_SUFFIX}"
            cp "target/release/${CARGO_LIB}" "$DEST"
            echo "Placed $DEST"
          done

      - name: Save Rust cache
        if: always() && runner.os != 'Linux'
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: sf-core-release
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save Rust cache (Linux)
        if: always() && runner.os == 'Linux'
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: sf-core-release-${{ matrix.artifact_id }}
          registry-cache-hit: ${{ steps.rust-cache-linux.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache-linux.outputs.target-cache-hit }}

      # Gated on cache-hit != 'true' to avoid "Unable to reserve cache" races
      # when the exact key already exists in the cache service.
      - name: Save rustup toolchain cache (Linux)
        if: always() && runner.os == 'Linux' && steps.rustup-cache-linux.outputs.cache-hit != 'true'
        timeout-minutes: 10
        continue-on-error: true
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: ${{ runner.os }}-${{ matrix.artifact_id }}-rustup-stable-minimal-v1

      # Free disk space: target/ can be >5GB after building python_bridge.
      # The built library is already copied to _core/; cibuildwheel doesn't
      # need cargo artifacts.
      - name: Clean up Rust target directory
        shell: bash
        run: rm -rf target/

      # ── Download protobuf ──
      - name: Download pre-built protobuf code
        uses: actions/download-artifact@v4
        with:
          name: protobuf-gen
          path: python/src/snowflake/connector/_internal/protobuf_gen

      # ── Build wheels (all Python versions in one cibuildwheel call) ──
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4
        with:
          package-dir: python
          output-dir: python/dist
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_LINUX: >-
            SKIP_CORE_BUILD=true
            SKIP_PROTO_GENERATION=true
          CIBW_ENVIRONMENT_WINDOWS: >-
            SKIP_CORE_BUILD=true
            SKIP_PROTO_GENERATION=true
            DISTUTILS_USE_SDK=1
            MSSdk=1
          CIBW_ENVIRONMENT_MACOS: >-
            SKIP_CORE_BUILD=true
            SKIP_PROTO_GENERATION=true
            MACOSX_DEPLOYMENT_TARGET=${{ contains(matrix.cibw_build, 'x86_64') && '10.14' || '11.0' }}

      # ── Validate wheels ──
      - name: Check wheels with auditwheel (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel
          for whl in python/dist/*.whl; do
            echo "=== $(basename $whl) ==="
            auditwheel show "$whl"
            if ! auditwheel show "$whl" 2>&1 | grep -q 'manylinux_2_28'; then
              echo "::error::Wheel $(basename $whl) does not meet manylinux_2_28 policy"
              exit 1
            fi
          done

      - name: Check wheels with delocate (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install delocate
          for whl in python/dist/*.whl; do
            echo "=== $(basename $whl) ==="
            delocate-listdeps "$whl"
            delocate-wheel --require-archs ${{ contains(matrix.cibw_build, 'x86_64') && 'x86_64' || 'arm64' }} --check-archs "$whl" && echo "✓ arch check passed"
          done

      # ── Upload individual wheel artifacts (preserves per-version names) ──
      - name: Upload py3.11 wheel
        if: contains(fromJSON(matrix.python_versions_json), '3.11')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_id }}_py3.11
          path: python/dist/*cp311*.whl
          if-no-files-found: error

      - name: Upload py3.12 wheel
        if: contains(fromJSON(matrix.python_versions_json), '3.12')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_id }}_py3.12
          path: python/dist/*cp312*.whl
          if-no-files-found: error

      - name: Upload py3.13 wheel
        if: contains(fromJSON(matrix.python_versions_json), '3.13')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_id }}_py3.13
          path: python/dist/*cp313*.whl
          if-no-files-found: error

      - name: Upload py3.14 wheel
        if: contains(fromJSON(matrix.python_versions_json), '3.14')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_id }}_py3.14
          path: python/dist/*cp314*.whl
          if-no-files-found: error

  # ── Build python_bridge + wheel manually (Windows ARM64) ────────────
  # cibuildwheel does not support Windows ARM64, so we build python_bridge
  # inline and build a single wheel per worker with hatch.
  build_wheel:
    needs: [configure, generate_proto]
    if: fromJSON(needs.configure.outputs.win-arm-matrix)[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.win-arm-matrix) }}
    runs-on: ${{ matrix.os }}
    name: build_wheel (${{ matrix.os }}, py${{ matrix.py }})
    env:
      CMAKE_GENERATOR_PLATFORM: ARM64
      SKIP_CORE_BUILD: "true"
      SKIP_PROTO_GENERATION: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenSSL (Windows ARM64)
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: arm64

      - name: Setup MSVC environment (ARM64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: arm64

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python ${{ matrix.py }}
        run: uv python install cpython-${{ matrix.py }}-windows-aarch64-none

      # ── python_bridge build (per-CPython ABI, same as cibuildwheel Windows path) ──
      - name: Restore Rust cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: sf-core-release

      - name: Build python_bridge
        shell: pwsh
        run: |
          $py = uv python find ${{ matrix.py }}
          Write-Host "Building python_bridge for py${{ matrix.py }} ($py)"
          $env:PYO3_PYTHON = $py
          $env:PYO3_BUILD_EXTENSION_MODULE = "1"
          cargo build --release --package python_bridge ${{ matrix.cargo_extra_args }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Place python_bridge in python package
        shell: pwsh
        run: |
          $py = uv python find ${{ matrix.py }}
          $extSuffix = & $py -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))"
          $destDir = "python/src/snowflake/connector/_core"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $dest = Join-Path $destDir "sf_core_python$extSuffix"
          Copy-Item "target/release/${{ matrix.cargo_lib }}" $dest
          Write-Host "Placed $dest"
          if (-not (Test-Path $dest)) {
            Write-Error "Extension not placed at $dest"
            exit 1
          }

      - name: Save Rust cache
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: sf-core-release
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      # ── Download protobuf ──
      - name: Download pre-built protobuf code
        uses: actions/download-artifact@v4
        with:
          name: protobuf-gen
          path: python/src/snowflake/connector/_internal/protobuf_gen

      # ── Build ──
      # MSVC env from the earlier setup-msvc step persists across steps via
      # GITHUB_ENV, so no separate `call vcvarsall.bat` is needed here.
      - name: Build python wheel
        working-directory: ./python
        shell: cmd
        run: uv run --python ${{ matrix.py }} --with hatch --with cython --with setuptools --with "virtualenv<21.0.0" hatch build
        env:
          # setup-msvc already exported a complete ARM64 compiler environment.
          # Re-running vcvarsall from setuptools appends that environment to an
          # already-long PATH and can exceed cmd.exe's input-line limit.
          DISTUTILS_USE_SDK: "1"
          MSSdk: "1"

      - name: Inspect wheel
        working-directory: ./python
        shell: pwsh
        run: |
          $whl = (Get-ChildItem dist/*.whl).FullName
          uv run --python ${{ matrix.py }} python -m zipfile -l $whl
          uv run --python ${{ matrix.py }} python -c @'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          core = [n for n in names if "_core/" in n and "sf_core_python" in n and n.endswith((".so", ".pyd"))]
          if len(core) != 1:
              raise SystemExit(f"Expected exactly one sf_core_python binary in wheel, found {core}")
          print(f"sf_core_python in wheel: {core[0]}")
          '@ $whl

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: python/dist/*.whl
