name: Build Python Wheels

on:
  workflow_call:
    inputs:
      targets:
        type: string
        required: true
        description: >
          JSON object mapping platform keys to Python version arrays.
          Example: {"linux_x86": ["3.10","3.11","3.12","3.13","3.14"], "windows_arm": ["3.11","3.12"]}
          Supported platforms: linux_x86, windows_arm.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Expand targets into detailed build matrices ────────────────────
  configure:
    runs-on: ubuntu-latest
    outputs:
      sf-core-matrix: ${{ steps.expand.outputs.sf-core-matrix }}
      cibw-matrix: ${{ steps.expand.outputs.cibw-matrix }}
      win-arm-matrix: ${{ steps.expand.outputs.win-arm-matrix }}
    steps:
      - name: Expand targets into build matrices
        id: expand
        shell: python3 {0}
        run: |
          import json, os

          PLATFORMS = {
              "linux_x86": {
                  "target": "linux-x86_64",
                  "os": "ubuntu-latest",
                  "container": "quay.io/pypa/manylinux_2_28_x86_64",
                  "lib_name": "libsf_core.so",
                  "cargo_extra_args": "--features vendored-openssl --config profile.release.opt-level=2",
                  "wheel_method": "cibuildwheel",
                  "cibw_arch": "manylinux_x86_64",
                  "artifact_id": "manylinux_x86_64",
              },
              "windows_arm": {
                  "target": "windows-arm64",
                  "os": "windows-11-arm",
                  "container": "",
                  "lib_name": "sf_core.dll",
                  "cargo_extra_args": "--config profile.release.opt-level=2 --config profile.release.strip=false",
                  "wheel_method": "manual",
                  "artifact_id": "win_arm64",
              },
          }

          targets = json.loads("""${{ inputs.targets }}""")

          sf_core = []
          cibw = []
          wheel = []
          seen_targets = set()

          for key, versions in targets.items():
              if key not in PLATFORMS:
                  raise ValueError(f"Unknown platform: {key}. Supported: {list(PLATFORMS)}")
              p = PLATFORMS[key]

              if p["target"] not in seen_targets:
                  seen_targets.add(p["target"])
                  sf_core.append({
                      "target": p["target"],
                      "os": p["os"],
                      "container": p["container"],
                      "lib_name": p["lib_name"],
                      "cargo_extra_args": p["cargo_extra_args"],
                  })

              if p["wheel_method"] == "cibuildwheel":
                  for v in versions:
                      shortver = v.replace(".", "")
                      cibw.append({
                          "target": p["target"],
                          "os": p["os"],
                          "py": v,
                          "cibw_build": f"cp{shortver}-{p['cibw_arch']}",
                          "sf_core_artifact": f"sf-core-{p['target']}",
                          "artifact_name": f"{p['artifact_id']}_py{v}",
                      })
              else:
                  for v in versions:
                      wheel.append({
                          "os": p["os"],
                          "py": v,
                          "sf_core_artifact": f"sf-core-{p['target']}",
                          "artifact_name": f"{p['artifact_id']}_py{v}",
                      })

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"sf-core-matrix={json.dumps(sf_core)}\n")
              f.write(f"cibw-matrix={json.dumps(cibw)}\n")
              f.write(f"win-arm-matrix={json.dumps(wheel)}\n")

          # Log for debugging
          print("sf-core-matrix:", json.dumps(sf_core, indent=2))
          print("cibw-matrix:", json.dumps(cibw, indent=2))
          print("win-arm-matrix:", json.dumps(wheel, indent=2))

  # ── Build sf_core (Rust shared library) ────────────────────────────
  # One build per target platform. Python-version-independent.
  build_sf_core:
    needs: configure
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.sf-core-matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: build_sf_core (${{ matrix.target }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Linux container setup ──
      - name: Install Rust toolchain (container)
        if: matrix.container != ''
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install vendored OpenSSL build deps (container)
        if: matrix.container != ''
        run: yum install -y perl-IPC-Cmd perl-Time-Piece

      # ── Windows ARM64 OpenSSL setup ──
      - name: Capture vcpkg version for cache key
        if: runner.os == 'Windows'
        uses: ./.github/actions/vcpkg-version

      - name: Cache vcpkg packages
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL (static) via vcpkg
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows-static-md

      - name: Configure ARM64 OpenSSL (static)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows-static-md\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      # ── Cargo cache & build ──
      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: sf-core-release

      - name: Build sf_core (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --package sf_core ${{ matrix.cargo_extra_args }}

      - name: Build sf_core (Windows ARM64)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          cargo build --release --package sf_core ${{ matrix.cargo_extra_args }}

      - name: Upload sf_core library
        uses: actions/upload-artifact@v4
        with:
          name: sf-core-${{ matrix.target }}
          path: target/release/${{ matrix.lib_name }}

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: sf-core-release
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

  # ── Build wheels via cibuildwheel (Linux/macOS) ────────────────────
  build_wheels:
    needs: [configure, build_sf_core]
    if: fromJSON(needs.configure.outputs.cibw-matrix)[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.cibw-matrix) }}
    runs-on: ${{ matrix.os }}
    name: build_wheels (${{ matrix.os }}, py${{ matrix.py }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built sf_core
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sf_core_artifact }}
          path: python/src/snowflake/connector/_core

      - name: Ensure sf_core is executable
        run: chmod +x python/src/snowflake/connector/_core/*

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4
        with:
          package-dir: python
          output-dir: python/dist
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            && yum install -y perl-IPC-Cmd perl-Time-Piece
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$HOME/.cargo/bin:$PATH"
            SKIP_CORE_BUILD=true
            PROTO_CARGO_TARGET_DIR=/tmp/proto-target

      - name: Check wheels with auditwheel
        run: |
          pip install auditwheel
          for whl in python/dist/*.whl; do
            echo "=== $(basename $whl) ==="
            auditwheel show "$whl"
          done

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: python/dist/*.whl

  # ── Build wheels manually per (os, py) pair (Windows ARM64) ────────
  build_wheel:
    needs: [configure, build_sf_core]
    if: fromJSON(needs.configure.outputs.win-arm-matrix)[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.win-arm-matrix) }}
    runs-on: ${{ matrix.os }}
    name: build_wheel (${{ matrix.os }}, py${{ matrix.py }})
    env:
      CMAKE_GENERATOR_PLATFORM: ARM64
      SKIP_CORE_BUILD: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built sf_core
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sf_core_artifact }}
          path: python/src/snowflake/connector/_core

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python ${{ matrix.py }}
        run: uv python install cpython-${{ matrix.py }}-windows-aarch64-none

      - name: Cache proto generator target
        uses: actions/cache@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-proto-target-${{ hashFiles('proto_generator/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-proto-target-

      # ── Windows ARM64 OpenSSL (needed by cryptography dependency) ──
      - name: Capture vcpkg version for cache key
        uses: ./.github/actions/vcpkg-version

      - name: Cache vcpkg ARM64 static OpenSSL
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL (static) via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows-static-md

      - name: Configure ARM64 OpenSSL (static)
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows-static-md\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      # ── Build ──
      - name: Build python wheel
        working-directory: ./python
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          uv run --python ${{ matrix.py }} --with hatch --with cython --with setuptools --with "virtualenv<21.0.0" hatch build
        env:
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}\proto-target

      - name: Inspect wheel
        working-directory: ./python
        shell: pwsh
        run: uv run --python ${{ matrix.py }} python -m zipfile -l (Get-ChildItem dist/*.whl).FullName

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: python/dist/*.whl
