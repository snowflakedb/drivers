# Automate PR review pings.
#
# On a new (or freshly-undrafted) PR, pick a random reviewer from
# .github/reviewers.yml, request review + add as assignee via the
# GitHub REST API, and ping #drivers-review via
# slackapi/slack-github-action. On the schedule below, post a digest
# of open non-draft PRs that have no APPROVED / CHANGES_REQUESTED
# review yet; the digest pass also re-assigns PRs whose every
# requested reviewer is OOO (Slack status) to a non-OOO substitute
# drawn from the same label pool.
#
# .github/reviewers.yml also encodes per-reviewer opt-out flags
# (`assign`, `remind`); see that file for details.
#
# All GitHub I/O goes through the `gh` CLI (with GITHUB_TOKEN) and all
# Slack writes go through slackapi/slack-github-action. The Python
# script in scripts/pr_review_bot.py only orchestrates and formats
# messages.
#
# Required repository configuration:
#   secrets.SLACK_BOT_TOKEN
#       Slack bot token (xoxb-...) with two scopes:
#         - chat:write         post messages in #drivers-review.
#         - users:read.email   look up each reviewer's Slack user ID
#                              by their git commit email, so the bot
#                              can emit a real <@U...> channel mention
#                              that triggers a notification (same as
#                              typing @first.last manually in the
#                              channel). The bot never sends DMs — all
#                              writes are chat.postMessage to a channel.
#       The bot deliberately does NOT request users:read and never calls
#       users.list. Per-reviewer users.lookupByEmail fetches one user's
#       profile at a time, instead of pulling the whole workspace's
#       directory onto a public runner.
#   vars.SLACK_CHANNEL (optional)
#       Channel name (no leading '#') or channel ID. Defaults to
#       'drivers-review'.
#
# Reviewer pool comes from .github/reviewers, keyed by *PR label*
# ("<label>  @login1 @login2 ..."). The bot reads the PR's labels off
# the payload it already fetches, unions the reviewers of every rule
# whose label is on the PR, falls back to the reserved `all` rule
# when no label matches, then excludes the author + already-requested
# reviewers + OOO candidates and picks one at random. CODEOWNERS stays
# on the team alias so GitHub's native code-owner request keeps firing
# once against the team; the bot keeps its own individual pool here so
# it does not need the read:org scope to resolve team membership.
#
# Real <@U...> Slack mentions are resolved per-reviewer via
# users.lookupByEmail using the email from commit.author of each
# reviewer's most recent commit in the repo. If the lookup fails (no
# token, noreply email, user not in workspace) the message falls back
# to @first.last text derived from commit.author.name.
name: PR review bot

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  schedule:
    # Every 2h on the hour, but only at UTC times that overlap
    # working hours (08:00–16:59), Monday-Friday only (skip weekends).
    - cron: "0 7,12,14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        type: choice
        default: remind
        options:
          - assign
          - remind
      pr_number:
        description: "PR number (only used when mode=assign)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-bot-${{ github.event_name }}-${{ github.event.pull_request.number || 'global' }}
  cancel-in-progress: false

jobs:
  assign-reviewer:
    name: Assign random reviewer
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'assign')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        # PyYAML is the only third-party Python dependency the bot
        # needs (to parse .github/reviewers.yml); everything else is
        # subprocess-based (gh CLI + curl). Pinning to a major version
        # keeps the workflow reproducible without requiring a Renovate
        # bump for every PyYAML patch release.
        run: pip install "pyyaml>=6,<7"

      - name: Assign reviewer and prepare Slack payload
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL || 'drivers-review' }}
          # Passed in so users.lookupByEmail can translate the reviewer's
          # git commit email to a Slack user ID for a real <@U...>
          # mention. Optional — falls back to plain @handle text if
          # unset or the lookup fails.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PAYLOAD_FILE: ${{ runner.temp }}/slack_payload.json
        run: python scripts/pr_review_bot.py assign

      - name: Post assignment notification to Slack
        if: steps.build.outputs.skip != 'true'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack_payload.json

  remind-reviewers:
    name: Remind pending reviewers
    if: |
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'remind')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        # PyYAML is the only third-party Python dependency the bot
        # needs (to parse .github/reviewers.yml); see the assign job
        # for the rationale on the version pin.
        run: pip install "pyyaml>=6,<7"

      - name: Build reminder digest payload
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The Python quiet-hours guard suppresses scheduled posts
          # outside Warsaw working hours but lets manual
          # workflow_dispatch runs through; it needs to know which
          # trigger fired the job.
          GH_EVENT_NAME: ${{ github.event_name }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL || 'drivers-review' }}
          # Used for users.lookupByEmail to mint <@U...> mentions; see
          # the assign-reviewer job for details.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PAYLOAD_FILE: ${{ runner.temp }}/slack_payload.json
        run: python scripts/pr_review_bot.py remind

      - name: Post reminder digest to Slack
        if: steps.build.outputs.skip != 'true'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack_payload.json
