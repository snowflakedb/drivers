name: Build JDBC JARs

on:
  schedule:
    - cron: '0 4 * * *'  # Same slot as JDBC CI nightly; schedule is mirror-only (see job if)
  push:
    branches:
      - 'release/jdbc-**'
  pull_request:
    # Packaging-only paths: the JAR layout (Gradle build), the runtime native
    # selection, and the workflows themselves. Deliberately NOT all of jdbc/** —
    # the 7-leg build_native matrix is ~45 minutes, and driver code changes are
    # already covered by JDBC CI.
    paths:
      - 'jdbc/build.gradle'
      - 'jdbc/settings.gradle'
      - 'jdbc/gradle/**'
      - 'jdbc/src/main/java/net/snowflake/client/internal/unicore/NativeLibraryLoader.java'
      - 'jdbc/src/main/java/net/snowflake/client/internal/unicore/LibcDetector.java'
      - '.github/workflows/build-jdbc-jars.yml'
      - '.github/workflows/_build-jdbc-fatjar.yml'
      - '.github/actions/jdbc-bridge-cache/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_jdbc_jars:
    # Eng: packaging PRs / release pushes / dispatch (schedule is skipped —
    # JDBC CI already builds natives in the 04:00 nightly).
    # Mirror: schedule + dispatch + release/* only (no PR tax).
    if: >-
      (github.repository_owner != 'snowflakedb' && github.event_name != 'schedule')
      || (github.repository_owner == 'snowflakedb'
          && (github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/heads/release/')))
    uses: ./.github/workflows/_build-jdbc-fatjar.yml
