name: Python CI

on:
  # Every event is orchestrated by driver-status.yml, which resolves the
  # suites to run and invokes only the affected driver workflows.
  workflow_call:
    inputs:
      run_python:
        description: "Run Python tests."
        type: boolean
        required: false
        default: false
      run_python_packaging:
        description: "Run Python packaging tests."
        type: boolean
        required: false
        default: false
      run_python_reference:
        description: "Run Python reference tests."
        type: boolean
        required: false
        default: false

concurrency:
  # Group by PR number for PRs; fall back to run ID for push-to-main,
  # push-to-release, and merge_group runs (each run is unique so they
  # won't cancel each other).
  #
  # The prefix is a literal, not ${{ github.workflow }}: inside a workflow_call
  # the github context belongs to the caller, so github.workflow would resolve
  # to "Driver CI" and put this run in the orchestrator's own group. GitHub
  # reads that as a deadlock and fails the call before any job starts.
  group: python-ci-${{ github.event.pull_request.number || github.run_id }}
  # Don't cancel an in-flight run when an unrelated label is added/removed —
  # only scope-up labels (ci:scope-merge, ci:scope-nightly) and normal
  # push/synchronize/reopen events should replace the running matrix.
  cancel-in-progress: ${{ github.event.action != 'labeled' || contains(fromJSON('["ci:scope-merge-queue","ci:scope-merge","ci:scope-nightly"]'), github.event.label.name) }}

env:
  CARGO_TERM_COLOR: always

jobs:
  load-python-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build-targets: ${{ steps.targets.outputs.targets }}
      cleanup-clouds: ${{ steps.cleanup-clouds.outputs.clouds }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          LEVEL_ARG=""
          # workflow_dispatch selects nightly too, so the full matrix can be run by hand.
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] || \
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/release/* ]]; then
            LEVEL_ARG="--level nightly"
          fi
          python ci/test_matrix/generate_matrix.py \
            --driver python --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --emit-active $LEVEL_ARG \
            >> "$GITHUB_OUTPUT"
      - id: targets
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          LEVEL_ARG=""
          # workflow_dispatch selects nightly too, so the full matrix can be run by hand.
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] || \
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/release/* ]]; then
            LEVEL_ARG="--level nightly"
          fi
          python ci/test_matrix/generate_matrix.py \
            --driver python --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --emit-build-targets $LEVEL_ARG \
            >> "$GITHUB_OUTPUT"
      - id: cleanup-clouds
        env:
          MATRIX_JSON: ${{ steps.matrix.outputs.matrix }}
        run: |
          python3 -c '
          import json, os
          rows = json.loads(os.environ["MATRIX_JSON"] or "[]")
          clouds = sorted({r["cloud_provider"] for r in rows})
          print("clouds=" + json.dumps(clouds))
          ' >> "$GITHUB_OUTPUT"

  # ── Build all wheels via shared reusable workflow ────────────────────
  build_wheels:
    needs: load-python-matrix
    if: inputs.run_python
    uses: ./.github/workflows/_build-python-wheels.yml
    with:
      targets: ${{ needs.load-python-matrix.outputs.build-targets }}

  # Packaging tests — wheel build path (full workspace, lto = "thin")
  packaging_tests_wheel:
    if: inputs.run_python_packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Rust cache
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "packaging-wheel"

      - name: Restore core-target cache
        id: core-target-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: core-target
          # The key must hash the Rust *sources* of every crate built into this
          # target dir, not just Cargo.lock. A registry-only edit changes
          # sf_params_spec/src/lib.rs without touching Cargo.lock, so a
          # lock-only key restores a stale rlib that cargo then treats as fresh
          # — sf_core compiles against outdated `param_names` and fails on a
          # symbol that exists in the tree. Same reasoning as proto-target below.
          # v3 also hashes protobuf/** and proto_generator/src/**: sf_core's
          # build.rs regenerates Rust code from database_driver_v1.proto into
          # this same target dir, so a schema-only or generator-only change
          # must bust the cache too, or the restored dir keeps the old
          # generated code next to freshly-compiled callers expecting the new
          # shape (unresolved imports / wrong arg counts).
          key: ${{ runner.os }}-rust-packaging-wheel-core-target-v3-${{ hashFiles('**/Cargo.lock', 'sf_core/src/**', 'sf_params_spec/src/**', 'python_bridge/src/**', 'proto_utils/src/**', 'error_trace/src/**', 'error_trace_derive/src/**', 'protobuf/**', 'proto_generator/src/**') }}
          restore-keys: ${{ runner.os }}-rust-packaging-wheel-core-target-v3-

      - name: Restore proto-target cache
        id: proto-target-cache-pkg
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-v2-${{ hashFiles('proto_generator/Cargo.lock', 'proto_generator/src/**') }}
          restore-keys: ${{ runner.os }}-rust-packaging-proto-target-v2-

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Mock parameters.json
        run: echo '{"testconnection":{}}' > parameters.json

      - name: Run wheel packaging test
        working-directory: ./python
        run: hatch run packaging.py3.13:test -v --timeout=900 tests/packaging/test_wheel_build.py
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          CORE_CARGO_TARGET_DIR: ${{ github.workspace }}/core-target
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "packaging-wheel"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save core-target cache
        if: always() && steps.core-target-cache.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: core-target
          key: ${{ runner.os }}-rust-packaging-wheel-core-target-v3-${{ hashFiles('**/Cargo.lock', 'sf_core/src/**', 'sf_params_spec/src/**', 'python_bridge/src/**', 'proto_utils/src/**', 'error_trace/src/**', 'error_trace_derive/src/**', 'protobuf/**', 'proto_generator/src/**') }}

      - name: Save proto-target cache
        if: always() && steps.proto-target-cache-pkg.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-v2-${{ hashFiles('proto_generator/Cargo.lock', 'proto_generator/src/**') }}

  # Packaging tests — sdist install path (minimal workspace, lto = false)
  packaging_tests_sdist:
    if: inputs.run_python_packaging
    runs-on: ubuntu-latest
    # A core-target cache miss forces a cold `cargo build --release` of the
    # full workspace inside the sdist install step (see SDIST_INSTALL_TIMEOUT
    # in test_sdist.py); 30 minutes doesn't leave room for that plus the
    # cache restore/save steps that bracket it.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Rust cache
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "packaging-sdist"

      - name: Restore core-target cache
        id: core-target-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: core-target
          # Exact key only — no restore-keys. A prefix hit restores sf_params_spec
          # rlibs built from older sources; sdist then compiles a /tmp extract
          # into this target dir and cargo treats those rlibs as fresh, so new
          # sf_core fails with unresolved Wrapper / resolve_for. Hashing sources
          # in the key only works if a mismatch misses entirely. v4 drops v3
          # entries already saved from failed prefix-restore runs.
          key: ${{ runner.os }}-rust-packaging-sdist-core-target-v4-${{ hashFiles('**/Cargo.lock', 'sf_core/src/**', 'sf_params_spec/src/**', 'python_bridge/src/**', 'proto_utils/src/**', 'error_trace/src/**', 'error_trace_derive/src/**', 'protobuf/**', 'proto_generator/src/**') }}

      - name: Restore proto-target cache
        id: proto-target-cache-pkg
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-v2-${{ hashFiles('proto_generator/Cargo.lock', 'proto_generator/src/**') }}
          restore-keys: ${{ runner.os }}-rust-packaging-proto-target-v2-

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Mock parameters.json
        run: echo '{"testconnection":{}}' > parameters.json

      - name: Run sdist packaging test
        working-directory: ./python
        # pytest-timeout's --timeout must exceed SDIST_INSTALL_TIMEOUT (see
        # test_sdist.py) plus headroom for sdist build/venv/verify steps in
        # the same test, or it kills the test before the subprocess-level
        # timeout can produce a diagnosable failure.
        run: hatch run packaging.py3.13:test -v --timeout=1800 tests/packaging/test_sdist.py
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          CORE_CARGO_TARGET_DIR: ${{ github.workspace }}/core-target
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "packaging-sdist"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save core-target cache
        if: success() && steps.core-target-cache.outputs.cache-hit != 'true'
        # Success-only: a failed sdist install can leave a mixed target dir
        # (stale spec rlib + rebuilt sf_core). Saving that under the new exact
        # key poisons every later run with the same sources.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: core-target
          key: ${{ runner.os }}-rust-packaging-sdist-core-target-v4-${{ hashFiles('**/Cargo.lock', 'sf_core/src/**', 'sf_params_spec/src/**', 'python_bridge/src/**', 'proto_utils/src/**', 'error_trace/src/**', 'error_trace_derive/src/**', 'protobuf/**', 'proto_generator/src/**') }}

      - name: Save proto-target cache
        if: always() && steps.proto-target-cache-pkg.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-v2-${{ hashFiles('proto_generator/Cargo.lock', 'proto_generator/src/**') }}

  # Native-arrow overlays python_bridge in install-wheel and runs its :cov suite.
  python_tests:
    needs: [build_wheels, load-python-matrix]
    if: inputs.run_python
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-python-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: python_tests ${{ matrix.hatch_env }} (${{ matrix.os }}, py${{ matrix.py }}, ${{ matrix.cloud_provider }}${{ matrix.result_format && format(', {0}', matrix.result_format) || '' }})
    timeout-minutes: ${{ matrix.hatch_env == 'test-native-arrow' && 45 || contains(matrix.os, 'windows') && 60 || 30 }}
    env:
      MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ matrix.cloud_provider }}${{ matrix.result_format && format('-{0}', matrix.result_format) || '' }}
      CLOUD_PROVIDER: ${{ matrix.cloud_provider }}
    steps:
      - name: Set UV cache dir
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "UV_CACHE_DIR=$RUNNER_TEMP/.uv-cache" >> $GITHUB_ENV
          else
            echo "UV_CACHE_DIR=/tmp/.uv-cache" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      # UV cache key intentionally omits matrix.cloud_provider: uv installs the same wheel +
      # dependencies regardless of which cloud provider the E2E tests target, so sharing one
      # cache per (os, py, hatch_env) triple across cloud providers avoids 3x cache duplication
      # and improves hit rates.
      # Restore uv cache for Linux + macOS (Unix runners). The id `uv-cache-unix`
      # is referenced by the matching save step below — if you rename it here,
      # rename it there too.
      - name: Restore uv cache (Linux/macOS)
        id: uv-cache-unix
        if: runner.os != 'Windows'
        # Cache restore failures never fail the job — fall back to clean install.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-
            uv-${{ matrix.os }}-${{ matrix.py }}-
            uv-${{ matrix.os }}-

      - name: Restore uv cache (Windows)
        id: uv-cache-windows
        if: runner.os == 'Windows'
        # Cache restore failures never fail the job — fall back to clean install.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-
            uv-${{ matrix.os }}-${{ matrix.py }}-
            uv-${{ matrix.os }}-

      - name: Set up Python ${{ matrix.py }}
        # See comment in build_wheel job — ARM64 Windows needs explicit arch request
        run: uv python install ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.py) || matrix.py }}

      - name: Download wheel
        if: matrix.wheel_artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheel_artifact }}_py${{ matrix.py }}
          path: python/dist

      - name: Download sdist
        if: matrix.py == '3.10'
        uses: actions/download-artifact@v8
        with:
          name: python-sdist
          path: python/dist

      # sdist installs build sf_core from source, so Rust is needed
      - name: Restore Rust cache (sdist)
        if: matrix.py == '3.10'
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: sdist-test

      # Native-arrow install-wheel overlays python_bridge (Cargo feature is
      # compile-time). Isolate the target dir from the sdist cache so the two
      # cells cannot clobber each other.
      - name: Set native-arrow cargo target dir
        if: matrix.hatch_env == 'test-native-arrow'
        shell: bash
        run: echo "CORE_CARGO_TARGET_DIR=${{ github.workspace }}/core-target-native-arrow" >> $GITHUB_ENV

      - name: Ensure Rust toolchain (native-arrow)
        if: matrix.hatch_env == 'test-native-arrow'
        run: rustup show

      - name: Restore Rust cache (native-arrow)
        if: matrix.hatch_env == 'test-native-arrow'
        id: rust-cache-native-arrow
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: native-arrow-bridge
          target-dir: ${{ github.workspace }}/core-target-native-arrow

      - name: Shrink MSVC debug info
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}
        shell: bash

      - name: Setup OpenSSL (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: arm64

      - name: Configure ARM64 build environment
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          echo "RUSTFLAGS=-C linker=rust-lld" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV

      - name: Setup OpenSSL (Windows x86_64)
        if: matrix.os == 'windows-latest' && matrix.py == '3.10'
        uses: ./.github/actions/setup-windows-openssl
        with:
          arch: x86_64

      - name: Install Hatch
        run: &setup_env uv tool install hatch --with "virtualenv<21.0.0"

      - name: Install snowflake ud driver from wheel (Linux/macOS)
        if: runner.os != 'Windows' && matrix.wheel_artifact
        working-directory: python
        run: |
          WHEELS=(dist/*.whl)
          if [[ ${#WHEELS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 wheel, found ${#WHEELS[@]}"; ls -la dist/; exit 1
          fi
          export WHEEL_PATH="${WHEELS[0]}"
          echo "Installing wheel: $WHEEL_PATH"
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel

      - name: Install snowflake ud driver from sdist (Linux/macOS)
        if: runner.os != 'Windows' && !matrix.wheel_artifact
        working-directory: python
        run: |
          SDISTS=(dist/*.tar.gz)
          if [[ ${#SDISTS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 sdist, found ${#SDISTS[@]}"; ls -la dist/; exit 1
          fi
          export WHEEL_PATH="${SDISTS[0]}"
          echo "Installing sdist: $WHEEL_PATH"
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel
        env:
          SKIP_CORE_BUILD: "false"

      - name: Install snowflake ud driver from wheel (Windows)
        if: runner.os == 'Windows' && matrix.wheel_artifact
        working-directory: python
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist/*.whl)
          if ($wheels.Count -ne 1) {
            Write-Error "Expected exactly 1 wheel, found $($wheels.Count)"; Get-ChildItem dist/; exit 1
          }
          $env:WHEEL_PATH = $wheels[0].FullName
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel

      - name: Install snowflake ud driver from sdist (Windows)
        if: runner.os == 'Windows' && !matrix.wheel_artifact
        working-directory: python
        shell: pwsh
        run: |
          $sdists = @(Get-ChildItem dist/*.tar.gz)
          if ($sdists.Count -ne 1) {
            Write-Error "Expected exactly 1 sdist, found $($sdists.Count)"; Get-ChildItem dist/; exit 1
          }
          $env:WHEEL_PATH = $sdists[0].FullName
          Write-Host "Installing sdist: $($env:WHEEL_PATH)"
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel
        env:
          SKIP_CORE_BUILD: "false"

      # test-pandas and test-native-arrow each collect a curated subset via
      # hatch :cov (pandas e2e; native-arrow converters as they land). The
      # unit/integ/e2e split applies only to the `test` env.
      - name: Run unit tests with coverage
        if: matrix.hatch_env != 'test-pandas' && matrix.hatch_env != 'test-native-arrow'
        id: run_python_unit
        continue-on-error: true
        working-directory: python
        shell: bash
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:unit \
            --json-report --json-report-file=reports/universal-${{ env.MATRIX_KEY }}.unit.json \
            --junitxml=reports/universal-${{ env.MATRIX_KEY }}.unit.xml \
            --cov=src/snowflake \
            --cov-report=xml:reports/coverage-${{ env.MATRIX_KEY }}.xml \
            --cov-report=html:reports/coverage-${{ env.MATRIX_KEY }}-html
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Rerun failed unit tests
        if: steps.run_python_unit.outcome == 'failure'
        working-directory: python
        shell: bash
        run: hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:unit --last-failed
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Run integration tests with coverage
        if: ${{ !cancelled() && matrix.hatch_env != 'test-pandas' && matrix.hatch_env != 'test-native-arrow' }}
        id: run_python_integ
        continue-on-error: true
        working-directory: python
        shell: bash
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:integ \
            --json-report --json-report-file=reports/universal-${{ env.MATRIX_KEY }}.integ.json \
            --junitxml=reports/universal-${{ env.MATRIX_KEY }}.integ.xml \
            --cov=src/snowflake --cov-append \
            --cov-report=xml:reports/coverage-${{ env.MATRIX_KEY }}.xml \
            --cov-report=html:reports/coverage-${{ env.MATRIX_KEY }}-html
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Rerun failed integration tests
        if: steps.run_python_integ.outcome == 'failure'
        working-directory: python
        shell: bash
        run: hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:integ --last-failed
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Run e2e tests with coverage
        if: ${{ !cancelled() && matrix.hatch_env != 'test-pandas' && matrix.hatch_env != 'test-native-arrow' }}
        id: run_python_e2e
        continue-on-error: true
        working-directory: python
        shell: bash
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:e2e \
            --json-report --json-report-file=reports/universal-${{ env.MATRIX_KEY }}.e2e.json \
            --junitxml=reports/universal-${{ env.MATRIX_KEY }}.e2e.xml \
            --cov=src/snowflake --cov-append \
            --cov-report=xml:reports/coverage-${{ env.MATRIX_KEY }}.xml \
            --cov-report=html:reports/coverage-${{ env.MATRIX_KEY }}-html
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Rerun failed e2e tests
        if: steps.run_python_e2e.outcome == 'failure'
        working-directory: python
        shell: bash
        run: hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:e2e --last-failed
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Merge pytest JSON reports
        if: ${{ !cancelled() && matrix.hatch_env != 'test-pandas' && matrix.hatch_env != 'test-native-arrow' }}
        working-directory: python
        shell: bash
        run: |
          "$(uv python find ${{ matrix.py }})" - <<'PY'
          import json
          from pathlib import Path

          key = """${{ env.MATRIX_KEY }}"""
          reports = Path("reports")
          tests = []
          for suffix in ("unit", "integ", "e2e"):
              path = reports / f"universal-{key}.{suffix}.json"
              if path.exists():
                  tests.extend(json.loads(path.read_text()).get("tests", []))
          out = reports / f"universal-{key}.json"
          out.write_text(json.dumps({"tests": tests}))
          print(f"Merged {len(tests)} test records into {out}")
          PY

      - name: Run curated hatch :cov suite
        if: matrix.hatch_env == 'test-pandas' || matrix.hatch_env == 'test-native-arrow'
        id: run_python_cov
        continue-on-error: true
        working-directory: python
        shell: bash
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov \
            --json-report --json-report-file=reports/universal-${{ env.MATRIX_KEY }}.json \
            --junitxml=reports/universal-${{ env.MATRIX_KEY }}.xml \
            --cov-report=xml:reports/coverage-${{ env.MATRIX_KEY }}.xml \
            --cov-report=html:reports/coverage-${{ env.MATRIX_KEY }}-html
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Rerun failed curated hatch :cov tests
        if: steps.run_python_cov.outcome == 'failure'
        working-directory: python
        shell: bash
        run: hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov --last-failed
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          QUERY_RESULT_FORMAT: ${{ matrix.result_format == 'json' && 'JSON' || '' }}

      - name: Upload test results as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-universal-${{ env.MATRIX_KEY }}
          path: python/reports/*-${{ env.MATRIX_KEY }}.*

      # Prune unreachable entries (stale wheels, orphan metadata, old builds) before the cache
      # save. Typically trims 30-50% of the cache, which directly reduces the post-job save time
      # — particularly noticeable on Windows where tar/compression of many small files is slow.
      # Python interpreters live in a separate uv "data" dir, not UV_CACHE_DIR, so pruning does
      # not affect interpreter caching.
      - name: Prune uv cache
        if: always()
        shell: bash
        run: uv cache prune --ci

      - name: Save uv cache (Linux/macOS)
        if: always() && runner.os != 'Windows' && steps.uv-cache-unix.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}

      - name: Save uv cache (Windows)
        # Skip when the exact key was already restored.
        if: always() && runner.os == 'Windows' && steps.uv-cache-windows.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}

      - name: Save Rust cache (sdist)
        if: always() && matrix.py == '3.10'
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: sdist-test
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save Rust cache (native-arrow)
        if: always() && matrix.hatch_env == 'test-native-arrow'
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: native-arrow-bridge
          target-dir: ${{ github.workspace }}/core-target-native-arrow
          registry-cache-hit: ${{ steps.rust-cache-native-arrow.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache-native-arrow.outputs.target-cache-hit }}

  cleanup_python:
    needs: [python_tests, load-python-matrix]
    # Unique clouds from the python_tests matrix. Empty (`[]`) fails GHA
    # strategy.matrix, so skip when no cells ran.
    if: always() && needs.python_tests.result != 'skipped' && needs.load-python-matrix.outputs.cleanup-clouds != '[]'
    strategy:
      fail-fast: false
      matrix:
        cloud_provider: ${{ fromJSON(needs.load-python-matrix.outputs.cleanup-clouds) }}
    runs-on: ubuntu-latest
    name: cleanup_python (${{ matrix.cloud_provider }})
    steps:
      - uses: actions/checkout@v7

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}
        shell: bash

      - name: Cleanup test PATs
        continue-on-error: true
        run: |
          python -m pip install snowflake-connector-python -q
          python scripts/cleanup_env.py \
            --parameter-path "${{ github.workspace }}/parameters.json"

  # Integration tests only with reference connector (for comparison).
  #
  # Each variant's (os, py, cloud_provider) must match a cell that
  # python_tests emits at PR scope so python_compare_results can pair
  # the reference and universal artifacts. See ci/test_matrix/models/python.py
  # PR_CELLS. Reference hatch envs install snowflake-connector-python from
  # PyPI (python/pyproject.toml reference / reference-pandas) and inherit
  # skip-install=true, so no universal wheel download is needed.
  python_tests_reference:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:scope-merge-queue')
      && github.event_name != 'merge_group'
      && inputs.run_python_reference
    strategy:
      fail-fast: false
      matrix:
        # Reference tests must NOT run on Azure: snowflake-connector-python
        # against an Azure deployment is flaky here and destabilises every
        # PR. Pick PR_CELLS rows whose Cloud is aws/gcp. Each row below
        # must also exactly match an entry in ci/test_matrix/models/python.py
        # PR_CELLS (same os/py/cloud_provider/hatch_env) so the artifact
        # downloads in python_compare_results line up with python_tests.
        # macOS reference comparison was removed when the macOS PR cell
        # was deferred to merge-queue scope (limited macOS runner
        # availability). reference-pandas shares this job's os/py/cloud with
        # `reference`; it is not paired in python_compare_results because
        # PR_CELLS has no test-pandas cell to download artifacts from.
        include:
          - hatch_env: reference
            os: ubuntu-latest
            py: "3.13"
            cloud_provider: aws
          - hatch_env: reference-pandas
            os: ubuntu-latest
            py: "3.13"
            cloud_provider: aws
    runs-on: ${{ matrix.os }}
    name: python_tests_reference (${{ matrix.hatch_env }})
    timeout-minutes: 25
    continue-on-error: true  # Reference tests expected to fail due to behavioral differences
    env:
      MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      - name: Set up Python ${{ matrix.py }}
        run: uv python install ${{ matrix.py }}

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}
        shell: bash

      - name: Install Hatch
        run: *setup_env

      - name: Run reference integration tests
        working-directory: python
        shell: bash
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}:test \
            --json-report --json-report-file=reports/reference-${{ env.MATRIX_KEY }}.json \
            --junitxml=reports/reference-${{ env.MATRIX_KEY }}.xml
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()  # Upload even if tests fail (needed for comparison)
        with:
          name: results-reference-${{ env.MATRIX_KEY }}
          path: python/reports/*-${{ env.MATRIX_KEY }}.*

  # Flaky tests — non-blocking, informational. Runs only tests marked
  # @pytest.mark.flaky (excluded from every other job by the default
  # `-m "not flaky"` in python/pyproject.toml addopts). Failures here do
  # not gate merges and the job is intentionally omitted from python-status.
  python_flaky_tests:
    needs: build_wheels
    if: inputs.run_python
    runs-on: ubuntu-latest
    name: python_flaky_tests (ubuntu-latest, py3.13, aws)
    timeout-minutes: 10
    continue-on-error: true
    env:
      MATRIX_KEY: flaky-ubuntu-latest-3.13-aws
    steps:
      - name: Set UV cache dir
        shell: bash
        run: echo "UV_CACHE_DIR=/tmp/.uv-cache" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      - name: Restore uv cache
        id: uv-cache-flaky
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: /tmp/.uv-cache
          key: uv-ubuntu-latest-3.13-test-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-ubuntu-latest-3.13-test-
            uv-ubuntu-latest-3.13-
            uv-ubuntu-latest-

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: manylinux_x86_64_py3.13
          path: python/dist

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh aws
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
          PARAMETERS_JSON_AWS: ${{ secrets.PARAMETERS_JSON_AWS }}
          PARAMETERS_JSON_GCP: ${{ secrets.PARAMETERS_JSON_GCP }}
          PARAMETERS_JSON_AZURE: ${{ secrets.PARAMETERS_JSON_AZURE }}
        shell: bash

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Install snowflake ud driver from wheel
        working-directory: python
        run: |
          WHEELS=(dist/*.whl)
          if [[ ${#WHEELS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 wheel, found ${#WHEELS[@]}"; ls -la dist/; exit 1
          fi
          export WHEEL_PATH="${WHEELS[0]}"
          echo "Installing wheel: $WHEEL_PATH"
          hatch run test.py3.13:install-wheel

      - name: Run flaky tests
        working-directory: python
        # Exit code 5 means "no tests collected" — expected when no tests are
        # currently marked @pytest.mark.flaky. Treat it as success.
        run: |
          mkdir -p reports
          set +e
          hatch run test.py3.13:flaky \
            --json-report --json-report-file=reports/flaky-${{ env.MATRIX_KEY }}.json \
            --junitxml=reports/flaky-${{ env.MATRIX_KEY }}.xml
          status=$?
          if [[ $status -eq 5 ]]; then
            echo "::notice::No tests marked @pytest.mark.flaky — skipping."
            exit 0
          fi
          exit $status
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json


      - name: Upload test results as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-flaky-${{ env.MATRIX_KEY }}
          path: python/reports/flaky-${{ env.MATRIX_KEY }}.*

      - name: Prune uv cache
        if: always()
        shell: bash
        run: uv cache prune --ci

      - name: Save uv cache
        if: always() && steps.uv-cache-flaky.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v6
        with:
          path: /tmp/.uv-cache
          key: uv-ubuntu-latest-3.13-test-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}

  # Compare results between connectors.
  #
  # Each matrix row pairs a python_tests cell (os, py, cloud_provider, hatch_env)
  # with a python_tests_reference cell (same os, py, cloud_provider, paired
  # ref_hatch_env). Keep these in sync with python_tests_reference above and
  # with PR_CELLS in ci/test_matrix/models/python.py — otherwise the
  # artifact downloads below 404.
  python_compare_results:
    needs: [python_tests, python_tests_reference]
    if: |
      always() &&
      needs.python_tests.result != 'skipped' &&
      needs.python_tests_reference.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        # Each row must mirror a python_tests_reference row that has a
        # matching python_tests PR cell so artifact downloads pair up.
        # Cloud is constrained to aws/gcp — Azure is excluded for
        # reference stability. The macOS comparison row was removed when
        # the macOS PR cell was deferred to merge-queue scope.
        # reference-pandas is omitted here: PR_CELLS has no test-pandas cell.
        include:
          - hatch_env: test
            ref_hatch_env: reference
            os: ubuntu-latest
            py: "3.13"
            cloud_provider: aws
    runs-on: ubuntu-latest
    name: python_compare_results (${{ matrix.hatch_env }})
    env:
      MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}
      REF_MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.ref_hatch_env }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      - name: Download universal test results
        uses: actions/download-artifact@v8
        with:
          name: results-universal-${{ env.MATRIX_KEY }}-${{ matrix.cloud_provider }}
          path: ${{ github.workspace }}/universal-results

      - name: Download reference test results
        uses: actions/download-artifact@v8
        with:
          name: results-reference-${{ env.REF_MATRIX_KEY }}
          path: ${{ github.workspace }}/reference-results

      - name: Install Hatch
        run: *setup_env

      - name: Compare integration test results
        working-directory: python
        shell: bash
        run: |
          hatch run reference:compare \
            --py ${{ matrix.py }} \
            --os ${{ matrix.os }} \
            --universal ${{ github.workspace }}/universal-results/universal-${{ env.MATRIX_KEY }}-${{ matrix.cloud_provider }}.json \
            --reference ${{ github.workspace }}/reference-results/reference-${{ env.REF_MATRIX_KEY }}.json \
            --fail-on-regressions 0 | tee -a $GITHUB_STEP_SUMMARY

  python-status:
    needs: [build_wheels, packaging_tests_wheel, packaging_tests_sdist, load-python-matrix, python_tests, cleanup_python, python_tests_reference, python_compare_results]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Python CI Status ==="

          # Check if critical jobs failed or were cancelled. This must run before the
          # "tests skipped" check below: a failure in an upstream job (e.g. build_wheels)
          # causes GitHub Actions to auto-skip downstream jobs like python_tests, which
          # would otherwise be misread as "no relevant changes detected" and pass.
          # Note: python_tests_reference has continue-on-error:true, so we don't fail on it
          if [[ "${{ needs.build_wheels.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.packaging_tests_wheel.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.packaging_tests_sdist.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.python_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.python_compare_results.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Python CI FAILED or CANCELLED"
            echo "  - build_wheels: ${{ needs.build_wheels.result }}"
            echo "  - packaging_tests_wheel: ${{ needs.packaging_tests_wheel.result }}"
            echo "  - packaging_tests_sdist: ${{ needs.packaging_tests_sdist.result }}"
            echo "  - python_tests: ${{ needs.python_tests.result }}"
            echo "  - python_tests_reference: ${{ needs.python_tests_reference.result }} (continue-on-error)"
            echo "  - python_compare_results: ${{ needs.python_compare_results.result }}"
            exit 1
          fi

          # Check if tests were skipped (only reachable once nothing above failed/cancelled)
          if [[ "${{ needs.python_tests.result }}" == "skipped" ]]; then
            # Driver CI only invokes this workflow for drivers it selected, so a
            # skip here means the gating is broken rather than "nothing to do".
            if [[ "${{ inputs.run_python }}" == "true" ]]; then
              echo "✗ Driver CI requested Python tests but python_tests was SKIPPED — check the job-level if: conditions."
              exit 1
            fi
            echo "✓ Python tests were SKIPPED (run_python was not requested)"
            echo "  - run_python: ${{ inputs.run_python }}"
            exit 0
          fi

          # Tests ran and passed
          echo "✓ Python CI PASSED"
          echo "  - build_wheels: ${{ needs.build_wheels.result }}"
          echo "  - packaging_tests_wheel: ${{ needs.packaging_tests_wheel.result }}"
          echo "  - packaging_tests_sdist: ${{ needs.packaging_tests_sdist.result }}"
          echo "  - python_tests: ${{ needs.python_tests.result }}"
          echo "  - python_tests_reference: ${{ needs.python_tests_reference.result }} (continue-on-error)"
          echo "  - python_compare_results: ${{ needs.python_compare_results.result }}"
          exit 0
