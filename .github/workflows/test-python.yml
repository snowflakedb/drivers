name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs, or fall back to the run ID for main (which is unique, so it won't cancel).
  # Using github.run_id (not github.ref) for the fallback so back-to-back main pushes don't cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHON_REFERENCE_DRIVER_VERSION: "4.3.0"
  # Python version to run reference tests and comparison
  REFERENCE_PYTHON_VERSION: "3.13"
  # OS version for consistent naming across jobs
  REFERENCE_OS_VERSION: "ubuntu-latest"
  REFERENCE_CLOUD_PROVIDER: "aws"

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  # Build sf_core once per platform and share via artifact.
  build_sf_core:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_name: libsf_core.so
          - os: windows-11-arm
            lib_name: sf_core.dll
    runs-on: ${{ matrix.os }}
    name: build_sf_core (${{ matrix.os }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "sf-core-release"

      - name: Capture vcpkg version for cache key
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/actions/vcpkg-version

      - name: Restore vcpkg cache
        if: matrix.os == 'windows-11-arm'
        id: vcpkg-cache-sf-core
        uses: actions/cache/restore@v5
        with:
          path: C:\vcpkg\installed
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL (static) via vcpkg
        if: matrix.os == 'windows-11-arm' && steps.vcpkg-cache-sf-core.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows-static-md

      - name: Save vcpkg cache
        if: matrix.os == 'windows-11-arm' && steps.vcpkg-cache-sf-core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\vcpkg\installed
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Configure ARM64 OpenSSL (static)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows-static-md\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Build sf_core (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --package sf_core --config profile.release.opt-level=2

      - name: Build sf_core (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          cargo build --release --package sf_core --config profile.release.strip=false --config profile.release.opt-level=2

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "sf-core-release"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Upload sf_core library
        uses: actions/upload-artifact@v4
        with:
          name: sf-core-${{ matrix.os }}
          path: target/release/${{ matrix.lib_name }}

  # Build Python wheel with compiled extensions for each OS/Python version.
  # sf_core is pre-built by build_sf_core and downloaded as an artifact.
  # NOTE: All Windows runners in this matrix are ARM64 (windows-11-arm).
  # Steps conditioned on runner.os=='Windows' assume ARM64 semantics.
  # If a non-ARM64 Windows runner is added, review all runner.os=='Windows' steps.
  build_wheel:
    needs: [detect-changes, build_sf_core]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    strategy:
      fail-fast: false
      # Matrix is an explicit `include:` list of (os, py) pairs that are actually consumed
      # downstream: each entry here maps 1-to-1 to a wheel downloaded by either python_tests
      # or python_tests_reference. If you add a new test cell, add a matching build entry.
      #
      # Excluded combinations and why:
      #   - ubuntu × 3.10, 3.11, 3.12 : not exercised by python_tests
      #   - windows-11-arm × 3.9, 3.10, 3.14 : no native ARM64 Windows builds in uv
      #     (revisit 3.14 once https://github.com/astral-sh/uv/releases ships ARM64 builds)
      #   - windows-11-arm × 3.13 : not exercised by python_tests
      matrix:
        include:
          - os: ubuntu-latest
            py: "3.9"
          - os: ubuntu-latest
            py: "3.13"  # Reference combination consumed by python_tests_reference
          - os: ubuntu-latest
            py: "3.14"
          - os: windows-11-arm
            py: "3.11"
          - os: windows-11-arm
            py: "3.12"
    runs-on: ${{ matrix.os }}
    name: build_wheel (${{ matrix.os }}, py${{ matrix.py }})
    env:
      # Configure CMake for ARM64 on Windows ARM64 runners
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.os == 'windows-11-arm' && 'ARM64' || '' }}
      SKIP_CORE_BUILD: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built sf_core
        uses: actions/download-artifact@v4
        with:
          name: sf-core-${{ matrix.os }}
          path: python/src/snowflake/connector/_core

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python ${{ matrix.py }}
        # On ARM64 Windows, uv defaults to x86_64 Python ("support for the native
        # architecture (aarch64) is not yet mature"). This causes Cython extension
        # linking to fail with unresolved Python C API symbols. Request ARM64 Python
        # explicitly as uv suggests: cpython-X.Y-windows-aarch64-none
        run: uv python install ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.py) || matrix.py }}

      - name: Restore proto generator target cache
        id: proto-cache
        uses: actions/cache/restore@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-proto-target-${{ hashFiles('proto_generator/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-proto-target-

      - name: Build python wheel (Linux)
        if: runner.os == 'Linux'
        working-directory: ./python
        run: uv run --python ${{ matrix.py }} --with hatch --with cython --with setuptools --with "virtualenv<21.0.0" hatch build
        env:
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      # cryptography has no pre-built ARM64 Windows wheel, so uv builds it from
      # source via maturin. OpenSSL is needed for this dependency build.

      - name: Capture vcpkg version for cache key (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/actions/vcpkg-version

      # Restore vcpkg OpenSSL: avoids rebuilding from C source (~7 min per run).
      - name: Restore vcpkg ARM64 static OpenSSL cache (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        id: vcpkg-cache-build
        uses: actions/cache/restore@v5
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL (static) via vcpkg
        if: matrix.os == 'windows-11-arm' && steps.vcpkg-cache-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows-static-md

      - name: Save vcpkg ARM64 static OpenSSL cache (Windows ARM64)
        if: matrix.os == 'windows-11-arm' && steps.vcpkg-cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Configure ARM64 OpenSSL (static)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows-static-md\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Build python wheel (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        working-directory: ./python
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          uv run --python ${{ matrix.py }} --with hatch --with cython --with setuptools --with "virtualenv<21.0.0" hatch build
        env:
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}\proto-target

      - name: Inspect wheel (Linux)
        if: runner.os == 'Linux'
        working-directory: ./python
        run: uv run --python ${{ matrix.py }} python -m zipfile -l dist/*.whl

      - name: Inspect wheel (Windows)
        if: runner.os == 'Windows'
        working-directory: ./python
        shell: pwsh
        run: uv run --python ${{ matrix.py }} python -m zipfile -l (Get-ChildItem dist/*.whl).FullName

      - name: Save proto generator target cache
        if: always() && steps.proto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-proto-target-${{ hashFiles('proto_generator/Cargo.lock') }}

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.py }}
          path: python/dist/*.whl

  # Packaging tests - verify sdist can be built and installed from source
  packaging_tests:
    needs: [detect-changes]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "packaging"

      - name: Restore core-target cache
        id: core-target-cache
        uses: actions/cache/restore@v5
        with:
          path: core-target
          key: ${{ runner.os }}-rust-packaging-core-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-packaging-core-target-

      - name: Restore proto-target cache
        id: proto-target-cache-pkg
        uses: actions/cache/restore@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-${{ hashFiles('proto_generator/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-packaging-proto-target-

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Run packaging tests
        working-directory: ./python
        run: hatch run packaging.py3.13:test -v --timeout=900
        env:
          CORE_CARGO_TARGET_DIR: ${{ github.workspace }}/core-target
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      - name: Save Rust cache
        if: always()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "packaging"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save core-target cache
        if: always() && steps.core-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: core-target
          key: ${{ runner.os }}-rust-packaging-core-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Save proto-target cache
        if: always() && steps.proto-target-cache-pkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-${{ hashFiles('proto_generator/Cargo.lock') }}

  # Combined unit + integration tests with universal connector
  python_tests:
    needs: [detect-changes, build_wheel]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: "3.14"
            hatch_env: "test"
            cloud_provider: gcp
          - os: ubuntu-latest
            py: "3.9"
            hatch_env: "test"
            cloud_provider: azure
          - os: ubuntu-latest # Reference combination — keep in sync with REFERENCE_* env vars above
            py: "3.13"
            hatch_env: "test"
            cloud_provider: aws
          - os: windows-11-arm
            py: "3.12"
            hatch_env: "test"
            cloud_provider: aws
          - os: windows-11-arm
            py: "3.11"
            hatch_env: "test"
            cloud_provider: gcp
          - os: windows-11-arm
            py: "3.11"
            hatch_env: "test"
            cloud_provider: azure
          # test integration with Pandas
          - os: ubuntu-latest
            py: "3.9"
            hatch_env: "test-pandas"
            cloud_provider: gcp
          - os: ubuntu-latest # Reference combination for Pandas integration — keep in sync with REFERENCE_* env vars above
            py: "3.13"
            hatch_env: "test-pandas"
            cloud_provider: aws
          - os: ubuntu-latest
            py: "3.14"
            hatch_env: "test-pandas"
            cloud_provider: azure
    runs-on: ${{ matrix.os }}
    name: python_tests ${{ matrix.hatch_env }} (${{ matrix.os }}, py${{ matrix.py }}, ${{ matrix.cloud_provider }})
    env:
      MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ matrix.cloud_provider }}
    steps:
      - name: Set UV cache dir
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "UV_CACHE_DIR=$RUNNER_TEMP/.uv-cache" >> $GITHUB_ENV
          else
            echo "UV_CACHE_DIR=/tmp/.uv-cache" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      # UV cache key intentionally omits matrix.cloud_provider: uv installs the same wheel +
      # dependencies regardless of which cloud provider the E2E tests target, so sharing one
      # cache per (os, py, hatch_env) triple across cloud providers avoids 3x cache duplication
      # and improves hit rates.
      - name: Restore uv cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v5
        with:
          path: /tmp/.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-
            uv-${{ matrix.os }}-${{ matrix.py }}-
            uv-${{ matrix.os }}-

      - name: Restore uv cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-
            uv-${{ matrix.os }}-${{ matrix.py }}-
            uv-${{ matrix.os }}-

      - name: Set up Python ${{ matrix.py }}
        # See comment in build_wheel job — ARM64 Windows needs explicit arch request
        run: uv python install ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.py) || matrix.py }}

      - name: Download Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.py }}
          path: python/dist

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      # cryptography has no pre-built ARM64 Windows wheel, so uv builds it from
      # source via maturin. Use static OpenSSL (arm64-windows-static-md) so the
      # built _rust.pyd embeds OpenSSL rather than depending on DLLs at runtime —
      # the same reason we use static OpenSSL for sf_core in the build_wheel job.

      - name: Capture vcpkg version for cache key (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/actions/vcpkg-version

      # Share the vcpkg cache with build_wheel so OpenSSL is not rebuilt here either.
      - name: Restore vcpkg ARM64 static OpenSSL cache (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        id: vcpkg-cache-test
        uses: actions/cache/restore@v5
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Install ARM64 OpenSSL (static) via vcpkg (for dependency source builds)
        if: matrix.os == 'windows-11-arm' && steps.vcpkg-cache-test.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          vcpkg install openssl:arm64-windows-static-md

      - name: Save vcpkg ARM64 static OpenSSL cache (Windows ARM64)
        if: matrix.os == 'windows-11-arm' && steps.vcpkg-cache-test.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: ${{ matrix.os }}-vcpkg-openssl-static-md-${{ env.VCPKG_VER }}

      - name: Configure ARM64 build environment
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\arm64-windows-static-md\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          echo "RUSTFLAGS=-C linker=rust-lld" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV

      - name: Install Hatch
        run: &setup_env uv tool install hatch --with "virtualenv<21.0.0"

      - name: Install snowflake ud driver from wheel (Linux)
        if: runner.os == 'Linux'
        working-directory: python
        run: hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel

      - name: Install snowflake ud driver from wheel (Windows)
        if: runner.os == 'Windows'
        working-directory: python
        shell: pwsh
        run: |
          # On Windows, the dist/*.whl glob isn't expanded by the shell.
          # Resolve the wheel path explicitly and pass via WHEEL_PATH env var.
          $wheel = (Get-ChildItem dist/*.whl).FullName
          $env:WHEEL_PATH = $wheel
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:install-wheel

      - name: Run tests with coverage (Linux)
        if: runner.os == 'Linux'
        id: run_python_tests_linux
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        working-directory: python
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov \
            --json-report --json-report-file=reports/universal-${{ env.MATRIX_KEY }}.json \
            --junitxml=reports/universal-${{ env.MATRIX_KEY }}.xml \
            --cov-report=xml:reports/coverage-${{ env.MATRIX_KEY }}.xml \
            --cov-report=html:reports/coverage-${{ env.MATRIX_KEY }}-html
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          REFERENCE_DRIVER_VERSION: ${{ env.PYTHON_REFERENCE_DRIVER_VERSION }}

      - name: Rerun failed Python tests (Linux)
        if: steps.run_python_tests_linux.outcome == 'failure' && github.event_name == 'merge_group'
        working-directory: python
        run: hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov --last-failed
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          REFERENCE_DRIVER_VERSION: ${{ env.PYTHON_REFERENCE_DRIVER_VERSION }}

      - name: Run tests with coverage (Windows)
        if: runner.os == 'Windows'
        id: run_python_tests_windows
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        working-directory: python
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports
          hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov `
            --json-report --json-report-file=reports/universal-${{ env.MATRIX_KEY }}.json `
            --junitxml=reports/universal-${{ env.MATRIX_KEY }}.xml `
            --cov-report=xml:reports/coverage-${{ env.MATRIX_KEY }}.xml `
            --cov-report=html:reports/coverage-${{ env.MATRIX_KEY }}-html
        env:
          PARAMETER_PATH: ${{ github.workspace }}\parameters.json
          REFERENCE_DRIVER_VERSION: ${{ env.PYTHON_REFERENCE_DRIVER_VERSION }}

      - name: Rerun failed Python tests (Windows)
        if: steps.run_python_tests_windows.outcome == 'failure' && github.event_name == 'merge_group'
        working-directory: python
        shell: pwsh
        run: hatch run ${{ matrix.hatch_env }}.py${{ matrix.py }}:cov --last-failed
        env:
          PARAMETER_PATH: ${{ github.workspace }}\parameters.json
          REFERENCE_DRIVER_VERSION: ${{ env.PYTHON_REFERENCE_DRIVER_VERSION }}

      - name: Cleanup test PATs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install snowflake-connector-python -q
          python scripts/cleanup_test_pats.py \
            --parameter-path "${{ github.workspace }}/parameters.json"

      - name: Upload test results as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-universal-${{ env.MATRIX_KEY }}
          path: python/reports/*-${{ env.MATRIX_KEY }}.*

      # Prune unreachable entries (stale wheels, orphan metadata, old builds) before the cache
      # save. Typically trims 30-50% of the cache, which directly reduces the post-job save time
      # — particularly noticeable on Windows where tar/compression of many small files is slow.
      # Python interpreters live in a separate uv "data" dir, not UV_CACHE_DIR, so pruning does
      # not affect interpreter caching.
      - name: Prune uv cache
        if: always()
        shell: bash
        run: uv cache prune --ci

      - name: Save uv cache (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/cache/save@v5
        with:
          path: /tmp/.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}

      - name: Save uv cache (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}

  # Integration tests only with reference connector (for comparison)
  python_tests_reference:
    needs: [detect-changes, build_wheel]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    strategy:
      fail-fast: false
      matrix:
        hatch_env: ["reference", "reference-pandas"]
    runs-on: ubuntu-latest
    name: python_tests_reference (${{ matrix.hatch_env }})
    continue-on-error: true  # Reference tests expected to fail due to behavioral differences
    steps:
      - name: Set matrix key
        run: echo "MATRIX_KEY=${{ env.REFERENCE_OS_VERSION }}-${{ env.REFERENCE_PYTHON_VERSION }}-${{ matrix.hatch_env }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/.uv-cache
          # Key uses REFERENCE_OS_VERSION (= "ubuntu-latest") to match the matrix.os-based
          # key written by python_tests, enabling cross-job cache sharing.
          key: uv-${{ env.MATRIX_KEY }}-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-${{ env.MATRIX_KEY }}-
            uv-${{ env.REFERENCE_OS_VERSION }}-${{ env.REFERENCE_PYTHON_VERSION }}-
            uv-${{ env.REFERENCE_OS_VERSION }}-
        env:
          UV_CACHE_DIR: /tmp/.uv-cache

      - name: Set up Python ${{ env.REFERENCE_PYTHON_VERSION }}
        run: uv python install ${{ env.REFERENCE_PYTHON_VERSION }}

      - name: Download Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-${{ env.REFERENCE_OS_VERSION }}-${{ env.REFERENCE_PYTHON_VERSION }}
          path: python/dist

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ env.REFERENCE_CLOUD_PROVIDER }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}

      - name: Install Hatch
        run: *setup_env

      - name: Run reference integration tests
        working-directory: python
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}:test \
            --json-report --json-report-file=reports/reference-${{ env.MATRIX_KEY }}.json \
            --junitxml=reports/reference-${{ env.MATRIX_KEY }}.xml
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail (needed for comparison)
        with:
          name: results-reference-${{ env.MATRIX_KEY }}
          path: python/reports/*-${{ env.MATRIX_KEY }}.*

  # Compare results between connectors
  python_compare_results:
    needs: [detect-changes, python_tests, python_tests_reference]
    if: |
      always() &&
      needs.python_tests.result != 'skipped' &&
      needs.python_tests_reference.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        include:
          - hatch_env: "test"
            ref_hatch_env: "reference"
          - hatch_env: "test-pandas"
            ref_hatch_env: "reference-pandas"
    runs-on: ubuntu-latest
    name: python_compare_results (${{ matrix.hatch_env }})
    steps:
      - name: Set matrix keys
        run: |
          echo "MATRIX_KEY=${{ env.REFERENCE_OS_VERSION }}-${{ env.REFERENCE_PYTHON_VERSION }}-${{ matrix.hatch_env }}" >> $GITHUB_ENV
          echo "REF_MATRIX_KEY=${{ env.REFERENCE_OS_VERSION }}-${{ env.REFERENCE_PYTHON_VERSION }}-${{ matrix.ref_hatch_env }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Download universal test results
        uses: actions/download-artifact@v4
        with:
          name: results-universal-${{ env.MATRIX_KEY }}-${{ env.REFERENCE_CLOUD_PROVIDER }}
          path: ${{ github.workspace }}/universal-results

      - name: Download reference test results
        uses: actions/download-artifact@v4
        with:
          name: results-reference-${{ env.REF_MATRIX_KEY }}
          path: ${{ github.workspace }}/reference-results

      - name: Install Hatch
        run: *setup_env

      - name: Compare integration test results
        working-directory: python
        shell: bash
        run: |
          hatch run reference:compare \
            --py ${{ env.REFERENCE_PYTHON_VERSION }} \
            --os ${{ env.REFERENCE_OS_VERSION }} \
            --universal ${{ github.workspace }}/universal-results/universal-${{ env.MATRIX_KEY }}-${{ env.REFERENCE_CLOUD_PROVIDER }}.json \
            --reference ${{ github.workspace }}/reference-results/reference-${{ env.REF_MATRIX_KEY }}.json \
            --fail-on-regressions 0 | tee -a $GITHUB_STEP_SUMMARY

  python-status:
    needs: [detect-changes, build_sf_core, build_wheel, packaging_tests, python_tests, python_tests_reference, python_compare_results]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Python CI Status ==="

          # Check if tests were skipped
          if [[ "${{ needs.python_tests.result }}" == "skipped" ]]; then
            echo "✓ Python tests were SKIPPED (no relevant changes detected)"
            echo "  - run_python: ${{ needs.detect-changes.outputs.run_python }}"
            exit 0
          fi

          # Check if critical jobs failed or were cancelled
          # Note: python_tests_reference has continue-on-error:true, so we don't fail on it
          if [[ "${{ needs.build_sf_core.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.build_wheel.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.packaging_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.python_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.python_compare_results.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Python CI FAILED or CANCELLED"
            echo "  - build_sf_core: ${{ needs.build_sf_core.result }}"
            echo "  - build_wheel: ${{ needs.build_wheel.result }}"
            echo "  - packaging_tests: ${{ needs.packaging_tests.result }}"
            echo "  - python_tests: ${{ needs.python_tests.result }}"
            echo "  - python_tests_reference: ${{ needs.python_tests_reference.result }} (continue-on-error)"
            echo "  - python_compare_results: ${{ needs.python_compare_results.result }}"
            exit 1
          fi

          # Tests ran and passed
          echo "✓ Python CI PASSED"
          echo "  - build_sf_core: ${{ needs.build_sf_core.result }}"
          echo "  - build_wheel: ${{ needs.build_wheel.result }}"
          echo "  - packaging_tests: ${{ needs.packaging_tests.result }}"
          echo "  - python_tests: ${{ needs.python_tests.result }}"
          echo "  - python_tests_reference: ${{ needs.python_tests_reference.result }} (continue-on-error)"
          echo "  - python_compare_results: ${{ needs.python_compare_results.result }}"
          exit 0
