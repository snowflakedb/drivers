name: Python CI

on:
  pull_request:
    # `labeled` is included so applying ci:scope-merge / ci:scope-nightly to
    # a PR re-runs the workflow at the upgraded scope without needing a new
    # commit. Unrelated labels are filtered by the `scope-label-gate` job
    # below; concurrency keeps in-flight runs alive for those.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [ checks_requested ]

concurrency:
  # Group by PR number for PRs; fall back to run ID for merge_group runs
  # (each run is unique so they won't cancel each other).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Don't cancel an in-flight run when an unrelated label is added/removed —
  # only scope-up labels (ci:scope-merge, ci:scope-nightly) and normal
  # push/synchronize/reopen events should replace the running matrix.
  cancel-in-progress: ${{ github.event.action != 'labeled' || contains(fromJSON('["ci:scope-merge","ci:scope-nightly"]'), github.event.label.name) }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Filter out PR runs triggered solely by adding an unrelated label
  # (e.g. auto-labeler bot tagging `python` or `shared`). The `if:`
  # evaluates to false on those events, this job is skipped, and every
  # downstream job that `needs:` it is skipped too. Scope-up labels
  # (ci:scope-merge, ci:scope-nightly) pass through and re-run the
  # workflow at the upgraded scope.
  scope-label-gate:
    if: |
      github.event.action != 'labeled' ||
      contains(fromJSON('["ci:scope-merge","ci:scope-nightly"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  detect-changes:
    needs: scope-label-gate
    uses: ./.github/workflows/detect-changes.yml

  load-python-matrix:
    needs: scope-label-gate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build-targets: ${{ steps.targets.outputs.targets }}
      # Split outputs feed two parallel python_checks calls so native rows
      # (which self-build sf_core + cibuildwheel inline) don't have to wait
      # for build_wheels to produce cross-compile / sdist artifacts.
      matrix-native: ${{ steps.split.outputs.matrix-native }}
      matrix-artifact: ${{ steps.split.outputs.matrix-artifact }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python ci/test_matrix/generate_matrix.py \
            --driver python --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --emit-active \
            >> "$GITHUB_OUTPUT"
      - id: targets
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python ci/test_matrix/generate_matrix.py \
            --driver python --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --emit-build-targets \
            >> "$GITHUB_OUTPUT"
      - id: split
        # native    = wheel_artifact set AND cross_compile not set/false
        #             (macos arm/x64, windows x64) — inline cargo+cibuildwheel
        # artifact  = cross_compile=true OR no wheel_artifact (sdist py3.10)
        #             — needs build_wheels artifacts
        env:
          MATRIX_JSON: ${{ steps.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          NATIVE=$(printf '%s' "$MATRIX_JSON" | jq -c '[.[] | select(.wheel_artifact != null and (.cross_compile // false) == false)]')
          ARTIFACT=$(printf '%s' "$MATRIX_JSON" | jq -c '[.[] | select((.cross_compile // false) == true or .wheel_artifact == null)]')
          echo "matrix-native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "matrix-artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

  # ── Build all wheels via shared reusable workflow ────────────────────
  build_wheels:
    needs: [detect-changes, load-python-matrix]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    uses: ./.github/workflows/_build-python-wheels.yml
    with:
      targets: ${{ needs.load-python-matrix.outputs.build-targets }}

  # Packaging tests - verify sdist can be built and installed from source
  packaging_tests:
    needs: [detect-changes]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: rust-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "packaging"

      - name: Restore core-target cache
        id: core-target-cache
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: core-target
          key: ${{ runner.os }}-rust-packaging-core-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-packaging-core-target-

      - name: Restore proto-target cache
        id: proto-target-cache-pkg
        # Cache restore failures never fail the job — fall back to clean build.
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-${{ hashFiles('proto_generator/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-packaging-proto-target-

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Mock parameters.json
        run: echo '{"testconnection":{}}' > parameters.json

      - name: Run packaging tests
        working-directory: ./python
        run: hatch run packaging.py3.13:test -v --timeout=900
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json
          CORE_CARGO_TARGET_DIR: ${{ github.workspace }}/core-target
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/proto-target

      - name: Save Rust cache
        if: always()
        # timeout-minutes is enforced here because it isn't supported on
        # composite action steps. Bounds slim + registry save + target save.
        timeout-minutes: 20
        # Cache failures (incl. timeout-induced cancellation) never fail the job.
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          shared-key: "packaging"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}

      - name: Save core-target cache
        if: always() && steps.core-target-cache.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v5
        with:
          path: core-target
          key: ${{ runner.os }}-rust-packaging-core-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Save proto-target cache
        if: always() && steps.proto-target-cache-pkg.outputs.cache-hit != 'true'
        # Cache save is best-effort — see cargo-cache action for rationale.
        # timeout-minutes + ZSTD_NBTHREADS guard against tar+zstdmt hangs.
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v5
        with:
          path: proto-target
          key: ${{ runner.os }}-rust-packaging-proto-target-${{ hashFiles('proto_generator/Cargo.lock') }}

  # ── Combined unit + integration tests with universal connector ──
  # Split into two parallel callers of the _python-checks.yml reusable
  # workflow so native rows (which build sf_core + cibuildwheel inline on
  # the test runner) don't have to wait for build_wheels to finish — they
  # depend only on detect-changes + load-python-matrix. Artifact rows
  # (cross-compile lanes + py3.10 sdist) still need build_wheels for the
  # wheel / sdist they download, so they retain that dependency.
  python_checks_native:
    needs: [detect-changes, load-python-matrix]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    uses: ./.github/workflows/_python-checks.yml
    with:
      matrix-json: ${{ needs.load-python-matrix.outputs.matrix-native }}
    secrets: inherit

  python_checks:
    needs: [detect-changes, build_wheels, load-python-matrix]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    uses: ./.github/workflows/_python-checks.yml
    with:
      matrix-json: ${{ needs.load-python-matrix.outputs.matrix-artifact }}
    secrets: inherit

  cleanup_python:
    needs: [detect-changes, python_checks, python_checks_native]
    if: always() && (needs.python_checks.result != 'skipped' || needs.python_checks_native.result != 'skipped')
    strategy:
      fail-fast: false
      matrix:
        cloud_provider: [aws, gcp, azure]
    runs-on: ubuntu-latest
    name: cleanup_python (${{ matrix.cloud_provider }})
    steps:
      - uses: actions/checkout@v4

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Cleanup test PATs
        continue-on-error: true
        run: |
          python -m pip install snowflake-connector-python -q
          python scripts/cleanup_env.py \
            --parameter-path "${{ github.workspace }}/parameters.json"

  # Integration tests only with reference connector (for comparison).
  #
  # Each variant's (os, py, cloud_provider) must match a cell that
  # python_checks emits at PR scope so python_compare_results can pair
  # the reference and universal artifacts. See ci/test_matrix/models/python.py
  # PR_CELLS. Reference hatch envs install snowflake-connector-python from
  # PyPI (python/pyproject.toml reference / reference-pandas) and inherit
  # skip-install=true, so no universal wheel download is needed.
  python_tests_reference:
    needs: [detect-changes, build_wheels]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python_reference == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Reference tests must NOT run on Azure: snowflake-connector-python
        # against an Azure deployment is flaky here and destabilises every
        # PR. Pick PR_CELLS rows whose Cloud is aws/gcp. Each row below
        # must also exactly match an entry in ci/test_matrix/models/python.py
        # PR_CELLS (same os/py/cloud_provider/hatch_env) so the artifact
        # downloads in python_compare_results line up with python_checks.
        # macOS reference comparison was removed when the macOS PR cell
        # was deferred to merge-queue scope (limited macOS runner
        # availability). Pandas reference coverage runs only on Ubuntu now.
        include:
          - hatch_env: reference
            os: ubuntu-latest
            py: "3.13"
            cloud_provider: aws
    runs-on: ${{ matrix.os }}
    name: python_tests_reference (${{ matrix.hatch_env }})
    continue-on-error: true  # Reference tests expected to fail due to behavioral differences
    env:
      MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Set up Python ${{ matrix.py }}
        run: uv python install ${{ matrix.py }}

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh ${{ matrix.cloud_provider }}
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Run reference integration tests
        working-directory: python
        shell: bash
        run: |
          mkdir -p reports
          hatch run ${{ matrix.hatch_env }}:test \
            --json-report --json-report-file=reports/reference-${{ env.MATRIX_KEY }}.json \
            --junitxml=reports/reference-${{ env.MATRIX_KEY }}.xml
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail (needed for comparison)
        with:
          name: results-reference-${{ env.MATRIX_KEY }}
          path: python/reports/*-${{ env.MATRIX_KEY }}.*

  # Flaky tests — non-blocking, informational. Runs only tests marked
  # @pytest.mark.flaky (excluded from every other job by the default
  # `-m "not flaky"` in python/pyproject.toml addopts). Failures here do
  # not gate merges and the job is intentionally omitted from python-status.
  python_flaky_tests:
    needs: [detect-changes, build_wheels]
    if: github.event_name == 'push' || needs.detect-changes.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    name: python_flaky_tests (ubuntu-latest, py3.13, aws)
    continue-on-error: true
    env:
      MATRIX_KEY: flaky-ubuntu-latest-3.13-aws
    steps:
      - name: Set UV cache dir
        shell: bash
        run: echo "UV_CACHE_DIR=/tmp/.uv-cache" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Restore uv cache
        id: uv-cache-flaky
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/.uv-cache
          key: uv-ubuntu-latest-3.13-test-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}
          restore-keys: |
            uv-ubuntu-latest-3.13-test-
            uv-ubuntu-latest-3.13-
            uv-ubuntu-latest-

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: manylinux_x86_64_py3.13
          path: python/dist

      - name: Decode secrets
        run: ./scripts/decode_secrets.sh aws
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        shell: bash

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Install snowflake ud driver from wheel
        working-directory: python
        run: |
          WHEELS=(dist/*.whl)
          if [[ ${#WHEELS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 wheel, found ${#WHEELS[@]}"; ls -la dist/; exit 1
          fi
          export WHEEL_PATH="${WHEELS[0]}"
          echo "Installing wheel: $WHEEL_PATH"
          hatch run test.py3.13:install-wheel

      - name: Run flaky tests
        working-directory: python
        # Exit code 5 means "no tests collected" — expected when no tests are
        # currently marked @pytest.mark.flaky. Treat it as success.
        run: |
          mkdir -p reports
          set +e
          hatch run test.py3.13:flaky \
            --json-report --json-report-file=reports/flaky-${{ env.MATRIX_KEY }}.json \
            --junitxml=reports/flaky-${{ env.MATRIX_KEY }}.xml
          status=$?
          if [[ $status -eq 5 ]]; then
            echo "::notice::No tests marked @pytest.mark.flaky — skipping."
            exit 0
          fi
          exit $status
        env:
          PARAMETER_PATH: ${{ github.workspace }}/parameters.json


      - name: Upload test results as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-flaky-${{ env.MATRIX_KEY }}
          path: python/reports/flaky-${{ env.MATRIX_KEY }}.*

      - name: Prune uv cache
        if: always()
        shell: bash
        run: uv cache prune --ci

      - name: Save uv cache
        if: always() && steps.uv-cache-flaky.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ZSTD_NBTHREADS: '2'
        uses: actions/cache/save@v5
        with:
          path: /tmp/.uv-cache
          key: uv-ubuntu-latest-3.13-test-${{ hashFiles('python/uv.lock', 'python/pyproject.toml') }}

  # Compare results between connectors.
  #
  # Each matrix row pairs a python_checks cell (os, py, cloud_provider, hatch_env)
  # with a python_tests_reference cell (same os, py, cloud_provider, paired
  # ref_hatch_env). Keep these in sync with python_tests_reference above and
  # with PR_CELLS in ci/test_matrix/models/python.py — otherwise the
  # artifact downloads below 404.
  python_compare_results:
    needs: [detect-changes, python_checks, python_checks_native, python_tests_reference]
    if: |
      always() &&
      (needs.python_checks.result != 'skipped' || needs.python_checks_native.result != 'skipped') &&
      needs.python_tests_reference.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        # Each row must mirror a python_tests_reference row's
        # (os, py, cloud_provider) so artifact downloads pair up; keep this
        # block in sync with the matrix above. Cloud is constrained to
        # aws/gcp — Azure is excluded for reference stability. The macOS
        # comparison row was removed when the macOS PR cell was deferred
        # to merge-queue scope; pandas reference coverage now runs only
        # on Ubuntu.
        include:
          - hatch_env: test
            ref_hatch_env: reference
            os: ubuntu-latest
            py: "3.13"
            cloud_provider: aws
    runs-on: ubuntu-latest
    name: python_compare_results (${{ matrix.hatch_env }})
    env:
      MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.hatch_env }}
      REF_MATRIX_KEY: ${{ matrix.os }}-${{ matrix.py }}-${{ matrix.ref_hatch_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          version: "0.9.28"

      - name: Download universal test results
        uses: actions/download-artifact@v4
        with:
          name: results-universal-${{ env.MATRIX_KEY }}-${{ matrix.cloud_provider }}
          path: ${{ github.workspace }}/universal-results

      - name: Download reference test results
        uses: actions/download-artifact@v4
        with:
          name: results-reference-${{ env.REF_MATRIX_KEY }}
          path: ${{ github.workspace }}/reference-results

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Compare integration test results
        working-directory: python
        shell: bash
        run: |
          hatch run reference:compare \
            --py ${{ matrix.py }} \
            --os ${{ matrix.os }} \
            --universal ${{ github.workspace }}/universal-results/universal-${{ env.MATRIX_KEY }}-${{ matrix.cloud_provider }}.json \
            --reference ${{ github.workspace }}/reference-results/reference-${{ env.REF_MATRIX_KEY }}.json \
            --fail-on-regressions 0 | tee -a $GITHUB_STEP_SUMMARY

  python-status:
    needs: [detect-changes, build_wheels, packaging_tests, load-python-matrix, python_checks, python_checks_native, cleanup_python, python_tests_reference, python_compare_results]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "=== Python CI Status ==="

          # Check if tests were skipped (both python_checks legs skipped means
          # detect-changes filtered Python out entirely)
          if [[ "${{ needs.python_checks.result }}" == "skipped" && "${{ needs.python_checks_native.result }}" == "skipped" ]]; then
            echo "✓ Python tests were SKIPPED (no relevant changes detected)"
            echo "  - run_python: ${{ needs.detect-changes.outputs.run_python }}"
            exit 0
          fi

          # Check if critical jobs failed or were cancelled
          # Note: python_tests_reference has continue-on-error:true, so we don't fail on it
          if [[ "${{ needs.build_wheels.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.packaging_tests.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.python_checks.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.python_checks_native.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.python_compare_results.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "✗ Python CI FAILED or CANCELLED"
            echo "  - build_wheels: ${{ needs.build_wheels.result }}"
            echo "  - packaging_tests: ${{ needs.packaging_tests.result }}"
            echo "  - python_checks: ${{ needs.python_checks.result }}"
            echo "  - python_checks_native: ${{ needs.python_checks_native.result }}"
            echo "  - python_tests_reference: ${{ needs.python_tests_reference.result }} (continue-on-error)"
            echo "  - python_compare_results: ${{ needs.python_compare_results.result }}"
            exit 1
          fi

          # Tests ran and passed
          echo "✓ Python CI PASSED"
          echo "  - build_wheels: ${{ needs.build_wheels.result }}"
          echo "  - packaging_tests: ${{ needs.packaging_tests.result }}"
          echo "  - python_checks: ${{ needs.python_checks.result }}"
          echo "  - python_checks_native: ${{ needs.python_checks_native.result }}"
          echo "  - python_tests_reference: ${{ needs.python_tests_reference.result }} (continue-on-error)"
          echo "  - python_compare_results: ${{ needs.python_compare_results.result }}"
          exit 0
