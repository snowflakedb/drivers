name: Mirror - Python unit tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    # Mirror-only: the internal repo runs full CI via test-python.yml.
    if: github.repository_owner == 'snowflakedb'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Hatch
        run: uv tool install hatch --with "virtualenv<21.0.0"

      - name: Restore Rust cache
        id: rust-cache
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: restore
          shared-key: "mirror-python-unit"

      - name: Run Python unit tests
        working-directory: ./python
        run: hatch run dev.py3.13:unit
        env:
          # Build the Rust core (.so) so IS_UNIVERSAL_DRIVER=True and unit
          # tests are not skipped. hatch_build.py honours CORE/PROTO_CARGO_TARGET_DIR
          # to write into a stable path that the cargo-cache action picks up.
          SKIP_CORE_BUILD: "0"
          CORE_CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PROTO_CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Save Rust cache
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          slim-mode: aggressive
          shared-key: "mirror-python-unit"
          registry-cache-hit: ${{ steps.rust-cache.outputs.registry-cache-hit }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}
