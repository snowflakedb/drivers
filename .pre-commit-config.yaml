repos:
-   repo: local
    hooks:
    -   id: rust-linting
        name: Rust formatting
        description: Run cargo fmt on files included in the commit. rustfmt should be installed before-hand.
        entry: cargo fmt --all
        pass_filenames: false
        types: [file, rust]
        language: system
    -   id: rust-clippy
        name: Rust clippy
        description: Run cargo clippy on files included in the commit. clippy should be installed before-hand.
        entry: env OPENSSL_NO_VENDOR=1 cargo clippy --locked --all-targets --all-features -- -Dclippy::all
        pass_filenames: false
        types: [file, rust]
        language: system
    -   id: rust-cargo-check
        name: Rust cargo check
        description: Run cargo check on files included in the commit. cargo check should be installed before-hand.
        entry: env OPENSSL_NO_VENDOR=1 cargo check --locked --all-targets --all-features
        pass_filenames: false
        types: [file, rust]
        language: system
    -   id: rust-version-alignment
        name: rust-version / toolchain alignment
        description: Ensure [workspace.package] rust-version matches rust-toolchain.toml (major.minor).
        entry: bash scripts/check-rust-version-alignment.sh
        pass_filenames: false
        files: (rust-toolchain\.toml$|Cargo\.toml$)
        language: system
    -   id: clang-format
        name: clang-format
        description: Run clang-format on C/C++ files included in the commit. clang-format should be installed before-hand.
        entry: clang-format -i
        pass_filenames: true
        types_or: [c, c++]
        # to avoid huge diffs in case we need to upgrade nanoarrow
        exclude: ^python/src/snowflake/connector/_internal/nanoarrow_cpp/
        language: system
    -   id: generate-connection-config
        name: Generate ConnectionConfig from Rust PARAM_DEFS
        description: Regenerate connection_config.py when the sf_params_spec registry or the generator changes
        # ``-p sf_params_codegen`` pins the workspace package so this still works
        # unambiguously when other crates expose a ``param_defs_export`` bin.
        # ``set -euo pipefail`` makes any cargo / hatch failure stop the hook
        # immediately, and we deliberately let stderr through so generator or
        # formatter errors are visible in the pre-commit log.
        entry: bash -c 'set -euo pipefail; cargo run --locked -p sf_params_codegen --bin param_defs_export > python/src/snowflake/connector/connection_config.py && (cd python && hatch run precommit:fix src/snowflake/connector/connection_config.py) && git add python/src/snowflake/connector/connection_config.py'
        pass_filenames: false
        # Any Rust source in either crate, so a future module split of
        # sf_params_spec/src/lib.rs doesn't silently stop triggering the hook.
        files: ^(sf_params_spec|sf_params_codegen)/src/.*\.rs$
        language: system
    -   id: generate-python-stubs
        name: Generate sf_core_python.pyi from Rust source
        description: Regenerate type stubs when python_bridge/src/lib.rs changes
        entry: bash -c 'set -euo pipefail; cargo run --locked -p python_stub_gen -- python/src/snowflake/connector/_core && git add python/src/snowflake/connector/_core/sf_core_python.pyi'
        pass_filenames: false
        files: ^python_bridge/src/lib\.rs$
        language: system
    -   id: python-checks
        name: Python code checks (ruff + mypy)
        description: Run linting, formatting, and type checks on changed Python files
        entry: bash -c 'cd python && hatch run precommit:check'
        pass_filenames: false
        files: ^python/.*\.py$
        language: system
    -   id: uv-lock-update
        name: Update uv.lock
        description: Updates uv.lock file
        entry: bash -c 'cd python && uv lock'
        pass_filenames: false
        files: ^python/(pyproject\.toml|uv\.lock)$
        language: system
    -   id: no-snowflake-namespace-init
        name: No __init__.py in snowflake namespace package
        description: >
          snowflake is a PEP 420 namespace package shared across multiple
          distributions. An __init__.py in python/src/snowflake/ would
          break other snowflake.* packages installed in the same environment.
        entry: 'python/src/snowflake/__init__\.py'
        language: fail
        files: ^python/src/snowflake/__init__\.py$
    -   id: python-no-assert-in-production
        name: No assert statements in production code
        description: Ensure no assert statements are used in python/src (production code only)
        entry: '^\s*assert\s'
        language: pygrep
        files: ^python/src/.*\.py$
    -   id: jdbc-spotless-check
        name: JDBC Spotless check
        description: Run Spotless checks for the JDBC module.
        entry: bash -c 'cd jdbc && bash ./gradlew spotlessCheck'
        pass_filenames: false
        files: ^jdbc/
        language: system
    -   id: jdbc-checkstyle
        name: JDBC Checkstyle
        description: Run Checkstyle on JDBC main and test sources.
        entry: bash -c 'cd jdbc && bash ./gradlew checkstyleMain checkstyleTest'
        pass_filenames: false
        files: ^jdbc/
        language: system
    -   id: nodejs-code-format
        name: Node.js code formatting & linting
        description: Auto-format with oxfmt and lint with oxlint
        entry: bash -c 'cd nodejs && npm run fmt:fix && npm run lint:check'
        pass_filenames: false
        files: ^nodejs/
        language: system
    -   id: behavior-differences-validator
        name: Behavioral Differences format check
        description: Validate BehaviorDifferences.yaml schema (status, type, impact, is_breaking_change)
        entry: python3 scripts/validate_behavior_differences.py
        pass_filenames: false
        additional_dependencies: ['pyyaml']
        files: ^(odbc_tests|python|jdbc|nodejs)/BehaviorDifferences\.yaml$
        language: python
    -   id: tests-format-validator
        name: Tests format validator
        description: Validate that test implementations match Gherkin feature scenarios
        entry: ./tests/tests_format_validator/run_validator.sh
        pass_filenames: false
        language: system
    -   id: ai-rules-sync
        name: AI rules sync check
        description: >
          Two checks: (1) verify .cursor/rules/*.mdc body matches .claude/rules/*.md
          canonical source (alwaysApply rules need full content in both — pointer files
          place the body in tool-call history where context compaction can drop it);
          (2) verify every .claude/skills/*/SKILL.md has a matching .cursor/skills/
          pointer so Cursor users can invoke the skill. Edit .claude/ first for rules,
          then copy the body to .cursor/rules/. Run scripts/check-ai-rules-sync.sh to fix.
        entry: bash scripts/check-ai-rules-sync.sh
        pass_filenames: false
        files: (\.claude/rules/|\.cursor/rules/|\.claude/skills/|\.cursor/skills/)
        language: system
    -   id: sf-ai-skills-check
        name: Validate Claude skills
        entry: .pre-commit-scripts/sf-ai-skills-check.sh
        language: script
        pass_filenames: false
        files: '^.*\.claude/.*'
    -   id: sf-ai-skills-bridge
        name: Create .agents/skills/ symlink bridges from .claude/skills/
        entry: .pre-commit-scripts/sf-ai-skills-bridge.sh
        language: script
        pass_filenames: false
        files: '(^|/)(\.claude|\.agents)/skills/'
