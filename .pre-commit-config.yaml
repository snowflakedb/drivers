repos:
-   repo: local
    hooks:
    -   id: rust-linting
        name: Rust formatting
        description: Run cargo fmt on files included in the commit. rustfmt should be installed before-hand.
        entry: cargo fmt --all
        pass_filenames: false
        types: [file, rust]
        language: system
    -   id: rust-clippy
        name: Rust clippy
        description: Run cargo clippy on files included in the commit. clippy should be installed before-hand.
        entry: env OPENSSL_NO_VENDOR=1 cargo clippy --locked --all-targets --all-features -- -Dclippy::all
        pass_filenames: false
        types: [file, rust]
        language: system
    -   id: rust-cargo-check
        name: Rust cargo check
        description: Run cargo check on files included in the commit. cargo check should be installed before-hand.
        entry: env OPENSSL_NO_VENDOR=1 cargo check --locked --all-targets --all-features
        pass_filenames: false
        types: [file, rust]
        language: system
    -   id: rust-version-alignment
        name: rust-version / toolchain alignment
        description: Ensure [workspace.package] rust-version matches rust-toolchain.toml (major.minor).
        entry: bash scripts/check-rust-version-alignment.sh
        pass_filenames: false
        files: (rust-toolchain\.toml$|Cargo\.toml$)
        language: system
    -   id: python-sdist-cargo-lock
        name: Python sdist Cargo.lock is --locked
        description: >
          Fail if python/Cargo.lock.sdist is stale for Cargo.toml.sdist.
          hatch_build.py installs sdists with cargo --locked; a stale sdist
          lockfile breaks packaging_tests_sdist and python_tests on every
          platform. Refresh with scripts/python-sdist-cargo-lock.sh refresh.
        entry: bash scripts/python-sdist-cargo-lock.sh
        pass_filenames: false
        files: ^(Cargo\.lock|python/Cargo\.lock\.sdist|python/Cargo\.toml\.sdist|(sf_core|python_bridge|sf_params_spec|proto_utils|error_trace|error_trace_derive|proto_generator)/Cargo\.toml)$
        language: system
    -   id: core-perf-cargo-lock
        name: Core perf-driver Cargo.lock is --locked
        description: >
          Fail if tests/performance/drivers/core/app/Cargo.lock is stale for the
          isolated core-perf-driver workspace. The Core perf Dockerfile builds
          that crate with cargo --locked; a stale lockfile fails the
          drivers-performance-pr-check job on main. Refresh with
          scripts/check-core-perf-cargo-lock.sh refresh. Check mode succeeds
          when that workspace is not in the tree.
        entry: bash scripts/check-core-perf-cargo-lock.sh
        pass_filenames: false
        files: ^(tests/performance/drivers/core/app/Cargo\.(toml|lock)|(sf_core|sf_params_spec|proto_utils|error_trace|error_trace_derive|proto_generator)/Cargo\.toml|sf_core/tests/common/arrow_deserialize_macro/Cargo\.toml)$
        language: system
    -   id: clang-format
        name: clang-format
        description: Run clang-format on C/C++ files included in the commit. clang-format should be installed before-hand.
        entry: clang-format -i
        pass_filenames: true
        types_or: [c, c++]
        # Vendored nanoarrow, cbindgen output (regenerated by
        # generate-xp-providers-header; clang-format would fight that generator),
        # and Arctic Owl `*-test/` samples (regenerated by `sf ai rules test generate`).
        exclude: ^(python/src/snowflake/connector/_internal/nanoarrow_cpp/|sf_core/include/sf_core_providers\.h$|\.ai/review/.+-test/)
        language: system
    -   id: generate-xp-providers-header
        name: Generate sf_core_providers.h from the XP FFI adapter
        description: >
          Regenerate the committed C header when the FFI adapter, cbindgen
          config, or generator script changes. cbindgen 0.29+ must be on PATH
          (cargo install cbindgen --version '^0.29' --locked).
        entry: bash -c 'set -euo pipefail; scripts/generate_providers_header.sh && git add sf_core/include/sf_core_providers.h'
        pass_filenames: false
        files: ^(sf_core/src/xp_backend/ffi\.rs|sf_core/cbindgen-xp-providers\.toml|sf_core/include/sf_core_providers\.h|scripts/generate_providers_header\.sh)$
        language: system
    -   id: generate-connection-config
        name: Generate ConnectionConfig from Rust PARAM_DEFS
        description: Regenerate connection_config.py when the sf_params_spec registry or the generator changes
        # ``-p sf_params_codegen`` pins the workspace package so this still works
        # unambiguously when other crates expose a ``param_defs_export`` bin.
        # ``set -euo pipefail`` makes any cargo / hatch failure stop the hook
        # immediately, and we deliberately let stderr through so generator or
        # formatter errors are visible in the pre-commit log.
        entry: bash -c 'set -euo pipefail; cargo run --locked -p sf_params_codegen --bin param_defs_export > python/src/snowflake/connector/connection_config.py && (cd python && hatch run precommit:fix src/snowflake/connector/connection_config.py) && git add python/src/snowflake/connector/connection_config.py'
        pass_filenames: false
        # Any Rust source in either crate, so a future module split of
        # sf_params_spec/src/lib.rs doesn't silently stop triggering the hook.
        files: ^(sf_params_spec|sf_params_codegen)/src/.*\.rs$
        language: system
    -   id: generate-python-stubs
        name: Generate sf_core_python.pyi from Rust source
        description: Regenerate type stubs when python_bridge/src/lib.rs changes
        entry: bash -c 'set -euo pipefail; cargo run --locked -p python_stub_gen -- python/src/snowflake/connector/_core && git add python/src/snowflake/connector/_core/sf_core_python.pyi'
        pass_filenames: false
        files: ^python_bridge/src/lib\.rs$
        language: system
    -   id: python-checks
        name: Python code checks (ruff + mypy)
        description: Run linting, formatting, and type checks on changed Python files
        entry: bash -c 'cd python && hatch run precommit:check'
        pass_filenames: false
        files: ^python/.*\.py$
        language: system
    -   id: uv-lock-update
        name: Update uv.lock
        description: Updates uv.lock from PyPI
        entry: bash scripts/update-python-uv-lock.sh
        pass_filenames: false
        files: ^python/(pyproject\.toml|uv\.lock|uv\.toml)$
        language: system
    -   id: no-snowflake-namespace-init
        name: No __init__.py in snowflake namespace package
        description: >
          snowflake is a PEP 420 namespace package shared across multiple
          distributions. An __init__.py in python/src/snowflake/ would
          break other snowflake.* packages installed in the same environment.
        entry: 'python/src/snowflake/__init__\.py'
        language: fail
        files: ^python/src/snowflake/__init__\.py$
    -   id: python-no-assert-in-production
        name: No assert statements in production code
        description: Ensure no assert statements are used in python/src (production code only)
        entry: '^\s*assert\s'
        language: pygrep
        files: ^python/src/.*\.py$
    -   id: jdbc-spotless-check
        name: JDBC Spotless check
        description: Run Spotless checks for the JDBC module.
        entry: bash -c 'cd jdbc && bash ./gradlew spotlessCheck'
        pass_filenames: false
        files: ^jdbc/(.*\.(java|gradle)|gradle\.properties)$
        language: system
    -   id: jdbc-checkstyle
        name: JDBC Checkstyle
        description: Run Checkstyle on JDBC main and test sources.
        entry: bash -c 'cd jdbc && bash ./gradlew checkstyleMain checkstyleTest'
        pass_filenames: false
        files: ^jdbc/(.*\.(java|gradle)|gradle\.properties|config/checkstyle/.*)$
        language: system
    -   id: nodejs-code-format
        name: Node.js code formatting & linting
        description: Validate and autoformat the code
        entry: bash -c 'cd nodejs && npm run types:check && npm run fmt:fix && npm run lint:check'
        pass_filenames: false
        files: ^nodejs/.*\.(ts|js|mjs|cjs|json)$
        language: system
    -   id: dotnet-checks
        name: dotnet code checks (format)
        description: Run dotnet format on changed dotnet files
        entry: bash -c 'cd dotnet && dotnet format --verify-no-changes'
        pass_filenames: false
        files: ^dotnet/.*\.(cs|csproj|sln|props|targets|editorconfig)$
        language: system
    -   id: behavior-differences-validator
        name: Behavioral Differences format check
        description: Validate behavior-difference schema (monolith YAML and per-file entries)
        entry: python3 scripts/validate_behavior_differences.py
        pass_filenames: false
        additional_dependencies: ['pyyaml']
        files: ^(odbc_tests|python|jdbc|nodejs)/BehaviorDifferences\.yaml$|^(python|odbc_tests)/behavior_differences/.+\.yaml$|^scripts/validate_behavior_differences\.py$
        language: python
    -   id: behavior-differences-validator-test
        name: Behavioral Differences validator tests
        description: Unit tests for scripts/validate_behavior_differences.py
        entry: python3 -m unittest scripts/test_validate_behavior_differences.py
        pass_filenames: false
        additional_dependencies: ['pyyaml']
        files: ^scripts/(validate_behavior_differences\.py|test_validate_behavior_differences\.py)$
        language: python
    -   id: changelog-fragments
        name: Changelog fragment check
        description: Validate changelog fragments and reject edits to shipped CHANGELOG sections
        entry: python3 scripts/check_changelog.py --base origin/main
        pass_filenames: false
        files: (^[^/]+/CHANGELOG\.md$|^[^/]+/changelog/|^scripts/check_changelog\.py$)
        # The Node.js changelog is still a hand-written draft.
        # Remove this exclude closer to the Node.js GA release.
        exclude: ^nodejs/(CHANGELOG\.md$|changelog/)
        language: system
    -   id: mirror-config-consistency
        name: Mirror config generation consistency
        description: Ensure committed mirror infrastructure matches its generator
        entry: bash -c 'if [ -f ci/mirroring/scripts/test_generate_mirror_config.py ]; then python3 ci/mirroring/scripts/test_generate_mirror_config.py; else echo "ci/mirroring/ is excluded from the public mirror; skipping"; fi'
        pass_filenames: false
        files: ^(ci/mirroring/|\.github/workflows/(mirror|mirror-inbound|close-imported-pr)\.yml$)
        language: system
    -   id: notify-slack-failure-parser-test
        name: notify-slack-failure JUnit parser test
        description: Guard the flaky-artifact filter in the CI failure Slack notifier
        entry: python3 -m unittest scripts/test_notify_slack_failure.py
        pass_filenames: false
        files: ^(\.github/workflows/notify-slack-failure\.yml|scripts/test_notify_slack_failure\.py)$
        language: python
    -   id: retry-on-network-error-test
        name: retry_on_network_error.sh test
        description: Guard which npm/nuget failures the CI install retry wrapper retries
        entry: python3 -m unittest scripts/test_retry_on_network_error.py
        pass_filenames: false
        files: ^scripts/(retry_on_network_error\.sh|test_retry_on_network_error\.py)$
        language: python
    -   id: wait-for-test-host-test
        name: wait_for_test_host.sh test
        description: Guard DNS preflight for live-account CI jobs after decode_secrets
        entry: python3 -m unittest scripts/test_wait_for_test_host.py
        pass_filenames: false
        files: ^scripts/(wait_for_test_host\.sh|test_wait_for_test_host\.py)$
        language: python
    -   id: tests-format-validator
        name: Tests format validator
        description: Validate that test implementations match Gherkin feature scenarios
        entry: ./tests/tests_format_validator/run_validator.sh
        pass_filenames: false
        files: |
          (?x)^(
            tests/definitions/.*\.feature
            | tests/tests_format_validator/.*\.(rs|toml|lock|sh)
            | (sf_core/tests|jdbc/src/test|odbc_tests|python/tests|dotnet/tests|nodejs/tests)/.*\.(rs|java|cpp|hpp|py|cs|ts|js)
            | (odbc_tests|python|jdbc|nodejs|dotnet)/BehaviorDifferences\.yaml
            | python/behavior_differences/.*\.yaml
          )$
        language: system
    -   id: ai-rules-sync
        name: AI rules sync check
        description: >
          Two checks: (1) verify .cursor/rules/*.mdc body matches .claude/rules/*.md
          canonical source (alwaysApply rules need full content in both — pointer files
          place the body in tool-call history where context compaction can drop it);
          (2) verify every .claude/skills/*/SKILL.md has a matching .cursor/skills/
          pointer so Cursor users can invoke the skill. Edit .claude/ first for rules,
          then copy the body to .cursor/rules/. Run scripts/check-ai-rules-sync.sh to fix.
        entry: bash scripts/check-ai-rules-sync.sh
        pass_filenames: false
        files: (\.claude/rules/|\.cursor/rules/|\.claude/skills/|\.cursor/skills/)
        language: system
    -   id: sf-ai-skills-check
        name: Validate Claude skills
        entry: .pre-commit-scripts/sf-ai-skills-check.sh
        language: script
        pass_filenames: false
        files: '^.*\.claude/.*'
    -   id: sf-ai-skills-bridge
        name: Create .agents/skills/ symlink bridges from .claude/skills/
        entry: .pre-commit-scripts/sf-ai-skills-bridge.sh
        language: script
        pass_filenames: false
        files: '(^|/)(\.claude|\.agents)/skills/'
