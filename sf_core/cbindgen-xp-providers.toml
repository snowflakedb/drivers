# Generates include/sf_core_providers.h from src/xp_backend/ffi.rs. Run
# scripts/generate_providers_header.sh after changing that file; the header is
# committed because its consumer (XP's C++ build) has no Rust toolchain.

language = "C"
cpp_compat = true
style = "both"

header = """/**
 * @file sf_core_providers.h
 * @brief C ABI for registering a host-owned backend with the Snowflake driver
 *        core.
 *
 * A host that owns the transport — notably Snowflake's execution platform (XP),
 * whose stored-procedure sandbox has no outbound network and must send queries
 * over its existing gRPC channel — implements the callbacks below and installs
 * them with sf_core_register_xp_backend().
 *
 * Selection is a runtime decision: set SNOWFLAKE_RUNNING_INSIDE_XP (any
 * value, including empty) before constructing the driver. Presence enables
 * XP mode; registering without it is accepted but has no effect. See
 * src/xp_backend/mod.rs.
 *
 * The symbols are exported from whichever shared object embeds sf_core —
 * sf_core_python.*.so, libjdbc_bridge.so, libsfodbc.so, libnodejs_bridge.so —
 * so a host must resolve them from the library it actually loaded. On Linux,
 * dlopen that file with RTLD_NOLOAD | RTLD_GLOBAL and dlsym from the resulting
 * handle; each library holds its own copy of the registry, so registering into
 * the wrong one silently does nothing.
 *
 * Memory ownership:
 *   - Strings a callback writes to a *_out parameter, and
 *     SfCoreFfiError.message, are allocated by the host (strdup or malloc) and
 *     freed by the driver.
 *   - Strings the driver returns (sf_core_get_version) must be freed by the
 *     host with sf_core_free_string(), never with free().
 *
 * Callback contract:
 *   - Callbacks may run concurrently on several threads, so `context` must be
 *     thread-safe and must outlive the process's use of the driver.
 *   - Callbacks run on Tokio's blocking thread pool.
 *   - A callback must not let a C++ exception escape. Rust cannot unwind
 *     through extern "C" and the process will abort. Catch at the boundary and
 *     report through SfCoreFfiError instead.
 *   - Return 0 on success, non-zero on failure. Set SfCoreFfiError.code to a
 *     Snowflake server error code where one exists, so it reaches the user
 *     unchanged.
 *
 * JSON payloads
 * =============
 *
 * Callback JSON schemas are defined by XpQueryRequest, XpCancelRequest,
 * XpCancelResponse, XpAuthRequest, and XpSessionInfo in
 * src/xp_backend/ffi.rs. Their serialization tests provide current examples.
 * Absent optional fields are omitted rather than sent as null; hosts should
 * ignore unknown fields.
 *
 * This file is generated by cbindgen. Do not edit manually — run
 * scripts/generate_providers_header.sh.
 */"""

include_guard = "SF_CORE_PROVIDERS_H"
autogen_warning = "/* Warning: autogenerated by cbindgen. Regenerate with scripts/generate_providers_header.sh instead of editing. */"
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[parse]
parse_deps = false

[export]
include = [
    "SfCoreFfiError",
    "XpBackendCallbacks",
    "XP_BACKEND_ABI_VERSION",
]
# sf_core's other c_api modules are out of scope for this header.
exclude = [
    "sf_core_init",
    "sf_core_api_call_proto",
    "sf_core_api_call_proto_async",
    "sf_core_api_cancel",
    "sf_core_free_buffer",
    "sf_core_perf_enabled",
    "sf_core_get_perf_data",
    "sf_core_reset_perf_metrics",
    "sf_core_log_event",
]

[fn]
args = "horizontal"

[enum]
prefix_with_name = true
