[package]
name = "sf_core"
edition = "2024"
rust-version = "1.94"

[lib]
name = "sf_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["protobuf", "sonic-json"]
sonic-json = ["sonic-rs"]
fips = ["rustls/fips"]
protobuf = ["prost", "proto_utils"]
vendored-openssl = ["openssl/vendored"]
auth_mfa_e2e = []
auth_oauth_e2e = []
auth_spcs_e2e = []
gcs_e2e = []
perf_timing = []
test-utils = []
cli = ["clap"]

[dependencies]
tracing-opentelemetry = "0.31.0"
opentelemetry = { version = "0.30.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.30.0" }
opentelemetry-semantic-conventions = { version = "0.30.0" }
tracing = "0.1.41"
tracing-core = "0.1.34"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
rand = "0.9.2"
bytes = "1"
# rustls is the driver's only TLS backend. `default-features = false` drops
# reqwest's `default-tls` (native-tls/OpenSSL/SChannel) so it is not compiled in
# at all and rustls becomes the default backend uniformly (the CRL path and the
# storage clients already use rustls). `rustls-tls-native-roots` keeps the OS
# trust store as the default root source, matching the prior native-tls
# behaviour. `charset`/`http2`/`macos-system-configuration` are re-added from
# reqwest's default set (only `default-tls` is intentionally dropped).
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip", "stream", "http2", "charset", "macos-system-configuration"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value"] }
futures = "0.3"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["time"] }
tokio-stream = "0.1"
toml = "0.8"
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.22.1"
arrow = { version = ">=54.0.0, <59", features = ["ffi"] }
arrow-ipc = ">=54.0.0, <59"
flate2 = "1.1.2"
openssl = "0.10.73"
jwt = { version = "0.16.0", features = ["openssl"] }
oauth2 = { version = "5", features = ["timing-resistant-secret-traits"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
webbrowser = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
tempfile = "3.21.0"
infer = "0.19.0"

# Proto
prost = { version = "0.14.1", optional = true }
proto_utils = { path = "../proto_utils", optional = true }

# AWS SDK dependencies
aws-sdk-s3 = "1.106.0"
aws-sdk-sts = "1.96.0"
aws-config = "1.8.12"
aws-runtime = "1.5.18"
aws-smithy-runtime = "1.9.8"
aws-credential-types = "1.2.11"
# Enables `ByteStream::from_body_1_x` so the S3 PUT path can stream a custom
# (lazily-encrypting) http-body without buffering ciphertext.
aws-smithy-types = { version = "1.3", features = ["http-body-1-x"] }
# Hand-built, version-pinned AWS HTTP client (see `tls::aws_http_client`).
# aws-smithy-http-client's TLS API exposes no min/max protocol-version knob, so
# when the caller narrows the TLS window we adapt a hyper(-rustls) client to
# smithy's `HttpClient` trait. Only engaged for a narrowed window.
aws-smithy-runtime-api = { version = "1.9", features = ["client", "http-1x"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "aws-lc-rs"] }
snafu = "0.8.7"
error_trace = { path = "../error_trace" }
fs2 = "0.4"
glob = "0.3.3"

# CRL and TLS dependencies
rustls = { version = "0.23.20", features = ["aws_lc_rs"] }
rustls-pemfile = "2.2.0"
rustls-webpki = "0.102"
rustls-native-certs = "0.8"
thiserror = "1.0.69"
aws-lc-rs = "1.13.2"
x509-parser = "0.16"
der-parser = "9.0"
x509-cert = "0.2"
spki = "0.7"
time = "0.3"
once_cell = "1.19"
const-oid = "0.9"
dirs = "5.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
lru = "0.12"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
html-escape = "0.2"
urlencoding = "2.1"
zeroize = "1.8"
hex = "0.4"
memchr = "2"
sonic-rs = { version = "0.5", optional = true }
sha2 = "0.10"
hmac = "0.12"
clap = { version = "4.5", features = ["derive", "env"], optional = true }
signature = "2"
der = "0.7"
num-traits = "0.2.19"
os_info = "3"
rust-ini = "0.21.3"

[build-dependencies]
proto_generator = { path = "../proto_generator" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sf_core = { path = ".", default-features = false, features = ["test-utils"] }
tokio = { version = "1.47.1", features = ["fs", "test-util"] }
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = ["experimental_metrics_custom_reader"] }
arrow_deserialize_macro = { path = "tests/common/arrow_deserialize_macro" }
bzip2 = "0.6.0"
brotli = "8.0.2"
zstd = "0.13.3"
flate2 = "1.1.2"
test-case = "3.3.1"
# Dev/test reqwest: also rustls-only so test builds don't re-introduce
# native-tls (feature unification would otherwise pull `default-tls` back in).
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots", "http2", "charset"] }
wiremock = "0.6"
rcgen = "0.13"
tokio-rustls = "0.26"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
criterion = { version = "0.5", features = ["async_tokio"] }
temp-env = { version = "0.3.6", features = ["async_closure"] }
scopeguard = "1.2"

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph", "criterion"] }

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"

[[test]]
name = "logging_tests"
path = "tests/logging_tests.rs"

[[test]]
name = "logging_disabled_tests"
path = "tests/logging_disabled_tests.rs"

[[test]]
name = "logging_toml_tests"
path = "tests/logging_toml_tests.rs"

[[test]]
name = "logging_callback_tests"
path = "tests/logging_callback_tests.rs"

[[test]]
name = "logging_for_odbc_tests"
path = "tests/logging_for_odbc_tests.rs"

[[test]]
name = "logging_level_filtering_tests"
path = "tests/logging_level_filtering_tests.rs"

[[test]]
name = "logging_custom_file_tests"
path = "tests/logging_custom_file_tests.rs"

[[test]]
name = "logging_query_tests"
path = "tests/logging_query_tests.rs"

[[test]]
name = "byte_source_roundtrip"
path = "tests/byte_source_roundtrip.rs"

[[test]]
name = "e2e_tests"
path = "tests/e2e/mod.rs"

[[bin]]
name = "tls_client"
path = "src/bin/tls_client.rs"
required-features = ["cli"]

[[bin]]
name = "collect_chunk_data"
path = "src/bin/collect_chunk_data.rs"
required-features = ["cli"]

[[bin]]
name = "param_defs_export"
path = "src/bin/param_defs_export.rs"

[[bin]]
name = "spcs_probe"
path = "src/bin/spcs_probe.rs"
required-features = ["protobuf"]

[[bench]]
name = "prefetch_bench"
harness = false
