[package]
name = "sf_core"
edition = "2024"
autobins = false

[lib]
name = "sf_core"
crate-type = ["dylib", "rlib"]

[[bin]]
name = "tls_client"
path = "src/bin/tls_client.rs"
required-features = ["native"]

[[bin]]
name = "crl_debug"
path = "src/bin/crl_debug.rs"
required-features = ["native"]

[features]
default = ["native"]
native = [
    "dep:openssl",
    "dep:jwt",
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-stream",
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:rustls",
    "rustls/aws_lc_rs",
    "rustls/fips",
    "rustls/std",
    "dep:rustls-pemfile",
    "dep:rustls-webpki",
    "dep:rustls-native-certs",
    "dep:aws-lc-rs",
    "dep:x509-parser",
    "dep:der-parser",
    "dep:x509-cert",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
]
wasm = [
    "dep:rsa",
    "dep:pkcs8",
    "dep:aes",
    "dep:cbc",
    "dep:ecb",
    "dep:getrandom",
    "dep:wstd",
    "dep:hmac",
    # TLS for WASM: rustls with pure-Rust RustCrypto backend (no C code)
    "dep:rustls",
    "rustls/std",
    "rustls/tls12",
    "dep:rustls-rustcrypto",
    "dep:webpki-roots",
]

[dependencies]
# Platform-agnostic dependencies (always included)
async-trait = "0.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.22.1"
arrow = { version = "56.0.0", features = ["ffi"] }
arrow-ipc = "56.0.0"
flate2 = "1.1.2"
infer = "0.19.0"
lazy_static = "1.5.0"
snafu = "0.8.7"
glob = "0.3.3"
thiserror = "1.0.69"
spki = "0.7"
time = "0.3"
once_cell = "1.19"
const-oid = "0.9"
dirs = "5.0"
lru = "0.12"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
urlencoding = "2.1"
hex = "0.4"
sha2 = { version = "0.10", features = ["oid"] }
clap = { version = "4.5", features = ["derive"] }
signature = "2"
der = "0.7"
pkcs1 = "0.7"
num-traits = "0.2.19"

# Proto
prost = "0.14.1"
proto_utils = { path = "../proto_utils" }

# Native-only dependencies (OpenSSL, AWS SDK, Tokio, etc.)
tracing-opentelemetry = { version = "0.31.0", optional = true }
opentelemetry = { version = "0.30.0", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.30.0", optional = true }
opentelemetry-semantic-conventions = { version = "0.30.0", optional = true }
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1.47.1", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
openssl = { version = "0.10.73", optional = true }
jwt = { version = "0.16.0", features = ["openssl"], optional = true }
aws-sdk-s3 = { version = "1.103.0", optional = true }
aws-config = { version = "1.8.5", optional = true }
aws-credential-types = { version = "1.2.5", optional = true }
rustls = { version = "0.23.20", default-features = false, optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
rustls-webpki = { version = "0.102", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
aws-lc-rs = { version = "1.13.2", optional = true }
x509-parser = { version = "0.16", optional = true }
der-parser = { version = "9.0", optional = true }
x509-cert = { version = "0.2", optional = true }

# WASM-only dependencies (RustCrypto + wstd)
rsa = { version = "0.9", optional = true }
pkcs8 = { version = "0.10", features = ["encryption", "pem", "3des"], optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
ecb = { version = "0.1", features = ["alloc"], optional = true }
getrandom = { version = "0.2", optional = true }
wstd = { version = "0.6", optional = true }
hmac = { version = "0.12", optional = true }
# TLS for WASM - rustls with pure-Rust RustCrypto backend (no C code, WASM-compatible)
# Note: rustls-rustcrypto v0.0.2-alpha depends on rustls 0.23.x, so we use a compatible version
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3.21.0"
arrow_deserialize_macro = { path = "tests/common/arrow_deserialize_macro" }
bzip2 = "0.6.0"
brotli = "8.0.2"
zstd = "0.13.3"
test-case = "3.3.1"
reqwest = { version = "0.12.23", features = ["blocking"] }

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"

[[test]]
name = "e2e_tests"
path = "tests/e2e/mod.rs"
