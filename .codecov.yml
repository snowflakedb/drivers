# Codecov Configuration
version: "v1"

coverage:
  status:
    project: off
    patch: off

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 5%
      - type: patch
        target: 90%
  individual_flags: # exceptions to the default rules above, stated flag by flag
    - name: rust-core
      paths: 
        - sf_core/
      carryforward: true
      statuses:
        - type: project
          target: auto
          threshold: 5%
        - type: patch
          target: 75%
    - name: python
      paths: 
        - pep249_dbapi/
      carryforward: true
      statuses:
        - type: project
          target: auto
          threshold: 5%
        - type: patch
          target: 85%
    - name: jdbc
      paths: 
        - jdbc/
        - jdbc_bridge/
      carryforward: true
      statuses:
        - type: project
          target: auto
          threshold: 5%
        - type: patch
          target: 80%
    - name: odbc
      paths: 
        - odbc/
      carryforward: true
      statuses:
        - type: project
          target: auto
          threshold: 5%
        - type: patch
          target: 80%

comment:
  layout: "header,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  branches: ["main", "develop"]

ignore:
  - "tests/"
  - "tests/**/*"
  - "**/tests/"
  - "**/test_utils.rs"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/tests_format_validator/**"
  - "test_data/"
  - "proto_generator/"
  - "proto_utils/"
  - "scripts/"
  - "*.md"
  - "README*"
  - "Dockerfile*"
  - "*.yml"
  - "*.yaml"
  - "*.toml"
  - "*.json"
  - "*.sh"
  - ".github/"