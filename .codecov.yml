codecov:
  notify:
    wait_for_ci: true
    require_ci_to_pass: true

flag_management:
  default_rules:
    carryforward: false
    carryforward_mode: "all"

flags:
  rust-core:
    paths: ["sf_core/"]
  core-from-python:
    paths: ["sf_core/"]
  core-from-odbc:
    paths: ["sf_core/"]
  jdbc:
    paths: ["jdbc/", "jdbc_bridge/"]
  python:
    paths: ["pep249_dbapi/"]
  odbc:
    paths: ["odbc/"]

x-component: &component
  target: auto
  threshold: 2%
  base: auto
  if_ci_failed: error

x-patch-component: &patch-component
  target: 75%
  threshold: 5%
  base: auto
  if_ci_failed: error

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      # Overall status waits for all expected coverage flags
      default:
        target: auto
        threshold: 1%
        base: auto
        if_ci_failed: error
        flags: [rust-core, core-from-python, core-from-odbc, python, jdbc, odbc]
        flag_coverage_not_uploaded_behavior: include
        wait_for_ci: true
        require_ci_to_pass: true

      # Individual component statuses
      rust-core:        { <<: *component, flags: [rust-core] }
      rust-combined:    { <<: *component, flags: [rust-core, core-from-python, core-from-odbc] }
      python:           { <<: *component, flags: [python] }
      jdbc:             { <<: *component, flags: [jdbc] }
      odbc:             { <<: *component, flags: [odbc] }
        
    patch:
      # Overall patch status waits for all expected coverage flags
      default:
        <<: *patch-component
        flags: [rust-core, core-from-python, core-from-odbc, python, jdbc, odbc]
        flag_coverage_not_uploaded_behavior: include
      # Individual component statuses
      rust-core:        { <<: *patch-component, flags: [rust-core] }
      rust-combined:    { <<: *patch-component, flags: [rust-core, core-from-python, core-from-odbc] }
      python:           { <<: *patch-component, flags: [python] }
      jdbc:             { <<: *patch-component, flags: [jdbc] }
      odbc:             { <<: *patch-component, flags: [odbc] }

comment:
  layout: "header,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  branches: ["main", "develop"]
  show_carryforward_flags: true

ignore:
  # Test files and documentation
  - "tests/"
  - "tests/**/*"
  - "**/tests/"
  - "**/tests/**/*"
  - "**/*.md"
  - "odbc_tests/"
  - "odbc_tests/**/*"
  - "scripts/"
  
  # Specific test paths to exclude
  - "sf_core/tests/**"
  - "**/tests/common/**"
  - "tests/common/**"
  - "tests/tests_format_validator/**"
  
  # Build artifacts
  - "**/target/"
  - "**/build/"
  
  # Configuration files
  - "**/*.toml"
  - "**/*.lock"
  
  # Python artifacts
  - "**/__pycache__/"
  - "**/*.pyc"
  - "**/*.pyo"
  - "**/.pytest_cache/"
  - "**/.tox/"
  - "**/dist/"
  - "**/*.egg-info/"
  
  # Generated code
  - "**/thrift_gen/"
  - "**/gen-*/"
  
  # Java/Gradle artifacts
  - "**/.gradle/"
  - "**/gradlew*"
  - "**/*.class"
  
  # CMake artifacts
  - "**/CMakeCache.txt"
  - "**/CMakeFiles/"
  - "**/cmake_install.cmake"
  - "**/cmake-build/"
  
  # IDE and OS files
  - "**/.idea/"
  - "**/.vscode/"
  - "**/.DS_Store"
  - "**/*.swp"

github_checks:
  annotations: true
