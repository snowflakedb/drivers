# Universal Driver CI Tests Pipeline
# Runs integration and E2E tests for all drivers in parallel.
#
# Test selection: each step runs ci/select_tests.py to determine which tests
# are relevant based on changed files. Steps receiving SKIP exit early without
# building. The base ref is auto-detected from BUILDKITE_PULL_REQUEST_BASE_BRANCH.
#
# Each driver group runs build + test in a single step because Buildkite steps
# run on separate agents with no shared filesystem. Splitting build/test would
# require uploading multi-GB Rust target/ artifacts between steps.
#
# Secrets:
#   PARAMETERS_SECRET is fetched from Vault via the vault-secrets plugin
#   (path: secret/jenkins/rt-tests/driver_validation_parameters_secret)
#   and passed into the Docker container for decode_secrets.sh to use.
#
# Docker image: same as used in Jenkins CI (rhel8-universal-driver-coverage)

common: &common
  agents:
    queue: "discovery"
    repo: "snowflakedb/universal-driver"
  plugins:
    - ${GLOBAL_PLUGIN}/vault_secrets:
        secrets:
          - path: "secret/jenkins/rt-tests/driver_validation_parameters_secret"
            env_name: "PARAMETERS_SECRET"
    - docker#v5.11.0:
        image: "artifactory.ci1.us-west-2.aws-dev.app.snowflake.com/internal-production-docker-snowflake-virtual/docker/rhel8-universal-driver-coverage:3"
        propagate-environment: true
        environment:
          - "PARAMETERS_SECRET"
  retry:
    automatic:
      - exit_status: "*"
        limit: 1

steps:
  # ==========================================================================
  # Rust Core
  # ==========================================================================
  - group: ":rust: Rust Core"
    key: "rust-core"
    steps:
      - label: ":rust: Build + E2E Tests"
        key: "rust-core-e2e"
        <<: *common
        command: |
          echo "--- :mag: Test Selection"
          pip3 install pyyaml -q
          TEST_FILTER=$$(python3 ci/select_tests.py --driver rust --group integ,e2e --verbose)
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            buildkite-agent annotate ":fast_forward: Rust Core — skipped (no relevant changes)" --style "info" --context "rust-skip"
            exit 0
          fi

          ./scripts/decode_secrets.sh
          yum install -y unzip
          export PARAMETER_PATH=/workdir/parameters.json

          echo "--- :hammer: Building sf_core"
          cargo build --package sf_core

          echo "--- :test_tube: Running E2E Tests"
          if [ "$$TEST_FILTER" = "ALL" ]; then
            cargo test --package sf_core -- --ignored
          else
            cargo test --package sf_core -- --ignored "$$TEST_FILTER"
          fi
        timeout_in_minutes: 30

  # ==========================================================================
  # Python
  # ==========================================================================
  - group: ":python: Python"
    key: "python"
    steps:
      - label: ":python: Build + Integ + E2E Tests"
        key: "python-integ-e2e"
        <<: *common
        command: |
          echo "--- :mag: Test Selection"
          pip3 install pyyaml -q
          TEST_FILTER=$$(python3 ci/select_tests.py --driver python --group integ,e2e --verbose)
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            buildkite-agent annotate ":fast_forward: Python — skipped (no relevant changes)" --style "info" --context "python-skip"
            exit 0
          fi

          ./scripts/decode_secrets.sh
          yum install -y unzip
          export PARAMETER_PATH=/workdir/parameters.json

          cd python

          echo "--- :hammer: Building Python Wheel"
          RUSTFLAGS="" hatch build -t wheel
          hatch run test.py3.9:install-wheel

          echo "--- :test_tube: Running Integ + E2E Tests"
          if [ "$$TEST_FILTER" = "ALL" ]; then
            hatch run test.py3.9:all -- tests/integ/ tests/e2e/ -v --timeout=900
          else
            hatch run test.py3.9:all -- $$TEST_FILTER -v --timeout=900
          fi
        timeout_in_minutes: 45

  # ==========================================================================
  # ODBC
  # ==========================================================================
  - group: ":c: ODBC"
    key: "odbc"
    steps:
      - label: ":c: Build + Integ + E2E Tests"
        key: "odbc-integ-e2e"
        <<: *common
        command: |
          echo "--- :mag: Test Selection"
          pip3 install pyyaml -q
          TEST_FILTER=$$(python3 ci/select_tests.py --driver odbc --group integ,e2e --verbose)
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            buildkite-agent annotate ":fast_forward: ODBC — skipped (no relevant changes)" --style "info" --context "odbc-skip"
            exit 0
          fi

          ./scripts/decode_secrets.sh
          yum install -y unzip
          export PARAMETER_PATH=/workdir/parameters.json
          export DRIVER_PATH=/workdir/target/debug/libsfodbc.so

          echo "--- :hammer: Building ODBC Driver"
          cargo build

          echo "--- :hammer: Building C++ Test Suite"
          source /opt/rh/gcc-toolset-11/enable
          cd odbc_tests
          mkdir -p cmake-build
          cmake -B cmake-build \
              -D ODBC_LIBRARY="/usr/lib64/libodbc.so" \
              -D ODBC_INCLUDE_DIR="/usr/include" \
              -D DRIVER_TYPE=NEW \
              .
          cmake --build cmake-build -- -j $$(nproc)

          echo "--- :test_tube: Running Integ + E2E Tests"
          if [ "$$TEST_FILTER" = "ALL" ]; then
            ctest -j 1 -C Debug --test-dir cmake-build --output-on-failure --no-tests=error -R "e2e|integration"
          else
            ctest -j 1 -C Debug --test-dir cmake-build --output-on-failure --no-tests=error -R "$$TEST_FILTER"
          fi
        timeout_in_minutes: 45

  # ==========================================================================
  # JDBC
  # ==========================================================================
  - group: ":java: JDBC"
    key: "jdbc"
    steps:
      - label: ":java: Build + Integ + E2E Tests"
        key: "jdbc-integ-e2e"
        <<: *common
        command: |
          echo "--- :mag: Test Selection"
          pip3 install pyyaml -q
          TEST_FILTER=$$(python3 ci/select_tests.py --driver java --group e2e --verbose)
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            buildkite-agent annotate ":fast_forward: JDBC — skipped (no relevant changes)" --style "info" --context "jdbc-skip"
            exit 0
          fi

          ./scripts/decode_secrets.sh
          yum install -y unzip
          export PARAMETER_PATH=/workdir/parameters.json

          echo "--- :hammer: Building JDBC Bridge"
          cargo build --package sf_core
          cargo build --package jdbc_bridge

          echo "--- :test_tube: Running Integ + E2E Tests"
          export CORE_PATH=/workdir/target/debug/libjdbc_bridge.so
          chmod +x jdbc/gradlew
          cd jdbc
          if [ "$$TEST_FILTER" = "ALL" ]; then
            ./gradlew test --stacktrace
          else
            GRADLE_TESTS=""
            IFS='|' read -ra PATTERNS <<< "$$TEST_FILTER"
            for pattern in "$${PATTERNS[@]}"; do
              GRADLE_TESTS="$$GRADLE_TESTS --tests $$pattern"
            done
            ./gradlew test $$GRADLE_TESTS --stacktrace
          fi
        timeout_in_minutes: 45
