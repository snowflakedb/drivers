# Universal Driver CI Tests Pipeline
#
# Architecture: a lightweight "Test Selection" step runs on the bare agent
# (no Docker) and determines which drivers need testing. It then dynamically
# uploads only the needed driver steps via `buildkite-agent pipeline upload`.
# Skipped drivers never spin up Docker — they are annotated on the build page
# but do not appear as steps.
#
# The driver steps are defined in ci/generate_buildkite_pipeline.py which
# generates the pipeline YAML programmatically.
#
# Each driver group runs build + test in a single step because Buildkite steps
# run on separate agents with no shared filesystem. Splitting build/test would
# require uploading multi-GB Rust target/ artifacts between steps.
#
# Secrets:
#   PARAMETERS_SECRET is fetched from Vault via the vault-secrets plugin
#   (path: secret/jenkins/rt-tests/driver_validation_parameters_secret)
#   and passed into the Docker container for decode_secrets.sh to use.
#
# Docker image: same as used in Jenkins CI (rhel8-universal-driver-coverage)

steps:
  - label: ":mag: Test Selection"
    key: "test-selection"
    agents:
      queue: "discovery"
      repo: "snowflakedb/universal-driver"
    command: |
      set -euo pipefail
      pip3 install pyyaml -q
      python3 ci/generate_buildkite_pipeline.py | buildkite-agent pipeline upload
