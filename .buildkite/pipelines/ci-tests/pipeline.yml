# Universal Driver CI Tests Pipeline
#
# Architecture:
#   1. Test Selection step runs on bare agent (no Docker), determines which
#      drivers need testing, stores results in Buildkite meta-data.
#   2. Driver steps fetch secrets from Vault, then run build+test inside
#      Docker via `docker run` (no Docker plugin — bypasses plugin gate).
#   3. JUnit XML results are uploaded as artifacts and to Test Engine.
#
# Each driver group runs build + test in a single step because Buildkite steps
# run on separate agents with no shared filesystem.

env:
  DOCKER_IMAGE: "artifactory.ci1.us-west-2.aws-dev.app.snowflake.com/internal-production-docker-snowflake-virtual/docker/rhel8-universal-driver-coverage:3"

common: &common
  agents:
    queue: "discovery"
    repo: "snowflakedb/universal-driver"
  plugins:
    - ${GLOBAL_PLUGIN}/vault_secrets:
        secrets:
          - path: "secret/jenkins/rt-tests/driver_validation_parameters_secret"
            env_name: "PARAMETERS_SECRET"
          - path: "secret/jenkins/rt-tests/universal_driver_test_suite_api_token"
            env_name: "BUILDKITE_ANALYTICS_TOKEN"
  retry:
    automatic:
      - exit_status: "*"
        limit: 1

steps:
  # ==========================================================================
  # Test Selection (runs on bare agent, no Docker)
  # ==========================================================================
  - label: ":mag: Test Selection"
    key: "test-selection"
    agents:
      queue: "discovery"
      repo: "snowflakedb/universal-driver"
    command: |
      set -euo pipefail
      pip3 install pyyaml -q
      for driver_group in "rust:integ,e2e" "python:integ,e2e" "odbc:integ,e2e" "java:e2e"; do
        driver="$${driver_group%%:*}"
        group="$${driver_group##*:}"
        result=$$(python3 ci/select_tests.py --driver "$$driver" --group "$$group" --verbose)
        buildkite-agent meta-data set "test-filter-$$driver" "$$result"
        if [ "$$result" = "SKIP" ]; then
          buildkite-agent annotate ":fast_forward: Skipped: $$driver (no relevant changes)" --style "info" --context "test-selection" --append
        fi
      done

  # ==========================================================================
  # Rust Core
  # ==========================================================================
  - group: ":rust: Rust Core"
    key: "rust-core"
    depends_on: "test-selection"
    steps:
      - label: ":rust: Build + E2E Tests"
        key: "rust-core-e2e"
        <<: *common
        timeout_in_minutes: 30
        command: |
          set -euo pipefail
          TEST_FILTER=$$(buildkite-agent meta-data get "test-filter-rust")
          echo "Filter: $$TEST_FILTER"
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            echo "No relevant changes for rust core, skipping"
            exit 0
          fi

          docker run --rm \
            -v "$$PWD:/workdir" \
            -w /workdir \
            -e PARAMETERS_SECRET \
            -e BUILDKITE_ANALYTICS_TOKEN \
            "$$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail
              ./scripts/decode_secrets.sh
              yum install -y unzip
              export PARAMETER_PATH=/workdir/parameters.json

              echo "--- Building sf_core"
              cargo build --package sf_core
              cargo install cargo2junit 2>/dev/null || true

              echo "--- Running E2E Tests"
              mkdir -p /workdir/junit-results
              export RUSTC_BOOTSTRAP=1
              TEST_FILTER="'"$$TEST_FILTER"'"
              if [ "$$TEST_FILTER" = "ALL" ]; then
                cargo test --package sf_core -- --ignored -Z unstable-options --format json --report-time 2>&1 | cargo2junit > /workdir/junit-results/rust-junit.xml
              else
                IFS="|" read -ra FILTERS <<< "$$TEST_FILTER"
                for filter in "$${FILTERS[@]}"; do
                  echo "Running: cargo test -- --ignored $$filter"
                  cargo test --package sf_core -- --ignored "$$filter" -Z unstable-options --format json --report-time 2>&1
                done | cargo2junit > /workdir/junit-results/rust-junit.xml
              fi
            '

          echo "--- :buildkite: Uploading test results"
          buildkite-agent artifact upload "junit-results/*.xml"
          for f in junit-results/*.xml; do
            [ -f "$$f" ] || continue
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Token token=\"$$BUILDKITE_ANALYTICS_TOKEN\"" \
              -F "data=@$$f" -F "format=junit" -F "tags[]=driver:rust" \
              -F "run_env[CI]=buildkite" -F "run_env[key]=$$BUILDKITE_BUILD_ID" \
              -F "run_env[number]=$$BUILDKITE_BUILD_NUMBER" -F "run_env[job_id]=$$BUILDKITE_JOB_ID" \
              -F "run_env[branch]=$$BUILDKITE_BRANCH" -F "run_env[commit_sha]=$$BUILDKITE_COMMIT" \
              -F "run_env[message]=$$BUILDKITE_MESSAGE" -F "run_env[url]=$$BUILDKITE_BUILD_URL" \
              https://analytics-api.buildkite.com/v1/uploads && echo " uploaded $$f to Test Engine" || echo " warning: Test Engine upload failed for $$f"
          done
          buildkite-agent annotate ":white_check_mark: Rust Core -- passed" --style "success" --context "rust-result"

  # ==========================================================================
  # Python
  # ==========================================================================
  - group: ":python: Python"
    key: "python"
    depends_on: "test-selection"
    steps:
      - label: ":python: Build + Integ + E2E Tests"
        key: "python-integ-e2e"
        <<: *common
        timeout_in_minutes: 45
        command: |
          set -euo pipefail
          TEST_FILTER=$$(buildkite-agent meta-data get "test-filter-python")
          echo "Filter: $$TEST_FILTER"
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            echo "No relevant changes for python, skipping"
            exit 0
          fi

          docker run --rm \
            -v "$$PWD:/workdir" \
            -w /workdir \
            -e PARAMETERS_SECRET \
            -e BUILDKITE_ANALYTICS_TOKEN \
            "$$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail
              ./scripts/decode_secrets.sh
              yum install -y unzip
              export PARAMETER_PATH=/workdir/parameters.json

              cd python

              echo "--- Building Python Wheel"
              RUSTFLAGS="" hatch build -t wheel
              hatch run test.py3.9:install-wheel

              echo "--- Running Integ + E2E Tests"
              mkdir -p /workdir/junit-results
              TEST_FILTER="'"$$TEST_FILTER"'"
              if [ "$$TEST_FILTER" = "ALL" ]; then
                hatch run test.py3.9:all -- tests/integ/ tests/e2e/ -v --timeout=900 --junitxml=/workdir/junit-results/python-junit.xml
              else
                hatch run test.py3.9:all -- $$TEST_FILTER -v --timeout=900 --junitxml=/workdir/junit-results/python-junit.xml
              fi
            '

          echo "--- :buildkite: Uploading test results"
          buildkite-agent artifact upload "junit-results/*.xml"
          for f in junit-results/*.xml; do
            [ -f "$$f" ] || continue
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Token token=\"$$BUILDKITE_ANALYTICS_TOKEN\"" \
              -F "data=@$$f" -F "format=junit" -F "tags[]=driver:python" \
              -F "run_env[CI]=buildkite" -F "run_env[key]=$$BUILDKITE_BUILD_ID" \
              -F "run_env[number]=$$BUILDKITE_BUILD_NUMBER" -F "run_env[job_id]=$$BUILDKITE_JOB_ID" \
              -F "run_env[branch]=$$BUILDKITE_BRANCH" -F "run_env[commit_sha]=$$BUILDKITE_COMMIT" \
              -F "run_env[message]=$$BUILDKITE_MESSAGE" -F "run_env[url]=$$BUILDKITE_BUILD_URL" \
              https://analytics-api.buildkite.com/v1/uploads && echo " uploaded $$f to Test Engine" || echo " warning: Test Engine upload failed for $$f"
          done
          buildkite-agent annotate ":white_check_mark: Python -- passed" --style "success" --context "python-result"

  # ==========================================================================
  # ODBC
  # ==========================================================================
  - group: ":c: ODBC"
    key: "odbc"
    depends_on: "test-selection"
    steps:
      - label: ":c: Build + Integ + E2E Tests"
        key: "odbc-integ-e2e"
        <<: *common
        timeout_in_minutes: 45
        command: |
          set -euo pipefail
          TEST_FILTER=$$(buildkite-agent meta-data get "test-filter-odbc")
          echo "Filter: $$TEST_FILTER"
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            echo "No relevant changes for odbc, skipping"
            exit 0
          fi

          docker run --rm \
            -v "$$PWD:/workdir" \
            -w /workdir \
            -e PARAMETERS_SECRET \
            -e BUILDKITE_ANALYTICS_TOKEN \
            "$$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail
              ./scripts/decode_secrets.sh
              yum install -y unzip
              export PARAMETER_PATH=/workdir/parameters.json
              export DRIVER_PATH=/workdir/target/debug/libsfodbc.so

              echo "--- Building ODBC Driver"
              cargo build

              echo "--- Building C++ Test Suite"
              source /opt/rh/gcc-toolset-11/enable
              cd odbc_tests
              mkdir -p cmake-build
              cmake -B cmake-build \
                  -D ODBC_LIBRARY="/usr/lib64/libodbc.so" \
                  -D ODBC_INCLUDE_DIR="/usr/include" \
                  -D DRIVER_TYPE=NEW \
                  .
              cmake --build cmake-build -- -j $(nproc)

              echo "--- Running Integ + E2E Tests"
              mkdir -p /workdir/junit-results
              TEST_FILTER="'"$$TEST_FILTER"'"
              if [ "$$TEST_FILTER" = "ALL" ]; then
                ctest -j 1 -C Debug --test-dir cmake-build --output-on-failure --no-tests=error -R "e2e|integration" --output-junit /workdir/junit-results/odbc-junit.xml
              else
                ctest -j 1 -C Debug --test-dir cmake-build --output-on-failure --no-tests=error -R "$$TEST_FILTER" --output-junit /workdir/junit-results/odbc-junit.xml
              fi
            '

          echo "--- :buildkite: Uploading test results"
          buildkite-agent artifact upload "junit-results/*.xml"
          for f in junit-results/*.xml; do
            [ -f "$$f" ] || continue
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Token token=\"$$BUILDKITE_ANALYTICS_TOKEN\"" \
              -F "data=@$$f" -F "format=junit" -F "tags[]=driver:odbc" \
              -F "run_env[CI]=buildkite" -F "run_env[key]=$$BUILDKITE_BUILD_ID" \
              -F "run_env[number]=$$BUILDKITE_BUILD_NUMBER" -F "run_env[job_id]=$$BUILDKITE_JOB_ID" \
              -F "run_env[branch]=$$BUILDKITE_BRANCH" -F "run_env[commit_sha]=$$BUILDKITE_COMMIT" \
              -F "run_env[message]=$$BUILDKITE_MESSAGE" -F "run_env[url]=$$BUILDKITE_BUILD_URL" \
              https://analytics-api.buildkite.com/v1/uploads && echo " uploaded $$f to Test Engine" || echo " warning: Test Engine upload failed for $$f"
          done
          buildkite-agent annotate ":white_check_mark: ODBC -- passed" --style "success" --context "odbc-result"

  # ==========================================================================
  # JDBC
  # ==========================================================================
  - group: ":java: JDBC"
    key: "jdbc"
    depends_on: "test-selection"
    steps:
      - label: ":java: Build + Integ + E2E Tests"
        key: "jdbc-integ-e2e"
        <<: *common
        timeout_in_minutes: 45
        command: |
          set -euo pipefail
          TEST_FILTER=$$(buildkite-agent meta-data get "test-filter-java")
          echo "Filter: $$TEST_FILTER"
          if [ "$$TEST_FILTER" = "SKIP" ]; then
            echo "No relevant changes for jdbc, skipping"
            exit 0
          fi

          docker run --rm \
            -v "$$PWD:/workdir" \
            -w /workdir \
            -e PARAMETERS_SECRET \
            -e BUILDKITE_ANALYTICS_TOKEN \
            "$$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail
              ./scripts/decode_secrets.sh
              yum install -y unzip
              export PARAMETER_PATH=/workdir/parameters.json

              echo "--- Building JDBC Bridge"
              cargo build --package sf_core
              cargo build --package jdbc_bridge

              echo "--- Running Integ + E2E Tests"
              export CORE_PATH=/workdir/target/debug/libjdbc_bridge.so
              chmod +x jdbc/gradlew
              cd jdbc
              TEST_FILTER="'"$$TEST_FILTER"'"
              if [ "$$TEST_FILTER" = "ALL" ]; then
                ./gradlew test --stacktrace
              else
                GRADLE_TESTS=""
                IFS="|" read -ra PATTERNS <<< "$$TEST_FILTER"
                for pattern in "${PATTERNS[@]}"; do
                  GRADLE_TESTS="$$GRADLE_TESTS --tests $$pattern"
                done
                ./gradlew test $$GRADLE_TESTS --stacktrace
              fi

              mkdir -p /workdir/junit-results
              cp build/test-results/test/*.xml /workdir/junit-results/ 2>/dev/null || true
            '

          echo "--- :buildkite: Uploading test results"
          buildkite-agent artifact upload "junit-results/*.xml"
          for f in junit-results/*.xml; do
            [ -f "$$f" ] || continue
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Token token=\"$$BUILDKITE_ANALYTICS_TOKEN\"" \
              -F "data=@$$f" -F "format=junit" -F "tags[]=driver:java" \
              -F "run_env[CI]=buildkite" -F "run_env[key]=$$BUILDKITE_BUILD_ID" \
              -F "run_env[number]=$$BUILDKITE_BUILD_NUMBER" -F "run_env[job_id]=$$BUILDKITE_JOB_ID" \
              -F "run_env[branch]=$$BUILDKITE_BRANCH" -F "run_env[commit_sha]=$$BUILDKITE_COMMIT" \
              -F "run_env[message]=$$BUILDKITE_MESSAGE" -F "run_env[url]=$$BUILDKITE_BUILD_URL" \
              https://analytics-api.buildkite.com/v1/uploads && echo " uploaded $$f to Test Engine" || echo " warning: Test Engine upload failed for $$f"
          done
          buildkite-agent annotate ":white_check_mark: JDBC -- passed" --style "success" --context "jdbc-result"
