title: ODBC Driver Test Coverage
description: Mapping of old ODBC driver tests to new Universal Driver test suite.
summary:
  total_tests: 432
  total_test_files: 71
tests:
  AuthenticationTests/AuthLatestTest/ExternalBrowserTest.cpp:
  - test_name: IdToken scenario
    ud_tests:
      - path: "odbc_tests/tests/e2e/authentication/external_browser.cpp - should authenticate with external browser via Okta IdP"
      - path: "odbc_tests/tests/e2e/authentication/external_browser.cpp - should reuse cached ID token without browser interaction"
      - path: "sf_core/tests/integration/authentication/external_browser_id_token_cache.rs - should_authenticate_with_cached_id_token"
      - path: "sf_core/tests/integration/authentication/external_browser_id_token_cache.rs - should_store_id_token_after_successful_browser_login"
      - path: "sf_core/tests/integration/authentication/external_browser_id_token_cache.rs - should_retry_with_browser_flow_when_cached_id_token_fails"
      - path: "sf_core/tests/integration/authentication/external_browser_id_token_cache.rs - should_not_cache_id_token_when_caching_disabled"
    status: mapped
    notes: "SNOW-3725940. Old 3-section scenario (browser-auth / cached-token-no-browser / re-open-browser-after-delete) explicitly opts into caching and is decomposed and scope-EXPANDED in UD: 9 wiremock ID-token-cache tests (incl. 5x EXT_AUTHN eviction, all #[ignore] flaky-Windows per SNOW-3552507). Old S2 'no browser' proven by should_authenticate_with_cached_id_token (asserts no authenticator-request). Old S3 'delete file re-opens browser' is decomposed into the cache-miss/eviction->browser paths, not one test."
    jira: "SNOW-3725940"
  - test_name: should authenticate using external browser
    ud_tests:
      - path: "odbc_tests/tests/e2e/authentication/external_browser.cpp - should authenticate with external browser via Okta IdP"
      - path: "odbc_tests/tests/integration/authentication/external_browser.cpp - should login with external browser using simulated callback"
      - path: "sf_core/tests/integration/authentication/external_browser.rs - should_login_with_external_browser_using_simulated_callback"
    status: partial
    gaps:
      - "Old test observes a temporary-credential file is written after a plain browser login with no explicit caching parameter set (old driver caches the ID token by default). UD only caches when CLIENT_STORE_TEMPORARY_CREDENTIAL=true is explicitly set (the ODBC e2e equivalent sets it false for this scenario) - not covered by BD#85 (OAuth-AC specific) or BD#137 (MFA param rename); see new BD#139."
    notes: "SNOW-3548054. Connect-success + SELECT-1 assertions fully covered; wire-level body (AUTHENTICATOR/TOKEN/PROOF_KEY/LOGIN_NAME) verified by the integration + sf_core tests."
    jira: "SNOW-3548054"
  - test_name: should throw error for browser timeout
    ud_tests:
      - path: "odbc_tests/tests/integration/authentication/external_browser.cpp - should fail with timeout when no browser callback arrives"
      - path: "sf_core/tests/integration/authentication/external_browser.rs - should_fail_with_timeout_when_no_browser_callback_arrives"
    status: partial
    gaps:
      - "Old ODBC connection param BROWSER_RESPONSE_TIMEOUT is not recognized by the universal driver (renamed to AUTHENTICATION_TIMEOUT, no back-compat alias) - see new BD#138"
      - "No UD test asserts the descriptive timeout message from SNOW-2004277 ('Authentication timed out after N seconds' / 'Snowflake driver did not receive browser authentication response'); UD emits 'Authentication timeout exceeded (budget Ns)' and its tests assert only the generic substrings 'timeout'/'browser' - message-wording covered under BD#138"
    notes: "Timeout-error path covered by the no-callback-timeout test (closest structural match). SNOW-2004277 (old descriptive-message ticket)."
    jira: "SNOW-2004277"
  - test_name: should throw error for mismatched username - external browser
    ud_tests:
      - path: "sf_core/tests/integration/authentication/external_browser.rs - should_fail_when_login_request_is_rejected_after_browser_callback"
    status: partial
    gaps:
      - "The old driver's distinct 'differs from the user currently logged in at the IDP' message is absent from all UD source (grepped, zero hits) - see new BD#140. UD has no IDP-mismatch-specific code path; any post-callback login rejection (including this one) surfaces as the same generic 390100 'Invalid credentials' failure, which the cited test already exercises."
    notes: "CORRECTION to a prior mapping pass: this was marked unmapped/'needs a new UD test', but should_fail_when_login_request_is_rejected_after_browser_callback (added May 2026, PR #1129 - predates this mapping session) already drives a successful browser callback followed by a login_failure() rejection, which is exactly the generic mechanism UD uses for this scenario. Writing a new test asserting the same generic rejection would be a near-duplicate; the real gap is the missing distinct message, now tracked as BD#140."
  - test_name: should throw error for wrong credentials
    ud_tests:
      - path: "odbc_tests/tests/integration/authentication/external_browser.cpp - should fail with timeout when no browser callback arrives"
      - path: "sf_core/tests/integration/authentication/external_browser.rs - should_fail_with_timeout_when_no_browser_callback_arrives"
    status: partial
    gaps:
      - "Old ODBC connection param BROWSER_RESPONSE_TIMEOUT not recognized by the universal driver (renamed to AUTHENTICATION_TIMEOUT) - see new BD#138"
      - "No UD test asserts the descriptive timeout message from SNOW-2004277; UD emits 'Authentication timeout exceeded (budget Ns)' and asserts only generic 'timeout'/'browser' substrings - message-wording covered under BD#138"
      - "Old test's failed-IdP-login scenario ('fail') is not distinctly modeled; UD models 'no callback -> timeout' (same terminal outcome: no valid token -> timeout)"
    notes: "Old 'wrong credentials' asserts the SAME two timeout strings as 'browser timeout' - a failed IdP login yields no callback and the driver times out. Maps to the same UD no-callback-timeout test. SNOW-2004277."
    jira: "SNOW-2004277"
