    - path: "odbc_tests/tests/odbc-api/terminating_statement/cancel_tests.cpp - SQLCancel: Cancel after fetch"
    status: partial
    gaps:
      - "Old test races a fetch-thread against a SQLCloseCursor-thread concurrently on the same statement (both Arrow and JSON result formats), accepting either HY008 (canceled mid-fetch) or HY010 (sequence error, if the race lost) as valid outcomes - a genuine concurrent-thread race. The cited tests exercise cancel/close after fetch sequentially, not the actual concurrent race; no UD test drives two threads against SQLFetch/SQLCloseCursor on the same handle simultaneously."
  - test_name: cancel with binding parameter array not supported by server
    ud_tests:
