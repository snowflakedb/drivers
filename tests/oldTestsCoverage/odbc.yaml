    status: partial
    gaps:
      - "Old test's core mechanism (async execute + cross-thread SQLCancel + eventual HY008) is covered by the cited test, which documents the exact same old-driver-vs-new-driver cancel_result divergence (BD#47) the old test's retry loop accommodates. The array-bound-parameter (SQL_ATTR_PARAMSET_SIZE) specific variant of the async-execute path is not separately exercised by any cancel test."
