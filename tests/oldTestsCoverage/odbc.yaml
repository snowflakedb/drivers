    gaps:
      - "Old test's specific assertion is a TIMING bound: SQLCloseCursor + SQLFreeHandle on a still-downloading 1M-row result must complete within 15 seconds (i.e. close must not block on the in-flight download). No UD test asserts a wall-clock bound on close-while-downloading; the cited tests prove close-during-fetch works, not that it's non-blocking within a time budget."
