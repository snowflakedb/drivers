    notes: "SNOW-2030491. CORRECTION to a prior mapping pass: the client-side half of this concern - 'rule out the new driver silently ignoring the mismatched username' - is already covered. pat_auth_payload_includes_authenticator (and pat_auth_without_user_omits_login_name) directly assert that sf_core/src/rest/snowflake/mod.rs's PAT branch (717-725) forwards whatever username is configured, unconditionally, as LOGIN_NAME - the client cannot and does not distinguish a mismatched username from a matching one, so it can't silently drop it. The residual gap is purely server-side: does GS actually reject a valid-PAT + wrong-username the way the old driver's 'Programmatic access token is invalid.' message implies. That needs live verification, not a new client-level unit test."
    jira: "SNOW-2030491"
  AuthenticationTests/WIFLatestTest/WIFLatestTest.cpp:
  - test_name: should authenticate using OIDC
    ud_tests:
      - path: sf_core/src/rest/snowflake/workload_identity/oidc.rs - valid_token_with_iss_sub
      - path: python/tests/integ/authentication/test_workload_identity_python_specific.py - test_should_forward_valid_oidc_token_past_param_validation
    status: partial
    gaps:
      - "No UD test performs a SUCCESSFUL OIDC WIF login with a real token - the old test's core assertion (SQLDriverConnect succeeds after fetching a GCP OIDC token). sf_core e2e OIDC tests are failure-only; the generic WIF happy-path never sets `token` so it cannot succeed for OIDC. Only JWT structural validation (oidc.rs) and token-forwarding-past-param-validation (python) are covered."
      - "No ODBC-wrapper test exercises the OIDC WIF connection-string path (Authenticator=workload_identity; WORKLOAD_IDENTITY_PROVIDER=OIDC; token=...)."
    notes: "WIF has ZERO ODBC-layer coverage; mapping is via sf_core inline + python integ only. OIDC signature is verified server-side, so a full-success OIDC e2e requires a live IdP token."
    jira: "SNOW-2160718"
  - test_name: should authenticate using wif with explicit provider
    ud_tests:
      - path: sf_core/tests/e2e/authentication/workload_identity.rs - should_authenticate_with_cloud_identity_using_wif
      - path: sf_core/tests/e2e/authentication/workload_identity.rs - should_authenticate_with_wif_using_lowercase_authenticator
      - path: python/tests/integ/authentication/test_workload_identity_python_specific.py - test_should_accept_all_four_wif_provider_strings
    status: partial
    gaps:
      - "Happy-path WIF auth is covered only at the sf_core layer (Rust e2e connect + SELECT 1). No ODBC-wrapper test verifies the ODBC DSN keywords (Authenticator=workload_identity, WORKLOAD_IDENTITY_PROVIDER) parse and plumb through SQLDriverConnect to sf_core."
    notes: "sf_core e2e covers + scope-expands the old assertion (adds SELECT 1) for AWS/AZURE/GCP auto-detected identities, incl. the lowercase-authenticator form the old connstring uses. Python tests assert provider-string acceptance only (connect_expecting_error, no live login). Considered but deferred: an ODBC-wrapper test asserting a full successful WIF login would need a real cloud identity attestation environment (AWS/Azure/GCP metadata service) to reach a genuine success outcome - anything short of that would just observe an attestation failure whose exact error text isn't grounded/verified anywhere in this codebase, so it wasn't safe to fabricate. The missing-provider validation path (client-side only, no cloud dependency) is now ODBC-covered instead - see 'shouldn't authenticate using wif without explicit provider' below."
  - test_name: shouldn't authenticate using wif without explicit provider
    ud_tests:
      - path: sf_core/src/config/connection_config.rs - validate_wif_missing_provider_reports_issue
      - path: sf_core/tests/e2e/authentication/workload_identity.rs - should_fail_workload_identity_when_provider_is_missing
      - path: python/tests/integ/authentication/test_workload_identity.py - test_should_fail_workload_identity_when_provider_is_missing
      - path: "odbc_tests/tests/integration/authentication/workload_identity_auth.cpp - should fail workload identity authentication when provider is missing"
    status: mapped
    notes: "Failure intent (missing provider -> error) covered at sf_core validation (inline + e2e) and python integ layers. SQLSTATE/message divergence = BehaviorDifference #1 (client-side config rejection: old 28000 -> new 01S00). The ODBC-layer SQLSTATE/message gap is now closed, mirroring the proven BD#1 missing-PRIV_KEY_FILE pattern (private_key_auth.cpp:77-88) - verified the old driver's exact message directly against Tests/AuthenticationTests/WIFLatestTest/WIFLatestTest.cpp:62 before writing the OLD_DRIVER_ONLY assertion."
    jira: "SNOW-2251257"
