    notes: "SNOW-2235959. Old test's single-file MFA+TOTP+cache flow is split across ODBC e2e (login + cache-reuse) and Rust core integration (7 wiremock tests: cache-hit, eviction on 5 EXT_AUTHN codes, DUO-push retry) - scope expansion, not reduction. See BD#137 for the CLIENT_REQUEST_MFA_TOKEN->CLIENT_STORE_TEMPORARY_CREDENTIAL rename this test's cache_attrs() depends on."
