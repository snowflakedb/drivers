# Alignment targets.
#
# Each [[target]] block pairs a Gherkin features directory with a
# language-specific test directory. The validator checks only scenarios
# tagged for the target's language (for python: @python, @python_e2e,
# @python_int, pep249). Untagged scenarios and scenarios tagged only
# for other languages are skipped.
#
# Paths are relative to the workspace root.

[[target]]
name     = "pandas-types"
language = "python"
features = "tests/definitions/shared/types"
tests    = "python/tests/e2e/pandas/types"

[[target]]
name     = "numpy-types"
language = "python"
features = "tests/definitions/shared/types"
tests    = "python/tests/e2e/numpy/types"
