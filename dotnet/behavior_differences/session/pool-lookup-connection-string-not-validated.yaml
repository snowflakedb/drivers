name: "Pool lookup does not validate the connection string"
status: unknown
type: api_incompatibility
reviewed: false
is_breaking_change: true
impact: medium
rationale: |
  Pool lookup reads only the pool keys so it can build a partition. Full
  connection validation happens in sf_core when a session opens, so a string
  that omits account or is otherwise invalid outside the pool keys still
  selects a partition.
old_driver_behavior: |
  GetPool parses the whole connection string and throws SnowflakeDbException
  when a required property such as account is missing. GetPool(null) and
  GetPool("") throw SnowflakeDbException 270006 MISSING_CONNECTION_PROPERTY for
  ACCOUNT. GetPool also rejects a missing USER or PASSWORD unless the
  authenticator is passwordless or username-less, and it rejects invalid TLS,
  proxy, CRL, account-name, and authenticator settings with SnowflakeDbException
  (270008, 270055, 270011).
new_driver_behavior: |
  GetPool and GetPoolPartition throw ArgumentNullException when the connection
  string is null. An invalid pool setting fails lookup. A string that omits
  account, or is otherwise invalid outside the pool keys, selects a partition
  and does not throw.
