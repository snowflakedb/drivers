name: "CERTREVOCATIONCHECKMODE is not recognized; use crl_check_mode"
status: unknown
type: api_incompatibility
reviewed: false
is_breaking_change: true
impact: low
old_driver_behavior: |
  The connection string accepts CERTREVOCATIONCHECKMODE with values ENABLED,
  ADVISORY, DISABLED, or NATIVE. That setting controls certificate revocation
  checking for the connection.
new_driver_behavior: |
  CERTREVOCATIONCHECKMODE is not a recognized connection parameter. Certificate
  revocation checking is controlled with crl_check_mode (ENABLED, ADVISORY, or
  DISABLED). A connection that sets only CERTREVOCATIONCHECKMODE leaves CRL
  checking at its default (DISABLED).
rationale: |
  The shared core uses crl_check_mode for every wrapper. The .NET wrapper does
  not map the old driver's CERTREVOCATIONCHECKMODE spelling onto that key.
