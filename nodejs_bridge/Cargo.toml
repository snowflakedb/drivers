[package]
name = "nodejs_bridge"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "nodejs_bridge"
crate-type = ["cdylib"]

[features]
# Links the FIPS-validated TLS backend (aws-lc-fips-sys) instead of aws-lc-sys.
# Covers TLS only, which is what the name says -- see the `fips-tls` feature
# comment in sf_core/Cargo.toml for why this is not a FIPS artifact on its own.
fips-tls = ["sf_core/fips-tls"]

[dependencies]
sf_core = { path = "../sf_core" }
sf_types = { path = "../sf_types" }
sf_output_format = { path = "../sf_output_format" }
napi = { version = "3", default-features = false, features = ["napi9", "async", "chrono_date"] }
napi-derive = "3"
arrow = { version = ">=54.0.0, <59" }
chrono = "0.4.43"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tracing = "0.1.41"
# `sync` only: the async mutex that serializes connect/destroy. The runtime
# itself comes from `sf_core`.
tokio = { version = "1.50.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }

[build-dependencies]
napi-build = "2"
