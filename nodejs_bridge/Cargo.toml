[package]
name = "nodejs_bridge"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "nodejs_bridge"
crate-type = ["cdylib"]

[features]
# Links the FIPS-mode crypto module (aws-lc-fips-sys) instead of
# aws-lc-sys for TLS, JWT signing, DPoP, stage file encryption and private-key
# parsing. This is not a validation or whole-driver FIPS compliance claim;
# see the `fips` feature comment in sf_core/Cargo.toml for remaining caveats.
fips = ["sf_core/fips"]

[dependencies]
sf_core = { path = "../sf_core" }
sf_output_format = { path = "../sf_output_format" }
sf_types = { path = "../sf_types" }
napi = { version = "3", default-features = false, features = ["napi9", "async", "chrono_date"] }
napi-derive = "3"
arrow = { version = ">=54.0.0, <59" }
chrono = "0.4.43"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tracing = "0.1.41"
# `sync`: the async mutex that serializes connect/destroy. `time`: polling
# sleep in wait_for_query_result. The runtime itself comes from `sf_core`.
tokio = { version = "1.50.0", features = ["sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }
chrono-tz = "0.10.4"

[dev-dependencies]
reqwest = { version = "0.12.23", default-features = false }
tokio = { version = "1.50.0", features = ["macros", "rt"] }

[build-dependencies]
napi-build = "2"
