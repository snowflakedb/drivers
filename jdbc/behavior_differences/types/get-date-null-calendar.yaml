name: "getDate(int, Calendar) tolerates a null Calendar (the old driver throws NullPointerException)"
status: allowed
type: bugfix
reviewed: true
is_breaking_change: false
impact: low
status_rationale: |
  getDate(column, null) throws NullPointerException on the old driver and returns
  the stored calendar day on the new driver. The new driver does not apply the JVM
  default timezone.
legacy_id: 8
