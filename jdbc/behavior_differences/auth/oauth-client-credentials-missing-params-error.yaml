name: "OAUTH_CLIENT_CREDENTIALS missing-parameter error text"
status: allowed
type: enhancement
reviewed: true
impact: low
is_breaking_change: true
status_rationale: |
  Both drivers reject a missing client id, secret, or token URL at connect. The old
  driver reports the first gap as vendor 200001 ("passing oauthClientId is required").
  The new driver names every missing oauth_client_id, oauth_client_secret, and
  oauth_token_request_url in one error. An empty string fails locally on the new
  driver and is sent to the token endpoint on the old driver.
legacy_id: 6
