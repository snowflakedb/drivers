name: "HTTP attempts use a 300-second wall-clock timeout instead of socket inactivity"
status: allowed
type: api_incompatibility
reviewed: false
is_breaking_change: true
impact: low
old_driver_behavior: |
  `HTTP_CLIENT_SOCKET_TIMEOUT` defaults to 300000 ms and limits the wait for the next
  packet, result-chunk downloads included, so a transfer runs past 300 seconds as long as
  data keeps arriving.
new_driver_behavior: |
  `retry_timeout` defaults to 300 seconds and bounds each ordinary HTTP attempt from its
  start until the response body finishes; arriving bytes do not extend it, and `0` removes
  the limit. `HTTP_CLIENT_SOCKET_TIMEOUT` is its JDBC alias. Result-chunk downloads are not
  bounded by it. They use an inactivity timeout instead, which limits the wait for response
  headers and for each next piece of the body, and retries the chunk with backoff when it
  expires. That timeout is `chunkDownloadReadTimeout` in seconds when set, otherwise an
  explicitly set `HTTP_CLIENT_SOCKET_TIMEOUT`, otherwise 30 seconds. `0` or a negative
  value disables the timer and also disables retries of a body that fails mid-download.
  The timeout error names `chunkDownloadReadTimeout`.
description: |
  A login or query attempt whose response body takes more than five minutes fails where it
  previously completed. A result chunk that stops sending data fails after its retries once
  30 seconds pass without data, where the old driver waited 300 seconds per packet; setting
  `HTTP_CLIENT_SOCKET_TIMEOUT` explicitly restores the old wait for chunks. The
  millisecond-to-second conversion of the alias is BD#78.
status_rationale: |
  Accepted. The default duration is the same on both drivers; what differs is the model — a
  per-attempt wall-clock cap rather than an inactivity timer that resets on every packet —
  and the new driver has no per-packet timer to reproduce outside result-chunk downloads.
legacy_id: 77
