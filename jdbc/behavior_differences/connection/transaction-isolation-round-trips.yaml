name: "Connection.getTransactionIsolation() always returns READ_COMMITTED; the old driver round-trips the set value and defaults to NONE"
status: fixed
type: bugfix
reviewed: true
is_breaking_change: false
impact: low
status_rationale: |
  Restored the old driver's semantics: transactionIsolation defaults to TRANSACTION_NONE,
  setTransactionIsolation stores NONE or READ_COMMITTED, and getTransactionIsolation returns the
  cached value.
