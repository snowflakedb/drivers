plugins {
    id 'java'
}

group = 'com.snowflake'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation 'org.apache.thrift:libthrift:0.22.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.json:json:20240303'

    // Arrow dependencies used by SnowflakeResultSet
    // IPC classes live in arrow-vector module per docs:
    // https://arrow.apache.org/java/main/reference/org.apache.arrow.vector/org/apache/arrow/vector/ipc/package-summary.html
    implementation 'org.apache.arrow:arrow-vector:17.0.0'
    implementation 'org.apache.arrow:arrow-memory-core:17.0.0'
    implementation 'org.apache.arrow:arrow-format:17.0.0'
    implementation 'org.apache.arrow:arrow-c-data:17.0.0'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


