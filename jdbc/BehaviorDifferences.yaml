# Behavioral Differences between the new (universal) JDBC driver and the old (legacy) JDBC driver.
#
# Allowed statuses:
#  - unknown (default): status is not yet determined
#  - todo: BD has to be fixed
#  - fixed: BD has been addressed, removing the difference between the old and new driver
#  - allowed: the change is expected and is accepted
#
# Allowed types:
#  - unknown (default): type is not yet determined
#  - api_incompatibility: the new driver removes support for a functionality
#  - bug: the new driver has a bug/incompatibility relative to the old driver
#  - bugfix: the new driver fixes incorrect old-driver behavior (e.g. non-compliance with the JDBC specification)
#  - enhancement: the new driver extends or improves existing functionality
#
# Reviewed:
#  - true: the BD has been reviewed and its status is accepted
#  - false (default): the BD has not yet been reviewed
#
# status_rationale (required when reviewed is true):
#  Explain why this entry has the chosen 'status'. Type and behavior deltas alone often do not
#  imply whether we intend to ship the difference, regress compatibility, track a fix, etc.

behavior_differences:
  1:
    name: "DataSource rejects PAT authentication without password"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      The old driver's DataSource.getConnection() unconditionally requires a password for all
      authenticators except SNOWFLAKE_JWT and EXTERNALBROWSER. This prevents PAT (Programmatic
      Access Token) authentication via DataSource even though setToken() and setAuthenticator()
      exist. The new driver correctly allows token-based authentication without a password.
  2:
    name: "Statement.executeBatch update-count int overflow"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      The old driver throws SnowflakeSQLLoggedException(EXECUTE_BATCH_INTEGER_OVERFLOW,
      NUMERIC_VALUE_OUT_OF_RANGE) for any per-row count that exceeds Integer.MAX_VALUE in
      executeBatch(). The new driver maps such counts to Statement.SUCCESS_NO_INFO so the
      batch result array stays valid and length-correct; callers wanting full fidelity should
      use executeLargeBatch().
  3:
    name: "getBatchQueryIDs positional alignment with updateCounts"
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      In the old driver, Statement.executeBatch's success branch is the only place that appends
      to batchQueryIDs, so failed entries skip the append and the resulting list is shorter than
      updateCounts (positional alignment broken). The new driver always appends, using null for
      failed entries, so callers can correlate updateCounts[i] with batchQueryIDs.get(i).
      For the PreparedStatement array-bind path, the old driver does not populate batchQueryIDs
      at all; the new driver appends a single entry covering the whole batch (or null on RPC
      failure).
  4:
    name: "executeBatch resets current-result state on return"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      Per JDBC spec, after Statement.executeBatch() the statement should have no current result
      (getResultSet() returns null, getUpdateCount() returns -1). The old driver leaves
      currentResultSet / currentUpdateCount populated by the last batched entry. The new driver
      resets both in finalizeBatch.
  5:
    name: "MFA token caching parameter consolidated; clientRequestMfaToken removed"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      The old driver exposed two distinct properties for credential caching:
        - `clientRequestMfaToken` (setEnableClientRequestMfaToken) — MFA-token cache for
          USERNAME_PASSWORD_MFA.
        - `clientStoreTemporaryCredential` (setEnableClientStoreTemporaryCredential) — ID-token
          cache for EXTERNALBROWSER (and OAuth flows).
      The new driver consolidates both into a single `clientStoreTemporaryCredential` connection
      property whose effect is dispatched per active authenticator (caches MFA token under
      USERNAME_PASSWORD_MFA, ID token under EXTERNALBROWSER, refresh token under
      OAUTH_AUTHORIZATION_CODE). Consequently the new driver does not expose
      `setEnableClientRequestMfaToken` on `SnowflakeDataSource`, and the legacy
      `clientRequestMfaToken` property name is not accepted as an alias — callers that previously
      relied on the legacy method or property must migrate to `clientStoreTemporaryCredential`.
      Mirrors the cross-driver consolidation documented as `BD#16` in
      `python/BehaviorDifferences.yaml`.
  6:
    name: "OAUTH_CLIENT_CREDENTIALS offline required-parameter validation"
    status: unknown
    type: enhancement
    reviewed: false
    impact: high
    is_breaking_change: true
    status_rationale: |
      The universal driver routes OAUTH_CLIENT_CREDENTIALS through sf_core, which rejects missing
      oauth_client_id, oauth_client_secret, and oauth_token_request_url synchronously at connect
      time. The old driver does not surface the same offline validation or error text.
  7:
    name: "DATE bind tolerates MON-bearing DATE_OUTPUT_FORMAT (legacy throws at prepare)"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      When the session DATE_OUTPUT_FORMAT contains the MON element (e.g. "DD-MON-YYYY" or
      "DY, DD MON YYYY"), the old driver throws java.lang.IllegalArgumentException
      ("Illegal pattern character 'O'") at prepareStatement time for any statement with a DATE
      result column (e.g. SELECT ?::DATE) — regardless of the bind setter used (it fails before
      any value is bound). The crash comes from the old driver's prepare/describe path eagerly
      building a java.text.SimpleDateFormat from a mis-translated pattern, even though its read
      path translates the same MON format correctly (MON -> MMM). MON is a valid Snowflake format
      element and both drivers read/render "DD-MON-YYYY" identically (READ parity passes).

      The universal driver does not parse output formats at prepareStatement time (no describe
      round-trip), so it prepares and binds successfully. The bound DATE value is
      format-independent (epoch-millis), and read-back rendering uses the same
      SnowflakeDateTimeFormat already proven correct on the read path, so the universal driver's
      MON-format DATE writes are correct. Replicating the old driver's exception would mean
      re-introducing a crash for a valid format, so the difference is accepted as a bugfix.
  8:
    name: "getDate(int, Calendar) tolerates a null Calendar (legacy NPEs)"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      snowflake-jdbc's SnowflakeBaseResultSet.getDate(int, Calendar) threads cal.getTimeZone()
      into the converter and dereferences the Calendar unconditionally, so passing a null Calendar
      throws NullPointerException. The JDBC spec permits a null Calendar for ResultSet.getDate
      (meaning "use the default timezone"), so the legacy NPE is non-compliant. The universal
      driver treats a null Calendar as "no timezone" (raw epoch-day date) and returns the value
      instead of throwing. Replicating the legacy NPE would re-introduce a crash for a spec-allowed
      argument, so the difference is accepted as a bugfix.
  9:
    name: "TIME->boolean conversion error uses lowercase type token for INT-backed TIME"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      getBoolean on INT-backed TIME throws INVALID_VALUE_CONVERT with "type:boolean" where legacy
      renders "type:Boolean"; the universal driver normalizes legacy's Int/BigIntToTimeConverter
      casing inconsistency, so the lowercase token is accepted.
  10:
    name: "OAuth token/authorization endpoint URLs must use HTTPS (non-loopback http rejected)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      The old JDBC driver passes `oauthTokenRequestUrl` / `oauthAuthorizationUrl` into the Nimbus
      OAuth SDK without scheme validation; an `http://` endpoint only logs a warning
      (`logIfHttpInUse`) and the request proceeds. The universal driver routes these URLs through
      sf_core, which requires the `https` scheme and rejects a non-loopback `http://` value at
      connect time, permitting `http://` only for loopback hosts (127.0.0.0/8, ::1, localhost) for
      local testing. This is a deliberate, accepted divergence: HTTPS on these endpoints is already
      required by RFC 6749 §3.1.2.1 and the OAuth 2.0 Security BCP, and the old driver merely warns.
      The loopback redirect URI used by the authorization-code flow is unaffected. Callers that
      configured a plaintext `http://` IdP token endpoint must switch to `https://`. Security
      hardening tracked under SNOW-3663588; mirrors BD#38 in python/ and BD#81 in odbc_tests/
      BehaviorDifferences.yaml.
  11:
    name: "addBatch rejects rows with missing placeholder values"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      The old driver's PreparedStatement.addBatch() iterates only the parameters that have been
      set on the current row and merges them column-wise into the batch, with no check that every
      placeholder has a value. A row that is missing one or more placeholder bindings is silently
      added, producing an inconsistent batch (columns with different row counts) which then
      either fails at the server or applies stale per-column state. The new driver validates at
      addBatch() time via BatchColumnValidator and throws SnowflakeSQLException("Missing value
      for parameter index: N") so the offending row is rejected at the call site.
  12:
    name: "JDBC wrapper interface is correctly implemented"
    status: unknown
    type: enhancement
    reviewed: false
    impact: low
    is_breaking_change: false
    status_rationale: |
      The old driver implements java.sql.Wrapper inconsistently - some classes support
      isWrapperFor/unwrap while others throw SQLFeatureNotSupportedException.
      The new driver applies DelegatingWrapper everywhere the interface is applicable,
      so extension access works uniformly.
  13:
    name: "SnowflakeClob.setString overwrites in-place; legacy driver inserts at position"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    status_rationale: |
      The legacy snowflake-jdbc SnowflakeClob implements setString via StringBuffer.insert at the
      1-based position, shifting trailing content. The universal driver's SnowflakeClob replaces
      the character range starting at that position (JDBC Clob contract: write starting at pos,
      not insert). Example: starting from "hello world", setString(1, "HELLO") yields
      "HELLO world" (new) vs "HELLOhello world" (old). Pooling/createClob paths only append from
      an empty Clob today; middle overwrite is not required for #387 but the semantic gap is
      documented for follow-up alignment review.
  14:
    name: "SnowflakeClob.setAsciiStream / setCharacterStream ported from legacy driver"
    status: fixed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Legacy snowflake-jdbc SnowflakeClob exposes setAsciiStream and setCharacterStream via small
      StringBuffer-backed stream helpers. The universal driver now ports a minimal subset for the
      pooling phase: append/replace ASCII bytes and append-on-flush character writes. Full parity
      review (position semantics, mid-buffer overwrite edge cases) is deferred; createClob +
      setString/setClob remain the primary pooling path in #387.
  15:
    name: "SnowflakeClob.free invalidates handle; legacy driver clears buffer and keeps Clob usable"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      JDBC requires that after Clob.free() the object is invalid and subsequent method calls
      throw SQLException. The universal driver nulls its buffer and rejects further access.
      Legacy snowflake-jdbc assigns buffer = new StringBuffer(), leaving a usable (empty) Clob.
      The universal behavior matches the spec; callers depending on post-free reuse on the old
      driver must allocate a fresh Clob.
  16:
    name: "SnowflakeClob.position returns 1-based index; legacy driver returns 0-based index"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      JDBC specifies that position returns the position at which the search string appears,
      using a 1-based index (or -1 if not found). The universal driver returns index + 1.
      Legacy snowflake-jdbc returns StringBuffer.lastIndexOf directly (0-based). Example:
      position("world", 1) on "hello world" returns 7 (new) vs 6 (old).
  17:
    name: "SnowflakeClob.setString(pos, str, offset, len) treats len as count; legacy uses len as end index"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      JDBC Clob.setString(pos, str, offset, len) defines len as the number of characters to copy
      starting at offset inside str. The universal driver uses str.substring(offset, offset + len).
      Legacy snowflake-jdbc uses str.substring(offset, len), treating len as the exclusive end
      index in str — a Java substring(begin, end) misuse that only matches the spec when
      offset == 0 (because substring(0, len) equals substring(0, 0 + len)).

      When offset > 0 the drivers diverge. Examples writing at Clob position 1:
        - setString(1, "XXhelloYY", 2, 5): new -> "hello" (5 chars from offset 2); old -> "hel"
          (substring(2, 5), three characters ending before the second "l").
        - setString(1, "abcdef", 1, 4): new -> "bcde"; old -> "bcd" (substring(1, 4)).

      The universal driver fixes the legacy bug; callers that accidentally relied on the old
      end-index semantics need to adjust len when offset > 0.
  18:
    name: "Connection.getTransactionIsolation() always returns READ_COMMITTED; legacy round-trips the set value and defaults to NONE"
    status: fixed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Restored legacy snowflake-jdbc semantics: transactionIsolation defaults to TRANSACTION_NONE,
      setTransactionIsolation stores NONE or READ_COMMITTED, and getTransactionIsolation returns the
      cached value.
  19:
    name: "DatabaseMetaData: getFunctionColumns used raw (pre-session-resolved) catalog/schema in result rows"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Result rows used the original null catalog/schema params instead of session-resolved values;
      null catalog yielded null FUNCTION_CAT even when session context had a real database.
  20:
    name: "getFunctionColumns FUNCTION_SCHEM uses actual SHOW-row schema; legacy echoes the input schema pattern"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Legacy snowflake-jdbc populates the FUNCTION_SCHEM column of getFunctionColumns from the input
      schemaPattern argument (a pre-existing bug), so a wildcard/pattern leaks into the result instead
      of the function's real schema. The universal driver uses schema_name from the SHOW FUNCTIONS
      result row, so FUNCTION_SCHEM reflects each function's actual schema.
  21:
    name: "ResultSet.isLast() works on query-backed DatabaseMetaData result sets; legacy throws"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Legacy snowflake-jdbc returns query-backed metadata result sets (getSchemas, getTables, etc.)
      as SnowflakeDatabaseMetaDataQueryResultSet, whose isLast() throws
      SnowflakeLoggedFeatureNotSupportedException. The universal driver routes every result set
      through one RowReader stack, so isLast() returns a correct boolean uniformly.
  22:
    name: "setClientInfo on closed connection throws SQLClientInfoException with CONNECTION_CLOSED"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Per JDBC, setClientInfo must throw SQLClientInfoException and populate failedProperties for
      every property that could not be set. On a closed connection the universal driver throws
      SQLClientInfoException carrying SQLSTATE 08003 / vendor code 200052 with
      REASON_UNKNOWN_PROPERTY entries, matching legacy snowflake-jdbc closed-state setClientInfo
      behavior (including when the property set is empty/null, where JDBC otherwise allows normal
      completion on an open connection).
  23:
    name: "setClientInfo(null) on open connection completes normally; legacy throws NullPointerException"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Legacy snowflake-jdbc setClientInfo(Properties) dereferences properties.propertyNames()
      unconditionally and throws NullPointerException when properties is null. The JDBC contract
      treats a null argument as an empty property set, so the universal driver returns normally on an
      open connection. Closed connections still throw SQLClientInfoException with CONNECTION_CLOSED.
  24:
    name: "Statement.getQueryID() after a synchronous multistatement returns the parent query ID; legacy returns the first child's query ID"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      After a synchronous multistatement execute, legacy snowflake-jdbc's getQueryID() returns the
      FIRST CHILD's ID: SFStatement.execute auto-advances to the first child (via getMoreResults())
      and never updates queryID afterward, leaving the parent (SYSTEM$MULTISTMT) ID unreachable. The
      universal driver returns the PARENT ID (applyMultiStatementResult sets it from
      MultiStatementState.getParentQueryId()), stable across iteration. Both drivers return the
      parent in the async flow. Returning the parent is intentional and consistent with the Python
      wrapper the state model was ported from. Introduced in SNOW-2881690 (#819).

      Consequence for the test suite: shouldReturnChildQueryIdsForMultistatementQuery calls
      getChildQueryIds(getQueryID()), so it consumes this difference — the parent ID expands to 3
      children on the universal driver, the first child's ID to length 1 on legacy — and is therefore
      @SkipOldDriver("BD#24"). getChildQueryIds itself has parity given the same query ID.
  25:
    name: "Failed GET download no longer leaves a partial or corrupt file at the destination"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      The legacy driver wrote GET output directly to the destination (decrypting in place) with
      no staging file and no cleanup, so a failed or interrupted transfer left a truncated/corrupt
      file at the destination. The universal driver's atomic `.part`-then-rename prevents any
      partial file from ever appearing at the destination. The improvement is accepted.
    old_driver_behavior: |
      The legacy snowflake-jdbc driver writes downloaded bytes straight to the final destination
      path — there is no `.part`/staging file and no rename-on-success (SnowflakeS3Client /
      SnowflakeAzureClient / SnowflakeGCSClient `download(...)`). Encrypted files are decrypted in
      place on that same destination file (`EncryptionProvider.decrypt`). On a mid-transfer failure
      (network error, decryption failure) nothing deletes the partial file, and GET performs no
      post-download digest verification — so a truncated or corrupt file is left at the destination
      path, where a subsequent read sees inconsistent data. The caller must detect the failure,
      delete the file, and retry manually.
    new_driver_behavior: |
      GET downloads assemble into a sibling `<dst>.part` staging file and rename it to the final
      destination only after the transfer completes successfully (and, for client-side-encrypted
      files, only after the SHA-256 content digest verifies). The user-visible destination path is
      therefore only ever a complete file; a failed or interrupted download never publishes partial
      or corrupt data there. On failure the driver drains any in-flight chunk writes and then
      removes the `.part` staging file, so a failed download leaves the filesystem clean. (A
      client-side-encrypted download stages ciphertext in a separate temporary file that is likewise
      removed on failure and unlinked once decrypted.) The only residue possible is after a hard
      process kill (SIGKILL / power loss), where at most a single `<dst>.part` can remain —
      self-documenting, and overwritten by the next download of the same file rather than
      accumulating. The contract is cloud-generic (S3, Azure, and GCS).
  40:
    name: "LogicalConnection.abort() closes the logical handle and notifies the pool"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      LogicalConnection.abort(Executor) delegates to the physical connection's abort() but leaves
      the logical handle's isClosed flag false and fires no ConnectionEventListener callback. After
      abort, isClosed() returns false and the PooledConnection's listeners are never told the
      physical connection is gone, so a pool manager may keep handing out a dead connection. A
      stale logical handle can also abort a physical connection that was already returned to the
      pool by a prior close().
    new_driver_behavior: |
      The logical handle is claimed closed via compareAndSet before the physical connection is
      touched, closing a race with a concurrent close(). abort() on an already-closed logical handle
      is a no-op. A successful abort() leaves the handle closed and fires connectionErrorOccurred so
      the pool manager EVICTS the now-dead physical connection. connectionClosed is deliberately not
      used: in the javax.sql pooling contract connectionClosed means the logical handle was closed
      normally and the physical connection is idle and reusable, so firing it after abort would leave
      a standard pool handing out a dead connection on every subsequent borrow; only
      connectionErrorOccurred instructs the pool to discard the connection. There are two outcomes if
      the physical abort() throws:
        - SQLFeatureNotSupportedException: the physical connection was left untouched, so the handle
          is reopened (isClosed() returns false again) and no pool event fires.
        - any other SQLException: the physical connection is now dead, so the handle stays closed,
          connectionErrorOccurred fires (never connectionClosed), and a subsequent close() is a no-op
          so the dead connection cannot be recycled into the pool.
      Concurrency note: the reopen on an unsupported abort (isClosed flipped back to false) is
      best-effort; JDBC Connections are not required to be thread-safe, so concurrently invoking
      abort() and close() on the same logical handle is undefined.
    description: |
      Aligns LogicalConnection with the JDBC Connection.abort() contract ("the connection will be
      marked as closed") and with javax.sql pooling lifecycle expectations, while preventing a
      concurrent close() from recycling a connection that abort() is tearing down.
    status_rationale: |
      Intentional correctness fix. Pool managers rely on close/error events to reclaim physical
      connections; the old behavior could leak or hand out aborted connections. A successful abort
      signals connectionErrorOccurred (not connectionClosed) because the javax.sql contract only
      evicts a pooled connection on an error event - a close event would mark the dead connection
      reusable.
  26:
    name: "Unsupported logical-connection features no longer fire connectionErrorOccurred"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      Every SQLException thrown by a delegated Connection method on a LogicalConnection — including
      SQLFeatureNotSupportedException for unimplemented JDBC features — triggers
      ConnectionEventListener.connectionErrorOccurred on the owning PooledConnection.
    new_driver_behavior: |
      SQLFeatureNotSupportedException is rethrown without firing connectionErrorOccurred. Genuine
      connection failures (other SQLExceptions) still fire the error event.
    description: |
      connectionErrorOccurred signals a broken physical connection, and pool managers typically
      evict the connection when they receive it. Invoking an unsupported JDBC feature is a caller
      mistake, not a connection failure, and must not cause a healthy pooled connection to be
      discarded.
    status_rationale: |
      Intentional fix to avoid spurious pool eviction/churn when applications probe JDBC
      capabilities on a pooled logical connection.
  27:
    name: "PooledConnection.getConnection() after close() throws SQLException instead of NPE"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After SnowflakePooledConnection.close() the physical connection reference is null; a
      subsequent getConnection() dereferences it and throws an unchecked NullPointerException.
    new_driver_behavior: |
      getConnection() throws a SnowflakeSQLException with error code CONNECTION_CLOSED (200052 /
      SQLSTATE 08003) whenever the physical connection is unavailable - both after
      PooledConnection.close() (reference cleared) and when the physical connection is already dead
      (e.g. after a logical abort()). The legacy driver has no guard: after PooledConnection.close()
      it throws a NullPointerException, and after a logical abort() it still hands back a logical
      connection that is already closed.
    description: |
      Provides a checked, diagnosable JDBC error instead of an unchecked NPE (or a silently dead
      handle) for callers that borrow from a no-longer-usable PooledConnection.
    status_rationale: |
      Intentional fix; the failure mode is now a proper SQLException consistent with other
      closed-resource paths.
  28:
    name: "Connection event listener exceptions are isolated during event dispatch"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      fireConnectionCloseEvent / fireConnectionErrorEvent iterate listeners (stored in a HashSet)
      with no exception handling, so a listener that throws aborts dispatch to the remaining
      listeners and can propagate into the caller's close() or operation path.
    new_driver_behavior: |
      Each listener callback is wrapped; a RuntimeException from one listener is logged and dispatch
      continues to the remaining listeners. Listeners are held in a CopyOnWriteArraySet for safe
      iteration under concurrent registration.
    description: |
      Ensures one misbehaving ConnectionEventListener cannot break pool bookkeeping or the
      application's close path.
    status_rationale: |
      Intentional robustness improvement; event delivery is now best-effort and isolated per
      listener.
  29:
    name: "LogicalConnection enforces closed-state on client-info access"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      setClientInfo and getClientInfo(String) on a LogicalConnection delegate to the physical
      connection with no closed-state guard (the no-arg getClientInfo() was already guarded).
    new_driver_behavior: |
      setClientInfo(String,String) and setClientInfo(Properties) on a closed logical handle throw
      SQLClientInfoException carrying SQLSTATE 08003 / vendor code 200052 (CONNECTION_CLOSED), with
      failedProperties populated for every property that could not be set (the single-key overload
      reports that one name; the Properties overload reports every key). getClientInfo(String) and
      getClientInfo() on a closed logical handle throw SnowflakeSQLException(CONNECTION_CLOSED)
      (200052 / 08003). The physical SnowflakeConnectionImpl reports the same codes and
      failedProperties on its closed-state setClientInfo paths; its closed-state getClientInfo paths
      throw a plain SQLException("Connection is closed") via checkClosed() (no SQLState/vendor code).
      Open handles delegate as before.
    description: |
      Closed logical connections must reject operations per the JDBC Connection contract.
    status_rationale: |
      Intentional fix for closed-handle correctness, consistent with the other closed-state checks
      on LogicalConnection.
  30:
    name: "Logical connection is marked closed before the close event is fired"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      LogicalConnection.close() fires connectionClosed and then sets isClosed = true, so a listener
      callback that inspects the handle observes isClosed() == false, and a re-entrant close() from
      a listener can fire the close event more than once.
    new_driver_behavior: |
      close() sets isClosed = true before firing connectionClosed, guaranteeing idempotency and
      preventing duplicate events from re-entrant listener callbacks.
    description: |
      Makes logical close idempotent and re-entrancy-safe; the close event still fires exactly once.
    status_rationale: |
      Intentional fix; trades the legacy event-then-flag ordering for a consistently-closed handle
      during listener callbacks.
  31:
    name: "SnowflakeConnectionPoolDataSource exposes a reduced DataSource configuration surface"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      The legacy ConnectionPoolDataSource extends a SnowflakeDataSource that exposes a large
      configuration surface (50+ setters covering tracing, proxy host/port, put/get, diagnostics,
      arrow/result-format toggles, setEnableClientRequestMfaToken, and many other knobs).
    new_driver_behavior: |
      SnowflakeConnectionPoolDataSource extends the universal driver's SnowflakeDataSource, which
      currently exposes only the core connection-configuration setters. Callers that configured a
      pooled DataSource through legacy-only setters must set the equivalent connection property
      instead, where one exists.
    description: |
      The pooled DataSource inherits the universal SnowflakeDataSource API; this entry tracks the
      pooling-visible portion of the broader DataSource API reduction. MFA-token consolidation is
      tracked separately as BD#5.
    status_rationale: |
      Not yet reviewed. The reduced surface is a deliberate simplification, but the full set of
      dropped setters and their property equivalents needs an explicit compatibility decision.
  32:
    name: "setClientInfo failures no longer fire connectionErrorOccurred"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      LogicalConnection.setClientInfo and getClientInfo wrap the physical delegate and fire
      connectionErrorOccurred on any SQLClientInfoException before rethrowing.
    new_driver_behavior: |
      On an open handle, whenever the physical delegate raises a SQLClientInfoException it is
      rethrown without firing connectionErrorOccurred. This is the generic pooling-layer plumbing:
      setClientInfo delegates directly, and getClientInfo routes through callOnPhysical, which
      exempts SQLClientInfoException. On an open handle with the current Snowflake physical
      connection the only delegate path that actually raises SQLClientInfoException is setClientInfo
      on an unknown/unsupported property name (closed-handle client-info paths are covered by BD#29);
      getClientInfo on Snowflake never throws SQLClientInfoException (getClientInfo(String)
      returns null and getClientInfo() returns an empty Properties), so the getClientInfo exemption
      is forward-looking (it matters for other delegates/mocks). A SQLClientInfoException
      reports that a client-info property could not be set - a caller/property error, not a broken
      physical connection - so a healthy pooled connection is no longer evicted. Mirrors the
      SQLFeatureNotSupportedException handling documented in BD#26. (Closed-handle client-info
      behavior is separate and covered by BD#29: setClientInfo throws SQLClientInfoException with
      CONNECTION_CLOSED, while getClientInfo throws SnowflakeSQLException(CONNECTION_CLOSED).)
    description: |
      connectionErrorOccurred signals a dead physical connection and typically triggers pool
      eviction; a rejected client-info property must not cause that.
    status_rationale: |
      Intentional fix to avoid spurious pool eviction/churn when applications set client-info
      properties on a pooled logical connection.
  33:
    name: "Closed logical connection rejects unwrap/isWrapperFor"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      LogicalConnection.unwrap / isWrapperFor delegate to the physical connection with no
      closed-state guard, so a logically closed handle (already returned to the pool) can still
      unwrap and operate on the live physical connection, defeating checkout/return isolation.
    new_driver_behavior: |
      unwrap and isWrapperFor call throwExceptionIfClosed() first; on a closed logical handle they
      throw SnowflakeSQLException(CONNECTION_CLOSED) instead of exposing the physical connection.
    description: |
      Enforces the JDBC closed-connection contract uniformly across the wrapper API and prevents a
      returned handle from reaching the pooled physical connection.
    status_rationale: |
      Intentional fix for closed-handle correctness, consistent with the other closed-state checks
      on LogicalConnection.
  34:
    name: "isValid() on a closed logical connection returns false without throwing"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      LogicalConnection.isValid(int) delegates to the physical connection with no closed-state guard,
      so a logically closed handle (already returned to the pool) can probe and report the still-open
      pooled physical connection as valid, defeating checkout/return isolation.
    new_driver_behavior: |
      isValid(int) checks the logical closed flag first and returns false when the handle is closed,
      without throwing and without firing connectionErrorOccurred. On an open handle it delegates to
      the physical connection. Note the asymmetry on the open-handle path: a heartbeat/liveness
      failure makes SnowflakeConnectionImpl.isValid() return false without throwing, so it fires no
      connectionErrorOccurred; only a delegating SQLException (e.g. the negative-timeout argument
      error mandated by Connection.isValid(int)) fires connectionErrorOccurred and propagates.
    description: |
      Matches the JDBC Connection.isValid() contract (a closed connection is not valid and the method
      must not throw) and prevents a returned handle from reporting liveness of the pooled physical
      connection.
    status_rationale: |
      Intentional fix for closed-handle correctness, consistent with the other closed-state checks
      on LogicalConnection.
  35:
    name: "unwrap/isWrapperFor failures no longer fire connectionErrorOccurred"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      LogicalConnection.unwrap and isWrapperFor route their physical delegation through the shared
      error-event helper, so any SQLException thrown while resolving the requested type (e.g.
      unwrapping to an unsupported interface) fires connectionErrorOccurred on the owning
      PooledConnection.
    new_driver_behavior: |
      On an open handle, unwrap and isWrapperFor delegate directly to the physical connection (after
      the closed-state guard from BD#33) and rethrow any SQLException without firing
      connectionErrorOccurred. A failed type resolution is a caller/type mistake, not a broken
      physical connection. Mirrors the SQLFeatureNotSupportedException and SQLClientInfoException
      handling documented in BD#26 and BD#32.
    description: |
      connectionErrorOccurred signals a dead physical connection and typically triggers pool
      eviction; a caller asking to unwrap to an unsupported type must not cause a healthy pooled
      connection to be discarded.
    status_rationale: |
      Intentional fix to avoid spurious pool eviction/churn when applications probe wrapper types on
      a pooled logical connection.
  36:
    name: "PooledConnection.getConnection() invalidates the previously returned logical handle"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      SnowflakePooledConnection.getConnection() minted a new LogicalConnection on each call without
      tracking or invalidating any previously returned, still-open handle, so two logical handles
      could simultaneously drive the same physical session. When the stale handle was later closed it
      fired connectionClosed, signalling the pool that the physical connection was idle while the
      second handle was still using it.
    new_driver_behavior: |
      getConnection() tracks the currently-issued logical handle and, when a new handle is borrowed
      while a prior one is still open, silently invalidates the prior handle (marks it closed without
      firing connectionClosed, since this is internal reclamation rather than an application close).
      Subsequent operations on the invalidated handle fail with CONNECTION_CLOSED. This honors the
      javax.sql.PooledConnection contract that at most one active logical handle exists per pooled
      connection at a time.
    description: |
      Prevents two logical handles from sharing one physical session and the resulting spurious
      pool lifecycle signals.
    status_rationale: |
      Intentional correctness fix aligning with the javax.sql pooling contract.
  37:
    name: "LogicalConnection uniformly enforces closed-state on all Connection methods; legacy does not"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy snowflake-jdbc logical connection does not uniformly reject operations after the
      logical handle is closed: some java.sql.Connection methods (e.g. certain getters and
      statement/metadata factory methods) still delegate to the pooled physical connection instead
      of throwing, so a returned-to-pool handle can keep operating on a live physical session. The
      individually surprising cases are documented separately (client-info BD#29, unwrap/isWrapperFor
      BD#33, isValid BD#34).
    new_driver_behavior: |
      Nearly every operational java.sql.Connection method on a closed LogicalConnection first calls
      throwExceptionIfClosed() and throws SnowflakeSQLException(CONNECTION_CLOSED) (200052 / 08003),
      so a closed logical handle uniformly rejects operations. The few methods with contract-mandated
      closed-state behavior differ deliberately and are documented separately: isValid() returns false
      without throwing (BD#34), setClientInfo() throws SQLClientInfoException carrying the same
      CONNECTION_CLOSED code (BD#29), and close()/isClosed()/abort() are idempotent no-ops. Because the
      legacy driver does not enforce closed-state uniformly, the cross-driver reference tests assert the
      CONNECTION_CLOSED code only on the universal driver (PoolingTestCompat.assertThrowsConnectionClosed
      is a no-op on the legacy reference driver) rather than forcing an assertion the legacy driver would
      not satisfy.
    description: |
      Documents the blanket closed-state enforcement divergence that justifies gating the
      closed-state reference assertions to the universal driver.
    status_rationale: |
      Intentional correctness fix; a logically-closed handle must not reach the pooled physical
      connection. Matches the JDBC Connection closed-state contract.
  38:
    name: "Pooled DataSource is not JNDI Referenceable; legacy exposed a JNDI ObjectFactory"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      The legacy snowflake-jdbc shipped a JNDI ObjectFactory (SnowflakeConnectionPoolDataSourceFactory)
      and Referenceable DataSources, so a pooled DataSource could be bound into a JNDI naming context
      and reconstructed from a javax.naming.Reference.
    new_driver_behavior: |
      The universal driver's SnowflakeConnectionPoolDataSourceFactory is a plain static factory (not a
      javax.naming.spi.ObjectFactory), and the DataSources do not implement Referenceable, so a pooled
      DataSource cannot be bound/reconstructed via a JNDI Reference. Applications that relied on JNDI
      binding must construct and configure the DataSource programmatically.
    description: |
      Tracks the loss of JNDI Referenceable/ObjectFactory support for the pooled DataSource.
    status_rationale: |
      Not yet reviewed. The JNDI surface reduction is a deliberate simplification, but whether JNDI
      binding must be restored for compatibility needs an explicit decision.
  39:
    name: "PooledConnection statement-event listeners are accepted but never invoked (parity with legacy)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy snowflake-jdbc SnowflakePooledConnection accepts StatementEventListener registrations
      but never emits statementClosed/statementErrorOccurred events, because Snowflake does no
      statement pooling and does not wrap PreparedStatements to fire statement events.
    new_driver_behavior: |
      addStatementEventListener / removeStatementEventListener are accepted as no-ops and no statement
      events are ever fired. Observable behavior is identical to the legacy driver (a registered
      StatementEventListener never receives a callback on either driver).
    description: |
      Documents that statement-event listeners are a no-op, matching legacy behavior, so the divergence
      from the full javax.sql.PooledConnection surface is explicit.
    status_rationale: |
      Behaviorally equivalent to legacy; documented for completeness of the pooling behavioral surface.
  41:
    name: "Connection.getNetworkTimeout() returns 0 (universal not yet wired to sf_core); legacy returns the configured value"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Legacy snowflake-jdbc implements the network timeout: setNetworkTimeout(executor, millis) stores
      the value and getNetworkTimeout() returns it (e.g. after setNetworkTimeout(null, 200),
      getNetworkTimeout() returns 200).
    new_driver_behavior: |
      The universal driver's SnowflakeConnectionImpl.setNetworkTimeout is currently a no-op and
      getNetworkTimeout() always returns 0 (connection network timeout is not yet wired to sf_core;
      tracked under the retries & timeouts epic). LogicalConnection delegates directly, so a pooled
      logical connection observes the same 0. Cross-driver reference tests gate the post-set assertion
      via PoolingTestCompat.assertNetworkTimeoutAfterSet (0 on universal, the set value on legacy).
    description: |
      Documents that connection network timeout is not yet implemented in the universal driver, so the
      getter returns 0 regardless of setNetworkTimeout, unlike the legacy driver.
    status_rationale: |
      Not yet reviewed. The no-op is a known temporary gap (network timeout support is deferred to the
      retries & timeouts epic); the getter contract will be revisited when it lands.
  42:
    name: "Linux legacy external-browser id-token cache requires CLIENT_STORE_TEMPORARY_CREDENTIAL session param"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Legacy snowflake-jdbc on Linux ignores clientStoreTemporaryCredential for id-token cache I/O unless
      CLIENT_STORE_TEMPORARY_CREDENTIAL is also set; universal driver does not.
