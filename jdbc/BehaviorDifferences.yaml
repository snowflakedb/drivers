# Behavioral Differences between the new (universal) JDBC driver and the old (legacy) JDBC driver.
#
# Allowed statuses:
#  - unknown (default): status is not yet determined
#  - todo: BD has to be fixed
#  - fixed: BD has been addressed, removing the difference between the old and new driver
#  - allowed: the change is expected and is accepted
#
# Allowed types:
#  - unknown (default): type is not yet determined
#  - api_incompatibility: the new driver removes support for a functionality
#  - bug: the new driver has a bug/incompatibility relative to the old driver
#  - bugfix: the new driver fixes incorrect old-driver behavior (e.g. non-compliance with the JDBC specification)
#  - enhancement: the new driver extends or improves existing functionality
#
# Reviewed:
#  - true: the BD has been reviewed and its status is accepted
#  - false (default): the BD has not yet been reviewed
#
# status_rationale (required when reviewed is true):
#  Explain why this entry has the chosen 'status'. Type and behavior deltas alone often do not
#  imply whether we intend to ship the difference, regress compatibility, track a fix, etc.

behavior_differences:
  1:
    name: "DataSource rejects PAT authentication without password"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      The old driver's DataSource.getConnection() unconditionally requires a password for all
      authenticators except SNOWFLAKE_JWT and EXTERNALBROWSER. This prevents PAT (Programmatic
      Access Token) authentication via DataSource even though setToken() and setAuthenticator()
      exist. The new driver correctly allows token-based authentication without a password.
  2:
    name: "Statement.executeBatch update-count int overflow"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      The old driver throws SnowflakeSQLLoggedException(EXECUTE_BATCH_INTEGER_OVERFLOW,
      NUMERIC_VALUE_OUT_OF_RANGE) for any per-row count that exceeds Integer.MAX_VALUE in
      executeBatch(). The new driver maps such counts to Statement.SUCCESS_NO_INFO so the
      batch result array stays valid and length-correct; callers wanting full fidelity should
      use executeLargeBatch().
  3:
    name: "getBatchQueryIDs positional alignment with updateCounts"
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      In the old driver, Statement.executeBatch's success branch is the only place that appends
      to batchQueryIDs, so failed entries skip the append and the resulting list is shorter than
      updateCounts (positional alignment broken). The new driver always appends, using null for
      failed entries, so callers can correlate updateCounts[i] with batchQueryIDs.get(i).
      For the PreparedStatement array-bind path, the old driver does not populate batchQueryIDs
      at all; the new driver appends a single entry covering the whole batch (or null on RPC
      failure).
  4:
    name: "executeBatch resets current-result state on return"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      Per JDBC spec, after Statement.executeBatch() the statement should have no current result
      (getResultSet() returns null, getUpdateCount() returns -1). The old driver leaves
      currentResultSet / currentUpdateCount populated by the last batched entry. The new driver
      resets both in finalizeBatch.
  5:
    name: "MFA token caching parameter consolidated; clientRequestMfaToken removed"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      The old driver exposed two distinct properties for credential caching:
        - `clientRequestMfaToken` (setEnableClientRequestMfaToken) — MFA-token cache for
          USERNAME_PASSWORD_MFA.
        - `clientStoreTemporaryCredential` (setEnableClientStoreTemporaryCredential) — ID-token
          cache for EXTERNALBROWSER (and OAuth flows).
      The new driver consolidates both into a single `clientStoreTemporaryCredential` connection
      property whose effect is dispatched per active authenticator (caches MFA token under
      USERNAME_PASSWORD_MFA, ID token under EXTERNALBROWSER, refresh token under
      OAUTH_AUTHORIZATION_CODE). Consequently the new driver does not expose
      `setEnableClientRequestMfaToken` on `SnowflakeDataSource`, and the legacy
      `clientRequestMfaToken` property name is not accepted as an alias — callers that previously
      relied on the legacy method or property must migrate to `clientStoreTemporaryCredential`.
      Mirrors the cross-driver consolidation documented as `BD#16` in
      `python/BehaviorDifferences.yaml`.
  6:
    name: "OAUTH_CLIENT_CREDENTIALS offline required-parameter validation"
    status: unknown
    type: enhancement
    reviewed: false
    impact: high
    is_breaking_change: true
    status_rationale: |
      The universal driver routes OAUTH_CLIENT_CREDENTIALS through sf_core, which rejects missing
      oauth_client_id, oauth_client_secret, and oauth_token_request_url synchronously at connect
      time. The old driver does not surface the same offline validation or error text.
  7:
    name: "DATE bind tolerates MON-bearing DATE_OUTPUT_FORMAT (legacy throws at prepare)"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      When the session DATE_OUTPUT_FORMAT contains the MON element (e.g. "DD-MON-YYYY" or
      "DY, DD MON YYYY"), the old driver throws java.lang.IllegalArgumentException
      ("Illegal pattern character 'O'") at prepareStatement time for any statement with a DATE
      result column (e.g. SELECT ?::DATE) — regardless of the bind setter used (it fails before
      any value is bound). The crash comes from the old driver's prepare/describe path eagerly
      building a java.text.SimpleDateFormat from a mis-translated pattern, even though its read
      path translates the same MON format correctly (MON -> MMM). MON is a valid Snowflake format
      element and both drivers read/render "DD-MON-YYYY" identically (READ parity passes).

      The universal driver does not parse output formats at prepareStatement time (no describe
      round-trip), so it prepares and binds successfully. The bound DATE value is
      format-independent (epoch-millis), and read-back rendering uses the same
      SnowflakeDateTimeFormat already proven correct on the read path, so the universal driver's
      MON-format DATE writes are correct. Replicating the old driver's exception would mean
      re-introducing a crash for a valid format, so the difference is accepted as a bugfix.
  8:
    name: "getDate(int, Calendar) tolerates a null Calendar (legacy NPEs)"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      snowflake-jdbc's SnowflakeBaseResultSet.getDate(int, Calendar) threads cal.getTimeZone()
      into the converter and dereferences the Calendar unconditionally, so passing a null Calendar
      throws NullPointerException. The JDBC spec permits a null Calendar for ResultSet.getDate
      (meaning "use the default timezone"), so the legacy NPE is non-compliant. The universal
      driver treats a null Calendar as "no timezone" (raw epoch-day date) and returns the value
      instead of throwing. Replicating the legacy NPE would re-introduce a crash for a spec-allowed
      argument, so the difference is accepted as a bugfix.
  9:
    name: "TIME->boolean conversion error uses lowercase type token for INT-backed TIME"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      getBoolean on INT-backed TIME throws INVALID_VALUE_CONVERT with "type:boolean" where legacy
      renders "type:Boolean"; the universal driver normalizes legacy's Int/BigIntToTimeConverter
      casing inconsistency, so the lowercase token is accepted.
  10:
    name: "OAuth token/authorization endpoint URLs must use HTTPS (non-loopback http rejected)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      The old JDBC driver passes `oauthTokenRequestUrl` / `oauthAuthorizationUrl` into the Nimbus
      OAuth SDK without scheme validation; an `http://` endpoint only logs a warning
      (`logIfHttpInUse`) and the request proceeds. The universal driver routes these URLs through
      sf_core, which requires the `https` scheme and rejects a non-loopback `http://` value at
      connect time, permitting `http://` only for loopback hosts (127.0.0.0/8, ::1, localhost) for
      local testing. This is a deliberate, accepted divergence: HTTPS on these endpoints is already
      required by RFC 6749 §3.1.2.1 and the OAuth 2.0 Security BCP, and the old driver merely warns.
      The loopback redirect URI used by the authorization-code flow is unaffected. Callers that
      configured a plaintext `http://` IdP token endpoint must switch to `https://`. Security
      hardening tracked under SNOW-3663588; mirrors BD#38 in python/ and BD#81 in odbc_tests/
      BehaviorDifferences.yaml.
  11:
    name: "addBatch rejects rows with missing placeholder values"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      The old driver's PreparedStatement.addBatch() iterates only the parameters that have been
      set on the current row and merges them column-wise into the batch, with no check that every
      placeholder has a value. A row that is missing one or more placeholder bindings is silently
      added, producing an inconsistent batch (columns with different row counts) which then
      either fails at the server or applies stale per-column state. The new driver validates at
      addBatch() time via BatchColumnValidator and throws SnowflakeSQLException("Missing value
      for parameter index: N") so the offending row is rejected at the call site.
