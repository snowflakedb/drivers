# Behavioral Differences between the new (universal) JDBC driver and the old (legacy) JDBC driver.
#
# Allowed statuses:
#  - unknown (default): status is not yet determined
#  - todo: BD has to be fixed
#  - fixed: BD has been addressed, removing the difference between the old and new driver
#  - allowed: the change is expected and is accepted
#
# Allowed types:
#  - unknown (default): type is not yet determined
#  - api_incompatibility: the new driver removes support for a functionality
#  - bug: the new driver has a bug/incompatibility relative to the old driver
#  - bugfix: the new driver fixes incorrect old-driver behavior (e.g. non-compliance with the JDBC specification)
#  - enhancement: the new driver extends or improves existing functionality
#
# Reviewed:
#  - true: the BD has been reviewed and its status is accepted
#  - false (default): the BD has not yet been reviewed
#
# status_rationale (required when reviewed is true):
#  Explain why this entry has the chosen 'status'. Type and behavior deltas alone often do not
#  imply whether we intend to ship the difference, regress compatibility, track a fix, etc.

behavior_differences:
  1:
    name: "DataSource rejects PAT authentication without password"
    status: fixed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Fixed against snowflake-jdbc 4.3.4. Both drivers connect a DataSource PAT login
      that has a token and no password. The old driver rejected that case in 4.3.1
      through 4.3.3.
  2:
    name: "Statement.executeBatch update-count int overflow"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      Sequential executeBatch, count above Integer.MAX_VALUE: the old driver throws
      BatchUpdateException (vendor 200058); the new driver returns SUCCESS_NO_INFO (-2).
      Array bind does not throw on either driver.
  3:
    name: "getBatchQueryIDs positional alignment with updateCounts"
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      Row-at-a-time batches: the old driver omits failed entries from getBatchQueryIDs(),
      so the list is shorter than updateCounts. The new driver keeps one slot per
      statement (the failed query id, or null). Array bind: the old driver records no
      id; the new driver records one id for the whole batch.
  4:
    name: "executeBatch clears getUpdateCount on return"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    status_rationale: |
      After executeBatch, getResultSet() is null on both drivers. getUpdateCount()
      returns the last count on the old driver and -1 on the new driver.
  5:
    name: "MFA token caching parameter consolidated; clientRequestMfaToken removed"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      The old driver has clientRequestMfaToken for MFA caching and
      clientStoreTemporaryCredential for browser and OAuth caching. The new driver has
      only clientStoreTemporaryCredential, which controls all three. The old name is
      ignored with a log warning; connect still succeeds. setEnableClientRequestMfaToken
      does not exist. Both switches default to true.
  6:
    name: "OAUTH_CLIENT_CREDENTIALS missing-parameter error text"
    status: unknown
    type: enhancement
    reviewed: false
    impact: low
    is_breaking_change: true
    status_rationale: |
      Both drivers reject a missing client id, secret, or token URL at connect. The old
      driver reports the first gap as vendor 200001 ("passing oauthClientId is required").
      The new driver names every missing oauth_client_id, oauth_client_secret, and
      oauth_token_request_url in one error. An empty string fails locally on the new
      driver and is sent to the token endpoint on the old driver.
  7:
    name: "DATE bind tolerates MON-bearing DATE_OUTPUT_FORMAT (legacy throws at prepare)"
    status: fixed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Fixed against snowflake-jdbc 4.3.4. Both drivers prepare and bind when
      DATE_OUTPUT_FORMAT contains MON. The prepare-time crash existed in 3.27.0
      through 4.0.2.
  8:
    name: "getDate(int, Calendar) tolerates a null Calendar (legacy NPEs)"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      getDate(column, null) throws NullPointerException on the old driver and returns
      the stored calendar day on the new driver. The new driver does not apply the JVM
      default timezone.
  9:
    name: "TIME->boolean conversion error uses lowercase type token for INT-backed TIME"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      getBoolean on TIME scale 0-4 throws vendor 200038 on both drivers. The old driver
      says type:Boolean; the new driver says type:boolean. Scale 5-9 already matches.
  10:
    name: "OAuth token/authorization endpoint URLs must use HTTPS (non-loopback http rejected)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      A non-loopback http oauthTokenRequestUrl or oauthAuthorizationUrl is warned about
      and then used on the old driver. The new driver rejects it at connect. Loopback
      http and the redirect URI still work on both. Tracked under SNOW-3663588.
  11:
    name: "addBatch rejects rows with missing placeholder values"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      After clearParameters, a later addBatch row that omits an index bound on the first
      row throws "Missing value for parameter index: N" on the new driver. The old driver
      keeps the row. setNull counts as a value. An index missing from every row, including
      the first, is accepted on both.
  12:
    name: "JDBC wrapper interface is correctly implemented"
    status: unknown
    type: enhancement
    reviewed: false
    impact: low
    is_breaking_change: false
    status_rationale: |
      unwrap on Connection, Statement, and ResultSet already works on both drivers. The
      old driver throws from DatabaseMetaData.isWrapperFor, returns null from
      DataSource.unwrap, and has no unwrap on createClob() or PooledConnection. The new
      driver implements those. getClob() still has no unwrap on either driver.
  13:
    name: "SnowflakeClob.setString overwrites in place; old driver inserts"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      setString into existing text inserts and shifts the tail on the old driver and
      overwrites on the new driver. "hello world" plus setString(1, "HELLO") is
      "HELLOhello world" versus "HELLO world". An empty Clob, or a write at length + 1,
      matches on both.
  14:
    name: "SnowflakeClob.setAsciiStream writes characters; old driver writes decimal text"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      setCharacterStream appends on flush on both drivers. Writing 'a' then 'b' through
      setAsciiStream yields "98" on the old driver and "ab" on the new driver.
  15:
    name: "SnowflakeClob.free invalidates the handle; old driver keeps it usable"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      free() leaves an empty usable Clob on the old driver. The new driver rejects later
      calls. A second free() is a no-op on the new driver. createClob() throws
      SQLException; getClob() throws an unchecked exception with the same message.
  16:
    name: "SnowflakeClob.position searches forward; old driver searches backward"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      position("world", 1) on "hello world" returns 7 on the new driver and -1 on the old
      driver. The old driver searches backward and counts from 0.
  17:
    name: "SnowflakeClob.setString copies len characters; old driver uses len as an end index"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      setString(1, "XXhelloYY", 2, 5) writes "hello" on the new driver and "hel" on the old
      driver. An offset of 0 matches.
  18:
    name: "Connection.getTransactionIsolation() always returns READ_COMMITTED; legacy round-trips the set value and defaults to NONE"
    status: fixed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Restored legacy snowflake-jdbc semantics: transactionIsolation defaults to TRANSACTION_NONE,
      setTransactionIsolation stores NONE or READ_COMMITTED, and getTransactionIsolation returns the
      cached value.
  19:
    name: "getFunctionColumns FUNCTION_CAT stays null until a session flag fills it"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      A null catalog stays null in FUNCTION_CAT on both drivers. When a session-metadata flag
      replaces that null, the new driver stores the session database and the old driver stores
      null.
  20:
    name: "getFunctionColumns FUNCTION_SCHEM is the function schema; old driver echoes the schema pattern"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      FUNCTION_SCHEM is the function's schema on the new driver. The old driver copies the
      schema pattern, so % or null appears in the column. An exact schema name matches.
  21:
    name: "ResultSet.isLast() on a query-backed DatabaseMetaData result set returns a boolean instead of throwing"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      `java.sql.ResultSet.isLast()` and `isAfterLast()` carry no exemption for metadata result
      sets, so returning a boolean is the interface contract and the throw is the divergence.
    old_driver_behavior: |
      `isLast()` and `isAfterLast()` on a query-backed `DatabaseMetaData` result set
      (`getSchemas`, `getTables`, and the other SHOW-backed calls) throw
      `SnowflakeLoggedFeatureNotSupportedException`, a `SQLFeatureNotSupportedException`
      subclass. An empty in-memory metadata result reports `isLast()` false before the first
      `next()`.
    new_driver_behavior: |
      `isLast()` and `isAfterLast()` return a boolean on every metadata result set. An empty
      in-memory metadata result reports `isLast()` true before the first `next()`.
    description: |
      `isFirst()` and `isBeforeFirst()` already agree on both drivers, and callers that iterate
      with `next()` alone see no change. A caller that catches `SQLFeatureNotSupportedException`
      around `isLast()` no longer reaches that handler.
  22:
    name: "setClientInfo on a closed connection throws SQLClientInfoException with CONNECTION_CLOSED on both drivers"
    status: fixed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      No difference remains. `java.sql.Connection.setClientInfo` reports failure as
      `SQLClientInfoException`, and on a closed connection both drivers throw it with the same
      message and the same `CONNECTION_CLOSED` code.
    old_driver_behavior: |
      `setClientInfo(String, String)` and `setClientInfo(Properties)` on a closed connection throw
      `SQLClientInfoException("The connection is not opened.")` with SQLSTATE `08003` and vendor
      code `200052`, with `failedProperties` carrying `REASON_UNKNOWN_PROPERTY` for every property
      named in the call.
    new_driver_behavior: |
      The same: `SQLClientInfoException("The connection is not opened.")`, SQLSTATE `08003`,
      vendor code `200052`, and the same `failedProperties` entries.
    description: |
      Callers need no change. `setClientInfo(null)` on an open connection is BD#23, and a closed
      pooled handle is BD#29. No test gates on this entry.
  23:
    name: "setClientInfo(null) on an open connection returns instead of throwing NullPointerException"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      `java.sql.Connection.setClientInfo(Properties)` documents no behavior for a null argument,
      and the old driver dereferences it before any validation, so the failure a caller sees is an
      unchecked `NullPointerException` rather than the `SQLClientInfoException` the method declares.
    old_driver_behavior: |
      On an open connection, `setClientInfo(null)` throws `NullPointerException`, and an empty
      `Properties` throws `SQLClientInfoException`. On a closed connection, `setClientInfo(null)`
      still throws `NullPointerException`.
    new_driver_behavior: |
      On an open connection, `setClientInfo(null)` returns, and an empty `Properties` returns. On a
      closed connection, `setClientInfo(null)` throws
      `SQLClientInfoException("The connection is not opened.")`.
    description: |
      Neither driver stores client info, so `getClientInfo()` stays empty after the call, and a
      named property fails on both. A caller that catches `NullPointerException` around a null or
      empty property set no longer reaches that handler on an open connection. The closed-connection
      exception is BD#22.
  24:
    name: "Statement.getQueryID() after a synchronous multistatement returns the parent query ID instead of the first child's"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      The parent `SYSTEM$MULTISTMT` id is the only id that names the whole call and stays stable
      across iteration; the old driver's first-child id leaves the parent unreachable. The new
      driver matches the Python wrapper the multistatement state model was ported from.
    old_driver_behavior: |
      After a successful synchronous multistatement `execute()`, `getQueryID()` returns the first
      child's query id, and `getMoreResults()` does not change it. For an async query that has
      already finished, `getQueryID()` returns the first child's id.
    new_driver_behavior: |
      `getQueryID()` returns the parent query id, and `getMoreResults()` does not change it. For an
      async query that has already finished, it stays on the submit id.
    description: |
      A single-statement `execute()` returns the same id on both drivers, as does an async query
      that is still running (the parent id). A caller that feeds `getQueryID()` to
      `getChildQueryIds()` gets the children of the whole call on the new driver and one id on the
      old driver, which is why `shouldReturnChildQueryIdsForMultistatementQuery` is
      `@SkipOldDriver("BD#24")`; `getChildQueryIds` itself agrees given the same query id.
  25:
    name: "A failed GET leaves an existing destination file intact instead of truncating or deleting it"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      A GET that fails must not destroy data already at the destination. Staging into a temporary
      file and renaming on success is what keeps the destination path either the previous file or
      the complete new one.
    old_driver_behavior: |
      The old driver writes straight to the destination path and truncates it when the download
      starts. On S3 and GCS a failed transfer leaves the partial file there; on Azure the path is
      deleted. A decryption failure can leave an unusable file at the destination.
    new_driver_behavior: |
      The new driver writes `<dst>.part` and renames it onto the destination only after the
      transfer succeeds. A failed GET removes `<dst>.part` and leaves any existing destination file
      unchanged. A hard process kill can leave a `<dst>.part` file behind.
    description: |
      A successful GET produces the same file on both drivers. Callers that delete a truncated
      destination file after a failed GET no longer need that cleanup.
  40:
    name: "LogicalConnection.abort() closes the logical handle and notifies the pool"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      LogicalConnection.abort(Executor) delegates to the physical connection's abort() but leaves
      the logical handle's isClosed flag false and fires no ConnectionEventListener callback. After
      abort, isClosed() returns false and the PooledConnection's listeners are never told the
      physical connection is gone, so a pool manager may keep handing out a dead connection. A
      stale logical handle can also abort a physical connection that was already returned to the
      pool by a prior close().
    new_driver_behavior: |
      The logical handle is claimed closed via compareAndSet before the physical connection is
      touched, closing a race with a concurrent close(). abort() on an already-closed logical handle
      is a no-op. A successful abort() leaves the handle closed and fires connectionErrorOccurred so
      the pool manager EVICTS the now-dead physical connection. connectionClosed is deliberately not
      used: in the javax.sql pooling contract connectionClosed means the logical handle was closed
      normally and the physical connection is idle and reusable, so firing it after abort would leave
      a standard pool handing out a dead connection on every subsequent borrow; only
      connectionErrorOccurred instructs the pool to discard the connection. There are two outcomes if
      the physical abort() throws:
        - SQLFeatureNotSupportedException: the physical connection was left untouched, so the handle
          is reopened (isClosed() returns false again) and no pool event fires.
        - any other SQLException: the physical connection is now dead, so the handle stays closed,
          connectionErrorOccurred fires (never connectionClosed), and a subsequent close() is a no-op
          so the dead connection cannot be recycled into the pool.
      Concurrency note: the reopen on an unsupported abort (isClosed flipped back to false) is
      best-effort; JDBC Connections are not required to be thread-safe, so concurrently invoking
      abort() and close() on the same logical handle is undefined.
    description: |
      Aligns LogicalConnection with the JDBC Connection.abort() contract ("the connection will be
      marked as closed") and with javax.sql pooling lifecycle expectations, while preventing a
      concurrent close() from recycling a connection that abort() is tearing down.
    status_rationale: |
      Intentional correctness fix. Pool managers rely on close/error events to reclaim physical
      connections; the old behavior could leak or hand out aborted connections. A successful abort
      signals connectionErrorOccurred (not connectionClosed) because the javax.sql contract only
      evicts a pooled connection on an error event - a close event would mark the dead connection
      reusable.
  26:
    name: "SQLFeatureNotSupportedException from a pooled connection no longer fires connectionErrorOccurred"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      Every `SQLException` a delegated `java.sql.Connection` method throws on a pooled logical
      handle, `SQLFeatureNotSupportedException` included, fires
      `ConnectionEventListener.connectionErrorOccurred` on the owning `PooledConnection` before the
      exception reaches the caller.
    new_driver_behavior: |
      `SQLFeatureNotSupportedException` reaches the caller without firing
      `connectionErrorOccurred`. Any other `SQLException` from the underlying connection still
      fires it.
    description: |
      `connectionErrorOccurred` signals a broken physical connection, and pool managers typically
      evict the connection when they receive it. Probing for an unsupported JDBC feature is a
      caller mistake, not a connection failure, so a pool no longer discards a healthy connection
      over it. Client-info failures are BD#32 and `unwrap` of an unsupported type is BD#35.
    status_rationale: |
      Intentional fix to avoid spurious pool eviction and churn when applications probe JDBC
      capabilities on a pooled logical connection.
  27:
    name: "PooledConnection.getConnection() after close() throws SQLException instead of NullPointerException"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After `SnowflakePooledConnection.close()`, `getConnection()` throws an unchecked
      `NullPointerException`. After a logical `abort()`, `getConnection()` returns a new logical
      handle.
    new_driver_behavior: |
      After `PooledConnection.close()`, and after a logical `abort()`, `getConnection()` throws
      `SnowflakeSQLException` with vendor code `200052` and SQLSTATE `08003`.
    description: |
      A pool manager or application that borrows from an already-closed `PooledConnection` catches
      a checked `SQLException` on the new driver; code that catches `NullPointerException` there no
      longer reaches that handler. The pool events `abort()` fires are BD#40.
    status_rationale: |
      `javax.sql.PooledConnection.getConnection()` declares `SQLException`, so a closed pooled
      connection reporting an unchecked `NullPointerException` is outside the method's contract.
  28:
    name: "A listener RuntimeException no longer stops event dispatch or escapes close()"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When one registered `ConnectionEventListener` throws a `RuntimeException`, the remaining
      listeners receive no callback. On `close()` that `RuntimeException` propagates to the caller
      and the logical handle stays open.
    new_driver_behavior: |
      The `RuntimeException` is logged and the remaining listeners still receive the callback.
      `close()` completes, and a `SQLException` raised by the close path itself is still thrown.
      An `Error` from a listener propagates on both drivers.
    description: |
      One misbehaving `ConnectionEventListener` can no longer break pool bookkeeping or an
      application's close path. An application that relied on a listener exception aborting
      `close()` sees the handle closed instead.
    status_rationale: |
      `javax.sql.ConnectionEventListener` callbacks are notifications, and the pooling contract
      gives a listener no way to veto a close, so dispatch is best-effort and isolated per
      listener.
  29:
    name: "Client-info access on a closed pooled handle throws CONNECTION_CLOSED instead of reaching the physical session"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      On a closed logical handle, `setClientInfo` and `getClientInfo(String)` delegate to the still
      open physical connection: `setClientInfo` throws `SQLClientInfoException` reporting the
      property as not settable and fires `connectionErrorOccurred`, and `getClientInfo(String)`
      returns the property value. The no-argument `getClientInfo()` throws
      `SnowflakeSQLException` with vendor code `200052` and SQLSTATE `08003`.
    new_driver_behavior: |
      On a closed logical handle, `setClientInfo` throws `SQLClientInfoException` and both
      `getClientInfo` methods throw `SnowflakeSQLException`, all carrying vendor code `200052` and
      SQLSTATE `08003`, and none of them reaches the physical connection. `setClientInfo` does not
      fire `connectionErrorOccurred`.
    description: |
      Closing a pooled handle leaves the physical connection open on both drivers, so on the old
      driver a returned handle can still read and write client info on a session another borrower
      may hold. `java.sql.Connection` requires a closed connection to reject these calls. The
      physical connection's own closed-state client-info behavior is BD#22.
    status_rationale: |
      Intentional fix for closed-handle correctness, consistent with the other closed-state checks
      on a logical connection.
  30:
    name: "A listener handling connectionClosed observes isClosed() true instead of false"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `LogicalConnection.close()` fires `connectionClosed` and sets the closed flag afterwards, so
      a listener callback sees `isClosed()` false and can still create statements on the handle.
      A listener that calls `close()` again re-enters the dispatch until the stack overflows.
    new_driver_behavior: |
      `close()` sets the closed flag before firing `connectionClosed`, so a listener callback sees
      `isClosed()` true. A `close()` from inside the callback is a no-op and the event fires once.
    description: |
      Neither driver closes the physical connection on a logical `close()`. A listener that used
      the callback to run a last statement on the handle now gets the closed-connection error
      instead.
    status_rationale: |
      `java.sql.Connection.isClosed()` must report a connection closed once `close()` has been
      called, and the `javax.sql` pooling contract delivers `connectionClosed` for a handle that is
      already back in the pool, so the flag belongs before the event.
  31:
    name: "Nine DataSource setters present on the old driver do not exist on the new driver"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    status_rationale: |
      Not yet reviewed. Dropping a setter instead of keeping it as a silent no-op is deliberate,
      but whether any of the nine names must be restored for source compatibility needs an
      explicit decision.
    old_driver_behavior: |
      `SnowflakeBasicDataSource` and `SnowflakeConnectionPoolDataSource` declare
      `setNetworkTimeout`, `setEnablePutGet`, `setClientConfigFile`,
      `setDisableGcsDefaultCredentials`, `setStringsQuotedForColumnDef`,
      `setEnableClientRequestMfaToken`, `setEnableClientStoreTemporaryCredential`,
      `setOcspFailOpen`, and `setHttpHeadersCustomizers`.
    new_driver_behavior: |
      Those nine setters are absent: a call to one does not compile, and reflection reports no such
      method. `setEnableClientStoreTemporaryCredential` is present under the name
      `setClientStoreTemporaryCredential`. Every setter the new driver declares is applied at
      connect time; none is a silent no-op.
    description: |
      Callers must drop or rename these calls. `enablePutGet` and `STRINGS_QUOTED_FOR_COLUMN_DEF`
      are still settable as connection properties, so that configuration survives the move.
      `setEnableClientRequestMfaToken` is BD#5, `setOcspFailOpen` is BD#46, and
      `setHttpHeadersCustomizers` is BD#43.
  32:
    name: "A setClientInfo failure on an open pooled handle no longer fires connectionErrorOccurred"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      On an open pooled handle, a `setClientInfo` call that raises `SQLClientInfoException` fires
      `ConnectionEventListener.connectionErrorOccurred` on the owning `PooledConnection` before the
      exception reaches the caller.
    new_driver_behavior: |
      The `SQLClientInfoException` reaches the caller and `connectionErrorOccurred` does not fire.
    description: |
      `connectionErrorOccurred` signals a dead physical connection and typically triggers pool
      eviction, which a rejected client-info property must not cause. `getClientInfo` raises no
      `SQLClientInfoException` on either driver. `setClientInfo(null)` and an empty property set
      are BD#23; a closed handle is BD#29.
    status_rationale: |
      Intentional fix to avoid spurious pool eviction and churn when applications set client-info
      properties on a pooled logical connection.
  33:
    name: "unwrap/isWrapperFor on a closed pooled handle throws CONNECTION_CLOSED instead of returning the physical connection"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After the logical handle is closed, `unwrap` returns the live physical connection and
      `isWrapperFor` reports the Snowflake types, so the caller can keep running statements on the
      pooled session.
    new_driver_behavior: |
      `unwrap` and `isWrapperFor` for `SnowflakeConnection` and the other Snowflake types throw
      `SnowflakeSQLException` with vendor code `200052` and SQLSTATE `08003`.
      `unwrap(Connection.class)` returns the closed logical handle itself and never the physical
      connection.
    description: |
      A closed handle can no longer reach the pooled physical connection, which another borrower
      may already hold. `unwrap` of a type neither driver supports is BD#35.
    status_rationale: |
      `java.sql.Connection` requires a closed connection to reject its methods, and the
      `javax.sql` pooling contract hands the physical connection back to the pool on logical
      close, so exposing it through `unwrap` afterwards breaks checkout isolation.
  34:
    name: "isValid() on a closed pooled handle returns false without probing the physical connection on both drivers"
    status: fixed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After `close()` returns, `isValid(int)` returns false and the physical connection is not
      called. A negative timeout on an already-closed handle also returns false.
    new_driver_behavior: |
      The same: `isValid(int)` returns false with no call to the physical connection, and a
      negative timeout on an already-closed handle returns false.
    description: |
      Callers need no change, and `assertIsValidFalseOnClosedHandle` asserts this on both drivers
      without a driver guard.
    status_rationale: |
      No difference remains. `java.sql.Connection.isValid()` requires false for a closed
      connection and forbids throwing, and both drivers short-circuit on the closed flag.
  35:
    name: "unwrap to an unsupported type on an open pooled handle no longer fires connectionErrorOccurred"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      On an open pooled handle, `unwrap` to a type the connection does not support throws
      `SQLException` and fires `connectionErrorOccurred` on the owning `PooledConnection`.
      `isWrapperFor` for that type returns false and fires no event.
    new_driver_behavior: |
      `unwrap` to an unsupported type throws `SQLException`, with different message text, and
      `connectionErrorOccurred` does not fire. `isWrapperFor` returns false.
    description: |
      `connectionErrorOccurred` signals a dead physical connection and typically triggers pool
      eviction, which a caller asking for an unsupported wrapper type must not cause. A closed
      handle is BD#33.
    status_rationale: |
      Intentional fix to avoid spurious pool eviction and churn when applications probe wrapper
      types on a pooled logical connection.
  36:
    name: "PooledConnection.getConnection() invalidates the previously returned logical handle"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      SnowflakePooledConnection.getConnection() minted a new LogicalConnection on each call without
      tracking or invalidating any previously returned, still-open handle, so two logical handles
      could simultaneously drive the same physical session. When the stale handle was later closed it
      fired connectionClosed, signalling the pool that the physical connection was idle while the
      second handle was still using it.
    new_driver_behavior: |
      getConnection() tracks the currently-issued logical handle and, when a new handle is borrowed
      while a prior one is still open, silently invalidates the prior handle (marks it closed without
      firing connectionClosed, since this is internal reclamation rather than an application close).
      Subsequent operations on the invalidated handle fail with CONNECTION_CLOSED. This honors the
      javax.sql.PooledConnection contract that at most one active logical handle exists per pooled
      connection at a time.
    description: |
      Prevents two logical handles from sharing one physical session and the resulting spurious
      pool lifecycle signals.
    status_rationale: |
      Intentional correctness fix aligning with the javax.sql pooling contract.
  37:
    name: "LogicalConnection uniformly enforces closed-state on all Connection methods; legacy does not"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      A closed logical handle does not reject every call. `createStatement`, `prepareStatement`,
      and `getMetaData` throw `SnowflakeSQLException` with vendor code `200052`. The calls that
      still reach the pooled physical connection are `setClientInfo` (both overloads),
      `getClientInfo(String)`, `unwrap`, `isWrapperFor`, and `abort`. The no-argument
      `getClientInfo()` throws vendor code `200052` (BD#29), and `isValid` returns false (BD#34).
    new_driver_behavior: |
      Nearly every operational `java.sql.Connection` method on a closed logical handle throws
      `SnowflakeSQLException` with vendor code `200052` and SQLSTATE `08003`. `close()`,
      `isClosed()`, and `abort()` are idempotent no-ops.
    description: |
      The methods whose closed-state behavior the JDBC contract fixes are documented separately:
      `isValid()` returns false on both drivers (BD#34), `setClientInfo()` throws
      `SQLClientInfoException` carrying the same vendor code (BD#29), and `unwrap`/`isWrapperFor`
      is BD#33. Because the old driver does not enforce closed-state uniformly, the cross-driver
      reference tests assert the vendor code on the new driver only;
      `PoolingTestCompat.assertThrowsConnectionClosed` is a no-op on the old driver.
    status_rationale: |
      Intentional correctness fix; a logically-closed handle must not reach the pooled physical
      connection. Matches the JDBC Connection closed-state contract.
  38:
    name: "Pooled DataSource is not JNDI Referenceable; legacy exposed a JNDI ObjectFactory"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      The legacy snowflake-jdbc shipped a JNDI ObjectFactory (SnowflakeConnectionPoolDataSourceFactory)
      and Referenceable DataSources, so a pooled DataSource could be bound into a JNDI naming context
      and reconstructed from a javax.naming.Reference.
    new_driver_behavior: |
      The universal driver's SnowflakeConnectionPoolDataSourceFactory is a plain static factory (not a
      javax.naming.spi.ObjectFactory), and the DataSources do not implement Referenceable, so a pooled
      DataSource cannot be bound/reconstructed via a JNDI Reference. Applications that relied on JNDI
      binding must construct and configure the DataSource programmatically.
    description: |
      Tracks the loss of JNDI Referenceable/ObjectFactory support for the pooled DataSource.
    status_rationale: |
      Not yet reviewed. The JNDI surface reduction is a deliberate simplification, but whether JNDI
      binding must be restored for compatibility needs an explicit decision.
  39:
    name: "PooledConnection statement-event listeners are accepted but never invoked (parity with legacy)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy snowflake-jdbc SnowflakePooledConnection accepts StatementEventListener registrations
      but never emits statementClosed/statementErrorOccurred events, because Snowflake does no
      statement pooling and does not wrap PreparedStatements to fire statement events.
    new_driver_behavior: |
      addStatementEventListener / removeStatementEventListener are accepted as no-ops and no statement
      events are ever fired. Observable behavior is identical to the legacy driver (a registered
      StatementEventListener never receives a callback on either driver).
    description: |
      Documents that statement-event listeners are a no-op, matching legacy behavior, so the divergence
      from the full javax.sql.PooledConnection surface is explicit.
    status_rationale: |
      Behaviorally equivalent to legacy; documented for completeness of the pooling behavioral surface.
  41:
    name: "Connection.getNetworkTimeout() returns 0; the old driver returns the value passed to setNetworkTimeout"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Legacy snowflake-jdbc implements the network timeout: setNetworkTimeout(executor, millis) stores
      the value and getNetworkTimeout() returns it (e.g. after setNetworkTimeout(null, 200),
      getNetworkTimeout() returns 200).
    new_driver_behavior: |
      The new driver's setNetworkTimeout is a no-op and getNetworkTimeout() always returns 0,
      including on a pooled logical connection. The networkTimeout connection property is
      separate (entry 78).
    description: |
      Documents that connection network timeout is not yet implemented in the new driver, so the
      getter returns 0 regardless of setNetworkTimeout, unlike the old driver. The old setter
      stores a connection-local value that HTTP never reads. LogicalConnection delegates directly.
      Cross-driver reference tests gate the post-set assertion via
      PoolingTestCompat.assertNetworkTimeoutAfterSet (0 on the new driver, the set value on the old).
    status_rationale: |
      Not yet reviewed. The getter stays 0 because no HTTP timeout reads the setter's value in
      either driver. HTTP timeout behavior is covered by entries 77 and 78.
  42:
    name: "Linux legacy external-browser id-token cache requires CLIENT_STORE_TEMPORARY_CREDENTIAL session param"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      Legacy snowflake-jdbc on Linux ignores clientStoreTemporaryCredential for id-token cache I/O unless
      CLIENT_STORE_TEMPORARY_CREDENTIAL is also set; universal driver does not.
  43:
    name: "HttpHeadersCustomizer is not ported"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      Legacy snowflake-jdbc exposes HttpHeadersCustomizer / setHttpHeadersCustomizers for custom REST
      headers. sf_core has no equivalent hook, so the universal driver omits the surface rather than
      accepting customizers that would be ignored.
  44:
    name: "DataSource.getProperties() returns a copy, not the live map"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      Legacy getProperties() returns the live internal map; mutating it changes DataSource state, and
      getConnection(user, password) persists credentials into that shared map. The universal driver
      returns a defensive copy so per-call credentials are not stored on the DataSource.
  45:
    name: "DataSource.getConnection does not require a username up front"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      The old driver's getConnection(username, password) rejects a missing username for most
      authenticators. The new driver passes the credentials through and lets connect-time
      validation decide whether a username is required.
  46:
    name: "OCSP is not supported"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: high
    status_rationale: |
      Legacy snowflake-jdbc performs OCSP revocation checking and exposes setOcspFailOpen. The
      universal driver does not support OCSP or expose that setter; revocation is CRL-based only
      (disabled by default via crl_check_mode).
  47:
    name: "GCS PUT OVERWRITE=TRUE on matching content re-uploads instead of skipping"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Against a GCS stage, a PUT with OVERWRITE=TRUE whose local payload matched the remote object's
      stored x-goog-meta-sfc-digest was skipped: the PUT result set STATUS column reported SKIPPED and
      no upload occurred. This was a universal-driver-only quirk (GCS skipped content matches
      unconditionally); legacy snowflake-jdbc re-uploads.
    new_driver_behavior: |
      GCS re-uploads a content-matching PUT with OVERWRITE=TRUE (STATUS = UPLOADED), matching legacy
      snowflake-jdbc. The content-match skip is gated behind the opt-in skip_upload_on_content_match
      flag in sf_core, which JDBC does not set, so the skip never fires by default.
    description: |
      GCS now honors the opt-in skip_upload_on_content_match flag like S3 and Azure instead of skipping
      matching content unconditionally, restoring legacy parity for the default PUT OVERWRITE=TRUE path.

  48:
    name: "Connecting with WIF-only params set but authenticator != WORKLOAD_IDENTITY now fails; legacy silently ignored"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      Verified in snowflakedb/snowflake-jdbc: SFSessionProperty declares workloadIdentityProvider /
      workloadIdentityEntraResource / workloadIdentityImpersonationPath optional, and SFSession.open()
      copies all three into SFLoginInput unconditionally, regardless of authenticator — so
      authenticator=snowflake with workloadIdentityProvider=AWS connects and the WIF props are never
      read. (The lone WIF guard, checkAwsExternalIdEnabled, gates a different property,
      workloadIdentityAwsExternalId, and no-ops unless authenticator=WORKLOAD_IDENTITY.) The universal
      driver's sf_core::validate_settings rejects any of the three params under a non-WIF authenticator
      (ConflictingParameters, Error). Allowed as a bugfix: it matches legacy snowflake-connector-python's
      long-standing rejection (ProgrammingError errno=251017) and enforces it uniformly across wrappers;
      no JDBC caller relies on the params being silently ignored.
  49:
    name: "workload_identity_impersonation_path with provider=OIDC now fails; legacy silently ignored it"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      Verified in snowflakedb/snowflake-jdbc: OidcIdentityAttestationCreator.createAttestation() only
      reads the token, never workloadIdentityImpersonationPath, so that param is silently discarded
      today. Legacy snowflake-connector-python/nodejs/.NET all reject this combination client-side;
      legacy JDBC never did. sf_core::validate_settings now rejects it uniformly (ConflictingParameters,
      Error). Unlike entry 48, this is a genuine new rejection for JDBC, not a relocated one — allowed as
      a bugfix since silently accepting a no-op param combination is itself a latent bug.

  50:
    name: "CSE KeyWrappingMetadata.EncryptionLibrary: UD self-identifies as \"Rust(OpenSSL)\""
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Azure/GCS `encryptiondata` JSON: legacy snowflake-jdbc hardcodes
      `KeyWrappingMetadata.EncryptionLibrary = "Java 5.3.0"` on both clouds.
    new_driver_behavior: |
      UD emits `"Rust(OpenSSL)"` for the same field on both clouds -- an honest
      self-identification, not an oversight. Confirmed no reader anywhere consumes this value:
      not the four legacy drivers' decrypt paths, not UD's own, and not GS's own server-side
      parser, which validates several sibling fields but never reads `EncryptionLibrary`. GS's
      own internal C++ encryption library independently emits `"OpenSSL 1.0.1e-fips"` rather
      than `"Java 5.3.0"` on its GCS path --
      the same self-identify-honestly pattern UD follows. Kept deliberately: matching
      "Java 5.3.0" would misidentify which implementation produced the blob, valuable for
      diagnostics during the mixed-fleet rollout period.
  51:
    name: "secondary_roles connection parameter is now accepted (no legacy JDBC equivalent)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Legacy snowflake-jdbc's `SFSessionProperty` enum has no `secondary_roles` (or similarly named)
      property. A user relying on secondary-role activation must either rely on the user's
      `DEFAULT_SECONDARY_ROLES` setting or run `USE SECONDARY ROLES` after connecting.
    new_driver_behavior: |
      Because `secondary_roles` is registered as a shared `sf_core` connection parameter (added for
      Python parity with snowflake-connector-python#2750 / SNOW-2853586), and JDBC forwards unrecognized
      connection properties/URL parameters through unfiltered, a JDBC caller can now also set
      `secondary_roles=ALL` or `secondary_roles=NONE` to control secondary-role activation at login,
      sent as `SECONDARY_ROLES` in the login-request body. This is a net-new, opt-in capability with no
      legacy JDBC counterpart — not a fix of a prior gap — so it is filed as `allowed`, not `fixed`.

  52:
    name: "Plaintext PEM string accepted for private_key (JDBC)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Legacy snowflake-jdbc's SFSessionProperty recognizes only three ways to supply a JWT
      private key: privateKey (a java.security.PrivateKey object), private_key_file (a path), and
      private_key_base64 (a base64-encoded key). There is no private_key property carrying a
      plaintext PEM string. Setting one is silently ignored: SessionUtilKeyPair.buildPrivateKey()
      falls through to the (absent) privateKey object, yielding null, and the constructor then
      throws SnowflakeSQLLoggedException(INVALID_OR_UNSUPPORTED_PRIVATE_KEY, "Use
      java.security.interfaces.RSAPrivateCrtKey.class for the private key").
    new_driver_behavior: |
      sf_core's param_registry defines private_key as a canonical parameter accepting a plaintext
      PEM string (optionally decrypted with private_key_password), consistent with the
      plaintext-PEM support added for the other wrappers in this PR stack. Purely additive:
      private_key_file and private_key_base64 continue to work unchanged on both drivers.
  53:
    name: "GEOGRAPHY/GEOMETRY WKB/EWKB ResultSetMetaData reports VARCHAR instead of BINARY"
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When GEOGRAPHY_OUTPUT_FORMAT (or GEOMETRY_OUTPUT_FORMAT) is WKB or EWKB, Snowflake sends
      row metadata with underlying type "binary" and extTypeName "GEOGRAPHY"/"GEOMETRY". Legacy
      snowflake-jdbc maps the raw type field to JDBC Types.BINARY, so getColumnType() returns
      BINARY and isCaseSensitive() is false while getObject() still returns byte[].
    new_driver_behavior: |
      sf_core row_types_to_columns prefers extTypeName over the raw type when building column
      metadata, and udt_output_type is populated only when the server sends outputType. When
      outputType is absent, the JDBC wrapper defaults GEOGRAPHY/GEOMETRY metadata to VARCHAR.
      Values are still decoded as byte[]; only ResultSetMetaData getColumnType() /
      isCaseSensitive() differ from legacy. Planned fix: propagate binary output representation
      into udt_output_type (or equivalent) in sf_core so JDBC reports BINARY like legacy.
  54:
    name: "PUT/GET size columns report BIGINT instead of DECIMAL"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Legacy hard-codes the PUT/GET size columns (source_size, target_size, size) to Types.DECIMAL,
      ignoring JDBC_TREAT_DECIMAL_AS_INT. This contradicts its own rule for ordinary scale-0 columns,
      which report BIGINT under the default JDBC_TREAT_DECIMAL_AS_INT=true.
    new_driver_behavior: |
      The new driver builds the PUT/GET rowset through the standard metadata path, so the size
      columns follow the normal scale-0 rule and report BIGINT. Column counts, names, and values are
      at full parity; only the size columns' JDBC type differs. Matching legacy's DECIMAL would mean
      leaking a JDBC-only quirk into the shared metadata format.
  55:
    name: "Concurrent interactive auth prompts are serialized (DISABLE_PARALLEL_USER_PROMPT)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When multiple connections are opened concurrently for the same user and host and interactive
      authentication is required, each connection runs its own interactive flow.
    new_driver_behavior: |
      Interactive auths are serialized by a process-global lock, so the first connection runs
      the interactive flow and caches the token. Connections that arrive while it holds the lock
      wait and then reuse the cached token, so the user sees only one prompt.
      Locking engages only when `DISABLE_PARALLEL_USER_PROMPT=true` (the default).
  56:
    name: "A GET-downloaded file is mode 0600 on Unix instead of following the process umask"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      On Unix a downloaded file keeps whatever mode the process umask produces — `0644` under a
      common umask of `022`, `0600` under `077`. `ownerOnlyStageFilePermissionsEnabled` defaults
      to false and makes the file owner-only when set true. Windows is unaffected.
    new_driver_behavior: |
      On Unix a downloaded file is mode `0600`, unless `unsafe_file_write` is true, which
      restores the process umask. Windows is unaffected.
    description: |
      A second local account or a group that could read downloaded stage files loses access
      unless the deployment sets `unsafe_file_write`.
    status_rationale: |
      Accepted. A downloaded stage file holds query data, so owner-only is the safe default; the
      old driver's opt-in meant the common umask published that data to every local account.
  57:
    name: "PUT canonicalizes a literal source path, so a named symlink is staged under its target's name"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      A source path with no glob character is joined to the working directory and kept as
      written, so `..` and a symlink survive into the reported path and `link.csv` pointing at
      `real.csv` is staged as `link.csv`. A glob match is canonicalized.
    new_driver_behavior: |
      Every matched path is canonicalized, including a literal one: `link.csv` pointing at
      `real.csv` is staged as `real.csv`, and a `..` in the path is collapsed in the reported
      path. A glob match is canonicalized as before.
    description: |
      The stage object name changes only when a symlink's target has a different final component
      than the link, so ordinary files and wildcard uploads keep the name they had. Code that
      expected the link's own name to appear on the stage has to change.
    status_rationale: |
      Accepted. Canonicalizing uniformly removes the split between the literal and glob paths,
      and uploading a named symlink is the only case whose stage name moves.
  58:
    name: "getUpdateCount() after executeQuery returns -1 instead of the previous statement's count"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `executeQuery` leaves the previous statement's update count in place: after `CREATE TABLE`
      then `PUT`, `getUpdateCount()` is still `0`, and after `COPY` then `GET` it is still `2`.
      An `execute()` that returns a result set sets the count to `-1`. `executeUpdate` of a
      `SELECT` is rejected.
    new_driver_behavior: |
      `getUpdateCount()` returns `-1` after `executeQuery` of any result-set statement, including
      `SELECT`, `PUT`, `GET`, and `REMOVE`. `executeUpdate` of a `SELECT` is rejected.
    description: |
      Code that read the count after a query gets `-1` rather than a number that belonged to an
      earlier command.
    status_rationale: |
      Intentional fix. `java.sql.Statement.getUpdateCount()` specifies `-1` when the current
      result is a result set, and the old driver already returned `-1` on the `execute()` path,
      so only `executeQuery` was inconsistent.
  59:
    name: "A new query-context ID at an occupied priority displaces the existing entry on both drivers"
    status: fixed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When a query-context entry arrives with an ID the cache has not seen and a priority another
      ID already holds, the entry at that priority is dropped and the new one takes its place.
    new_driver_behavior: |
      The same: the cache keeps one entry per priority and the newcomer displaces the incumbent.
    description: |
      Callers need no change; the cache is internal to query submission. The case of an ID the
      cache already holds moving onto an occupied priority is not covered by this entry. No test
      gates on it.
    status_rationale: |
      No difference remains for a newly seen ID at an occupied priority.
  60:
    name: "JDBC_ARROW_TREAT_DECIMAL_AS_INT changes JSON results instead of applying to Arrow results only"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      With `JDBC_QUERY_RESULT_FORMAT=JSON`, `JDBC_TREAT_DECIMAL_AS_INT=false`, and
      `JDBC_ARROW_TREAT_DECIMAL_AS_INT=true`, `getObject()` on a scale-0 number returns
      `BigDecimal`; the Arrow flag reaches Arrow results only. Metadata follows
      `JDBC_TREAT_DECIMAL_AS_INT`.
    new_driver_behavior: |
      The same settings make `getObject()` return `Long` for a scale-0 `FIXED` value, while any
      other scale stays `BigDecimal`. Metadata still follows `JDBC_TREAT_DECIMAL_AS_INT`, so the
      SQL type can be `DECIMAL` while `getObject()` returns `Long`. Both flags false yields
      `BigDecimal`.
    description: |
      Both flags default to true, so only a connection that turns `JDBC_TREAT_DECIMAL_AS_INT`
      off and requests JSON results sees this; such code can get `Long` where it expected
      `BigDecimal` from a column its own metadata calls `DECIMAL`. The new driver converts JSON
      results to Arrow, which is what brings the Arrow flag into play.
    status_rationale: |
      Not yet reviewed. The question is whether a JSON-format result should ignore an
      Arrow-named flag — `todo` if it should, `allowed` if a single conversion path with one
      flag is the intended shape. Either answer keeps the JSON-to-Arrow conversion.
  61:
    name: "A GET whose files share a destination basename logs a warning instead of staying silent"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      A GET of stage files that collapse to the same local basename succeeds with no warning and
      leaves one file, chosen by hash order rather than list order. Downloads run one at a time.
    new_driver_behavior: |
      The same GET logs one `WARNING` naming every colliding basename, still succeeds, and still
      leaves one file. With `parallel` greater than 1 the colliding downloads can share one
      temporary file.
    description: |
      A caller with `WARNING` logging enabled sees the collision it previously could not detect;
      the GET's result status and the surviving file are unchanged, so nothing else has to adapt.
    status_rationale: |
      Accepted addition. The other Snowflake drivers log this collision, and warning is the
      smallest useful change — failing the GET or renaming the files would break callers that
      rely on today's silent overwrite.
  62:
    name: "putGetMaxRetries has no upper bound on either driver"
    status: fixed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `putGetMaxRetries` takes any integer with no upper bound; a configured `101` is used as
      `101`.
    new_driver_behavior: |
      The same, under `put_get_max_attempts` with `putGetMaxRetries` as its JDBC alias: `101` is
      used as `101`.
    description: |
      Callers need no change; no configured value is clamped. An unset, zero, or negative value
      is BD#79. No test gates on this entry.
    status_rationale: |
      No difference remains; the clamp this entry recorded does not exist on either driver. The
      key stays because JDBC entries are never removed.
  63:
    name: "An Okta authenticator-request rejection carries the server message on both drivers"
    status: fixed
    type: bug
    reviewed: true
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When Snowflake rejects `authenticator-request` with HTTP 200 and `success: false`, the
      server `message` — for example `"not accepted by your Snowflake account configuration"` or
      `"is not supported"` — appears in the connection error.
    new_driver_behavior: |
      The same: the server `message` appears in the connection error.
    description: |
      Code that reads the exception message to tell an unsupported authenticator from a
      misconfigured account gets the server's wording again. The server's numeric code and
      SQLSTATE are still missing from the error, which this entry does not cover. No test gates
      on this entry.
    status_rationale: |
      No difference remains in the message text. This entry recorded a regression that dropped
      the server message, and the message is present again.
  64:
    name: "The JVM SOCKS system properties do not route the new driver's connections"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      With `disableSocksProxy` unset or false, `-DsocksProxyHost` and `-DsocksProxyPort` apply to
      the driver's HTTP sockets. `disableSocksProxy=true` (or `on`) opens those sockets with no
      SOCKS proxy.
    new_driver_behavior: |
      `-DsocksProxyHost` and `-DsocksProxyPort` have no effect, and `disableSocksProxy` is
      accepted without changing routing. `useProxy`, `proxyHost`, and `proxyPort` configure an
      HTTP or HTTPS proxy, and the JVM's `http.proxyHost` and `https.proxyHost` apply only when
      `-Dhttp.useProxy=true`.
    description: |
      A deployment that reached Snowflake only through a SOCKS proxy cannot connect until it is
      pointed at an HTTP or HTTPS proxy; the HTTP proxy properties are not a substitute for a
      proxy that speaks SOCKS alone.
    status_rationale: |
      Accepted omission. SOCKS support is not implemented, and an HTTP or HTTPS proxy — which
      the explicit properties already cover — is the common deployment.
  65:
    name: "A nonProxyHosts domain entry bypasses the apex and its subdomains instead of matching as a Java glob"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `*.foo.com` bypasses subdomains but not `foo.com`; `foo.com` bypasses that host alone;
      `.foo.com` bypasses only the literal host `.foo.com`. `*` bypasses every host, IP addresses
      included. `192.168.*` and `10.*` are prefix globs, `10.0.0.0/8` matches no real host, and
      `foo.*.com` and `*foo.com` treat `*` as a wildcard. Matching is case-insensitive.
    new_driver_behavior: |
      `*.foo.com`, `foo.com`, and `.foo.com` all bypass that host and every subdomain. `*`
      bypasses domains but not IP addresses. `192.168.*` and `10.*` are not IP patterns, so those
      addresses stay on the proxy, while `10.0.0.0/8` is a CIDR whose subnet bypasses.
      `foo.*.com` and `*foo.com` match almost nothing. Matching is case-sensitive.
      `notfoo.com` does not match `foo.com` on either driver.
    description: |
      A domain entry now covers more hosts than it did, while a bare `*` and the IP prefix globs
      cover fewer — a deployment relying on `192.168.*` or on `*.foo.com` excluding the apex has
      to rewrite the entry. `*.snowflakecomputing.com` still bypasses the account hosts.
    status_rationale: |
      Accepted. The matcher is shared with the other Snowflake drivers, so `nonProxyHosts` means
      the same thing across them; a Java-glob matcher would only serve a caller needing an exact
      host, or subdomains without their parent.

  66:
    name: "Malformed connection-string diagnostics redact the URL"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `Driver.getPropertyInfo` includes the complete malformed JDBC URL in its
      `Invalid Connect String: <url>.` exception message.
    new_driver_behavior: |
      `Driver.getPropertyInfo` reports `Connection string is invalid. Unable to parse.` without
      reproducing the malformed URL. SQLState `08000` and vendor code `200059` are unchanged.
    description: |
      Omitting the URL prevents credentials and tokens in malformed query strings from appearing
      in exception logs.
  67:
    name: "getPropertyInfo validates snake_case proxy alias types"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `Driver.getPropertyInfo` does not reject a non-String `proxy_host` or `proxy_port` value.
    new_driver_behavior: |
      `Driver.getPropertyInfo` rejects a non-String `proxy_host` or `proxy_port` with SQLState
      `22023` and vendor code `200033`, matching the camelCase `proxyHost` / `proxyPort` checks.
    description: |
      Snake-case aliases are first-class names in this driver, so invalid types must fail the same
      way as the canonical spellings.
  68:
    name: "getPropertyInfo treats an empty authenticator as Snowflake password auth"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `Driver.getPropertyInfo` with `authenticator=""` reports no missing properties. Legacy
      `isSnowflakeAuthenticator()` is false for the empty string, so `user` and `password` are
      not requested.
    new_driver_behavior: |
      `Driver.getPropertyInfo` with `authenticator=""` reports missing `user` and `password`, the
      same as an unspecified authenticator.
    description: |
      An empty authenticator is treated as the default Snowflake password flow rather than as a
      distinct authenticator that needs no credentials.
  69:
    name: "getPropertyInfo reports user and password for USERNAME_PASSWORD_MFA"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `Driver.getPropertyInfo` with `authenticator=USERNAME_PASSWORD_MFA` reports no missing
      properties.
    new_driver_behavior: |
      `Driver.getPropertyInfo` with `authenticator=USERNAME_PASSWORD_MFA` reports missing `user`
      and `password`, matching other username/password authenticators.
    description: |
      Username/password MFA still needs those credentials, so introspection asks for them.
  70:
    name: "GET of an encrypted GCS object reports DOWNLOADED while writing ciphertext"
    status: todo
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQL GET from a client-side-encrypted GCS stage completes with STATUS = DOWNLOADED, but
      the destination file contains the still-encrypted object bytes rather than the uploaded
      payload.
    new_driver_behavior: |
      The same GET writes the decrypted payload to the destination, so the downloaded bytes
      match what PUT uploaded.
    description: |
      The old driver's GCS download path leaves ciphertext on disk while still reporting
      DOWNLOADED. Tracked as SNOW-4143382 on the old driver. Drop the new-driver-only content
      assertion in GcsVirtualUrlEnvTest when the reference driver is a release that decrypts.
  71:
    name: "JDBC auto-configuration uses shared profile resolution"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Profiles are read only from `connections.toml`. The exact, case-sensitive `connectionName`
      URL key overrides `SNOWFLAKE_DEFAULT_CONNECTION_NAME`, then falls back to `default`.
      Auto URL queries are parsed loosely, and duplicate aliases in JDBC `Properties` are rejected
      even when their values agree. A missing profile reports
      `The Connection <name> not found in connections.toml file.` with no SQLState and vendor code
      zero.
    new_driver_behavior: |
      Profiles can also come from `[connections.<name>]` in `config.toml`, with
      `connections.toml` taking precedence. JDBC `Properties` override URL options and selectors;
      `connectionName` and `connection_name` are matched case-insensitively. Selection then falls
      back through `SNOWFLAKE_DEFAULT_CONNECTION_NAME`, `config.toml`'s
      `default_connection_name`, and `default`.
      A direct `url` entry in JDBC `Properties` supplies the auto URL when the public JDBC URL
      argument is blank; inherited `Properties` defaults do not.

      Auto URL queries and selector types are validated strictly. Malformed queries, fragments,
      duplicate aliases, and non-string JDBC `Properties` selectors report
      `INVALID_PARAMETER_VALUE`. `Driver.getPropertyInfo` uses the same fail-closed auto URL parse
      as `connect` instead of reporting `INVALID_CONNECTION_STRING`. Equal alias values in JDBC
      `Properties` are accepted. A missing profile keeps the old driver's message but reports
      SQLState `22023` and vendor code `200047`.

      Profile option names, OAuth token files, configuration paths, and Unix file permissions
      follow the shared configuration rules. As a result, some JDBC-only TOML aliases and the old
      driver's default token path and permission-skip environment variable are not honored.
    description: |
      JDBC auto URLs use the same profile resolution and validation rules as the shared
      configuration layer while preserving JDBC `Properties` precedence and a classifiable
      missing-profile error.
  72:
    name: "Failed array-bind executeBatch throws BatchUpdateException"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      A failed array-bind (single-RPC) `executeBatch()` INSERT throws `SnowflakeSQLException`.
    new_driver_behavior: |
      The same failure throws `BatchUpdateException`. SQLSTATE is unchanged; a `catch` of only
      `SnowflakeSQLException` does not see it. Per-row `Statement.executeBatch` and non-array-bind
      prepared batches already throw `BatchUpdateException` on both drivers.
    description: |
      Aligns array-bind batch failures with the JDBC contract. Applications should catch
      `SQLException` or `BatchUpdateException`.
  73:
    name: "workloadIdentityAwsExternalId is not sent on AWS AssumeRole"
    status: todo
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      With authenticator=WORKLOAD_IDENTITY and workloadIdentityProvider=AWS, snowflake-jdbc
      passes workloadIdentityAwsExternalId to STS AssumeRole as ExternalId when
      SF_ENABLE_WIF_AWS_EXTERNAL_ID is true. When that variable is unset, a non-empty
      workloadIdentityAwsExternalId fails the connection with WORKLOAD_IDENTITY_FLOW_ERROR
      ("Connection property workloadIdentityAwsExternalId is not enabled"). For any other
      authenticator or provider the property is ignored.
    new_driver_behavior: |
      sf_core's AWS AssumeRole call has no external-id field. With
      authenticator=WORKLOAD_IDENTITY and workloadIdentityProvider=AWS, a non-empty
      workloadIdentityAwsExternalId fails the connection ("Connection property
      workloadIdentityAwsExternalId is not enabled"). The value is not sent. For any
      other authenticator or provider it stays an unknown connection parameter and connect
      continues.
    description: |
      Role-chaining that depends on an STS external ID works on snowflake-jdbc when
      SF_ENABLE_WIF_AWS_EXTERNAL_ID is set. The universal JDBC driver rejects a non-empty
      value until sf_core can send ExternalId (SNOW-3575172).
  74:
    name: "Azure workloadIdentityImpersonationPath of one service principal is accepted"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      authenticator=WORKLOAD_IDENTITY with workloadIdentityProvider=AZURE and any non-empty
      workloadIdentityImpersonationPath fails with WORKLOAD_IDENTITY_FLOW_ERROR
      ("Identity impersonation is not available on Azure").
    new_driver_behavior: |
      sf_core accepts exactly one Azure service-principal client id in
      workload_identity_impersonation_path and rejects any other hop count. JDBC follows
      that shared behavior. A native AKS workload identity (AZURE_CLIENT_ID, AZURE_TENANT_ID,
      and AZURE_FEDERATED_TOKEN_FILE injected by the Azure Workload Identity webhook) is
      exchanged directly; impersonation is rejected in that environment.
    description: |
      snowflake-jdbc rejects every Azure impersonation path. The universal driver uses the
      sf_core implementation shared with the other wrappers, which allows a single Azure hop.
  75:
    name: "Workload Identity connect failures omit SQLSTATE and vendor code"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Client-local Workload Identity connect failures (missing or invalid provider, missing
      OIDC token, malformed OIDC token, rejected AWS external id) throw
      WORKLOAD_IDENTITY_FLOW_ERROR with SQLSTATE 08000 and vendor code 200071.
    new_driver_behavior: |
      The same failures still throw SQLException with a message that identifies the bad
      setting, but getSQLState() is null and getErrorCode() is 0. sf_core reports them as
      ordinary missing or invalid parameters; JDBC does not remap them to
      WORKLOAD_IDENTITY_FLOW_ERROR.
    description: |
      snowflake-jdbc folds every local WIF connect rejection into one flow-error identity.
      The universal driver keeps the shared sf_core parameter-validation kinds used by the
      other wrappers.
  76:
    name: "Auto-compressed PUT does not store Content-Encoding gzip"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      PUT of an auto-compressed file to GCS with GCS_USE_DOWNSCOPED_CREDENTIAL=true
      stores Content-Encoding gzip on the object. PUT of an auto-compressed file to
      S3 stores Content-Encoding gzip on the object. PUT through a GCS presigned URL
      stores a blank Content-Encoding when the file is gzip.
    new_driver_behavior: |
      A GCS PUT sends no Content-Encoding header, including a bearer-token upload of
      a gzip payload. An S3 PUT sends no Content-Encoding. GET and COPY still treat
      the file as gzip from its name and the compression recorded by PUT.
    description: |
      GCS decompressive transcoding returns a Content-Encoding gzip object
      uncompressed to a client that does not send Accept-Encoding gzip. The old
      driver's presigned-URL upload replaces gzip with a blank header value. The
      new driver leaves the header off. Both leave the object unmarked as gzip.
      S3 does not transcode. The old driver still stores gzip there. Downloading
      that file does not decompress it again from that metadata. Clients that
      honor Content-Encoding would decompress the body. The new driver omits the
      header.
    status_rationale: |
      Storing gzip would make GCS serve uncompressed bytes for a .gz object and
      would make some S3 clients do the same. The common GCS presigned path of the
      old driver already stores a blank encoding. COPY and driver GET use the
      compression registered with the file.

  77:
    name: "HTTP attempts use a 300-second wall-clock timeout instead of socket inactivity"
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      HTTP_CLIENT_SOCKET_TIMEOUT (default 300000 ms) is Apache HttpClient SO_TIMEOUT:
      the gap between consecutive packets. A slow but active download can run longer
      than 300 seconds.
    new_driver_behavior: |
      retry_timeout defaults to 300 seconds and bounds each HTTP attempt from start
      until the response body finishes. 0 removes the per-attempt limit. Result chunk
      downloads do not use this policy.
    description: |
      The default duration matches the old JDBC socket timeout. The new timer does not
      reset when bytes arrive, so a healthy download slower than size/300 throughput
      can fail here.

  78:
    name: "Millisecond timeout properties apply in whole seconds"
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      HTTP_CLIENT_CONNECTION_TIMEOUT and HTTP_CLIENT_SOCKET_TIMEOUT are milliseconds.
      networkTimeout is the retry budget for transient failures, including query
      requests, in milliseconds divided down to seconds.
    new_driver_behavior: |
      The three properties take milliseconds and apply in whole seconds, rounded up, so a
      positive value below 1000 ms becomes 1 second. networkTimeout does not bound retries
      of query requests.
    description: |
      The properties are JDBC-scoped aliases for connect_timeout, retry_timeout, and
      request_timeout, and the JDBC wrapper converts milliseconds to seconds. request_timeout
      covers non-query requests only. retry_timeout is a per-attempt wall clock (entry 77).

  79:
    name: "Unset putGetMaxRetries retries 6 times"
    status: unknown
    type: bug
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When putGetMaxRetries is absent, PUT and GET retry 25 times. A zero or
      negative value is kept.
    new_driver_behavior: |
      When put_get_max_attempts is absent, zero, or negative, PUT and GET
      retry 6 times. A positive value such as 101 is used as given.
    description: |
      A transfer that is not given a retry count stops sooner. Setting a
      positive count still uses that count. The claimed upper clamp is
      entry 62.
    status_rationale: |
      Status stays unknown until the default of 6 versus 25 is accepted or
      changed. This is not an upper bound.
