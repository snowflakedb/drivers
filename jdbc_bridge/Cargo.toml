[package]
name = "jdbc_bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "jdbc_bridge"
crate-type = ["cdylib"]

[features]
# Links the FIPS-validated crypto module (aws-lc-fips-sys) instead of
# aws-lc-sys. Despite the name it is no longer TLS-only: JWT signing, DPoP,
# stage file encryption and private-key parsing now run on the same module. The
# name and the caveat both stand -- see the `fips-tls` feature comment in
# sf_core/Cargo.toml for why this is still not a FIPS artifact on its own.
fips-tls = ["sf_core/fips-tls"]

[dependencies]
sf_core = { path = "../sf_core" }
proto_utils = { path = "../proto_utils" }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tracing = "0.1.41"
tokio = { version = "1.50.0", features = ["rt"] }

[dependencies.jni]
version = "0.21"
default-features = false
features = ["invocation"] 
