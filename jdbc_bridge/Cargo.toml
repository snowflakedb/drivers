[package]
name = "jdbc_bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "jdbc_bridge"
crate-type = ["cdylib"]

[features]
# Static OpenSSL for the release fat-jar libs (dev/test builds link system OpenSSL).
vendored-openssl = ["sf_core/vendored-openssl"]
# Links the FIPS-validated TLS backend (aws-lc-fips-sys) instead of aws-lc-sys.
# Covers TLS only, which is what the name says -- see the `fips-tls` feature
# comment in sf_core/Cargo.toml for why this is not a FIPS artifact on its own.
fips-tls = ["sf_core/fips-tls"]

[dependencies]
sf_core = { path = "../sf_core" }
proto_utils = { path = "../proto_utils" }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tracing = "0.1.41"
tokio = { version = "1.50.0", features = ["rt"] }

[dependencies.jni]
version = "0.21"
default-features = false
features = ["invocation"] 
