
behavior_differences:
  1:
    name: "Header of a gzip-compressed file does not contain filename"
    status: allowed
    type: bug
    reviewed: true
    is_breaking_change: true
    impact: medium

  2:
    name: "DEFLATE compression type option is now correctly auto-detected"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium

  3:
    name: "BROTLI compression type option is now supported"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: true
    impact: low

  5:
    name: "Private key password parameter name changed"
    status: allowed
    type: api_incompatibility
    reviewed: true
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `private_key_file_pwd`
    new_driver_behavior: |
      `private_key_password`. The legacy name `private_key_file_pwd` is still accepted
      and mapped to `private_key_password`, but emits a `DeprecationWarning`.

  11:
    name: "CONFIG_PARSER deprecated alias removed"
    status: allowed
    type: api_incompatibility
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      CONFIG_PARSER is a deprecated alias for CONFIG_MANAGER that emits DeprecationWarning.
    new_driver_behavior: |
      CONFIG_PARSER module attribute no longer exists; accessing it raises AttributeError.

  12:
    name: "Deprecated add_subparser method and _sub_parsers property removed"
    status: allowed
    type: api_incompatibility
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      add_subparser() and _sub_parsers are deprecated aliases that emit DeprecationWarning.
    new_driver_behavior: |
      add_subparser() and _sub_parsers are removed; accessing them raises AttributeError.

  13:
    name: "Empty connections.toml preserves config.toml connections"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When connections.toml exists but is empty, it replaces config.toml connections with an empty set.
    new_driver_behavior: |
      When connections.toml exists but is empty, connections from config.toml are preserved.

  14:
    name: "ConfigManager without file_path returns MissingConfigOptionError on option retrieval"
    status: allowed
    type: bug
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Retrieving an option from a ConfigManager with no file_path raises ConfigManagerError about missing file_path.
    new_driver_behavior: |
      Retrieving an option from a ConfigManager with no file_path returns an empty config and raises MissingConfigOptionError.

  15:
    name: "Session parameter updates visible across cursors without execute"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Each cursor populates its session parameters independently from query responses, so a cursor that has not executed a query will not reflect changes made by another cursor.
    new_driver_behavior: |
      Cursor session parameters (e.g. cursor.timestamp_output_format) read from a shared connection-level cache, so changes made by one cursor are immediately visible to other cursors on the same connection without requiring a query.

  16:
    name: "MFA token caching parameter renamed"
    status: allowed
    type: api_incompatibility
    reviewed: true
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `client_request_mfa_token` enables MFA token caching.
    new_driver_behavior: |
      `client_store_temporary_credential` enables MFA token caching. The legacy name
      `client_request_mfa_token` is also accepted as a backward-compatible alias and is mapped
      to `client_store_temporary_credential`, but emits a `DeprecationWarning`.

  17:
    name: "rest.request() validates HTTP method (internal API)"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Does not validate the method parameter; attempts the request, which may result in an HttpError from the server.
    new_driver_behavior: |
      Raises ValueError for unsupported HTTP methods (only 'get' and 'post' are accepted).
    description: |
      Internal API used by Snowflake CLI via connection.rest.request().

  18:
    name: "JSONResultBatch supports Arrow and Pandas conversion"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `JSONResultBatch.to_arrow()` and `JSONResultBatch.to_pandas()` raise `NotSupportedError` because JSON-format chunks have no Arrow representation.
    new_driver_behavior: |
      `JSONResultBatch` and `ArrowResultBatch` are backward-compatibility aliases for the Arrow-backed `ResultBatch`.
      `to_arrow()`, `to_pandas()`, and `create_iter(iter_unit=TABLE_UNIT)` all work on every batch regardless of its class.

  19:
    name: "write_pandas create_temp_table parameter removed"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `create_temp_table=True` is accepted as a deprecated boolean alias for `table_type='temp'`; the legacy
      connector translates it and emits a `DeprecationWarning` directing callers to `table_type='temp'` instead.
      This parameter has never been removed as of legacy connector v4.7.1.
    new_driver_behavior: |
      The `create_temp_table` parameter no longer exists on either the sync or async `write_pandas` signature.
      Passing `create_temp_table=...` raises `TypeError: write_pandas() got an unexpected keyword argument
      'create_temp_table'` instead of being translated and warned about.
    description: |
      An earlier revision of the universal driver restored a connector-level warn-and-translate shim for
      `create_temp_table` to match the legacy connector's own signature. Investigation showed that shim has no
      real caller: Snowpark's own `Session.write_pandas` (`snowpark-python/src/snowflake/snowpark/session.py:3536-3624`)
      already translates `create_temp_table` to `table_type` — with its own deprecation warning — at its own layer,
      before ever calling the connector's `write_pandas`, and always forwards `table_type=` only. No real Snowpark
      caller passes `create_temp_table` through to the connector, so removing the parameter entirely is safe in
      practice despite being a breaking change relative to the legacy connector's own public signature.

  20:
    name: "ResultBatch does not expose session_manager or http_config"
    status: allowed
    type: api_incompatibility
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `ResultBatch` exposes `session_manager` (get/set) and `http_config` (get/set)
      properties used to control HTTP behavior for chunk downloads when the connection is no
      longer active. A cloned `SessionManager` is serialized with the batch, allowing chunk
      downloads without an active connection.
    new_driver_behavior: |
      `ResultBatch` does not have `session_manager` or `http_config` properties.
      Chunk fetching is handled internally by the Rust core, so there is no Python-level HTTP
      session management to configure on individual batches. After deserializing a `ResultBatch`
      (e.g. via pickle), a live `Connection` may be provided but is not required for a chunk download.

  21:
    name: "Closed cursor raises InterfaceError on all operations"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      Only `execute()` has a closed-cursor guard (`InterfaceError`, errno=252006).
      Other methods fail incidentally based on internal state:
        - `fetchone`/`fetchmany`/`fetchall` raise `TypeError` because internal state is `None`.
        - `executemany`, `callproc`, `reset`, `abort_query`, `query_result`, etc. raise `AttributeError` for the same reason.
        - `get_results_from_sfqid` has no guard at all.
    new_driver_behavior: |
      Every cursor method now validates that the cursor is open and raises `InterfaceError("Cursor is closed.", errno=252006)` if it isn't.
      Two guards are used:
          - `@_requires_open` (checks both cursor and connection) on:
            `execute`, `execute_async`, `executemany`, `describe`, `callproc`, `abort_query`, `get_results_from_sfqid`,
            `query_result`, `get_result_batches`, `fetch_arrow_batches`, `fetch_arrow_all`, `fetch_pandas_batches`, `fetch_pandas_all`.
          - `@_requires_open_cursor_not_connection` (checks only the cursor's own `_closed` flag, NOT the connection) on:
            `fetchone`, `fetchmany`, `fetchall`, and `reset`.
            This is a deliberate carve-out so that already-buffered result rows remain readable after `connection.close()`,
            matching the old driver's behavior for that scenario.

  22:
    name: "Fetching before execute raises ProgrammingError"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      Calling `fetchone`, `fetchmany`, `fetchall`, or iterating a cursor before any query has been executed has no guard, so they raise `TypeError` because the cursor's internal result state is `None`.
    new_driver_behavior: |
      Calling `fetchone`, `fetchmany`, `fetchall`, or iterating a cursor before any query has been executed raises
      `ProgrammingError("No results available (already consumed or not produced by this query)", errno=252009)` (`ER_NO_DATA_FOUND`).

  23:
    name: "Connection does not expose a public connect() method"
    status: unknown
    type: api_incompatibility
    reviewed: true
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      `SnowflakeConnection` exposes a public `connect(**kwargs)` method that `__init__` calls at the end of construction.
      Despite being public, the method was not usable as a reconnect mechanism: after a successful connection
      the driver calls `auth_class.reset_secrets()` and `self._password = None`, wiping credential state from the auth instance.
      A subsequent `connect()` call — even with full kwargs re-supplied — fails.
    new_driver_behavior: |
      `Connection` does not have a public `connect()` method.
      The connection to Snowflake is established internally during `__init__` via a private `_connect()` call.
      All connection parameters must be provided at construction time.

  24:
    name: "region connection parameter and Connection.region property removed"
    status: unknown
    type: api_incompatibility
    reviewed: true
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      `region` is accepted as a `connect()` kwarg and used internally to
      construct the Snowflake hostname. `Connection.region` returns the value, emitting a
      `PendingDeprecationWarning`. No known consumer (Airflow, Snow CLI, Snowpark,
      SQLAlchemy) reads the property — they all store `region` independently.
    new_driver_behavior: |
      The `region` connection parameter is not accepted and `Connection` does
      not have a `region` property. Callers that previously relied on `region` to derive
      the hostname must supply the fully-qualified `account` identifier (e.g.
      `"myaccount.us-east-1"`) or set `host` explicitly instead.

  25:
    name: "client_fetch_threads deprecated; client_fetch_use_mp removed"
    status: allowed
    type: api_incompatibility
    reviewed: true
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      `client_fetch_threads` controls the chunk-fetch pool size (defaulting to
      `client_prefetch_threads`). `client_fetch_use_mp=True` switches the pool from
      `ThreadPoolExecutor` to `ProcessPoolExecutor`.
    new_driver_behavior: |
      `client_fetch_threads` is accepted as a deprecated alias for `client_prefetch_threads`
      and emits a `DeprecationWarning`. The legacy `client_fetch_use_mp` parameter (which switched
      chunk fetching from a thread pool to a process pool) has no equivalent: the universal driver
      always uses a thread pool. Passing `client_fetch_use_mp` is accepted for source compatibility
      but has no effect and emits a `DeprecationWarning`.

  26:
    name: "client_session_keep_alive[_heartbeat_frequency] setters removed"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      `Connection.client_session_keep_alive` and
      `Connection.client_session_keep_alive_heartbeat_frequency` expose
      setters. In the old connector both setters wrote to a private attribute
      having no effect on the live heartbeat thread either.
    new_driver_behavior: |
      Both attributes are read-only properties. Assignment raises
      `AttributeError`.

  27:
    name: "S3 endpoint for cn-* regions delegated to AWS SDK"
    status: unknown
    type: unknown
    reviewed: false
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      For S3 stages in China regions (`cn-*`), the old connector unconditionally constructs
      the endpoint as `https://<bucket>.s3.<region>.amazonaws.com.cn` in
      `S3StorageClient.transfer_accelerate_config` (`s3_storage_client.py`), regardless of the
      `useS3RegionalUrl` / `useRegionalUrl` flags returned by GS. This is required because the
      old connector uses its own REST client for PUT/GET and does not go through `boto3`'s
      endpoint resolver for transfers.
    new_driver_behavior: |
      The universal driver only sets an explicit S3 endpoint when either
      `stageInfo.endpoint` is set (FIPS / VPCE / custom override) or
      `useS3RegionalUrl || useRegionalUrl` is true. For a `cn-*` region without any of those
      flags, no endpoint override is configured and `aws-sdk-s3`'s default endpoint resolver
      is trusted to pick `amazonaws.com.cn` from the region. This matches snowflake-jdbc
      (`SnowflakeS3Client.java`) and libsnowflakeclient (`SnowflakeS3Client.cpp`), which both
      delegate to their respective AWS SDKs in the same conditions.
    description: |
      The Python connector is the outlier among reference drivers: JDBC and libsnowflakeclient
      already trust the AWS SDK partition resolver for `cn-*` when no regional-URL flag is set.
      Verification on a real `cn-*` stage end-to-end is still pending.

  28:
    name: "oauth_enable_refresh_tokens parameter has no effect"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      `oauth_enable_refresh_tokens` (default `True`) gates whether the refresh
      token returned by the IdP is used to refresh expired access tokens.
    new_driver_behavior: |
      `oauth_enable_refresh_tokens` is accepted for source compatibility but
      has no effect and emits a `DeprecationWarning`. The universal driver
      always uses the refresh token when the IdP returns one; use
      `client_store_temporary_credential` to gate *caching* the refresh token
      on disk.

  29:
    name: "oauth_credentials_in_body sends client_secret_post (body only, not body+header)"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `oauth_credentials_in_body=True` (default `False`) switches the
      `OAUTH_CLIENT_CREDENTIALS` token request from HTTP Basic auth
      (`client_secret_basic`) to *also* including `client_id`/`client_secret`
      in the request body. The legacy connector's
      `AuthByOauthCredentials._request_tokens` adds the credentials to the
      form body while `_oauth_base._create_token_request_headers` still
      emits the `Authorization: Basic` header unconditionally — so the
      credentials are sent in BOTH the header and the body. Added to
      `snowflake-connector-python` after an explicit customer request
      tracked under `SNOW-2300649`.
    new_driver_behavior: |
      `oauth_credentials_in_body=True` is honored: the universal driver
      sends `client_id`/`client_secret` in the token-request body only
      (RFC 6749 `client_secret_post`) and does NOT emit the
      `Authorization: Basic` header, matching the Node.js driver's
      `ClientSecretPost` shape. The default (`False`) remains HTTP Basic
      (`client_secret_basic`), which RFC 6749 §2.3.1 calls out as the only
      client authentication method an Authorization Server MUST support:

          > "The authorization server MUST support the HTTP Basic
          >  authentication scheme for authenticating clients that were
          >  issued a client password."

      The behavioral difference is the body-only form: where legacy Python
      duplicates the credentials in both the Basic header and the body, the
      universal driver sends them in the body only. IdPs that strictly
      require `client_secret_post` are satisfied by both drivers; IdPs that
      happen to also read the Basic header on a `client_secret_post`
      request will only see the body form from the universal driver.

  30:
    name: "enable_stage_s3_privatelink_for_us_east_1 renamed to use_s3_regional_url"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      `enable_stage_s3_privatelink_for_us_east_1` is the connection kwarg / session
      parameter that forces PUT/GET to use the S3 regional endpoint
      (`s3.<region>.amazonaws.com[.cn]`) instead of the global one. Required for
      accounts using PrivateLink-to-S3 and for Snowpipe Streaming. The misleading
      `_for_us_east_1` suffix is historical: the feature applies to any S3 region.
    new_driver_behavior: |
      `use_s3_regional_url` is the canonical connection kwarg. The name matches
      the `StageInfo.use_s3_regional_url` field that drives endpoint selection
      and aligns with libsnowflakeclient's connection-level `use_s3_regional_url`
      attribute. `enable_stage_s3_privatelink_for_us_east_1` is accepted as a
      deprecated alias and emits a `DeprecationWarning`. The server-pushed session
      parameter `ENABLE_STAGE_S3_PRIVATELINK_FOR_US_EAST_1` continues to be honored
      verbatim (it is the same string all reference drivers — Python, JDBC,
      libsnowflakeclient — read from the login response).

  31:
    name: "HTTP_PROXY/HTTPS_PROXY env vars are not consulted by default"
    status: unknown
    type: api_incompatibility
    reviewed: false
    impact: high
    is_breaking_change: true
    old_driver_behavior: |
      Since 3.17.0, the legacy connector unconditionally consults
      `HTTP_PROXY`/`HTTPS_PROXY`/`NO_PROXY` env vars and lets them override
      explicit `proxy_host`/`proxy_port` connection parameters. A globally-set
      env var silently overrides per-connection settings.
    new_driver_behavior: |
      Two changes that together standardize proxy precedence with
      JDBC/Go/Node.js/ODBC:

      1. Default-deny env detection. The new `use_proxy_env` parameter
         (default: `false`) gates whether `HTTP_PROXY`/`HTTPS_PROXY`/`NO_PROXY`
         are consulted at all. Customers who relied on env-var auto-pickup
         must set `use_proxy_env=True` (or pass the env-equivalent ODBC alias
         `PROXYWITHENV=true`).

      2. Explicit params win. When both `use_proxy_env=True` AND an explicit
         `proxy_host`/`proxy_port` (or legacy `PROXY` URL) are set, the
         explicit param wins; env vars are ignored.

      Both legacy formats are accepted: snowflake-connector-python
      `proxy_host`/`proxy_port`/`proxy_user`/`proxy_password`/`no_proxy`
      kwargs, and the legacy ODBC `PROXY=[scheme://][user:pass@]host[:port]`
      URL form. When both are set, individual fields override URL components
      per-field. See (snowflakedb/drivers#29).

  32:
    name: "Azure Blob PUT does not set Content-Encoding header"
    status: allowed
    type: bug
    reviewed: false
    impact: high
    is_breaking_change: true
    old_driver_behavior: |
      The Python connector sets `Content-Encoding: utf-8` on Azure Blob single-shot
      PUT (the upload-chunk path in `azure_storage_client.py`) and
      `x-ms-blob-content-encoding: utf-8` on the block-list commit (the final PUT
      that finalizes a multi-block upload of a large file). The value is wrong:
      `utf-8` is a character encoding, not an HTTP content coding (RFC 9110 §8.4
      expects values like `gzip`, `br`, `deflate`, `zstd`, `identity`). Azure
      tolerates the wrong value but persists it as a blob property echoed on
      subsequent GETs.
    new_driver_behavior: |
      The universal driver omits `Content-Encoding` and `x-ms-blob-content-encoding`
      entirely on Azure PUT, matching the Snowflake JDBC and libsnowflakeclient
      drivers, which also omit them. The contract applies to every Azure PUT
      codepath in UD, present and future. Existing blobs uploaded by the legacy
      Python connector retain their stored `Content-Encoding: utf-8` property;
      reading them with the new driver still works, because no driver acts on
      the property when downloading.

  33:
    name: "Concurrent interactive auth prompts are serialized (disable_parallel_user_prompt)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When a connection pool opens multiple connections concurrently for the same
      `<user, host>` and interactive authentication is required (external browser,
      USERNAME_PASSWORD_MFA, OAuth authorization code), each connection runs its
      own interactive flow, so the user is shown one prompt per connection. There
      is no parameter to serialize the prompts.
    new_driver_behavior: |
      Interactive auth prompts are serialized by a process-global per-`<user, host,
      token-type>` lock: the first connection runs the interactive flow and caches
      the token; connections that arrive while it holds the lock wait and then reuse
      the cached token, so the user sees only one prompt. Locking engages only when
      `client_store_temporary_credential=true` and `disable_parallel_user_prompt=true`
      (the default). Set `disable_parallel_user_prompt=false` to opt out and let each
      concurrent connection show its own prompt. The lock is released on failure and
      on browser-callback timeout so a waiting connection can still authenticate.

  34:
    name: "executemany uses server arrayBindSupported flag to gate array binding"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      executemany detects INSERT via a client-side regex (^insert\s+into, IGNORECASE).
      Statements that do not match the regex — including non-INSERT DML (UPDATE, DELETE,
      MERGE) — fall back to per-row execution with scalar JSON binding.
    new_driver_behavior: |
      executemany issues a describe-only request first and reads the server's
      arrayBindSupported flag, the same mechanism used by the JDBC and ODBC drivers.
      If the server reports array binding is supported, all rows are transposed and
      sent in a single array-bound request (with CSV stage upload above
      CLIENT_STAGE_ARRAY_BINDING_THRESHOLD). If not supported, each parameter set is
      executed individually with scalar JSON binding. For current Snowflake SQL, the
      observable outcome is identical to the old regex approach; the server flag is
      more robust for future statement types the server may make array-bindable.
    description: |
      The server's arrayBindSupported flag is the authoritative source and is already
      used by JDBC (describeSqlIfNotTried in SnowflakePreparedStatementImpl) and the
      C/ODBC driver (_snowflake_execute_ex describe-only request). The universal driver
      now aligns with those implementations. The extra describe round-trip is the same
      cost JDBC and ODBC already pay.

  35:
    name: "OAuth bad client secret surfaces IdP error slug instead of generic browser message"
    status: unknown
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When `oauth_client_secret` is wrong during `OAUTH_AUTHORIZATION_CODE` or
      `OAUTH_CLIENT_CREDENTIALS`, the legacy connector fails with a generic
      login error such as `Invalid HTTP request from web browser. Idp
      authentication could have failed.` The IdP's OAuth `error` slug (for example
      `invalid_client`) is not surfaced.
    new_driver_behavior: |
      The universal driver propagates the IdP token-endpoint error into the login
      failure message, for example `Identity Provider responded with error:
      invalid_client: ... OAuth flow failed`. The OAuth error slug is visible to
      callers parsing the exception text.

  37:
    name: "Session token authentication: eager validation and master_token requirement"
    status: todo
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When `session_token` is passed as a connection parameter, the old driver uses it
      directly as the bearer token without any upfront validation. The session is
      considered established immediately; if the token is invalid, the failure surfaces
      later as an `HttpError` (errno 290401) during the post-login heartbeat call.
      `master_token` is not required and may be omitted.
    new_driver_behavior: |
      When `session_token` is passed, the universal driver calls `/session/token-request`
      (RENEW) before considering the connection open. This validates the tokens eagerly
      and returns the real server-assigned `session_id` so telemetry is attributed
      correctly. If the tokens are invalid, a `DatabaseError` is raised from
      `connect()` before the connection object is returned to the caller.
      `master_token` is required alongside `session_token` because the RENEW endpoint
      uses it as the Authorization bearer; omitting it raises a `ProgrammingError`
      at configuration time.
    description: |
      The eager-validation design aligns session token auth with every other auth
      method in UD: callers can rely on `connect()` raising on bad credentials rather
      than discovering failures at first use. The `master_token` requirement is a
      direct consequence of the RENEW call — without it there is no way to authorize
      the refresh request.

  38:
    name: "OAuth token/authorization endpoint URLs must use HTTPS (non-loopback http rejected)"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `oauth_token_request_url` (and the authorization-code `external_authorization_url`)
      accept any URL scheme. For the token endpoint an `http://` value produces only a log
      warning ("OAuth URL uses insecure HTTP protocol") and the request proceeds. The
      authorization-code flow does require `https://` for the *authorization* URL, but not
      for the *token* URL, and there is no loopback carve-out.
    new_driver_behavior: |
      The universal driver requires `oauth_token_request_url` / `oauth_authorization_url` to
      use the `https` scheme and rejects a non-loopback `http://` value at connect time
      (InvalidParameterValue). `http://` remains accepted for loopback hosts (127.0.0.0/8,
      ::1, localhost) so local IdP mocks keep working. RFC 6749 §3.1.2.1 and the OAuth 2.0
      Security BCP require TLS on these endpoints. The loopback redirect URI is unaffected.
    description: |
      Security hardening tracked under SNOW-3663588; the same difference is documented as
      BD#10 in jdbc/ and BD#81 in odbc_tests/ BehaviorDifferences.yaml. Callers that configured
      a plaintext `http://` IdP token endpoint (rare; typically an internal proxy) must switch
      to `https://`.

  39:
    name: "Failed GET download no longer leaves an orphaned .part file"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    status_rationale: |
      The legacy connector staged downloads in a `<dst>.part` file but never removed it on the
      failure path, so an interrupted GET left an orphaned `.part` behind. The universal driver
      removes the staging file on failure, so a failed download leaves no debris. The improvement
      is accepted.
    old_driver_behavior: |
      The legacy connector downloads to an intermediate `<dst>.part` file
      (`SnowflakeStorageClient.intermediate_dst_path`) and renames it to the final path only on
      full success. On a failed or interrupted GET (chunk error, digest/decryption failure, or
      retry exhaustion) `finish_download` takes its failure branch, which only removes a
      pre-existing final file and never unlinks the `.part` (`delete_client_data` cleans only the
      separate `tmp_dir`). An orphaned `<dst>.part` is therefore left behind in the destination
      directory until the user removes it manually. The final destination path itself is not
      corrupted, because the rename to it happens only on success.
    new_driver_behavior: |
      GET downloads assemble into a sibling `<dst>.part` staging file and rename it to the final
      destination only after the transfer completes successfully (and, for client-side-encrypted
      files, only after the SHA-256 content digest verifies). The user-visible destination path is
      therefore only ever a complete file. On failure the driver drains any in-flight chunk writes
      and then removes the `.part` staging file, so a failed download leaves the filesystem clean.
      (A client-side-encrypted download stages ciphertext in a separate temporary file that is
      likewise removed on failure and unlinked once decrypted.) The only residue possible is after
      a hard process kill (SIGKILL / power loss), where at most a single `<dst>.part` can remain —
      self-documenting, and overwritten by the next download of the same file rather than
      accumulating. The contract is cloud-generic (S3, Azure, and GCS).

  40:
    name: "Azure SAS refresh triggers on any 403, not only token-expiry-reason matches"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      On an Azure Blob 403 the Python connector only refreshes the SAS when the
      403 reason phrase matches one of two hard-coded strings in
      `azure_storage_client.py`'s `TOKEN_EXPIRATION_ERR_MESSAGE`
      ("Signature not valid in the specified time frame", "Server failed to
      authenticate the request."). `_has_expired_token` gates on
      `response.status_code == 403 and any(msg in response.reason ...)` — a
      reason-gated trigger, not status-only. Any 403 whose reason is outside that
      two-string set is therefore not refreshed and the operation fails: a
      recoverable expiry reported with a different reason phrase, or a response
      that carries no reason phrase at all. (CONFIRMED from source.)
    new_driver_behavior: |
      The universal driver refreshes on ANY Azure 403 (`is_expired_sas_error`
      returns `status_code == 403`, body/reason-blind), re-issues the PUT/GET
      query to obtain a fresh `stageInfo`, and retries with the new SAS — matching
      the JDBC any-403 behavior, so it recovers every 403 whose reason the legacy
      connector would not match. If the refreshed SAS is also rejected, the
      terminal 403 still surfaces to the caller. Demonstrated by the parity test
      `test_should_recover_when_azure_put_returns_403_regardless_of_the_reason_phrase`,
      which forces the trigger divergence over HTTP/1.1 with a SYNTHETIC
      non-matching reason ("Signature fields not well formed.") — a fabricated
      stimulus that isolates the trigger-mechanism difference (the common real
      Azure expiry reason does match legacy's gate, so what differs is the
      mechanism, widening for any reason legacy does not list).

  41:
    name: "Terminal Azure 403 after SAS refresh is logged with outcome-tiered severity"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SAS-refresh handling on the Azure transfer path is logged at debug only, with
      no severity tiering by outcome.
    new_driver_behavior: |
      Log severity tracks the outcome of the 403. A 403 that refresh recovers logs
      at debug (no warn). A terminal non-token 403 (the refreshed SAS is still
      rejected) logs at warn carrying status, the Azure <Code>, the reason (None on
      HTTP/2), and a SAS-redacted URL. A failure of the refresh mechanism itself
      logs at error. Beyond severity, the outcomes themselves diverge when the
      refresh's re-issued GS query fails: the universal driver bounds that failure
      and raises a terminal error, whereas the legacy connector retries the refresh
      GS call under a query RetryCtx whose network_timeout defaults to None
      (infinite), so it retries unboundedly rather than surfacing a terminal error.

  42:
    name: "enable_crl_cache removed; CRL caches controlled by independent toggles"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `enable_crl_cache` (default `True`) is the master switch for CRL caching.
      When `False`, both the in-memory and on-disk CRL caches are disabled
      regardless of `enable_crl_file_cache`. When `True`, an in-memory cache is
      always created and `enable_crl_file_cache` (default `True`) independently
      controls whether a disk cache is also used.
    new_driver_behavior: |
      `enable_crl_cache` is accepted for source compatibility but has no effect
      and emits a `DeprecationWarning`. The universal driver exposes independent
      toggles: `enable_crl_memory_cache` → `crl_enable_memory_caching` and
      `enable_crl_file_cache` → `crl_enable_disk_caching` (both default `True`).
      Callers who previously disabled caching via `enable_crl_cache=False` must
      set both toggles to `False` explicitly.
  44:
    name: "ReauthenticationRequest is not raised in MasterTokenExpired scenarios"
    status: todo
    type: bug
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      The legacy connector raises `network.ReauthenticationRequest` (carrying the
      original exception as `.cause`) when the master token expires and a refresh
      is required. Snowpark catches this exception to trigger session re-establishment.
    new_driver_behavior: |
      The universal driver does not raise `ReauthenticationRequest` or any equivalent
      signal in these token-refresh scenarios; the UD has no compat class for Snowpark
      to catch or subclass, and no wiring to the internal refresh paths that would need
      to raise it.
    description: |
      TODO: identify the UD token-refresh code paths that correspond to the old
      driver's MasterTokenExpired handling and raise `ReauthenticationRequest`
      (or an equivalent signal Snowpark catches) in those cases.

  45:
    name: "Out-of-band (OOB) telemetry is not implemented"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `TelemetryService` sends out-of-band telemetry events to Snowflake's
      telemetry endpoint from a background thread. Snowpark uses this for usage
      tracking and diagnostics.
    new_driver_behavior: |
      The Universal Driver does not implement OOB telemetry at all -- the
      `telemetry_oob` module and `TelemetryService` class do not exist;
      `import snowflake.connector.telemetry_oob` raises `ModuleNotFoundError`.
    description: |
      Telemetry OOB is disabled on the backend anyway; not planned for UD scope currently.

  46:
    name: "Azure EncryptionAgent.EncryptionAlgorithm stays 256; Python-Azure emits 128"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Azure `encryptiondata` JSON: `EncryptionAgent.EncryptionAlgorithm = "AES_CBC_128"`;
      `WrappedContentKey.Algorithm = "AES_CBC_256"` in the same blob (self-inconsistent).
      Origin: commit 4455b4e1 (2017-10-26) introduced both fields self-consistently at 128-bit
      (`A128KW` + `AES_CBC_128`). Commit 07309aaf (2017-11-03) changed only
      `WrappedContentKey.Algorithm` to `AES_CBC_256`, without updating the sibling field.
      No commit, comment, or test treats this as deliberate; `git log -S "AES_CBC_128" --all`
      shows no revisits since 2017. JDBC had the same class of incomplete edit one week later
      (cf776907, 2017-11-10), but its `EncryptionAgent` was already 256, so no visible split
      resulted there.
    new_driver_behavior: |
      UD emits `256` for both fields on Azure, matching JDBC-Azure, ODBC-Azure, and GCS.
      Source-confirmed (Python/JDBC/ODBC): no decrypt path reads this field's value. Python/JDBC
      deserialize via JSON parsers that never look up `EncryptionAgent`; ODBC's Azure reader
      slices substrings between the literal delimiters `","Algorithm"` and
      `","KeyWrappingMetadata"`, keyed on field names, not values. Cross-driver decryption is
      therefore unaffected either way. Not changed to match Python's `128`: that value is an
      unrevisited 2017 editing miss, not an intentional legacy behavior, and matching it would
      newly diverge UD from JDBC/ODBC/GCS. Both fields are static labels in every driver,
      disconnected from the real per-file cipher (follows QSMK length; recorded separately in
      `matdesc.keySize`).

  47:
    name: "CSE KeyWrappingMetadata.EncryptionLibrary: UD self-identifies as \"Rust(OpenSSL)\""
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Azure/GCS `encryptiondata` JSON: `KeyWrappingMetadata.EncryptionLibrary = "Java 5.3.0"`,
      hardcoded on every cloud, including Python itself.
    new_driver_behavior: |
      UD emits `"Rust(OpenSSL)"` for the same field on both clouds -- an honest
      self-identification, not an oversight. Confirmed no reader anywhere consumes this value:
      not the four legacy drivers' decrypt paths, not UD's own, and not GS's own server-side
      parser, which validates several sibling fields (throws on a bad `EncryptionMode` or
      `EncryptionAlgorithm`) but never reads `EncryptionLibrary`. GS's own internal C++
      encryption library independently emits `"OpenSSL 1.0.1e-fips"` rather than `"Java 5.3.0"`
      on its GCS path -- the same
      self-identify-honestly pattern UD follows, not a UD-only quirk. Kept deliberately: matching
      "Java 5.3.0" would misidentify which implementation produced the blob, which has real
      diagnostic value during the mixed-fleet rollout period when legacy and universal drivers
      both write objects into the same stages.

  48:
    name: "Error exposes structured parameter and validation_code attributes on validation failures"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy connector's `Error` class carries only the message, `errno`, `sqlstate`,
      `sfqid`, and `query`. There is no attribute identifying which connection parameter
      failed validation, and no structured code for the validation rule that fired — callers
      can only substring-match the error message.
    new_driver_behavior: |
      `Error` (and its subclasses) additionally expose `parameter` (the offending config
      parameter name) and `validation_code` (the structured sf_core `ValidationCode` enum
      value) when the error originated from a connection-config validation failure. Both
      default to `None` for errors from any other source, so existing callers are unaffected.

  49:
    name: "file_stream on a non-PUT statement raises ProgrammingError instead of being silently ignored"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `cursor.execute(sql, file_stream=...)` silently ignores the `file_stream` keyword
      argument when `sql` is not a PUT statement; the statement runs normally and the
      stream is never consumed.
    new_driver_behavior: |
      `cursor.execute(sql, file_stream=...)` raises `ProgrammingError` when `sql` is not a
      PUT statement, so a mismatched `file_stream` argument is caught immediately instead
      of being silently discarded.

  50:
    name: "GCS PUT on matching content re-uploads by default (honors skip_upload_on_content_match)"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      On GCS, a `PUT ... OVERWRITE=TRUE` whose local payload matched the remote object's
      stored `x-goog-meta-sfc-digest` was skipped unconditionally. This diverged from legacy
      Python, which re-uploads on a content match unless the caller opts into skipping.
    new_driver_behavior: |
      GCS honors the opt-in `_skip_upload_on_content_match` cursor kwarg like S3 and Azure.
      With the flag off (the default), a content-matching `PUT ... OVERWRITE=TRUE` re-uploads,
      matching legacy Python; the content-match skip fires only when the caller opts in.

  51:
    name: "fetch_pandas_all/fetch_pandas_batches: no pandas.concat kwarg routing"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Legacy's `_fetch_pandas_all` (`result_set.py:268-280` in the legacy connector) fetches
      results in per-batch Arrow chunks and explicitly calls
      `pandas.concat(dataframes, ignore_index=True, **concat_kwargs)`. Any kwarg passed to
      `fetch_pandas_all`/`fetch_pandas_batches` that matches `pandas.concat`'s signature
      (e.g. `sort`, `keys`, `copy`) is specially routed to that concat call rather than to
      `Table.to_pandas`.
    new_driver_behavior: |
      The universal driver obtains the full result as a single, already-consolidated Arrow
      Table directly from the Rust core (`collect_arrow_table`/`collect_arrow_table_async`)
      — there is no per-chunk Python-level `pandas.concat` step, so there is nothing to route
      `pandas.concat`-specific kwargs to. `fetch_pandas_all`/`fetch_pandas_batches` pop only
      `force_microsecond_precision` (the Arrow-conversion parameter) and forward every other
      kwarg straight to `pyarrow.Table.to_pandas`. Kwargs that are genuine `Table.to_pandas`
      options (`split_blocks`, `self_destruct`, `zero_copy_only`, `types_mapper`, etc.) work
      correctly. `pandas.concat`-specific kwargs (`sort`, `keys`, `copy`, ...) that don't
      also happen to be `Table.to_pandas` options now raise `TypeError` from `to_pandas`
      instead of being silently applied to a concat step that no longer exists.
    description: |
      Architectural consequence of fetching the full result set as one already-merged Arrow
      Table from the core rather than legacy's per-chunk-then-concat approach — not a bug to
      fix, since there's no concat step for `pandas.concat` kwargs to attach to. Distinct from
      the `fetch_arrow_all`/`fetch_pandas_all` kwargs-forwarding bugfix (both sync and async
      previously dropped or misrouted kwargs entirely regardless of this architectural
      difference); that bug is now fixed, and genuine `Table.to_pandas` kwargs are forwarded
      correctly. Only kwargs that are exclusively `pandas.concat`-specific remain
      unsupported, and only because the concat step itself doesn't exist in the new
      architecture.
  52:
    name: "login_timeout, network_timeout, and socket_timeout connection getters are now implemented"
    status: unknown
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `login_timeout` defaulted to 120 s but `conn.login_timeout` returned `None`
      when no value was explicitly set (the 120 s budget was applied internally by
      AuthByPlugin, never written back to the connection object).
      `network_timeout` was a single wall-clock budget covering all non-login,
      non-query HTTP operations (retries, metadata calls, etc.); it defaulted to
      `None` (no cap) and `conn.network_timeout` returned `None` when unset.
      `socket_timeout` was a per-attempt read-inactivity timeout passed as the scalar
      `timeout=` to `requests.Session.request`; it resets on every received byte, so
      a slow-but-active response (e.g. a large result download) never trips it.
      All three getters raised `NotImplementedError` in earlier universal-driver
      builds; `network_timeout` and `socket_timeout` as kwargs were silently
      forwarded to Rust as unrecognised parameters with no effect.
    new_driver_behavior: |
      `login_timeout` reads back `config.login_timeout`, which defaults to 120.
      `conn.login_timeout` now returns `120` instead of `None` when no explicit
      value is set. Code guarding on `if conn.login_timeout is None` will evaluate
      differently (lower impact since the effective budget was already 120 s).

      `network_timeout` and `socket_timeout` are accepted as deprecated kwargs and
      emit a `DeprecationWarning` pointing callers at the split params.
      `network_timeout` fans out to both `query_timeout` and `request_timeout`
      (unless the caller sets one of those explicitly, which wins).
      `socket_timeout` fans out to both `connect_timeout` and `retry_timeout`
      (same explicit-wins rule).

      `conn.network_timeout` returns `request_timeout`, which defaults to 120.
      `conn.network_timeout` now returns `120` instead of `None` when unset.
      Code guarding on `if conn.network_timeout is None` will evaluate differently.

      `conn.socket_timeout` returns `retry_timeout`, which defaults to `None`.

      Semantic shift for `socket_timeout`: the legacy value was a per-attempt
      read-inactivity timeout that reset on received bytes; `retry_timeout` becomes
      reqwest's hard wall-clock cap on the entire HTTP attempt including body
      download. A caller who set `socket_timeout=30` to guard against stalled
      sockets will now see active chunk downloads aborted at 30 s. This is the best
      available mapping — the universal driver has no per-inactivity parameter.

      Previously all three getters raised `NotImplementedError`.

  53:
    name: "Connection.telemetry_enabled restored; matches legacy AND semantics"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `Connection.telemetry_enabled` is a cached attribute: an AND of a local client-side
      flag (default `True`, settable via the property, never sent to the server) and a
      server-side flag last updated from the `CLIENT_TELEMETRY_ENABLED` session parameter
      whenever the server sent one (default disabled until confirmed). Both halves gate
      whether the driver flushes its batched telemetry queue.
    new_driver_behavior: |
      `Connection.telemetry_enabled` returns the same AND (client flag default `True`,
      never sent to the server; server half read from `CLIENT_TELEMETRY_ENABLED`, absent
      treated as disabled). Both halves also gate the wrapper's own per-call telemetry RPCs,
      matching legacy's gating exactly. Two residual, non-observable differences: (1) each
      read issues an FFI call to the Rust core to fetch the live session parameter rather
      than returning a cached value — the same tradeoff every other session-parameter-backed
      property in the universal driver already makes (e.g. `autocommit`); (2) legacy's
      batched-queue flush model has no analog, since the universal driver sends each
      telemetry event immediately via RPC.

  54:
    name: "ResultMetadataV2.fields is always None (no nested structured-type metadata)"
    status: todo
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      `cursor._describe_internal()` returns `list[ResultMetadataV2]` where
      `ResultMetadataV2` is a distinct class from `ResultMetadata` and carries two
      additional attributes: `vector_dimension: int | None` (for VECTOR column types)
      and `fields: list[ResultMetadataV2] | None` (for structured/object column types).
      Snowpark and other callers read these attributes to handle VECTOR and structured
      columns correctly.
    new_driver_behavior: |
      `cursor._describe_internal()` returns a real, distinct `ResultMetadataV2` class
      (not an alias for `ResultMetadata`). `vector_dimension` is fully populated from
      the protobuf `dimension` field, so VECTOR column schema inference works correctly.
      `fields` is always `None` -- the UD proto `ColumnMetadata` carries no nested
      column list for structured types (OBJECT/ARRAY/MAP) -- so structured-type
      introspection via `_describe_internal` is unsupported; Snowpark falls back to
      `cursor.description` (V1 path) for those columns.
    description: |
      Tracked as part of SNOW-2912540 Snowpark compatibility work. `vector_dimension`
      is fully implemented. Remaining fix requires the UD proto's `ColumnMetadata` to
      carry a nested field list for structured types, then wiring `fields` to populate
      from it.

  55:
    name: "display_size and internal_size map proto fields differently from legacy (V1 and V2)"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `ResultMetadataV2.from_column` (JSON source) sets `display_size = None` for all
      column types and `internal_size = col["length"]` (the JSON `length` field, which
      carries the maximum character length for VARCHAR/TEXT columns). `ResultMetadata`
      (V1) inherits the same values: legacy builds V1 entries via
      `ResultMetadataV2._to_result_metadata_v1()`, which copies `_display_size` and
      `_internal_size` verbatim. So `cursor.describe()` and `cursor.description` also
      report `display_size=None`.
    new_driver_behavior: |
      `from_column` (proto source) sets `display_size = col.length` for
      TEXT/VARCHAR/CHAR/STRING column types (and `None` otherwise) and
      `internal_size = col.byte_length` (maximum byte length) when the proto field is
      present. This applies to BOTH `ResultMetadata` (V1, read via `cursor.describe()`
      and `cursor.description`) and `ResultMetadataV2` (read via
      `cursor._describe_internal()`) — each has its own `from_column` carrying the same
      mapping. For a `VARCHAR(100)` column: legacy returns `display_size=None,
      internal_size=100` from both views; UD returns `display_size=100,
      internal_size=400` (UTF-8 4 bytes/char) from both. Snowpark reads `name`,
      `type_code`, `is_nullable`, `vector_dimension`, and `fields` from V2 objects — not
      `display_size` or `internal_size` — so this difference has no observed runtime
      impact on Snowpark.
    description: |
      The difference arises from the JSON-to-proto field renaming: JSON `length` is the
      char count and maps to proto `length`; JSON `byteLength` is the byte count and maps
      to proto `byte_length`. The legacy connector used `length` for `internal_size` with
      no proto distinction; the UD splits them across two slots more precisely.
      CONFIRMED from source (both connectors). The V1 half of this entry was previously
      undocumented, which led an integration test to assert that UD's `describe()`
      returns `display_size=None`; it has always returned the char count.

  56:
    name: "cursor._request_id is a str instead of a uuid.UUID object"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      `SnowflakeCursor._request_id` is typed `uuid.UUID | None` (cursor.py:392) and holds
      a `uuid.UUID` instance, assigned either as `uuid.uuid4()` or as
      `uuid.UUID(str(request_id), version=4)`. Callers doing `str(cursor._request_id)`
      get the canonical hyphenated form; callers passing it to `uuid.UUID()` directly
      raise `AttributeError: 'UUID' object has no attribute 'replace'`.
    new_driver_behavior: |
      `Cursor._request_id` returns `str | None`, delegating to the public `request_id`
      property backed by `QueryResult.request_id`. The value originates from the
      protobuf `string request_id` field, so it deserializes as a Python `str` and is
      surfaced unchanged rather than being re-wrapped in `uuid.UUID`. The string content
      is identical to the legacy object's canonical form — only the type differs.
    description: |
      Snowpark is unaffected: `server_connection.py:465` does
      `notify_kwargs["requestId"] = str(results_cursor._request_id)`, which is a no-op
      for a `str` and already the only observed read of the attribute. Re-wrapping into
      `uuid.UUID` at the Python layer was rejected as it would add a parse of a value the
      proto already guarantees well-formed, purely to reproduce a legacy implementation
      detail. Tests that need to compare or UUID-parse the value normalize through
      `str()` so they hold on both drivers. CONFIRMED from source (both connectors).

  57:
    name: "session_parameters values are coerced to str before the protobuf map (legacy allows any JSON-serializable value)"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Legacy `snowflake-connector-python` puts the raw Python dict into
      `body["data"]["SESSION_PARAMETERS"]` untouched (`auth/_auth.py:269`); a
      single `json.dumps(body, cls=SnowflakeRestfulJsonEncoder)` call in
      `network.py` serializes the whole request body in one pass, so native
      Python `bool`/`int` values become native JSON `true`/`5` literals on
      the wire — there is no string-only type contract, and no coercion
      happens on the Python side.
    new_driver_behavior: |
      `ConnectionSetSessionParametersRequest.parameters` is a string-only
      protobuf `map<string, string>`, and `auth_request_data`
      (`sf_core/src/rest/snowflake/mod.rs:603-608`) unconditionally wraps
      every session-parameter value as `serde_json::Value::String` when
      building the login request — this is pre-existing UD behavior, not
      introduced by this fix. This fix's coercion (`bool` → lowercase
      `"true"`/`"false"` via `json.dumps`, everything else via
      `json.dumps(value)`, `str` passthrough) lets non-string values reach
      that point instead of crashing with `TypeError: bad argument type for
      built-in operation` beforehand. The practical effect: every
      non-string session-parameter value's JSON type is flattened to a JSON
      string on the wire (e.g. `true` → `"true"`, `5` → `"5"`) — the
      character content matches legacy, but the JSON type does not. String
      values are unaffected (identical logical content; only a cosmetic
      JSON-escaping style difference between Python's and Rust's default
      encoders, immaterial to any compliant JSON parser).
    description: |
      Found via `Session.builder.configs(...).create()` (Snowpark) passing a
      non-string value (a Python `bool`) in `session_parameters`, which
      previously crashed with `TypeError: bad argument type for built-in
      operation` because `ConnectionSetSessionParametersRequest.parameters`
      is a string-only protobuf map and nothing coerced values before
      assignment. Previously undocumented gap; now closed by coercing
      non-string values to their JSON-scalar string form
      (`_stringify_session_parameters`) before constructing the request. We
      don't have visibility into whether GS's session-parameter parser is
      strict about JSON type, so this stays `impact: low` rather than
      overclaiming.

  58:
    name: "backoff_policy callable parameter removed; retry backoff now configured via typed retry_backoff_* parameters with different defaults"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `backoff_policy` accepts a callable — a generator function such as `exponential_backoff()`
      (the default) or `mixed_backoff()`, or a fully custom one — that computes the delay before
      each retry across every retry loop (login, query, general HTTP, PUT/GET).
    new_driver_behavior: |
      `backoff_policy` no longer exists. The backoff curve is configured instead through four typed
      parameters — `retry_backoff_base_ms`, `retry_backoff_cap_ms`, `retry_backoff_factor`, and
      `retry_backoff_jitter` (one of `"none"`, `"full"`, `"decorrelated"`) — which select among
      built-in strategies but cannot express an arbitrary custom generator. The defaults these
      parameters resolve to also changed: 250ms initial delay (vs. legacy's 1s) and
      `"decorrelated"` jitter (vs. legacy's `"full"`); the 2x growth factor and 16s cap are
      unchanged.

  59:
    name: "Application auto-detection overrides the default connection profile on bare connect()"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      `SnowflakeConnection.__init__` runs `_detect_application()` before merging the default
      connection profile. For a truly bare `connect()` (no kwargs, no `connection_name`),
      `_get_default_connection_params()` wholesale-replaces `kwargs`, discarding whatever
      `SF_PARTNER` / imported-module detection wrote. Detection is therefore ignored whenever
      the caller relies on the default TOML profile with zero args — including Streamlit and
      Jupyter sessions that only have a saved profile.
    new_driver_behavior: |
      Detection still runs when `application=` is omitted and writes `config.application`
      before the Rust resolver merges the default profile. Explicit params (including
      `application`) outrank the TOML default, so a bare `connect()` with `SF_PARTNER` set
      or `streamlit` / Jupyter / `snowbooks` imported uses the detected name instead of a
      saved profile's `application`. An explicit `application=` still wins over detection.
    description: |
      Deliberate fix for the Streamlit/Jupyter-with-saved-profile scenario this detection
      targets. Legacy dropped the detected value when loading the default profile; UD keeps
      it so `CLIENT_ENVIRONMENT.APPLICATION` reflects the partner environment.

  80:
    name: "Easy-logging YAML config-file feature removed; replaced by SNOWFLAKE_TROUBLESHOOTING_ENABLED env var"
    status: allowed
    type: api_incompatibility
    reviewed: true
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `EasyLoggingConfigPython` reads a YAML config file (`log.save_logs`, `log.path`, etc.) to
      configure a `RotatingFileHandler` for driver logging.
    new_driver_behavior: |
      No YAML-config-driven logging exists in UD. Logging is controlled instead by the Rust
      `SNOWFLAKE_TROUBLESHOOTING_ENABLED` env var (confirmed in `sf_core/src/env_vars.rs` and
      `sf_core/src/logging/log_manager.rs`). There is no user-configurable log file path or YAML
      schema; confirmed no `easy_logging`/`EasyLogging` references remain anywhere under `python/`.
    description: |
      Decided acceptable for GA as-is: UD intentionally trades the YAML config surface (arbitrary
      log path, rotation size, per-module levels) for a single boolean env var covering the
      primary use case (turning on driver-internal troubleshooting logs). No code fix planned.
      Worth a migration-guide callout for users who relied on custom `log.path`/rotation settings,
      but that's a docs follow-up, not a driver change.

  81:
    name: "PUT resolves relative source paths to absolute canonical form before upload"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: medium
    status_rationale: |
      Aligns the universal driver with legacy JDBC's `file.getCanonicalPath()`. The legacy Python
      connector calls `os.path.expanduser` on every source path, then `os.path.abspath` only
      `if not os.path.isabs(file_name)` — so a path that was already absolute skips lexical
      normalization entirely and any `..` in it is left for the OS to resolve at file-access
      time, while a relative path is lexically normalized (CWD-prefixed, `..` collapsed by
      string manipulation, symlinks not followed). The universal driver's `dunce::canonicalize`
      always performs full filesystem-aware resolution — CWD, `..`, and symlinks — regardless of
      whether the input was already absolute. For the common case (no symlinked directory
      component) the two agree. Impact is raised to medium (from an earlier `low`) because for a
      *relative* source path with a symlinked directory component followed by `..`, legacy
      Python's lexical `normpath` collapse can select a different file than the universal
      driver's filesystem-aware resolution — not just a differently-named stage object.
    old_driver_behavior: |
      The legacy Python connector (`file_transfer_agent.py`, `_expand_filenames`) calls
      `os.path.expanduser` on every source path first. It then calls `os.path.abspath` only when
      `not os.path.isabs(file_name)`:
      - Relative input: `abspath` prepends the process CWD and collapses `..` segments purely
        lexically (`os.path.normpath`) — it does not consult the filesystem, so a symlinked
        directory component is not resolved before the `..` is applied. `/tmp/symlinkdir/../b`
        (relative to CWD) can lexically collapse to a path outside `symlinkdir`'s real target,
        selecting a different file than filesystem-aware resolution would (or none at all).
      - Already-absolute input: no lexical normalization is applied at all; the raw string
        (including any `..`) is handed to `glob.glob`/the OS as-is, which resolves it using
        normal filesystem semantics at access time — so for already-absolute paths, legacy
        Python's *effective* file selection already matches filesystem-aware resolution.
      - Symlinks are never followed by `abspath` itself; a symlinked source file
        `link.csv -> real.csv` was therefore uploaded to the stage as `link.csv` (the symlink's
        own name), since `os.path.basename` only looks at the final path segment.
    new_driver_behavior: |
      Each matched local source path is resolved via `dunce::canonicalize` (equivalent to
      `std::fs::canonicalize` on Unix): CWD-relative made absolute, `..` collapsed, symlinks
      followed at every path component — filesystem-aware, not lexical. For non-symlink inputs
      (and for already-absolute symlink-free inputs) this matches legacy Python's effective
      behavior. For a symlinked source `link.csv -> real.csv` the stage object name becomes
      `real.csv` (the target's basename), matching legacy JDBC's `getCanonicalPath` behaviour.
      For a *relative* path with a symlinked directory component followed by `..`, this can
      resolve to a different real file than legacy Python's lexical collapse would have selected.
    description: |
      Reference: legacy Python `file_transfer_agent.py` `_expand_filenames` (`os.path.expanduser`
      then conditionally `os.path.abspath`);
      legacy JDBC `SnowflakeFileTransferAgent.expandFileNames` (`file.getCanonicalPath()`).
      Applications that PUT symlinked source files and rely on the stage object name matching
      the symlink's own basename will observe the name change to the target's basename.
      Non-symlink workflows are unaffected.

  88:
    name: "disable_request_pooling property removed; connect() kwarg is a no-op"
    status: allowed
    type: api_incompatibility
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      `connect(disable_request_pooling=True)` is accepted (default `False`).
      `Connection.disable_request_pooling` is a get/set property that toggles
      whether HTTP sessions are reused across REST calls.
    new_driver_behavior: |
      `Connection.disable_request_pooling` does not exist; reading it raises
      `AttributeError`. Passing `disable_request_pooling` to `connect()` is
      accepted for source compatibility but has no effect and emits a
      `DeprecationWarning`.
    description: |
      The old flag controlled reuse of Python `requests.Session` objects. The
      new driver has no equivalent request-session pool; HTTP keep-alive on the
      core HTTP client is internal and not user-configurable. Mapping the flag
      onto keep-alive would invent a different feature under a legacy name.
