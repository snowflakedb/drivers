# Standalone workspace for the FIPS-TLS candidate source distribution.
[workspace]
members = [
    "sf_core",
    "python_bridge",
    "python_bridge/stub_gen",
    "sf_params_spec",
    "sf_types",
    "proto_utils",
    "error_trace",
    "error_trace_derive",
    "proto_generator",
    # sf_core has a path-based dev-dependency that Cargo validates for release builds.
    "sf_core/tests/common/arrow_deserialize_macro",
]
resolver = "2"

[profile.release]
strip = true
opt-level = "z"
lto = false
