behavior_differences:
  1:
    name: "Native error code should be 0 when error originates from client side"
  
  2:
    name: "Compression type is now returned in uppercase"
  
  3:
    name: "Encryption field is no longer included in the result"
  
  4:
    name: "GET rowset metadata contains file size after decryption instead of file size before decryption"
  
  5:
    name: "Header of a gzip-compressed file does not contain filename"
  
  6:
    name: "Unsupported compression type returns error instead of being silently ignored"

  7:
    name: "ALTER USER ADD PROGRAMMATIC ACCESS TOKEN returns result set with token in new driver, old driver returns invalid cursor state (10510)"

  8:

    name: "Float max/min boundary values are returned successfully instead of numeric out of range error"
  9:

    name: "SQLBindCol doesn't set indicator when TargetValuePtr is null."

  10:
    name: "SQL_SF_CONN_ATTR_PRIV_KEY (EVP_PKEY pointer) is not supported"
    description: |
      The old driver accepted raw EVP_PKEY* pointers via SQLSetConnectAttr.
      Not supported across the Rust FFI boundary — use PRIV_KEY_CONTENT or PRIV_KEY_BASE64 instead.

  11:
    name: "FIXED type with scale=0 is always reported as SQL_DECIMAL"
    description: |
      OLD driver: When treatDecimalWithZeroScaleAsInt is enabled (connection parameter),
      FIXED columns with scale=0 are reported as SQL_BIGINT. The default C type for
      SQL_BIGINT is SQL_C_SBIGINT.
      NEW driver: FIXED columns are always reported as SQL_DECIMAL regardless of scale.
      The default C type for SQL_DECIMAL is SQL_C_CHAR.
      Impact: Applications using SQL_C_DEFAULT with zero-scale numeric columns may receive
      data in a different C type (SQL_C_CHAR instead of SQL_C_SBIGINT).

  12:
    name: "Large precision FIXED numbers are not remapped to SQL_VARCHAR"
    description: |
      OLD driver: When treatBigNumberAsString is enabled (connection parameter) and
      precision > 18, FIXED columns are reported as SQL_VARCHAR instead of SQL_DECIMAL.
      NEW driver: FIXED columns are always reported as SQL_DECIMAL regardless of precision.
      Impact: Column metadata (SQL type, column size, byte length) may differ for
      high-precision numeric columns. Data retrieval is unaffected when using SQL_C_CHAR
      since both SQL_DECIMAL and SQL_VARCHAR default to SQL_C_CHAR.

  13:
    name: "SQL_C_CHAR with small buffer returns SQL_SUCCESS_WITH_INFO instead of SQL_SUCCESS"
    description: |
      OLD driver: When SQLGetData is called with a buffer too small to hold the full
      character representation of a DECIMAL value, the old driver returns SQL_SUCCESS (0)
      and silently truncates the data without setting a warning.
      NEW driver: Returns SQL_SUCCESS_WITH_INFO (1) with truncated data in the buffer,
      a null terminator, and SQL_NO_TOTAL in the indicator, per the ODBC spec
      for string data right truncation (SQLSTATE 01004).
      Impact: Applications that check only for SQL_SUCCESS will now also see
      SQL_SUCCESS_WITH_INFO. The ODBC specification mandates SQL_SUCCESS_WITH_INFO
      for string truncation, so this is a spec-compliance improvement.