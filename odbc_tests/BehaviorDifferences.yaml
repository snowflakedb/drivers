    new_driver_behavior: |
      Synthesizes and persists cursor names on both DMs.
    description: |
      Applications that call SQLGetCursorName on a fresh statement, or after SQLCloseCursor on a previously-named cursor, receive SQL_ERROR from the old driver under iODBC. The new driver synthesizes the SQL_CUR-prefixed auto name and preserves user-supplied names across SQLCloseCursor.
  67:
    #TODO: Add a test for the old driver vs new driver behavior
    name: "SQLGetData converts DECFLOAT to SQL_C_WCHAR under iODBC instead of returning SQL_SUCCESS with SQL_NULL_DATA indicator and an untouched buffer"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The DECFLOAT -> SQL_C_WCHAR conversion path is not wired up in the old driver's iODBC build. The driver returns SQL_SUCCESS but writes SQL_NULL_DATA (-1) into the length indicator and leaves the output buffer untouched, so no scalar value can be observed by the application. The new driver implements the conversion on both DMs.
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      Under iODBC, SQLGetData on a DECFLOAT column with TargetType=SQL_C_WCHAR returns SQL_SUCCESS but the indicator buffer is set to SQL_NULL_DATA and the value buffer is unmodified. Buffer-truncation paths (SQL_SUCCESS_WITH_INFO + 01004) cannot fire either.
    new_driver_behavior: |
      Converts DECFLOAT to SQL_C_WCHAR correctly.
    description: |
      Applications that call SQLGetData on a DECFLOAT column with TargetType=SQL_C_WCHAR against the old driver under iODBC receive SQL_SUCCESS with the indicator set to SQL_NULL_DATA and the output buffer untouched, so no value is observable. The new driver produces the spec-correct wide-string conversion.
  68:
    name: "Child statement handles are invalidated through iODBC's alloc table on SQLDisconnect / SQLFreeStmt(SQL_DROP), so a subsequent SQLFreeHandle on the orphaned handle returns the spec SQL_INVALID_HANDLE instead of leaking as SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under iODBC the old driver does not coordinate with the DM's per-handle alloc table when it releases child statements: SQLDisconnect (with or without active statements) and SQLFreeStmt(SQL_DROP) report SQL_SUCCESS to the caller but leave the statement entry in iODBC's alloc table, so a subsequent SQLFreeHandle(SQL_HANDLE_STMT) still returns SQL_SUCCESS instead of the spec-mandated SQL_INVALID_HANDLE. The handle remains addressable for the rest of the process. The new driver participates correctly in iODBC's alloc table; the same calls invalidate the child statement entries and the follow-up SQLFreeHandle surfaces SQL_INVALID_HANDLE on both DMs.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the old driver leaves statement handles in iODBC's alloc table after release in three scenarios:
        - SQLDisconnect with a child statement still attached -> SQLFreeHandle(SQL_HANDLE_STMT) on the child after disconnect returns SQL_SUCCESS instead of SQL_INVALID_HANDLE.
        - SQLDisconnect while an active result set is still open on a child statement -> same outcome: SQLFreeHandle on the child returns SQL_SUCCESS.
        - SQLFreeStmt(SQL_DROP) on a statement handle -> SQLFreeHandle(SQL_HANDLE_STMT) afterwards returns SQL_SUCCESS instead of SQL_INVALID_HANDLE; the handle leaks for the rest of the test/session.
      Under unixODBC the old driver returns SQL_INVALID_HANDLE on the follow-up SQLFreeHandle in each of the three scenarios.
    new_driver_behavior: |
      The new driver invalidates child statement entries in iODBC's alloc table when SQLDisconnect or SQLFreeStmt(SQL_DROP) releases them, so the follow-up SQLFreeHandle on the orphaned handle returns SQL_INVALID_HANDLE on both DMs.
    description: |
      Applications that release child statements via SQLDisconnect or SQLFreeStmt(SQL_DROP) on the old driver under iODBC cannot detect the release through SQLFreeHandle's return code; the handle keeps reporting as valid and leaks until process exit. The new driver returns the spec-mandated SQL_INVALID_HANDLE so callers can detect the release and reuse / abandon the handle correctly.
  69:
    name: "SQLGetDescField / SQLSetDescField return SQL_ERROR + HY010 during SQL_NEED_DATA under iODBC instead of silently succeeding"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The ODBC spec requires SQL_ERROR + HY010 when SQLGetDescField / SQLSetDescField is called on an ARD/IRD whose parent statement is in SQL_NEED_DATA. The new driver enforces the state check on every DM and posts the HY010 diagnostic record on the descriptor handle, so SQLGetDiagRec(SQL_HANDLE_DESC, ...) returns the spec-mandated record. The old driver bypasses this state check under iODBC and silently returns SQL_SUCCESS (under unixODBC and Windows DM the old driver enforces it correctly). The spec-compliant new behavior is accepted.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the SQL_NEED_DATA state check is not applied to descriptor entry points reached through the implicit ARD/IRD of the statement: SQLGetDescField and SQLSetDescField return SQL_SUCCESS while the statement is in SQL_NEED_DATA. Under unixODBC and Windows DM the old driver enforces the check and returns SQL_ERROR + HY010.
    new_driver_behavior: |
      Enforces the SQL_NEED_DATA state check for descriptor entry points and posts the HY010 diagnostic record on the descriptor handle on every DM (unixODBC, iODBC, Windows). SQLGetDescField / SQLSetDescField return SQL_ERROR and SQLGetDiagRec(SQL_HANDLE_DESC, ...) returns the spec-mandated record.
    description: |
      Applications that issue descriptor calls while a statement is in SQL_NEED_DATA now receive the spec-mandated SQL_ERROR + HY010 from the new driver under iODBC instead of an apparent SQL_SUCCESS. Callers can detect the invalid state and recover (e.g. by cancelling and re-driving the DAE sequence). SQLCopyDesc is not implemented by the new driver (the affected test skips via SKIP_NEW_DRIVER_NOT_IMPLEMENTED) and is not in scope for this BD.
  70:
    name: "Returns spec-correct ODBC 3.x SQLSTATEs (HY090 / HY010 / HY017 / HY092 / 07009 / HY008) under iODBC via driver-side pre-validation, instead of vendor HY000 / ODBC 2.x aliases / bare SQL_INVALID_HANDLE / extra diagnostic record"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      iODBC's DM pre-processes string-length parameters, tracks per-statement state (prepared / executed / NEED_DATA / async-busy), and validates handle types at the dispatch layer. For the old driver, that pre-processing either reshapes args into a form the driver's spec-SQLSTATE validator no longer recognises (so the driver falls through to vendor HY000), or rejects the call with an ODBC 2.x SQLSTATE alias (S1010 / S1090 / S1093) / a bare SQL_INVALID_HANDLE / SQL_ERROR (no diagnostic record posted) before forwarding, or appends an extra S1010 record alongside the driver's spec record. The new driver validates the same conditions inside the driver before any iODBC re-shaping or dispatch-time check can fire, so the spec-mandated ODBC 3.x SQLSTATE surfaces as the sole diagnostic record on both DMs.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the old driver surfaces non-spec SQLSTATEs in the following buckets:
        - Negative-length / empty-string arguments -> vendor HY000 ("Snowflake][Support] (30020) Invalid argument") instead of HY090. Affected calls: SQLPrepare (zero / negative TextLength, empty SQL string), SQLExecDirect (zero / negative TextLength), SQLBindParameter (negative BufferLength), SQLNativeSql (negative BufferLength), SQLGetDescField / SQLSetDescField (negative BufferLength), and the SQLColumns / SQLPrimaryKeys / SQLForeignKeys / SQLProcedureColumns / SQLProcedures family (negative name-length args).
        - Function-sequence / parameter-number errors -> ODBC 2.x aliases instead of HY010 / HY090 / 07009 / HY008. Affected calls: SQLFetch / SQLEndTran after commit/rollback closes cursor (S1010), SQLEndTran during SQL_NEED_DATA (S1010), SQLGetCursorName / SQLSetCursorName during SQL_NEED_DATA (S1010), SQLDescribeParam on unprepared statement and ParameterNumber=0 (S1010 / S1093), SQLNumParams on unprepared statement (S1010), SQLExecute on unprepared statement (S1010), cross-thread SQLCancel on async-busy statement (S1010), SQLGetCursorName / SQLSetCursorName / SQLNativeSql with negative length (S1090), SQLBrowseConnect with negative length (S1090).
        - Handle-validation errors -> bare SQL_INVALID_HANDLE / SQL_ERROR with no diagnostic record. Affected calls: SQLEndTran called with SQL_HANDLE_STMT (spec: HY092), SQLFreeHandle on an implicit auto-allocated descriptor (spec: HY017), SQLFreeHandle called with a completely bogus HandleType (e.g. 999) (spec: SQL_INVALID_HANDLE).
        - Descriptor reads / mutations during SQL_NEED_DATA -> SQL_SUCCESS / SQL_NO_DATA instead of HY010. SQLGetDescRec on the ARD during SQL_NEED_DATA returns SQL_NO_DATA (it walks the ARD past the bound parameter, which actually lives on the IPD); SQLGetDescRec on the IRD returns the pre-execution IRD shape as SQL_SUCCESS; SQLSetDescRec on either descriptor returns SQL_SUCCESS silently; SQLCopyDesc into / out of either descriptor returns SQL_SUCCESS silently.
        - Diagnostic record stacking -> extra ODBC 2.x record appended alongside the driver's spec record. Cross-thread SQLCancel that collides with an in-flight SQLExecDirect leaves two diagnostic records on the statement handle ([0] iODBC's own S1010 from the function-sequence collision, [1] the driver's HY008 for the canceled exec) instead of the spec-mandated single HY008 record.
      Under unixODBC the same calls already surface the spec ODBC 3.x SQLSTATE as the sole record.
    new_driver_behavior: |
      Returns the spec ODBC 3.x SQLSTATE / return code as the sole diagnostic record on both DMs by validating the condition inside the driver before any iODBC re-shaping or dispatch-time check can fire.
    description: |
      Applications receive a proper state from the driver and a single spec-correct diagnostic record they can inspect for SQLSTATE / native code / message without having to scan past iODBC-side function-sequence artefacts.
  71:
    name: "SQLBindParameter SQL_C_INTERVAL_* bound to a SQL_INTERVAL_* parameter forwards the leading-field literal instead of being rejected"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      This is a fix that extends the conversions.
    old_driver_behavior: |
      Binding any interval C source (SQL_C_INTERVAL_YEAR / _MONTH / _DAY / _HOUR / _MINUTE / _SECOND) with ParameterType set to a SQL_INTERVAL_* type fails: the reference driver does not implement binding the SQL_INTERVAL_* parameter types, so there is no path to bind a SQL_C_INTERVAL_* value to a SQL_INTERVAL_* parameter.
    new_driver_behavior: |
      Per ODBC Appendix D ("Converting Data from C to SQL Data Types", "Converting Interval C Data"), an interval C source is legal for an interval SQL target of the same family — a year-month source (SQL_C_INTERVAL_YEAR / _MONTH) to a year-month target (SQL_INTERVAL_YEAR / _MONTH), and a day-time source (SQL_C_INTERVAL_DAY / _HOUR / _MINUTE / _SECOND) to a day-time target (SQL_INTERVAL_DAY / _HOUR / _MINUTE / _SECOND). The driver forwards the source interval's leading datetime field as the rendered literal (e.g. SQL_C_INTERVAL_YEAR carrying 5 renders "5", SQL_C_INTERVAL_SECOND carrying 45s renders "45.000000"), with the leading sign applied, so the bind succeeds (SQL_SUCCESS) and the literal round-trips through a VARCHAR column verbatim. Cross-family binds (year-month source to day-time target or vice versa) are rejected with SQLSTATE 07006.
    description: |
      Spec reference: ODBC Appendix D, "Converting Data from C to SQL Data Types" (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types). The interval C to interval SQL conversion is keyed by the bound SQL_INTERVAL_* parameter type; the rendered literal carries the source interval's leading field and is stored verbatim in a VARCHAR column.
      Applications binding SQL_C_INTERVAL_* values to same-family SQL_INTERVAL_* parameters now succeed on the new driver instead of failing. Cross-family interval binds receive a spec-compliant 07006 rejection.

  72:
    name: "SQLBindParameter numeric C types to SQL_INTERVAL_* follow ODBC Appendix D 'C to SQL: Numeric' semantics"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      Aligns the API to ODBC spec.
    old_driver_behavior: |
      The reference driver does not implement the ODBC Appendix D "C to SQL: Numeric" rules for binding numeric C types to SQL_INTERVAL_* parameters via SQLBindParameter. It rejects exact-numeric C types (SQL_C_STINYINT .. SQL_C_UBIGINT, SQL_C_NUMERIC) bound to single-field interval targets (SQL_INTERVAL_YEAR/MONTH/DAY/HOUR/MINUTE/SECOND), and it accepts approximate-numeric C types (SQL_C_FLOAT / SQL_C_DOUBLE) bound to single-field interval targets.
    new_driver_behavior: |
      Per ODBC Appendix D ("C to SQL: Numeric"), the new driver accepts exact-numeric C types bound to single-field interval targets (the numeric value is the count of the single leading field), and rejects approximate-numeric C types (SQL_C_FLOAT / SQL_C_DOUBLE) bound to any interval target with SQLSTATE 07006. Multi-field/compound interval targets (e.g. SQL_INTERVAL_YEAR_TO_MONTH) reject every numeric source with 07006 on both drivers. SQL_C_BIT is rejected for all interval targets (07006).
    description: |
      Spec reference: ODBC "C to SQL: Numeric" conversion table. https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/c-to-sql-numeric
      Applications binding exact-numeric C values to single-field SQL_INTERVAL_* parameters will succeed on the new driver where the reference driver failed. Applications binding SQL_C_FLOAT / SQL_C_DOUBLE to single-field interval parameters will now receive 07006 instead of silent acceptance.

  73:
    name: "SQL_C_CHAR/WCHAR bound as a SQL_INTERVAL_* parameter is forwarded to the server instead of being rejected"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      The old driver rejecting a spec-legal conversion is the bug: ODBC Appendix D lists SQL_C_CHAR / SQL_C_WCHAR as legal source types for every SQL_INTERVAL_* target, so the bind should succeed. The new driver forwards the literal verbatim per the spec.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Binding a character C source (SQL_C_CHAR / SQL_C_WCHAR) with ParameterType set to any SQL_INTERVAL_* type fails at SQLExecute with SQL_ERROR and SQLSTATE HY000 ("Unsupported data type for bind variable", NativeError 18). The legacy driver forwards the ODBC interval type code (101-113) as the Snowflake bind-variable type, which the server does not accept, so there is no path to bind an interval literal through a character C source.
    new_driver_behavior: |
      Per ODBC Appendix D ("Converting Data from C to SQL Data Types"), SQL_C_CHAR and SQL_C_WCHAR are legal source types for every SQL_INTERVAL_* target (single-field and compound). The driver treats a character source as always legal and forwards the literal verbatim as the parameter value, so the bind succeeds (SQL_SUCCESS) and the literal round-trips through a VARCHAR column unchanged.
    description: |
      Spec reference: ODBC Appendix D conversion table lists SQL_C_CHAR / SQL_C_WCHAR as legal source types for all SQL_INTERVAL_* targets. https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types
      Applications binding interval literals as SQL_C_CHAR/SQL_C_WCHAR to SQL_INTERVAL_* parameters now succeed on the new driver instead of receiving an HY000 bind-variable error.

  74:
    name: "Binding a SQL_C_CHAR/WCHAR character literal as SQL_TYPE_TIMESTAMP shifts the stored wall-clock value by a timezone offset on the old driver"
    status: fixed
    type: bug
    reviewed: false
    status_rationale: |
      Realigned to the legacy driver. The new driver originally stored the wall-clock verbatim (treating TIMESTAMP_NTZ as strictly timezone-naive on the bind side), which diverged from the legacy driver's host-/session-timezone-dependent offset. Routing every SQL_TYPE_TIMESTAMP -> TIMESTAMP_NTZ bind through the wall-clock/TEXT path (exactly as TIMESTAMP_LTZ already did) restores the legacy semantics and eliminates the old-vs-new delta.
    is_breaking_change: false
    impact: high
    old_driver_behavior: |
      Binding a timestamp value as SQL_TYPE_TIMESTAMP (any C source: SQL_C_CHAR / SQL_C_WCHAR character literal, SQL_C_TYPE_TIMESTAMP struct, or SQL_C_BINARY) into a TIMESTAMP_NTZ column sends the bare wall-clock as a TEXT bind and lets the server attach the session TIMEZONE offset. Under a non-UTC session the stored value is shifted: e.g. "2024-01-15 14:30:45" bound under a session whose TIMEZONE resolves to -8h is stored/read back as "2024-01-15 06:30:45". The shift is session-/host-dependent.
    new_driver_behavior: |
      Realigned to the legacy driver: the new driver again binds SQL_TYPE_TIMESTAMP as a wall-clock TEXT value and lets the server apply the session TIMEZONE offset for the TIMESTAMP_NTZ target, so the stored value matches the legacy driver on every host. (The earlier behavior that bound NTZ as epoch-nanoseconds tagged type=TIMESTAMP_NTZ and stored the wall-clock verbatim regardless of session timezone has been reverted; this entry is now status: fixed.)
    description: |
      Regression realigned to legacy. Binding any timestamp as SQL_TYPE_TIMESTAMP into TIMESTAMP_NTZ again applies the session TIMEZONE offset on both drivers, matching the legacy 3.16.0 behavior. Tests that assert a verbatim round-trip pin TIMEZONE='UTC' so the offset is zero. https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types

  75:
    name: "SQLGetInfo(SQL_DRIVER_NAME) returns the driver's installed file path instead of a fixed identifier"
    status: fixed
    type: bug
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      ODBC spec states that the filename should be returned.
    old_driver_behavior: |
      SQLGetInfo(SQL_DRIVER_NAME) returns the fixed string "Snowflake" regardless of where the driver is installed. This is non-spec — the ODBC specification defines SQL_DRIVER_NAME as "a character string with the file name of the driver used to access the data source".
    new_driver_behavior: |
      SQLGetInfo(SQL_DRIVER_NAME) returns the file name of the loaded driver shared library (e.g. `libsfodbc.so`, `libsfodbc.dylib`, or `sfodbc.dll`), exactly as the ODBC spec prescribes. The driver resolves the library's on-disk path via the ODBC installer API (`SQLGetPrivateProfileString` against odbc.ini / odbcinst.ini) using whichever lookup hints (`DRIVER={...}` keyword or `DSN=`) were supplied at connect time, with a `dladdr` self-path fallback for DM-less contexts, and then returns only the path's file-name component. Returns an empty string only when every layer fails (e.g. a missing installer library on a sandboxed unit-test box).
    description: |
      Applications that compared SQL_DRIVER_NAME against the literal string "Snowflake" (for driver detection or telemetry tagging) need to switch to a file-name check or to SQL_DBMS_NAME. Applications that already expected a driver file name — including Excel/Power Query, which uses SQL_DRIVER_NAME to populate the connection-properties dialog — now receive the spec-compliant value.
  76:
    name: "SQLGetInfo(SQL_DRIVER_VER) reports the Cargo package version verbatim instead of a zero-padded `MM.mm.bbbb` string"
    status: fixed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      The ODBC spec defines SQL_DRIVER_VER as `##.##.####`. The universal driver emits that spec-compliant fixed-width string; the reference driver does not. The remaining delta (padded vs. unpadded) is a deliberate, accepted spec-compliance improvement, so the value is asserted per-driver rather than realigned.
    old_driver_behavior: |
      SQLGetInfo(SQL_DRIVER_VER) returns an unpadded, three-component semver (e.g. `3.16.0`), not the fixed-width `##.##.####` the ODBC spec prescribes.
    new_driver_behavior: |
      SQLGetInfo(SQL_DRIVER_VER) zero-pads the Cargo package version to the fixed-width `MM.mm.bbbb` format (major/minor to two digits, build to four), so `4.0.0` is returned as `04.00.0000`, matching the ODBC spec's `##.##.####`.
    description: |
      Applications that parse SQL_DRIVER_VER get a spec-compliant fixed-width `MM.mm.bbbb` string from the universal driver, versus the reference driver's unpadded semver. Consumers that treat the string as opaque or only use the dot count are unaffected.

  77:
    name: "SQLGetDiagRec/SQLGetDiagField MessageText appends an internal error trace by default"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Provides better visibility of errors. Can be disabled.
    old_driver_behavior: |
      `SQLGetDiagRec` / `SQLGetDiagField(SQL_DIAG_MESSAGE_TEXT)` return only the human-readable diagnostic message produced by the driver/server. No internal call-site trace is appended.
    new_driver_behavior: |
      `OdbcError::message_text()` appends the driver's internal `ErrorTrace` (file/line entries collected via the `error_trace` derive) to the user-facing diagnostic string by default. The behavior is gated by `error_trace_enabled` in `LoggingConfig`, which defaults to `true` (sf_core/src/logging/mod.rs:87). Setting `ErrorTraceEnabled=false` in `sf.odbc.ini` (parsed by `sf_core::config::logging_config_loader`) suppresses the appended trace and restores legacy-shaped messages.
    impact: medium
    is_breaking_change: true
    description: |
      Applications that match diagnostic message text against fixed substrings, or that surface `SQLGetDiagRec` output verbatim to end users / test oracles, will see additional trace content appended. Consumers that need the legacy shape must write `ErrorTraceEnabled=false` to `sf.odbc.ini` and point `SF_ODBC_INI` at it.

  78:
    name: "Stage-binding threshold comparison uses >= instead of >; arrayBindSupported and CLIENT_STAGE_ARRAY_BINDING_THRESHOLD session params are respected"
    status: allowed
    type: enhancement
    reviewed: true
    impact: medium
    is_breaking_change: true
    status_rationale: |
      Fixes a bug.
    old_driver_behavior: |
      The old driver reads the stage-bind threshold from the connection-string parameter
      `StageBindThreshold` (not from the SESSION parameter `CLIENT_STAGE_ARRAY_BINDING_THRESHOLD`).
      ALTER SESSION SET CLIENT_STAGE_ARRAY_BINDING_THRESHOLD has no effect on the old driver.
      The old driver does not implement the `arrayBindSupported` server hint: it always attempts
      stage binding for INSERT when cell count > threshold, regardless of the query shape.
    new_driver_behavior: |
      The new driver reads `CLIENT_STAGE_ARRAY_BINDING_THRESHOLD` from the session parameters
      returned by the server and applies a >= comparison (cells >= threshold). It also gates
      stage binding on the server-provided `arrayBindSupported` hint from the prepare response;
      when the server returns false (e.g. for bare SELECT, EXECUTE IMMEDIATE, multi-statement
      queries) the driver falls back to inline JSON even if the cell count crosses the threshold.
    description: |
      1. Applications relying on `StageBindThreshold` in the connection string must migrate to
         setting CLIENT_STAGE_ARRAY_BINDING_THRESHOLD via ALTER SESSION or account/role defaults.
      2. Query shapes where the server returns arrayBindSupported=false (SELECT, EXECUTE IMMEDIATE,
         multi-statement) that previously failed with "Bind variable ? not set." when stage binding
         was forced will now transparently fall back to inline JSON in the new driver.
      3. At the exact boundary (cells == threshold), the old driver used > and would take the JSON
         path; the new driver uses >= and takes the stage path. Applications sensitive to the
         boundary row count should be aware of this one-row difference in dispatch behavior.

  79:
    name: "SQL_C_WCHAR fetch encoding under iODBC depends on the source column type in the old driver"
    status: allowed
    type: bugfix
    reviewed: true
    impact: low
    is_breaking_change: true
    status_rationale: |
      This was a bug in the old driver.
    old_driver_behavior: |
      Under iODBC (where the DM uses a 4-byte SQLWCHAR), the old driver's SQLGetData
      with TargetType=SQL_C_WCHAR does NOT use a uniform code-unit width. The buffer
      encoding depends on the Snowflake source column type:
        - String-family columns (VARCHAR / TEXT / CHAR / VARIANT / OBJECT / ARRAY, and
          DATE / TIME / TIMESTAMP rendered to text) are written as UTF-32 (4 bytes per
          code unit); the indicator reports byte_count = char_count * 4.
        - Numeric columns (INTEGER / NUMBER / FIXED / FLOAT / REAL) rendered to text are
          written as UTF-16 (2 bytes per code unit); the indicator reports
          byte_count = char_count * 2 — the same shape the DM would expect under
          unixODBC, not the 4-byte iODBC width.
      This mirrors the source-type-dependent inconsistency already documented for the
      truncation indicator in BD#23 (string source vs binary source), but here it is the
      result-buffer encoding width itself that varies.
    new_driver_behavior: |
      The new driver honours DriverManagerEncoding (read once from sf.odbc.ini via
      SF_ODBC_INI) uniformly: under iODBC every SQL_C_WCHAR fetch is UTF-32 regardless of
      the source column type, so the indicator is always char_count * 4.

  80:
    name: "SQLColAttribute properly supports ODBC 2.x field aliases through the 3.x function"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The old driver's inconsistent handling of 2.x identifiers is a bug; the new driver follows the spec's backward compatibility rules.
    old_driver_behavior: |
      When SQLColAttribute (ODBC 3.x) is called with ODBC 2.x field identifiers
      (SQL_COLUMN_NAME, SQL_COLUMN_TYPE, etc.), the old driver exhibits inconsistent
      behavior — returning empty strings, incorrect values, or HY091 errors
      depending on the identifier.
    new_driver_behavior: |
      Properly maps ODBC 2.x field identifiers to their SQL_DESC_* equivalents per
      the ODBC specification backward compatibility rules.
    is_breaking_change: false
    impact: low
    description: |
      Applications using ODBC 2.x field identifiers with the 3.x function will now
      receive correct values.

  81:
    name: "OAuth token/authorization endpoint URLs must use HTTPS (non-loopback http rejected)"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Deliberate security hardening (SNOW-3663588). Accepted as a divergence from the old driver
      because HTTPS on the OAuth authorization/token endpoints is already required by RFC 6749
      §3.1.2.1 and the OAuth 2.0 Security BCP; the old driver only warns on an insecure scheme.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      The shared C/C++ core parses OAUTH_TOKEN_REQUEST_URL / OAUTH_AUTHORIZATION_URL with no
      scheme validation. An `http://` value logs a warning ("OAuth token endpoint uses insecure
      HTTP protocol") and the request proceeds. There is no loopback carve-out for these endpoints
      (the only 127.0.0.1 handling is for the local redirect callback).
    new_driver_behavior: |
      The universal driver requires OAUTH_TOKEN_REQUEST_URL / OAUTH_AUTHORIZATION_URL to use the
      `https` scheme and rejects a non-loopback `http://` value at connect time. `http://` remains
      accepted for loopback hosts (127.0.0.0/8, ::1, localhost) for local testing.
    description: |
      Security hardening tracked under SNOW-3663588; the same difference is documented as BD#38 in
      python/ and BD#10 in jdbc/ BehaviorDifferences.yaml. DSNs that configured a plaintext
      `http://` IdP token endpoint must switch to `https://`.

  82:
    name: "PUT expands a leading ~ / ~/ in local source paths to the home directory"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Aligns the universal driver with JDBC and the Python connector, both of which expand a leading `~` in PUT source paths. The legacy ODBC driver (libsnowflakeclient) never did client-side `~` expansion, so adding it only enables previously-failing commands to succeed; no existing caller that passed an absolute or relative path is affected.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy ODBC driver (libsnowflakeclient) does not expand a leading `~` client-side. A command such as `PUT file://~/data/*.csv @stage` is passed to the glob/file lookup verbatim; because no directory is literally named `~`, it matches no files and the PUT fails to upload anything.
    new_driver_behavior: |
      A leading `~` or `~/` in the local source path is expanded to the user's home directory before glob expansion, so `PUT file://~/data/*.csv @stage` resolves to `<home>/data/*.csv`. This matches JDBC's `expandFileNames` and Python's `os.path.expanduser`. A `~` that is not the leading path segment (e.g. `/data/~/file` or `file~name`) is preserved literally. When the home directory cannot be determined the `~` is left untouched.
    description: |
      Reference: JDBC `SnowflakeFileTransferAgent.expandFileNames` (leading-`~` replacement) and Python `file_transfer_agent.py` (`os.path.expanduser`). The `~user` (named-user) form is not expanded by the universal driver; only the bare `~` and `~/` leading forms are. This differs from Python's `os.path.expanduser`, which additionally resolves `~user` via the password database; it matches the leading-only intent of JDBC. Applications that relied on the legacy ODBC behavior of treating a leading `~` literally will now have it expanded.
  83:
    name: "OAuth IdP token-exchange rejection returns SQLSTATE 28000 instead of generic HY000"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The new driver classifies an IdP-side credential rejection (bad client secret during the
      OAuth Authorization Code / Client Credentials token-exchange step) as an authentication
      failure, which the ODBC spec models with SQLSTATE 28000. The legacy driver reports the
      generic HY000. Surfacing 28000 lets applications distinguish auth failures from other
      general errors, so the difference is accepted.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      A failed OAuth token exchange (e.g. invalid client secret) surfaces with SQLSTATE HY000.
    new_driver_behavior: |
      Returns SQLSTATE 28000 (invalid authorization specification).
    description: |
      Applications inspecting the SQLSTATE on a failed OAuth Authorization Code or Client
      Credentials connection will now see 28000 instead of HY000.
  84:
    name: "PASSCODEINPASSWORD accepts on/true/1 instead of only on"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      The legacy ODBC driver only enables passcode-in-password when the connection-string value
      is the literal "on" (case-insensitive); any other value, including "true" or "1", is
      treated as disabled. The new driver parses the standard boolean spellings ("on", "true",
      "1") consistently with every other boolean connection attribute. Broadening accepted values
      is a usability improvement and a superset of the old behavior, so the difference is accepted.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      PASSCODEINPASSWORD is enabled only when the value is "on" (case-insensitive). With
      PASSCODEINPASSWORD=true the attribute is silently treated as false, so a password with an
      appended TOTP passcode is sent as a literal password and login fails with native error
      390100 ("Incorrect username or password was specified").
    new_driver_behavior: |
      PASSCODEINPASSWORD accepts "on", "true", and "1" (case-insensitive); each enables the
      passcode-in-password flow.
    description: |
      Applications that set PASSCODEINPASSWORD=true succeed on the new driver where they silently
      failed on the legacy driver. Tests use the value "on", which both drivers accept, to keep
      the shared e2e flow running against either driver.
  85:
    #TODO: Align with other wrappers to set it true by default (?)
    name: "OAuth Authorization Code token caching default differs from legacy ODBC (platform-dependent across reference drivers)"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      OAuth token caching for the Authorization Code flow is gated by
      CLIENT_STORE_TEMPORARY_CREDENTIAL, but the default varies by driver and platform. Legacy
      ODBC force-enables it for OAUTH_AUTHORIZATION_CODE on all platforms
      (SFConnection::Connect sets m_clientStoreTemporaryCredential = true in the AC authenticator
      branch). JDBC and Go enable it by default only on macOS and Windows; on Linux they default
      off unless explicitly configured. Python defaults off on all platforms. The new driver defaults
      off on all platforms (client_store_temporary_credential=false when unset) and only caches
      when the caller opts in — aligning with Python and with JDBC/Go on Linux, but diverging from
      legacy ODBC everywhere and from JDBC/Go on macOS/Windows. Explicit opt-in is the safer
      behavior; the difference is accepted pending review.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Legacy ODBC OAUTH_AUTHORIZATION_CODE connections cache the access / refresh token by default
      on all platforms. A later connection for the same host + user can short-circuit the
      interactive + token-exchange legs by replaying the cached token, even when other credentials
      (e.g. the client secret) have changed. Other reference drivers are platform-dependent: JDBC
      and Go default caching on for OAuth flows on macOS/Windows only; Python requires an explicit
      client_store_temporary_credential=true on every platform.
    new_driver_behavior: |
      On all platforms, OAUTH_AUTHORIZATION_CODE connections do not cache the token unless
      CLIENT_STORE_TEMPORARY_CREDENTIAL is explicitly set to true; every connect performs a fresh
      authorization + token exchange unless the caller opts in.
    description: |
      Applications relying on legacy ODBC's implicit AC token caching on any platform must set
      CLIENT_STORE_TEMPORARY_CREDENTIAL=true on the new driver to keep that behavior. macOS/Windows
      users accustomed to JDBC or Go (where OAuth caching defaults on) also need the explicit flag
      on the new driver. The e2e bad-client-secret test pins CLIENT_STORE_TEMPORARY_CREDENTIAL=false
      on the legacy driver so a token cached by the preceding happy-path test cannot mask the
      expected token-exchange failure.

  86:
    name: "SQLCancel during data-at-execution discards accumulated SQLPutData"
    status: allowed
    type: bugfix
    reviewed: true
    impact: high
    status_rationale: |
      The cancel should clear all data.
    is_breaking_change: true
    old_driver_behavior: |
      When SQLCancel is called from S10 (PutDataCalled) during a data-at-execution sequence, the old driver retains accumulated SQLPutData data. If the application re-enters DAE and provides new data, the final parameter value is the concatenation of the old and new chunks.
    new_driver_behavior: |
      SQLCancel from any DAE state (S8/S9/S10) fully resets the pending operation, discarding all accumulated SQLPutData. On re-entry the parameter starts fresh, matching the ODBC 3.5 spec requirement that cancel aborts the pending operation.
    description: |
      Applications that cancel mid-DAE and retry will get clean parameter values instead of stale concatenated data.

  87:
    name: "SQLPrimaryKeys/SQLForeignKeys case-fold unquoted identifiers in identifier mode"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under SQL_ATTR_METADATA_ID=SQL_TRUE the catalog function arguments are identifiers, and per the
      ODBC specification an unquoted identifier is case-insensitive (only a double-quoted identifier
      preserves case). The universal driver folds unquoted catalog/schema/table identifiers to
      uppercase before building the SHOW scope and re-filtering, matching how Snowflake stores
      unquoted names. The legacy driver re-filters the SHOW result case-sensitively against the
      caller's raw (lowercase) argument, so a lowercase identifier matches nothing. Tracked under
      SNOW-3234772 (SQLPrimaryKeys) and SNOW-3234773 (SQLForeignKeys).
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE and a lowercase (unquoted) catalog/schema/table identifier,
      the legacy driver compares the identifier case-sensitively against the uppercase names returned
      by SHOW and drops every row, yielding an empty result set.
    new_driver_behavior: |
      Unquoted identifiers are folded to uppercase before the SHOW scope is built and before the
      client-side re-filter, so a lowercase identifier matches the uppercase stored name and the
      expected row(s) are returned. Double-quoted identifiers remain case-sensitive.
    description: |
      Applications that relied on the legacy case-sensitive behavior of unquoted identifiers under
      identifier mode will now get matches for differently-cased identifiers. The odbc-api tests
      split the assertion (NEW_DRIVER_ONLY expects the matched row, OLD_DRIVER_ONLY expects the
      legacy empty result set).

  88:
    name: "SQLForeignKeys resolves NULL FK catalog and schema from connection context"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      This is a parameter gating correct behavior. It's worth dropping it to have better consistency with the ODBC API.
    old_driver_behavior: |
      When only FKTableName is supplied with NULL FKCatalogName and NULL FKSchemaName, the reference
      driver's result depends on the account's CLIENT_METADATA_REQUEST_USE_CONNECTION_CTX session
      parameter. With it disabled the driver returns an empty result set because it does not resolve
      the FK-side identifiers from the connection context; with it enabled the FK_CHILD row is
      returned.
    new_driver_behavior: |
      NULL FK catalog and schema are always resolved from the connection context (the catalog from the
      current database, and the schema because a table name was supplied), and client-side filtering
      scopes the result to the requested FK table, so the FK_CHILD row is returned regardless of the
      session parameter.
    description: |
      Aligns FK-side identifier resolution with SQLPrimaryKeys and the ODBC catalog-function contract
      for ordinary (non-pattern) arguments.

  89:
    name: "SQLForeignKeys metadata_id=TRUE allows NULL identifiers on the unspecified side"
    status: todo
    type: bug
    reviewed: true
    is_breaking_change: true
    status_rationale: |
      According to the ODBC specification, it is in DM's role to verify the provided null pointers, but unixODBC nor iODBC does that. We should readd the check to have the consistency.
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE, a single-sided PK-table query that leaves the entire FK
      side NULL returns HY009 even though FKTableName was not supplied.
    new_driver_behavior: |
      Catalog/schema null-pointer validation applies only to the side whose table name was supplied,
      so a PK-only query with metadata_id=TRUE succeeds when PK catalog and schema are provided. This
      applies under unixODBC and iODBC; the Windows Driver Manager performs its own identifier
      null-pointer check and returns HY009 for the NULL FK-side arguments before the driver is
      invoked, so the query still fails with HY009 on Windows regardless of the driver.
    description: |
      Per ODBC HY009 diagnostics, identifier-mode null checks apply to supplied table sides only.
      The reference driver over-validates the unspecified FK side. On Windows the Driver Manager
      enforces the identifier null check itself (documented as a "(DM)" diagnostic in the MS ODBC
      reference), so the improvement is observable only on unixODBC/iODBC.

  90:
    name: "SQLForeignKeys treats an empty-string PK/FK table as absent for SHOW side selection"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      SQLForeignKeys chooses SHOW EXPORTED vs SHOW IMPORTED KEYS based on which side supplies a table
      name. The universal driver treats an empty-string table name the same as an absent (NULL) one,
      so an empty PKTableName with a populated FKTableName resolves to the FK side (SHOW IMPORTED KEYS
      scoped to the FK table), consistent with how build_show_in_scope treats empty identifiers as "no
      filter".
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With an empty-string PKTableName and a populated FKTableName, the legacy driver does not resolve
      the query to the FK side and returns an empty result set.
    new_driver_behavior: |
      An empty-string table name is treated as absent for side selection, so the query resolves to the
      side whose table name is populated (here the FK side) and returns the relationship row.
    description: |
      Callers that passed an empty PKTableName alongside a real FKTableName and relied on the legacy
      empty result set will now receive the FK relationship. The odbc-api test splits the assertion
      (NEW_DRIVER_ONLY expects the row, OLD_DRIVER_ONLY expects the legacy empty result set).

  91:
    name: "SQLProcedures/SQLProcedureColumns case-fold unquoted identifiers in identifier mode"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under SQL_ATTR_METADATA_ID=SQL_TRUE the catalog function arguments are identifiers, and per the
      ODBC specification an unquoted identifier is case-insensitive (only a double-quoted identifier
      preserves case). SQLProcedures and SQLProcedureColumns fold the unquoted
      catalog/schema/procedure identifiers (and, for SQLProcedureColumns, the column name) to
      uppercase (via catalog_arg_to_pattern) before filtering: the catalog/schema/procedure names
      feed the case-sensitive information_schema.procedures LIKE filter, and the SQLProcedureColumns
      column name feeds the case-sensitive client-side like_match against the (upper-folded) parsed
      column names. The legacy driver compares the caller's raw (lowercase) arguments
      case-sensitively, so a lowercase identifier matches nothing. Tracked under SNOW-3234774.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE and a lowercase (unquoted) catalog/schema/procedure/column
      identifier, the legacy driver matches case-sensitively against the uppercase stored names and
      drops every row, yielding an empty result set.
    new_driver_behavior: |
      Unquoted identifiers are folded to uppercase before the information_schema.procedures LIKE
      filter and (for SQLProcedureColumns) the client-side column-name match, so a lowercase
      identifier matches the uppercase stored name and the expected row(s) are returned. Double-quoted
      identifiers remain case-sensitive. In pattern mode (SQL_ATTR_METADATA_ID=SQL_FALSE, the default)
      names stay case-sensitive, matching the reference driver.
    description: |
      Applications that relied on the legacy case-sensitive behavior of unquoted identifiers under
      identifier mode will now get matches for differently-cased identifiers. The odbc-api tests
      split the assertion (NEW_DRIVER_ONLY expects the matched row, OLD_DRIVER_ONLY expects the
      legacy empty result set).
  92:
    name: "GET auto-creates a missing local destination directory"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Aligns the universal driver with the Python connector (`os.makedirs`) and JDBC, both of which
      create the GET destination directory when it is missing. The legacy ODBC driver
      (libsnowflakeclient) requires the directory to already exist, so adding recursive creation only
      enables previously-failing commands to succeed; no caller that targeted an existing directory is
      affected.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy ODBC driver expects the local download directory to already exist. A GET into a
      non-existent directory fails when the driver tries to create the output file, because nothing
      creates the parent directory first.
    new_driver_behavior: |
      The universal driver creates the local destination directory recursively (`create_dir_all` in
      `sf_core` `download_single_file`) before writing each downloaded file, so a GET into a
      non-existent directory succeeds and the directory tree is created. This matches Python's
      `os.makedirs` and JDBC's GET behavior.
    description: |
      SNOW-3704966. Reference: Python `file_transfer_agent.py` (`os.makedirs`) and JDBC
      `FileUploaderLatestIT.testDownloadedFilePermissions` (auto-created GET destination). Applications
      that relied on the legacy ODBC behavior of failing on a missing directory will now have the
      directory created instead.
  93:
    name: "Failed GET download no longer leaves a partial or corrupt file at the destination"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      The legacy driver wrote GET output directly to the destination (decrypting in place) with
      no staging file and no cleanup, so a failed or interrupted transfer left a truncated/corrupt
      file at the destination. The universal driver's atomic `.part`-then-rename prevents any
      partial file from ever appearing at the destination.
    old_driver_behavior: |
      The legacy ODBC driver (libsnowflakeclient) opens the final destination file directly and
      streams downloaded bytes into it — through an in-place decrypt wrapper (`Crypto::CipherIOStream`)
      for encrypted files — with no `.part` staging file or rename (`FileTransferAgent::downloadSingleFile`).
      On a mid-transfer failure the download returns FAILED and the partial file is left at the
      destination with no cleanup, and GET performs no post-download digest verification. A retry
      re-opens the destination with truncation and overwrites, but once retries are exhausted the
      last partial write remains on disk.
    new_driver_behavior: |
      GET downloads assemble into a sibling `<dst>.part` staging file and rename it to the final
      destination only after the transfer completes successfully (and, for client-side-encrypted
      files, only after the SHA-256 content digest verifies). The user-visible destination path is
      therefore only ever a complete file; a failed or interrupted download never publishes partial
      or corrupt data there. On failure the driver drains any in-flight chunk writes and then
      removes the `.part` staging file, so a failed download leaves the filesystem clean. (A
      client-side-encrypted download stages ciphertext in a separate temporary file that is likewise
      removed on failure and unlinked once decrypted.) The only residue possible is after a hard
      process kill (SIGKILL / power loss), where at most a single `<dst>.part` can remain —
      self-documenting, and overwritten by the next download of the same file rather than
      accumulating. The contract is cloud-generic (S3, Azure, and GCS).
  94:
    name: "SQLSetConnectAttr(SQL_ATTR_LOGIN_TIMEOUT) after connect returns HY011 instead of SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      It does not make sense to silently accept a value that is already no-op.
    old_driver_behavior: |
      The old driver accepts SQL_ATTR_LOGIN_TIMEOUT set calls after the connection is established,
      returning SQL_SUCCESS silently. The attribute has no effect post-connect (the login timeout
      only applies during the connection attempt), so the acceptance is misleading.
    new_driver_behavior: |
      The new driver correctly rejects SQL_ATTR_LOGIN_TIMEOUT set calls after connect with
      SQL_ERROR / HY011 ("attribute cannot be set now"), per the ODBC spec designation of
      SQL_ATTR_LOGIN_TIMEOUT as a pre-connect-only attribute. Note: some Driver Managers (e.g.
      Windows DM) manage login timeout state internally and return SQL_SUCCESS without forwarding
      the call to the driver, so the HY011 is only observable when the DM forwards the call.
    description: |
      Applications that set SQL_ATTR_LOGIN_TIMEOUT post-connect and rely on SQL_SUCCESS without
      error-checking will encounter HY011 on platforms where the DM forwards the call. The change
      is a spec-compliance fix; the attribute was always a no-op post-connect.

  95:
    name: "SQLGetConnectAttr with out-of-range attribute identifier returns HY092 instead of accepting silently"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      It provides a better visibility of what's happening internally for the user, aligning with the ODBC spec.
    old_driver_behavior: |
      The old driver does not classify completely out-of-range attribute identifiers (e.g. 99999)
      as HY092; it may return HY000 or pass through without an error.
    new_driver_behavior: |
      The new driver returns SQL_ERROR / HY092 ("invalid attribute/option identifier") for any
      attribute identifier outside the defined ODBC range, matching the ODBC 3.x specification.
    description: |
      Applications querying unknown connection attribute IDs will now receive a well-defined
      HY092 error instead of an undefined response. No impact on well-formed applications.

  96:
    name: "SQLSetStmtAttr(SQL_ATTR_CURSOR_TYPE) supports only SQL_CURSOR_FORWARD_ONLY, replacing any other value with that and returns SQL_SUCCESS_WITH_INFO/01S02"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      As the Snowflake does not support other cursors than forward-only, it is aligning the API with the Snowflake API.
    old_driver_behavior: |
      The old driver silently accepts non-forward-only cursor types (SQL_CURSOR_STATIC,
      SQL_CURSOR_DYNAMIC, SQL_CURSOR_KEYSET_DRIVEN) on SQL_ATTR_CURSOR_TYPE without warning.
      The stored value reflects whatever was requested, even though Snowflake only supports
      forward-only cursors.
    new_driver_behavior: |
      The new driver substitutes any unsupported cursor type with SQL_CURSOR_FORWARD_ONLY and
      returns SQL_SUCCESS_WITH_INFO / 01S02 ("option value changed"), per the ODBC spec requirement
      that drivers substitute unsupported values and report the substitution.
    description: |
      Applications that set a scrollable cursor type and then check the return code for exactly
      SQL_SUCCESS will see SQL_SUCCESS_WITH_INFO instead. Applications that read back
      SQL_ATTR_CURSOR_TYPE after setting it will see SQL_CURSOR_FORWARD_ONLY regardless of the
      requested type. This is spec-correct behavior.

  97:
    name: "SQL_SF_CONN_ATTR_APPLICATION is a Snowflake-custom pre-connect attribute not present in the legacy driver"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      Adds a new way of setting up the Application.
    old_driver_behavior: |
      The legacy driver does not expose SQL_SF_CONN_ATTR_APPLICATION. Setting or getting this
      attribute returns an error on the old driver.
    new_driver_behavior: |
      The new driver accepts SQL_SF_CONN_ATTR_APPLICATION before connect, stores the value, and
      returns it on GET. The attribute is forwarded to the server as the application name.
    description: |
      Applications using SQL_SF_CONN_ATTR_APPLICATION require the new driver. The old driver
      has no equivalent attribute, so tests for this attribute are gated with NEW_DRIVER_ONLY.

  98:
    name: "Numeric-to-interval conversion normalizes negative zero to +0 instead of producing negative zero"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    status_rationale: |
      This enhances the visibility of the truncated value.
    impact: low
    old_driver_behavior: |
      When a negative fractional numeric value (FLOAT/REAL, DECFLOAT, or NUMBER) truncates to zero for a
      single-field interval C type (e.g. -0.5 fetched as SQL_C_INTERVAL_YEAR/_MONTH/_DAY), the old driver
      sets the interval sign to SQL_TRUE, yielding a negative zero interval.
    new_driver_behavior: |
      The integer part truncating to zero always yields +0: interval_sign is SQL_FALSE and the field value
      is 0. There is no negative zero for interval types.
    description: |
      Applications reading the interval sign for values that truncate to zero will now always see a positive
      sign. This is the numeric-source counterpart of BD#55 point 6, which documents the same negative-zero
      normalization for VARCHAR/character sources; both paths share
      numeric_helpers::write_single_field_interval. Formerly tracked (incorrectly) under BD#17 (a PUT/GET
      regression) and BD#16 (a NaN-to-integer difference); relabeled to its own entry.
  99:
    name: "FLOAT/REAL-to-interval fractional truncation is flagged with 01S07 instead of SQL_SUCCESS in some cases"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    status_rationale: |
      Alignment with the ODBC spec.
    impact: low
    old_driver_behavior: |
      When a FLOAT/REAL value with a nonzero fractional part is fetched as a single-field interval C type
      (e.g. 5.7 fetched as SQL_C_INTERVAL_YEAR/_MONTH/_DAY, or a sub-microsecond fraction as
      SQL_C_INTERVAL_SECOND), the old driver truncates the fraction and returns SQL_SUCCESS with no
      diagnostic. DECFLOAT and NUMBER sources are unaffected: the old driver flags those with 01S07.
    new_driver_behavior: |
      Returns SQL_SUCCESS_WITH_INFO with SQLSTATE 01S07 ("Fractional truncation") for FLOAT/REAL sources,
      consistent with DECFLOAT and NUMBER sources and with the ODBC spec.
    description: |
      Applications relying on the 01S07 warning to detect that a FLOAT-sourced interval lost its fractional
      part now receive it. Previously tracked (incorrectly) under BD#16 (a NaN-to-integer difference).
      Related to BD#98, which covers the negative-zero sign normalization on the same FLOAT->interval
      truncation path.

  100:
    name: "SQLSetStmtAttr SQL_ATTR_PARAM_BIND_TYPE misaligned value accepted on all platforms"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The old driver on Linux x86_64 accepts a bind-type value of 10 (not 0 and not a multiple of
      alignof(SQLLEN)=8), but rejects it with S1000 on Linux aarch64 and macOS. The new driver
      accepts the misaligned value on all Unix platforms. The Windows DM intercepts the call before
      reaching the driver on Windows.

      Per the ODBC spec, the new driver is the more compliant side. SQL_ATTR_PARAM_BIND_TYPE is an
      SQLULEN value: 0 (SQL_PARAM_BIND_BY_COLUMN) selects column-wise binding, and any other value
      is interpreted as the byte length (stride) of the row-wise parameter-set structure. The spec
      imposes no alignment constraint on this length — it only advises applications to use
      sizeof(struct) so the stride lands on the next structure. 10 is therefore a legal stride, and
      the consequence of a too-small/misaligned value surfaces during SQLExecute address arithmetic
      (Address = Bound Address + ((Row - 1) * Structure Size) + Offset), not at SQLSetStmtAttr time.
      A driver that did reject a bad value here would use HY024 ("Invalid attribute value"); the old
      driver instead returns S1000 ("General error") and does so inconsistently across architectures,
      making its rejection an over-strict, non-standard implementation detail rather than
      spec-mandated behaviour. Ref:
      https://learn.microsoft.com/sql/odbc/reference/syntax/sqlsetstmtattr-function#statement-attributes
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQLSetStmtAttr(SQL_ATTR_PARAM_BIND_TYPE, 10) returns SQL_SUCCESS on Linux x86_64 but
      SQL_ERROR with SQLSTATE S1000 on Linux aarch64 and macOS. This platform-dependent alignment
      check (value must be 0 or divisible by alignof(SQLLEN)=8) is not required by the ODBC spec,
      and S1000 is not the documented SQLSTATE for an invalid attribute value (that would be HY024).
    new_driver_behavior: |
      SQLSetStmtAttr(SQL_ATTR_PARAM_BIND_TYPE, 10) returns SQL_SUCCESS on all Unix platforms, which
      matches the ODBC spec: any non-zero SQLULEN is a legal row-wise stride and is not validated for
      alignment at set time. The prepared_exec replay test gates the non-x86_64 assertion with
      OLD_DRIVER_ONLY/NEW_DRIVER_ONLY("BD#100").
    description: |
      Applications setting an unaligned bind-type value will no longer receive S1000 on
      non-x86_64 Unix platforms with the new driver. This is a spec-compliance improvement: the
      value is a byte-length stride with no alignment requirement, so accepting it at set time is
      correct; any addressing consequence of a bad stride still surfaces at SQLExecute time.

  101:
    name: "Connection-level QUERY_TAG is applied as a session parameter"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    status_rationale: |
      The query_tag should always be forwarded to the Snowflake on the session login.
    impact: low
    old_driver_behavior: |
      Setting QUERY_TAG in the connection string does not tag the session: after connecting with
      QUERY_TAG=<value>, SELECT CURRENT_QUERY_TAG() returns an empty string. The old driver does
      not forward a connection-level QUERY_TAG to the server as a login session parameter.
    new_driver_behavior: |
      The universal driver registers QUERY_TAG as a session parameter and forwards a
      connection-level value in the login SESSION_PARAMETERS, so CURRENT_QUERY_TAG() returns the
      configured value and every query in the session is tagged.
    description: |
      Analogous to the CLIENT_SESSION_KEEP_ALIVE_HEARTBEAT_FREQUENCY session-parameter forwarding
      difference (BD#57). The e2e test query/query_tag.cpp asserts both drivers via NEW_DRIVER_ONLY("BD#101") and OLD_DRIVER_ONLY("BD#101").
  102:
    name: "SQLSetStmtAttr(SQL_ROWSET_SIZE, 0) coerces to 1 instead of storing 0"
    # ROW_ARRAY_SIZE should also be aligned to the spec; setting 0 triggers SQL_ERROR
    status: todo
    type: bug
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      According to ODBC spec, this should fail loudly.
    old_driver_behavior: |
      SQLSetStmtAttr(SQL_ROWSET_SIZE, 0) returns SQL_SUCCESS and stores 0 unchanged; a
      subsequent SQLGetStmtAttr(SQL_ROWSET_SIZE) returns 0.
    new_driver_behavior: |
      The new driver clamps the invalid value 0 to 1 (a rowset must contain at least one row),
      matching how it already coerces SQL_ATTR_ROW_ARRAY_SIZE = 0 to 1, so
      SQLGetStmtAttr(SQL_ROWSET_SIZE) returns 1. The coercion is silent (no 01S02 posted).
    description: |
      SQL_ROWSET_SIZE (ODBC 2.x, attr 9) drives SQLExtendedFetch. A rowset size of 0 is invalid;
      the new driver normalizes it to 1 for consistency with SQL_ATTR_ROW_ARRAY_SIZE.

  103:
    #TODO - add test and confirm behavior
    name: "GCS PUT OVERWRITE=TRUE on matching content re-uploads instead of skipping"
    status: todo
    type: bugfix
    reviewed: true
    is_breaking_change: true
    status_rationale: |
      To be verified, how old driver behaves.
    impact: low
    old_driver_behavior: |
      Against a GCS stage, a PUT with OVERWRITE=TRUE whose local payload matched the remote object's
      stored x-goog-meta-sfc-digest was skipped: the PUT result set status column reported SKIPPED and
      no upload occurred. This was a universal-driver-only quirk (GCS skipped content matches
      unconditionally); the legacy ODBC driver re-uploads.
    new_driver_behavior: |
      GCS re-uploads a content-matching PUT with OVERWRITE=TRUE (status = UPLOADED), matching the
      legacy ODBC driver. The content-match skip is gated behind the opt-in skip_upload_on_content_match
      flag in sf_core, which ODBC does not set, so the skip never fires by default.
    description: |
      GCS now honors the opt-in skip_upload_on_content_match flag like S3 and Azure instead of skipping
      matching content unconditionally, restoring legacy parity for the default PUT OVERWRITE=TRUE path.
  104:
    name: "GET writes to a temporary .part file before renaming to the final destination (old driver writes the destination directly)"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Downloading to a `<file>.part` temp file and renaming on success avoids leaving a partially
      written file at the destination path if the download is interrupted. This is a deliberate
      safety improvement over the old driver's direct-write behavior.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      GET writes downloaded bytes directly to the final destination path. An interrupted download
      can leave a partially written file at the destination filename.
    new_driver_behavior: |
      GET writes to `<destination>.part` and renames it to the final destination filename only
      after the download completes successfully. An interrupted download leaves only the `.part`
      file, never a partial file at the destination filename.
    description: |
      A side effect: failure-injection tests that pre-block a destination file to force a local
      write failure cannot reproduce on the old driver, since it never contends for the `.part` path.
      The collect-all GET test (put_get_fastfail_default.cpp) and the GET_FASTFAIL override test
      both skip the old driver for this reason via SKIP_OLD_DRIVER("BD#104", ...).
  105:
    name: "PUT_FASTFAIL diagnostic message differs between drivers while both fail fast"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Both drivers abort the PUT batch at the first failing file when fast-fail is enabled; only the
      diagnostic text differs. The ODBC spec does not mandate specific message wording, so this is a
      cosmetic difference, not a functional one.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQLGetDiagRec on the aborted PUT statement returns a message containing "Fast fail enabled,
      Skipped uploading rest of the files."
    new_driver_behavior: |
      SQLGetDiagRec on the aborted PUT statement returns a message containing "Failed to read or
      write file" (the underlying per-file I/O error, e.g. permission denied).
    description: |
      Applications that match on the exact diagnostic text (rather than the SQLSTATE) will see a
      different message on the new driver.
  106:
    name: "Unrecognized connection-string keywords are forwarded to the server instead of being rejected with 01S00"
    status: todo
    type: enhancement
    reviewed: true
    is_breaking_change: false
    status_rationale: |
      This requires additional work on the backend.
    impact: low
    old_driver_behavior: |
      SQLDriverConnect with an unrecognized connection-string keyword (e.g.
      "DSN=<dsn>;INVALIDKEY=abc") returns SQL_SUCCESS_WITH_INFO and posts a diagnostic record with
      SQLSTATE 01S00, native error 17, message "N invalid keys are found in the connection string:
      <KEY>", derived from a local check for keywords the driver does not recognize. The connection
      still opens. (Under iODBC the old driver reports SQL_SUCCESS_WITH_INFO but does not post the
      01S00 record on the DBC handle - see BD#61.)
    new_driver_behavior: |
      The universal driver forwards unrecognized connection-string keywords to the server as
      session parameters rather than rejecting them locally, so it does not (yet) emit the 01S00
      warning: SQLDriverConnect opens the connection and posts no 01S00 record. (The return code is
      SQL_SUCCESS_WITH_INFO in practice, but only because of the driver's unrelated 01004
      "string data truncated" OutConnectionString handling - never 01S00 for the unknown keyword.)
    description: |
      Enhancement tracked by SNOW-3831223: once unrecognized session parameters are rejected from
      a server-side "parameter not applied" signal (rather than the old driver's purely local
      unknown-keyword check), the universal driver will surface 01S00, bringing it to parity with -
      and improving on - the legacy driver's local heuristic. Aligns with the customer feature
      request SNOW-3765949. Not a breaking change today: 01S00 is SQL_SUCCESS_WITH_INFO, so the
      connection opens on both drivers; the new driver merely omits the diagnostic warning for now.
      The odbc-api test connecting/driver_connect_tests.cpp ("SQLDriverConnect: Unrecognized
      connection string keyword (old driver: 01S00, new driver: no warning)") asserts both drivers
      via OLD_DRIVER_ONLY("BD#106") and NEW_DRIVER_ONLY("BD#106").
  107:
    name: "SQLSetConnectAttr with ODBC 2.x statement-level attribute IDs returns HY092 instead of SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      Alignment with ODBC spec.
    old_driver_behavior: |
      SQLSetConnectAttr(SQL_ATTR_MAX_ROWS) and SQLSetConnectAttr(SQL_ATTR_QUERY_TIMEOUT) on a
      connection handle return SQL_SUCCESS silently. Both IDs (0 and 1) are ODBC 2.x statement
      attributes; setting them on a connection handle is invalid but the old driver swallows the
      call without error.
    new_driver_behavior: |
      The new driver returns SQL_ERROR / HY092 because these are statement-level attributes
      whose use on a connection handle is invalid per the ODBC spec. All three DMs forward
      the call to the driver (none intercepts it). The SQLSTATE seen by the application
      depends on the DM: Windows DM (ODBC 3.x app) passes HY092 unchanged; iODBC also passes
      HY092 unchanged; unixODBC remaps HY092→S1092 for ODBC 2.x-registered apps.
    description: |
      Applications that call SQLSetConnectAttr(SQL_ATTR_MAX_ROWS/QUERY_TIMEOUT) and ignore the
      return code will now get a diagnostic record; applications that check the return code will
      see SQL_ERROR instead of SQL_SUCCESS. The old behavior masked a spec violation.
  108:
    name: "Connecting with WIF-only params set but authenticator != WORKLOAD_IDENTITY now fails; legacy silently ignored"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      Verified against the real legacy driver source (snowflakedb/snowflake-odbc, v3.19.0):
      SFConnection.cpp registers WORKLOAD_IDENTITY_PROVIDER / WORKLOAD_IDENTITY_ENTRA_RESOURCE /
      WORKLOAD_IDENTITY_IMPERSONATION_PATH as optional accepted keys but reads them only inside the
      authenticator==workload_identity branch of SFConnection::Connect, so a non-WIF authenticator
      accepts the attributes and never reads them (no cross-param guard). The driver links
      libsnowflakeclient (the Snowflake C/C++ core) but owns this connection-param dispatch itself.
      The universal driver's sf_core::validate_settings rejects the combination (ConflictingParameters,
      Error). Allowed as a bugfix: it matches legacy snowflake-connector-python's long-standing
      rejection (ProgrammingError errno=251017) and enforces it uniformly across wrappers; no ODBC
      caller relies on the attributes being silently ignored.
  109:
    name: "workload_identity_impersonation_path with provider=OIDC now fails; legacy silently ignored it"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    status_rationale: |
      ODBC links libsnowflakeclient for attestation creation; its createOIDCAttestation
      (cpp/OIDCAttestation.cpp) never reads the impersonation-path setting for provider=OIDC, so it's
      silently discarded today. Legacy snowflake-connector-python/nodejs/.NET all reject this
      combination client-side; legacy ODBC never did. sf_core::validate_settings now rejects it uniformly
      (ConflictingParameters, Error). Unlike entry 108, this is a genuine new rejection for ODBC, not a
      relocated one — allowed as a bugfix since silently accepting a no-op param combination is itself a
      latent bug.
  110:
    name: "SQLGetDiagRec/SQLGetDiagField MessageText: new driver prepends the ODBC vendor prefix to server errors"
    status: allowed
    type: enhancement
    reviewed: false
    status_rationale: |
      The ODBC spec (§16.2.16) requires drivers to prepend [vendor][ODBC-component-identifier] to
      diagnostic message text. The new driver does so uniformly and, for data source-originated
      (server) errors, adds a third [data-source] segment ([Snowflake]) (SNOW-3235406), yielding the
      3-part [Snowflake][Snowflake ODBC Driver][Snowflake]. The old (SimbaEngine) driver only prefixes
      driver-originated errors (with [Snowflake][Support]) and passes server-originated error text
      through verbatim with no vendor prefix. The new driver's uniform, spec-compliant prefixing is
      intentional; the old driver's raw passthrough on server errors is the divergence.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Diagnostic message text from SQLGetDiagRec / SQLGetDiagField(SQL_DIAG_MESSAGE_TEXT) for a data
      source-originated (server) error is the raw server message with no vendor prefix, e.g.
      "SQL compilation error: Object '...' does not exist or not authorized." The old driver's
      "[Snowflake][Support]" prefix (a SimbaEngine artefact) appears only on driver-originated errors.
    new_driver_behavior: |
      Diagnostic message text is prefixed with "[Snowflake][Snowflake ODBC Driver]" for
      driver-originated errors and the 3-part "[Snowflake][Snowflake ODBC Driver][Snowflake]" for data
      source-originated (server) errors, matching the §16.2.16 [vendor][component][data-source]
      structure. The component identifier now names the driver; the third [Snowflake] segment
      identifies the data source (SNOW-3235406).
    description: |
      Applications that pattern-match diagnostic message text against a leading "[Snowflake][Support]"
      prefix must update to "[Snowflake][Snowflake ODBC Driver]". For server (data source-originated)
      errors specifically, the old driver emits no vendor prefix at all -- it passes the raw server text
      through (e.g. "SQL compilation error: ...") -- whereas the new driver emits the 3-part
      "[Snowflake][Snowflake ODBC Driver][Snowflake]" prefix.

  111:
    name: "SQLCancelHandle(DBC) returns HY010 when an associated statement is mid-async or in data-at-execution"
    status: unknown
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      SQLCancelHandle(SQL_HANDLE_DBC) is a no-op that returns SQL_SUCCESS even when an associated
      statement is asynchronously executing (SQL_STILL_EXECUTING) or mid data-at-execution
      (SQL_NEED_DATA). The ODBC 3.8 Diagnostics table requires HY010 (Function sequence error) in
      those cases.
    new_driver_behavior: |
      SQLCancelHandle(SQL_HANDLE_DBC) returns SQL_ERROR with SQLSTATE HY010 when any associated
      statement is asynchronously executing or mid data-at-execution, matching the ODBC 3.8
      Diagnostics table. When no child statement is busy, DBC cancel remains a no-op returning
      SQL_SUCCESS (neither driver supports cancelable connection-level async operations).
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlcancelhandle-function
      — HY010 when "An asynchronously executing, statement-related function was called for one of
      the statement handles associated with the Handle, and HandleType was set to SQL_HANDLE_DBC"
      or when SQLBrowseConnect / streamed parameters leave the connection mid NEED_DATA / param
      data available. Applications that called SQLCancelHandle(DBC) during statement async/DAE and
      expected SQL_SUCCESS will now see HY010; they should cancel the statement handle instead.

  112:
    name: "CSE KeyWrappingMetadata.EncryptionLibrary: UD self-identifies as \"Rust(OpenSSL)\""
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Azure/GCS `encryptiondata` JSON: the legacy driver (libsnowflakeclient) hardcodes
      `KeyWrappingMetadata.EncryptionLibrary = "Java 5.3.0"` on its Azure builder, but its own
      GCS builder emits a different literal, `"openssl 1.1.1i"` -- proof this field is a
      majority convention, not an enforced constant, even within one driver.
    new_driver_behavior: |
      UD emits `"Rust(OpenSSL)"` for the same field on both clouds -- an honest
      self-identification, matching the same self-identify-honestly instinct ODBC's own GCS
      builder already follows. Confirmed no reader anywhere consumes this value: not the four
      legacy drivers' decrypt paths, not UD's own, and not GS's own server-side parser, which
      validates several sibling fields but never reads `EncryptionLibrary`. GS's own internal
      C++ encryption library independently emits `"OpenSSL 1.0.1e-fips"` on its GCS path, not
      `"Java 5.3.0"` --
      corroborating the pattern at the server side too. Kept deliberately: matching
      "Java 5.3.0" would misidentify which implementation produced the blob, valuable for
      diagnostics during the mixed-fleet rollout period.

  113:
    name: "SQLTables case-fold unquoted identifiers in identifier mode"
    status: unknown
    type: bugfix
    reviewed: false
    status_rationale: |
      Under SQL_ATTR_METADATA_ID=SQL_TRUE the catalog function arguments are identifiers, and per the
      ODBC specification an unquoted identifier is case-insensitive (only a double-quoted identifier
      preserves case). The universal driver folds unquoted catalog/schema/table identifiers to
      uppercase via catalog_arg_to_pattern before SHOW OBJECTS and the case-sensitive client-side
      like_match re-filter. The legacy driver re-filters SHOW results case-sensitively against the
      caller's raw (lowercase) argument, so a lowercase identifier matches nothing. Related pattern-
      mode case-sensitivity fix: SNOW-3780463.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE and a lowercase (unquoted) catalog/schema/table identifier,
      the legacy driver compares the identifier case-sensitively against the uppercase names returned
      by SHOW and drops every row, yielding an empty result set.
    new_driver_behavior: |
      Unquoted identifiers are folded to uppercase before SHOW and the client-side re-filter, so a
      lowercase identifier matches the uppercase stored name and the expected row(s) are returned.
      Double-quoted identifiers remain case-sensitive. In pattern mode (SQL_ATTR_METADATA_ID=SQL_FALSE,
      the default) names stay case-sensitive, matching the reference driver (SNOW-3780463).
    description: |
      Applications that relied on the legacy case-sensitive behavior of unquoted identifiers under
      identifier mode will now get matches for differently-cased identifiers. The odbc-api tests
      split the assertion (NEW_DRIVER_ONLY expects the matched row, OLD_DRIVER_ONLY expects the
      legacy empty result set).

  114:
    name: "SQLGetDiagField(SQL_DIAG_SERVER_NAME) is populated instead of returning an empty string"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQLGetDiagField(SQL_DIAG_SERVER_NAME) returns an empty string after a diagnostic is raised
      on a connected statement/connection.
    new_driver_behavior: |
      SQLGetDiagField(SQL_DIAG_SERVER_NAME) returns the server/DSN name of the connection, matching
      the ODBC definition of the field.
    description: |
      Additive: applications reading SQL_DIAG_SERVER_NAME now receive the connection's server name
      where the old driver returned "". Verified in
      odbc-api/diagnostic/diag_field_tests.cpp via NEW_DRIVER_ONLY/OLD_DRIVER_ONLY("BD#114").

  115:
    name: "SQLGetDiagField(SQL_DIAG_DYNAMIC_FUNCTION_CODE) classifies the statement instead of returning 0/unknown"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQLGetDiagField(SQL_DIAG_DYNAMIC_FUNCTION_CODE) returns 0 (SQL_DIAG_UNKNOWN_STATEMENT) and
      SQL_DIAG_DYNAMIC_FUNCTION returns an empty string after execution.
    new_driver_behavior: |
      The fields are populated from the statement type: a SELECT reports
      SQL_DIAG_DYNAMIC_FUNCTION_CODE = 85 (SQL_DIAG_SELECT_CURSOR); INSERT/UPDATE/DELETE/CALL map to
      their ODBC-spec codes.
    description: |
      Additive: applications reading SQL_DIAG_DYNAMIC_FUNCTION_CODE now get the classified code where
      the old driver returned 0. Verified in odbc-api/diagnostic/diag_field_tests.cpp via
      NEW_DRIVER_ONLY/OLD_DRIVER_ONLY("BD#115").

  116:
    name: "Statement header diagnostic fields are not readable through iODBC's wide SQLGetDiagFieldW entry point"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Reading a statement-only header diagnostic field through iODBC's wide entry point
      (SQLGetDiagFieldW) is mishandled: SQL_DIAG_ROW_COUNT and SQL_DIAG_CURSOR_ROW_COUNT abort the
      process (a pthread_mutex assertion in Simba::ODBC::DiagManager::SQLGetDiagFieldW), and
      SQL_DIAG_DYNAMIC_FUNCTION_CODE returns a non-success code. The same reads succeed through
      unixODBC (the narrow entry point).
    new_driver_behavior: |
      The driver itself writes the correct value and returns SQL_SUCCESS for these fields regardless
      of the ANSI/wide entry point (the numeric header writes in get_diag_field are
      encoding-independent). But iODBC's wide SQLGetDiagFieldW does not deliver statement header
      fields to the caller: SQL_DIAG_ROW_COUNT, SQL_DIAG_CURSOR_ROW_COUNT and
      SQL_DIAG_DYNAMIC_FUNCTION_CODE return SQL_ERROR before the driver's value reaches the
      application. The same reads succeed through iODBC's narrow entry point and through unixODBC.
    description: |
      This is an iODBC driver-manager limitation in its wide (UTF-16/UTF-32) SQLGetDiagFieldW path,
      not a defect in the new driver: the driver returns the correct value, but iODBC's wide entry
      point does not surface these statement header fields (the old driver additionally aborts or
      errors inside its own DiagManager on the same path). Because the failure is at the DM boundary
      it affects both drivers under iODBC, so the three affected reads in
      odbc-api/diagnostic/diag_field_tests.cpp (SQL_DIAG_ROW_COUNT, SQL_DIAG_CURSOR_ROW_COUNT,
      SQL_DIAG_DYNAMIC_FUNCTION_CODE) are gated with SKIP_IODBC("BD#116 - ..."). Full coverage of
      these fields for both drivers remains on the unixODBC lanes (Linux, macOS Universal) and on
      Windows.

  117:
    name: "SQLDescribeCol column size for SQL_DOUBLE / SQL_FLOAT is 15 (decimal digits) instead of 53 (binary mantissa bits)"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQLDescribeCol on a SQL_DOUBLE / SQL_FLOAT column (SQL data type 8) reports a column size of
      53 -- the number of bits in the IEEE-754 double-precision mantissa.
    new_driver_behavior: |
      The new driver reports a column size of 15 -- the number of significant decimal digits of a
      double-precision float, matching the ODBC specification's definition of column size for
      SQL_DOUBLE / SQL_FLOAT.
    description: |
      Spec reference: the ODBC "Column Size, Decimal Digits, Transfer Octet Length, and Display
      Size" table defines the column size of SQL_DOUBLE / SQL_FLOAT as 15 (decimal digits), not the
      count of binary mantissa bits. Applications that used the old driver's 53 to size buffers will
      now see 15; the value is a precision/display hint and does not change the fetched data.
      Exercised by odbc_tests/tests/replay/excel/ado/sqlbindcol/test.cpp (SQLDescribeCol cols 8, 9, 10).

  118:
    name: "Fractional truncation on a numeric-to-character fetch returns SQLSTATE 01S07 instead of 01000"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When a fetch converts a high-scale numeric column into a bound character buffer that cannot
      hold all fractional digits, the old driver returns SQL_SUCCESS_WITH_INFO with SQLSTATE 01000
      (general warning) and vendor code 40460.
    new_driver_behavior: |
      The new driver returns SQL_SUCCESS_WITH_INFO with SQLSTATE 01S07 (fractional truncation) --
      the ODBC 3.x SQLSTATE the specification defines for loss of fractional digits during a
      numeric-to-character conversion.
    description: |
      Spec reference: ODBC 3.x defines 01S07 "Fractional truncation" for exactly this case. Both
      drivers still return SQL_SUCCESS_WITH_INFO, so the (truncated) fetched value is unchanged;
      applications that matched on the old driver's 01000 must also accept 01S07. Exercised by
      odbc_tests/tests/replay/excel/ado/sqlbindcol/test.cpp (two SQLFetch cases).

  119:
    name: "VECTOR type fetch: UD returns JSON array string; reference driver unsupported"
    status: allowed
    type: enhancement
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The reference ODBC driver (libsnowflakeclient) has no VECTOR type support. Any query that
      returns a VECTOR column fails at the conversion layer; no data is returned.
    new_driver_behavior: |
      UD fetches VECTOR columns as compact JSON array strings (e.g. `[1,2,3]`) via
      SQL_C_CHAR, SQL_C_WCHAR, and SQL_C_BINARY. SQLDescribeCol reports SQL_VARCHAR with
      column_size equal to the session VARCHAR_AND_BINARY_MAX_SIZE_IN_RESULT parameter.
      SQL_DESC_TYPE_NAME returns "VECTOR". Numeric C-type conversions (SQL_C_LONG, etc.) are
      rejected with SQLSTATE 07006, matching the ARRAY/VARIANT precedent.

  120:
    name: "SQLGetFunctions: per-function probe of SQLCancelHandle range-rejected with SQL_ERROR under unixODBC"
    status: allowed
    type: bug
    reviewed: false
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      The legacy driver's SQL_API_ODBC3_ALL_FUNCTIONS bitmap omits
      SQL_API_SQLCANCELHANDLE (documented separately as BD#45), so the loop test
      already skips SQLCancelHandle for the old driver. The per-function probe of
      SQL_API_SQLCANCELHANDLE is subject to the same unixODBC range guard described
      below regardless of driver.
    new_driver_behavior: |
      Under the unixODBC Driver Manager the per-function probe
      `SQLGetFunctions(dbc, SQL_API_SQLCANCELHANDLE, &out)` returns SQL_ERROR
      (SQLSTATE HY095), even though the ODBC3 bitmap the driver returns for
      SQL_API_ODBC3_ALL_FUNCTIONS correctly reports SQLCancelHandle supported. The
      error is injected by the Driver Manager, not by the driver: unixODBC does not
      forward a per-function SQLGetFunctions(id) query to the driver at all — it
      answers from a cache built once at connect time (from the driver's
      SQL_API_ODBC3_ALL_FUNCTIONS bitmap) or range-rejects the id. iODBC is
      unaffected (it answers SQLGetFunctions from its own static table); Windows is
      unaffected. Bitmap coverage of SQLCancelHandle is verified independently via
      SQL_API_ODBC3_ALL_FUNCTIONS, so the function itself is implemented; only the
      DM's per-function query path range-rejects it.
    description: |
      Root cause is a unixODBC Driver Manager limitation, not a defect in the new
      driver — the driver's ODBC3 bitmap is correct (verified by the passing
      SQL_API_ODBC3_ALL_FUNCTIONS test), and its enum values match the ODBC headers
      exactly (SQL_API_SQLCLOSECURSOR = 1003, SQL_API_SQLCANCELHANDLE = 1022).

      unixODBC's SQLGetFunctions (DriverManager/SQLGetFunctions.c) never forwards a
      per-function query to the driver. It validates the function id against a fixed
      set of ranges and, for any id it accepts, answers from the connect-time cache
      via __check_for_function (DriverManager/SQLConnect.c) — which only ever sets
      *supported to TRUE/FALSE and never returns SQL_ERROR. The id-range guard
      rejects anything `function_id > SQL_API_SQLFETCHSCROLL` (1021) with SQLSTATE
      HY095 -> SQL_ERROR. SQL_API_SQLCANCELHANDLE = 1022 falls just past that bound
      (it is an ODBC 3.8 function the DM's range validation was never extended to
      cover), so the DM returns SQL_ERROR before the driver is ever consulted. This
      guard is identical across unixODBC releases (verified in master and v2.3.9).

      There is no driver-side fix: the DM rejects the id structurally and never asks
      the driver, so the correct-and-only lever the driver has (the
      SQL_API_ODBC3_ALL_FUNCTIONS bitmap) already reports SQLCancelHandle supported.
      The per-function probe of SQLCancelHandle is therefore gated with
      NEW_DRIVER_ONLY("BD#120") in the comprehensive-coverage loop in
      odbc-api/driver_info/get_functions_tests.cpp (the old driver already skips it
      via BD#45); SKIP_IODBC covers iODBC's static-table behavior. The proper
      upstream fix is unixODBC extending its range check past SQL_API_SQLFETCHSCROLL.

      Scope note: this BD covers SQLCancelHandle only. SQL_API_SQLCLOSECURSOR = 1003
      passes the same range guard (it is within range) and returns SQL_SUCCESS +
      SQL_TRUE on BOTH drivers under unixODBC — confirmed empirically in CI — so it
      is asserted with an ordinary (non-driver-conditional) test and is not part of
      this difference. An earlier revision of this entry also attributed a
      SQLCloseCursor SQL_ERROR to the new driver; that was unverified and is now
      known to be incorrect.
