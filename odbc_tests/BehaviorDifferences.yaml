  59:
    name: "SQLFreeHandle / SQLDisconnect / SQLCopyDesc do not abort or SegFault inside iODBC's handle-dispatch path"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The crashes are inside the old driver's per-handle cleanup hooks. The new driver coordinates with iODBC's alloc table correctly. The old driver path is not safely usable under iODBC for these calls because the process aborts before the caller can recover.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Under iODBC, calls into the old driver's handle hierarchy (SQLFreeHandle on an environment/connection with active children, double-free of statement/connection, complete-hierarchy cleanup, SQLDisconnect with multiple live statements, SQLCopyDesc with a NULL target) crash with "Subprocess aborted" or SIGSEGV inside the driver's per-handle cleanup callbacks. The same calls succeed under unixODBC (which uses a different dispatch model) and on Windows.
    new_driver_behavior: |
      The new driver participates correctly in iODBC's alloc table and either succeeds or surfaces the spec-mandated diagnostic. There is no process abort.
    description: |
      Applications that call into these paths through iODBC on the old driver lose the entire process to a SIGSEGV / abort before any diagnostic surfaces; the call site has no opportunity to react or clean up. The new driver completes the call or returns the spec diagnostic without crashing.
  60:
    #TODO: Add asserts before reviewing
    name: "SQLBindParameter SQL_C_INTERVAL_SECOND with fractional seconds bound to exact-numeric SQL targets truncates the fraction instead of overflowing"
    status: unknown
    type: enhancement
    reviewed: true
    status_rationale: |
      To be verified
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When a SQL_C_INTERVAL_SECOND value carrying a non-zero fractional-seconds component is bound (SQLBindParameter) to a variable-precision exact-numeric SQL target (SQL_DECIMAL / SQL_NUMERIC) with a declared column size, the reference driver rejects the bind at SQLExecute with SQL_ERROR and SQLSTATE 22015 (NativeError 40530, "Interval field overflow") rather than storing the integral seconds magnitude.
    new_driver_behavior: |
      Per ODBC Appendix D ("Converting Data from C to SQL Data Types" — truncation of interval values), the fractional-seconds component is truncated when the target is an exact-numeric type and the integral seconds magnitude is stored. The bind succeeds (SQL_SUCCESS). The same truncate-and-store contract holds for the integer SQL targets (SQL_TINYINT / SQL_SMALLINT / SQL_INTEGER / SQL_BIGINT).
    description: |
      Spec reference: ODBC Appendix D, "Converting Data from C to SQL Data Types" (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types). A single-field interval bound to an exact-numeric target carries the magnitude of its single datetime field; fractional seconds carried by SQL_C_INTERVAL_SECOND are truncated when the target is an exact integer type.
      Applications binding fractional SQL_C_INTERVAL_SECOND values to DECIMAL/NUMERIC parameters get the spec-compliant truncate-and-store behavior on the new driver instead of a 22015 rejection.

  61:
    #TODO: Cleanup the BD as it seems to be mostly aligned
    name: "Returns spec-correct success codes and diagnostics under iODBC (SQL_NO_DATA for zero-row DML, SQL_SUCCESS for length-only queries, posts the SUCCESS_WITH_INFO / HY012 diag record, reports untruncated StringLength, honors explicit TextLength), instead of old-driver iODBC-only deviations"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under iODBC the old driver takes a handful of shortcuts on return codes, diagnostic posting, string-length reporting, and explicit-length handling. The new driver follows the spec.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the old driver deviates from the spec in the following ways:
        - Zero-row DML returns SQL_SUCCESS instead of the spec-mandated SQL_NO_DATA. SQLExecDirect / SQLExecute for a searched DELETE or UPDATE that matches zero rows returns SQL_SUCCESS; SQLRowCount correctly returns 0. Under unixODBC the old driver returns SQL_NO_DATA per the spec.
        - Length-only queries (NULL output / BufferLength=0) return SQL_SUCCESS_WITH_INFO (implicit truncation flag) instead of plain SQL_SUCCESS. Affected calls: SQLGetDescRec with all-NULL output pointers + BufferLength=0, SQLGetDescRec with a NULL name pointer but other fields requested, SQLGetCursorName with a NULL CursorName buffer, SQLNativeSql with a NULL OutStatementText buffer, SQLGetInfo with a NULL InfoValuePtr.
        - SUCCESS_WITH_INFO / HY012 leaves the diagnostic stack empty (the old driver's diag-record allocation is gated on the return code being SQL_ERROR / SQL_NO_DATA). SQLDriverConnect with a too-small OutConnectionString buffer returns SQL_SUCCESS_WITH_INFO but posts no 01004 record; SQLDriverConnect with an unrecognised attribute returns SQL_SUCCESS_WITH_INFO but posts no 01S00 record; SQLEndTran with an invalid completion type returns SQL_ERROR but posts no HY012 record.
        - StringLength on SUCCESS_WITH_INFO + 01004 truncations reports the *truncated* length (ODBC 2.x convention) instead of the *untruncated* length the caller needs to size a retry buffer (ODBC 3.x). Affected calls: SQLGetDescField (string truncation), SQLGetDescRec (Name truncation), SQLGetInfo (e.g. SQL_DRIVER_NAME with a small buffer). Additionally, SQLGetInfo's length-only query (NULL InfoValuePtr) reports the wide-byte count (sizeof(SQLWCHAR) * char_count, i.e. 4x on iODBC's UTF-32) while the with-buffer call reports the narrow-byte write count, so the two values disagree by the SQLWCHAR width factor.
        - SQLNativeSql ignores an explicit TextLength1=0 and treats the input as NUL-terminated, copying the input string verbatim into the output (so a "SELECT 1" input with TextLength1=0 produces "SELECT 1" / outLen=8 instead of "" / outLen=0). The new driver honours the explicit zero length.
    new_driver_behavior: |
      On both DMs: SQLExecDirect / SQLExecute return SQL_NO_DATA for zero-row DML; length-only queries (SQLGetDescRec, SQLGetCursorName, SQLNativeSql) return plain SQL_SUCCESS; SUCCESS_WITH_INFO / HY012 paths post the spec-mandated 01004 / 01S00 / HY012 diagnostic record; truncated SQLGetDescField / SQLGetDescRec calls report the untruncated StringLength; SQLNativeSql honours explicit TextLength1.
      SQLGetInfo exception under iODBC only: SQLGetInfo (e.g. SQL_DRIVER_NAME) is fixed under unixODBC / Windows (plain SQL_SUCCESS on the length-only NULL-buffer probe, untruncated StringLength on a too-small buffer) but NOT under iODBC. Under iODBC its own ANSI entry point re-marshals the driver's response: it recomputes StringLength from the truncated write and reports the length-only NULL-buffer probe as an implicit SQL_SUCCESS_WITH_INFO truncation in wide-byte units (sizeof(SQLWCHAR) * char_count). This is an iODBC DM artifact, not a driver behavior: it holds identically for both the old and the new driver under iODBC (confirmed — the old-driver reference iODBC job and the new-driver iODBC job produce the same truncated-length / SUCCESS_WITH_INFO values), so it is not gated on driver identity.
    description: |
      Applications running against the old driver under iODBC see SQL_SUCCESS where the spec mandates SQL_NO_DATA on zero-row DML, SQL_SUCCESS_WITH_INFO where the spec mandates SQL_SUCCESS on length-only queries, an empty diagnostic stack on SUCCESS_WITH_INFO / HY012 returns, a truncated StringLength that cannot be used to size a retry buffer, and ignored explicit zero-length SQLNativeSql inputs. The new driver returns spec values for all of these EXCEPT SQLGetInfo's length-only / truncated-buffer semantics under iODBC, which remain governed by iODBC's own marshalling (identical for both drivers, see the SQLGetInfo tests' plain IODBC_ONLY branches) rather than by the driver.
  62:
    #TODO: To be checked after implementing complete ODBC API
    name: "iODBC's DM dispatches the new driver and the old driver along different paths (driver-cap dependent), so identical calls return different return codes / SQLSTATEs under iODBC"
    status: todo
    type: enhancement
    reviewed: true
    status_rationale: |
      iODBC's DM consults each driver's claimed ODBC version and reported function bitmap to decide whether to short-circuit a call from its own static tables, intercept a parameter validation up-front, or forward the call to the driver. Because the old driver and the new driver advertise different capabilities, iODBC takes different paths for identical calls and the surfaced return code / SQLSTATE differs accordingly. This is intrinsic to iODBC's dispatch model and not addressable from the driver side.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the DM takes the following paths for the old driver:
        - SQLColumnPrivileges with a NULL TableName is forwarded to the old driver, which submits the call to the backend and surfaces SQL_ERROR from the backend diagnostic.
        - SQLGetInfo(SQL_DATA_SOURCE_NAME) is answered by the old driver with an empty string + SQL_SUCCESS (nameLen=0).
        - SQLGetFunctions(FunctionId=<out-of-range>) is answered by the old driver from its static function table with SQL_SUCCESS + supported=SQL_FALSE (no range check).
        - SQLGetData on a cursor positioned past the end of the result set surfaces SQL_ERROR with SQLSTATE 24000 (matching the unixODBC contract) because the old driver bypasses the iODBC DM's cursor-past-end short-circuit.
    new_driver_behavior: |
      Under iODBC the DM takes the following paths for the new driver:
        - SQLGetInfo(SQL_DATA_SOURCE_NAME) is now implemented by the new driver itself (it reads
          the DSN name captured at connect time), and iODBC forwards the call through rather than
          short-circuiting it, so the call succeeds with the actual DSN name (matching the
          unixODBC/Windows behavior) instead of the SQL_ERROR the new driver previously surfaced
          while the InfoType was unimplemented.
        - SQLGetData on a cursor positioned past the end of the result set returns SQL_NO_DATA without consulting the driver layer (iODBC DM short-circuits the post-end fetch per its own convention).
    description: |
      Applications receive different return codes / SQLSTATEs for identical calls depending on driver, even though the underlying state of the connection / statement / cursor is the same. The new driver follows what iODBC's DM mandates; the old driver bypasses several of the DM intercepts.
      Note on SQLGetInfo with an invalid (out-of-range) InfoType: the new driver returns the spec-mandated HY096 on every DM (Windows, iODBC, and unixODBC all forward the driver's SQLSTATE unchanged — confirmed by CI). The old driver returns HY096 under iODBC and Windows but a generic HY000 under unixODBC (confirmed by the reference/old-driver CI job). This is therefore a genuine driver behavior difference under unixODBC (new = spec-correct HY096, old = HY000), not a DM interception artifact. See `odbc/src/api/error.rs`'s `UnknownInfoType` mapping and the `SQLGetInfo: HY096/HY000 - Invalid InfoType` test's driver-gated unixODBC branch.
  63:
    name: "SQLBrowseConnect short-circuits with SQL_ERROR under iODBC instead of returning SQL_NEED_DATA for the iterative protocol"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      The Snowflake connection model expects a complete connection string up front; the new driver therefore rejects partial input with SQL_ERROR. The old driver under iODBC happens to implement the iterative SQLBrowseConnect protocol and returns SQL_NEED_DATA with a prompt for the next required attribute.
