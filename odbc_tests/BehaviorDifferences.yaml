# Allowed statuses:
#  - unknown (default): status is not yet determined
#  - todo: BD has to be fixed
#  - fixed: BD has been addressed, removing the difference between the old and new driver
#  - allowed: the change is expected and is accepted
#
# Allowed types:
#  - unknown (default): type is not yet determined
#  - api_incompatibility: the new driver removes support for a functionality
#  - bug: the new driver has a bug/incompatibility relative to the old driver
#  - bugfix: the new driver fixes incorrect old-driver behavior (e.g. non-compliance with the ODBC specification)
#  - enhancement: the new driver extends or improves existing functionality
#
# Reviewed:
#  - true: the BD has been reviewed and its status is accepted
#  - false (default): the BD has not yet been reviewed
#
# status_rationale (required when reviewed is true):
#  Explain why this entry has the chosen 'status'. Type and behavior deltas alone often do not
#  imply whether we intend to ship the difference, regress compatibility, track a fix, etc.

behavior_differences:
  20:
    name: "SQLNumResultCols returns the correct column count instead of 0 after SQL_CLOSE on prepared statement"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. Now the caller receives the correct count of the columns for the prepared statement even after closing the cursor.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After Prepare -> Execute -> SQL_CLOSE, SQLNumResultCols returns 0. The old driver does not preserve prepared statement metadata across SQL_CLOSE.
    new_driver_behavior: |
      Returns the correct column count (e.g. 3 for "SELECT 1, 2, 3") because SQL_CLOSE transitions the statement back to the Prepared state (S2/S3) where column metadata is available, per the ODBC specification.
    description: |
      Spec reference: ODBC Statement Transitions table, SQLFreeStmt row (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/statement-transitions#sqlfreestmt) states that SQL_CLOSE from S4-S7 with [p] (prepared) transitions to S2/S3. SQLNumResultCols is defined to succeed in states S2-S12.
      Applications that rely on SQLNumResultCols after SQL_CLOSE on a prepared statement will now receive the correct count.

  21:
    name: "SQLDescribeCol returns SQL_SUCCESS with correct name and type instead of failing after SQL_CLOSE on prepared statement"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. Now the caller receives the correct column metadata.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After Prepare -> Execute -> SQL_CLOSE, SQLDescribeCol returns SQL_ERROR. The old driver does not preserve prepared statement metadata across SQL_CLOSE.
    new_driver_behavior: |
      Returns SQL_SUCCESS with correct column name and type because SQL_CLOSE transitions the statement back to the Prepared state (S2/S3) where column metadata is available, per the ODBC specification.
    description: |
      Spec reference: ODBC Statement Transitions table, SQLFreeStmt row (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/statement-transitions#sqlfreestmt) states that SQL_CLOSE from S4-S7 with [p] (prepared) transitions to S2/S3. SQLDescribeCol is defined to succeed in states S2-S12 (prepared or executed).
      Applications that call SQLDescribeCol after SQL_CLOSE on a prepared statement will now receive valid metadata instead of an error.

  25:
    name: "SQLRowCount with null RowCountPtr returns SQL_ERROR (HY009) instead of SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Row count returns only the amount of rows modified. Calling it with nullptr makes no sense.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When SQLRowCount is called with a null RowCountPtr after executing a statement, the old driver returns SQL_SUCCESS and silently ignores the null pointer.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE HY009 (Invalid use of null pointer).
    description: |
      Although HY009 is not explicitly listed in the SQLRowCount diagnostics table, it is the standard ODBC SQLSTATE for null pointer arguments and is consistent with the driver's defensive validation.
      Applications that accidentally pass nullptr to SQLRowCount will now receive an error instead of silent success.

  27:
    name: "Unbound parameter marker returns SQL_ERROR (42000) server error instead of SQL_ERROR (07002) COUNT field incorrect"
    status: fixed
    type: enhancement
    reviewed: true
    status_rationale: |
      Originally the new driver forwarded unbound-marker execution of a prepared statement to the server, which returned 42000 ("Bind variable ? not set"). Auto-IPD (PR #722) reversed this for prepared statements: the IPD is populated from the server-reported parameter count at SQLPrepare and the APD binding count is validated locally at SQLExecute, so the driver now returns 07002 (COUNT field incorrect) identically to the legacy driver. The old-vs-new delta for the prepared-statement case no longer exists, so this entry is now status: fixed. No BD#27 compatibility marker is needed — the shared behavior is asserted with a plain 07002 check in odbc_tests/tests/e2e/query/sql_bind_parameter.cpp.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After SQL_RESET_PARAMS, executing a prepared statement with unbound parameter markers returns SQL_ERROR with SQLSTATE 07002 (COUNT field incorrect), caught locally by the driver.
    new_driver_behavior: |
      After SQL_RESET_PARAMS, a prepared statement with unbound parameter markers returns SQL_ERROR with SQLSTATE 07002 (COUNT field incorrect), validated locally against the IPD. SQLExecDirect with unbound markers returns server-side 42000 ("Bind variable ? not set").

  28:
    name: "SQLGetDescField on empty IPD returns SQL_NO_DATA instead of SQL_ERROR"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC spec compliance fix.
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      Querying a record field on an empty IPD (no parameters bound, no prepare) returns SQL_ERROR.
    new_driver_behavior: |
      Querying a record field on an empty IPD (no parameters bound, no prepare) returns SQL_NO_DATA.
    description: |
      Per the ODBC spec, "SQL_NO_DATA is returned if RecNumber is greater than the current number of descriptor records."

  31:
    name: "SQLExecDirect/SQLExecute return 24000 when cursor is already open"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      No delta exists: the reference (old) driver returns SQLSTATE 24000 on a cursor-already-open re-execute, the same as the new driver. Confirmed by the odbc_tests_reference CI job — the sibling cases "SQLExecute returns 24000 when cursor is not closed before re-execute of SELECT", "SQLPrepare with cursor already open returns 24000", and SQLColumns/SQLColumnPrivileges "24000 - Cursor already open" all PASS on the old driver. The original old_driver_behavior recorded below ("silently overwrites and re-executes") was not reproducible against the reference driver and appears to have been described incorrectly. Both drivers are ODBC 3.x compliant on this path, so there is nothing to gate on driver identity; the behavior is asserted with a plain unconditional 24000 check in odbc_tests/tests/odbc-api/submitting_request/exec_direct_tests.cpp (no BD marker, per ud-fixed-bd-must-have-no-test-marker).
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      CORRECTION: the reference driver returns SQL_ERROR with SQLSTATE 24000 (Invalid cursor state), the same as the new driver. (The previously recorded claim that SQLExecDirect/SQLExecute silently overwrite the statement state and allow re-execution without closing the cursor first was not reproducible against the reference driver used in CI and is retracted.)
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 24000 (Invalid cursor state) per the ODBC 3.x specification. Applications must call SQLFreeStmt(SQL_CLOSE) or SQLCloseCursor before re-executing on a statement that already has an open cursor from a previous SELECT or catalog function.
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlexecdirect-function
      Both the old and new drivers enforce 24000 on cursor-already-open, so applications see no behavior change on this path.

  32:
    name: "Async cancel does interrupt in-progress operations instead of waiting for completion"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Old driver did not support the SQLCancel for the in-progress async operations. The new driver properly cancels such queries.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Supports SQL_ATTR_ASYNC_ENABLE (SQLSetStmtAttr succeeds), but SQLCancel during async polling does not actually interrupt the in-progress operation. Subsequent polling continues to return SQL_STILL_EXECUTING indefinitely or until the query completes naturally, rather than returning SQL_ERROR with HY008.
    new_driver_behavior: |
      SQLCancel on an async statement sends a cancel request to the server, and subsequent polling returns SQL_ERROR with SQLSTATE HY008 ("Operation canceled") once the cancellation is acknowledged.
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlcancel-function
      Applications that rely on SQLCancel to abort long-running async queries will not get timely cancellation on the old driver. The query may run to completion despite the cancel request.

      Test coverage note: the async-cancel tests keep SKIP_OLD_DRIVER("BD#32") rather than a paired
      OLD_DRIVER_ONLY assertion. Because the old driver never interrupts, observing its terminal state
      would require the long probe query (TIMELIMIT => 30s) to run to natural completion, which collides
      with the tests' 30s poll ceiling (kMaxPollIterations * kPollInterval) and would be flaky. The old
      driver simply cannot demonstrate the cancellation this behavior asserts.

  45:
    name: "SQLGetFunctions does report SQLCancelHandle as supported"
    status: fixed
    type: bug
    reviewed: true
    is_breaking_change: false
    status_rationale: |
      Both drivers report SQLCancelHandle in the ODBC3 SQLGetFunctions bitmap.
    impact: low
    old_driver_behavior: |
      SQLGetFunctions(SQL_API_ODBC3_ALL_FUNCTIONS) reports SQLCancelHandle
      as supported.
    new_driver_behavior: |
      SQLGetFunctions(SQL_API_ODBC3_ALL_FUNCTIONS) reports SQLCancelHandle
      as supported.
    description: |
      SQLCancelHandle is implemented on both drivers. The ODBC3 bitmap lists
      it. Asking SQLGetFunctions for function id 1022 by itself is a Driver
      Manager limitation (BD#120).
  47:
    name: "Cross-thread SQLCancel/SQLCancelHandle always returns SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is an implementation bug in the old driver due to missing try/catch in the cancel implementation.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When SQLCancel or SQLCancelHandle is called from a different thread to cancel an in-progress SQLExecDirect, the cancel function intermittently returns SQL_ERROR with SQLSTATE HY008 (NativeError 604, "SQL execution canceled") instead of SQL_SUCCESS. This happens because the driver's internal CancelExecute() calls Statement::cancel() without a try-catch. When the server's abort-request endpoint responds with a non-success status (e.g. the query was already canceled before the REST abort completed), cancel() throws and the exception propagates to the caller.

      The diagnostic record posted alongside that SQL_ERROR is also unreliable. The exception path may unwind without populating the diag list, and the in-flight SQLExecDirect on the executor thread concurrently clears the per-statement diag list at entry and posts its own HY008 at exit. A snapshot of the diag list taken on the canceling thread immediately after the cancel returns may therefore be empty, contain a single HY008 from the executor's completed SQLExecDirect, or contain a single HY008 posted by the cancel itself, depending on thread scheduling.
    new_driver_behavior: |
      Cross-thread SQLCancel and SQLCancelHandle always return SQL_SUCCESS per the ODBC specification. The cancel function posts no diagnostics of its own; only the canceled function (SQLExecDirect) returns SQL_ERROR with HY008.
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlcancel-function — "When SQLCancel is successfully called to cancel a function running in another thread, the driver does not post SQL_ERROR with SQLSTATE HY008."
      Applications that check the return code of SQLCancel/SQLCancelHandle in multi-threaded scenarios may see intermittent SQL_ERROR on the old driver. The cancellation itself still takes effect (the executing function returns HY008), so the functional impact is limited to the cancel call's return code.

  53:
    name: "SQLGetStmtAttr/SQLGetConnectAttr with negative buffer length returns SQL_ERROR (HY090) instead of SQL_ERROR (HY000)"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Now the ODBC returns a better state that describes what actually happened instead of vague general error.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE HY000 (General error) on Windows when BufferLength is negative for a string attribute.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE HY090 (Invalid string or buffer length) per the ODBC specification.
    description: |
      Applications checking for SQLSTATE HY090 specifically on Windows will now receive it consistently.
  56:
    name: "SQL_SF_STMT_ATTR_LAST_QUERY_ID (SQLPrepare+SQLExecute path) and SQL_SF_STMT_ATTR_MULTI_STATEMENT_COUNT are only fully supported by the new driver"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The changes extends the API with SQL_SF_STMT_ATTR_MULTI_STATEMENT_COUNT and tightens SQL_SF_STMT_ATTR_LAST_QUERY_ID to what the user should actually expect.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      SQL_SF_STMT_ATTR_LAST_QUERY_ID: The old driver returns SQL_SUCCESS with an empty string before any execution and returns a valid query UUID after SQLExecDirect. However it does not populate the query ID after SQLPrepare+SQLExecute and does not return SQL_ERROR when the attribute is set (read-only violation is silently ignored).
      SQL_SF_STMT_ATTR_MULTI_STATEMENT_COUNT: The old driver does not implement this attribute. SQLGetStmtAttr returns an error or garbage. SQLSetStmtAttr silently accepts any value including invalid ones (e.g. -2) without error. The count is not forwarded to the server.
    new_driver_behavior: |
      SQL_SF_STMT_ATTR_LAST_QUERY_ID (read-only): returns empty string before any execution, a valid UUID after SQLExecDirect or SQLPrepare+SQLExecute, and SQL_ERROR with HY092 on any set attempt.
      SQL_SF_STMT_ATTR_MULTI_STATEMENT_COUNT: default -1 (auto-detect), supports set/get roundtrip for values -1 to 32767, returns SQL_ERROR with HY024 for values < -1, and forwards the count to the server enabling multi-statement result sets via SQLMoreResults.
    description: |
      Applications relying on SQL_SF_STMT_ATTR_LAST_QUERY_ID after SQLPrepare+SQLExecute or on SQL_SF_STMT_ATTR_MULTI_STATEMENT_COUNT must target the new driver. Basic last-query-id retrieval after SQLExecDirect works on both drivers.
  58:
    name: "SQLNumResultCols returns column count after async execute + cursor close"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: medium
    status_rationale: |
      This is an improvement compared to the old driver, as it follows the ODBC spec.
    old_driver_behavior: |
      After async SQLPrepare + async SQLExecute + SQLCloseCursor, SQLNumResultCols returns 0. The old driver loses the prepared state metadata after async execution completes and the cursor is closed.
    new_driver_behavior: |
      After async SQLPrepare + async SQLExecute + SQLCloseCursor, SQLNumResultCols returns the column count from the prepare phase. The statement correctly transitions back to Prepared state (S3) per the ODBC spec state transition table.
    description: |
      Applications that call SQLNumResultCols after closing a cursor on a prepared statement will get the correct column count on the new driver. This matches the ODBC spec: SQLCloseCursor from S5 should return to S3 (Prepared).
  59:
    name: "SQLFreeHandle on leftover child statements after SQLDisconnect does not SIGSEGV under iODBC"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      After SQLDisconnect the old driver leaves child statements in iODBC's alloc
      table (BD#68). A follow-up SQLFreeHandle(STMT) on that leftover handle, then
      freeing the DBC, SIGSEGVs inside the old driver's per-statement cleanup.
      The new driver invalidates the child entries on disconnect (BD#68), so this
      abort path is not reachable. Distinct from iODBC DM aborts that hit both
      drivers (rejected HY010 frees, ENV/DBC hierarchy, SQLCopyDesc with a null
      target, double-free of a DBC) and from BD#126 (statement double-free returns
      SQL_ERROR + HY000, no abort).
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Under iODBC, SQLDisconnect succeeds but leaves child statement handles in the
      DM alloc table. SQLFreeHandle(SQL_HANDLE_STMT) on a leftover child does not
      return SQL_INVALID_HANDLE; when that was the last remaining child, subsequent
      DBC teardown SIGSEGVs inside the old driver's cleanup. unixODBC and Windows
      do not abort.
    new_driver_behavior: |
      SQLDisconnect invalidates child statement entries in iODBC's alloc table
      (BD#68). A follow-up SQLFreeHandle on those handles returns SQL_INVALID_HANDLE
      and the process does not abort.
    description: |
      Applications that disconnect under iODBC on the old driver and then free the
      leftover statement handles (or let DBC teardown run after probing them) can
      lose the process to a SIGSEGV. The new driver returns SQL_INVALID_HANDLE
      without crashing. Other iODBC aborts (HY010 free-while-connected, free ENV
      with a live DBC, SQLCopyDesc null target, double-free DBC) still fire for
      both drivers and are skipped with SKIP_IODBC, not this BD.

  61:
    name: "Returns spec-correct success codes and diagnostics under iODBC (SQL_NO_DATA for zero-row DML, SQL_SUCCESS for length-only queries, posts the SUCCESS_WITH_INFO / HY012 diag record, reports untruncated StringLength, honors explicit TextLength), instead of old-driver iODBC-only deviations"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under iODBC 3.x takes a handful of shortcuts on return codes, diagnostic posting, string-length reporting, and explicit-length handling. 4.x follows the spec.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC 3.x deviates from the spec in the following ways:
        - Zero-row DML returns SQL_SUCCESS instead of the spec-mandated SQL_NO_DATA. SQLExecDirect / SQLExecute for a searched DELETE or UPDATE that matches zero rows returns SQL_SUCCESS; SQLRowCount correctly returns 0. Under unixODBC 3.x returns SQL_NO_DATA per the spec.
        - Length-only queries (NULL output / BufferLength=0) return SQL_SUCCESS_WITH_INFO (implicit truncation flag) instead of plain SQL_SUCCESS. Affected calls: SQLGetDescRec with all-NULL output pointers + BufferLength=0, SQLGetDescRec with a NULL name pointer but other fields requested, SQLGetCursorName with a NULL CursorName buffer, SQLNativeSql with a NULL OutStatementText buffer, SQLGetInfo with a NULL InfoValuePtr.
        - SUCCESS_WITH_INFO / HY012 leaves the diagnostic stack empty (3.x's diag-record allocation is gated on the return code being SQL_ERROR / SQL_NO_DATA). SQLDriverConnect with a too-small OutConnectionString buffer returns SQL_SUCCESS_WITH_INFO but posts no 01004 record; SQLDriverConnect with an unrecognised attribute returns SQL_SUCCESS_WITH_INFO but posts no 01S00 record; SQLEndTran with an invalid completion type returns SQL_ERROR but posts no HY012 record.
        - StringLength on SUCCESS_WITH_INFO + 01004 truncations reports the *truncated* length (ODBC 2.x convention) instead of the *untruncated* length the caller needs to size a retry buffer (ODBC 3.x). Affected calls: SQLGetDescField (string truncation), SQLGetDescRec (Name truncation), SQLGetInfo (e.g. SQL_DRIVER_NAME with a small buffer). Additionally, SQLGetInfo's length-only query (NULL InfoValuePtr) reports the wide-byte count (sizeof(SQLWCHAR) * char_count, i.e. 4x on iODBC's UTF-32) while the with-buffer call reports the narrow-byte write count, so the two values disagree by the SQLWCHAR width factor.
        - SQLNativeSql ignores an explicit TextLength1=0 and treats the input as NUL-terminated, copying the input string verbatim into the output (so a "SELECT 1" input with TextLength1=0 produces "SELECT 1" / outLen=8 instead of "" / outLen=0). 4.x honours the explicit zero length.
    new_driver_behavior: |
      On both DMs: SQLExecDirect / SQLExecute return SQL_NO_DATA for zero-row DML; length-only queries (SQLGetDescRec, SQLGetCursorName, SQLNativeSql) return plain SQL_SUCCESS; SUCCESS_WITH_INFO / HY012 paths post the spec-mandated 01004 / 01S00 / HY012 diagnostic record; truncated SQLGetDescField / SQLGetDescRec calls report the untruncated StringLength; SQLNativeSql honours explicit TextLength1.
      SQLGetInfo exception under iODBC only: SQLGetInfo (e.g. SQL_DRIVER_NAME) is fixed under unixODBC / Windows (plain SQL_SUCCESS on the length-only NULL-buffer probe, untruncated StringLength on a too-small buffer) but NOT under iODBC. Under iODBC its own ANSI entry point re-marshals the driver's response: it recomputes StringLength from the truncated write and reports the length-only NULL-buffer probe as an implicit SQL_SUCCESS_WITH_INFO truncation in wide-byte units (sizeof(SQLWCHAR) * char_count). This is an iODBC DM artifact, not a driver behavior: it holds identically for both 3.x and 4.x under iODBC (confirmed — the 3.x reference iODBC job and the 4.x iODBC job produce the same truncated-length / SUCCESS_WITH_INFO values), so it is not gated on driver identity.
    description: |
      Applications running against 3.x under iODBC see SQL_SUCCESS where the spec mandates SQL_NO_DATA on zero-row DML, SQL_SUCCESS_WITH_INFO where the spec mandates SQL_SUCCESS on length-only queries, an empty diagnostic stack on SUCCESS_WITH_INFO / HY012 returns, a truncated StringLength that cannot be used to size a retry buffer, and ignored explicit zero-length SQLNativeSql inputs. 4.x returns spec values for all of these EXCEPT SQLGetInfo's length-only / truncated-buffer semantics under iODBC, which remain governed by iODBC's own marshalling (identical for both drivers, see the SQLGetInfo tests' plain IODBC_ONLY branches) rather than by the driver.
  62:
    name: "iODBC's DM dispatches the new driver and the old driver along different paths (driver-cap dependent), so identical calls return different return codes / SQLSTATEs under iODBC"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      iODBC's DM picks a short-circuit, a parameter-validation intercept, or a
      driver forward from each driver's advertised ODBC version and function
      bitmap. The unixODBC HY096 vs HY000 InfoType difference is a separate
      spec-alignment we keep (4.x is correct).
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the DM takes the following paths for 3.x:
        - SQLColumnPrivileges with a NULL TableName is forwarded to 3.x, which submits the call to the backend and surfaces SQL_ERROR from the backend diagnostic.
        - SQLGetInfo(SQL_DATA_SOURCE_NAME) is answered by 3.x with an empty string + SQL_SUCCESS (nameLen=0).
        - SQLGetFunctions(FunctionId=<out-of-range>) is answered by 3.x from its static function table with SQL_SUCCESS + supported=SQL_FALSE (no range check).
        - SQLGetData on a cursor positioned past the end of the result set surfaces SQL_ERROR with SQLSTATE 24000 (matching the unixODBC contract) because 3.x bypasses the iODBC DM's cursor-past-end short-circuit.
    new_driver_behavior: |
      Under iODBC the DM takes the following paths for 4.x:
        - SQLGetInfo(SQL_DATA_SOURCE_NAME) is now implemented by 4.x itself (it reads
          the DSN name captured at connect time), and iODBC forwards the call through rather than
          short-circuiting it, so the call succeeds with the actual DSN name (matching the
          unixODBC/Windows behavior) instead of the SQL_ERROR 4.x previously surfaced
          while the InfoType was unimplemented.
        - SQLGetData on a cursor positioned past the end of the result set returns SQL_NO_DATA without consulting the driver layer (iODBC DM short-circuits the post-end fetch per its own convention).
    description: |
      Applications receive different return codes / SQLSTATEs for identical calls depending on driver, even though the underlying state of the connection / statement / cursor is the same. 4.x follows what iODBC's DM mandates; 3.x bypasses several of the DM intercepts.
      Note on SQLGetInfo with an invalid (out-of-range) InfoType: 4.x returns the spec-mandated HY096 on every DM (Windows, iODBC, and unixODBC all forward the driver's SQLSTATE unchanged — confirmed by CI). 3.x returns HY096 under iODBC and Windows but a generic HY000 under unixODBC (confirmed by the 3.x reference iODBC job). This is therefore a genuine driver behavior difference under unixODBC (4.x = spec-correct HY096, 3.x = HY000), not a DM interception artifact. See `odbc/src/api/error.rs`'s `UnknownInfoType` mapping and the `SQLGetInfo: HY096/HY000 - Invalid InfoType` test's driver-gated unixODBC branch.
  63:
    name: "SQLBrowseConnect short-circuits with SQL_ERROR under iODBC instead of returning SQL_NEED_DATA for the iterative protocol"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      4.x now returns SQL_NEED_DATA for a browse string that names no
      account/host/server, reports a nonzero output length, and leaves the
      output buffer unchanged, matching 3.x under iODBC. The return does not
      depend on the driver manager. Under unixODBC the observable is still
      SQL_ERROR because that DM rejects an unregistered DRIVER= path with
      IM002 before the driver is loaded, as it does for 3.x.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      Under iODBC, SQLBrowseConnect("DRIVER={Snowflake}") returns
      SQL_NEED_DATA and reports a nonzero output length, while leaving the
      supplied output buffer unchanged. Under unixODBC 3.x short-circuits with
      SQL_ERROR like 4.x.
    new_driver_behavior: |
      Under iODBC, SQLBrowseConnect("DRIVER={Snowflake}") returns
      SQL_NEED_DATA and reports a nonzero output length, while leaving the
      supplied output buffer unchanged. Under unixODBC the DM rejects the
      call with IM002 before reaching the driver, so SQL_ERROR still surfaces
      as it does for 3.x.
    description: |
      Regression fixed. iODBC applications that start SQLBrowseConnect with
      only DRIVER= receive SQL_NEED_DATA and can continue the iterative
      protocol, matching 3.x. unixODBC behavior is unchanged (SQL_ERROR from
      the driver manager).

  64:
    name: "Connection-attribute state flips synchronously after SQLDisconnect under iODBC: SQL_ATTR_CONNECTION_DEAD reports SQL_CD_TRUE and reads of other attrs surface SQL_ERROR, instead of stale cached values"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The old driver's connection-attribute cache outlives SQLDisconnect under iODBC: SQL_ATTR_CONNECTION_DEAD reports SQL_CD_FALSE (stale "alive") until the next failed round-trip, and SQLGetConnectAttr for other attrs (e.g. SQL_ATTR_CONNECTION_TIMEOUT) still returns SQL_SUCCESS from the DM-side cache. The new driver invalidates the cache on disconnect so the spec-mandated SQL_CD_TRUE / SQL_ERROR surfaces immediately.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Under iODBC, SQLGetConnectAttr(SQL_ATTR_CONNECTION_DEAD) after SQLDisconnect returns SQL_CD_FALSE (stale "connection is alive") instead of the spec-mandated SQL_CD_TRUE. SQLGetConnectAttr(SQL_ATTR_CONNECTION_TIMEOUT) after SQLDisconnect returns SQL_SUCCESS from the DM-side cache instead of the spec SQL_ERROR. Under unixODBC the old driver flips state synchronously.
    new_driver_behavior: |
      Invalidates the connection-attribute cache on SQLDisconnect on both DMs: SQL_ATTR_CONNECTION_DEAD reports SQL_CD_TRUE; SQLGetConnectAttr for cached attrs (e.g. SQL_ATTR_CONNECTION_TIMEOUT) returns SQL_ERROR.
    description: |
      Applications that poll SQL_ATTR_CONNECTION_DEAD on the old driver under iODBC see a stale SQL_CD_FALSE indefinitely after SQLDisconnect (until the next failed round-trip exposes the dead connection), and reads of other connection attributes succeed against stale cached values. The new driver invalidates the cache on disconnect so the spec-mandated SQL_CD_TRUE / SQL_ERROR surfaces immediately and disconnect is detectable through either attribute.
  65:
    name: "SQLGetFunctions reports SQL_API_SQLSETSCROLLOPTIONS / SQL_API_SQLPARAMOPTIONS as supported under iODBC instead of omitting them from the bitmap"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      The old driver's ODBC 2.x function bitmap loses two entry points (SQLSetScrollOptions, SQLParamOptions) when running through iODBC because the underlying functions are not exported through iODBC's dispatch. The new driver reports both as supported on both DMs (matching the Windows DM exclusion of SetScrollOptions already documented for the bitmap).
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Under iODBC, SQLGetFunctions(SQL_API_ODBC3_ALL_FUNCTIONS) and SQLGetFunctions(SQL_API_ALL_FUNCTIONS) omit SQL_API_SQLSETSCROLLOPTIONS and SQL_API_SQLPARAMOPTIONS bits from the returned bitmap. The per-function inventory also omits SQL_API_SQLSETSCROLLOPTIONS.
    new_driver_behavior: |
      Reports both entry points as supported on both DMs.
    description: |
      Applications that probe SQLGetFunctions to feature-gate scroll-option calls will see broader api coverage.
  66:
    name: "SQLGetCursorName synthesizes the SQL_CUR-prefixed auto cursor name and persists user-supplied names across SQLCloseCursor under iODBC instead of returning SQL_ERROR"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      This is fixed and aligned between old and new driver.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Under iODBC, SQLGetCursorName on a fresh statement returns SQL_ERROR (no synthesized SQL_CUR-prefixed name); SQLGetCursorName after SQLCloseCursor on a previously-named cursor returns SQL_ERROR (name dropped). Under unixODBC the old driver synthesizes and persists the cursor name like the new driver.
    new_driver_behavior: |
      Synthesizes and persists cursor names on both DMs.
    description: |
      Applications that call SQLGetCursorName on a fresh statement, or after SQLCloseCursor on a previously-named cursor, receive SQL_ERROR from the old driver under iODBC. The new driver synthesizes the SQL_CUR-prefixed auto name and preserves user-supplied names across SQLCloseCursor.
  67:
    name: "SQLGetData converts DECFLOAT to SQL_C_WCHAR under iODBC instead of returning SQL_SUCCESS with SQL_NULL_DATA indicator and an untouched buffer"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      3.x under iODBC writes DECFLOAT as SQL_C_WCHAR but reports the
      indicator in UTF-16 byte units (2 for "0", 76 for a 38-digit
      value) rather than sizeof(SQLWCHAR). Truncation returns
      SQL_SUCCESS_WITH_INFO. 4.x converts to the DM's SQLWCHAR width
      on both DMs.
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      Under iODBC, SQLGetData on a DECFLOAT column with TargetType=SQL_C_WCHAR
      returns SQL_SUCCESS and writes a value, but the length indicator is
      the UTF-16 byte length (2 * character count), not
      sizeof(SQLWCHAR) * character count. A too-small buffer returns
      SQL_SUCCESS_WITH_INFO with indicator 76 for a 38-digit value.
      Under unixODBC 3.x converts DECFLOAT to SQL_C_WCHAR with the DM
      SQLWCHAR width.
    new_driver_behavior: |
      Converts DECFLOAT to SQL_C_WCHAR using the DM SQLWCHAR width on
      both DMs. Truncation returns SQL_SUCCESS_WITH_INFO with
      indicator 38 * sizeof(SQLWCHAR) and SQLSTATE 01004.
    description: |
      Applications that read the SQL_C_WCHAR indicator under iODBC
      against 3.x see UTF-16 byte lengths. 4.x reports
      sizeof(SQLWCHAR) units.
  68:
    name: "Child statement handles are invalidated through iODBC's alloc table on SQLDisconnect / SQLFreeStmt(SQL_DROP), so a subsequent SQLFreeHandle on the orphaned handle returns the spec SQL_INVALID_HANDLE instead of leaking as SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under iODBC the old driver does not coordinate with the DM's per-handle alloc table when it releases child statements: SQLDisconnect (with or without active statements) and SQLFreeStmt(SQL_DROP) report SQL_SUCCESS to the caller but leave the statement entry in iODBC's alloc table, so a subsequent SQLFreeHandle(SQL_HANDLE_STMT) still returns SQL_SUCCESS instead of the spec-mandated SQL_INVALID_HANDLE. The handle remains addressable for the rest of the process. The new driver participates correctly in iODBC's alloc table; the same calls invalidate the child statement entries and the follow-up SQLFreeHandle surfaces SQL_INVALID_HANDLE on both DMs.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the old driver leaves statement handles in iODBC's alloc table after release in three scenarios:
        - SQLDisconnect with a child statement still attached -> SQLFreeHandle(SQL_HANDLE_STMT) on the child after disconnect returns SQL_SUCCESS instead of SQL_INVALID_HANDLE.
        - SQLDisconnect while an active result set is still open on a child statement -> same outcome: SQLFreeHandle on the child returns SQL_SUCCESS.
        - SQLFreeStmt(SQL_DROP) on a statement handle -> SQLFreeHandle(SQL_HANDLE_STMT) afterwards returns SQL_SUCCESS instead of SQL_INVALID_HANDLE; the handle leaks for the rest of the test/session.
      Under unixODBC the old driver returns SQL_INVALID_HANDLE on the follow-up SQLFreeHandle in each of the three scenarios.
    new_driver_behavior: |
      The new driver invalidates child statement entries in iODBC's alloc table when SQLDisconnect or SQLFreeStmt(SQL_DROP) releases them, so the follow-up SQLFreeHandle on the orphaned handle returns SQL_INVALID_HANDLE on both DMs.
    description: |
      Applications that release child statements via SQLDisconnect or SQLFreeStmt(SQL_DROP) on the old driver under iODBC cannot detect the release through SQLFreeHandle's return code; the handle keeps reporting as valid and leaks until process exit. The new driver returns the spec-mandated SQL_INVALID_HANDLE so callers can detect the release and reuse / abandon the handle correctly.
  69:
    name: "SQLGetDescField / SQLSetDescField return SQL_ERROR + HY010 during SQL_NEED_DATA under iODBC instead of silently succeeding"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The ODBC spec requires SQL_ERROR + HY010 when SQLGetDescField / SQLSetDescField is called on an ARD/IRD whose parent statement is in SQL_NEED_DATA. The new driver enforces the state check on every DM and posts the HY010 diagnostic record on the descriptor handle, so SQLGetDiagRec(SQL_HANDLE_DESC, ...) returns the spec-mandated record. The old driver bypasses this state check under iODBC and silently returns SQL_SUCCESS (under unixODBC and Windows DM the old driver enforces it correctly). The spec-compliant new behavior is accepted.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the SQL_NEED_DATA state check is not applied to descriptor entry points reached through the implicit ARD/IRD of the statement: SQLGetDescField and SQLSetDescField return SQL_SUCCESS while the statement is in SQL_NEED_DATA. Under unixODBC and Windows DM the old driver enforces the check and returns SQL_ERROR + HY010.
    new_driver_behavior: |
      Enforces the SQL_NEED_DATA state check for descriptor entry points and posts the HY010 diagnostic record on the descriptor handle on every DM (unixODBC, iODBC, Windows). SQLGetDescField / SQLSetDescField return SQL_ERROR and SQLGetDiagRec(SQL_HANDLE_DESC, ...) returns the spec-mandated record.
    description: |
      Applications that issue descriptor calls while a statement is in SQL_NEED_DATA now receive the spec-mandated SQL_ERROR + HY010 from the new driver under iODBC instead of an apparent SQL_SUCCESS. Callers can detect the invalid state and recover (e.g. by cancelling and re-driving the DAE sequence). SQLCopyDesc is not implemented by the new driver (the affected test skips via SKIP_NEW_DRIVER_NOT_IMPLEMENTED) and is not in scope for this BD.
  70:
    name: "Returns spec-correct ODBC 3.x SQLSTATEs (HY090 / HY010 / HY017 / HY092 / 07009 / HY008) under iODBC via driver-side pre-validation, instead of vendor HY000 / ODBC 2.x aliases / bare SQL_INVALID_HANDLE / extra diagnostic record"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      iODBC's DM pre-processes string-length parameters, tracks per-statement state (prepared / executed / NEED_DATA / async-busy), and validates handle types at the dispatch layer. For the old driver, that pre-processing either reshapes args into a form the driver's spec-SQLSTATE validator no longer recognises (so the driver falls through to vendor HY000), or rejects the call with an ODBC 2.x SQLSTATE alias (S1010 / S1090 / S1093) / a bare SQL_INVALID_HANDLE / SQL_ERROR (no diagnostic record posted) before forwarding, or appends an extra S1010 record alongside the driver's spec record. The new driver validates the same conditions inside the driver before any iODBC re-shaping or dispatch-time check can fire, so the spec-mandated ODBC 3.x SQLSTATE surfaces as the sole diagnostic record on both DMs.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Under iODBC the old driver surfaces non-spec SQLSTATEs in the following buckets:
        - Negative-length / empty-string arguments -> vendor HY000 ("Snowflake][Support] (30020) Invalid argument") instead of HY090. Affected calls: SQLPrepare (zero / negative TextLength, empty SQL string), SQLExecDirect (zero / negative TextLength), SQLBindParameter (negative BufferLength), SQLNativeSql (negative BufferLength), SQLGetDescField / SQLSetDescField (negative BufferLength), and the SQLColumns / SQLPrimaryKeys / SQLForeignKeys / SQLProcedureColumns / SQLProcedures family (negative name-length args).
        - Function-sequence / parameter-number errors -> ODBC 2.x aliases instead of HY010 / HY090 / 07009 / HY008. Affected calls: SQLFetch / SQLEndTran after commit/rollback closes cursor (S1010), SQLEndTran during SQL_NEED_DATA (S1010), SQLGetCursorName / SQLSetCursorName during SQL_NEED_DATA (S1010), SQLDescribeParam on unprepared statement and ParameterNumber=0 (S1010 / S1093), SQLNumParams on unprepared statement (S1010), SQLExecute on unprepared statement (S1010), cross-thread SQLCancel on async-busy statement (S1010), SQLGetCursorName / SQLSetCursorName / SQLNativeSql with negative length (S1090), SQLBrowseConnect with negative length (S1090).
        - Handle-validation errors -> bare SQL_INVALID_HANDLE / SQL_ERROR with no diagnostic record. Affected calls: SQLEndTran called with SQL_HANDLE_STMT (spec: HY092), SQLFreeHandle on an implicit auto-allocated descriptor (spec: HY017), SQLFreeHandle called with a completely bogus HandleType (e.g. 999) (spec: SQL_INVALID_HANDLE).
        - Descriptor reads / mutations during SQL_NEED_DATA -> SQL_SUCCESS / SQL_NO_DATA instead of HY010. SQLGetDescRec on the ARD during SQL_NEED_DATA returns SQL_NO_DATA (it walks the ARD past the bound parameter, which actually lives on the IPD); SQLGetDescRec on the IRD returns the pre-execution IRD shape as SQL_SUCCESS; SQLSetDescRec on either descriptor returns SQL_SUCCESS silently; SQLCopyDesc into / out of either descriptor returns SQL_SUCCESS silently.
        - Diagnostic record stacking -> extra ODBC 2.x record appended alongside the driver's spec record. Cross-thread SQLCancel that collides with an in-flight SQLExecDirect leaves two diagnostic records on the statement handle ([0] iODBC's own S1010 from the function-sequence collision, [1] the driver's HY008 for the canceled exec) instead of the spec-mandated single HY008 record.
      Under unixODBC the same calls already surface the spec ODBC 3.x SQLSTATE as the sole record.
    new_driver_behavior: |
      Returns the spec ODBC 3.x SQLSTATE / return code as the sole diagnostic record on both DMs by validating the condition inside the driver before any iODBC re-shaping or dispatch-time check can fire.
    description: |
      Applications receive a proper state from the driver and a single spec-correct diagnostic record they can inspect for SQLSTATE / native code / message without having to scan past iODBC-side function-sequence artefacts.
  77:
    name: "SQLGetDiagRec/SQLGetDiagField MessageText appends an internal error trace by default"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Provides better visibility of errors. Can be disabled.
    old_driver_behavior: |
      `SQLGetDiagRec` / `SQLGetDiagField(SQL_DIAG_MESSAGE_TEXT)` return only the human-readable diagnostic message produced by the driver/server. No internal call-site trace is appended.
    new_driver_behavior: |
      `OdbcError::message_text()` appends the driver's internal `ErrorTrace` (file/line entries collected via the `error_trace` derive) to the user-facing diagnostic string by default. The behavior is gated by `error_trace_enabled` in `LoggingConfig`, which defaults to `true` (sf_core/src/logging/mod.rs:87). Setting `ErrorTraceEnabled=false` in `sf.odbc.ini` (parsed by `sf_core::config::logging_config_loader`) suppresses the appended trace and restores legacy-shaped messages.
    impact: medium
    is_breaking_change: true
    description: |
      Applications that match diagnostic message text against fixed substrings, or that surface `SQLGetDiagRec` output verbatim to end users / test oracles, will see additional trace content appended. Consumers that need the legacy shape must write `ErrorTraceEnabled=false` to `sf.odbc.ini` and point `SF_ODBC_INI` at it.

  78:
    name: "Stage-binding threshold comparison uses >= instead of >; arrayBindSupported and CLIENT_STAGE_ARRAY_BINDING_THRESHOLD session params are respected"
    status: allowed
    type: enhancement
    reviewed: true
    impact: medium
    is_breaking_change: true
    status_rationale: |
      Fixes a bug.
    old_driver_behavior: |
      The old driver reads the stage-bind threshold from the connection-string parameter
      `StageBindThreshold` (not from the SESSION parameter `CLIENT_STAGE_ARRAY_BINDING_THRESHOLD`).
      ALTER SESSION SET CLIENT_STAGE_ARRAY_BINDING_THRESHOLD has no effect on the old driver.
      The old driver does not implement the `arrayBindSupported` server hint: it always attempts
      stage binding for INSERT when cell count > threshold, regardless of the query shape.
    new_driver_behavior: |
      The new driver reads `CLIENT_STAGE_ARRAY_BINDING_THRESHOLD` from the session parameters
      returned by the server and applies a >= comparison (cells >= threshold). It also gates
      stage binding on the server-provided `arrayBindSupported` hint from the prepare response;
      when the server returns false (e.g. for bare SELECT, EXECUTE IMMEDIATE, multi-statement
      queries) the driver falls back to inline JSON even if the cell count crosses the threshold.
    description: |
      1. Applications relying on `StageBindThreshold` in the connection string must migrate to
         setting CLIENT_STAGE_ARRAY_BINDING_THRESHOLD via ALTER SESSION or account/role defaults.
      2. Query shapes where the server returns arrayBindSupported=false (SELECT, EXECUTE IMMEDIATE,
         multi-statement) that previously failed with "Bind variable ? not set." when stage binding
         was forced will now transparently fall back to inline JSON in the new driver.
      3. At the exact boundary (cells == threshold), the old driver used > and would take the JSON
         path; the new driver uses >= and takes the stage path. Applications sensitive to the
         boundary row count should be aware of this one-row difference in dispatch behavior.

  80:
    name: "SQLColAttribute properly supports ODBC 2.x field aliases through the 3.x function"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The old driver's inconsistent handling of 2.x identifiers is a bug; the new driver follows the spec's backward compatibility rules.
    old_driver_behavior: |
      When SQLColAttribute (ODBC 3.x) is called with ODBC 2.x field identifiers
      (SQL_COLUMN_NAME, SQL_COLUMN_TYPE, etc.), the old driver exhibits inconsistent
      behavior — returning empty strings, incorrect values, or HY091 errors
      depending on the identifier.
    new_driver_behavior: |
      Properly maps ODBC 2.x field identifiers to their SQL_DESC_* equivalents per
      the ODBC specification backward compatibility rules.
    is_breaking_change: false
    impact: low
    description: |
      Applications using ODBC 2.x field identifiers with the 3.x function will now
      receive correct values.

  86:
    name: "SQLCancel during data-at-execution discards accumulated SQLPutData"
    status: allowed
    type: bugfix
    reviewed: true
    impact: high
    status_rationale: |
      The cancel should clear all data.
    is_breaking_change: true
    old_driver_behavior: |
      When SQLCancel is called from S10 (PutDataCalled) during a data-at-execution sequence, the old driver retains accumulated SQLPutData data. If the application re-enters DAE and provides new data, the final parameter value is the concatenation of the old and new chunks.
    new_driver_behavior: |
      SQLCancel from any DAE state (S8/S9/S10) fully resets the pending operation, discarding all accumulated SQLPutData. On re-entry the parameter starts fresh, matching the ODBC 3.5 spec requirement that cancel aborts the pending operation.
    description: |
      Applications that cancel mid-DAE and retry will get clean parameter values instead of stale concatenated data.

  87:
    name: "SQLPrimaryKeys/SQLForeignKeys case-fold unquoted identifiers in identifier mode"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under SQL_ATTR_METADATA_ID=SQL_TRUE the catalog function arguments are identifiers, and per the
      ODBC specification an unquoted identifier is case-insensitive (only a double-quoted identifier
      preserves case). The universal driver folds unquoted catalog/schema/table identifiers to
      uppercase before building the SHOW scope and re-filtering, matching how Snowflake stores
      unquoted names. The legacy driver re-filters the SHOW result case-sensitively against the
      caller's raw (lowercase) argument, so a lowercase identifier matches nothing. Tracked under
      SNOW-3234772 (SQLPrimaryKeys) and SNOW-3234773 (SQLForeignKeys).
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE and a lowercase (unquoted) catalog/schema/table identifier,
      the legacy driver compares the identifier case-sensitively against the uppercase names returned
      by SHOW and drops every row, yielding an empty result set.
    new_driver_behavior: |
      Unquoted identifiers are folded to uppercase before the SHOW scope is built and before the
      client-side re-filter, so a lowercase identifier matches the uppercase stored name and the
      expected row(s) are returned. Double-quoted identifiers remain case-sensitive.
    description: |
      Applications that relied on the legacy case-sensitive behavior of unquoted identifiers under
      identifier mode will now get matches for differently-cased identifiers. The odbc-api tests
      split the assertion (NEW_DRIVER_ONLY expects the matched row, OLD_DRIVER_ONLY expects the
      legacy empty result set).

  88:
    name: "SQLForeignKeys resolves NULL FK catalog and schema from connection context"
    status: fixed
    type: bug
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      Default NULL-catalog handling now matches the 3.x driver. Catalog fill for
      SQLForeignKeys (and SQLPrimaryKeys) happens when UseCurrentCatalog is true or
      CLIENT_METADATA_REQUEST_USE_CONNECTION_CTX is enabled, not on every NULL catalog.
    old_driver_behavior: |
      When only FKTableName is supplied with NULL FKCatalogName and NULL FKSchemaName, the reference
      driver's result depends on UseCurrentCatalog and CLIENT_METADATA_REQUEST_USE_CONNECTION_CTX.
      With both disabled the catalog stays unconstrained. With UseCurrentCatalog=true (or CTX
      enabled) the FK_CHILD row is returned from the current database.
    new_driver_behavior: |
      The same knobs apply. UseCurrentCatalog defaults to false, matching the 3.x DSN
      parameter. Schema is still filled when a table name is supplied.
    description: |
      Restores the 3.x UseCurrentCatalog gate that 4.x had dropped (always filling catalog).

  89:
    name: "SQLForeignKeys metadata_id=TRUE allows NULL identifiers on the unspecified side"
    status: fixed
    type: bug
    reviewed: true
    is_breaking_change: true
    status_rationale: |
      Both drivers return HY009 for a NULL catalog, schema, or table pointer on
      either side in identifier mode.
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE, a single-sided query that leaves the
      unspecified side NULL returns HY009.
    new_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE, null-pointer validation applies to
      every catalog, schema, and table argument.
    description: |
      Both drivers now return HY009.

  90:
    name: "SQLForeignKeys treats an empty-string PK/FK table as absent for SHOW side selection"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      SQLForeignKeys chooses SHOW EXPORTED vs SHOW IMPORTED KEYS based on which side supplies a table
      name. The universal driver treats an empty-string table name the same as an absent (NULL) one,
      so an empty PKTableName with a populated FKTableName resolves to the FK side (SHOW IMPORTED KEYS
      scoped to the FK table), consistent with how build_show_in_scope treats empty identifiers as "no
      filter".
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With an empty-string PKTableName and a populated FKTableName, the legacy driver does not resolve
      the query to the FK side and returns an empty result set.
    new_driver_behavior: |
      An empty-string table name is treated as absent for side selection, so the query resolves to the
      side whose table name is populated (here the FK side) and returns the relationship row.
    description: |
      Callers that passed an empty PKTableName alongside a real FKTableName and relied on the legacy
      empty result set will now receive the FK relationship. The odbc-api test splits the assertion
      (NEW_DRIVER_ONLY expects the row, OLD_DRIVER_ONLY expects the legacy empty result set).

  91:
    name: "SQLProcedures/SQLProcedureColumns case-fold unquoted identifiers in identifier mode"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under SQL_ATTR_METADATA_ID=SQL_TRUE the catalog function arguments are identifiers, and per the
      ODBC specification an unquoted identifier is case-insensitive (only a double-quoted identifier
      preserves case). SQLProcedures and SQLProcedureColumns fold the unquoted
      catalog/schema/procedure identifiers (and, for SQLProcedureColumns, the column name) to
      uppercase (via catalog_arg_to_pattern) before filtering: the catalog/schema/procedure names
      feed the case-sensitive information_schema.procedures LIKE filter, and the SQLProcedureColumns
      column name feeds the case-sensitive client-side like_match against the (upper-folded) parsed
      column names. The legacy driver compares the caller's raw (lowercase) arguments
      case-sensitively, so a lowercase identifier matches nothing. Tracked under SNOW-3234774.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE and a lowercase (unquoted) catalog/schema/procedure/column
      identifier, the legacy driver matches case-sensitively against the uppercase stored names and
      drops every row, yielding an empty result set.
    new_driver_behavior: |
      Unquoted identifiers are folded to uppercase before the information_schema.procedures LIKE
      filter and (for SQLProcedureColumns) the client-side column-name match, so a lowercase
      identifier matches the uppercase stored name and the expected row(s) are returned. Double-quoted
      identifiers remain case-sensitive. In pattern mode (SQL_ATTR_METADATA_ID=SQL_FALSE, the default)
      names stay case-sensitive, matching the reference driver.
    description: |
      Applications that relied on the legacy case-sensitive behavior of unquoted identifiers under
      identifier mode will now get matches for differently-cased identifiers. The odbc-api tests
      split the assertion (NEW_DRIVER_ONLY expects the matched row, OLD_DRIVER_ONLY expects the
      legacy empty result set).
  96:
    name: "SQLSetStmtAttr(SQL_ATTR_CURSOR_TYPE) supports only SQL_CURSOR_FORWARD_ONLY, replacing any other value with that and returns SQL_SUCCESS_WITH_INFO/01S02"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      As the Snowflake does not support other cursors than forward-only, it is aligning the API with the Snowflake API.
    old_driver_behavior: |
      The old driver silently accepts non-forward-only cursor types (SQL_CURSOR_STATIC,
      SQL_CURSOR_DYNAMIC, SQL_CURSOR_KEYSET_DRIVEN) on SQL_ATTR_CURSOR_TYPE without warning.
      The stored value reflects whatever was requested, even though Snowflake only supports
      forward-only cursors.
    new_driver_behavior: |
      The new driver substitutes any unsupported cursor type with SQL_CURSOR_FORWARD_ONLY and
      returns SQL_SUCCESS_WITH_INFO / 01S02 ("option value changed"), per the ODBC spec requirement
      that drivers substitute unsupported values and report the substitution.
    description: |
      Applications that set a scrollable cursor type and then check the return code for exactly
      SQL_SUCCESS will see SQL_SUCCESS_WITH_INFO instead. Applications that read back
      SQL_ATTR_CURSOR_TYPE after setting it will see SQL_CURSOR_FORWARD_ONLY regardless of the
      requested type. This is spec-correct behavior.

  100:
    name: "SQLSetStmtAttr SQL_ATTR_PARAM_BIND_TYPE misaligned value accepted on all platforms"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The old driver on Linux x86_64 accepts a bind-type value of 10 (not 0 and not a multiple of
      alignof(SQLLEN)=8), but rejects it with S1000 on Linux aarch64 and macOS. The new driver
      accepts the misaligned value on all Unix platforms. The Windows DM intercepts the call before
      reaching the driver on Windows.

      Per the ODBC spec, the new driver is the more compliant side. SQL_ATTR_PARAM_BIND_TYPE is an
      SQLULEN value: 0 (SQL_PARAM_BIND_BY_COLUMN) selects column-wise binding, and any other value
      is interpreted as the byte length (stride) of the row-wise parameter-set structure. The spec
      imposes no alignment constraint on this length — it only advises applications to use
      sizeof(struct) so the stride lands on the next structure. 10 is therefore a legal stride, and
      the consequence of a too-small/misaligned value surfaces during SQLExecute address arithmetic
      (Address = Bound Address + ((Row - 1) * Structure Size) + Offset), not at SQLSetStmtAttr time.
      A driver that did reject a bad value here would use HY024 ("Invalid attribute value"); the old
      driver instead returns S1000 ("General error") and does so inconsistently across architectures,
      making its rejection an over-strict, non-standard implementation detail rather than
      spec-mandated behaviour. Ref:
      https://learn.microsoft.com/sql/odbc/reference/syntax/sqlsetstmtattr-function#statement-attributes
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQLSetStmtAttr(SQL_ATTR_PARAM_BIND_TYPE, 10) returns SQL_SUCCESS on Linux x86_64 but
      SQL_ERROR with SQLSTATE S1000 on Linux aarch64 and macOS. This platform-dependent alignment
      check (value must be 0 or divisible by alignof(SQLLEN)=8) is not required by the ODBC spec,
      and S1000 is not the documented SQLSTATE for an invalid attribute value (that would be HY024).
    new_driver_behavior: |
      SQLSetStmtAttr(SQL_ATTR_PARAM_BIND_TYPE, 10) returns SQL_SUCCESS on all Unix platforms, which
      matches the ODBC spec: any non-zero SQLULEN is a legal row-wise stride and is not validated for
      alignment at set time. The prepared_exec replay test gates the non-x86_64 assertion with
      OLD_DRIVER_ONLY/NEW_DRIVER_ONLY("BD#100").
    description: |
      Applications setting an unaligned bind-type value will no longer receive S1000 on
      non-x86_64 Unix platforms with the new driver. This is a spec-compliance improvement: the
      value is a byte-length stride with no alignment requirement, so accepting it at set time is
      correct; any addressing consequence of a bad stride still surfaces at SQLExecute time.

  102:
    name: "SQLSetStmtAttr(SQL_ROWSET_SIZE, 0) coerces to 1 instead of storing 0"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      Aligned with the ODBC specification: a rowset size of 0 is invalid and
      must return SQL_ERROR (HY024). unixODBC already rejects the value in the
      DM; iODBC and the Windows DM forward it, so the old-vs-new difference is
      visible only on those managers. SQL_ATTR_ROW_ARRAY_SIZE=0 still coerces
      to 1; that attribute is stored separately and has no test covering 0, so
      it is out of scope for this BD.
    old_driver_behavior: |
      When the DM forwards the call (iODBC, Windows), SQLSetStmtAttr(SQL_ROWSET_SIZE, 0)
      returns SQL_SUCCESS and stores 0 unchanged. unixODBC rejects 0 in the DM
      with SQL_ERROR before the driver is invoked.
    new_driver_behavior: |
      SQLSetStmtAttr(SQL_ROWSET_SIZE, 0) returns SQL_ERROR with SQLSTATE HY024
      on every DM, including those that forward the value. The stored rowset
      size is left unchanged.
    description: |
      SQL_ROWSET_SIZE (ODBC 2.x, attr 9) drives SQLExtendedFetch. A rowset size
      of 0 is invalid per the ODBC spec.

  110:
    name: "SQLGetDiagRec/SQLGetDiagField MessageText: new driver prepends the ODBC vendor prefix to server errors"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      The ODBC spec (§16.2.16) requires drivers to prepend [vendor][ODBC-component-identifier] to
      diagnostic message text. The new driver does so uniformly and, for data source-originated
      (server) errors, adds a third [data-source] segment ([Snowflake]) (SNOW-3235406), yielding the
      3-part [Snowflake][Snowflake ODBC Driver][Snowflake]. The old (SimbaEngine) driver only prefixes
      driver-originated errors (with [Snowflake][Support]) and passes server-originated error text
      through verbatim with no vendor prefix. The new driver's uniform, spec-compliant prefixing is
      intentional; the old driver's raw passthrough on server errors is the divergence.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      Diagnostic message text from SQLGetDiagRec / SQLGetDiagField(SQL_DIAG_MESSAGE_TEXT) for a data
      source-originated (server) error is the raw server message with no vendor prefix, e.g.
      "SQL compilation error: Object '...' does not exist or not authorized." The old driver's
      "[Snowflake][Support]" prefix (a SimbaEngine artefact) appears only on driver-originated errors.
    new_driver_behavior: |
      Diagnostic message text is prefixed with "[Snowflake][Snowflake ODBC Driver]" for
      driver-originated errors and the 3-part "[Snowflake][Snowflake ODBC Driver][Snowflake]" for data
      source-originated (server) errors, matching the §16.2.16 [vendor][component][data-source]
      structure. The component identifier now names the driver; the third [Snowflake] segment
      identifies the data source (SNOW-3235406).
    description: |
      Applications that pattern-match diagnostic message text against a leading "[Snowflake][Support]"
      prefix must update to "[Snowflake][Snowflake ODBC Driver]". For server (data source-originated)
      errors specifically, the old driver emits no vendor prefix at all -- it passes the raw server text
      through (e.g. "SQL compilation error: ...") -- whereas the new driver emits the 3-part
      "[Snowflake][Snowflake ODBC Driver][Snowflake]" prefix.

  111:
    name: "SQLCancelHandle(DBC) returns HY010 when an associated statement is mid-async or in data-at-execution"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      The ODBC 3.8 Diagnostics table requires HY010 (Function sequence error) in those cases.
    old_driver_behavior: |
      SQLCancelHandle(SQL_HANDLE_DBC) is a no-op that returns SQL_SUCCESS even when an associated
      statement is asynchronously executing (SQL_STILL_EXECUTING) or mid data-at-execution
      (SQL_NEED_DATA).
    new_driver_behavior: |
      SQLCancelHandle(SQL_HANDLE_DBC) returns SQL_ERROR with SQLSTATE HY010 when any associated
      statement is asynchronously executing or mid data-at-execution, matching the ODBC 3.8
      Diagnostics table. When no child statement is busy, DBC cancel remains a no-op returning
      SQL_SUCCESS (neither driver supports cancelable connection-level async operations).
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlcancelhandle-function
      — HY010 when "An asynchronously executing, statement-related function was called for one of
      the statement handles associated with the Handle, and HandleType was set to SQL_HANDLE_DBC"
      or when SQLBrowseConnect / streamed parameters leave the connection mid NEED_DATA / param
      data available. Applications that called SQLCancelHandle(DBC) during statement async/DAE and
      expected SQL_SUCCESS will now see HY010; they should cancel the statement handle instead.

  113:
    name: "SQLTables case-fold unquoted identifiers in identifier mode"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Under SQL_ATTR_METADATA_ID=SQL_TRUE the catalog function arguments are identifiers, and per the
      ODBC specification an unquoted identifier is case-insensitive (only a double-quoted identifier
      preserves case). The universal driver folds unquoted catalog/schema/table identifiers to
      uppercase via catalog_arg_to_pattern before SHOW OBJECTS and the case-sensitive client-side
      like_match re-filter. The legacy driver re-filters SHOW results case-sensitively against the
      caller's raw (lowercase) argument, so a lowercase identifier matches nothing. Related pattern-
      mode case-sensitivity fix: SNOW-3780463.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      With SQL_ATTR_METADATA_ID=SQL_TRUE and a lowercase (unquoted) catalog/schema/table identifier,
      the legacy driver compares the identifier case-sensitively against the uppercase names returned
      by SHOW and drops every row, yielding an empty result set.
    new_driver_behavior: |
      Unquoted identifiers are folded to uppercase before SHOW and the client-side re-filter, so a
      lowercase identifier matches the uppercase stored name and the expected row(s) are returned.
      Double-quoted identifiers remain case-sensitive. In pattern mode (SQL_ATTR_METADATA_ID=SQL_FALSE,
      the default) names stay case-sensitive, matching the reference driver (SNOW-3780463).
    description: |
      Applications that relied on the legacy case-sensitive behavior of unquoted identifiers under
      identifier mode will now get matches for differently-cased identifiers. The odbc-api tests
      split the assertion (NEW_DRIVER_ONLY expects the matched row, OLD_DRIVER_ONLY expects the
      legacy empty result set).

  114:
    name: "SQLGetDiagField(SQL_DIAG_SERVER_NAME) is populated instead of returning an empty string"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      This is an enhancement that makes the ODBC API more complete.
    old_driver_behavior: |
      SQLGetDiagField(SQL_DIAG_SERVER_NAME) returns an empty string after a diagnostic is raised
      on a connected statement/connection.
    new_driver_behavior: |
      SQLGetDiagField(SQL_DIAG_SERVER_NAME) returns the server/DSN name of the connection, matching
      the ODBC definition of the field.
    description: |
      Additive: applications reading SQL_DIAG_SERVER_NAME now receive the connection's server name
      where the old driver returned "".

  115:
    name: "SQLGetDiagField(SQL_DIAG_DYNAMIC_FUNCTION_CODE) classifies the statement instead of returning 0/unknown"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      This fixes the return codes for the call, making the method ODBC-spec compliant.
    old_driver_behavior: |
      SQLGetDiagField(SQL_DIAG_DYNAMIC_FUNCTION_CODE) returns 0 (SQL_DIAG_UNKNOWN_STATEMENT) and
      SQL_DIAG_DYNAMIC_FUNCTION returns an empty string after execution.
    new_driver_behavior: |
      The fields are populated from the statement type: a SELECT reports
      SQL_DIAG_DYNAMIC_FUNCTION_CODE = 85 (SQL_DIAG_SELECT_CURSOR); INSERT/UPDATE/DELETE/CALL map to
      their ODBC-spec codes.
    description: |
      Additive: applications reading SQL_DIAG_DYNAMIC_FUNCTION_CODE now get the classified code where
      the old driver returned 0.

  116:
    name: "Statement header diagnostic fields are not readable through iODBC's wide SQLGetDiagFieldW entry point"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      iODBC's wide SQLGetDiagFieldW does not deliver statement header fields
      (SQL_DIAG_ROW_COUNT, SQL_DIAG_CURSOR_ROW_COUNT,
      SQL_DIAG_DYNAMIC_FUNCTION_CODE) to the application. The driver writes
      the correct value and returns SQL_SUCCESS; the DM drops it before the
      caller. The same reads succeed through iODBC's narrow entry point and
      through unixODBC/Windows. There is no driver-side fix.
    old_driver_behavior: |
      Reading a statement-only header diagnostic field through iODBC's wide entry point
      (SQLGetDiagFieldW) is mishandled: SQL_DIAG_ROW_COUNT and SQL_DIAG_CURSOR_ROW_COUNT abort the
      process (a pthread_mutex assertion in Simba::ODBC::DiagManager::SQLGetDiagFieldW), and
      SQL_DIAG_DYNAMIC_FUNCTION_CODE returns a non-success code. The same reads succeed through
      unixODBC (the narrow entry point).
    new_driver_behavior: |
      The driver itself writes the correct value and returns SQL_SUCCESS for these fields regardless
      of the ANSI/wide entry point (the numeric header writes in get_diag_field are
      encoding-independent). But iODBC's wide SQLGetDiagFieldW does not deliver statement header
      fields to the caller: SQL_DIAG_ROW_COUNT, SQL_DIAG_CURSOR_ROW_COUNT and
      SQL_DIAG_DYNAMIC_FUNCTION_CODE return SQL_ERROR before the driver's value reaches the
      application. The same reads succeed through iODBC's narrow entry point and through unixODBC.
    description: |
      This is an iODBC driver-manager limitation in its wide (UTF-16/UTF-32) SQLGetDiagFieldW path,
      not a defect in 4.x: the driver returns the correct value, but iODBC's wide entry
      point does not surface these statement header fields (3.x additionally aborts or
      errors inside its own DiagManager on the same path). Because the failure is at the DM boundary
      it affects both drivers under iODBC, so the three affected reads in
      odbc-api/diagnostic/diag_field_tests.cpp (SQL_DIAG_ROW_COUNT, SQL_DIAG_CURSOR_ROW_COUNT,
      SQL_DIAG_DYNAMIC_FUNCTION_CODE) are gated with SKIP_IODBC("BD#116 - ..."). Full coverage of
      these fields for both drivers remains on the unixODBC lanes (Linux, macOS Universal) and on
      Windows.

  120:
    name: "SQLGetFunctions: per-function probe of SQLCancelHandle range-rejected with SQL_ERROR under unixODBC"
    status: allowed
    type: bug
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      unixODBC's SQLGetFunctions never forwards a per-function probe to the
      driver. It range-rejects any id > SQL_API_SQLFETCHSCROLL (1021) with
      HY095. SQL_API_SQLCANCELHANDLE is 1022. The driver's ODBC3 bitmap already
      reports SQLCancelHandle supported.
    old_driver_behavior: |
      Under unixODBC, `SQLGetFunctions(dbc, SQL_API_SQLCANCELHANDLE, &out)`
      returns SQL_ERROR (SQLSTATE HY095). The ODBC3 bitmap still reports
      SQLCancelHandle as supported.
    new_driver_behavior: |
      Under the unixODBC Driver Manager the per-function probe
      `SQLGetFunctions(dbc, SQL_API_SQLCANCELHANDLE, &out)` returns SQL_ERROR
      (SQLSTATE HY095), even though the ODBC3 bitmap the driver returns for
      SQL_API_ODBC3_ALL_FUNCTIONS correctly reports SQLCancelHandle supported. The
      error is injected by the Driver Manager, not by the driver.
    description: |
      It is a unixODBC Driver Manager limitation.

      unixODBC's SQLGetFunctions never forwards a per-function query to the driver.
      The id-range guard rejects anything `function_id > SQL_API_SQLFETCHSCROLL` (1021).

  121:
    name: "Catalog REMARKS / COLUMN_DEF return SQL_NULL_DATA when absent (not empty string)"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      ODBC documents COLUMN_DEF as NULL when no default was specified, and REMARKS
      is a nullable description column on SQLColumns, SQLTables, and SQLProcedures.
      Returning SQL_NULL_DATA for an absent comment or default is spec alignment;
      3.x's empty string (and always-empty SQLColumns COLUMN_DEF) is the
      non-compliant side. Callers that treat "" and NULL as different must migrate,
      but the new contract is the documented one. Do not realign to "".
    old_driver_behavior: |
      SQLColumns REMARKS is a (possibly empty) WVARCHAR; COLUMN_DEF is always "".
      SQLTables REMARKS is a (possibly empty) WVARCHAR from SHOW OBJECTS/TABLES/VIEWS
      comment — never SQL_NULL_DATA (null comment cells become "").
      SQLProcedures REMARKS maps a null comment to "".
    new_driver_behavior: |
      When the value is absent, SQLGetData returns SQL_NULL_DATA for:
      - SQLColumns REMARKS and COLUMN_DEF
      - SQLTables REMARKS
      - SQLProcedures REMARKS
      When a real comment is present, SQLTables REMARKS returns that string
      (plumbed from SHOW OBJECTS.comment). SQLProcedureColumns already returned
      NULL on both drivers.
    description: |
      ODBC documents COLUMN_DEF as NULL when no default was specified. Returning
      SQL_NULL_DATA for absent REMARKS / COLUMN_DEF is consistent across
      SQLColumns, SQLTables, and SQLProcedures. 3.x typically
      returns an empty string (and always "" for SQLColumns COLUMN_DEF).

  122:
    name: "SQLColumns/SQLProcedureColumns BUFFER_LENGTH for NUMBER/DECIMAL is precision+2 (ODBC transfer octet length), not legacy storage 16"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      Catalog BUFFER_LENGTH is the ODBC transfer octet length under SQL_C_DEFAULT
      (precision + 2). 3.x's 1/2/4/8/16 ladder is Snowflake on-source
      storage width, not the catalog field the spec defines. Query-result
      SQLColAttribute OCTET_LENGTH / DISPLAY_SIZE for NUMBER stays 136, so fetch
      buffer sizing is unchanged.
    old_driver_behavior: |
      SQLColumns and SQLProcedureColumns BUFFER_LENGTH (col 8) for NUMBER/DECIMAL
      return the Snowflake on-source storage width from the precision ladder
      (1/2/4/8/16), e.g. NUMBER(38,0) → 16 and NUMBER(18,6) → 8 — not the ODBC
      transfer octet length. Excel Power Query Class-6a
      (replay_excel_powerquery_navigator_navigate_and_load) asserts the
      high-precision SQLColumns value 16.
    new_driver_behavior: |
      SQLColumns and SQLProcedureColumns BUFFER_LENGTH for NUMBER/DECIMAL return
      precision + 2 (ANSI transfer octet length under SQL_C_DEFAULT), e.g.
      NUMBER(38,0) → 40 and NUMBER(18,6) → 20. Query-result
      SQLColAttribute(SQL_DESC_OCTET_LENGTH / DISPLAY_SIZE) for NUMBER remains
      136 (unchanged).
    description: |
      Spec: https://learn.microsoft.com/sql/odbc/reference/appendixes/transfer-octet-length

  123:
    name: "SQLColumns COLUMN_SIZE for FLOAT/DOUBLE/REAL is 15 decimal digits instead of 38"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      The ODBC column-size definition for SQL_DOUBLE / SQL_FLOAT is 15 significant
      decimal digits. Reporting 15 (with catalog NUM_PREC_RADIX 10) is spec
      alignment; 3.x's 38 is Snowflake's maximum NUMBER precision used
      as a placeholder. Query-result SQLColAttribute NUM_PREC_RADIX for DOUBLE
      stays binary 2, so fetch-path metadata is unchanged. Keep allowed; do not
      realign catalog COLUMN_SIZE to 38.
    old_driver_behavior: |
      SQLColumns reports COLUMN_SIZE 38 for FLOAT, DOUBLE, and REAL catalog rows,
      using Snowflake's maximum NUMBER precision as a placeholder.
    new_driver_behavior: |
      SQLColumns reports COLUMN_SIZE 15 for FLOAT, DOUBLE, and REAL catalog rows,
      matching the number of significant decimal digits for double precision.
    description: |
      The ODBC column-size definition for SQL_DOUBLE / SQL_FLOAT is 15 significant
      decimal digits. This also keeps SQLColumns COLUMN_SIZE consistent with its
      decimal NUM_PREC_RADIX value of 10. The paired NEW_DRIVER_ONLY / OLD_DRIVER_ONLY
      assertions are in odbc-api/catalog/columns_tests.cpp.

  125:
    name: "SQLColumns SQL_DATA_TYPE returns verbose SQL_DATETIME (9) for date/time types"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      Col 14 must be the verbose SQL_DATETIME (9) for date/time types, with the
      subtype in SQL_DATETIME_SUB. 3.x copied the concise DATA_TYPE into that
      column; the new values match the ODBC catalog spec.
    old_driver_behavior: |
      For DATE/TIME/TIMESTAMP rows, SQLColumns col 14 (SQL_DATA_TYPE) equals
      col 5 (DATA_TYPE): 91 / 92 / 93. Col 15 (SQL_DATETIME_SUB) is still filled
      (1 / 2 / 3).
    new_driver_behavior: |
      For DATE/TIME/TIMESTAMP rows, SQLColumns col 14 returns SQL_DATETIME (9)
      and col 15 returns the corresponding SQL_CODE_* (1 / 2 / 3). Col 5 still
      returns the concise type (91 / 92 / 93). Non-datetime rows are unchanged
      (verbose == concise).
    description: |
      ODBC requires SQLColumns col 14 (SQL_DATA_TYPE) to return the nonconcise
      type SQL_DATETIME for date/time, with the subtype in SQL_DATETIME_SUB.

  126:
    name: "A second SQLFreeHandle on an already-freed statement returns SQL_INVALID_HANDLE under iODBC instead of SQL_ERROR + HY000 on the connection"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      A second SQLFreeHandle on an already-freed statement is an invalid handle.
      SQL_INVALID_HANDLE on every DM matches the spec; 3.x's iODBC SQL_ERROR +
      HY000 on the parent connection does not.
    old_driver_behavior: |
      Under iODBC, SQLFreeHandle(SQL_HANDLE_STMT) on a statement that was already
      freed returns SQL_ERROR and posts SQLSTATE HY000 on the parent connection
      handle. SQLGetStmtAttr on the same pointer already returns SQL_INVALID_HANDLE.
      A third SQLFreeHandle then returns SQL_INVALID_HANDLE. Under unixODBC the
      second SQLFreeHandle returns SQL_INVALID_HANDLE.
    new_driver_behavior: |
      The second SQLFreeHandle(SQL_HANDLE_STMT) on a freed statement returns
      SQL_INVALID_HANDLE on every DM, including iODBC. No diagnostic is posted on
      the connection.
    description: |
      Applications that double-free a statement under iODBC against the old driver
      see SQL_ERROR + HY000 on the DBC; the new driver returns the spec
      SQL_INVALID_HANDLE.

  127:
    name: "SQLGetFunctions ODBC3 bitmap reports SQLFreeConnect / SQLFreeEnv as supported under iODBC instead of omitting them"
    status: allowed
    type: enhancement
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      The driver exports SQLFreeConnect and SQLFreeEnv, so the ODBC 3 bitmap
      should report them on every DM. 3.x omitted those bits under iODBC even
      though the manager still maps the calls to SQLFreeHandle.
    old_driver_behavior: |
      Under iODBC, SQLGetFunctions(SQL_API_ODBC3_ALL_FUNCTIONS) omits
      SQL_API_SQLFREECONNECT and SQL_API_SQLFREEENV from the returned bitmap.
      Per-function SQLGetFunctions(id) and SQL_API_ALL_FUNCTIONS (ODBC 2.x array)
      still report both supported. The reference driver does not export these
      entry points (the DM maps them to SQLFreeHandle).
    new_driver_behavior: |
      Exports SQLFreeConnect / SQLFreeEnv and reports both in the ODBC3 bitmap on
      all DMs, including iODBC.
    description: |
      Applications that probe the ODBC3 function bitmap under iODBC against the
      old driver will incorrectly believe SQLFreeConnect / SQLFreeEnv are
      unsupported, even though the DM still dispatches the mapped FreeHandle path.
      The new driver reports both bits set. Gated with OLD_IODBC_ONLY("BD#127") in
      the SQL_API_ODBC3_ALL_FUNCTIONS coverage loop in
      odbc-api/driver_info/get_functions_tests.cpp.

  128:
    name: "SQLColumns TIMESTAMP COLUMN_SIZE is 20+scale instead of fixed 35"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      ODBC column size for TIMESTAMP is 20 + scale (19 when scale is 0), not a
      fixed 35. 3.x advertised the worst-case TIMESTAMP_TZ string width for every
      TIMESTAMP flavor.
    old_driver_behavior: |
      SQLColumns COLUMN_SIZE (col 7) for TIMESTAMP_NTZ / LTZ / TZ is a fixed 35
      (worst-case TIMESTAMP_TZ string), regardless of scale.
    new_driver_behavior: |
      SQLColumns COLUMN_SIZE for TIMESTAMP* is 20 + scale (19 when scale is 0).
      Default Snowflake scale 9 therefore reports 29. Query-result
      SQLColAttribute DISPLAY_SIZE for TIMESTAMP remains 29 (unchanged).
    description: |
      Spec: https://learn.microsoft.com/sql/odbc/reference/appendixes/column-size

  129:
    name: "SQLColumns TIMESTAMP BUFFER_LENGTH is 16 instead of 35"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      BUFFER_LENGTH is the SQL_C_DEFAULT transfer octet length
      (sizeof SQL_TIMESTAMP_STRUCT = 16), not a copy of COLUMN_SIZE. 3.x returned
      35 because it copied COLUMN_SIZE.
    old_driver_behavior: |
      SQLColumns BUFFER_LENGTH (col 8) for TIMESTAMP* copies COLUMN_SIZE and
      therefore returns 35.
    new_driver_behavior: |
      SQLColumns BUFFER_LENGTH for TIMESTAMP* is 16 (sizeof SQL_TIMESTAMP_STRUCT),
      the ODBC transfer octet length under SQL_C_DEFAULT. COLUMN_SIZE remains
      20+scale. Query-result SQLColAttribute OCTET_LENGTH for
      TIMESTAMP remains 16 (unchanged).
    description: |
      Spec: https://learn.microsoft.com/sql/odbc/reference/appendixes/transfer-octet-length

  130:
    name: "SQLColumns VARIANT/OBJECT/ARRAY size follows VARCHAR_AND_BINARY_MAX_SIZE_IN_RESULT instead of hardcoded 128M"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      VARIANT, OBJECT, and ARRAY catalog sizes should follow the session VARCHAR
      maximum rather than a hardcoded 128 MB TEXT constant. The default 16 MB
      matches VARCHAR_AND_BINARY_MAX_SIZE_IN_RESULT.
    old_driver_behavior: |
      SQLColumns COLUMN_SIZE, BUFFER_LENGTH, and CHAR_OCTET_LENGTH for
      VARIANT / OBJECT / ARRAY are hardcoded to 134217728 (128 MB,
      SQL_SF_TEXT_COLUMN_LEN), independent of the session VARCHAR max.
    new_driver_behavior: |
      SQLColumns COLUMN_SIZE, BUFFER_LENGTH, and CHAR_OCTET_LENGTH for
      VARIANT / OBJECT / ARRAY follow the session
      VARCHAR_AND_BINARY_MAX_SIZE_IN_RESULT (the same max unbounded TEXT
      reports). CHAR_OCTET_LENGTH equals BUFFER_LENGTH and is not NULL.
      SHOW COLUMNS' 128 MB charLength is ignored so the catalog size tracks
      the session parameter, not the historical TEXT constant. The default
      is 16777216. Raising the session parameter raises the catalog size.
      Query-result SQLColAttribute for these types is unchanged.
    description: |
      For non-standard ODBC SQL types advertising the session VARCHAR
      max is more accurate. CHAR_OCTET_LENGTH is specified as NULL only for
      non-character/non-binary types; these rows report SQL_VARCHAR.

  133:
    name: "SQLColumns DATE/TIME BUFFER_LENGTH is 6 instead of 10 / 18"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      BUFFER_LENGTH for DATE and TIME is sizeof SQL_DATE_STRUCT / SQL_TIME_STRUCT
      (6), not a copy of COLUMN_SIZE. SQL_TIME_STRUCT has no fractional-seconds
      field, so the length stays 6 even when COLUMN_SIZE is 18.
    old_driver_behavior: |
      SQLColumns BUFFER_LENGTH (col 8) for DATE and TIME copies COLUMN_SIZE:
      DATE returns 10 and TIME(9) returns 18.
    new_driver_behavior: |
      SQLColumns BUFFER_LENGTH for DATE and TIME is 6 (sizeof SQL_DATE_STRUCT /
      sizeof SQL_TIME_STRUCT), the ODBC transfer octet length under SQL_C_DEFAULT.
      COLUMN_SIZE remains 10 for DATE and 18 for TIME(9). Query-result
      SQLColAttribute OCTET_LENGTH for DATE/TIME remains 6 (unchanged).
    description: |
      Spec: https://learn.microsoft.com/sql/odbc/reference/appendixes/transfer-octet-length
      SQL_TIME_STRUCT has no fractional-seconds field, so BUFFER_LENGTH stays 6
      even when COLUMN_SIZE is 18.

  146:
    name: "SQLColumns GEOGRAPHY/GEOMETRY sizes follow the session VARCHAR maximum"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: medium
    status_rationale: |
      GEOGRAPHY and GEOMETRY report SQL_VARCHAR, so catalog sizes follow the
      session VARCHAR maximum. 3.x hardcoded 128 MB independently of that
      parameter.
    old_driver_behavior: |
      SQLColumns COLUMN_SIZE, BUFFER_LENGTH, and CHAR_OCTET_LENGTH for
      GEOGRAPHY and GEOMETRY are 134217728, independent of the session
      VARCHAR maximum.
    new_driver_behavior: |
      SQLColumns COLUMN_SIZE, BUFFER_LENGTH, and CHAR_OCTET_LENGTH for
      GEOGRAPHY and GEOMETRY equal VARCHAR_AND_BINARY_MAX_SIZE_IN_RESULT.
      The default is 16777216, and changing the session parameter changes
      all three reported sizes.
    description: |
      GEOGRAPHY and GEOMETRY report SQL_VARCHAR as DATA_TYPE, so their
      character and buffer sizes use the same session maximum as other
      session-sized VARCHAR-compatible catalog types.

  147:
    name: "SQLSetStmtAttr SQL_ATTR_ROW_BIND_TYPE misaligned value accepted on all platforms"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: false
    impact: low
    status_rationale: |
      A non-zero SQL_ATTR_ROW_BIND_TYPE is a row-wise byte stride with no
      alignment requirement. Accepting 65540 on every platform matches the spec;
      3.x's HY000/S1000 on aarch64 and macOS did not.
    old_driver_behavior: |
      SQLSetStmtAttr(SQL_ATTR_ROW_BIND_TYPE, 65540) returns SQL_SUCCESS on Windows and
      Linux x86_64 but SQL_ERROR with native error 11700 on Linux aarch64 and macOS.
      Under SQL_OV_ODBC3 the posted SQLSTATE is HY000; under SQL_OV_ODBC2 it is S1000.
      Neither is the documented SQLSTATE for an invalid attribute value (that would be
      HY024).
    new_driver_behavior: |
      SQLSetStmtAttr(SQL_ATTR_ROW_BIND_TYPE, 65540) returns SQL_SUCCESS on all platforms,
      and a two-row fetch writes the second row through that stride without crashing, for
      wide-character (including 1-mod-2 value offsets) and fixed-width numeric bindings.
    description: |
      The spec treats a non-zero SQLULEN as a row-wise byte stride with no alignment requirement.
      Applications setting that stride no longer receive HY000 (or S1000 under ODBC 2.x) on
      non-x86_64 Unix with the new driver. The driver uses unaligned writes for the row-wise
      length and indicator pointers, for character and wide-character bind buffers, and for
      fixed-width bound values produced by such a stride.

  151:
    name: "SQLGetTypeInfo TIMESTAMP COLUMN_SIZE is 29; ODBC_USE_STANDARD_TIMESTAMP_COLUMNSIZE is not accepted"
    status: allowed
    type: bugfix
    reviewed: true
    is_breaking_change: true
    impact: low
    status_rationale: |
      SQLGetTypeInfo COLUMN_SIZE 29 is the ODBC standard TIMESTAMP display size
      (20 + default scale 9). 3.x defaulted to 35 and needed a toggle to get 29;
      4.x always reports 29 and does not accept that toggle.
    old_driver_behavior: |
      SQLGetTypeInfo reports COLUMN_SIZE 35 for SQL_TYPE_TIMESTAMP. Setting
      ODBC_USE_STANDARD_TIMESTAMP_COLUMNSIZE=true reports 29 instead.
    new_driver_behavior: |
      SQLGetTypeInfo always reports COLUMN_SIZE 29 for SQL_TYPE_TIMESTAMP.
      ODBC_USE_STANDARD_TIMESTAMP_COLUMNSIZE is not accepted. TIMESTAMP_LTZ,
      TIMESTAMP_NTZ, and TIMESTAMP_TZ still report 35.

  172:
    name: "Server errors with a 02xxx SQLSTATE report HY000 instead of the server SQLSTATE"
    status: allowed
    type: bugfix
    reviewed: false
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      A failed statement reports the server SQLSTATE verbatim, including the
      no-data class. COPY INTO a missing stage returns SQL_ERROR with SQLSTATE
      02000 and native error 2003.
    new_driver_behavior: |
      A server SQLSTATE in the 02xxx class is not copied to an error record;
      the record uses the driver's default for that error, which is HY000 for
      a failed query. COPY INTO a missing stage returns SQL_ERROR with
      SQLSTATE HY000 and native error 2003. The native error and message are
      unchanged.
    description: |
      ODBC reserves class 02 for SQL_NO_DATA, which is a success return, so
      an error record carrying 02000 is ambiguous to callers. Applications
      that branch on SQLSTATE 02000 after SQL_ERROR see HY000; the native
      error 2003 still identifies the missing object.

