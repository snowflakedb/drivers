# Allowed statuses:
#  - unknown (default): status is not yet determined
#  - todo: BD has to be fixed
#  - fixed: BD has been addressed, removing the difference between the old and new driver
#  - allowed: the change is expected and is accepted
#
# Allowed types:
#  - unknown (default): type is not yet determined
#  - api_incompatibility: the new driver removes support for a functionality
#  - bug: the new driver has a bug/incompatibility relative to the old driver
#  - bugfix: the new driver fixes incorrect old-driver behavior (e.g. non-compliance with the ODBC specification)
#  - enhancement: the new driver extends or improves existing functionality
#
# Reviewed:
#  - true: the BD has been reviewed and its status is accepted
#  - false (default): the BD has not yet been reviewed
#
# status_rationale (required when reviewed is true):
#  Explain why this entry has the chosen 'status'. Type and behavior deltas alone often do not
#  imply whether we intend to ship the difference, regress compatibility, track a fix, etc.

behavior_differences:
  1:
    name: "Returns misconfiguration SQL state instead of allowing the connection and failing on the server side"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Returning a client-local misconfiguration diagnostic (SQLSTATE 01S00, native error 0) is intentional - we reject invalid client configuration before a server round-trip. The discrepancy with the legacy driver using SQLSTATE 28000 is accepted as deliberate  cleanup.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Returns SQLSTATE 28000 and 20032 native error.
    new_driver_behavior: |
      Returns SQLSTATE 01S00 and 0 native error.
    description: |
      The native error should come from the server, and in this case we catch the issue early, in the driver.

  2:
    name: "Compression type is now returned in uppercase"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      Changing the returned compression token casing may break tooling that depended on lowercase.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      The old driver returns the compression type in lowercase.
    new_driver_behavior: |
      The driver returns the compression type in uppercase.

  3:
    name: "Encryption field is no longer included in the result"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      To be aligned with the old driver, as this is a regression.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      The PUT result set encryption column (column 8) contains "ENCRYPTED" and the GET result set encryption column (column 4) contains "DECRYPTED" after a successful file transfer.
    new_driver_behavior: |
      Realigned to the legacy driver: the PUT (column 8) and GET (column 4) encryption columns again contain "ENCRYPTED" / "DECRYPTED" on a successful transfer. (The earlier regression that returned an empty string on success has been reverted; this entry is now status: fixed.)
    description: |
      Regression fixed. Applications that inspect the PUT/GET encryption column again see "ENCRYPTED" / "DECRYPTED" on success, matching the legacy driver.
  4:
    name: "GET rowset metadata contains file size after decryption instead of file size before decryption"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      Switching the GET size metric to decrypted-on-disk payload size changes comparisons against on-stage ciphertext length.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      The GET result set size column (column 2) reports the raw downloaded byte count (e.g. 32 bytes for a small test file), which includes the client-side encryption padding/overhead before decryption.
    new_driver_behavior: |
      Realigned to the legacy driver: the GET size column (column 2) again reports the raw downloaded byte count before decryption (e.g. 32 bytes for the same test file). (The earlier regression that reported the decrypted-on-disk size, e.g. 26 bytes, has been reverted; this entry is now status: fixed.)
    description: |
      Regression fixed. The GET size column again matches the legacy driver's pre-decryption byte count.
  5:
    name: "Header of a gzip-compressed file does not contain filename"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      Omitting gzip FNAME and zeroing mtime improves determinism (good for byte-identical reproducibility tests) but breaks consumers that scraped the embedded filename back out of the gzip header.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      When AUTO_COMPRESS=TRUE, the PUT-uploaded gzip file contains the original filename in the FNAME field of the gzip header, making the byte stream non-deterministic for identical content.
    new_driver_behavior: |
      The uploaded gzip file is produced via `GzBuilder::new().mtime(0)` without a filename, so the header omits FNAME and the mtime is zeroed. The resulting bytes are deterministic and match a locally-compressed reference file.
    description: |
      Applications that compare gzip byte streams (e.g. for deduplication or caching) will see identical bytes across uploads of the same content. Applications that relied on reading the filename back out of the gzip header will no longer find it.
  6:
    name: "Unsupported compression type returns error instead of being silently ignored"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      This is a bug introduced in the UD ODBC implementation and has to be aligned with the old driver behavior.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      PUT with SOURCE_COMPRESSION=AUTO_DETECT on a file with an unsupported compression format (e.g. LZMA/xz) returns SQL_SUCCESS and uploads the file anyway (treated as uncompressed).
    new_driver_behavior: |
      Realigned to the legacy driver: PUT with SOURCE_COMPRESSION=AUTO_DETECT on an unsupported compression format again returns SQL_SUCCESS and uploads the file (treated as uncompressed). (The earlier regression that returned SQL_ERROR for formats outside the supported set has been reverted; this entry is now status: fixed.)
    description: |
      Regression fixed. Applications uploading LZMA or other unsupported formats under AUTO_DETECT again succeed silently, matching the legacy driver.
  7:
    name: "ALTER USER ADD PROGRAMMATIC ACCESS TOKEN returns result set with token in new driver, old driver returns invalid cursor state (10510)"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      This is an enhancement of the API. Widening access is deliberate.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Calling SQLFetch on the statement returned by `ALTER USER <user> ADD PROGRAMMATIC ACCESS TOKEN ...` returns SQL_ERROR with SQLSTATE 24000, native error 10510, and message "Invalid cursor state". The token name and secret cannot be read through ODBC.
    new_driver_behavior: |
      SQLFetch returns SQL_SUCCESS and the token name (column 1) and token secret (column 2) can be retrieved via SQLGetData, allowing the PAT to be used immediately for authentication.
    description: |
      Applications can now create a PAT and obtain its secret in a single round-trip via ODBC. On the old driver, the token secret must be acquired through a different channel.
  8:
    name: "Float max/min boundary values are returned successfully instead of numeric out of range error"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The legacy driver falsely rejected FLT_MAX literals that IEEE 754 guarantees are representable. Accepting correctly rounded conversions while still rejecting genuinely out-of-range literals is ODBC-aligned.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Converting the exact IEEE 754 single-precision boundary strings '3.4028235e38' (FLT_MAX) and '-3.4028235e38' (-FLT_MAX) to SQL_C_FLOAT returns SQL_ERROR with SQLSTATE 22003 (numeric value out of range), even though both values are representable as a float.
    new_driver_behavior: |
      Returns SQL_SUCCESS with the correctly converted f32 values. Only values strictly greater than FLT_MAX (e.g. '3.4028236e38') are rejected with 22003.
    description: |
      Applications that pass the exact float boundary values will now succeed on the new driver where the old driver spuriously reported out-of-range.
  9:
    name: "SQLBindCol doesn't set indicator when TargetValuePtr is null."
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      This is fixing a bug that surfaced during the development.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When SQLBindCol is called with a null TargetValuePtr but a valid StrLen_or_IndPtr (intended to unbind the data buffer while keeping the indicator bound), the driver fully unbinds the column and leaves the caller's indicator unchanged after a subsequent SQLFetch.
    new_driver_behavior: |
      Initially wrote the data length into StrLen_or_IndPtr even though TargetValuePtr was null (treating the indicator as still bound).
    description: |
      Per the ODBC spec for SQLBindCol, passing a null TargetValuePtr unbinds the data buffer for the column. The reference test in `sql_bind_col.cpp` ("SQLBindCol can unbind data buffer while keeping indicator bound.") now asserts that the indicator remains unchanged for both drivers.

  10:
    name: "SQL_SF_CONN_ATTR_PRIV_KEY (EVP_PKEY pointer) is not supported"
    status: allowed
    type: api_incompatibility
    reviewed: true
    status_rationale: |
      Raw OpenSSL structs cannot safely cross our Rust ODBC boundary today. Supporting string-based PEM material is the sanctioned replacement surface; breakage for EVP_PKEY callers is deliberate and callers must migrate to PRIV_KEY_CONTENT / PRIV_KEY_BASE64 workflows.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Accepts raw EVP_PKEY* pointers via SQLSetConnectAttr.
    new_driver_behavior: |
      Does not support the raw EVP_PKEY* pointers.
    description: |
      Not supported across the Rust FFI boundary — use PRIV_KEY_CONTENT or PRIV_KEY_BASE64 instead.
      Applications that used the raw EVP_PKEY* pointers will fail to connect. The user would need to parse the EVP_PKEY in the PRIV_KEY_CONTENT or PRIV_KEY_BASE64 format on their own.

  11:
    name: "SQL_C_CHAR returns SQL_ERROR (22003) instead of SQL_SUCCESS_WITH_INFO when whole digits do not fit in buffer"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC spec compliance fix. This helps to prevent the loss of the non-fractional digits.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When SQLGetData is called with SQL_C_CHAR on a DECIMAL/NUMERIC column and the buffer is too small to hold even the whole (non-fractional) digits, the old driver returns SQL_SUCCESS_WITH_INFO and silently truncates the data without raising SQLSTATE 22003.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 22003 (Numeric value out of range), per the ODBC specification which distinguishes between truncation of fractional digits only (01004) and loss of whole digits (22003).
    description: |
      Applications that previously received truncated whole digits silently will now receive an error. This is a spec-compliance improvement — the ODBC specification mandates 22003 when whole digits are lost during numeric-to-char conversion.
  12:
    name: "SQL_C_BINARY returns SQL_ERROR (22003) for undersized SQL_NUMERIC_STRUCT buffers; old driver ignores BufferLength"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC spec compliance fix. This helps to prevent the loss of the data. You cannot read the SQL_NUMERIC struct if the buffer is too small.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When SQLGetData is called with SQL_C_BINARY on a DECIMAL/NUMERIC or DECFLOAT column and the buffer is smaller than sizeof(SQL_NUMERIC_STRUCT) (19 bytes), the old driver ignores the BufferLength argument and writes the full 19-byte SQL_NUMERIC_STRUCT into the caller's buffer regardless of its stated size. When the physical allocation is smaller than 19 bytes this overruns the allocation, causing undefined behavior.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 22003 (Numeric value out of range), per the ODBC specification which states that when byte length of data exceeds BufferLength for SQL_C_BINARY, the result is undefined and SQLSTATE 22003 must be returned.
    description: |
      Applications providing undersized buffers for SQL_C_BINARY will now receive an error instead of corrupted partial data.
  13:
    name: "SQL_C_NUMERIC ignores SQL_DESC_PRECISION and SQL_DESC_SCALE set via SQLSetDescField"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC spec compliance fix. Honors the settings explicitly set by the caller for the conversions.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When SQLSetDescField is used to set SQL_DESC_PRECISION and SQL_DESC_SCALE on the ARD before calling SQLGetData with SQL_C_NUMERIC, the old driver ignores these values and always uses its own defaults (precision=38, scale=0). The resulting SQL_NUMERIC_STRUCT does not reflect the requested precision/scale.
    new_driver_behavior: |
      Honors SQL_DESC_PRECISION and SQL_DESC_SCALE from the ARD, rescaling the value accordingly. For example, setting scale=2 on a DECIMAL(10,2) column returns val=12345 (unscaled) instead of val=123 (truncated to scale=0).
    description: |
      Applications that set descriptor fields for SQL_C_NUMERIC will now see the correct precision and scale in the output struct, matching the ODBC specification behavior.
  14:
    # TODO: Verify if the conversion follows the correct path; for SQL_DOUBLE, the old driver behavior is correct, but for the SQL_NUMERIC it is not
    name: "SQL_C_BINARY on FLOAT/DOUBLE/REAL columns returns raw f64 bytes instead of SQL_NUMERIC_STRUCT"
    status: unknown
    type: bug
    reviewed: true
    status_rationale: |
      To be verified
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      When SQLGetData is called with SQL_C_BINARY on a SQL_DOUBLE (FLOAT/DOUBLE/REAL) column, the old driver returns the raw 8-byte IEEE 754 double representation. The indicator is set to 8 and the buffer contents are not interpretable as an SQL_NUMERIC_STRUCT.
    new_driver_behavior: |
      Returns a 19-byte SQL_NUMERIC_STRUCT as required by the ODBC specification, with precision=38, scale=0 (integer part after truncation), sign (1 positive, 0 negative), and val[16] containing the unsigned magnitude in little-endian 128-bit format. The indicator is set to sizeof(SQL_NUMERIC_STRUCT). Fractional values produce SQL_SUCCESS_WITH_INFO with SQLSTATE 01S07.
    description: |
      Applications requesting SQL_C_BINARY for floating-point columns now receive a standards-compliant SQL_NUMERIC_STRUCT instead of raw double bytes.
  15:
    name: "SQL_C_CHAR with small buffer on FLOAT columns returns SQL_SUCCESS_WITH_INFO 01004; old driver may omit the SQLSTATE"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. Now we allow the partial conversion.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When SQLGetData is called with SQL_C_CHAR on a FLOAT/DOUBLE/REAL column and the buffer is too small to hold the full string representation, the old driver returns SQL_SUCCESS_WITH_INFO but does not set SQLSTATE 01004.
    new_driver_behavior: |
      Returns SQL_SUCCESS_WITH_INFO with SQLSTATE 01004 (String data, right truncation), per the ODBC specification for string data truncation.
    description: |
      Applications providing small buffers for SQL_C_CHAR on FLOAT columns now receive SQLSTATE 01004 with the truncated result; the old driver returned SQL_SUCCESS_WITH_INFO without posting 01004.
  16:
    name: "NaN FLOAT value returns SQL_ERROR (22003) instead of silently converting to 0 for integer and BIT targets"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. The silent conversion may cause data discrepancies.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When SQLGetData is called on a FLOAT/DOUBLE column containing NaN with an integer target type (SQL_C_SLONG, SQL_C_ULONG, SQL_C_SHORT, SQL_C_USHORT, SQL_C_STINYINT, SQL_C_UTINYINT, SQL_C_SBIGINT, SQL_C_UBIGINT) or SQL_C_BIT, the old driver returns SQL_SUCCESS_WITH_INFO and silently writes 0 to the output buffer. This happens because NaN comparisons always return false, so range checks pass, and the cast produces 0.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 22003 (Numeric value out of range). NaN is not a representable numeric value and cannot be meaningfully converted to any integer or BIT type.
    description: |
      Note: Both drivers correctly reject NaN for SQL_C_NUMERIC (returning 22003) and both correctly produce the string "NaN" for SQL_C_CHAR. The discrepancy is limited to integer and BIT targets.
      Applications that previously received 0 for NaN inputs to integer types will now receive an error. This is a spec-compliance improvement.

  17:
    name: "On Windows, PUT source column returns filename only instead of full absolute path"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      Regression.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      On Windows, the PUT result set source column returns the full absolute file path (e.g. C:/Users/.../test_data.csv).
    new_driver_behavior: |
      Realigned to the legacy driver: on Windows the PUT source column again returns the full absolute file path. (The earlier regression that returned just the filename, matching Linux, has been reverted; this entry is now status: fixed.) The put_get tests encode this via expected_put_source(), which returns the absolute path on Windows for both drivers.
    description: |
      Regression fixed. Applications that parse the PUT source column for the full path on Windows again receive the absolute path.
  18:
    name: "Interval leading field precision is enforced and SQL_DESC_DATETIME_INTERVAL_PRECISION is respected"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. Honors the default setting and settings explicitly set by the caller.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Does not enforce the ODBC-mandated default interval leading precision of 2 digits. When a NUMBER value is converted to a single-field interval C type (SQL_C_INTERVAL_YEAR, _MONTH, _DAY, _HOUR, _MINUTE, _SECOND), any value that fits in a SQLUINTEGER (up to 4,294,967,295) succeeds regardless of leading precision. Setting SQL_DESC_DATETIME_INTERVAL_PRECISION via SQLSetDescField has no effect.
    new_driver_behavior: |
      Enforces the default leading precision of 2 as specified by the ODBC standard (values must be in the range 0–99). Values >= 100 fail with SQLSTATE 22015 (Interval field overflow). Applications can increase the precision by calling SQLSetDescField with SQL_DESC_DATETIME_INTERVAL_PRECISION on the ARD before fetching.
    description: |
      Reference: ODBC spec "Interval Data Type Precision" — "The SQL_DESC_DATETIME_INTERVAL_PRECISION field is automatically set to the default interval leading precision of 2."
      Applications converting NUMBER values >= 100 to single-field interval types will now receive 22015 unless they explicitly set a higher leading precision via SQLSetDescField.

  19:
    #TODO: Think how to proceed; for the parsers, both versions are correct.
    name: "DECFLOAT values are returned in scientific notation and properly normalized"
    status: unknown
    type: enhancement
    reviewed: true
    status_rationale: |
      To be verified
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      DECFLOAT values are not properly normalized, when using scientific notation. (e.g. "12e199" is returned instead of "1.2e200")
    new_driver_behavior: |
      Returns the values in proper scientific notation (e.g. "1.2e200").
    description: |
      Applications that parse the DECFLOAT values will now receive values in properly formatted scientific notation.
  20:
    name: "SQLNumResultCols returns the correct column count instead of 0 after SQL_CLOSE on prepared statement"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. Now the caller receives the correct count of the columns for the prepared statement even after closing the cursor.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After Prepare -> Execute -> SQL_CLOSE, SQLNumResultCols returns 0. The old driver does not preserve prepared statement metadata across SQL_CLOSE.
    new_driver_behavior: |
      Returns the correct column count (e.g. 3 for "SELECT 1, 2, 3") because SQL_CLOSE transitions the statement back to the Prepared state (S2/S3) where column metadata is available, per the ODBC specification.
    description: |
      Spec reference: ODBC Statement Transitions table, SQLFreeStmt row (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/statement-transitions#sqlfreestmt) states that SQL_CLOSE from S4-S7 with [p] (prepared) transitions to S2/S3. SQLNumResultCols is defined to succeed in states S2-S12.
      Applications that rely on SQLNumResultCols after SQL_CLOSE on a prepared statement will now receive the correct count.

  21:
    name: "SQLDescribeCol returns SQL_SUCCESS with correct name and type instead of failing after SQL_CLOSE on prepared statement"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. Now the caller receives the correct column metadata.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After Prepare -> Execute -> SQL_CLOSE, SQLDescribeCol returns SQL_ERROR. The old driver does not preserve prepared statement metadata across SQL_CLOSE.
    new_driver_behavior: |
      Returns SQL_SUCCESS with correct column name and type because SQL_CLOSE transitions the statement back to the Prepared state (S2/S3) where column metadata is available, per the ODBC specification.
    description: |
      Spec reference: ODBC Statement Transitions table, SQLFreeStmt row (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/statement-transitions#sqlfreestmt) states that SQL_CLOSE from S4-S7 with [p] (prepared) transitions to S2/S3. SQLDescribeCol is defined to succeed in states S2-S12 (prepared or executed).
      Applications that call SQLDescribeCol after SQL_CLOSE on a prepared statement will now receive valid metadata instead of an error.

  22:
    # TODO: Verify within the test the behavior of old driver; it may be connected to the DriverManagerEncoding setting in the ini file causing the discrepancy
    name: "SQL_C_WCHAR chunked SQLGetData fits more characters per call than previously"
    status: unknown
    type: enhancement
    reviewed: true
    is_breaking_change: false
    status_rationale: |
      To be verified.
    impact: medium
    old_driver_behavior: |
      With an 8-byte SQLWCHAR buffer, the old driver fits only 2 data wide characters + NUL instead of the expected 3 + NUL. This appears to stem from using sizeof(wchar_t) (4 bytes on Linux) for buffer capacity calculation instead of sizeof(SQLWCHAR).
    new_driver_behavior: |
      Computes capacity using sizeof(SQLWCHAR) = 2, fitting 3 data characters + NUL in an 8-byte buffer.
    description: |
      Spec reference: unixODBC defines SQLWCHAR as unsigned short (2 bytes) by default via typedef WCHAR SQLWCHAR where WCHAR = unsigned short. Source: https://github.com/lurcher/unixODBC/blob/master/include/sqltypes.h
      Chunked SQL_C_WCHAR retrieval returns more data per call in the new driver. Applications using iterative SQLGetData will complete in fewer round-trips.

  23:
    name: "SQLGetData truncation indicator is consistently the actual data length"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      This is a performance bug, but still within ODBC spec and allows the same code path to work both on old and new driver. Performance bug to be fixed with SNOW-3560513
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      The truncation indicator returned by the old driver is inconsistent across target C types and platforms: - SQL_C_BINARY truncation: always returns actual byte length. - SQL_C_CHAR truncation via SQLGetData: returns SQL_NO_TOTAL (-4) on Windows and Linux/aarch64, but the actual byte length on Linux/x86_64 and macOS (i.e. the divergence tracks the platform + CPU architecture, not architecture alone). - SQL_C_CHAR truncation via SQLBindCol: always returns actual length. - SQL_C_WCHAR truncation (string source): returns SQL_NO_TOTAL. - SQL_C_WCHAR truncation (binary source): returns actual byte length.
    new_driver_behavior: |
      Always sets the indicator to the actual total byte length of the remaining data, regardless of platform, source type, or target C type. This makes indicator behavior deterministic and portable. Rationale: The ODBC specification states that when data is truncated, "SQLGetData returns the length of the data available to return" and that SQL_NO_TOTAL should only be used when the driver "cannot determine the length of the long data." Since the driver always knows the data length, returning it is more correct and more useful. This lets applications pre-allocate appropriately-sized buffers on subsequent calls instead of guessing.
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlgetdata-function#retrieving-data-with-sqlgetdata
      Applications that check the indicator after a truncated SQLGetData call will now always receive the actual byte count. Applications that previously handled both values (as recommended by the ODBC spec) are unaffected. The consistent behavior eliminates a class of platform-specific bugs where applications worked on one architecture but failed on another due to SQL_NO_TOTAL handling.

  24:
    name: "SQLDescribeCol reports SQL_VARBINARY for BINARY columns instead of SQL_BINARY"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      Fixed: new driver now reports SQL_BINARY to match the old driver.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      Reports data_type as SQL_BINARY (-2) for Snowflake BINARY columns via SQLDescribeCol.
    new_driver_behavior: |
      Reports data_type as SQL_BINARY (-2), matching the old driver.
    description: |
      Rationale: Snowflake BINARY is a variable-length type (up to 8 MB). The ODBC specification defines SQL_BINARY for fixed-length binary and SQL_VARBINARY for variable-length binary. SQL_VARBINARY is the semantically correct type for Snowflake's BINARY.
      Most applications treat SQL_BINARY and SQL_VARBINARY interchangeably. Applications that switch on the exact data_type value may need to handle SQL_VARBINARY in addition to SQL_BINARY.
  25:
    name: "SQLRowCount with null RowCountPtr returns SQL_ERROR (HY009) instead of SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Row count returns only the amount of rows modified. Calling it with nullptr makes no sense.
    is_breaking_change: true
    impact: low
    old_driver_behavior: |
      When SQLRowCount is called with a null RowCountPtr after executing a statement, the old driver returns SQL_SUCCESS and silently ignores the null pointer.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE HY009 (Invalid use of null pointer).
    description: |
      Although HY009 is not explicitly listed in the SQLRowCount diagnostics table, it is the standard ODBC SQLSTATE for null pointer arguments and is consistent with the driver's defensive validation.
      Applications that accidentally pass nullptr to SQLRowCount will now receive an error instead of silent success.

  26:
    name: "SQLBindParameter rejects negative DecimalDigits with HY104 instead of accepting silently"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Negative decimal digits make no sense.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Accepts negative DecimalDigits values without error.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE HY104 (Invalid precision or scale value) per the ODBC specification.

  27:
    name: "Unbound parameter marker returns SQL_ERROR (42000) server error instead of SQL_ERROR (07002) COUNT field incorrect"
    status: fixed
    type: enhancement
    reviewed: true
    status_rationale: |
      Originally the new driver forwarded unbound-marker execution of a prepared statement to the server, which returned 42000 ("Bind variable ? not set"). Auto-IPD (PR #722) reversed this for prepared statements: the IPD is populated from the server-reported parameter count at SQLPrepare and the APD binding count is validated locally at SQLExecute, so the driver now returns 07002 (COUNT field incorrect) identically to the legacy driver. The old-vs-new delta for the prepared-statement case no longer exists, so this entry is now status: fixed. No BD#27 compatibility marker is needed — the shared behavior is asserted with a plain 07002 check in odbc_tests/tests/e2e/query/sql_bind_parameter.cpp.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      After SQL_RESET_PARAMS, executing a prepared statement with unbound parameter markers returns SQL_ERROR with SQLSTATE 07002 (COUNT field incorrect), caught locally by the driver.
    new_driver_behavior: |
      Realigned to the legacy driver: after auto-IPD (PR #722) a prepared statement with unbound parameter markers (e.g. after SQL_RESET_PARAMS) returns SQL_ERROR with SQLSTATE 07002 (COUNT field incorrect), validated locally against the IPD. (The server-side 42000 "Bind variable ? not set" now only applies to the direct-execution path, SQLExecDirect, which does not pre-populate the IPD.)

  28:
    name: "SQLGetDescField on empty IPD returns SQL_NO_DATA instead of SQL_ERROR"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC spec compliance fix.
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      Querying a record field on an empty IPD (no parameters bound, no prepare) returns SQL_ERROR.
    new_driver_behavior: |
      Querying a record field on an empty IPD (no parameters bound, no prepare) returns SQL_NO_DATA.
    description: |
      Per the ODBC spec, "SQL_NO_DATA is returned if RecNumber is greater than the current number of descriptor records."

  29:
    name: "DECFLOAT extreme exponent to SQL_C_BINARY returns SQL_ERROR (22003) instead of silently succeeding"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This prevents the data loss when extreme exponent numbers are used.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Converting a DECFLOAT with an extreme exponent (e.g. 1e100) to SQL_C_BINARY returns SQL_SUCCESS with an incorrect/clamped value.
    new_driver_behavior: |
      Converting a DECFLOAT with an extreme exponent (e.g. 1e100) to SQL_C_BINARY returns SQL_ERROR with SQLSTATE 22003 (numeric value out of range).
    description: |
      The value overflows the i128 intermediate representation.

  30:
    name: "TIMESTAMP to character truncation crashes old driver"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Well, it's better not to crash.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Converting a TIMESTAMP_NTZ, TIMESTAMP_LTZ, or TIMESTAMP_TZ with fractional seconds to SQL_C_CHAR or SQL_C_WCHAR with a buffer of 20-29 bytes (enough for the base timestamp but not the fractional part) crashes with SIGSEGV.
    new_driver_behavior: |
      Converting a TIMESTAMP_NTZ, TIMESTAMP_LTZ, or TIMESTAMP_TZ with fractional seconds to SQL_C_CHAR or SQL_C_WCHAR with a buffer of 20-29 bytes (enough for the base timestamp but not the fractional part) returns SQL_SUCCESS_WITH_INFO with SQLSTATE 01004 and the fractional part of the timestamp string truncated.

  31:
    name: "SQLExecDirect/SQLExecute return 24000 when cursor is already open"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      No delta exists: the reference (old) driver returns SQLSTATE 24000 on a cursor-already-open re-execute, the same as the new driver. Confirmed by the odbc_tests_reference CI job — the sibling cases "SQLExecute returns 24000 when cursor is not closed before re-execute of SELECT", "SQLPrepare with cursor already open returns 24000", and SQLColumns/SQLColumnPrivileges "24000 - Cursor already open" all PASS on the old driver. The original old_driver_behavior recorded below ("silently overwrites and re-executes") was not reproducible against the reference driver and appears to have been described incorrectly. Both drivers are ODBC 3.x compliant on this path, so there is nothing to gate on driver identity; the behavior is asserted with a plain unconditional 24000 check in odbc_tests/tests/odbc-api/submitting_request/exec_direct_tests.cpp (no BD marker, per ud-fixed-bd-must-have-no-test-marker).
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      CORRECTION: the reference driver returns SQL_ERROR with SQLSTATE 24000 (Invalid cursor state), the same as the new driver. (The previously recorded claim that SQLExecDirect/SQLExecute silently overwrite the statement state and allow re-execution without closing the cursor first was not reproducible against the reference driver used in CI and is retracted.)
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 24000 (Invalid cursor state) per the ODBC 3.x specification. Applications must call SQLFreeStmt(SQL_CLOSE) or SQLCloseCursor before re-executing on a statement that already has an open cursor from a previous SELECT or catalog function.
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlexecdirect-function
      Both the old and new drivers enforce 24000 on cursor-already-open, so applications see no behavior change on this path.

  32:
    name: "Async cancel does interrupt in-progress operations instead of waiting for completion"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Old driver did not support the SQLCancel for the in-progress async operations. The new driver properly cancels such queries.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Supports SQL_ATTR_ASYNC_ENABLE (SQLSetStmtAttr succeeds), but SQLCancel during async polling does not actually interrupt the in-progress operation. Subsequent polling continues to return SQL_STILL_EXECUTING indefinitely or until the query completes naturally, rather than returning SQL_ERROR with HY008.
    new_driver_behavior: |
      SQLCancel on an async statement sends a cancel request to the server, and subsequent polling returns SQL_ERROR with SQLSTATE HY008 ("Operation canceled") once the cancellation is acknowledged.
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlcancel-function
      Applications that rely on SQLCancel to abort long-running async queries will not get timely cancellation on the old driver. The query may run to completion despite the cancel request.

      Test coverage note: the async-cancel tests keep SKIP_OLD_DRIVER("BD#32") rather than a paired
      OLD_DRIVER_ONLY assertion. Because the old driver never interrupts, observing its terminal state
      would require the long probe query (TIMELIMIT => 30s) to run to natural completion, which collides
      with the tests' 30s poll ceiling (kMaxPollIterations * kPollInterval) and would be flaky. The old
      driver simply cannot demonstrate the cancellation this behavior asserts.

  33:
    name: "SQL_C_NUMERIC to VARCHAR applies scale from SQL_NUMERIC_STRUCT instead of ignoring it"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is a ODBC compliance fix. New driver now honors the explicitly set scale by the user.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When binding SQL_C_NUMERIC to SQL_VARCHAR, the driver ignores the scale field of SQL_NUMERIC_STRUCT and converts the raw magnitude to a string without inserting a decimal point or appending trailing zeros. For example, val=12345 with scale=2 produces "12345" instead of "123.45", and val=123 with scale=-2 produces "123" instead of "12300".
    new_driver_behavior: |
      Honors the scale field per the ODBC specification. Positive scale inserts a decimal point (val=12345, scale=2 → "123.45"). Negative scale appends trailing zeros (val=123, scale=-2 → "12300").
    description: |
      Spec reference: The SQL_NUMERIC_STRUCT stores a "scaled integer" where actual_value = val × 10^(−scale). https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/c-data-types

  34:
    name: "SQL_C_BINARY to VARCHAR hex-encodes bytes instead of failing with HTTP 400"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Adds a new conversion, that was previously not supported.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When binding SQL_C_BINARY to SQL_VARCHAR, the driver passes the raw binary data to Snowflake, which rejects the request with HTTP 400.
    new_driver_behavior: |
      When binding SQL_C_BINARY to SQL_VARCHAR, the driver hex-encodes the binary data before sending (e.g. 0xDEADBEEF → "deadbeef"), which Snowflake accepts as a valid VARCHAR value.
    description: |
      Spec reference: ODBC "C to SQL: Character" conversion table lists SQL_C_BINARY as a valid source type for SQL_VARCHAR. https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types

  35:
    name: "Add cross-type conversion support for SQL_BIT parameter binding"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      Based on the ODBC API (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/c-to-sql-numeric?view=sql-server-ver17) the conversions are incorrect. To be fixed and aligned.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Has restricted value ranges for SQL_BIT parameter binding. Integer and SQL_C_DOUBLE types only accept 0 and 1; other values (negative, >1) fail with 22003. SQL_C_CHAR only accepts "0"/"1"; string literals like "true"/"false" and numeric strings are rejected. SQL_C_FLOAT is not supported at all. SQL_C_DOUBLE NaN is silently converted to false instead of failing.
    new_driver_behavior: |
      Supports all numeric and string C types for SQL_BIT binding. Any nonzero value is true, zero is false. Boolean string literals ("true"/"false") and numeric strings are accepted. Non-finite float/double values (NaN/inf) are rejected with SQLSTATE 22018 (invalid character value for cast).
    description: |
      Applications using cross-type conversions to BOOLEAN columns will succeed on the new driver where the old driver returned errors.
  36:
    name: "Preserves subnormal double (DBL_MIN) values instead of storing them as zero during parameter binding"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This fixes the data loss that may happen in a very specific scenarios.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Loses precision for very small subnormal double values near DBL_MIN (2.2e-308), storing them as 0.0.
    new_driver_behavior: |
      Preserves subnormal double values through the binding pipeline, storing and retrieving 2.2e-308 correctly.
    description: |
      Applications working with extremely small floating-point values will get correct results on the new driver.
  37:
    name: "SQL_C_NUMERIC >=1 conversion converts SQL_BIT to true instead of rejecting"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      It's related to BD#35. The conversion of the old driver is correct.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 22003 (numeric value out of range) when binding a SQL_C_NUMERIC with a value other than 0 or 1 (e.g., 42) to SQL_BIT. The driver sends the raw numeric magnitude to the server which rejects it for a BOOLEAN column.
    new_driver_behavior: |
      Correctly converts any nonzero SQL_C_NUMERIC mantissa to true (1) and zero to false (0) before sending to the server, matching the behavior of other numeric C types bound to SQL_BIT.
    description: |
      Applications binding SQL_C_NUMERIC values to BOOLEAN columns will succeed on the new driver for any nonzero value.
  38:
    name: "TIME to SQL_C_CHAR/WCHAR truncation and buffer-too-small handling"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The new driver's behavior is the spec-compliant one: SQLSTATE 01004 (string data, right truncated) with SQL_SUCCESS_WITH_INFO is what the ODBC spec prescribes when the buffer holds the base time but not the fractional seconds, and the chunked-retrieval protocol is likewise spec-mandated. The old driver returns SQL_ERROR 22003 for the truncation case and does not implement chunked retrieval at all. Accepted as an intentional divergence rather than something to fix. Both drivers are now asserted directly (paired OLD_DRIVER_ONLY / NEW_DRIVER_ONLY blocks) across all four reference cells — Linux+unixODBC, macOS+unixODBC, Windows+unixODBC and macOS+iODBC — so the truncation and chunked-retrieval facets are verified. One facet remains unassertable: with a buffer physically smaller than the formatted value the old driver has undefined behavior and aborts, so that single test keeps SKIP_OLD_DRIVER("BD#38").
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      TIME to SQL_C_CHAR with a buffer physically smaller than the full formatted time string has undefined behavior in the old driver. TIME to SQL_C_CHAR or SQL_C_WCHAR with a buffer of exactly 9 bytes (enough for HH:MM:SS but not fractional seconds) returns SQL_ERROR with SQLSTATE 22003.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 22003 when the buffer is too small (< 9 bytes for CHAR, < 18bytes for WCHAR), and returns SQL_SUCCESS_WITH_INFO with SQLSTATE 01004 when the buffer can hold the base time but truncates fractional seconds, per the ODBC spec.

  39:
    name: "SQL_C_WCHAR decimal string to SQL_DECIMAL conversion works (Linux only)"
    status: unknown
    type: bugfix
    reviewed: true
    status_rationale: |
      Old driver to be verified
    is_breaking_change: false
    impact: medium
    old_driver_behavior: |
      #TODO: What happens?
    new_driver_behavior: |
      Correctly converts SQL_C_WCHAR decimal strings to SQL_DECIMAL values on all platforms, matching the ODBC spec.

  40:
    #TODO: Verify if the server actually omits the sqlState or we do not propagate it from the sf_core to wrapper.
    name: "SQLSTATE for string data exceeding column size returns SQLSTATE 22000 even if server provides different state"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      To be verified. We should propagate the sqlState retrieved from the server, not consuming it and clearing the state to the default.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      Returns SQLSTATE 22000 (Data exception, generic class) when inserted string data exceeds the target VARCHAR column size.
    new_driver_behavior: |
      Returns SQLSTATE 22000 verbatim from the server (or HY000 if the server omits sqlState, or 22001 if sf_core recovers it from the numeric error code 100078). The driver forwards the server's SQLSTATE rather than promoting it client-side; the previously planned upgrade to 22001 was dropped to keep error classification on the server side and avoid locale-fragile message-text heuristics.

  41:
    name: "DATE to SQL_C_CHAR/WCHAR undersized buffer returns SQL_ERROR with SQLSTATE 22003 instead of SQLSTATE 07006"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      Fixes the sqlState that the driver reports to be on par with the ODBC spec. This change should not impact the customer's application, as it is just changing the state to a more related one.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When SQLGetData is called with SQL_C_CHAR or SQL_C_WCHAR on a DATE column and the buffer is too small to hold the full "YYYY-MM-DD" string (< 11 bytes for CHAR, < 22 bytes for WCHAR), the driver returns SQL_ERROR with SQLSTATE 07006 (Restricted data type attribute violation).
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 22003 (Numeric value out of range) per the ODBC specification, which states that for SQL_TYPE_DATE to SQL_C_CHAR the character data length must be >= 11.

  42:
    name: "TIME to SQL_C_TYPE_TIMESTAMP report fractional truncation with SQL_SUCCESS_WITH_INFO (01S07) instead of SQL_SUCCESS (01S07)"
    status: fixed
    type: bug
    reviewed: true
    status_rationale: |
      Zeroing the fraction and reporting 01S07 on this conversion was a bug — SQL_TIMESTAMP_STRUCT has a fraction field, so the sub-second value is not actually truncated. Fixed so the driver preserves the fraction and returns SQL_SUCCESS.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When TIME with fractional seconds (e.g. '14:30:45.123') is converted to SQL_C_TYPE_TIMESTAMP, the old driver returns SQL_SUCCESS and places the fractional seconds into the timestamp fraction field. It does not report SQLSTATE 01S07 (Fractional truncation).
    new_driver_behavior: |
      Per the ODBC specification, when SQL_TYPE_TIME is converted to SQL_C_TYPE_TIMESTAMP the fraction field is set to zero. If the original TIME value had fractional seconds, SQL_SUCCESS_WITH_INFO is returned with SQLSTATE 01S07 (Fractional truncation).
    description: |
      Spec reference: "Converting Data from SQL to C Data Types" — SQL_TIME to SQL_C_TYPE_TIMESTAMP: "The timestamp fraction field is set to zero."

  43:
    name: "TIME to SQL_C_BINARY conversion is now supported"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Adds a new conversion that should be allowed as per ODBC API spec.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      Returns SQL_ERROR SQLSTATE 07006 (unsupported conversion) when the buffer is at least sizeof(SQL_TIME_STRUCT). Returns SQL_ERROR 22003 for an undersized buffer (buffer size check precedes conversion support check). This behavior is uniform across Linux, macOS, and Windows — the released driver returns SQL_ERROR on the macOS unixODBC and iODBC reference cells as well.
    new_driver_behavior: |
      Returns SQL_SUCCESS with a 6-byte SQL_TIME_STRUCT containing the hour, minute, and second fields. The indicator is set to sizeof(SQL_TIME_STRUCT). Per the ODBC specification, SQL_C_BINARY is a valid target type for SQL_TYPE_TIME — the data is transferred as-is when the byte length fits the buffer, or SQLSTATE 22003 is returned when the buffer is too small.

  44:
    #TODO: Add test that shows the old driver and new driver difference
    name: "DATE to SQL_C_BINARY with undersized buffer returns SQL_ERROR (22003) instead of SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      The old driver did not inform the consumer that the truncation happened silently and returned the malformed data.
    is_breaking_change: true
    impact: medium
    old_driver_behavior: |
      When SQLGetData is called with SQL_C_BINARY on a DATE column and the buffer is smaller than sizeof(SQL_DATE_STRUCT), the driver does not return SQL_ERROR with SQLSTATE 22003.
    new_driver_behavior: |
      Returns SQL_ERROR with SQLSTATE 22003 (Numeric value out of range) per the ODBC specification, which states that when the byte length of the data exceeds BufferLength for SQL_C_BINARY, the result is undefined and SQLSTATE 22003 must be returned.

  45:
    #TODO: Make sure that old driver really exports it, as the ODBC Manager may intercept it and translate into SQLCancel internally.
    name: "SQLGetFunctions does report SQLCancelHandle as supported"
    status: unknown
    type: enhancement
    reviewed: true
    is_breaking_change: true
    status_rationale: |
      To be verified
    impact: medium
    old_driver_behavior: |
      SQLGetFunctions returns SQL_FALSE for SQL_API_SQLCANCELHANDLE even though the driver exports and handles the function. The internal supported-functions bitmap does not include the ODBC 3.8 SQLCancelHandle entry, so the function works at runtime but the SQLGetFunctions report is missing.
    new_driver_behavior: |
      Will report SQL_API_SQLCANCELHANDLE as supported once SQLGetFunctions is implemented.
    description: |
      Applications that probe SQLGetFunctions before calling SQLCancelHandle will incorrectly believe the old driver does not support it. The function works regardless of what SQLGetFunctions reports.
  46:
    name: "SQL_C_BINARY as SQLBindParameter source for SQL_DECIMAL/NUMERIC/TIME/TIMESTAMP is supported when buffer length equals the SQL data length"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      Allows the binding of the C into a SQL struct which broadens the conversion matrix.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When SQLBindParameter is called with InputOutputType=SQL_PARAM_INPUT and ValueType=SQL_C_BINARY against a parameter whose ParameterType is SQL_DECIMAL, SQL_NUMERIC, SQL_TYPE_TIME, or SQL_TYPE_TIMESTAMP, the driver rejects the bind with SQLSTATE 22003 even when the buffer length exactly matches the required struct size.
    new_driver_behavior: |
      Per the MS ODBC specification ("C to SQL: Binary" appendix) the driver checks that BufferLength equals the SQL data length (sizeof(SQL_NUMERIC_STRUCT) = 19 for DECIMAL/NUMERIC, sizeof(SQL_TIME_STRUCT) = 6 for TIME, sizeof(SQL_TIMESTAMP_STRUCT) = 16 for TIMESTAMP) and forwards the raw bytes to the server. Buffers of any other length are rejected with SQLSTATE 22003, matching the spec's "Byte length of data <> SQL data length -> 22003" rule.
    description: |
      Applications that bind a typed C struct as SQL_C_BINARY now have a portable way to insert these SQL types without separate SQL_C_NUMERIC / SQL_C_TYPE_TIMESTAMP / etc. bindings. See SNOW-3031774 (PR #833 for the Rust implementation, PR #834 for E2E coverage).
  47:
    name: "Cross-thread SQLCancel/SQLCancelHandle always returns SQL_SUCCESS"
    status: allowed
    type: bugfix
    reviewed: true
    status_rationale: |
      This is an implementation bug in the old driver due to missing try/catch in the cancel implementation.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      When SQLCancel or SQLCancelHandle is called from a different thread to cancel an in-progress SQLExecDirect, the cancel function intermittently returns SQL_ERROR with SQLSTATE HY008 (NativeError 604, "SQL execution canceled") instead of SQL_SUCCESS. This happens because the driver's internal CancelExecute() calls Statement::cancel() without a try-catch. When the server's abort-request endpoint responds with a non-success status (e.g. the query was already canceled before the REST abort completed), cancel() throws and the exception propagates to the caller.

      The diagnostic record posted alongside that SQL_ERROR is also unreliable. The exception path may unwind without populating the diag list, and the in-flight SQLExecDirect on the executor thread concurrently clears the per-statement diag list at entry and posts its own HY008 at exit. A snapshot of the diag list taken on the canceling thread immediately after the cancel returns may therefore be empty, contain a single HY008 from the executor's completed SQLExecDirect, or contain a single HY008 posted by the cancel itself, depending on thread scheduling.
    new_driver_behavior: |
      Cross-thread SQLCancel and SQLCancelHandle always return SQL_SUCCESS per the ODBC specification. The cancel function posts no diagnostics of its own; only the canceled function (SQLExecDirect) returns SQL_ERROR with HY008.
    description: |
      Spec reference: https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlcancel-function — "When SQLCancel is successfully called to cancel a function running in another thread, the driver does not post SQL_ERROR with SQLSTATE HY008."
      Applications that check the return code of SQLCancel/SQLCancelHandle in multi-threaded scenarios may see intermittent SQL_ERROR on the old driver. The cancellation itself still takes effect (the executing function returns HY008), so the functional impact is limited to the cancel call's return code.

  48:
    name: "SQL_C_CHAR/WCHAR non-finite string literals rejected client-side with 22018"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      This is a bug in the new driver, even though old driver deviates from the ODBC spec.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      When SQLBindParameter is called with ValueType=SQL_C_CHAR or SQL_C_WCHAR and the string value is "Infinity", "-Infinity", or "NaN" bound against a SQL_REAL / SQL_DOUBLE / SQL_FLOAT parameter, the driver forwards the string to the server and stores a non-finite FLOAT value.
    new_driver_behavior: |
      Rejects the bind at SQLExecute time with SQL_ERROR and SQLSTATE 22018 (Invalid character value for cast specification). The MS ODBC specification (Appendix C, "numeric-literal" grammar) restricts character inputs bound to numeric SQL types to the ANSI SQL numeric literal syntax, which does not include the tokens "Infinity", "-Infinity", or "NaN".
    description: |
      Applications that need to insert non-finite IEEE-754 values should bind SQL_C_FLOAT or SQL_C_DOUBLE (both spec-permitted and supported) rather than passing a string representation.
  49:
    name: "SQL_C_CHAR/WCHAR to SQL_BINARY hex-decodes the ASCII literal instead of forwarding raw string bytes"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      This is a big difference from the ODBC spec, but as the old driver treated the chars as a separate bytes, we may need to introduce a flag for that change.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      When SQLBindParameter is called with ValueType=SQL_C_CHAR or SQL_C_WCHAR and a hex literal (e.g. "DEADBEEF") bound against a SQL_BINARY/SQL_VARBINARY/SQL_LONGVARBINARY parameter, the driver hex-encodes the raw string bytes and forwards them to the server. The 8-character literal "DEADBEEF" therefore lands as 8 bytes (0x44 0x45 0x41 0x44 0x42 0x45 0x45 0x46 — the ASCII representation) rather than the intended 4 bytes (0xDE 0xAD 0xBE 0xEF). Round-tripping the column back as SQL_C_BINARY returns the ASCII bytes, not the bytes the application intended.
    new_driver_behavior: |
      Per the MS ODBC specification ("C to SQL: Binary" appendix), character inputs bound against SQL_BINARY are interpreted as ASCII hex literals: each pair of characters decodes into one byte before being forwarded to Snowflake. "DEADBEEF" lands as the intended 4 bytes. SQL_C_WCHAR follows the same rule after UTF-16 → ASCII transcoding. Odd-length or non-hex inputs surface at SQLExecute time with SQL_ERROR and SQLSTATE 22018 (Invalid character value for cast specification).
    description: |
      Spec reference: ODBC "C to SQL: Binary" conversion table lists SQL_C_CHAR / SQL_C_WCHAR as legal source types for SQL_BINARY targets and prescribes hex-literal semantics. https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types
      Applications that bind hex literals as SQL_C_CHAR/SQL_C_WCHAR to BINARY columns now store the intended bytes rather than the ASCII representation of those bytes. Applications that previously relied on the old broken behavior must re-encode their inputs (e.g. bind "44454144" instead of "DEAD" to land 0x44 0x45 0x41 0x44 in the column).

  50:
    name: "SQLDescribeParam normalises Snowflake vendor TIMESTAMP codes (2000/2001/2002) to SQL_TYPE_TIMESTAMP (93)"
    status: todo
    type: bug
    reviewed: true
    status_rationale: |
      The old driver behavior is better to consume by the customer and explicitly states the requested ParameterType instead of hiding it behind the default implementation which may cause confusion.
    is_breaking_change: true
    impact: high
    old_driver_behavior: |
      When SQLBindParameter is called with ParameterType set to one of the Snowflake vendor TIMESTAMP codes (SQL_SF_TIMESTAMP_LTZ=2000, SQL_SF_TIMESTAMP_TZ=2001, SQL_SF_TIMESTAMP_NTZ=2002), the old driver stores the raw vendor code on the IPD and returns it verbatim from SQLDescribeParam and SQLGetDescField(IPD, SQL_DESC_TYPE).
    new_driver_behavior: |
      The vendor code is normalised to the standard SQL_TYPE_TIMESTAMP (93) on the IPD. SQLDescribeParam and SQLGetDescField(IPD, SQL_DESC_TYPE) return 93 for all three vendor codes; the chosen subtype (NTZ/LTZ/TZ) is remembered internally and used to dispatch the correct Snowflake logical type at SQLExecute time. Applications distinguish the three subtypes via SQLColAttribute(SQL_DESC_TYPE_NAME) on the IRD after execution.
    description: |
      The MS ODBC specification for SQLDescribeParam describes returning standard SQL type codes (1..=12, 91..=95, 101..=113). The vendor codes 2000/2001/2002 are an *input-only* aliasing on SQLBindParameter; leaking them through SQLDescribeParam violates the spec contract.
      Applications that switch on SQLDescribeParam's data type code with cases for 1..=12 / 91..=95 / 101..=113 (the standard ODBC type codes) will no longer fall through to an unknown-type branch when the upstream code happens to bind via the vendor opt-in. Applications that explicitly test for the 2000/2001/2002 vendor codes after SQLBindParameter must update to test SQLColAttribute(SQL_DESC_TYPE_NAME) instead.

  51:
    name: "SQL_SF_TIMESTAMP_TZ accepts SQL_C_TYPE_TIMESTAMP and SQL_C_CHAR-with-offset bindings"
    status: allowed
    type: enhancement
    reviewed: true
    status_rationale: |
      This adds a support for the custom SQL_SF_TIMESTAMP_TZ type. Now, the user does not need to manually handle the conversion to SQL_TYPE_TIMESTAMP, but it is done automatically within the driver.
    is_breaking_change: false
    impact: low
    old_driver_behavior: |
      SQLBindParameter with ParameterType=SQL_SF_TIMESTAMP_TZ (vendor code 2001) rejects both SQL_C_TYPE_TIMESTAMP (naive datetime) and SQL_C_CHAR strings carrying a `+/-HH:MM` offset suffix. Both cases fail at SQLExecute with SQLSTATE HY000 / NativeError 40620 ("Logic error during conversion"). Applications wanting to bind a TIMESTAMP_TZ value have no first-class path through the legacy driver and must fall back to SQL_TYPE_TIMESTAMP (which routes to TIMESTAMP_NTZ) or rely on session TIMEZONE to convert via TIMESTAMP_LTZ.
    new_driver_behavior: |
      Both bindings succeed with spec-aligned semantics. SQL_C_TYPE_TIMESTAMP -> SQL_SF_TIMESTAMP_TZ stores the wall-clock at UTC (offset = 0 on the wire), matching the Python connector's behavior for naive `datetime` values bound to TIMESTAMP_TZ. SQL_C_CHAR (and SQL_C_WCHAR) with a trailing `+/-HH:MM` offset is parsed and emitted in the legacy `<epoch_ns> <offset_minutes_plus_1440>` two-token wire format, so the server stores the exact instant alongside the original offset. The vendor code 2001 sits in the ODBC vendor-specific range, where the driver is free to define behavior; the new semantics are spec-permitted and additive over the legacy 40620 error path.
    description: |
      Migration is forward-compatible: any application that previously caught the legacy 40620 will now find these bindings succeed with predictable, spec-conformant results. Applications that intentionally relied on the failure (e.g. as a feature gate) should switch to validating their bind path explicitly. Round-tripping a non-UTC TIMESTAMP_TZ via SQLBindParameter is now possible without falling through TIMESTAMP_LTZ + session TIMEZONE.
  52:
    name: "TIMESTAMP_TZ -> SQL_C_CHAR/SQL_C_WCHAR fetch renders bare UTC (offset dropped), matching the reference driver"
    status: fixed
