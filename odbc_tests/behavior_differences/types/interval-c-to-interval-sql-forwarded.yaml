name: "SQLBindParameter SQL_C_INTERVAL_* bound to a SQL_INTERVAL_* parameter forwards the leading-field literal instead of being rejected"
status: allowed
type: enhancement
reviewed: true
is_breaking_change: false
impact: low
status_rationale: |
  This is a fix that extends the conversions.
old_driver_behavior: |
  Same-family SQL_C_INTERVAL_* to SQL_INTERVAL_* fails at SQLExecute, and the SQLSTATE depends on the value rather than on the C type and SQL type. The value is checked against the target type with two digits of leading precision and no fractional seconds. It fails with 22015 (interval field overflow, native error 40530) when the value expressed in the target's leading unit exceeds 99 (e.g. 2 days bound as SQL_INTERVAL_MINUTE is 2880 minutes), when it carries a non-zero component finer than the target's last field (e.g. 1 year 6 months bound as SQL_INTERVAL_YEAR), or when it carries a non-zero fractional second. Any other value fails with HY000 (unsupported bind type, native error 18). The sign does not affect the result. A compound value's trailing field is not range-checked or carried into the leading field: 2 years 12 months fails with HY000 as SQL_INTERVAL_YEAR_TO_MONTH and with 22015 as SQL_INTERVAL_YEAR, while 12 months from SQL_C_INTERVAL_MONTH fails with HY000 as SQL_INTERVAL_YEAR. Cross-family binds fail with SQLSTATE 07006. A NULL indicator on SQL_C_INTERVAL_YEAR to SQL_INTERVAL_YEAR fails with HY000.
new_driver_behavior: |
  Per ODBC Appendix D ("Converting Data from C to SQL Data Types", "Converting Interval C Data"), an interval C source is legal for an interval SQL target of the same family — a year-month source (SQL_C_INTERVAL_YEAR / _MONTH) to a year-month target (SQL_INTERVAL_YEAR / _MONTH), and a day-time source (SQL_C_INTERVAL_DAY / _HOUR / _MINUTE / _SECOND) to a day-time target (SQL_INTERVAL_DAY / _HOUR / _MINUTE / _SECOND). The driver forwards the source interval's leading datetime field as the rendered literal (e.g. SQL_C_INTERVAL_YEAR carrying 5 renders "5", SQL_C_INTERVAL_SECOND carrying 45s renders "45.000000"), with the leading sign applied, so the bind succeeds (SQL_SUCCESS) and the literal round-trips through a VARCHAR column verbatim. Trailing fields are not range-checked, so 2 years 12 months renders "2-12". Cross-family binds (year-month source to day-time target or vice versa) are rejected with SQLSTATE 07006.
description: |
  Spec reference: ODBC Appendix D, "Converting Data from C to SQL Data Types" (https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types). The interval C to interval SQL conversion is keyed by the bound SQL_INTERVAL_* parameter type; the rendered literal carries the source interval's leading field and is stored verbatim in a VARCHAR column.
  Applications binding SQL_C_INTERVAL_* values to same-family SQL_INTERVAL_* parameters now succeed on the new driver instead of failing. Cross-family interval binds receive a spec-compliant 07006 rejection.
legacy_id: 71
