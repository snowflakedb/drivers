name: "TIMESTAMP_TZ -> SQL_C_CHAR/SQL_C_WCHAR fetch renders bare UTC (offset dropped), matching the reference driver"
status: fixed
type: bug
reviewed: true
status_rationale: |
  The universal driver intentionally matches the reference ODBC driver on this path: a TIMESTAMP_TZ column fetched into SQL_C_CHAR / SQL_C_WCHAR renders the bare UTC wall-clock with no offset suffix, regardless of TIMESTAMP_TZ_OUTPUT_FORMAT. This keeps the driver a drop-in replacement and does not change the string output for sessions that set the parameter.
is_breaking_change: false
impact: low
old_driver_behavior: |
  SQLGetData / SQLBindCol of a TIMESTAMP_TZ column to SQL_C_CHAR or SQL_C_WCHAR always renders the bare UTC wall-clock string (e.g. `2024-01-15 09:00:45`) regardless of the session's TIMESTAMP_TZ_OUTPUT_FORMAT setting. The token's `TZH:TZM` / `TZHTZM` / `TZH` placeholders are silently dropped.
new_driver_behavior: |
  Identical to the reference driver: a TIMESTAMP_TZ column fetched into SQL_C_CHAR / SQL_C_WCHAR renders the bare UTC wall-clock with no offset suffix (e.g. `2024-01-15 09:00:45`), regardless of TIMESTAMP_TZ_OUTPUT_FORMAT. The session format is still read and cached, but the fetch path never appends an offset.
description: |
  No behavioral difference from the reference driver on this path: default sessions and sessions that set a `TZH` TIMESTAMP_TZ_OUTPUT_FORMAT both see the bare UTC wall-clock. Applications that need the original offset can use the typed SQL_SF_TIMESTAMP_TZ path.
legacy_id: 52
