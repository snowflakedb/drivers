name: "SQLBindParameter numeric C types to SQL_INTERVAL_* follow ODBC Appendix D 'C to SQL: Numeric' semantics"
status: allowed
type: enhancement
reviewed: true
is_breaking_change: true
impact: medium
status_rationale: |
  Aligns the API to ODBC spec.
old_driver_behavior: |
  The reference driver does not implement the ODBC Appendix D "C to SQL: Numeric" rules for binding numeric C types to SQL_INTERVAL_* parameters via SQLBindParameter. It rejects exact-numeric C types (SQL_C_STINYINT .. SQL_C_UBIGINT, SQL_C_NUMERIC) bound to single-field interval targets (SQL_INTERVAL_YEAR/MONTH/DAY/HOUR/MINUTE/SECOND), and SQLBindParameter succeeds for approximate-numeric C types (SQL_C_FLOAT / SQL_C_DOUBLE) bound to single-field interval targets.
new_driver_behavior: |
  Per ODBC Appendix D ("C to SQL: Numeric"), the new driver accepts exact-numeric C types bound to single-field interval targets (the numeric value is the count of the single leading field), and SQLBindParameter returns SQL_ERROR with SQLSTATE 07006 for approximate-numeric C types (SQL_C_FLOAT / SQL_C_DOUBLE) against any interval target. Multi-field/compound interval targets (e.g. SQL_INTERVAL_YEAR_TO_MONTH) reject every numeric source with 07006 on both drivers. SQL_C_BIT is rejected for all interval targets (07006).
description: |
  Spec reference: ODBC "C to SQL: Numeric" conversion table. https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/c-to-sql-numeric
  Applications binding exact-numeric C values to single-field SQL_INTERVAL_* parameters will succeed on the new driver where the reference driver failed. Applications binding SQL_C_FLOAT / SQL_C_DOUBLE to single-field interval parameters will now receive 07006 instead of silent acceptance.
legacy_id: 72
