name: "SQL_SF_TIMESTAMP_TZ accepts SQL_C_TYPE_TIMESTAMP, SQL_C_CHAR-with-offset, and ISO 8601 T-separator bindings"
status: allowed
type: enhancement
reviewed: true
status_rationale: |
  This adds a support for the custom SQL_SF_TIMESTAMP_TZ type. Now, the user does not need to manually handle the conversion to SQL_TYPE_TIMESTAMP, but it is done automatically within the driver.
is_breaking_change: false
impact: low
old_driver_behavior: |
  SQLBindParameter with ParameterType=SQL_SF_TIMESTAMP_TZ (vendor code 2001) rejects both SQL_C_TYPE_TIMESTAMP (naive datetime) and SQL_C_CHAR strings carrying a `+/-HH:MM` offset suffix. Both cases fail at SQLExecute with SQLSTATE HY000 / NativeError 40620 ("Logic error during conversion"). Applications wanting to bind a TIMESTAMP_TZ value have no first-class path through the legacy driver and must fall back to SQL_TYPE_TIMESTAMP (which routes to TIMESTAMP_NTZ) or rely on session TIMEZONE to convert via TIMESTAMP_LTZ.
new_driver_behavior: |
  All binding shapes succeed with spec-aligned semantics. SQL_C_TYPE_TIMESTAMP -> SQL_SF_TIMESTAMP_TZ stores the wall-clock at UTC (offset = 0 on the wire), matching the Python connector's behavior for naive `datetime` values bound to TIMESTAMP_TZ. SQL_C_CHAR (and SQL_C_WCHAR) with a trailing `+/-HH:MM` offset is parsed and emitted in the legacy `<epoch_ns> <offset_minutes_plus_1440>` two-token wire format, so the server stores the exact instant alongside the original offset. Both the space-separated (`YYYY-MM-DD HH:MM:SS[.fff] +/-HH:MM`) and ISO 8601 T-separated (`YYYY-MM-DDTHH:MM:SS[.fff][+/-HH:MM]`) date-time format variants are accepted for SQL_C_CHAR / SQL_C_WCHAR binds. The vendor code 2001 sits in the ODBC vendor-specific range, where the driver is free to define behavior; the new semantics are spec-permitted and additive over the legacy 40620 error path.
description: |
  Migration is forward-compatible: any application that previously caught the legacy 40620 will now find these bindings succeed with predictable, spec-conformant results. Applications that intentionally relied on the failure (e.g. as a feature gate) should switch to validating their bind path explicitly. Round-tripping a non-UTC TIMESTAMP_TZ via SQLBindParameter is now possible without falling through TIMESTAMP_LTZ + session TIMEZONE. T-separator support (SNOW-3990013) was added as a later fix; the initial BD#51 implementation covered space-separated format only.
legacy_id: 51
