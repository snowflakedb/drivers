name: "SQL_C_CHAR/WCHAR bound as a SQL_INTERVAL_* parameter is forwarded to the server instead of being rejected"
status: allowed
type: enhancement
reviewed: true
status_rationale: |
  The old driver rejecting a spec-legal conversion is the bug: ODBC Appendix D lists SQL_C_CHAR / SQL_C_WCHAR as legal source types for every SQL_INTERVAL_* target, so the bind should succeed. The new driver forwards the literal verbatim per the spec.
is_breaking_change: false
impact: low
old_driver_behavior: |
  Binding a character C source (SQL_C_CHAR / SQL_C_WCHAR) with ParameterType set to any SQL_INTERVAL_* type fails at SQLExecute with SQL_ERROR and SQLSTATE HY000 ("Unsupported data type for bind variable", NativeError 18). The legacy driver forwards the ODBC interval type code (101-113) as the Snowflake bind-variable type, which the server does not accept, so there is no path to bind an interval literal through a character C source.
new_driver_behavior: |
  Per ODBC Appendix D ("Converting Data from C to SQL Data Types"), SQL_C_CHAR and SQL_C_WCHAR are legal source types for every SQL_INTERVAL_* target (single-field and compound). The driver treats a character source as always legal and forwards the literal verbatim as the parameter value, so the bind succeeds (SQL_SUCCESS) and the literal round-trips through a VARCHAR column unchanged.
description: |
  Spec reference: ODBC Appendix D conversion table lists SQL_C_CHAR / SQL_C_WCHAR as legal source types for all SQL_INTERVAL_* targets. https://learn.microsoft.com/en-us/sql/odbc/reference/appendixes/converting-data-from-c-to-sql-data-types
  Applications binding interval literals as SQL_C_CHAR/SQL_C_WCHAR to SQL_INTERVAL_* parameters now succeed on the new driver instead of receiving an HY000 bind-variable error.
legacy_id: 73
