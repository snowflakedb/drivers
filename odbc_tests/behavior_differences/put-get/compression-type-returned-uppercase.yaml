name: "Compression type is now returned in uppercase"
status: fixed
type: bug
reviewed: true
status_rationale: |
  4.x emits lowercase compression tokens in the PUT result, matching 3.x.
is_breaking_change: true
impact: high
old_driver_behavior: |
  3.x returns the compression type in lowercase.
new_driver_behavior: |
  The PUT result source_compression and target_compression columns
  return lowercase tokens (gzip, none, deflate, and the other
  supported types).
description: |
  Regression fixed. Applications that inspect the PUT compression columns
  again see lowercase tokens, matching 3.x. GET has no
  compression columns.
legacy_id: 2
