name: "PUT AUTO_COMPRESS gzip tempfiles use the process temp directory when PUT_TEMPDIR is unset"
status: allowed
type: enhancement
reviewed: true
is_breaking_change: false
impact: low
status_rationale: |
  Unset PUT_TEMPDIR using the process temp directory is the 4.x tempfile
  contract. PUT still succeeds; only the gzip staging directory changes when
  the caller does not set PUT_TEMPDIR.
old_driver_behavior: |
  When `PUT_TEMPDIR` is unset, PUT AUTO_COMPRESS writes gzip tempfiles under
  `/tmp/snowflakeTmp_<user>`. During compression the old driver stages in an
  ephemeral UUID subdirectory of that base path and removes the subdirectory
  after PUT succeeds.
new_driver_behavior: |
  When `PUT_TEMPDIR` is unset, PUT AUTO_COMPRESS writes gzip tempfiles under
  the process temp directory. Nested directories in a configured
  `PUT_TEMPDIR` are created; empty `PUT_TEMPDIR` uses the same process temp
  directory as unset.
legacy_id: 152
