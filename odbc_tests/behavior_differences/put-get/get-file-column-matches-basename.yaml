name: "GET result 'file' value now matches the old driver's basename"
status: fixed
type: bugfix
reviewed: false
is_breaking_change: false
impact: low
old_driver_behavior: |
  The `file` column of a GET result reports the local file's basename — the source key
  reduced to its final path segment.
new_driver_behavior: |
  The `file` column of a GET result reports the local file's basename, matching the old
  driver.
description: |
  The new driver previously reported the full, un-stripped source key (including any
  stage subdirectory prefix) in this column instead of the basename it already used for
  the local file name written to disk. This entry documents that the gap is closed.
legacy_id: 164
