name: "Catalog REMARKS / COLUMN_DEF return SQL_NULL_DATA when absent (not empty string)"
status: allowed
type: bugfix
reviewed: true
is_breaking_change: true
impact: medium
status_rationale: |
  ODBC documents COLUMN_DEF as NULL when no default was specified, and REMARKS
  is a nullable description column on SQLColumns, SQLTables, and SQLProcedures.
  Returning SQL_NULL_DATA for an absent comment or default is spec alignment;
  3.x's empty string (and always-empty SQLColumns COLUMN_DEF) is the
  non-compliant side. Callers that treat "" and NULL as different must migrate,
  but the new contract is the documented one. Do not realign to "".
old_driver_behavior: |
  SQLColumns REMARKS is a (possibly empty) WVARCHAR; COLUMN_DEF is always "".
  SQLTables REMARKS is a (possibly empty) WVARCHAR from SHOW OBJECTS/TABLES/VIEWS
  comment — never SQL_NULL_DATA (null comment cells become "").
  SQLProcedures REMARKS maps a null comment to "".
new_driver_behavior: |
  When the value is absent, SQLGetData returns SQL_NULL_DATA for:
  - SQLColumns REMARKS and COLUMN_DEF
  - SQLTables REMARKS
  - SQLProcedures REMARKS
  When a real comment is present, SQLTables REMARKS returns that string
  (plumbed from SHOW OBJECTS.comment). SQLProcedureColumns already returned
  NULL on both drivers.
description: |
  ODBC documents COLUMN_DEF as NULL when no default was specified. Returning
  SQL_NULL_DATA for absent REMARKS / COLUMN_DEF is consistent across
  SQLColumns, SQLTables, and SQLProcedures. 3.x typically
  returns an empty string (and always "" for SQLColumns COLUMN_DEF).
legacy_id: 121
