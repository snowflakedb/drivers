name: "SQLColumns COLUMN_SIZE for FLOAT/DOUBLE/REAL is 15 decimal digits instead of 38"
status: allowed
type: bugfix
reviewed: true
is_breaking_change: false
impact: low
status_rationale: |
  The ODBC column-size definition for SQL_DOUBLE / SQL_FLOAT is 15 significant
  decimal digits. Reporting 15 (with catalog NUM_PREC_RADIX 10) is spec
  alignment; 3.x's 38 is Snowflake's maximum NUMBER precision used
  as a placeholder. Query-result SQLColAttribute NUM_PREC_RADIX for DOUBLE
  stays binary 2, so fetch-path metadata is unchanged. Keep allowed; do not
  realign catalog COLUMN_SIZE to 38.
old_driver_behavior: |
  SQLColumns reports COLUMN_SIZE 38 for FLOAT, DOUBLE, and REAL catalog rows,
  using Snowflake's maximum NUMBER precision as a placeholder.
new_driver_behavior: |
  SQLColumns reports COLUMN_SIZE 15 for FLOAT, DOUBLE, and REAL catalog rows,
  matching the number of significant decimal digits for double precision.
description: |
  The ODBC column-size definition for SQL_DOUBLE / SQL_FLOAT is 15 significant
  decimal digits. This also keeps SQLColumns COLUMN_SIZE consistent with its
  decimal NUM_PREC_RADIX value of 10. The paired NEW_DRIVER_ONLY / OLD_DRIVER_ONLY
  assertions are in odbc-api/catalog/columns_tests.cpp.
legacy_id: 123
