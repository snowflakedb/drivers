name: "SQLBrowseConnect short-circuits with SQL_ERROR under iODBC instead of returning SQL_NEED_DATA for the iterative protocol"
status: fixed
type: bug
reviewed: true
status_rationale: |
  4.x now returns SQL_NEED_DATA for a browse string that names no
  account/host/server, reports a nonzero output length, and leaves the
  output buffer unchanged, matching 3.x under iODBC. The return does not
  depend on the driver manager. Under unixODBC the observable is still
  SQL_ERROR because that DM rejects an unregistered DRIVER= path with
  IM002 before the driver is loaded, as it does for 3.x.
is_breaking_change: true
impact: high
old_driver_behavior: |
  Under iODBC, SQLBrowseConnect("DRIVER={Snowflake}") returns
  SQL_NEED_DATA and reports a nonzero output length, while leaving the
  supplied output buffer unchanged. Under unixODBC 3.x short-circuits with
  SQL_ERROR like 4.x.
new_driver_behavior: |
  Under iODBC, SQLBrowseConnect("DRIVER={Snowflake}") returns
  SQL_NEED_DATA and reports a nonzero output length, while leaving the
  supplied output buffer unchanged. Under unixODBC the DM rejects the
  call with IM002 before reaching the driver, so SQL_ERROR still surfaces
  as it does for 3.x.
description: |
  Regression fixed. iODBC applications that start SQLBrowseConnect with
  only DRIVER= receive SQL_NEED_DATA and can continue the iterative
  protocol, matching 3.x. unixODBC behavior is unchanged (SQL_ERROR from
  the driver manager).
legacy_id: 63
