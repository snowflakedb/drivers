name: "SQLNumResultCols returns column count after async execute + cursor close"
status: allowed
type: bugfix
reviewed: true
is_breaking_change: false
impact: medium
status_rationale: |
  This is an improvement compared to the old driver, as it follows the ODBC spec.
old_driver_behavior: |
  After async SQLPrepare + async SQLExecute + SQLCloseCursor, SQLNumResultCols returns 0. The old driver loses the prepared state metadata after async execution completes and the cursor is closed.
new_driver_behavior: |
  After async SQLPrepare + async SQLExecute + SQLCloseCursor, SQLNumResultCols returns the column count from the prepare phase. The statement correctly transitions back to Prepared state (S3) per the ODBC spec state transition table.
description: |
  Applications that call SQLNumResultCols after closing a cursor on a prepared statement will get the correct column count on the new driver. This matches the ODBC spec: SQLCloseCursor from S5 should return to S3 (Prepared).
legacy_id: 58
