name: "RetryOn403 is not recognized; 403 retry is opt-in via retry_extra_status_codes"
status: allowed
type: api_incompatibility
reviewed: true
is_breaking_change: true
impact: low
status_rationale: |
  This was a legacy, one-time fix which should've been removed long time ago.
old_driver_behavior: |
  RetryOn403=true retries HTTP 403 responses. The default is not to retry 403.
new_driver_behavior: |
  RetryOn403 is not recognized. SQLDriverConnect posts SQLSTATE 01S00 and 403 is
  not retried. The default retry set is 408, 429, 307, 308, and 5xx. Setting
  retry_extra_status_codes=403 retries 403.
description: |
  RetryOn403 is a boolean switch; retry_extra_status_codes is a comma-separated
  list. A 1:1 alias cannot compose when both are set. The old default already
  left 403 unretriable, so DSNs that omit the key see the same 403 behavior.
legacy_id: 150
