name: "MAX_CON_RETRY_ATTEMPTS login-only retry cap is not recognized"
status: allowed
type: api_incompatibility
reviewed: true
is_breaking_change: true
impact: low
status_rationale: |
  retry_max_attempts already accepts values below 7, which is why 3.x needed
  a separate login-only cap. A login-only alias would still leave query and
  logout on a different budget; 01S00 on the unused key is the accepted 4.x
  surface.
old_driver_behavior: |
  MAX_CON_RETRY_ATTEMPTS caps login retries only. When both it and MaxHttpRetries
  are set, login uses the smaller of the two; query retries stay on MaxHttpRetries.
new_driver_behavior: |
  MAX_CON_RETRY_ATTEMPTS is not recognized. SQLDriverConnect posts SQLSTATE 01S00
  and the value does not cap login retries. Login, query, and logout share
  retry_max_attempts.
description: |
  The old key exists because MaxHttpRetries cannot go below 7. retry_max_attempts
  already accepts values below 7, but applying it also caps query and logout
  retries. There is no login-only equivalent.
legacy_id: 149
