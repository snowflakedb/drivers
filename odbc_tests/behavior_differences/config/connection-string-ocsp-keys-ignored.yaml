name: "Connection-string OCSP keys are ignored and warn as deprecated"
status: allowed
type: api_incompatibility
reviewed: true
is_breaking_change: false
impact: low
status_rationale: |
  The 4.x driver has no OCSP path (BD#124). Keeping `DisableOCSPCheck` and
  `OCSP_FAIL_OPEN` recognized avoids 01S00 on leftover DSNs; the 01000
  warning matches leftover logging keys (BD#154) so callers move to
  `CRL_MODE`.
old_driver_behavior: |
  `DisableOCSPCheck` and `OCSP_FAIL_OPEN` in a DSN or connection string
  control OCSP certificate revocation. Connect succeeds without a
  deprecation diagnostic.
new_driver_behavior: |
  Those keys are accepted and ignored. Connect posts SQLSTATE 01000
  ("Parameter 'DISABLEOCSPCHECK' is deprecated and has no effect. Set
  CRL_MODE=DISABLED to skip revocation checks.") and returns
  `SQL_SUCCESS_WITH_INFO`. `OCSP_FAIL_OPEN` points at `CRL_MODE=ADVISORY`
  (fail-open) or `CRL_MODE=ENABLED` (fail-close).
description: |
  Leftover OCSP connection-string keys cannot drive CRL revocation.
  They stay recognized so they do not draw 01S00, and they warn so
  callers migrate to `CRL_MODE`.
legacy_id: 156
