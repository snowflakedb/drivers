[tox]
requires = tox-uv>=1.8
env_list =
  lint, type,
  py{39,310,311,312,313}-unit,
  py{39,310,311,312,313}-all-universal,
  py{39,310,311,312,313}-integ-universal,
  py{39,310,311,312,313}-integ-reference

[testenv]
passenv = *
deps = .[dev]
commands = uv run pytest tests -q {posargs}

[testenv:lint]
commands = uv run ruff check .

[testenv:type]
commands = uv run mypy pep249_dbapi

[testenv:py{39,310,311,312,313}-unit]
commands = uv run pytest tests/unit

[testenv:py{39,310,311,312,313}-all-universal]
# Run all tests (unit + integration) for universal driver
commands = uv run pytest tests/ --connector=universal {posargs}

[testenv:py{39,310,311,312,313}-integ-universal]
commands = uv run pytest tests/integ --connector=universal {posargs}

[testenv:py{39,310,311,312,313}-integ-reference]
# Don't install our local package - only install test dependencies and reference connector
skip_install = true
deps =
    pytest>=8
    pytest-xdist
    pytest-json-report
    pytest-metadata
    # Install reference connector INSIDE the tox env (isolated), using uv (via tox-uv)
    snowflake-connector-python=={env:REFERENCE_DRIVER_VERSION:3.17.2}
commands =
  uv run pytest tests/integ --connector=reference {posargs}