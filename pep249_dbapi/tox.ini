[tox]
requires = tox-uv>=1.8
env_list =
  lint, type,
  py{39,310,311,312,313}-unit,
  py{39,310,311,312,313}-integ-universal,
  py{39,310,311,312,313}-integ-reference

[testenv]
passenv = *
deps = .[dev]
commands = uv run pytest tests -q {posargs}

[testenv:lint]
commands = uv run ruff check .

[testenv:type]
commands = uv run mypy pep249_dbapi

[testenv:py{39,310,311,312,313}-unit]
commands = uv run pytest tests/unit -n auto --maxfail=1

[testenv:py{39,310,311,312,313}-integ-universal]
commands = uv run pytest tests/integ -n auto --maxfail=1 --connector=universal {posargs}

[testenv:py{39,310,311,312,313}-integ-reference]
# Install reference connector INSIDE the tox env (isolated), using uv (via tox-uv)
commands =
  uv pip install "snowflake-connector-python=={env:REF_VERSION:3.10.1}"
  uv run pytest tests/integ -n auto --connector=reference {posargs}