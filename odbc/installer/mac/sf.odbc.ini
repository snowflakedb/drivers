# Default Snowflake ODBC UD configuration shipped with the macOS .pkg.
#
# This file is consulted as the LAST fallback in the sf.odbc.ini lookup
# chain — only when the user has not set `SF_ODBC_INI` and has no per-user
# config under `~/Library/Application Support/snowflake/sf.odbc.ini` or
# `~/.snowflake/sf.odbc.ini`. See `odbc/src/api/ini_paths.rs`.
#
# DriverManagerEncoding=UTF-32 makes the driver match macOS's iODBC, which
# is the only DM the OS ships out of the box and which uses 4-byte SQLWCHARs
# (== `wchar_t`). Without this entry the driver would default to UTF-16 and
# silently mis-decode every wide-string call coming from iODBC.
#
# Users on macOS who run against unixODBC (UTF-16 SQLWCHARs) MUST override
# this - either by setting `SF_ODBC_INI=/path/to/their/sf.odbc.ini` with
# `DriverManagerEncoding=UTF-16`, or by dropping a per-user config under
# `~/Library/Application Support/snowflake/sf.odbc.ini` with the same.

DriverManagerEncoding=UTF-32
