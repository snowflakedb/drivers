# Default Snowflake ODBC UD configuration shipped with the macOS .pkg.
#
# This file is consulted as the LAST fallback in the sf.odbc.ini lookup
# chain — only when the user has not set `SF_ODBC_INI` and has no per-user
# config under `~/Library/Application Support/snowflake/sf.odbc.ini` or
# `~/.snowflake/sf.odbc.ini`. See `odbc/src/api/ini_paths.rs`.
#
# DriverManagerEncoding selects the byte width of the driver manager's
# SQLWCHAR: UTF-16 = 2 bytes (unixODBC), UTF-32 = 4 bytes (iODBC, == wchar_t).
# The value MUST match the DM actually loaded into the process, or every
# wide-string call is mis-sized.
#
# We ship UTF-16 because a mismatch in this direction fails *safely*: writing
# 2-byte units into a DM that expects 4-byte slots under-fills the buffer
# (mis-decoded text — wrong, but recoverable). The opposite default (UTF-32)
# fails *catastrophically* against unixODBC: 4-byte writes overrun the DM's
# 2-byte-per-slot buffer by 2x and abort the whole process inside
# `extract_diag_error_w` on the first error diagnostic (SNOW-3741307).
# unixODBC is commonly installed (e.g. via Homebrew), so a UTF-16 default
# protects the majority and, crucially, never corrupts memory.
#
# iODBC users (macOS's built-in DM, 4-byte SQLWCHAR) MUST override this to
# UTF-32 for correct wide-string decoding — either by setting
# `SF_ODBC_INI=/path/to/their/sf.odbc.ini` with `DriverManagerEncoding=UTF-32`,
# or by dropping a per-user config under
# `~/Library/Application Support/snowflake/sf.odbc.ini` (or `~/.snowflake/`)
# with the same.

DriverManagerEncoding=UTF-16
