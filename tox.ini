[pytest]
addopts = -q
testpaths = tests
markers =
  reference: candidate to run in comparison (use on curated tests if you want a small PR set)
  skip_reference(reason: str = ''): skip when --connector=reference
  skip_universal(reason: str = ''): skip when --connector=universal
  skip_old_driver_until(version: str = None, date: str = None, reason: str = ''): reserved for future

[tox]
requires = tox-uv>=1.8
env_list =
  lint, type,
  py{39,310,311,312,313}-unit,
  py{39,310,311,312,313}-all-universal,
  py{39,310,311,312,313}-integ-reference

[testenv]
passenv = *
deps = 
  ./pep249_dbapi[dev]
  pytest-xdist
  pytest-json-report
commands = pytest -q {posargs}

[testenv:py{39,310,311,312,313}-all-universal]
description = Run unit + integration tests with universal connector
commands = 
  pytest pep249_dbapi/tests/unit pep249_dbapi/tests/integ --connector=universal -n auto --maxfail=1 {posargs}

[testenv:py{39,310,311,312,313}-unit]
description = Run only unit tests (fast, no database required)
commands =
  pytest pep249_dbapi/tests/unit -n auto --maxfail=1 {posargs}

[testenv:py{39,310,311,312,313}-integ-reference]
description = Run only integration tests with reference connector (for comparison)
deps = 
  {[testenv]deps}
  snowflake-connector-python=={env:REF_VERSION:3.10.1}
commands =
  pytest pep249_dbapi/tests/integ --connector=reference -n auto --maxfail=1 {posargs}
