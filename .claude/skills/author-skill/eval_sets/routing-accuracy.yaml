# Routing-accuracy eval set for: author-skill
#
# should_trigger: prompts that SHOULD activate this skill
# should_not_trigger: prompts that should NOT activate this skill

should_trigger:
  - prompt: "I want to create a new skill for drafting release notes from a PR diff"
    notes: "Direct CREATE request — canonical trigger phrase 'create a skill'"
  - prompt: "write a skill that wraps our oncall runbook so claude can guide me through it"
    notes: "Direct CREATE via 'write a skill' trigger phrase"
  - prompt: "new skill for automated code review — should activate when someone asks me to review a PR"
    notes: "Direct CREATE, 'new skill' trigger phrase with context"
  - prompt: "can you build me a skill that helps write SQL migration scripts?"
    notes: "CREATE request phrased as a question; indirect but clear intent to author a new skill"
  - prompt: "I have this 10-step deploy process I keep re-explaining to claude — can we make it into something reusable?"
    notes: "Indirect CREATE — user describes a workflow they want to package; should infer skill authoring"
  - prompt: "I want to package up our incident triage workflow as a slash command"
    notes: "Indirect CREATE — 'slash command' is how non-technical users refer to skills"
  - prompt: "my write-tests skill doesn't fire when I say 'add coverage' — can you fix it?"
    notes: "MODIFY / trigger gap scenario — exact trigger phrase 'my skill isn't triggering' / 'fix this skill'"
  - prompt: "this skill keeps activating on everything even when users ask general coding questions, way too broad"
    notes: "MODIFY / false positive symptom — fixing a skill's over-triggering behavior"
  - prompt: "new skill plz, wrapping the sf build command"
    notes: "Abbreviated shorthand CREATE — terse, informal; 'new skill' trigger phrase"
  - prompt: "skill broken wont trigger"
    notes: "Extremely terse MODIFY report — should still route despite missing context"
  - prompt: "add the ability to handle p0 alerts to my oncall-triage skill"
    notes: "MODIFY — exact trigger phrase 'add a capability to my skill'; existing skill, new behavior"
  - prompt: "make the merge-pr skill command-only so it stops auto-triggering on PR questions"
    notes: "CONFIGURE — exact trigger phrase 'make this command-only'; frontmatter change"
  - prompt: "the description on my deploy skill is totally wrong — people say 'ship it' but it never activates"
    notes: "Borderline MODIFY — describes a trigger gap symptom without saying 'fix this skill' explicitly"

should_not_trigger:
  - prompt: "generate the eval set for my new deploy skill"
    notes: ""
    reason: "generate-eval-set — explicitly out of scope for author-skill; eval authoring is a separate skill"
  - prompt: "run the routing accuracy evals on all my skills and show me which ones are failing"
    reason: "run-skill-evals — executing evals is out of scope; shares skill-system vocabulary but different action"
  - prompt: "can you audit my SKILL.md frontmatter across the whole repo for issues?"
    reason: "configure-skill-settings — auditing frontmatter across a repo subtree is that skill's job, not individual skill authoring"
  - prompt: "set up the sf ai skills infrastructure with precommit hooks and CI steps in this repo"
    reason: "bootstrap-skills-evals — repo-level infrastructure setup is explicitly out of scope for author-skill"
  - prompt: "migrate our .ai/commands directory over to the new skills format"
    reason: "migrate-repo-to-skills — bulk migration of legacy commands is a different skill entirely"
  - prompt: "how do I author a good prompt for claude? what makes a prompt effective?"
    reason: "general conversation — 'author' keyword appears but the question is about prompt engineering, not skill files"
  - prompt: "write the eval prompts for my new author-skill so I can test if it routes correctly"
    reason: "generate-eval-set — user wants eval prompts written; author-skill explicitly does not do this work"
  - prompt: "can you explain what disable-model-invocation does and when I should use it?"
    reason: "general conversation — asking for conceptual explanation of a flag, not asking to configure a skill"
